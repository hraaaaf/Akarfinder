name: P1B.5 Canonical Geo Normalization Recovery Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20260809162000_p1b5_canonical_geo_normalization_recovery.sql"
      - "scripts/scrapers/__tests__/p1b5-canonical-geo-normalization-recovery.test.ts"
      - "scripts/scrapers/__tests__/p1b5-canonical-geo-normalization-recovery.pg.test.ts"
      - ".github/workflows/p1b5-canonical-geo-normalization-recovery.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20260809162000_p1b5_canonical_geo_normalization_recovery.sql"
      - "scripts/scrapers/__tests__/p1b5-canonical-geo-normalization-recovery.test.ts"
      - "scripts/scrapers/__tests__/p1b5-canonical-geo-normalization-recovery.pg.test.ts"
      - ".github/workflows/p1b5-canonical-geo-normalization-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Certify canonical geo normalization recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: P1B.5 truth contract
        run: npx tsx --test scripts/scrapers/__tests__/p1b5-canonical-geo-normalization-recovery.test.ts
      - name: P1B.5 PostgreSQL semantic contract
        run: npx tsx --test scripts/scrapers/__tests__/p1b5-canonical-geo-normalization-recovery.pg.test.ts
      - name: P1B.4 regression contract
        run: npx tsx --test scripts/scrapers/__tests__/p1b4-geo-coverage-recovery.test.ts
      - name: P1B.4 PostgreSQL semantic regression
        run: npx tsx --test scripts/scrapers/__tests__/p1b4-geo-coverage-recovery.pg.test.ts
      - name: P1B.3 regression contract
        run: npx tsx --test scripts/scrapers/__tests__/p1b3-territorial-metric-join.test.ts
      - name: P1B.3 PostgreSQL semantic regression
        run: npx tsx --test scripts/scrapers/__tests__/p1b3-territorial-metric-join.pg.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
