name: Recovery V4.11 Mubawab Verification Pilot

on:
  push:
    branches: ["recovery/v4-11-pre-db-verification-20260927"]
    paths:
      - "data/recovery/activate-v4-11-mubawab-verification-pilot.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Download certified unresolved queue
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/queue"
          gh api repos/${{ github.repository }}/actions/artifacts/10927785295/zip > "$RUNNER_TEMP/queue.zip"
          unzip -q -o "$RUNNER_TEMP/queue.zip" -d "$RUNNER_TEMP/queue"
          test -s "$RUNNER_TEMP/queue/unresolved/mubawab.ma.txt"
          test "$(wc -l < "$RUNNER_TEMP/queue/unresolved/mubawab.ma.txt")" = "81975"

      - name: Verify first 500 Mubawab URLs read-only
        env:
          DEEP_DOMAIN: mubawab.ma
          DEEP_URL_FILE: ${{ runner.temp }}/queue/unresolved/mubawab.ma.txt
          DEEP_OFFSET: "0"
          DEEP_LIMIT: "500"
        run: npx tsx scripts/recovery/deep-enrichment-source-batch.ts

      - name: Assert zero DB access
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const s=JSON.parse(fs.readFileSync("data/audits/raw-results/deep-batch-mubawab-ma-0-500-summary.json","utf8"));
          if(s.input_urls!==500) throw new Error("input_urls");
          if(s.database_access!==0||s.database_writes!==0) throw new Error("DB invariant");
          if(s.fetched+s.failed+s.robots_skipped!==500) throw new Error("accounting");
          console.log(JSON.stringify(s,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-mubawab-verification-pilot-0-500
          path: |
            data/audits/raw-results/deep-batch-mubawab-ma-0-500.json
            data/audits/raw-results/deep-batch-mubawab-ma-0-500-summary.json
          retention-days: 30
