name: DETERMINISTIC-ATTRIBUTION-1 Docs Closeout

on:
  push:
    branches:
      - docs/deterministic-attribution-1-closeout
    paths:
      - "scripts/audits/apply-deterministic-attribution-1-closeout.mjs"
      - ".github/workflows/deterministic-attribution-1-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/deterministic-attribution-1-closeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/audits/apply-deterministic-attribution-1-closeout.mjs
      - name: Verify intended application scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' README.md docs/ROADMAP.md docs/SESSION.md | sort)"
          test "$changed" = "$expected"
      - name: Remove temporary closeout files
        run: |
          git rm scripts/audits/apply-deterministic-attribution-1-closeout.mjs
          git rm .github/workflows/deterministic-attribution-1-closeout.yml
      - name: Commit final docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hraaaaf"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md
          git commit -m "docs: close deterministic attribution 1"
          git push origin HEAD:docs/deterministic-attribution-1-closeout
