name: AkarFinder - Non-Factory Scoreboard Reconcile

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audits/nonfactory-scoreboard-reconcile.ts'
      - '.github/workflows/nonfactory-scoreboard-reconcile.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NONFACTORY_RECON_OUT: .tmp/nonfactory-scoreboard-reconcile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reconcile non-factory historical detail reservoir read-only
        run: npx tsx scripts/audits/nonfactory-scoreboard-reconcile.ts
      - name: Verify no-write contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('.tmp/nonfactory-scoreboard-reconcile/summary.json','utf8'));
          if(p.zeroDbWrites!==true || p.zeroSourceFetches!==true) throw new Error('read-only invariant failed');
          if(!(p.allNonFactoryDetailCandidates>=0)) throw new Error('invalid candidate count');
          console.log(JSON.stringify({exactAdditiveNonFactory:p.exactAdditiveNonFactory,additiveDomains:p.additiveDomains},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: nonfactory-scoreboard-reconcile-proof
          path: .tmp/nonfactory-scoreboard-reconcile/
          if-no-files-found: error
          retention-days: 30
