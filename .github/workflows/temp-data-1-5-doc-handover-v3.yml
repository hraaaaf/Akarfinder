name: Temporary DATA-1.5 Docs Handover v3

on:
  push:
    branches:
      - docs/data-1-5-handover-20260807

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/data-1-5-handover-20260807
          fetch-depth: 0

      - name: Execute validated v1 transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          src = Path('.github/workflows/temp-data-1-5-doc-handover.yml').read_text().splitlines()
          marker = '      - name: Align README, ROADMAP and SESSION'
          start = src.index(marker)
          run_line = next(i for i in range(start, len(src)) if src[i] == '        run: |')
          body = []
          for line in src[run_line + 1:]:
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              elif line == '':
                  body.append('')
              else:
                  raise SystemExit(f'unexpected transformer indentation: {line!r}')
          Path('/tmp/data15_handover.py').write_text('\n'.join(body) + '\n')
          PY
          python /tmp/data15_handover.py
          sed -i 's/[[:space:]]\+$//' docs/SESSION.md

      - name: Commit docs-only result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-data-1-5-doc-handover.yml
          rm -f .github/workflows/temp-data-1-5-doc-handover-v2.yml
          rm -f .github/workflows/temp-data-1-5-doc-handover-v3.yml
          git config user.name "AkarFinder Docs Handover"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: close DATA-1.5 and hand over DATA-1.6A"
          git push origin HEAD:docs/data-1-5-handover-20260807
