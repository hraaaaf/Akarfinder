name: Neighborhood Context L7 National Baseline

on:
  pull_request:
    paths:
      - "lib/geo/geo-entity-registry.ts"
      - "lib/neighborhood-context/**"
      - "scripts/neighborhood-context/l7-*"
      - "scripts/scrapers/__tests__/neighborhood-context-l7-national-baseline.test.ts"
      - ".github/workflows/neighborhood-context-l7-national-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neighborhood-context-l7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  national-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NCI_L7_OUTPUT_DIR: artifacts/neighborhood-context-l7-national-baseline

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: L7 baseline + L3/L2/L1 regression
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/neighborhood-context-l7-national-baseline.test.ts
          scripts/scrapers/__tests__/neighborhood-context-l3-read-model.test.ts
          scripts/scrapers/__tests__/neighborhood-context-l2-anchor-selection.test.ts
          scripts/scrapers/__tests__/neighborhood-context-l1-poi-registry.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Generate national baseline
        run: npx tsx scripts/neighborhood-context/l7-generate-national-baseline.ts

      - name: Validate national baseline
        run: node scripts/neighborhood-context/l7-validate-national-baseline.mjs

      - name: Upload national baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neighborhood-context-l7-national-baseline-${{ github.run_id }}
          path: artifacts/neighborhood-context-l7-national-baseline/
          if-no-files-found: error
          retention-days: 30
