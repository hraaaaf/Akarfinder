name: UX P2 Seller Secure Publish Flow

on:
  pull_request:
    paths:
      - "app/api/leads/route.ts"
      - "app/api/seller-drafts/**"
      - "app/vendre/dossier/page.tsx"
      - "components/vendre/SellerSecurePublishForm.tsx"
      - "lib/leads/types.ts"
      - "lib/seller/**"
      - "supabase/migrations/20260805153000_seller_secure_photo_upload_v1.sql"
      - "scripts/scrapers/__tests__/ux-p2-seller-secure-publish-flow.test.ts"
      - ".github/workflows/ux-p2-seller-secure-publish-flow.yml"
  workflow_dispatch:

jobs:
  secure-seller-publish-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Secure seller contracts
        run: npx tsx --test scripts/scrapers/__tests__/ux-p2-seller-secure-publish-flow.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
