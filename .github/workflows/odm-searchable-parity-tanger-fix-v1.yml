name: ODM Searchable Parity Tanger Fix V1

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260731155500_odm_searchable_parity_tanger_fix_v1.sql'
      - 'scripts/odm-searchable-parity-tanger-fix-v1-contract.mjs'
      - '.github/workflows/odm-searchable-parity-tanger-fix-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tanger parity contract
        run: node scripts/odm-searchable-parity-tanger-fix-v1-contract.mjs
      - name: TypeScript
        run: npm run typecheck --if-present
      - name: Production build
        run: npm run build
