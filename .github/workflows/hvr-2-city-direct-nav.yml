name: HVR-2 Direct City Navigation Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/landing/CityIntentGrid.tsx'
      - 'scripts/audits/hvr-2-city-direct-nav.mjs'
      - 'scripts/scrapers/__tests__/hvr-2-city-direct-nav.test.ts'
      - 'docs/HVR_2_CITY_DIRECT_NAV.md'
      - '.github/workflows/hvr-2-city-direct-nav.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hvr-2-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: HVR-2 source contracts
        shell: bash
        run: |
          set -euo pipefail
          npx tsx --test \
            scripts/scrapers/__tests__/hvr-2-city-direct-nav.test.ts \
            scripts/scrapers/__tests__/hvr-1-homepage.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3217 > /tmp/hvr-2.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3217/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hvr-2.log
          exit 1
      - name: HVR-2 responsive direct-city proof
        env:
          BASE_URL: http://127.0.0.1:3217
          AUDIT_OUTPUT_DIR: artifacts/hvr-2-city-direct-nav
        run: node scripts/audits/hvr-2-city-direct-nav.mjs
      - name: Upload HVR-2 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hvr-2-city-direct-nav-${{ github.run_id }}
          path: artifacts/hvr-2-city-direct-nav
          if-no-files-found: error
          retention-days: 14
