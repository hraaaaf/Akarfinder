name: Neon Preview DATABASE_URL Cutover

on:
  push:
    branches:
      - release/neon-recovery-live-20260928
    paths:
      - .github/workflows/neon-preview-database-url-cutover.yml

jobs:
  cutover-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          test -n "$VERCEL_TOKEN"
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "NEON_RECOVERY_DATABASE_URL is not a PostgreSQL URL"; exit 1 ;;
          esac

      - name: Upsert branch-specific Preview DATABASE_URL
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          body="$(jq -nc --arg value "$DATABASE_URL" --arg branch "$GITHUB_REF_NAME"             '{key:"DATABASE_URL",value:$value,type:"encrypted",target:["preview"],gitBranch:$branch,comment:"AkarFinder Neon preview cutover 2026-09-28"}')"

          code="$(curl -sS -o /tmp/vercel-env.json -w '%{http_code}'             -X POST             "https://api.vercel.com/v10/projects/prj_RCs2Ku5vex9cpABWnwaCjbuKrhhc/env?upsert=true&teamId=team_NNhXPDOIfjGNBcn253btpyk0"             -H "Authorization: Bearer $VERCEL_TOKEN"             -H "Content-Type: application/json"             --data "$body")"

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Vercel env upsert failed with HTTP $code"
            jq -r '{error, message}' /tmp/vercel-env.json
            exit 1
          fi

          jq -r 'if type=="array" then map({id,key,type,target,gitBranch}) else {id,key,type,target,gitBranch} end' /tmp/vercel-env.json

      - name: Create exact-head Preview from Git source
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          body="$(jq -nc             --arg ref "$GITHUB_REF_NAME"             --arg sha "$GITHUB_SHA"             '{
              name:"akarfinder",
              project:"prj_RCs2Ku5vex9cpABWnwaCjbuKrhhc",
              gitSource:{
                type:"github",
                org:"hraaaaf",
                repo:"Akarfinder",
                ref:$ref,
                sha:$sha
              }
            }')"

          code="$(curl -sS -o /tmp/deploy.json -w '%{http_code}'             -X POST             "https://api.vercel.com/v13/deployments?forceNew=1&teamId=team_NNhXPDOIfjGNBcn253btpyk0"             -H "Authorization: Bearer $VERCEL_TOKEN"             -H "Content-Type: application/json"             --data "$body")"

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Vercel exact-head Preview creation failed with HTTP $code"
            jq -r '{error, message}' /tmp/deploy.json
            exit 1
          fi

          target="$(jq -r '.target // "preview"' /tmp/deploy.json)"
          if [ "$target" != "preview" ]; then
            echo "Refusing unexpected deployment target: $target"
            exit 1
          fi

          response_sha="$(jq -r '.meta.githubCommitSha // empty' /tmp/deploy.json)"
          if [ -n "$response_sha" ] && [ "$response_sha" != "$GITHUB_SHA" ]; then
            echo "Exact-head mismatch: expected $GITHUB_SHA got $response_sha"
            exit 1
          fi

          id="$(jq -r '.id' /tmp/deploy.json)"
          url="$(jq -r '.url' /tmp/deploy.json)"
          state="$(jq -r '.readyState // .status' /tmp/deploy.json)"
          test -n "$id"
          test "$id" != "null"
          test -n "$url"
          test "$url" != "null"

          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"
          echo "preview_url=https://$url" >> "$GITHUB_OUTPUT"
          echo "ready_state=$state" >> "$GITHUB_OUTPUT"
          {
            echo "Exact HEAD: $GITHUB_SHA"
            echo "Preview deployment: $id"
            echo "Preview URL: https://$url"
            echo "Initial state: $state"
            echo "Target: preview"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert non-production intent
        shell: bash
        run: |
          set -euo pipefail
          echo "Created exact-head Preview deployment only."
          echo "Deployment: ${{ steps.deploy.outputs.deployment_id }}"
          echo "URL: ${{ steps.deploy.outputs.preview_url }}"
