name: Carte C5 Rich Zone Sheet Contract

on:
  pull_request:
    paths:
      - "docs/CARTE_C5_RICH_ZONE_SHEET_CONTRACT.md"
      - "scripts/scrapers/__tests__/carte-c5-rich-zone-sheet-contract.test.ts"
      - ".github/workflows/carte-c5-rich-zone-sheet-contract.yml"

permissions:
  contents: read

jobs:
  certify-c5-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: C5 rich zone sheet contract
        run: npx tsx --test scripts/scrapers/__tests__/carte-c5-rich-zone-sheet-contract.test.ts
