name: ODM Canary 5 Synthetic Traffic Certification V1

on:
  pull_request:
    paths:
      - "scripts/certify-odm-canary-5-synthetic-traffic-v1.mjs"
      - ".github/workflows/odm-canary-5-synthetic-traffic-certification-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run controlled production campaign
        env:
          AKARFINDER_PRODUCTION_URL: https://akarfinder.vercel.app
        run: node scripts/certify-odm-canary-5-synthetic-traffic-v1.mjs
      - name: Upload certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odm-canary-5-synthetic-traffic-v1
          path: artifacts/odm-canary-5-synthetic-traffic-v1.json
          if-no-files-found: error
          retention-days: 30
