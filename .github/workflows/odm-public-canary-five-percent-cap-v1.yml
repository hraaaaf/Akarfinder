name: ODM Public Canary Five Percent Cap V1

on:
  pull_request:
    paths:
      - "lib/odm/odm-public-canary.ts"
      - "scripts/scrapers/__tests__/odm-public-canary-five-percent-cap-v1.test.ts"
      - ".github/workflows/odm-public-canary-five-percent-cap-v1.yml"

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx --test scripts/scrapers/__tests__/odm-public-canary-five-percent-cap-v1.test.ts
      - run: npx tsc --noEmit
