name: Mubawab Fresh Snapshot Offline
on:
  pull_request:
    paths:
      - 'scripts/acquisition/mubawab-fresh/**'
      - '.github/workflows/mubawab-fresh-offline.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/acquisition/mubawab-fresh/requirements.txt
      - name: Install pinned deps
        run: python -m pip install -r scripts/acquisition/mubawab-fresh/requirements.txt
      - name: Compile fresh implementation
        run: python -m compileall -q scripts/acquisition/mubawab-fresh
      - name: Test independent capture and offline dedup (NO HTTP)
        working-directory: scripts/acquisition/mubawab-fresh
        run: python -m unittest -v test_fresh_snapshot.py test_bulk_url_inventory.py