name: DATA-4.7A LSF Sitemap Mass Qualification

on:
  pull_request:
    paths:
      - "scripts/audits/data-4-7a-lsf-sitemap-mass-qualification.ts"
      - "scripts/data4/__tests__/data-4-7a-lsf-sitemap-mass-qualification.test.ts"
      - ".github/workflows/data-4-7a-lsf-sitemap-mass-qualification.yml"
  push:
    branches: [main]
    paths:
      - "scripts/audits/data-4-7a-lsf-sitemap-mass-qualification.ts"
      - "scripts/data4/__tests__/data-4-7a-lsf-sitemap-mass-qualification.test.ts"
      - ".github/workflows/data-4-7a-lsf-sitemap-mass-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: DATA-4.7A focused contract test
        run: npx tsx --test scripts/data4/__tests__/data-4-7a-lsf-sitemap-mass-qualification.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Static read-only boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('scripts/audits/data-4-7a-lsf-sitemap-mass-qualification.ts','utf8');
          for (const required of [
            'mode: "READ_ONLY_QUALIFICATION"',
            'databaseWrites: 0',
            'freshnessWrites: 0',
            'registryMutations: 0',
            'policyChanges: 0',
            'productionActivation: false',
            'detailPageFetches: 0',
            'writeAuthorized: false',
            'MAX_SOURCE_REQUESTS = 40',
            'massTailCandidatesInPublicSearch',
          ]) if (!s.includes(required)) throw new Error(`missing contract ${required}`);
          if (/method:\s*["'](?:POST|PATCH|PUT|DELETE)["']/.test(s)) throw new Error('mutation HTTP method forbidden');
          NODE

  live-read-only:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_4_7A_OUT_DIR: .tmp/data-4-7a/results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run DATA-4.7A live read-only qualification
        run: npx tsx scripts/audits/data-4-7a-lsf-sitemap-mass-qualification.ts
      - name: Enforce proof
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('.tmp/data-4-7a/results/proof.json','utf8'));
          if (p.schemaVersion !== 'data-4-7a-lsf-sitemap-mass-qualification-v1') throw new Error(JSON.stringify(p));
          if (p.mode !== 'READ_ONLY_QUALIFICATION' || p.sourceDomain !== 'limmobiliersansfrontieres.com') throw new Error(JSON.stringify(p));
          if (p.databaseWrites !== 0 || p.freshnessWrites !== 0 || p.registryMutations !== 0 || p.policyChanges !== 0 || p.productionActivation !== false || p.detailPageFetches !== 0 || p.writeAuthorized !== false) throw new Error(JSON.stringify(p));
          if (p.sourceRequests < 1 || p.sourceRequests > 40 || p.totalSeeds < 1) throw new Error(JSON.stringify(p));
          const allowed = new Set(['SOURCE_SITEMAP_DECLARATION_DRIFT','QUALIFIED_FOR_CONTROLLED_EXPANSION_DESIGN','INSUFFICIENT_MASS_TAIL_LIVE_RESERVOIR']);
          if (!allowed.has(p.verdict)) throw new Error(JSON.stringify(p));
          if (p.verdict !== 'SOURCE_SITEMAP_DECLARATION_DRIFT') {
            if (p.safeIdentityMatches > p.currentSitemapUrlCount || p.massTailCandidatesInPublicSearch > p.massTailCandidates) throw new Error(JSON.stringify(p));
          }
          if (p.verdict === 'QUALIFIED_FOR_CONTROLLED_EXPANSION_DESIGN' && p.massTailCandidatesInPublicSearch < 100) throw new Error(JSON.stringify(p));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: data-4-7a-lsf-sitemap-mass-qualification
          path: .tmp/data-4-7a/results/
          if-no-files-found: error
          retention-days: 14
