name: DATA-4.3E/F Read-only Build AFTER

on:
  push:
    branches: [main]
    paths:
      - "scripts/data4/daragadir-freshness-write-canary.ts"
      - "scripts/data4/daragadir-controlled-promotion.ts"
      - "scripts/data4/__tests__/daragadir-freshness-write-canary.test.ts"
      - "scripts/data4/__tests__/daragadir-controlled-promotion.test.ts"
      - "scripts/audits/data-4-3e-first-freshness-write-canary.ts"
      - "scripts/audits/data-4-3f-controlled-promotion-design.ts"
      - "scripts/ci/__tests__/data43ef-workflow-boundaries.test.mjs"
      - ".github/workflows/data-4-3e-first-freshness-write-canary.yml"
      - ".github/workflows/data-4-3f-controlled-promotion-design.yml"
      - ".github/workflows/data-4-3e-f-readonly-after.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Shared production build with no data secrets
        run: npm run build
