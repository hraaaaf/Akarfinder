name: Neighborhood Visual Roadmap P2 Closeout

on:
  push:
    branches:
      - agent/neighborhood-visual-roadmap-p2-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neighborhood-visual-roadmap-p2-closeout
          fetch-depth: 0
      - run: python scripts/maintenance/close-neighborhood-visual-p2-roadmap.py
      - name: Verify scoped diff
        run: |
          git diff --check
          test "$(git diff --name-only)" = "docs/ROADMAP.md"
          grep -Fq "P2 Visual Resolver integration ✅ CLOSED — PR #605" docs/ROADMAP.md
          grep -Fq "P3.1 Casablanca / Maârif" docs/ROADMAP.md
      - name: Commit roadmap closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          git commit -m "Close P2 visual resolver in canonical roadmap"
          git push origin HEAD:agent/neighborhood-visual-roadmap-p2-closeout
