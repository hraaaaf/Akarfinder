name: TMP P1B.5 Docs Closeout

on:
  push:
    branches:
      - docs/p1b5-production-closeout
    paths:
      - scripts/tmp-p1b5-docs-closeout.py
      - .github/workflows/tmp-p1b5-docs-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/p1b5-production-closeout
      - name: Apply P1B.5 canonical docs closeout
        run: python scripts/tmp-p1b5-docs-closeout.py
      - name: Self-clean and commit only canonical docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/tmp-p1b5-docs-closeout.py .github/workflows/tmp-p1b5-docs-closeout.yml
          git add README.md docs/ROADMAP.md docs/SESSION.md
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "README.md docs/ROADMAP.md docs/SESSION.md "
          git commit -m "docs: close P1B.5 production recovery"
          git push origin HEAD:docs/p1b5-production-closeout
