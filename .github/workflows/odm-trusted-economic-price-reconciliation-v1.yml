name: ODM Trusted Economic Price Reconciliation V1

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260802153000_odm_trusted_economic_price_reconciliation_v1.sql'
      - 'scripts/contracts/odm-trusted-economic-price-reconciliation-v1-contract.mjs'
      - '.github/workflows/odm-trusted-economic-price-reconciliation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/contracts/odm-trusted-economic-price-reconciliation-v1-contract.mjs
