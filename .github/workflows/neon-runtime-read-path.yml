      - "scripts/scrapers/__tests__/neon-supabase-hidden-read-guards.test.ts"
      - ".github/workflows/neon-migration-validation-suite.yml"
      - "scripts/scrapers/__tests__/neon-migration-validation-suite-guard.test.ts"

permissions:
  contents: read

concurrency:
  group: neon-runtime-read-path-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Neon migration and provider unit tests
        run: npx tsx --test scripts/scrapers/__tests__/neon-db-provider.test.ts scripts/scrapers/__tests__/ha-writer-state.test.ts scripts/scrapers/__tests__/ha-replication-capability-inventory.test.ts scripts/scrapers/__tests__/ha-operator-runbook-guard.test.ts scripts/scrapers/__tests__/ha-parity-rpo-rto-spec-guard.test.ts scripts/scrapers/__tests__/ha-evidence-bundle-guard.test.ts scripts/scrapers/__tests__/ha-evidence-evaluator.test.ts scripts/scrapers/__tests__/ha-baseline-parity-workflow-guard.test.ts scripts/scrapers/__tests__/ha-replication-canary-migration-guard.test.ts scripts/scrapers/__tests__/ha04-continuous-sync-contract-guard.test.ts scripts/scrapers/__tests__/ha05-failover-contract-guard.test.ts scripts/scrapers/__tests__/ha06-failback-contract-guard.test.ts scripts/scrapers/__tests__/ha-readiness-matrix-guard.test.ts scripts/scrapers/__tests__/ha-capability-inventory-workflow-guard.test.ts scripts/scrapers/__tests__/ha-isolated-rehearsal-workflow-guard.test.ts scripts/scrapers/__tests__/neon-listings.test.ts scripts/scrapers/__tests__/neon-core-db-migration-guard.test.ts scripts/scrapers/__tests__/neon-odm-portability-guard.test.ts scripts/scrapers/__tests__/neon-public-search.test.ts scripts/scrapers/__tests__/neon-owner-listing-search.test.ts scripts/scrapers/__tests__/neon-owner-read-portability-guard.test.ts scripts/scrapers/__tests__/neon-market-comparables.test.ts scripts/scrapers/__tests__/neon-market-comparables-portability-guard.test.ts scripts/scrapers/__tests__/neon-market-intelligence-read.test.ts scripts/scrapers/__tests__/neon-market-intelligence-portability-guard.test.ts scripts/scrapers/__tests__/neon-akar-estimate-history.test.ts scripts/scrapers/__tests__/neon-owner-detail-media.test.ts scripts/scrapers/__tests__/neon-supabase-hidden-read-guards.test.ts scripts/scrapers/__tests__/neon-migration-validation-suite-guard.test.ts scripts/scrapers/__tests__/odm-09b-public-search-contract.test.ts

      - name: TypeScript
        run: npx tsc --noEmit