name: Recovery V4.11 Wave9 Hardened Reconciliation Preflight
on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths: ["data/recovery/activate-v4-11-wave9-hardened-reconcile-preflight.txt"]
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Download old and hardened artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/rec" data/audits/v4-11-wave9-hardened-reconcile
          gh api "repos/${{ github.repository }}/actions/artifacts/10936443710/zip" > "$RUNNER_TEMP/old.zip"
          unzip -q "$RUNNER_TEMP/old.zip" -d "$RUNNER_TEMP/rec/old"
          gh api "repos/${{ github.repository }}/actions/artifacts/10937330001/zip" > "$RUNNER_TEMP/hard.zip"
          unzip -q "$RUNNER_TEMP/hard.zip" -d "$RUNNER_TEMP/rec/hard"
          echo "2f7dbd6a26cac7776d51d31bdfcc86f6ca401bd026cf3888c19cc001f77dcf25  $RUNNER_TEMP/rec/old/db-ready-wave9-filtered.jsonl" | sha256sum -c -
          echo "9baac42bc02b5f0820eac6709a3a3ec5b5e9c9cfea515a8135311fc5fdd56dd6  $RUNNER_TEMP/rec/hard/db-ready-wave9.jsonl" | sha256sum -c -
      - name: Derive exact remove/add sets
        run: |
          node - "$RUNNER_TEMP/rec/old/db-ready-wave9-filtered.jsonl" "$RUNNER_TEMP/rec/hard/db-ready-wave9.jsonl" "$RUNNER_TEMP/rec" <<'NODE'
          const fs=require("fs");const [oldp,hardp,out]=process.argv.slice(2);
          const load=p=>fs.readFileSync(p,"utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const old=load(oldp),hard=load(hardp);
          const H=new Map(hard.map(r=>[r.listing_url,r])), O=new Map(old.map(r=>[r.listing_url,r]));
          const remove=old.filter(r=>!H.has(r.listing_url));
          const add=hard.filter(r=>!O.has(r.listing_url));
          if(remove.length!==64||add.length!==252)throw new Error("set sizes "+remove.length+"/"+add.length);
          const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
          fs.writeFileSync(out+"/remove.csv","listing_url,canonical_fingerprint,source_name,source_offer_key\n"+remove.map(r=>[r.listing_url,r.canonical_fingerprint,r.source_name,r.source_offer_key].map(esc).join(",")).join("\n")+"\n");
          fs.writeFileSync(out+"/add.jsonl",add.map(JSON.stringify).join("\n")+"\n");
          fs.writeFileSync(out+"/add.csv","listing_url,canonical_fingerprint,source_name,source_offer_key\n"+add.map(r=>[r.listing_url,r.canonical_fingerprint,r.source_name,r.source_offer_key].map(esc).join(",")).join("\n")+"\n");
          fs.writeFileSync("data/audits/v4-11-wave9-hardened-reconcile/sets.json",JSON.stringify({remove_rows:remove.length,add_rows:add.length,old_rows:old.length,hardened_rows:hard.length},null,2)+"\n");
          NODE
      - name: Read-only DB reconciliation proof
        run: |
          cat > "$RUNNER_TEMP/rec/p.sql" <<'SQL'
          CREATE TEMP TABLE rem(listing_url text,canonical_fingerprint text,source_name text,source_offer_key text);
          \copy rem FROM '/rec/remove.csv' WITH (FORMAT csv, HEADER true)
          CREATE TEMP TABLE addset(listing_url text,canonical_fingerprint text,source_name text,source_offer_key text);
          \copy addset FROM '/rec/add.csv' WITH (FORMAT csv, HEADER true)
          WITH removed_props AS (
            SELECT ls.property_listing_id
            FROM public.listing_sources ls
            JOIN rem r ON r.listing_url=ls.listing_url
            WHERE ls.ingestion_run_id='clean-corpus-v4.11-wave9'
          ),
          remaining_sources AS (
            SELECT ls.*
            FROM public.listing_sources ls
            WHERE NOT EXISTS (
              SELECT 1 FROM rem r
              WHERE r.listing_url=ls.listing_url
                AND ls.ingestion_run_id='clean-corpus-v4.11-wave9'
            )
          ),
          existing_identity AS (
            SELECT DISTINCT
              CASE WHEN listing_url ~* 'mubawab\.ma' THEN 'mubawab.ma' WHEN listing_url ~* 'avito\.ma' THEN 'avito.ma' END source_name,
              CASE WHEN listing_url ~* 'mubawab\.ma' THEN (regexp_match(listing_url,'/(a|pa)/([0-9]+)(/|$)'))[2]
                   WHEN listing_url ~* 'avito\.ma' THEN (regexp_match(listing_url,'_([0-9]+)\.html?$'))[1] END source_offer_key
            FROM remaining_sources
            WHERE listing_url ~* '(mubawab\.ma|avito\.ma)'
          ),
          eligible_add AS (
            SELECT a.*
            FROM addset a
            WHERE NOT EXISTS (SELECT 1 FROM remaining_sources ls WHERE ls.listing_url=a.listing_url)
              AND NOT EXISTS (
                SELECT 1
                FROM public.property_listings pl
                WHERE pl.canonical_fingerprint=a.canonical_fingerprint
                  AND NOT EXISTS (SELECT 1 FROM removed_props rp WHERE rp.property_listing_id=pl.id)
              )
              AND NOT EXISTS (
                SELECT 1 FROM existing_identity e
                WHERE e.source_name=a.source_name AND e.source_offer_key=a.source_offer_key
              )
          )
          SELECT
            (SELECT count(*) FROM public.property_listings),
            (SELECT count(*) FROM public.listing_sources),
            (SELECT count(*) FROM rem r JOIN public.listing_sources ls ON ls.listing_url=r.listing_url AND ls.ingestion_run_id='clean-corpus-v4.11-wave9'),
            (SELECT count(*) FROM addset),
            (SELECT count(*) FROM eligible_add),
            (SELECT count(*) FROM addset a JOIN remaining_sources ls ON ls.listing_url=a.listing_url),
            (SELECT count(*) FROM addset a JOIN existing_identity e USING(source_name,source_offer_key));
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/rec:/rec" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -f /rec/p.sql' | tee data/audits/v4-11-wave9-hardened-reconcile/preflight.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-wave9-hardened-reconcile-preflight
          path: data/audits/v4-11-wave9-hardened-reconcile/
          retention-days: 30
