name: AkarFinder - Q4A Mubawab Common Crawl Recovery

on:
  push:
    branches: [data/q4a-minimal-search-ready]
    paths:
      - 'scripts/audits/q4a-mubawab-commoncrawl-recovery.mjs'
      - '.github/workflows/q4a-mubawab-commoncrawl-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  Q4A_CC_LIMIT: '250'
  Q4A_CC_OFFSET: '0'
  Q4A_CC_OUT: '.tmp/q4a-cc-mubawab'
  Q4A_DB_JSONL: '.tmp/q4a-db/db-url-field-evidence.jsonl'

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download historical DB evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/q4a-db
          gh api repos/hraaaaf/Akarfinder/actions/artifacts/10026575439/zip > /tmp/q4a-db.zip
          unzip -q /tmp/q4a-db.zip -d .tmp/q4a-db
      - name: Recover archived Mubawab fields
        run: node scripts/audits/q4a-mubawab-commoncrawl-recovery.mjs
      - name: Verify summary invariants
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const s=JSON.parse(fs.readFileSync('.tmp/q4a-cc-mubawab/summary.json','utf8'))
          if(s.targets>250) throw new Error('target cap violated')
          if(s.supabaseReads!==0 || s.supabaseWrites!==0) throw new Error('Supabase dependency reintroduced')
          if(s.sourceSiteFetches!==0 || !s.commonCrawlOnly) throw new Error('source fetch invariant violated')
          console.log(s)
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: q4a-mubawab-commoncrawl-recovery-v2
          path: .tmp/q4a-cc-mubawab/
          retention-days: 30
