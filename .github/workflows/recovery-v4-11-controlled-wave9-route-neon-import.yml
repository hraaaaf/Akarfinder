name: Recovery V4.11 Controlled Wave9 Route Neon Import
on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths: ["data/recovery/v4-11-wave9-route-import-approval.json"]
permissions:
  contents: read
  actions: read
concurrency:
  group: recovery-v4-11-controlled-wave9-route-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Validate approval and target
        run: |
          node - <<'NODE'
          const a=require("./data/recovery/v4-11-wave9-route-import-approval.json");
          if(a.approved!==true||a.rows!==2240||a.filtered_preflight_run_id!==36335572869||a.artifact_id!==10936443710)throw new Error("approval binding");
          if(a.jsonl_sha256!=="2f7dbd6a26cac7776d51d31bdfcc86f6ca401bd026cf3888c19cc001f77dcf25")throw new Error("sha");
          if(a.target_project!=="ancient-violet-43534870"||a.target_branch!=="br-cold-mouse-b2a50yaa"||a.target_database!=="AkarFinder")throw new Error("target");
          if(a.expected_pre.property_listings!==139161||a.expected_post.property_listings!==141401)throw new Error("counts");
          if(a.production_neon_writes_authorized!==false||a.vercel_deployment_authorized!==false)throw new Error("scope");
          NODE
          python - <<'PY'
          import os,urllib.parse
          h=urllib.parse.urlparse(os.environ["DATABASE_URL"]).hostname
          if h not in {"ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech"}: raise SystemExit("unexpected host")
          PY
      - name: Download certified filtered artifact
        run: |
          mkdir -p "$RUNNER_TEMP/w9"
          gh api "repos/${{ github.repository }}/actions/artifacts/10936443710/zip" > "$RUNNER_TEMP/w9.zip"
          unzip -q "$RUNNER_TEMP/w9.zip" -d "$RUNNER_TEMP/w9"
          echo "2f7dbd6a26cac7776d51d31bdfcc86f6ca401bd026cf3888c19cc001f77dcf25  $RUNNER_TEMP/w9/db-ready-wave9-filtered.jsonl" | sha256sum -c -
          test "$(wc -l < "$RUNNER_TEMP/w9/db-ready-wave9-filtered.jsonl")" = "2240"
      - name: Build CSV
        run: |
          node - "$RUNNER_TEMP/w9/db-ready-wave9-filtered.jsonl" "$RUNNER_TEMP/w9/import.csv" <<'NODE'
          const fs=require("fs");const [src,out]=process.argv.slice(2);const rows=fs.readFileSync(src,"utf8").trim().split(/\r?\n/).map(JSON.parse);
          const cols=["canonical_fingerprint","title","price_mad","city","district","property_type","transaction_type","surface_m2","rooms_count","bedrooms_count","bathrooms_count","description_snippet","images_count","seller_name","data_completeness_score","field_confidence","source_name","listing_url","source_url","first_seen_at","last_seen_at","source_offer_key","origin_type","compliance_status","content_fingerprint","ingestion_run_id","displayed_price","price_currency","price_period","price_status"];
          const e=v=>{if(v==null)return "";const s=typeof v==="object"?JSON.stringify(v):String(v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
          if(rows.length!==2240||rows.some(r=>r.approved_for_import!==false))throw new Error("rows");
          if(rows.some(r=>r.price_mad!=null&&(!Number.isInteger(r.price_mad)||r.price_mad<0||r.price_mad>2147483647)))throw new Error("price int4");
          fs.writeFileSync(out,cols.join(",")+"\n"+rows.map(r=>cols.map(c=>e(r[c])).join(",")).join("\n")+"\n");
          NODE
      - name: Atomic Wave9 route import
        run: |
          cat > "$RUNNER_TEMP/w9/import.sql" <<'SQL'
          BEGIN;
          CREATE TEMP TABLE w9_stage_import_20260927(
            canonical_fingerprint text NOT NULL,title text NOT NULL,price_mad integer,city text NOT NULL,district text,
            property_type text NOT NULL,transaction_type text NOT NULL,surface_m2 integer,rooms_count integer,bedrooms_count integer,bathrooms_count integer,
            description_snippet text,images_count integer,seller_name text,data_completeness_score integer,field_confidence jsonb,
            source_name text NOT NULL,listing_url text NOT NULL,source_url text,first_seen_at timestamptz,last_seen_at timestamptz,source_offer_key text NOT NULL,
            origin_type text,compliance_status text,content_fingerprint text,ingestion_run_id text,displayed_price numeric,price_currency text,price_period text,price_status text
          ) ON COMMIT DROP;
          \copy w9_stage_import_20260927 FROM '/w9/import.csv' WITH (FORMAT csv, HEADER true)
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.property_listings)<>139161 THEN RAISE EXCEPTION 'pre properties'; END IF;
            IF (SELECT count(*) FROM public.listing_sources)<>139161 THEN RAISE EXCEPTION 'pre sources'; END IF;
            IF (SELECT count(*) FROM w9_stage_import_20260927)<>2240 THEN RAISE EXCEPTION 'stage'; END IF;
            IF EXISTS(SELECT 1 FROM w9_stage_import_20260927 s JOIN public.listing_sources ls ON ls.listing_url=s.listing_url) THEN RAISE EXCEPTION 'url overlap'; END IF;
            IF EXISTS(SELECT 1 FROM w9_stage_import_20260927 s JOIN public.property_listings pl ON pl.canonical_fingerprint=s.canonical_fingerprint) THEN RAISE EXCEPTION 'fp overlap'; END IF;
          END $$;
          INSERT INTO public.property_listings(canonical_fingerprint,title,price_mad,city,district,property_type,transaction_type,surface_m2,rooms_count,bedrooms_count,bathrooms_count,description_snippet,images_count,seller_name,data_completeness_score,field_confidence)
          SELECT canonical_fingerprint,title,price_mad,city,district,property_type,transaction_type,surface_m2,rooms_count,bedrooms_count,bathrooms_count,description_snippet,images_count,seller_name,data_completeness_score,field_confidence FROM w9_stage_import_20260927;
          INSERT INTO public.listing_sources(property_listing_id,source_name,listing_url,source_url,first_seen_at,last_seen_at,is_active,source_offer_key,origin_type,compliance_status,content_fingerprint,ingestion_run_id,displayed_price,price_currency,price_period,price_status)
          SELECT pl.id,s.source_name,s.listing_url,s.source_url,s.first_seen_at,s.last_seen_at,true,s.source_offer_key,s.origin_type,s.compliance_status,s.content_fingerprint,s.ingestion_run_id,s.displayed_price,s.price_currency,s.price_period,s.price_status
          FROM w9_stage_import_20260927 s JOIN public.property_listings pl ON pl.canonical_fingerprint=s.canonical_fingerprint;
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.property_listings)<>141401 THEN RAISE EXCEPTION 'post properties'; END IF;
            IF (SELECT count(*) FROM public.listing_sources)<>141401 THEN RAISE EXCEPTION 'post sources'; END IF;
            IF (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='clean-corpus-v4.11-wave9')<>2240 THEN RAISE EXCEPTION 'wave9'; END IF;
          END $$;
          COMMIT;
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w9:/w9" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f /w9/import.sql'
      - name: Readback
        run: |
          docker run --rm -e DATABASE_URL="$DATABASE_URL" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -c "SELECT (SELECT count(*) FROM public.property_listings),(SELECT count(*) FROM public.listing_sources),(SELECT count(DISTINCT listing_url) FROM public.listing_sources),(SELECT count(DISTINCT canonical_fingerprint) FROM public.property_listings),(SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='"'"'clean-corpus-v4.11-wave9'"'"'),(SELECT count(*) FROM public.listing_sources ls LEFT JOIN public.property_listings pl ON pl.id=ls.property_listing_id WHERE pl.id IS NULL),(SELECT count(*) FROM public.listing_sources WHERE is_active IS NOT TRUE),(SELECT count(*) FROM public.property_listings WHERE title IS NULL OR btrim(title)='"'"''"'"' OR city IS NULL OR btrim(city)='"'"''"'"' OR property_type IS NULL OR transaction_type IS NULL);"' | tee "$RUNNER_TEMP/w9/readback.txt"
          test "$(cat "$RUNNER_TEMP/w9/readback.txt")" = "141401|141401|141401|141401|2240|0|0|0"
      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-wave9-route-import-readback
          path: ${{ runner.temp }}/w9/readback.txt
          retention-days: 30
