name: P1B.2 Territorial Intelligence — offline contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "components/map/**"
      - "lib/map/akarfinder-market-intelligence.ts"
      - "lib/map/map-navigation-state.ts"
      - "scripts/audits/p1b2-territorial-intelligence-smoke.ts"
      - "scripts/scrapers/__tests__/p1b2-territorial-intelligence.test.ts"
      - ".github/workflows/p1b2-territorial-intelligence.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PRs keep P1B.2 contract coverage without invoking the retired hosted database.
  # This offline job is NOT a certification of actual market-price availability.
  territorial-contracts-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: P1B.2 offline contracts
        run: npx tsx --test scripts/scrapers/__tests__/p1b2-territorial-intelligence.test.ts scripts/scrapers/__tests__/p1b1-akarfinder-map-visual-layer.test.ts scripts/scrapers/__tests__/p1a6-responsive-hardening.test.ts
      - name: TypeScript
        run: npx tsc --noEmit

