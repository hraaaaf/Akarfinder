name: P3 Search AFTER Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "components/search/SearchViewSwitcher.tsx"
      - "components/search/QuickFilters.tsx"
      - "components/search/SearchPriceExplorerDock.tsx"
      - "app/search/search-premium-card-density.css"
      - "scripts/audits/p3-search-after-audit.mjs"
      - ".github/workflows/p3-search-after-audit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    name: Capture P3 Search AFTER
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_URL: http://127.0.0.1:3220
      AUDIT_OUTPUT_DIR: data/audits/p3-search-after
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Latest-commit scope check
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          # Runtime CSS can change the certified QuickFilters geometry, so it is part of P3 AFTER scope.
          changed="$(git diff --name-only HEAD^ HEAD || true)"
          run=false
          while IFS= read -r file; do
            case "$file" in
              components/search/SearchViewSwitcher.tsx|components/search/QuickFilters.tsx|components/search/SearchPriceExplorerDock.tsx|app/search/search-premium-card-density.css|scripts/audits/p3-search-after-audit.mjs|.github/workflows/p3-search-after-audit.yml)
                run=true
                ;;
            esac
          done <<< "$changed"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$changed"

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: TypeScript
        if: steps.scope.outputs.run == 'true'
        run: npx tsc --noEmit

      - name: Install Chromium
        if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Production build
        if: steps.scope.outputs.run == 'true'
        run: npm run build

      - name: Start production server
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3220 > /tmp/p3-search-after.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3220/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p3-search-after.log
          exit 1

      - name: Capture P3 Search AFTER
        if: steps.scope.outputs.run == 'true'
        run: node scripts/audits/p3-search-after-audit.mjs

      - name: Upload P3 Search AFTER
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p3-search-after-${{ github.run_id }}
          path: data/audits/p3-search-after
          if-no-files-found: error
          retention-days: 14
