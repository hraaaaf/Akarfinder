name: Mubawab V646 offline tests
on:
  push:
    paths:
      - 'scripts/pilots/mubawab-v646/**'
      - '.github/workflows/mubawab-v646-offline-tests.yml'
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Run Mubawab V646 offline tests
        working-directory: scripts/pilots/mubawab-v646
        run: python -m unittest discover -s tests -v
