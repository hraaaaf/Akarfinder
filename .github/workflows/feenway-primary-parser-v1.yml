name: FeenWay primary parser QA (read only)
on:
  push:
    branches:
      - data/200k-fresh-parser-v2
    paths:
      - scripts/acquisition/feenway-primary-parser-v1.mjs
      - scripts/data/__tests__/feenway-primary-parser-v1.test.mjs
      - .github/workflows/feenway-primary-parser-v1.yml
permissions:
  contents: read
jobs:
  primary-parser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-specific primary fields and fail-closed behavior
        run: node --test scripts/data/__tests__/feenway-primary-parser-v1.test.mjs
