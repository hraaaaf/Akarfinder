name: Repo Cleanup Surgical Lock

on:
  push:
    branches:
      - chore/repo-cleanup-structural-2
    paths:
      - ".github/workflows/repo-cleanup-surgical-lock.yml"

permissions:
  contents: write

jobs:
  surgical-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/repo-cleanup-structural-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore manifests from cleanup base
        run: git checkout d3e54d375c84fa82a501842f530b0a8797dea997 -- package.json package-lock.json
      - name: Remove direct dependencies only
        run: |
          node <<'NODE'
          const fs = require('fs');
          const remove = ['@electric-sql/pglite', 'cheerio', 'playwright'];
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));

          for (const name of remove) {
            delete pkg.devDependencies?.[name];
            delete lock.packages?.['']?.devDependencies?.[name];
          }

          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Validate lock with npm ci
        run: npm ci --ignore-scripts
      - name: Assert direct dependencies are gone
        run: |
          node <<'NODE'
          const fs = require('fs');
          const remove = ['@electric-sql/pglite', 'cheerio', 'playwright'];
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const name of remove) {
            if (pkg.devDependencies?.[name]) throw new Error(`${name} remains in package.json`);
            if (lock.packages?.['']?.devDependencies?.[name]) throw new Error(`${name} remains in lock root`);
          }
          NODE
      - name: Commit surgical manifest and lock changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(cleanup): remove obsolete direct dev dependencies"
          git push origin HEAD:chore/repo-cleanup-structural-2
