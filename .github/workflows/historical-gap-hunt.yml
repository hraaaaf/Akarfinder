name: AkarFinder - Q1A DATA4.9B Archive Recovery

on:
  push:
    paths:
      - "scripts/audits/candidate-lake-q1a-data49b-wayback-recovery.ts"
      - "scripts/audits/candidate-lake-q1a-data49b-wayback-sitemap-recovery-v2.ts"
      - ".github/workflows/historical-gap-hunt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q1a-data49b-wayback-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Replay DATA4.9B from archived Registry robots and declared sitemaps only
        run: npx tsx scripts/audits/candidate-lake-q1a-data49b-wayback-recovery.ts
      - name: Verify archive-only fail-closed contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('.tmp/candidate-lake-q1a-data49b-wayback-sitemap/summary.json','utf8'));
          if(p.readOnly!==true || p.databaseWrites!==0 || p.productionWrites!==0) throw new Error('write boundary violated');
          if(p.sourceSiteFetches!==0 || p.sourceContentFetches!==0 || p.detailPageFetches!==0) throw new Error('current source-site boundary violated');
          if(p.archiveContentFetchesOnly!==true || p.archiveRobotsAndSitemapsOnly!==true || p.warcFetches!==0) throw new Error('archive-content boundary violated');
          if(p.vercelDeployments!==0) throw new Error('Vercel boundary violated');
          console.log(JSON.stringify({candidateRows:p.candidateRows,candidateCountVector:p.candidateCountVector,allArchiveReadsComplete:p.allArchiveReadsComplete,allCandidateCountsMatch:p.allCandidateCountsMatch,manifestSha256:p.manifestSha256,certificationState:p.certificationState,results:p.results.map(r=>({domain:r.domain,robotsCapture:r.robotsCapture?.timestamp??null,candidates:r.candidateRows,expected:r.expectedCandidateRows,digest:r.candidateDigestSha256,complete:r.complete,errors:r.errors}))},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-lake-q1a-data49b-wayback-sitemap-proof
          path: .tmp/candidate-lake-q1a-data49b-wayback-sitemap/
          if-no-files-found: error
          retention-days: 30
