name: UX Header Closeout Docs Sync

on:
  push:
    branches:
      - ux/header-10of10-1
    paths:
      - ".github/workflows/ux-header-closeout-docs.yml"

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/header-10of10-1
          fetch-depth: 0
      - name: Insert canonical closeout blocks
        shell: python
        run: |
          from pathlib import Path

          block = '''<!-- UX-HEADER-10OF10-1-CLOSEOUT-START -->
          ## UX-HEADER-10OF10-1 — Exact White Search Header ✅ CERTIFIED

          Responsibility: make the `/search` header match the locked visual contract exactly before moving to the next section.

          - desktop 1440×900: one continuous pure-white header surface, blue AkarFinder logo, `Acheter / Louer / Neuf / Agences / Conseils`, then `Favoris / Publier / Mon compte`;
          - mobile 390×844: `Menu / centered AkarFinder / Mon compte` on one continuous pure-white surface;
          - exact rendered height: **54 px** on both certified viewports;
          - no blue header band, no orange, no dark-mode override on the Search header;
          - Product Design Reviewer: **10/10 PASS**;
          - Independent Release Certifier: **10/10 PASS**;
          - synchronized certified behavioral head: `413f854979e5b4349866955b92bb3f4d9d5ba72c`;
          - specialized synchronized run: `31524218758` SUCCESS;
          - perceptual resemblance to the supplied mockup after double-check: **9.8/10**; remaining difference is limited to micro-spacing/font rendering, while the implemented contract itself is **10/10 exact**;
          - DATA, ranking, Source Registry, dedup, price, commercial ordering and Map logic unchanged.

          **Next UX section:** Search / filters. Do not reopen the Header unless a measured regression appears.
          <!-- UX-HEADER-10OF10-1-CLOSEOUT-END -->'''.replace('          ', '')

          targets = [Path('README.md'), Path('docs/ROADMAP.md'), Path('docs/SESSION.md')]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if '<!-- UX-HEADER-10OF10-1-CLOSEOUT-START -->' in text:
                  continue
              if path.name == 'README.md':
                  anchor = '## Gouvernance UX / Search\n'
              elif path.name == 'ROADMAP.md':
                  anchor = '`README.md` définit l’identité/doctrine. `docs/SESSION.md` porte le handover court. Ce fichier est l’unique roadmap.\n'
              else:
                  anchor = "Ce fichier est le handover opérationnel court. `README.md` porte l'identité/doctrine et `docs/ROADMAP.md` reste l'unique roadmap canonique.\n"
              if anchor not in text:
                  raise SystemExit(f'anchor missing in {path}')
              text = text.replace(anchor, anchor + '\n' + block + '\n\n', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit documentation closeout
        shell: bash
        run: |
          if git diff --quiet -- README.md docs/ROADMAP.md docs/SESSION.md; then
            echo "Documentation already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md
          git commit -m "docs: close UX-HEADER-10OF10-1"
          git push origin HEAD:ux/header-10of10-1
