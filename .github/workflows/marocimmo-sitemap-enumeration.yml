name: AkarFinder - MarocImmo Sitemap Enumeration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marocimmo-sitemap-enumeration.yml'

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Enumerate MarocImmo public sitemap only
        run: python scripts/acquisition/marocimmo-sitemap-enumeration.py
      - name: Verify read-only proof
        run: |
          python - <<'PY'
          import json
          s=json.load(open('artifacts/marocimmo-sitemap-enumeration/summary.json'))
          assert s['zero_db_writes'] is True
          assert s['direct_detail_fetches']==0
          assert s['robots_sitemap_allowed'] is True
          print('MAROCIMMO SITEMAP ENUMERATION: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: marocimmo-sitemap-enumeration-proof
          path: artifacts/marocimmo-sitemap-enumeration/
          retention-days: 30
