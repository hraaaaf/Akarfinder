name: RENT P1 Typology Type Fix

on:
  push:
    branches:
      - ux/rent-p1-specialized-journey
    paths:
      - .github/workflows/rent-p1-typology-type-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/rent-p1-specialized-journey
      - run: |
          python <<'PY'
          from pathlib import Path
          path = Path('components/intent/RentIntentHubP1.tsx')
          text = path.read_text().replace('item.value !== "land"', 'item.value !== "Terrain"')
          path.write_text(text)
          PY
          rm .github/workflows/rent-p1-typology-type-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/intent/RentIntentHubP1.tsx .github/workflows/rent-p1-typology-type-fix.yml
          git commit -m "fix(rent): use canonical Terrain taxonomy value"
          git push origin HEAD:ux/rent-p1-specialized-journey
