name: Q1D Publish Mubawab District Dictionary

on:
  push:
    branches: [data/q1d-normalized-features-fingerprints]
    paths:
      - '.github/workflows/q1d-publish-mubawab-district-dictionary.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      Q1D_ARTIFACT_ID: '10022063956'
      OUT: data/audits/q1d-mubawab-city-district-dictionary.csv
    steps:
      - uses: actions/checkout@v4
      - name: Download certified Q1D artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/q1d
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${Q1D_ARTIFACT_ID}/zip" \
            -o .tmp/q1d.zip
          unzip -q .tmp/q1d.zip -d .tmp/q1d
      - name: Build city-scoped dictionary
        run: |
          python - <<'PY'
          import csv, json, urllib.parse, collections
          from pathlib import Path

          src=Path('.tmp/q1d/manifest-q1d.jsonl')
          out=Path('${{ env.OUT }}')
          out.parent.mkdir(parents=True, exist_ok=True)
          pairs=collections.Counter()
          with src.open(encoding='utf-8') as f:
              for line in f:
                  o=json.loads(line)
                  if o.get('source_domain')!='mubawab.ma':
                      continue
                  ft=o.get('features') or {}
                  c=urllib.parse.unquote((ft.get('city') or '').strip().lower())
                  d=urllib.parse.unquote((ft.get('district') or '').strip().lower())
                  if c and d:
                      pairs[(c,d)] += 1
          generic={'centre','medina','ancienne medina','nouvelle ville','ville nouvelle','route','quartier','de la plage','administratif'}
          rows=[]
          for (c,d),n in pairs.items():
              city_equal=c==d
              generic_risk=d in generic
              specific=(not city_equal and not generic_risk and len(d)>=5)
              tier='SAFE_25' if specific and n>=25 else 'SAFE_10' if specific and n>=10 else 'SAFE_5' if specific and n>=5 else 'LOW_OR_RISK'
              rows.append((c,d,n,int(city_equal),int(generic_risk),tier))
          rows.sort(key=lambda x:(x[5],-x[2],x[0],x[1]))
          with out.open('w', newline='', encoding='utf-8') as f:
              w=csv.writer(f)
              w.writerow(['city','district','support','city_equals_district','generic_risk','tier'])
              w.writerows(rows)
          print('dictionary_rows=', len(rows))
          print('safe25=', sum(r[-1]=='SAFE_25' for r in rows))
          print('safe10=', sum(r[-1]=='SAFE_10' for r in rows))
          print('safe5=', sum(r[-1]=='SAFE_5' for r in rows))
          PY
      - name: Commit dictionary if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- "$OUT" && git ls-files --error-unmatch "$OUT" >/dev/null 2>&1; then
            echo 'No dictionary changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'data(q1d): publish Mubawab city district dictionary'
          git push
