name: AkarFinder - Q1A DATA4.9B Historical Robots Roots

on:
  push:
    paths:
      - "scripts/audits/candidate-lake-q1a-data49b-wayback-robots-availability.ts"
      - ".github/workflows/historical-gap-hunt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q1a-data49b-wayback-robots:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - domain: valfoncier.ma
            slug: valfoncier
          - domain: christiesrealestatemorocco.com
            slug: christies
          - domain: immo-maroc.com
            slug: immo-maroc
          - domain: agadirimmobilier.ma
            slug: agadirimmobilier
          - domain: proimmobilier.ma
            slug: proimmobilier
          - domain: capital-properties.ma
            slug: capital-properties
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      Q1A_DATA49B_DOMAIN: ${{ matrix.domain }}
      Q1A_DATA49B_ROBOTS_OUT: .tmp/candidate-lake-q1a-data49b-robots-${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Recover declared sitemap roots from archived robots only
        run: npx tsx scripts/audits/candidate-lake-q1a-data49b-wayback-robots-availability.ts
      - name: Verify archive-only fail-closed contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const dir=process.env.Q1A_DATA49B_ROBOTS_OUT;
          const p=JSON.parse(fs.readFileSync(`${dir}/summary.json`,'utf8'));
          if(p.readOnly!==true || p.databaseWrites!==0 || p.productionWrites!==0) throw new Error('write boundary violated');
          if(p.sourceSiteFetches!==0 || p.sourceContentFetches!==0 || p.detailPageFetches!==0 || p.warcFetches!==0) throw new Error('source/WARC boundary violated');
          if(p.archiveContentFetchesOnly!==true || p.vercelDeployments!==0) throw new Error('archive/deploy boundary violated');
          console.log(JSON.stringify({domain:p.domain,robotsUrl:p.robotsUrl,roots:p.distinctDeclaredSitemapRoots,observations:p.observations.map(o=>({target:o.target,snapshot:o.snapshot,declaredSitemaps:o.declaredSitemaps,error:o.error}))},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-lake-q1a-data49b-robots-${{ matrix.slug }}
          path: .tmp/candidate-lake-q1a-data49b-robots-${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 30
