name: Recovery V4.11 Wave8 Freeze Strict Route Certification

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/v4-11-wave8-input.json"

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate exact Wave8 input contract
        run: |
          node - <<'NODE'
          const x=require("./data/recovery/v4-11-wave8-input.json");
          if(!Number.isInteger(x.wave7_artifact_id)||x.wave7_artifact_id<=0)throw new Error("wave7 artifact");
          if(!/^[0-9a-f]{64}$/.test(x.wave7_jsonl_sha256||""))throw new Error("wave7 sha");
          if(!Number.isInteger(x.expected_rows)||x.expected_rows<=0)throw new Error("expected rows");
          if(!x.expected_by_domain||!Number.isInteger(x.expected_by_domain["mubawab.ma"])||!Number.isInteger(x.expected_by_domain["avito.ma"]))throw new Error("domain contract");
          if(x.production_neon_writes_authorized!==false||x.vercel_deployment_authorized!==false)throw new Error("scope contract");
          NODE

      - name: Download immutable Wave8 inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/freeze" "$RUNNER_TEMP/w6" "$RUNNER_TEMP/w7" data/audits/v4-11-wave8

          gh api repos/${{ github.repository }}/actions/artifacts/10869399865/zip > "$RUNNER_TEMP/freeze.zip"
          unzip -q -o "$RUNNER_TEMP/freeze.zip" -d "$RUNNER_TEMP/freeze"

          gh api repos/${{ github.repository }}/actions/artifacts/10932325027/zip > "$RUNNER_TEMP/w6.zip"
          unzip -q -o "$RUNNER_TEMP/w6.zip" -d "$RUNNER_TEMP/w6"

          W7_ARTIFACT="$(node -p 'require("./data/recovery/v4-11-wave8-input.json").wave7_artifact_id')"
          gh api "repos/${{ github.repository }}/actions/artifacts/$W7_ARTIFACT/zip" > "$RUNNER_TEMP/w7.zip"
          unzip -q -o "$RUNNER_TEMP/w7.zip" -d "$RUNNER_TEMP/w7"

      - name: Verify immutable hashes
        run: |
          set -euo pipefail
          echo "bb9799ca6a237db1de11837c7c6606809a3c669764b0c30f9cf92dcccc7adf6d  $RUNNER_TEMP/freeze/listing_representations.jsonl.gz" | sha256sum -c -
          echo "2849e79ab96ad644bde7c70ec277abb4a90be95effe53ba0726cdbccac6f8646  $RUNNER_TEMP/freeze/thin_index_search_documents.jsonl.gz" | sha256sum -c -
          echo "219b8bdfce8bd87eb049d06be42f32c0894850404f2e8d477d1f73a7b5d8cdcd  $RUNNER_TEMP/freeze/minimal_live_search_documents_v1.jsonl.gz" | sha256sum -c -
          echo "a90d0e5748adbdf881356340dcd1a37c678681ab21b62c625a570af488c8e596  $RUNNER_TEMP/freeze/listing_sources.jsonl.gz" | sha256sum -c -
          echo "0d623496d393e2adebcbe51be36a4604a006389fad09939161d979eb860e03b7  $RUNNER_TEMP/freeze/property_listings.jsonl.gz" | sha256sum -c -
          echo "63c76613ae09446afc43a887e45c0055d72840d4a262f6f5187f555f5c142539  $RUNNER_TEMP/w6/rejected.jsonl" | sha256sum -c -
          W7_SHA="$(node -p 'require("./data/recovery/v4-11-wave8-input.json").wave7_jsonl_sha256')"
          echo "$W7_SHA  $RUNNER_TEMP/w7/db-ready-wave7.jsonl" | sha256sum -c -

      - name: Certify Wave8 strict-route salvage
        run: |
          node scripts/recovery/certify-v4-11-wave8-freeze-strict-route.mjs             --wave6-rejected "$RUNNER_TEMP/w6/rejected.jsonl"             --wave7 "$RUNNER_TEMP/w7/db-ready-wave7.jsonl"             --freeze-dir "$RUNNER_TEMP/freeze"             --out-dir data/audits/v4-11-wave8

      - name: Verify Wave8 contract and invariants
        run: |
          node - <<'NODE'
          const fs=require("fs"),crypto=require("crypto");
          const x=require("./data/recovery/v4-11-wave8-input.json");
          const s=require("./data/audits/v4-11-wave8/summary.json");
          const b=fs.readFileSync("data/audits/v4-11-wave8/db-ready-wave8.jsonl");
          const rows=b.toString("utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const eq=(a,b,n)=>{if(a!==b)throw new Error(n+": "+a+" != "+b)};
          eq(s.db_ready_rows,x.expected_rows,"ready rows");
          eq(s.by_domain["mubawab.ma"],x.expected_by_domain["mubawab.ma"],"mubawab");
          eq(s.by_domain["avito.ma"],x.expected_by_domain["avito.ma"],"avito");
          eq(rows.length,x.expected_rows,"physical");
          eq(new Set(rows.map(r=>r.listing_url)).size,rows.length,"URL uniqueness");
          eq(new Set(rows.map(r=>r.canonical_fingerprint)).size,rows.length,"fingerprint uniqueness");
          eq(new Set(rows.map(r=>r.source_name+"|"+r.source_offer_key)).size,rows.length,"identity uniqueness");
          eq(crypto.createHash("sha256").update(b).digest("hex"),s.output_sha256,"sha");
          eq(s.approved_for_import_rows,0,"approval");
          eq(s.database_access,0,"db access");
          eq(s.database_writes,0,"db writes");
          eq(s.production_neon_writes,0,"prod writes");
          if(s.vercel_deployment!==false)throw new Error("vercel invariant");
          if(rows.some(r=>r.approved_for_import!==false))throw new Error("row approval invariant");
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-db-ready-wave8-freeze-strict-route
          path: data/audits/v4-11-wave8/
          retention-days: 30
