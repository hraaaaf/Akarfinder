name: Neighborhood Visual P1.5 Hay Riad Source Discovery

on:
  pull_request:
    paths:
      - ".github/workflows/neighborhood-visual-p1-5-hay-riad-source-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Hay Riad Commons candidates
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/audits/neighborhood-visual-p1-5-hay-riad/source-discovery"
          mkdir -p "$OUT"
          UA='AkarFinder-P1.5-Hay-Riad/1.0'
          declare -A FILES=(
            [signature]='Rabat hay ryad.jpg'
            [immobilier]='Hay Riad (335665610).jpg'
            [lifestyle]='Hay Riad (335665617).jpg'
          )
          for role in signature immobilier lifestyle; do
            f="${FILES[$role]}"
            enc=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$f")
            curl --fail --location --retry 5 --retry-all-errors --user-agent "$UA" "https://commons.wikimedia.org/wiki/Special:Redirect/file/$enc" -o "$OUT/$role.jpg"
            sha1sum "$OUT/$role.jpg"
            wc -c "$OUT/$role.jpg"
            file "$OUT/$role.jpg" || true
          done
          sha1sum "$OUT"/*.jpg > "$OUT/sha1.txt"
          wc -c "$OUT"/*.jpg > "$OUT/bytes.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: neighborhood-visual-p1-5-hay-riad-source-discovery
          path: data/audits/neighborhood-visual-p1-5-hay-riad/source-discovery
          if-no-files-found: error
          retention-days: 7
