name: Neighborhood Context L2 Contracts (NOT live coverage)

on:
  pull_request:
    paths:
      - "lib/neighborhood-context/**"
      - "lib/geo/casablanca-neighborhood-geometry-shadow.ts"
      - "scripts/neighborhood-context/**"
      - "scripts/scrapers/__tests__/neighborhood-context-l2-anchor-selection.test.ts"
      - "scripts/scrapers/__tests__/neighborhood-context-l1-l2-availability-gates.test.mjs"
      - "scripts/scrapers/__tests__/vivre-ici-maarif-source-claims-qa.test.mjs"
      - "scripts/scrapers/__tests__/vivre-ici-maarif-osm-admin-shadow.test.ts"
      - "scripts/scrapers/__tests__/vivre-ici-maarif-operator-map-hints-qa.test.mjs"
      - "lib/map/maarif-qa-reference-centers.ts"
      - ".github/workflows/neighborhood-context-l2-anchor-selection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  l2-deterministic-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: L2 deterministic assignments and fail-closed live-gate tests
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/neighborhood-context-l2-anchor-selection.test.ts
          scripts/scrapers/__tests__/neighborhood-context-l1-poi-registry.test.ts
          scripts/scrapers/__tests__/neighborhood-context-l1-l2-availability-gates.test.mjs
          scripts/scrapers/__tests__/vivre-ici-maarif-source-claims-qa.test.mjs
          scripts/scrapers/__tests__/vivre-ici-maarif-osm-admin-shadow.test.ts
          scripts/scrapers/__tests__/vivre-ici-maarif-operator-map-hints-qa.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Explicit scope of this status
        run: |
          echo "::notice title=Technical-only L2::Assignment tests passed. No live POI or quartier-coverage claim."
          echo "L2 LIVE ANCHORS: NOT ATTESTED. See Neighborhood Context L1 L2 Live Availability (main) for strict source gate." >> "$GITHUB_STEP_SUMMARY"
