## Doctrine active

`DISCOVERED ≠ AUDITED ≠ AUTHORIZED ≠ INGESTIBLE ≠ DISPLAYABLE`

`TECHNICAL CAPABILITY ≠ SOURCE PERMISSION`

Houzez, RealHomes, WordPress REST, sitemap ou JSON-LD ne créent aucun droit d’usage.

## Prochain lot DATA — DATA-1.6A

**Source Policy Evidence Review**, responsabilité read-only :

- robots/noindex observés et datés ;
- CGU, licence et restrictions de réutilisation ;
- consultation publique vs extraction/réutilisation ;
- canaux permis ;
- partenariat/consentement requis ;
- contact/claim possible ;
- `legal_review_required` si ambigu ;
- evidence URLs + résumé + dates ;
- recommandation de décision sans écriture Registry.

Gate : aucune policy finale, aucun connecteur activé, aucune ingestion dans 1.6A.

Ensuite seulement : **DATA-1.6B — Source Registry Assignment** sur le schéma existant.

## UX — handover

CARTE-QUARTIER-P1A.1 est mergé via PR #328. Prochaine étape indépendante : **P1A.2 — Search Geo Contract**, avec `district` structuré et `q` conservé comme texte libre.
""")

      - name: Commit docs-only result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-data-1-5-doc-handover.yml
          rm -f .github/workflows/temp-data-1-5-doc-handover-v2.yml
          git config user.name "AkarFinder Docs Handover"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: close DATA-1.5 and hand over DATA-1.6A"
          git push origin HEAD:docs/data-1-5-handover-20260807
