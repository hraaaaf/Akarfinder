name: UX-SEARCH-2 Compact Search Filters Certification

on:
  pull_request:
    branches: [main]
    paths:
      - "components/search/QuickFilters.tsx"
      - "components/search/SearchViewSwitcher.tsx"
      - "components/search/LightZillowSearchShell.tsx"
      - "app/search/search-density.css"
      - "scripts/audits/ux-search-compact-filters-2-visual.mjs"
      - ".github/workflows/ux-search-compact-filters-2.yml"
      - "docs/ROADMAP.md"
      - "docs/SESSION.md"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  product-design-reviewer:
    name: Product Design Reviewer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start > /tmp/ux-search-compact-2-reviewer.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ux-search-compact-2-reviewer.log
          exit 1
      - name: Assert compact controls and capture six viewports
        run: node scripts/audits/ux-search-compact-filters-2-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-search-compact-filters-2-product-design-proof
          path: |
            data/audits/ux-search-compact-filters-2
            /tmp/ux-search-compact-2-reviewer.log
          retention-days: 14
          if-no-files-found: error

  release-certifier:
    name: Independent Release Certifier
    needs: product-design-reviewer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start independent production server
        shell: bash
        run: |
          npm run start > /tmp/ux-search-compact-2-certifier.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ux-search-compact-2-certifier.log
          exit 1
      - name: Independently replay canonical Search certification
        run: node scripts/audits/ux-search-compact-filters-2-visual.mjs
      - name: Certify canonical replay receipt
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'data/audits/ux-search-compact-filters-2/final-canonical-replay/metrics.json';
          const proof = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (proof.failures?.length) throw new Error(proof.failures.join('\n'));
          if ((proof.machineScore ?? 0) < 9) throw new Error(`canonical machine score below gate: ${proof.machineScore}`);
          if (!Array.isArray(proof.viewports) || proof.viewports.length !== 6) throw new Error(`expected 6 canonical viewports, got ${proof.viewports?.length ?? 0}`);
          const expected = new Map([
            ['mobile-360x800', 2],
            ['mobile-390x844', 2],
            ['tablet-768x900', 2],
            ['desktop-1024x800', 3],
            ['desktop-1280x900', 4],
            ['desktop-1440x900', 4],
          ]);
          for (const [name, columns] of expected) {
            const result = proof.viewports.find((item) => item.name === name);
            if (!result) throw new Error(`missing canonical viewport ${name}`);
            if (result.columns !== columns) throw new Error(`${name}: expected ${columns} columns, got ${result.columns}`);
            if (result.overflow > 1) throw new Error(`${name}: horizontal overflow ${result.overflow}px`);
          }
          console.log('UX-SEARCH-2 RELEASE CERTIFIER: canonical replay PASS');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-search-compact-filters-2-release-certifier-proof
          path: |
            data/audits/ux-search-compact-filters-2
            /tmp/ux-search-compact-2-certifier.log
          retention-days: 14
          if-no-files-found: error
