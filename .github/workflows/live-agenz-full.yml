name: Live Agenz full

on:
  push:
    branches: [feat/agenz-source-first]
    paths:
      - '.github/workflows/live-agenz-full.yml'

concurrency:
  group: live-agenz-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agenz-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node --test scripts/acquisition/__tests__/agenz-source-first.test.mjs
      - name: Full safe public enumeration
        env:
          AGENZ_MAX_PAGES: '1000'
          AGENZ_MAX_LISTINGS: '50000'
        run: node scripts/acquisition/agenz-source-first.mjs
      - name: Verify complete report
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/morocco-web-l8-agenz/report.json','utf8'));
          if(r.zeroDbWrites!==true) throw new Error('zeroDbWrites != true');
          if(r.stoppedEarly) throw new Error(`stoppedEarly=${r.stoppedEarly}`);
          if(r.cappedByPages) throw new Error(`cappedByPages=true pageCount=${r.pageCount} queueRemaining=${r.queueRemaining}`);
          if(r.cappedByListings) throw new Error(`cappedByListings=true uniqueListingCount=${r.uniqueListingCount}`);
          if(r.queueRemaining!==0) throw new Error(`queueRemaining=${r.queueRemaining}`);
          if(r.uniqueListingCount<1) throw new Error(`uniqueListingCount=${r.uniqueListingCount}`);
          console.log(JSON.stringify({robotsStatus:r.robotsStatus,delayMs:r.delayMs,pageCount:r.pageCount,requestCount:r.requestCount,uniqueListingCount:r.uniqueListingCount,queueRemaining:r.queueRemaining,stoppedEarly:r.stoppedEarly,cappedByPages:r.cappedByPages,cappedByListings:r.cappedByListings,zeroDbWrites:r.zeroDbWrites},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agenz-full-enumeration
          path: artifacts/morocco-web-l8-agenz/
          if-no-files-found: error
          retention-days: 14
