name: Recovery V4.11 Wave5 Mubawab Strict Certification

on:
  push:
    branches: ["recovery/v4-11-wave5-mubawab-offline-20260927"]
    paths:
      - "data/recovery/activate-v4-11-wave5-mubawab-strict.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download certified inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ledger" "$RUNNER_TEMP/freeze" "$RUNNER_TEMP/wave2" data/audits/v4-11-wave5-strict
          gh api repos/${{ github.repository }}/actions/artifacts/10929097436/zip > "$RUNNER_TEMP/ledger.zip"
          unzip -q -o "$RUNNER_TEMP/ledger.zip" -d "$RUNNER_TEMP/ledger"
          gh api repos/${{ github.repository }}/actions/artifacts/10869399865/zip > "$RUNNER_TEMP/freeze.zip"
          unzip -q -o "$RUNNER_TEMP/freeze.zip" -d "$RUNNER_TEMP/freeze"
          gh api repos/${{ github.repository }}/actions/artifacts/10927304058/zip > "$RUNNER_TEMP/wave2.zip"
          unzip -q -o "$RUNNER_TEMP/wave2.zip" -d "$RUNNER_TEMP/wave2"
          test -s "$RUNNER_TEMP/ledger/existence-verified-v2.jsonl"
          test -s "$RUNNER_TEMP/wave2/db-ready-wave2.jsonl"

      - name: Strict consistency certification
        run: |
          node scripts/recovery/certify-v4-11-wave5-mubawab-strict.mjs             --ledger "$RUNNER_TEMP/ledger/existence-verified-v2.jsonl"             --freeze-dir "$RUNNER_TEMP/freeze"             --wave2 "$RUNNER_TEMP/wave2/db-ready-wave2.jsonl"             --output data/audits/v4-11-wave5-strict/db-ready-wave5-strict.jsonl             --rejects data/audits/v4-11-wave5-strict/rejects.jsonl             --summary data/audits/v4-11-wave5-strict/summary.json

      - name: Verify invariants
        run: |
          node - <<'NODE'
          const fs=require("fs"),crypto=require("crypto");
          const s=require("./data/audits/v4-11-wave5-strict/summary.json");
          const body=fs.readFileSync("data/audits/v4-11-wave5-strict/db-ready-wave5-strict.jsonl");
          const rows=body.toString("utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          if(s.verified_mubawab_rows!==60359)throw new Error("verified input");
          if(s.excluded_wave2_rows!==11897)throw new Error("wave2 exclusion");
          if(rows.length!==s.db_ready_rows)throw new Error("row count");
          if(rows.length<20000)throw new Error("unexpectedly low strict yield: "+rows.length);
          if(new Set(rows.map(r=>r.listing_url)).size!==rows.length)throw new Error("URL duplicate");
          if(new Set(rows.map(r=>r.canonical_fingerprint)).size!==rows.length)throw new Error("fingerprint duplicate");
          if(crypto.createHash("sha256").update(body).digest("hex")!==s.output_sha256)throw new Error("SHA");
          if(rows.some(r=>r.approved_for_import!==false))throw new Error("approval invariant");
          if(s.database_access!==0||s.database_writes!==0)throw new Error("DB invariant");
          console.log(JSON.stringify(s,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-db-ready-wave5-mubawab-strict
          path: data/audits/v4-11-wave5-strict/
          retention-days: 30
