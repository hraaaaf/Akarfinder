name: Neighborhood Context L1 Contracts (NOT live coverage)

on:
  pull_request:
    paths:
      - "lib/neighborhood-context/**"
      - "lib/geo/providers/overpass-nearby.ts"
      - "scripts/neighborhood-context/**"
      - "scripts/scrapers/__tests__/neighborhood-context-l1-poi-registry.test.ts"
      - "scripts/scrapers/__tests__/neighborhood-context-l1-l2-availability-gates.test.mjs"
      - "docs/NEIGHBORHOOD_CONTEXT_INTELLIGENCE_CANONICAL.md"
      - ".github/workflows/neighborhood-context-l1-poi-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  l1-deterministic-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: L1 deterministic registry and fail-closed live-gate tests
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/neighborhood-context-l1-poi-registry.test.ts
          scripts/scrapers/__tests__/neighborhood-context-l1-l2-availability-gates.test.mjs
          scripts/scrapers/__tests__/announcement-page-l6-living-here.test.ts
          scripts/scrapers/__tests__/announcement-page-l6-provider-adapters.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Explicit scope of this status
        run: |
          echo "::notice title=Technical-only L1::Deterministic tests passed. Live coverage was NOT tested or certified here."
          echo "L1 LIVE COVERAGE: NOT ATTESTED. See Neighborhood Context L1 L2 Live Availability (main) for strict external-source gate." >> "$GITHUB_STEP_SUMMARY"
