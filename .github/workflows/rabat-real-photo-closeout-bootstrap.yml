name: Rabat real-photo docs closeout bootstrap

on:
  push:
    branches:
      - docs/rabat-real-photo-library-1-closeout
    paths:
      - .github/workflows/rabat-real-photo-closeout-bootstrap.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/rabat-real-photo-library-1-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch canonical docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          # README.md
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          anchor = "Les **6 villes contextualisées** (Agadir, Marrakech, Casablanca, Rabat, Tanger, Fès) disposent désormais chacune de **12 variantes**, soit **72 IDs contextuels uniques**. Aucune nouvelle extension d'assets par ville ne doit être lancée sans mesure d'usage réelle."
          section = """### RABAT-REAL-PHOTO-LIBRARY-1 ✅ PR #468\n\nRabat dispose désormais d'une **bibliothèque séparée de 40 vraies photos Wikimedia Commons**, soit **8 photos × 5 quartiers structurés** : Agdal, Hay Riad, Souissi, Océan et Hassan. Cette bibliothèque ne modifie pas le catalogue historique d'illustrations : elle s'active uniquement lorsque `city=Rabat`, qu'un `listing.neighborhood` structuré correspond exactement à l'un des 5 quartiers et que la card est déjà en `fallback_visual`. Une photo du bien autorisée reste prioritaire ; quartier inconnu ou échec de chargement → artwork existant. Aucune inférence depuis titre, description ou snippet.\n\nLa sélection est déterministe par identité stable de l'annonce. Chaque card affiche `Rabat • Quartier`, `Photo d’ambiance` et un lien `Crédit & licence · Wikimedia Commons`. L'identité AkarFinder est appliquée uniquement au rendu CSS ; le fichier Commons reste intact.\n\nCertification : head `3de085a2058862edc52bab4fe0dcd3aca04a4f4c`, **29/29 workflows exact-head SUCCESS**, gate spécialisé PASS, **40/40 sources + licences Commons** vérifiées, TypeScript + build PASS. Chromium **360×800 / 390×844 / 768×900 / 1280×900 / 1440×900** : 10/10 photos chargées sur la cohorte visuelle, reload stable, 0 clipping, 0 overflow, mobile **2 colonnes**. Audit visuel humain **9,2/10**, Reviewer PASS, Release Certifier GO. Merge `2585017ea377d72b3a54ca1083dbf1b609899ad9`, post-merge `main` vérifié.\n\n""" + anchor
          text = replace_once(text, anchor, section, 'README insert Rabat closeout')
          old_next = "Prochain lot UX/Search : **CONTEXTUAL-ILLUSTRATIONS-COVERAGE-AUDIT-1** — audit read-only de la couverture réellement rendue dans Search : thumbnail autorisée vs `city_type` vs `city` vs fallback type vs neutre, distribution ville/type, répétition effective et demande hors des 6 villes. **0 nouvel asset / 0 DATA / 0 Registry / 0 ranking / 0 Map / district OFF**. Le prochain lot de création visuelle devra être décidé uniquement depuis cette preuve."
          new_next = "Prochain lot UX/Search : **CONTEXTUAL-ILLUSTRATIONS-COVERAGE-AUDIT-1** — audit read-only de la couverture réellement rendue dans Search après #468 : thumbnail autorisée vs **Rabat real-photo district** vs `city_type` vs `city` vs fallback type vs neutre, distribution ville/type/quartier, répétition effective et taux d'échec des photos distantes. **0 nouvel asset / 0 DATA / 0 Registry / 0 ranking / 0 Map**. Le tier district du catalogue d'illustrations historique reste OFF ; seule la bibliothèque Rabat bornée utilise le signal structuré `listing.neighborhood`."
          text = replace_once(text, old_next, new_next, 'README next lot')
          path.write_text(text, encoding='utf-8')

          # docs/ROADMAP.md
          path = Path('docs/ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          old_status = "CONTEXTUAL-ILLUSTRATIONS-SCALE-2 ✅ PR #453 ; BENCHMARK-SERP-1 convergence ✅ COMPLETE"
          new_status = "CONTEXTUAL-ILLUSTRATIONS-SCALE-2 ✅ PR #453 ; RABAT-REAL-PHOTO-LIBRARY-1 ✅ PR #468 ; BENCHMARK-SERP-1 convergence ✅ COMPLETE"
          text = replace_once(text, old_status, new_status, 'ROADMAP status')
          anchor = "Les 6 villes contextualisées disposent désormais chacune de **12 variantes = 72 IDs contextuels uniques**."
          section = """## RABAT-REAL-PHOTO-LIBRARY-1 ✅ CLOSED — PR #468\n\nResponsabilité unique : **ajouter un fallback photo réel, séparé et borné pour 5 quartiers structurés de Rabat, sans modifier ranking, DATA, Registry, Map, dédup ni le catalogue d'illustrations historique**.\n\nRésultat certifié :\n\n- **40 vraies photos Wikimedia Commons = 8 × 5 quartiers** : Agdal, Hay Riad, Souissi, Océan, Hassan ;\n- activation uniquement sur `city=Rabat` + `listing.neighborhood` structuré reconnu + `fallback_visual` ;\n- thumbnail/photo du bien autorisée reste prioritaire ; échec photo ou quartier inconnu → artwork historique ;\n- aucune inférence titre/description/snippet ; sélection déterministe et stable au reload ;\n- disclosure visible `Rabat • Quartier` + `Photo d’ambiance` + `Crédit & licence · Wikimedia Commons` ;\n- **40/40 fichiers + licences Commons** validés par MediaWiki ;\n- exact-head `3de085a2058862edc52bab4fe0dcd3aca04a4f4c` : **29/29 workflows SUCCESS**, predecessors Search/illustrations PASS, TypeScript + build PASS ;\n- Chromium **360×800 / 390×844 / 768×900 / 1280×900 / 1440×900** : 10/10 photos chargées, reload stable, 0 clipping, 0 overflow, **2 colonnes mobile** ;\n- audit visuel humain **9,2/10**, Reviewer PASS, Release Certifier GO ;\n- merge `2585017ea377d72b3a54ca1083dbf1b609899ad9`, post-merge `main` vérifié.\n\n""" + anchor
          text = replace_once(text, anchor, section, 'ROADMAP insert Rabat closeout')
          old_next = "**Prochain lot UX/Search : CONTEXTUAL-ILLUSTRATIONS-COVERAGE-AUDIT-1.** Audit read-only de la couverture de rendu réelle avant toute nouvelle création d'assets : thumbnail autorisée / `city_type` / `city` / fallback type / neutre, distribution ville/type, répétition effective et demande hors des 6 villes. Aucun nouvel asset ni changement DATA/Registry/ranking/Map ; district reste OFF."
          new_next = "**Prochain lot UX/Search : CONTEXTUAL-ILLUSTRATIONS-COVERAGE-AUDIT-1.** Audit read-only de la couverture de rendu réelle après #468 : thumbnail autorisée / **Rabat real-photo district** / `city_type` / `city` / fallback type / neutre, distribution ville/type/quartier, répétition effective et taux d'échec des photos distantes. Aucun nouvel asset ni changement DATA/Registry/ranking/Map. Le district du catalogue d'illustrations historique reste OFF ; le signal quartier est utilisé uniquement par la bibliothèque Rabat bornée."
          text = replace_once(text, old_next, new_next, 'ROADMAP next lot')
          old_action = "Exécuter **CONTEXTUAL-ILLUSTRATIONS-COVERAGE-AUDIT-1** uniquement : audit read-only de la couverture réelle des fallbacks visuels Search après #453. Mesurer par ville/type la part thumbnail autorisée, `city_type`, `city`, fallback type et neutre ; mesurer la répétition effective et les villes hors allowlist qui justifieraient un futur asset lot. **0 nouvel asset, 0 DATA/Registry/ranking/eligibility/dedupe/Map, district OFF.** Le prochain build visuel doit être décidé depuis ces preuves, pas par intuition."
          new_action = "Exécuter **CONTEXTUAL-ILLUSTRATIONS-COVERAGE-AUDIT-1** uniquement : audit read-only de la couverture réelle des fallbacks visuels Search après #468. Mesurer par ville/type/quartier la part thumbnail autorisée, **Rabat real-photo district**, `city_type`, `city`, fallback type et neutre ; mesurer répétition effective, stabilité et taux d'échec des photos distantes. **0 nouvel asset, 0 DATA/Registry/ranking/eligibility/dedupe/Map.** Le district du catalogue d'illustrations historique reste OFF ; le prochain build visuel doit être décidé depuis ces preuves, pas par intuition."
          text = replace_once(text, old_action, new_action, 'ROADMAP exact next action')
          path.write_text(text, encoding='utf-8')

          # docs/SESSION.md
          path = Path('docs/SESSION.md')
          text = path.read_text(encoding='utf-8')
          scale2_bullet = "- Artefact SCALE-2 #453 : `sha256:85659a415e52e28d4258b152fc26ea43dd726d16203e23b3941efb3a6d4ad564`."
          inserted = scale2_bullet + "\n- `RABAT-REAL-PHOTO-LIBRARY-1` ✅ : PR #468, exact-head `3de085a2058862edc52bab4fe0dcd3aca04a4f4c`, **29/29 workflows exact-head SUCCESS**, **40/40 sources + licences Commons** vérifiées, TypeScript + build PASS, Chromium **360×800 / 390×844 / 768×900 / 1280×900 / 1440×900**, 10/10 photos chargées, reload stable, 0 clipping/overflow, mobile **2 colonnes**, audit visuel **9,2/10**, Reviewer PASS, Release Certifier GO, merge `2585017ea377d72b3a54ca1083dbf1b609899ad9`.\n- Rabat real-photo : **40 vraies photos = 8 × Agdal/Hay Riad/Souissi/Océan/Hassan** ; bibliothèque séparée, activation uniquement sur signal `listing.neighborhood` structuré + `fallback_visual`, sans inférence texte."
          text = replace_once(text, scale2_bullet, inserted, 'SESSION canonical truth insert')
          old_next = "- Prochain LOT UX/Search : **CONTEXTUAL-ILLUSTRATIONS-COVERAGE-AUDIT-1**, read-only ; mesurer couverture/répétition réelle avant tout nouvel asset. District reste OFF."
          new_next = "- Prochain LOT UX/Search : **CONTEXTUAL-ILLUSTRATIONS-COVERAGE-AUDIT-1**, read-only ; mesurer couverture/répétition réelle **après #468**, y compris le tier Rabat real-photo et son taux d'échec distant, avant tout nouvel asset. Le district du catalogue d'illustrations historique reste OFF."
          text = replace_once(text, old_next, new_next, 'SESSION next lot canonical truth')
          old_heading = "## UX/Search — illustrations contextuelles SCALE-2 certifiées ✅"
          new_heading = "## UX/Search — illustrations contextuelles + Rabat real-photo certifiées ✅"
          text = replace_once(text, old_heading, new_heading, 'SESSION UX heading')
          old_district = "- District toujours inactif tant que Search n'expose pas un signal structuré certifié."
          new_district = "- Le tier `district` du catalogue d'illustrations historique reste inactif. **Exception bornée et séparée** : Rabat real-photo consomme uniquement `listing.neighborhood` structuré pour Agdal, Hay Riad, Souissi, Océan et Hassan."
          text = replace_once(text, old_district, new_district, 'SESSION district truth')
          old_disclosure = "- Disclosure publique uniforme : `Illustration`; aucun visuel n'est présenté comme une photo réelle de l'annonce."
          new_disclosure = "- Disclosure illustrations historiques : `Illustration`. Pour Rabat real-photo : `Photo d’ambiance` + `Rabat • Quartier` + crédit/licence Commons ; aucune photo d'ambiance n'est présentée comme une photo réelle de l'annonce."
          text = replace_once(text, old_disclosure, new_disclosure, 'SESSION disclosure')
          old_cert = "- Certification SCALE-2 : **36/36 IDs Rabat/Tanger/Fès**, **22/22 workflows**, 5 viewports Chromium, lazy-load hydraté, 0 clipping/overflow, UX **9,3/10**."
          new_cert = old_cert + "\n- Certification Rabat real-photo #468 : **40/40 Commons**, **29/29 workflows**, 5 viewports Chromium, 10/10 photos chargées, reload stable, 0 clipping/overflow, mobile 2 colonnes, UX **9,2/10**."
          text = replace_once(text, old_cert, new_cert, 'SESSION cert')
          old_decision = "- Prochaine décision : **coverage audit read-only**, pas de nouveau pack d'assets par intuition."
          new_decision = "- Prochaine décision : **coverage audit read-only** incluant le tier Rabat real-photo ; pas de nouveau pack d'assets par intuition."
          text = replace_once(text, old_decision, new_decision, 'SESSION next decision')
          old_other = "- UX/Search : `CONTEXTUAL-ILLUSTRATIONS-SCALE-2` ✅ #453 ; prochain LOT = **CONTEXTUAL-ILLUSTRATIONS-COVERAGE-AUDIT-1** read-only ; Search reste canonique."
          new_other = "- UX/Search : `CONTEXTUAL-ILLUSTRATIONS-SCALE-2` ✅ #453 + `RABAT-REAL-PHOTO-LIBRARY-1` ✅ #468 ; prochain LOT = **CONTEXTUAL-ILLUSTRATIONS-COVERAGE-AUDIT-1** read-only ; Search reste canonique."
          text = replace_once(text, old_other, new_other, 'SESSION other lanes')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove bootstrap workflow from final tree
        run: rm .github/workflows/rabat-real-photo-closeout-bootstrap.yml
      - name: Commit canonical closeout
        shell: bash
        run: |
          git config user.name "AkarFinder Release Certifier"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md .github/workflows/rabat-real-photo-closeout-bootstrap.yml
          git diff --cached --check
          git commit -m "Close out RABAT-REAL-PHOTO-LIBRARY-1 docs"
          git push origin HEAD:docs/rabat-real-photo-library-1-closeout
