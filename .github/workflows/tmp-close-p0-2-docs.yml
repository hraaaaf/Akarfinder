name: Temporary P0.2 docs closeout

on:
  push:
    branches: [docs/close-p0-2]
    paths:
      - ".github/workflows/tmp-close-p0-2-docs.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/close-p0-2

      - name: Update canonical MDs and self-delete
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          readme = Path('README.md')
          r = readme.read_text()
          anchor = '### DATA-4 — Reservoir Strategy\n'
          if anchor not in r:
              raise SystemExit('README DATA-4 anchor missing')
          p02 = '''### P0.2 — Common Crawl Discovery Coverage Audit ✅ CLOSED — PR #398\n\nP0.2 ne refait pas le census DATA-1.3B : il mesure le delta opérationnel entre les policies production autorisant `commoncrawl` et la readiness structurelle exigée par le harvester (`approved_discovery` + résultat web externe + pattern de listing).\n\nPreuve live read-only : **28** policies déclarent `commoncrawl`, **27** sont opérationnelles, **9** sont `HARVEST_READY`, **18** sont `POLICY_ALLOWED_PATTERN_MISSING`, **1** est `POLICY_EXPIRED_OR_BLOCKED` (`marrakechrealty.com`). Couverture structurelle : **33,33 %**. Les sources policy-déclarées portent **40 809** seeds Common Crawl ; les **18 pattern-missing portent 0 seed**. Deux sources harvest-ready (`1immo.ma`, `barnes-marrakech.com`) sont encore à 0 seed.\n\nContrat : **0 requête Common Crawl**, **0 requête source-site**, **0 WARC fetch**, **0 mutation DB**, **0 activation policy/source**. Exact-head : **20/20 workflows verts** ; Reviewer **PASS 9,4/10** ; Release Certifier **GO** ; merge `9112cbf02fef2ada2d0eb0785ec872fe630e293f` ; gate post-merge P0.2 PASS.\n\nProchain lot mass-index : **P0.3 — Common Crawl Pattern Evidence**. Il doit produire des preuves de patterns à partir de l’URL-index Common Crawl existant, sans WARC content par défaut et sans auto-activation.\n\n'''
          readme.write_text(r.replace(anchor, p02 + anchor, 1))
          replace_once('README.md',
              '**DATA-4.4C et P0.1 sont fermés et certifiés en production.** Le micro-lot reconciler #396 est également fermé. P0.1 n’autorise aucune expansion automatique, aucun nouveau scraper direct et aucune évolution de policy. Le prochain LOT mass-index doit être défini explicitement à partir de cette base certifiée.',
              '**DATA-4.4C, P0.1 et P0.2 sont fermés et certifiés.** Le micro-lot reconciler #396 est également fermé. P0.2 mesure un gap réel de readiness mais n’autorise aucune expansion automatique, aucun nouveau scraper direct et aucune évolution de policy. Prochain lot mass-index : **P0.3 — Common Crawl Pattern Evidence**, borné et offline-first sur l’URL-index existant.')

          replace_once('docs/ROADMAP.md',
              '**Statut : UX/Carte P1B.4 ✅ production certifiée ; BENCHMARK-SERP-1 ✅ ; SEARCH-UX-FAST-1 ✅ PR #390 ; SEARCH-WORDING-PURITY-1 ✅ PR #391 ; SEARCH-CONTINUOUS-FLOW-1 ✅ PR #393 ; SEARCH-MOBILE-CARD-GRID-1 ✅ PR #394 ; prochain lot UX Search = PRICE-COVERAGE-RECOVERY-1 ; couche Offre quartier OFF ; DATA-4.4C ✅ ; P0.1 Mass Index Source Registry ✅ CLOSED ; freshness reconciler hardening ✅ PR #396**',
              '**Statut : UX/Carte P1B.4 ✅ production certifiée ; BENCHMARK-SERP-1 ✅ ; SEARCH-UX-FAST-1 ✅ PR #390 ; SEARCH-WORDING-PURITY-1 ✅ PR #391 ; SEARCH-CONTINUOUS-FLOW-1 ✅ PR #393 ; SEARCH-MOBILE-CARD-GRID-1 ✅ PR #394 ; prochain lot UX Search = PRICE-COVERAGE-RECOVERY-1 ; couche Offre quartier OFF ; DATA-4.4C ✅ ; P0.1 ✅ ; P0.2 Common Crawl Discovery Coverage ✅ CLOSED ; freshness reconciler hardening ✅ PR #396**')
          roadmap = Path('docs/ROADMAP.md')
          rr = roadmap.read_text()
          anchor2 = '# 8. DATA-4 — Reservoir Strategy\n'
          if anchor2 not in rr:
              raise SystemExit('ROADMAP DATA-4 anchor missing')
          p02r = '''# 7.2 P0.2 — Common Crawl Discovery Coverage Audit ✅ CLOSED — PR #398\n\nResponsabilité unique : **mesurer le gap entre policy Common Crawl production et readiness structurelle du harvester**, sans refaire DATA-1.3B et sans acquisition.\n\nPreuve live read-only : **28** policies `commoncrawl`, **27** opérationnelles, **9** `HARVEST_READY`, **18** `POLICY_ALLOWED_PATTERN_MISSING`, **1** expirée/bloquée ; ratio harvest-ready **33,33 %**. Les policies concernées portent **40 809** seeds ; les **18 pattern-missing portent 0 seed**. Deux sources harvest-ready sont encore à 0 seed.\n\nContrat permanent P0.2 : 0 Common Crawl request, 0 source-site request, 0 WARC fetch, 0 DB mutation, 0 policy/source activation. Certification : **20/20 workflows exact-head verts**, Reviewer **PASS 9,4/10**, Release Certifier **GO**, merge `9112cbf02fef2ada2d0eb0785ec872fe630e293f`, gate spécialisée post-merge PASS.\n\nP0.2 ne dérive ni n’active aucun pattern. Le prochain lot est **P0.3 — Common Crawl Pattern Evidence** : produire offline-first des preuves de structure d’URL sur la cohorte des 18 sources, à partir de l’URL-index Common Crawl existant ; WARC/content uniquement si un besoin ultérieur distinct est démontré.\n\n'''
          roadmap.write_text(rr.replace(anchor2, p02r + anchor2, 1))
          replace_once('docs/ROADMAP.md',
              '**P0.1 est CLOSED.** Définir explicitement le prochain LOT mass-index à partir de la base certifiée avant toute nouvelle acquisition/expansion. Aucun nouveau scraper/source direct, aucune activation de source et aucune expansion automatique ne sont autorisés implicitement par P0.1.',
              '**P0.1 et P0.2 sont CLOSED.** Exécuter ensuite **P0.3 — Common Crawl Pattern Evidence** uniquement : audit offline-first de la cohorte `POLICY_ALLOWED_PATTERN_MISSING` sur l’URL-index existant, sans WARC par défaut, sans nouveau scraper/source direct, sans activation de source et sans expansion automatique.')

          replace_once('docs/SESSION.md',
              '**Lane DATA : DATA-4.4C ✅ ; P0.1 Mass Index Source Registry ✅ CLOSED ; freshness reconciler hardening ✅ #396 ; prochain LOT mass-index à définir explicitement**',
              '**Lane DATA : DATA-4.4C ✅ ; P0.1 ✅ ; P0.2 Common Crawl Discovery Coverage ✅ CLOSED ; freshness reconciler hardening ✅ #396 ; prochain LOT = P0.3 Pattern Evidence**')
          replace_once('docs/SESSION.md',
              'Base du closeout DATA : `main` `6816e5e7bc4dbfe3c253cfe5da38175a5390606d` — merge PR #396.',
              'Base du closeout DATA : `main` `9112cbf02fef2ada2d0eb0785ec872fe630e293f` — merge PR #398.')
          replace_once('docs/SESSION.md',
              '- freshness reconciler hardening ✅ #396 — retry transitoire borné, diagnostics PostgREST explicites, concurrence PATCH 25→5.',
              '- freshness reconciler hardening ✅ #396 — retry transitoire borné, diagnostics PostgREST explicites, concurrence PATCH 25→5.\n- P0.2 ✅ #398 — coverage audit read-only : 27 policies Common Crawl opérationnelles, 9 harvest-ready, 18 pattern-missing, ratio 33,33 %, 0 seed sur la cohorte manquante.')
          session = Path('docs/SESSION.md')
          s = session.read_text()
          anchor3 = '# UX / Search — état court\n'
          if anchor3 not in s:
              raise SystemExit('SESSION UX anchor missing')
          p02s = '''# P0.2 — Common Crawl Discovery Coverage Audit ✅ CLOSED — PR #398\n\nP0.2 mesure uniquement le delta entre `public.source_policy_registry` et la readiness structurelle du harvester. DATA-1.3B reste le census national existant.\n\nPreuve production read-only :\n\n- **28** policies déclarent `commoncrawl` ;\n- **27** sont opérationnelles ;\n- **9** `HARVEST_READY` ;\n- **18** `POLICY_ALLOWED_PATTERN_MISSING` ;\n- **1** `POLICY_EXPIRED_OR_BLOCKED` (`marrakechrealty.com`) ;\n- ratio ready **33,33 %** ;\n- **40 809** seeds sur les sources policy-déclarées ;\n- cohorte des **18 pattern-missing = 0 seed** ;\n- `1immo.ma` et `barnes-marrakech.com` sont harvest-ready mais encore à 0 seed.\n\nSécurité : `commoncrawl_request=false`, `source_site_request=false`, `warc_fetch=false`, `db_mutation=false`. **20/20 exact-head PASS**, Reviewer **9,4/10**, Certifier GO, merge `9112cbf02fef2ada2d0eb0785ec872fe630e293f`, post-merge gate PASS.\n\nProchain lot : **P0.3 — Common Crawl Pattern Evidence**, offline-first sur l’URL-index existant ; aucune activation automatique et aucun WARC par défaut.\n\n'''
          session.write_text(s.replace(anchor3, p02s + anchor3, 1))
          replace_once('docs/SESSION.md',
              'DATA-4.4C et P0.1 sont fermés. Le reconciler #396 est fermé. **Définir explicitement le prochain LOT mass-index à partir de cette base certifiée** avant toute nouvelle acquisition ou expansion. Aucun nouveau scraper/source direct ni aucune activation ne sont autorisés implicitement.',
              'DATA-4.4C, P0.1 et P0.2 sont fermés. Le reconciler #396 est fermé. **Prochain LOT mass-index : P0.3 — Common Crawl Pattern Evidence**, strictement offline-first sur l’URL-index existant. Aucun nouveau scraper/source direct, aucune activation implicite et aucune expansion automatique.')

          Path('.github/workflows/tmp-close-p0-2-docs.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md .github/workflows/tmp-close-p0-2-docs.yml
          git commit -m "docs: close P0.2 and set P0.3 handover"
          git push origin HEAD:docs/close-p0-2
