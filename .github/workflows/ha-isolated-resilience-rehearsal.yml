name: HA Isolated Replication Resilience Rehearsal

# AKARFINDER-HA-RESILIENCE-20260924
# Disposable PostgreSQL 17 only. No provider secrets, no production DB.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - infra/neon-migration-20260923
    paths:
      - ".github/workflows/ha-isolated-resilience-rehearsal.yml"
      - "scripts/scrapers/__tests__/ha-isolated-resilience-workflow-guard.test.ts"

permissions:
  contents: read

concurrency:
  group: ha-isolated-resilience-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_IMAGE: postgres:17
      PG_PASSWORD: akarfinder-ha-resilience-only
      NETWORK: akarfinder-ha-resilience
      SOURCE: akarfinder-ha-resilience-source
      TARGET: akarfinder-ha-resilience-target
      REHEARSAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Start isolated PostgreSQL 17 nodes
        shell: bash
        run: |
          set -euo pipefail
          docker network create "$NETWORK"
          for node in "$SOURCE" "$TARGET"; do
            docker run -d --rm \
              --name "$node" \
              --network "$NETWORK" \
              -e POSTGRES_PASSWORD="$PG_PASSWORD" \
              -e POSTGRES_DB=postgres \
              "$PG_IMAGE" postgres \
                -c wal_level=logical \
                -c max_replication_slots=10 \
                -c max_wal_senders=10 \
                -c max_logical_replication_workers=10
          done
          for node in "$SOURCE" "$TARGET"; do
            for attempt in $(seq 1 30); do
              docker exec "$node" pg_isready -U postgres -d postgres >/dev/null 2>&1 && break
              [ "$attempt" -eq 30 ] && { echo "::error::$node did not become ready"; exit 1; }
              sleep 1
            done
          done

      - name: Create matching canary schema and seed baselines
        shell: bash
        run: |
          set -euo pipefail
          for node in "$SOURCE" "$TARGET"; do
            docker exec -i "$node" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create table public.akarfinder_ha_resilience_canary (
            id uuid primary key,
            payload text not null,
            version integer not null check (version >= 1),
            updated_at timestamptz not null
          );
          alter table public.akarfinder_ha_resilience_canary replica identity default;
          insert into public.akarfinder_ha_resilience_canary (id,payload,version,updated_at) values
            ('10000000-0000-4000-8000-000000000001','forward-update-v1',1,clock_timestamp()),
            ('10000000-0000-4000-8000-000000000002','forward-delete-v1',1,clock_timestamp()),
            ('20000000-0000-4000-8000-000000000001','reverse-update-v1',1,clock_timestamp()),
            ('20000000-0000-4000-8000-000000000002','reverse-delete-v1',1,clock_timestamp());
          SQL
          done

      - name: Establish forward replication
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$SOURCE" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "create publication ha_resilience_forward_pub for table public.akarfinder_ha_resilience_canary;"
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "create subscription ha_resilience_forward_sub
                connection 'host=$SOURCE port=5432 dbname=postgres user=postgres password=$PG_PASSWORD sslmode=disable'
                publication ha_resilience_forward_pub
                with (copy_data=false, origin=none);"

      - name: Prove forward interruption and catch-up
        shell: bash
        run: |
          set -euo pipefail
          insert_id="10000000-0000-4000-8000-000000000003"
          update_id="10000000-0000-4000-8000-000000000001"
          delete_id="10000000-0000-4000-8000-000000000002"

          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "alter subscription ha_resilience_forward_sub disable;"
          forward_pause_lsn="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt -c "select pg_current_wal_lsn();")"

          docker exec -i "$SOURCE" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<SQL
          insert into public.akarfinder_ha_resilience_canary values
            ('$insert_id','forward-insert-v1',1,clock_timestamp());
          update public.akarfinder_ha_resilience_canary
            set payload='forward-update-v2', version=2, updated_at=clock_timestamp()
            where id='$update_id';
          delete from public.akarfinder_ha_resilience_canary where id='$delete_id';
          SQL

          stale_insert="$(docker exec "$TARGET" psql -U postgres -d postgres -X -qAt -c "select count(*) from public.akarfinder_ha_resilience_canary where id='$insert_id';")"
          stale_update="$(docker exec "$TARGET" psql -U postgres -d postgres -X -qAt -c "select payload||':'||version from public.akarfinder_ha_resilience_canary where id='$update_id';")"
          stale_delete="$(docker exec "$TARGET" psql -U postgres -d postgres -X -qAt -c "select count(*) from public.akarfinder_ha_resilience_canary where id='$delete_id';")"
          [ "$stale_insert" = "0" ] && [ "$stale_update" = "forward-update-v1:1" ] && [ "$stale_delete" = "1" ] || {
            echo "::error::forward pause did not preserve stale target state"; exit 1;
          }

          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "alter subscription ha_resilience_forward_sub enable;"

          for attempt in $(seq 1 30); do
            got_insert="$(docker exec "$TARGET" psql -U postgres -d postgres -X -qAt -c "select payload||':'||version from public.akarfinder_ha_resilience_canary where id='$insert_id';")"
            got_update="$(docker exec "$TARGET" psql -U postgres -d postgres -X -qAt -c "select payload||':'||version from public.akarfinder_ha_resilience_canary where id='$update_id';")"
            got_delete="$(docker exec "$TARGET" psql -U postgres -d postgres -X -qAt -c "select count(*) from public.akarfinder_ha_resilience_canary where id='$delete_id';")"
            [ "$got_insert" = "forward-insert-v1:1" ] && [ "$got_update" = "forward-update-v2:2" ] && [ "$got_delete" = "0" ] && break
            [ "$attempt" -eq 30 ] && { echo "::error::forward catch-up failed"; exit 1; }
            sleep 1
          done

          forward_catchup_lsn="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt -c "select pg_current_wal_lsn();")"
          printf 'FORWARD_PAUSE_LSN=%s\nFORWARD_CATCHUP_LSN=%s\n' "$forward_pause_lsn" "$forward_catchup_lsn" >> "$RUNNER_TEMP/ha-resilience.env"

      - name: Establish reverse replication
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "create publication ha_resilience_reverse_pub for table public.akarfinder_ha_resilience_canary;"
          docker exec "$SOURCE" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "create subscription ha_resilience_reverse_sub
                connection 'host=$TARGET port=5432 dbname=postgres user=postgres password=$PG_PASSWORD sslmode=disable'
                publication ha_resilience_reverse_pub
                with (copy_data=false, origin=none);"
          suborigin="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt -c "select suborigin from pg_subscription where subname='ha_resilience_reverse_sub';")"
          [ "$suborigin" = "none" ] || { echo "::error::reverse origin filter is not none"; exit 1; }

      - name: Prove reverse interruption idempotent catch-up and anti-loop
        shell: bash
        run: |
          set -euo pipefail
          insert_id="20000000-0000-4000-8000-000000000003"
          update_id="20000000-0000-4000-8000-000000000001"
          delete_id="20000000-0000-4000-8000-000000000002"

          docker exec "$SOURCE" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "alter subscription ha_resilience_reverse_sub disable;"
          reverse_pause_lsn="$(docker exec "$TARGET" psql -U postgres -d postgres -X -qAt -c "select pg_current_wal_lsn();")"

          docker exec -i "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<SQL
          insert into public.akarfinder_ha_resilience_canary values
            ('$insert_id','reverse-insert-v1',1,clock_timestamp());
          update public.akarfinder_ha_resilience_canary
            set payload='reverse-update-v2', version=2, updated_at=clock_timestamp()
            where id='$update_id';
          delete from public.akarfinder_ha_resilience_canary where id='$delete_id';
          SQL

          stale_insert="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt -c "select count(*) from public.akarfinder_ha_resilience_canary where id='$insert_id';")"
          stale_update="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt -c "select payload||':'||version from public.akarfinder_ha_resilience_canary where id='$update_id';")"
          stale_delete="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt -c "select count(*) from public.akarfinder_ha_resilience_canary where id='$delete_id';")"
          [ "$stale_insert" = "0" ] && [ "$stale_update" = "reverse-update-v1:1" ] && [ "$stale_delete" = "1" ] || {
            echo "::error::reverse pause did not preserve stale source state"; exit 1;
          }

          docker exec "$SOURCE" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "alter subscription ha_resilience_reverse_sub enable;"

          for attempt in $(seq 1 30); do
            got_insert="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt -c "select payload||':'||version from public.akarfinder_ha_resilience_canary where id='$insert_id';")"
            got_update="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt -c "select payload||':'||version from public.akarfinder_ha_resilience_canary where id='$update_id';")"
            got_delete="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt -c "select count(*) from public.akarfinder_ha_resilience_canary where id='$delete_id';")"
            [ "$got_insert" = "reverse-insert-v1:1" ] && [ "$got_update" = "reverse-update-v2:2" ] && [ "$got_delete" = "0" ] && break
            [ "$attempt" -eq 30 ] && { echo "::error::reverse catch-up failed"; exit 1; }
            sleep 1
          done

          sleep 2
          source_insert_count="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt -c "select count(*) from public.akarfinder_ha_resilience_canary where id='$insert_id';")"
          target_insert_count="$(docker exec "$TARGET" psql -U postgres -d postgres -X -qAt -c "select count(*) from public.akarfinder_ha_resilience_canary where id='$insert_id';")"
          [ "$source_insert_count" = "1" ] && [ "$target_insert_count" = "1" ] || {
            echo "::error::reverse anti-loop duplicate/conflict proof failed"; exit 1;
          }

          reverse_catchup_lsn="$(docker exec "$TARGET" psql -U postgres -d postgres -X -qAt -c "select pg_current_wal_lsn();")"
          printf 'REVERSE_PAUSE_LSN=%s\nREVERSE_CATCHUP_LSN=%s\n' "$reverse_pause_lsn" "$reverse_catchup_lsn" >> "$RUNNER_TEMP/ha-resilience.env"

      - name: Verify replication workers healthy
        shell: bash
        run: |
          set -euo pipefail
          forward_pid="$(docker exec "$TARGET" psql -U postgres -d postgres -X -qAt -c "select coalesce(pid::text,'') from pg_stat_subscription where subname='ha_resilience_forward_sub';")"
          reverse_pid="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt -c "select coalesce(pid::text,'') from pg_stat_subscription where subname='ha_resilience_reverse_sub';")"
          [ -n "$forward_pid" ] && [ -n "$reverse_pid" ] || { echo "::error::subscription worker unhealthy"; exit 1; }

      - name: Create resilience artifact
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/ha-resilience.env"
          set +a
          jq -n \
            --arg application_commit "$REHEARSAL_HEAD_SHA" \
            --arg github_execution_sha "$GITHUB_SHA" \
            --arg forward_pause_lsn "$FORWARD_PAUSE_LSN" \
            --arg forward_catchup_lsn "$FORWARD_CATCHUP_LSN" \
            --arg reverse_pause_lsn "$REVERSE_PAUSE_LSN" \
            --arg reverse_catchup_lsn "$REVERSE_CATCHUP_LSN" \
            '{
              schema_version: "1.0",
              rehearsal: "HA04A_HA06A_ISOLATED_RESILIENCE_PG17",
              provider_specific_certification: false,
              application_commit: $application_commit,
              github_execution_sha: $github_execution_sha,
              topology: "two_disposable_postgresql_17_nodes",
              copy_data: false,
              origin_filter: "none",
              forward_interruption_stale_state: "PASS",
              forward_insert_update_delete_catchup: "PASS",
              reverse_interruption_stale_state: "PASS",
              reverse_insert_update_delete_catchup: "PASS",
              reverse_anti_loop_duplicate_conflict_proof: "PASS",
              subscription_workers_healthy: "PASS",
              positions: {
                forward_pause_lsn: $forward_pause_lsn,
                forward_catchup_lsn: $forward_catchup_lsn,
                reverse_pause_lsn: $reverse_pause_lsn,
                reverse_catchup_lsn: $reverse_catchup_lsn
              },
              secrets_redacted: true,
              verdict: "ISOLATED_RESILIENCE_PASS",
              limitations: [
                "Does not prove Supabase or Neon provider privileges.",
                "Does not prove provider-specific origin behavior.",
                "Does not certify production RPO/RTO.",
                "Does not mutate production or provider databases."
              ]
            }' > "$RUNNER_TEMP/HA_ISOLATED_RESILIENCE.json"

      - name: Guard artifact against secret leakage
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/HA_ISOLATED_RESILIENCE.json"
          test -s "$artifact"
          if grep -Eiq 'postgres(ql)?://|password|SUPABASE_DATABASE_URL|NEON_DATABASE_URL|service_role' "$artifact"; then
            echo "::error::Secret-like material detected in resilience artifact"
            exit 1
          fi

      - name: Upload resilience proof
        uses: actions/upload-artifact@v4
        with:
          name: ha-isolated-resilience-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/HA_ISOLATED_RESILIENCE.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated nodes
        if: always()
        shell: bash
        run: |
          docker rm -f "$SOURCE" "$TARGET" >/dev/null 2>&1 || true
          docker network rm "$NETWORK" >/dev/null 2>&1 || true
