name: Recovery V4.11 Domio Category Evidence Intersection

on:
  push:
    branches: ["recovery/v4-11-certified-import-wave2-20260927"]
    paths:
      - "data/recovery/activate-v4-11-domio-category-intersection.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  intersect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download reconciled ledger and recent Domio category evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reconciled" "$RUNNER_TEMP/domio" data/audits/pre-db-verification/domio
          gh api repos/${{ github.repository }}/actions/artifacts/10927761643/zip > "$RUNNER_TEMP/reconciled.zip"
          unzip -q -o "$RUNNER_TEMP/reconciled.zip" -d "$RUNNER_TEMP/reconciled"
          gh api repos/${{ github.repository }}/actions/artifacts/10861514122/zip > "$RUNNER_TEMP/domio.zip"
          unzip -q -o "$RUNNER_TEMP/domio.zip" -d "$RUNNER_TEMP/domio"
          test -s "$RUNNER_TEMP/reconciled/unresolved-existence.txt"
          test -s "$RUNNER_TEMP/domio/recovery-domio-category-detail-urls.txt"
          echo "b2faf7c87d3211690d303647aeaf93add4ab595e100e33f5c2bfcdb7034bbf19  $RUNNER_TEMP/domio/recovery-domio-category-detail-urls.txt" | sha256sum -c -

      - name: Intersect Domio category evidence
        run: |
          node scripts/recovery/intersect-v4-11-url-list-evidence.mjs             --unresolved "$RUNNER_TEMP/reconciled/unresolved-existence.txt"             --evidence "$RUNNER_TEMP/domio/recovery-domio-category-detail-urls.txt"             --domain domio.ma             --matched data/audits/pre-db-verification/domio/category-matched.jsonl             --remaining data/audits/pre-db-verification/domio/still-unresolved.txt             --summary data/audits/pre-db-verification/domio/category-summary.json

      - name: Assert complete Domio coverage
        run: |
          node - <<'NODE'
          const s=require("./data/audits/pre-db-verification/domio/category-summary.json");
          if(s.queue_rows!==6843) throw new Error("queue");
          if(s.evidence_rows!==10347) throw new Error("evidence");
          if(s.matched_rows!==6843) throw new Error("matched");
          if(s.unresolved_rows!==0) throw new Error("unresolved");
          if(s.database_access!==0||s.database_writes!==0) throw new Error("DB invariant");
          console.log(JSON.stringify(s,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-domio-category-evidence-intersection
          path: data/audits/pre-db-verification/domio/
          retention-days: 30
