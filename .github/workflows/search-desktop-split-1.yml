name: SEARCH-DESKTOP-SPLIT-1 Gate

on:
  pull_request:
    paths:
      - "components/search/LightZillowSearchShell.tsx"
      - "lib/ux/search-view.ts"
      - "scripts/scrapers/__tests__/search-desktop-split-1.test.ts"
      - "scripts/scrapers/__tests__/ux-search-view.test.ts"
      - ".github/workflows/search-desktop-split-1.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Desktop split contract
        run: npx tsx --test scripts/scrapers/__tests__/search-desktop-split-1.test.ts
      - name: Canonical view predecessor
        run: npx tsx --test scripts/scrapers/__tests__/ux-search-view.test.ts
      - name: Search action hierarchy predecessor
        run: npx tsx --test scripts/scrapers/__tests__/search-action-hierarchy-1.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
