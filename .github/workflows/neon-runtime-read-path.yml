name: Neon Runtime Read Path Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/db/provider.ts"
      - "lib/db/index.ts"
      - "lib/db/neon-client.ts"
      - "lib/db/neon-listings.ts"
      - "lib/market-index/neon-market-index-read-repository.ts"
      - "scripts/scrapers/__tests__/neon-db-provider.test.ts"
      - "scripts/scrapers/__tests__/neon-listings.test.ts"
      - "scripts/scrapers/__tests__/neon-core-db-migration-guard.test.ts"
      - "scripts/scrapers/__tests__/neon-odm-portability-guard.test.ts"
      - "scripts/scrapers/__tests__/odm-09b-public-search-contract.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/neon-runtime-read-path.yml"
      - ".github/workflows/neon-core-db-migration.yml"
      - ".github/workflows/neon-odm-portability-probe.yml"
      - "lib/search-gateway/public-search-cursor.ts"
      - "lib/search-gateway/neon-public-search.ts"
      - "scripts/scrapers/__tests__/neon-public-search.test.ts"
      - "lib/seller/neon-owner-listing-search.ts"
      - "lib/seller/owner-listing-projection.ts"
      - "scripts/scrapers/__tests__/neon-owner-listing-search.test.ts"
      - ".github/workflows/neon-owner-read-portability-probe.yml"
      - "scripts/scrapers/__tests__/neon-owner-read-portability-guard.test.ts"
      - "lib/property-detail/neon-market-comparables-repository.ts"
      - "lib/property-detail/market-comparables-runtime.ts"
      - "scripts/scrapers/__tests__/neon-market-comparables.test.ts"
      - ".github/workflows/neon-market-comparables-portability-probe.yml"
      - "scripts/scrapers/__tests__/neon-market-comparables-portability-guard.test.ts"
      - "lib/map/market-intelligence-db-read.ts"
      - "lib/map/city-market-intelligence-live.ts"
      - "lib/map/rabat-market-intelligence-live.ts"
      - "scripts/scrapers/__tests__/neon-market-intelligence-read.test.ts"
      - ".github/workflows/neon-market-intelligence-portability-probe.yml"
      - "scripts/scrapers/__tests__/neon-market-intelligence-portability-guard.test.ts"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Neon migration and provider unit tests
        run: npx tsx --test scripts/scrapers/__tests__/neon-db-provider.test.ts scripts/scrapers/__tests__/neon-listings.test.ts scripts/scrapers/__tests__/neon-core-db-migration-guard.test.ts scripts/scrapers/__tests__/neon-odm-portability-guard.test.ts scripts/scrapers/__tests__/neon-public-search.test.ts scripts/scrapers/__tests__/neon-owner-listing-search.test.ts scripts/scrapers/__tests__/neon-owner-read-portability-guard.test.ts scripts/scrapers/__tests__/neon-market-comparables.test.ts scripts/scrapers/__tests__/neon-market-comparables-portability-guard.test.ts scripts/scrapers/__tests__/neon-market-intelligence-read.test.ts scripts/scrapers/__tests__/neon-market-intelligence-portability-guard.test.ts scripts/scrapers/__tests__/odm-09b-public-search-contract.test.ts

      - name: TypeScript
        run: npx tsc --noEmit