name: Territory Dictionary Contract

on:
  push:
    branches:
      - feat/vivre-ici-territory-dictionary
    paths:
      - "lib/geo/territory-dictionary.ts"
      - "lib/geo/territory-city-priorities.ts"
      - "lib/geo/territory-district-priorities.ts"
      - "scripts/scrapers/__tests__/territory-dictionary-contract.test.ts"
      - "scripts/scrapers/__tests__/territory-city-priorities.test.ts"
      - "scripts/scrapers/__tests__/territory-district-priorities.test.ts"
      - "package.json"
      - ".github/workflows/territory-dictionary-contract.yml"

permissions:
  contents: read

jobs:
  territory-dictionary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:territory-dictionary
      - run: npx tsc --noEmit
