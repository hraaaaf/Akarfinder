name: TEMP UX-SEARCH-7 Certified Closeout

on:
  push:
    branches:
      - ux/search-final-visual-certification-7
    paths:
      - ".github/workflows/tmp-ux-search-7-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search-final-visual-certification-7
          fetch-depth: 0
      - name: Update canonical UX/Search closeout docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          head = "ec0da231b6868c31acee1f58a431cfaa82905596"
          run = "31475434171"
          human = "9,5/10"

          readme = Path("README.md")
          s = readme.read_text()
          replacement = '''<!-- UX-SEARCH-CONVERGENCE-CURRENT-START -->
          ### Convergence Search actuelle — UX-SEARCH-1 à UX-SEARCH-7 ✅ COMPLETE

          - **UX-SEARCH-1 — Density First ✅ PR #479** : grille certifiée 2/2/3/4/4 ; densité **9,3/10**.
          - **UX-SEARCH-2 — Compact Search & Filters ✅ PR #480** : première annonce ~240–250 px, touch targets 48 px, 0 overflow ; **9,5/10**.
          - **UX-SEARCH-3 — Card Architecture ✅ PR #481** : `IMAGE → PRIX → TITRE → LOCALISATION → FACTS → PROVENANCE`, confiance/source préservées ; **9,4/10**.
          - **UX-SEARCH-4 — Visual Inventory System ✅ PR #482** : fallbacks contextuels truth-safe activés ; variété visuelle certifiée, stable et transparente ; **9,5/10**.
          - **UX-SEARCH-5 — Navigation & Hierarchy Polish ✅ PR #483** : header Search compact/fluid, hauteur **49–53,8 px**, inventaire prioritaire ; **9,5/10**.
          - **UX-SEARCH-6 — Mobile Precision Pass ✅ PR #484** : mobile 360/390 à **2 colonnes**, gaps **10/14 px**, contrôles critiques **48 px**, 0 clipping/overflow ; **9,5/10**.
          - **UX-SEARCH-7 — Final Visual Certification ✅ PR #485** : six viewports **360/390/768/1024/1280/1440**, grille **2/2/2/3/4/4**, contrat final **10/10 (9/9 axes)**, audit humain **9,5/10**, **19/19 workflows exact-head SUCCESS**, Product Design Reviewer + Independent Release Certifier PASS.
          - Preuves finales : première card **229,5 px mobile / 242,25 px desktop** avec filtre Rabat actif ; max card **362,4 px mobile / 419 px desktop** ; **11/12 visuels distincts**, 0 overflow, 0 image cassée, provenance et disclosure truth-safe conservées.
          - Les sept lots préservent ranking, DATA, Source Registry, dédup, ordre commercial, prix, Map et transparence de provenance.
          - **Convergence UX/Search fermée.** Toute évolution suivante doit repartir d’un finding utilisateur/production mesuré, sans rouvrir les lots certifiés par défaut.
          <!-- UX-SEARCH-CONVERGENCE-CURRENT-END -->'''
          replacement = re.sub(r'^          ', '', replacement, flags=re.M)
          s, n = re.subn(r'<!-- UX-SEARCH-CONVERGENCE-CURRENT-START -->.*?<!-- UX-SEARCH-CONVERGENCE-CURRENT-END -->', replacement, s, flags=re.S)
          if n != 1:
              raise SystemExit(f"README convergence block count={n}")
          readme.write_text(s)

          block = f'''<!-- UX-SEARCH-7-CLOSEOUT-START -->
          ## UX-SEARCH-7 — Final Visual Certification ✅ CERTIFIED — PR #485

          Responsabilité unique : **certifier visuellement la convergence finale de `/search` après UX-SEARCH-1 à 6**, sans modification runtime produit et sans toucher DATA, ranking, Source Registry, dédup, prix, ordre commercial ni logique Map.

          Résultat certifié :

          - exact-head comportemental `{head}` : **19/19 workflows SUCCESS** ;
          - run spécialisé `{run}` : **Product Design Reviewer PASS + Independent Release Certifier PASS**, avec deux builds/replays Chromium indépendants ;
          - replay des contrats UX-SEARCH-1 à 6 : **22/22 tests PASS** dans le Product Design Reviewer ; TypeScript et production build PASS ;
          - contrat final machine : **10/10 — 9/9 axes PASS** : header/navigation, recherche/filtres, densité desktop, cards, visuels, hiérarchie, mobile 2 colonnes, scan speed, trust/transparence ;
          - six viewports : **360×800 / 390×844 / 768×900 / 1024×800 / 1280×900 / 1440×900** ; grille **2 / 2 / 2 / 3 / 4 / 4** ;
          - avec `city=Rabat` actif : première card **229,5 px mobile**, **244,25 px tablette**, **242,25 px desktop** ; max card **362,4 px mobile**, **528,1 px tablette**, **419 px desktop** ;
          - header **49 px mobile / 53,75 px tablette-desktop** ; alignement canonique max **2 px** ; contrôles critiques mobile **48 px** ;
          - desktop 1280/1440 : **8 cards intersectent le premier viewport** ; mobile 360/390 : **4 cards** ;
          - **11 visuels distincts sur 12 cards**, signature déterministe stable sur tous les viewports ; 0 image cassée ;
          - 0 overflow horizontal ; 0 clipping prix/localisation/facts ; hiérarchie `IMAGE → PRIX → TITRE → LOCALISATION → FACTS → PROVENANCE` respectée ; prix visuellement dominant ;
          - provenance et disclosure `Photo d’ambiance` / `Illustration` restent explicites ; aucune image d’ambiance n’est présentée comme photo du bien ;
          - revue humaine finale des captures 360×800, 390×844 et 1440×900 : **{human}** — inventaire dense, lisible et varié, contrôles subordonnés aux résultats, aucun finding bloquant ;
          - aucun fichier runtime produit modifié dans UX-SEARCH-7 : le lot est **certification-only**.

          **Convergence UX-SEARCH-1 → UX-SEARCH-7 : ✅ COMPLETE.** Les prochaines évolutions Search nécessitent un finding mesuré distinct ; les lots certifiés ne sont pas rouverts par défaut.
          <!-- UX-SEARCH-7-CLOSEOUT-END -->'''
          block = re.sub(r'^          ', '', block, flags=re.M)

          for filename in ["docs/ROADMAP.md", "docs/SESSION.md"]:
              p = Path(filename)
              t = p.read_text()
              if "<!-- UX-SEARCH-7-CLOSEOUT-START -->" not in t:
                  marker = "<!-- UX-SEARCH-6-CLOSEOUT-END -->"
                  if marker not in t:
                      raise SystemExit(f"{filename}: UX6 marker missing")
                  t = t.replace(marker, marker + "\n\n" + block, 1)
              t = t.replace("**Prochain LOT UX/Search : UX-SEARCH-7 — Final Visual Certification.**", "**Convergence UX/Search : UX-SEARCH-1 → UX-SEARCH-7 ✅ COMPLETE.**")
              if filename.endswith("ROADMAP.md") and "UX-SEARCH-7 ✅ PR #485" not in t.splitlines()[3]:
                  t = t.replace("UX-SEARCH-6 ✅ PR #484 ;", "UX-SEARCH-6 ✅ PR #484 ; UX-SEARCH-7 ✅ PR #485 ;", 1)
              p.write_text(t)
          PY
      - name: Self-remove and commit certified docs
        shell: bash
        run: |
          git rm .github/workflows/tmp-ux-search-7-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md
          git commit -m "docs(search): close final UX-SEARCH convergence"
          git push origin HEAD:ux/search-final-visual-certification-7
