name: DATA-1.6B Source Registry Assignment

on:
  pull_request:
    paths:
      - "scripts/census/source-registry-assignment.ts"
      - "scripts/census/data-1-6b-policy-decisions.json"
      - "scripts/census/run-source-registry-assignment-preflight.ts"
      - "scripts/census/__tests__/source-registry-assignment.test.ts"
      - "supabase/migrations/20260807140000_data_1_6b_source_registry_assignment.sql"
      - ".github/workflows/data-1-6b-source-registry-assignment.yml"
      - "docs/DATA_1_6B_SOURCE_REGISTRY_ASSIGNMENT.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: data-1-6b-source-registry-assignment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: DATA-1.6B unit tests
        run: npx tsx --test scripts/census/__tests__/source-registry-assignment.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  live-preflight:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_1_6A_EVIDENCE_RUN_ID: "31182352538"
      DATA_1_5_EVIDENCE_RUN_ID: "31178327843"
      DATA_1_6A_EVIDENCE_JSON: .tmp/data-1-6b/input/policy/source-policy-evidence-review.json
      DATA_1_5_TECH_AUDIT_JSON: .tmp/data-1-6b/input/technical/technical-capability-audit.json
      DATA_1_6B_OUT_DIR: .tmp/data-1-6b/results
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download certified DATA-1.6A policy evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/data-1-6b/input/policy
          gh run download "${DATA_1_6A_EVIDENCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name data-1-6a-source-policy-evidence-review \
            --dir .tmp/data-1-6b/input/policy
          test -s "${DATA_1_6A_EVIDENCE_JSON}"
          test -s .tmp/data-1-6b/input/policy/proof.json
          node - <<'NODE'
          const fs = require('fs');
          const proof = JSON.parse(fs.readFileSync('.tmp/data-1-6b/input/policy/proof.json', 'utf8'));
          if (proof.readOnly !== true || proof.writesPerformed !== 0 || proof.policiesAssigned !== 0 || proof.registryCandidateFieldsAssigned !== 0) {
            throw new Error(`DATA-1.6A evidence is not fail-closed: ${JSON.stringify(proof)}`);
          }
          if (proof.sourceCount !== 19 || proof.restrictiveTermsFound !== 1 || proof.termsWithoutExplicitPermission !== 3 || proof.insufficientLegalEvidence !== 11 || proof.accessOrFetchLimited !== 4) {
            throw new Error(`Unexpected DATA-1.6A proof distribution: ${JSON.stringify(proof)}`);
          }
          NODE

      - name: Download certified DATA-1.5 technical evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/data-1-6b/input/technical
          gh run download "${DATA_1_5_EVIDENCE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name data-1-5-technical-capability-audit \
            --dir .tmp/data-1-6b/input/technical
          test -s "${DATA_1_5_TECH_AUDIT_JSON}"
          test -s .tmp/data-1-6b/input/technical/proof.json
          node - <<'NODE'
          const fs = require('fs');
          const proof = JSON.parse(fs.readFileSync('.tmp/data-1-6b/input/technical/proof.json', 'utf8'));
          if (proof.readOnly !== true || proof.writesPerformed !== 0 || proof.effectivePoliciesAssigned !== 0) {
            throw new Error(`DATA-1.5 evidence is not fail-closed: ${JSON.stringify(proof)}`);
          }
          if (proof.sitesAudited !== 20 || proof.capabilityReviewReady !== 19) {
            throw new Error(`Unexpected DATA-1.5 proof: ${JSON.stringify(proof)}`);
          }
          NODE

      - name: Run read-only Registry assignment preflight
        run: npx tsx scripts/census/run-source-registry-assignment-preflight.ts

      - name: Enforce DATA-1.6B preflight proof
        shell: bash
        run: |
          set -euo pipefail
          test -s "${DATA_1_6B_OUT_DIR}/proof.json"
          test -s "${DATA_1_6B_OUT_DIR}/assignment-preview.json"
          test -s "${DATA_1_6B_OUT_DIR}/assignment-preview.csv"
          test -s "${DATA_1_6B_OUT_DIR}/preflight.md"
          node - <<'NODE'
          const fs = require('fs');
          const proof = JSON.parse(fs.readFileSync('.tmp/data-1-6b/results/proof.json', 'utf8'));
          if (proof.readOnly !== true || proof.writesPerformed !== 0) throw new Error('DATA-1.6B PR preflight must remain read-only');
          if (proof.registryReadRequests !== 1) throw new Error('DATA-1.6B must use one bounded Registry preflight read');
          if (proof.sourceCount !== 19) throw new Error(`Expected 19 assignments: ${JSON.stringify(proof)}`);
          if (proof.existingRegistryRows !== 0) throw new Error(`Target domains already exist in Registry: ${JSON.stringify(proof)}`);
          if (proof.activatingAssignments !== 0 || proof.directFetchEnabled !== 0 || proof.partnerAssignments !== 0) {
            throw new Error(`DATA-1.6B must activate zero sources: ${JSON.stringify(proof)}`);
          }
          if (proof.hiddenAssignments !== 19) throw new Error(`All assignments must remain hidden: ${JSON.stringify(proof)}`);
          if (proof.authorizationStatusCounts.prohibited !== 1 || proof.authorizationStatusCounts.permission_required !== 3 || proof.authorizationStatusCounts.unverified !== 15) {
            throw new Error(`Unexpected authorization distribution: ${JSON.stringify(proof)}`);
          }
          if (proof.acquisitionModeCounts.blocked !== 1 || proof.acquisitionModeCounts.public_index_internal_only !== 18) {
            throw new Error(`Unexpected acquisition distribution: ${JSON.stringify(proof)}`);
          }
          console.log(JSON.stringify(proof, null, 2));
          NODE

      - name: Upload DATA-1.6B preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: data-1-6b-source-registry-assignment-preflight
          path: .tmp/data-1-6b/results/
          if-no-files-found: error
          retention-days: 14
