name: LOT B1 Source Freshness Engine Gate

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260805181500_lot_b1_source_freshness_engine.sql'
      - 'docs/data/LOT-B1-SOURCE-FRESHNESS-ENGINE.md'
      - '.github/workflows/lot-b1-source-freshness-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-source-freshness-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fail-closed freshness contract assertions
        run: |
          FILE=supabase/migrations/20260805181500_lot_b1_source_freshness_engine.sql
          grep -q "source_freshness_state" "$FILE"
          grep -q "source_freshness_transition_events" "$FILE"
          grep -q "blocked_review_overdue" "$FILE"
          grep -q "blocked_unverified" "$FILE"
          grep -q "publication_eligible boolean not null default false" "$FILE"
          grep -q "security invoker" "$FILE"
          grep -q "set search_path=''" "$FILE"
          grep -q "revoke all on table public.source_freshness_state from public,anon,authenticated" "$FILE"
          grep -q "odm_b1_source_freshness_report_v1" "$FILE"
          ! grep -Eqi "captcha|proxy rotation|stealth|fake googlebot|bypass" "$FILE"
      - run: npx tsc --noEmit
      - run: npm run build
