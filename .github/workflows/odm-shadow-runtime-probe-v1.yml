name: ODM Shadow Runtime Probe V1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/odm-shadow-runtime-probe-v1.yml
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odm-shadow-runtime-probe-v1
  cancel-in-progress: false

jobs:
  probe-production:
    if: github.event_name != 'issues' || github.event.issue.title == 'RUN ODM SHADOW RUNTIME PROBE V1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for production to become reachable
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://akarfinder.vercel.app"
          for attempt in $(seq 1 24); do
            status="$(curl --silent --show-error --location --output /tmp/home.html --write-out '%{http_code}' --max-time 20 "$base_url/" || true)"
            echo "attempt=$attempt status=$status"
            if [[ "$status" == "200" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Production did not become reachable" >&2
          exit 1

      - name: Generate authentic Shadow search traffic
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://akarfinder.vercel.app"
          # These offsets are intentionally selected so their stable search keys
          # fall inside the 0-5% deterministic ODM dual-read sample bucket.
          queries=(
            "q=appartement%20casablanca&offset=33"
            "q=appartement%20casablanca&offset=65"
            "q=appartement%20casablanca&offset=70"
            "q=villa%20rabat&offset=33"
            "q=villa%20rabat&offset=34"
            "q=villa%20rabat&offset=47"
            "q=terrain%20marrakech&offset=1"
            "q=terrain%20marrakech&offset=14"
            "q=terrain%20marrakech&offset=17"
            "q=maison%20tanger&offset=9"
            "q=maison%20tanger&offset=29"
            "q=maison%20tanger&offset=35"
            "q=bureau%20casablanca&offset=7"
            "q=bureau%20casablanca&offset=25"
            "q=bureau%20casablanca&offset=28"
          )

          failures=0
          total=0
          for round in $(seq 1 4); do
            for query in "${queries[@]}"; do
              total=$((total + 1))
              status="$(curl --silent --show-error --location --output /tmp/search-response.json --write-out '%{http_code}' --max-time 30 "$base_url/api/search?$query" || true)"
              echo "round=$round status=$status query=$query"
              if [[ "$status" != "200" ]]; then
                failures=$((failures + 1))
              fi
              sleep 1
            done
          done

          echo "total=$total failures=$failures"
          if (( failures > 6 )); then
            echo "Too many failed production probes" >&2
            exit 1
          fi

      - name: Probe public search pages
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            '/search?q=appartement%20casablanca' \
            '/search?q=villa%20rabat' \
            '/search?q=terrain%20marrakech'; do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 30 "https://akarfinder.vercel.app$path")"
            echo "status=$status path=$path"
            [[ "$status" == "200" ]]
          done
