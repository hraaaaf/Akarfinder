name: HA Capability Inventory

# AKARFINDER-HA-DR-20260924
# Manual, read-only capability inventory against Supabase and Neon.
# Executes only scripts/ha-dr/logical-replication-capability-inventory.sql.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-capability-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_URL: ${{ secrets.SUPABASE_DATABASE_URL_DIRECT }}
      TARGET_URL: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
      PG_IMAGE: postgres:17

    steps:
      - uses: actions/checkout@v4

      - name: Validate direct connection secrets
        shell: bash
        run: |
          set -euo pipefail
          for pair in SOURCE_URL TARGET_URL; do
            value="${!pair:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing $pair"
              exit 1
            fi
            case "$value" in
              *pooler*)
                echo "::error::$pair must be a direct/unpooled PostgreSQL URL"
                exit 1
                ;;
            esac
          done

      - name: Verify inventory SQL remains read-only
        shell: bash
        run: |
          set -euo pipefail
          sql="scripts/ha-dr/logical-replication-capability-inventory.sql"
          grep -F "BEGIN TRANSACTION READ ONLY;" "$sql" >/dev/null
          grep -F "COMMIT;" "$sql" >/dev/null
          if grep -Eiq '\b(insert|update|delete|alter|drop|create|truncate|grant|revoke|copy)\b' "$sql"; then
            echo "::error::Mutation-like token found in capability inventory SQL"
            exit 1
          fi

      - name: Run source capability inventory
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm             -e DB_URL="$SOURCE_URL"             -v "$GITHUB_WORKSPACE:/repo:ro"             -v "$RUNNER_TEMP:/out"             "$PG_IMAGE"             sh -lc 'psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f /repo/scripts/ha-dr/logical-replication-capability-inventory.sql > /out/SUPABASE_CAPABILITY_INVENTORY.txt'

      - name: Run target capability inventory
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm             -e DB_URL="$TARGET_URL"             -v "$GITHUB_WORKSPACE:/repo:ro"             -v "$RUNNER_TEMP:/out"             "$PG_IMAGE"             sh -lc 'psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f /repo/scripts/ha-dr/logical-replication-capability-inventory.sql > /out/NEON_CAPABILITY_INVENTORY.txt'

      - name: Guard artifacts against secret leakage
        shell: bash
        run: |
          set -euo pipefail
          for artifact in             "$RUNNER_TEMP/SUPABASE_CAPABILITY_INVENTORY.txt"             "$RUNNER_TEMP/NEON_CAPABILITY_INVENTORY.txt"; do
            test -s "$artifact"
            if grep -Eiq 'postgres(ql)?://|service_role|SUPABASE_DATABASE_URL|NEON_DATABASE_URL|password=' "$artifact"; then
              echo "::error::Secret-like material detected in capability inventory artifact"
              exit 1
            fi
          done

      - name: Create artifact digests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum             SUPABASE_CAPABILITY_INVENTORY.txt             NEON_CAPABILITY_INVENTORY.txt             > HA_CAPABILITY_INVENTORY_SHA256SUMS.txt

      - name: Upload capability inventory proof
        uses: actions/upload-artifact@v4
        with:
          name: ha-capability-inventory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/SUPABASE_CAPABILITY_INVENTORY.txt
            ${{ runner.temp }}/NEON_CAPABILITY_INVENTORY.txt
            ${{ runner.temp }}/HA_CAPABILITY_INVENTORY_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
