name: Partner Market Intelligence P5

on:
  pull_request:
    paths:
      - "lib/partners/partner-listing-v2.ts"
      - "lib/feeds/partner-v2-bridge.ts"
      - "lib/geo/national-partner-geo-resolver.ts"
      - "lib/market/partner-market-aggregator-v2.ts"
      - "lib/market/partner-market-downstream-v2.ts"
      - "scripts/scrapers/__tests__/partner-listing-v2.test.ts"
      - "scripts/scrapers/__tests__/partner-feed-v2-bridge.test.ts"
      - "scripts/scrapers/__tests__/national-partner-geo-resolver.test.ts"
      - "scripts/scrapers/__tests__/partner-market-aggregator-v2.test.ts"
      - "scripts/scrapers/__tests__/partner-market-downstream-v2.test.ts"
      - "scripts/audits/partner-market-p5-after-audit.mjs"
      - ".github/workflows/partner-market-intelligence-p2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partner-market-intelligence-p5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-p5-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_URL: http://127.0.0.1:3211
      AUDIT_OUTPUT_DIR: data/audits/partner-market-p5-after
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Partner pipeline P2-P5 regression
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/partner-listing-v2.test.ts
          scripts/scrapers/__tests__/partner-feed-v2-bridge.test.ts
          scripts/scrapers/__tests__/national-partner-geo-resolver.test.ts
          scripts/scrapers/__tests__/partner-market-aggregator-v2.test.ts
          scripts/scrapers/__tests__/partner-market-downstream-v2.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3211 > /tmp/partner-market-p5.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3211/map?city=casablanca&district=maarif&layer=explore' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/partner-market-p5.log
          exit 1

      - name: National desktop/mobile AFTER certification
        run: node scripts/audits/partner-market-p5-after-audit.mjs

      - name: Upload P5 AFTER evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-market-p5-after-${{ github.run_id }}
          path: data/audits/partner-market-p5-after
          if-no-files-found: error
          retention-days: 30
