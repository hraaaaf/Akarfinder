name: M7-F External SERP UI

on:
  pull_request:
    paths:
      - "components/search/ExternalIndexedResultCard.tsx"
      - "components/search/ExternalIndexedResultsSection.tsx"
      - "components/search/LightZillowSearchShell.tsx"
      - "lib/search/external-result-presentation.ts"
      - "scripts/scrapers/__tests__/m7f-external-serp-ui.test.ts"
      - "docs/M7F_EXTERNAL_SERP_UI_GOAL.md"
      - ".github/workflows/m7f-external-serp-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-serp-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contract test
        run: npx tsx --test scripts/scrapers/__tests__/m7f-external-serp-ui.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium proof runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare self-contained visual harness
        run: |
          mkdir -p artifacts/m7f/before artifacts/m7f/after app/m7f-visual-proof
          cat > app/m7f-visual-proof/page.tsx <<'EOF'
          import { ExternalIndexedResultsSection } from "@/components/search/ExternalIndexedResultsSection";
          import type { SearchGatewayNormalizedResult } from "@/lib/search-gateway/search-gateway-types";

          function makeResult(index: number): SearchGatewayNormalizedResult {
            const domains = ["agenz.ma", "1immo.ma", "daragadir.com", "promoimmomarrakech.com"];
            const domain = domains[index % domains.length];
            return {
              id: `proof-${index}`,
              title: `Annonce immobilière · Appartement · Casablanca`,
              snippet: null,
              original_url: `https://${domain}/annonce/${index}`,
              display_url: `${domain}/annonce/${index}`,
              source_id: domain,
              source_name: domain,
              domain,
              result_origin: "search_api",
              search_result_display_mode: "thin_indexed_result",
              source_badge: "external_indexed",
              production_allowed: true,
              can_show_result: true,
              can_show_thumbnail: false,
              can_show_contact: false,
              can_show_gallery: false,
              can_cache_thumbnail: false,
              can_download_thumbnail: false,
              primary_cta: "view_original",
              primary_cta_label: "Voir la source originale",
              result_attribution_label: "Source externe",
              thumbnail_risk_accepted: false,
              normalized_city: "Casablanca",
              normalized_property_type: "apartment",
              normalized_intent: "sale",
              normalized_price_mad: null,
              normalized_surface_m2: null,
              price_per_m2_mad: null,
              quality_tier: "Q0_link_only",
              display_eligibility: "eligible_primary",
              display_eligibility_reason: "external_minimal_index",
            };
          }

          export default function M7FVisualProofPage() {
            const results = Array.from({ length: 24 }, (_, index) => makeResult(index + 1));
            return (
              <main className="min-h-screen bg-background px-3 py-6 text-foreground sm:px-5 lg:px-8">
                <section className="mx-auto max-w-[780px]">
                  <div className="mb-3 flex items-center justify-between gap-3">
                    <h1 className="text-[20px] font-black sm:text-[24px]">387 résultats</h1>
                    <span className="text-[12px] font-bold text-muted-foreground">Pertinence</span>
                  </div>
                  <ExternalIndexedResultsSection results={results} showHeader={false} />
                  <div className="mt-5 flex justify-center">
                    <button className="rounded-full border border-border/20 px-5 py-2.5 text-[13px] font-extrabold">
                      Afficher plus de résultats
                    </button>
                  </div>
                </section>
              </main>
            );
          }
          EOF
          cat > m7f-proof.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const mode = process.argv[2];
          const baseUrl = process.argv[3];
          const path = process.argv[4];
          const outDir = `artifacts/m7f/${mode}`;
          const viewports = [
            { name: "390", width: 390, height: 844 },
            { name: "430", width: 430, height: 932 },
            { name: "768", width: 768, height: 1024 },
            { name: "1280", width: 1280, height: 900 },
          ];
          const browser = await chromium.launch({ headless: true });
          const metrics = [];
          for (const vp of viewports) {
            const page = await browser.newPage({ viewport: { width: vp.width, height: vp.height } });
            const errors = [];
            page.on("pageerror", (error) => errors.push(`page:${error.message}`));
            await page.goto(`${baseUrl}${path}`, { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.waitForTimeout(mode === "before" ? 4000 : 1000);
            const section = page.locator("[data-search-external-serp-section]").first();
            const oldHeader = page.getByText("Sources externes indexées", { exact: true }).first();
            if (await section.count()) await section.scrollIntoViewIfNeeded();
            else if (await oldHeader.count()) await oldHeader.scrollIntoViewIfNeeded();
            await page.waitForTimeout(300);
            const bodyText = await page.locator("body").innerText();
            const horizontalOverflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1);
            const rows = await page.locator("[data-external-serp-row]").count();
            const rowHeights = rows ? await page.locator("[data-external-serp-row]").evaluateAll((els) => els.slice(0, 10).map((el) => Math.round(el.getBoundingClientRect().height))) : [];
            metrics.push({ mode, viewport: vp.name, has387Total: bodyText.includes("387 résultats"), hasLoadedCounter: /\d+ chargés/.test(bodyText), rows, rowHeights, horizontalOverflow, errorCount: errors.length, errors: errors.slice(0, 10) });
            await page.screenshot({ path: `${outDir}/${vp.name}.png`, fullPage: false });
            await page.close();
          }
          await browser.close();
          fs.writeFileSync(`${outDir}/metrics.json`, JSON.stringify(metrics, null, 2));
          if (mode === "after") {
            for (const metric of metrics) {
              if (!metric.has387Total) throw new Error(`Missing total at ${metric.viewport}`);
              if (metric.hasLoadedCounter) throw new Error(`Loaded-count leak at ${metric.viewport}`);
              if (metric.rows !== 24) throw new Error(`Expected 24 proof rows at ${metric.viewport}, got ${metric.rows}`);
              if (metric.horizontalOverflow) throw new Error(`Horizontal overflow at ${metric.viewport}`);
              if (metric.rowHeights.some((height) => height > 140)) throw new Error(`Row too tall at ${metric.viewport}: ${metric.rowHeights.join(",")}`);
            }
          }
          EOF
      - name: Capture BEFORE production
        run: node ./m7f-proof.mjs before https://akarfinder.vercel.app "/search?city=Casablanca"
      - name: Start local visual harness
        run: |
          (npm run dev -- --hostname 127.0.0.1 > /tmp/m7f-next.log 2>&1 & echo $! > /tmp/m7f-next.pid)
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:3000/m7f-visual-proof" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/m7f-next.log
          exit 1
      - name: Capture AFTER branch
        run: node ./m7f-proof.mjs after http://127.0.0.1:3000 "/m7f-visual-proof"
      - name: Print proof metrics
        if: always()
        run: |
          echo "--- BEFORE ---"
          cat artifacts/m7f/before/metrics.json 2>/dev/null || true
          echo "--- AFTER ---"
          cat artifacts/m7f/after/metrics.json 2>/dev/null || true
          echo "--- NEXT LOG TAIL ---"
          tail -120 /tmp/m7f-next.log 2>/dev/null || true
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7f-external-serp-ui-proof
          path: artifacts/m7f
          if-no-files-found: warn
          retention-days: 14
