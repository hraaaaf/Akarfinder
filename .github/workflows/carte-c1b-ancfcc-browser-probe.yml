name: Carte C1B ANCFCC Browser Probe

on:
  pull_request:
    paths:
      - "scripts/audits/carte-c1b-ancfcc-browser-probe.mjs"
      - ".github/workflows/carte-c1b-ancfcc-browser-probe.yml"

permissions:
  contents: read

jobs:
  probe-ancfcc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Read-only ANCFCC browser network discovery
        run: node scripts/audits/carte-c1b-ancfcc-browser-probe.mjs
      - name: Upload browser discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carte-c1b-ancfcc-browser-probe-${{ github.run_id }}
          path: data/audits/runtime/carte-c1b-ancfcc-browser-probe
          if-no-files-found: warn
          retention-days: 14
