name: ODM-10A Coverage Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20260727093000_odm_10a_coverage_audit.sql"
      - "scripts/odm-10a-coverage-audit.ts"
      - "scripts/scrapers/__tests__/odm-10a-coverage-audit.test.ts"
      - "docs/data/ODM-10A-COVERAGE-AUDIT.md"
      - ".github/workflows/odm-10a-coverage-audit.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  certify-coverage-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: ODM-10A contract
        run: npx tsx --test scripts/scrapers/__tests__/odm-10a-coverage-audit.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
