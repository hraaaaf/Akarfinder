name: Search Result Count Live Cert

on:
  push:
    branches:
      - agent/search-result-count-live-cert
    paths:
      - .github/workflows/search-result-count-live-cert.yml

permissions:
  contents: read

jobs:
  certify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Certify production 430px total stability
        run: |
          mkdir -p artifacts/search-result-count-live
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base = 'https://akarfinder.vercel.app';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 430, height: 932 } });
          const consoleErrors = [];
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });

          const apiResponse = await page.request.get(`${base}/api/search?limit=100`, { headers: { 'cache-control': 'no-cache' } });
          if (!apiResponse.ok()) throw new Error(`api/search status ${apiResponse.status()}`);
          const api = await apiResponse.json();
          const expected = Number(api.total);

          await page.route('**/api/search/gateway**', async route => {
            await new Promise(resolve => setTimeout(resolve, 2500));
            await route.continue();
          });

          await page.goto(`${base}/search`, { waitUntil: 'domcontentloaded' });
          const parseCount = async () => {
            const text = await page.locator('body').innerText();
            const match = text.match(/([\d\s.,]+)\s+r[ée]sultats?/i);
            return {
              text: match?.[0] ?? null,
              value: match ? Number(match[1].replace(/[^0-9]/g, '')) : null,
            };
          };

          const early = await parseCount();
          await page.waitForTimeout(3200);
          const late = await parseCount();

          const report = {
            viewport: '430x932',
            deployment: 'dpl_DULmhC61oNnuqQzrgQ3UZASyjiSg',
            deployedHead: 'ce748da62449f3ed23401d368a0fb38b9f841930',
            expected,
            early,
            late,
            consoleErrors,
          };
          fs.writeFileSync('artifacts/search-result-count-live/report.json', JSON.stringify(report, null, 2));
          await page.screenshot({ path: 'artifacts/search-result-count-live/search-430-live.png', fullPage: true });
          await browser.close();

          if (!Number.isFinite(expected) || expected <= 100) throw new Error(`unexpected production API total: ${expected}`);
          if (early.value !== expected) throw new Error(`early total mismatch: ${early.value} != ${expected}`);
          if (late.value !== expected) throw new Error(`late total mismatch: ${late.value} != ${expected}`);
          if (consoleErrors.length) throw new Error(`console errors: ${consoleErrors.join(' | ')}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: search-result-count-live-cert
          path: artifacts/search-result-count-live
          if-no-files-found: error
