name: ODM Displayable Coverage Recovery V1

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260802123000_odm_displayable_coverage_recovery_v1.sql'
      - 'scripts/contracts/odm-displayable-coverage-recovery-v1-contract.mjs'
      - '.github/workflows/odm-displayable-coverage-recovery-v1.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/contracts/odm-displayable-coverage-recovery-v1-contract.mjs
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm run build
