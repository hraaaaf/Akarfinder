name: Akar V7 J5 Remaining Portals — Offline
on:
  pull_request:
    paths:
      - 'scripts/acquisition/v7_parallel/j5_remaining_portals.mjs'
      - 'scripts/acquisition/__tests__/v7-j5-portals.test.mjs'
      - 'scripts/acquisition/__tests__/test_v7_j5_real_v3_handoff.py'
      - '.github/workflows/akar-v7-j5-portals.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  j5-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Six merged/research portal registry checks, 0 portal requests, 0 DB
        run: node --test scripts/acquisition/__tests__/v7-j5-portals.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated parser dependency (no portal access)
        run: python -m pip install "beautifulsoup4==4.14.3"
      - name: J5 L8 Node -> actual V3 on 1000 URL-only candidates
        run: python -m unittest discover -v -s scripts/acquisition/__tests__ -p 'test_v7_j5_real_v3_handoff.py'

