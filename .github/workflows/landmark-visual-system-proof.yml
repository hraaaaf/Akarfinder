name: Landmark Visual System Proof

on:
  push:
    branches:
      - feat/vivre-ici-landmark-visual-system
    paths:
      - ".github/workflows/landmark-visual-system-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Territory tests
        run: npm run test:territory-dictionary
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Start app
        shell: bash
        run: |
          npm run start -- -p 3218 > /tmp/landmark-visual.log 2>&1 &
          curl --retry 90 --retry-delay 1 --retry-connrefused -fsS "http://127.0.0.1:3218/map?city=casablanca&layer=explore" >/dev/null || { cat /tmp/landmark-visual.log; exit 1; }
      - name: Capture actual city map
        shell: bash
        run: |
          mkdir -p artifacts/landmark-visual-system
          cat > /tmp/capture.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs/promises";
          const base = "http://127.0.0.1:3218/map?city=casablanca&layer=explore";
          const views = [
            ["390x844",390,844],
            ["768x900",768,900],
            ["1280x900",1280,900],
            ["1448x1086",1448,1086],
          ];
          const browser = await chromium.launch({headless:true});
          const report = [];
          for (const [name,width,height] of views) {
            const page = await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            const errors = [];
            page.on("pageerror", e => errors.push(String(e)));
            await page.goto(base,{waitUntil:"networkidle"});
            await page.waitForSelector('[data-akarfinder-national-view="city"]',{timeout:45000});
            await page.waitForFunction(() => Boolean(window.__AKARFINDER_NATIONAL_MAP__), null, {timeout:45000});
            await page.evaluate(async () => {
              const map = window.__AKARFINDER_NATIONAL_MAP__;
              map.jumpTo({center:[-7.63,33.56],zoom:11.45});
              await new Promise(resolve => map.once("idle", resolve));
            });
            await page.waitForTimeout(500);
            const metrics = await page.evaluate(() => {
              const cards = [...document.querySelectorAll("[data-landmark-card]")].map((el) => {
                const r = el.getBoundingClientRect();
                return {id:el.getAttribute("data-landmark-card"),x:r.x,y:r.y,w:r.width,h:r.height};
              });
              let overlaps = 0;
              for (let i=0;i<cards.length;i++) for(let j=i+1;j<cards.length;j++) {
                const a=cards[i], b=cards[j];
                if (!(a.x+a.w+4<=b.x || b.x+b.w+4<=a.x || a.y+a.h+4<=b.y || b.y+b.h+4<=a.y)) overlaps++;
              }
              return {
                cards,
                overlaps,
                sidebar: Boolean(document.querySelector("[data-landmark-sidebar]")),
                mobileRail: Boolean(document.querySelector("[data-landmark-mobile-rail]")),
                bodyOverflow: document.documentElement.scrollWidth - window.innerWidth,
              };
            });
            await page.screenshot({path:"artifacts/landmark-visual-system/after-"+name+".png",fullPage:true});
            report.push({name,width,height,errors,metrics});
            await page.close();
          }
          await fs.writeFile("artifacts/landmark-visual-system/report.json",JSON.stringify(report,null,2));
          await browser.close();
          if (report.some(r => r.errors.length || r.metrics.overlaps > 0 || r.metrics.bodyOverflow > 1)) process.exitCode = 1;
          EOF
          node /tmp/capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landmark-visual-system-proof
          path: artifacts/landmark-visual-system
          if-no-files-found: error
          retention-days: 30
