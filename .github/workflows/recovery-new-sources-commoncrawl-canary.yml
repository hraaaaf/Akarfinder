name: Recovery New Sources Common Crawl Canary

on:
  push:
    branches: ["recovery/source-expansion-400k-candidates-20260925"]
    paths:
      - ".github/workflows/recovery-new-sources-commoncrawl-canary.yml"
      - "scripts/recovery/commoncrawl-new-sources-canary.ts"

permissions:
  contents: read

concurrency:
  group: recovery-new-sources-commoncrawl-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run new-source Common Crawl canary
        run: npx tsx scripts/recovery/commoncrawl-new-sources-canary.ts
      - name: Enforce zero-DB contract
        run: |
          node -e "const s=require('./data/audits/raw-results/recovery-new-sources-commoncrawl-summary.json'); if(s.database_access||s.database_writes||s.source_page_fetches||s.approved_for_import_rows) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-new-sources-commoncrawl-canary
          path: |
            data/audits/raw-results/recovery-new-sources-commoncrawl.jsonl
            data/audits/raw-results/recovery-new-sources-commoncrawl-summary.json
          retention-days: 30
