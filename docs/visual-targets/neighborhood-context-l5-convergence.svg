    <rect x="218" y="108" width="176" height="150" rx="18" fill="#fff" stroke="#dce8f5"/><text x="234" y="136" font-family="Arial" font-size="11" font-weight="700" fill="#0B63CE">CASABLANCA</text><text x="234" y="164" font-family="Arial" font-size="20" font-weight="700" fill="#0B1F3A">Maârif</text><rect x="234" y="180" width="104" height="24" rx="12" fill="#fff3d8"/><text x="244" y="197" font-family="Arial" font-size="10" font-weight="700" fill="#8a6500">INSUFFISANT</text><text x="234" y="226" font-family="Arial" font-size="13" font-weight="700" fill="#0B1F3A">2 repères vérifiés</text>
