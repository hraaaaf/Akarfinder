name: AkarFinder - MarocImmo Apartment Sale Sweep
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/marocimmo-apartment-sale-sweep.yml'
      - 'scripts/acquisition/marocimmo-apartment-sale-sweep.py'
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Sweep MarocImmo apartment sale result pages only
        run: python scripts/acquisition/marocimmo-apartment-sale-sweep.py
      - name: Verify read-only proof
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/marocimmo-apartment-sale-sweep/summary.json'))
          assert p['zero_db_writes'] is True
          assert p['direct_detail_fetches'] == 0
          assert p['robots_root_allowed'] is True
          print('MAROCIMMO APARTMENT SALE SWEEP: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: marocimmo-apartment-sale-sweep-proof
          path: artifacts/marocimmo-apartment-sale-sweep/
          retention-days: 30
