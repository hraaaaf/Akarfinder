name: ANN-L11 Brand Sync

on:
  push:
    branches:
      - agent/announcement-page-l11-pro-conversion
    paths:
      - .github/workflows/ann-l11-brand-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/announcement-page-l11-pro-conversion
      - name: Align visit flow to AkarFinder premium tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/listings/VisitRequestPanel.tsx')
          s = p.read_text()
          replacements = {
            'rounded-[1.25rem] border border-[#eadfca] bg-white p-4 shadow-[0_6px_22px_rgba(7,27,51,0.05)]': 'rounded-[1.25rem] border border-slate-200 bg-white p-4 shadow-[0_6px_22px_rgba(24,56,96,0.06)]',
            'rounded-[1.25rem] border border-[#e3d1aa] bg-[#fffaf0] p-4': 'rounded-[1.25rem] border border-slate-200 bg-white p-4',
            'text-bronze-700': 'text-primary',
            'bg-gradient-to-r from-[#9b7838] to-[#b08942] px-4 py-3 text-[13.5px] font-extrabold text-white shadow-[0_10px_22px_rgba(155,120,56,0.24)] transition hover:brightness-105': 'bg-[#0B63CE] px-4 py-3 text-[13.5px] font-extrabold text-white shadow-[0_8px_20px_rgba(11,99,206,0.22)] transition hover:bg-[#0959B8]',
            'bg-[#fffdf8]': 'bg-white',
            'border-[#eadfca]': 'border-slate-200',
            'bg-[#f0ebe0]': 'bg-slate-100',
            'hover:bg-[#e8e0d0]': 'hover:bg-slate-200',
            'border-[#d8c8a3]': 'border-slate-200',
            'hover:bg-[#f7f3ea]': 'hover:bg-slate-50',
            'border-[#efe3cc]': 'border-slate-200',
            'accent-deepblue': 'accent-[#0B63CE]',
            'bg-gradient-to-r from-[#9b7838] to-[#b08942] px-5 py-3.5 text-[14px] font-extrabold text-white shadow-[0_10px_24px_rgba(155,120,56,0.22)] transition hover:brightness-105 disabled:cursor-not-allowed disabled:opacity-65': 'bg-[#0B63CE] px-5 py-3.5 text-[14px] font-extrabold text-white shadow-[0_8px_20px_rgba(11,99,206,0.22)] transition hover:bg-[#0959B8] disabled:cursor-not-allowed disabled:opacity-65',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected token: {old}')
              s = s.replace(old, new)
          if '#9b7838' in s or '#b08942' in s or '#fffaf0' in s or '#fffdf8' in s or 'text-bronze-700' in s:
              raise SystemExit('legacy visit palette still present')
          p.write_text(s)
          PY
      - name: Commit sync
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/listings/VisitRequestPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(ann-l11): align visit flow with AkarFinder brand"
          git push origin HEAD:agent/announcement-page-l11-pro-conversion
