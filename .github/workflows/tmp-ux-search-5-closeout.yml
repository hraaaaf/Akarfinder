name: TEMP UX-SEARCH-5 Certified Closeout

on:
  push:
    branches:
      - ux/search-navigation-hierarchy-5
    paths:
      - ".github/workflows/tmp-ux-search-5-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search-navigation-hierarchy-5
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update canonical UX/Search closeout docs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const certifiedHead = '771e197027c4c9cd018db8e540313405050b2cc9';
          const specializedRun = '31446472569';
          const nextLot = 'UX-SEARCH-6 — Mobile Precision Pass';
          const score = '9,5/10';
          const closeout = [
            '<!-- UX-SEARCH-5-CLOSEOUT-START -->',
            '## UX-SEARCH-5 — Navigation & Hierarchy Polish ✅ CERTIFIED — PR #483',
            '',
            'Responsabilité unique : **réduire la domination visuelle de la navigation globale sur `/search` et réaligner le header avec le flux Search**, sans modifier DATA, ranking, Source Registry, dédup, prix, ordre commercial ni logique Map.',
            '',
            'Résultat certifié :',
            '',
            '- Search utilise désormais le header en mode **compact + fluid**, sans modifier le comportement global par défaut du `Container` ;',
            '- alignement horizontal header → recherche → inventaire : **delta 0 px** sur les 6 viewports certifiés ;',
            '- hauteur header : **49 px sur 360/390**, **53,8 px sur 768/1024/1280/1440** ; logo/nav/espacements compactés et `Mon projet` rendu secondaire dans le contexte Search ;',
            '- première card : **193 px mobile**, **205,8 px tablette**, **203,8 px desktop** ; grille conservée **2/2/3/4/4**, 0 overflow et 0 image cassée ;',
            '- navigation complète, favoris, publication, thème, menu mobile et sticky behavior restent disponibles ;',
            '- predecessor UX-SEARCH-1/3/4 intégralement vert, notamment le stock visuel certifié **11 contextuels + 1 photo d’ambiance + 2 fail-closed** ;',
            '- exact-head `' + certifiedHead + '` : **25/25 workflows SUCCESS** ;',
            '- run spécialisé `' + specializedRun + '` : **Product Design Reviewer PASS + Independent Release Certifier PASS**, contrat machine **10/10** ;',
            '- revue humaine des captures 390×844 et 1440×900 : **' + score + '** — le header devient une infrastructure discrète et l’inventaire reprend la priorité visuelle.',
            '',
            '**Prochain LOT UX/Search : ' + nextLot + '.**',
            '<!-- UX-SEARCH-5-CLOSEOUT-END -->'
          ].join('\n');

          function replaceBetween(text, start, end, replacement) {
            const a = text.indexOf(start);
            const b = text.indexOf(end);
            if (a < 0 || b < a) throw new Error('missing markers ' + start + ' / ' + end);
            return text.slice(0, a) + replacement + text.slice(b + end.length);
          }

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          const readmeBlock = [
            '<!-- UX-SEARCH-CONVERGENCE-CURRENT-START -->',
            '### Convergence Search actuelle — UX-SEARCH-1 à UX-SEARCH-5 ✅',
            '',
            '- **UX-SEARCH-1 — Density First ✅ PR #479** : grille certifiée 2/2/3/4/4 ; densité **9,3/10**.',
            '- **UX-SEARCH-2 — Compact Search & Filters ✅ PR #480** : première annonce ~240–250 px, touch targets 48 px, 0 overflow ; **9,5/10**.',
            '- **UX-SEARCH-3 — Card Architecture ✅ PR #481** : `IMAGE → PRIX → TITRE → LOCALISATION → FACTS → PROVENANCE`, confiance/source préservées ; **9,4/10**.',
            '- **UX-SEARCH-4 — Visual Inventory System ✅ PR #482** : fallbacks contextuels truth-safe activés ; variété visuelle certifiée, stable et transparente ; **9,5/10**.',
            '- **UX-SEARCH-5 — Navigation & Hierarchy Polish ✅ PR #483** : header Search compact/fluid, alignement **0 px**, hauteur **49–53,8 px**, première card **193–203,8 px**, grille et predecessor gates préservés ; **' + score + '**.',
            '- Les cinq lots préservent ranking, DATA, Source Registry, dédup, ordre commercial, prix, Map et transparence de provenance.',
            '- **Prochain LOT UX/Search : ' + nextLot + '** : precision pass mobile sur rythme, contrôles, touch ergonomics et micro-clipping, sans rouvrir les lots 1–5 ; gate UX ≥9/10.',
            '<!-- UX-SEARCH-CONVERGENCE-CURRENT-END -->'
          ].join('\n');
          readme = replaceBetween(readme, '<!-- UX-SEARCH-CONVERGENCE-CURRENT-START -->', '<!-- UX-SEARCH-CONVERGENCE-CURRENT-END -->', readmeBlock);
          fs.writeFileSync(readmePath, readme);

          const roadmapPath = 'docs/ROADMAP.md';
          let roadmap = fs.readFileSync(roadmapPath, 'utf8');
          roadmap = roadmap.replace('UX-SEARCH-4 ✅ PR #482 ;', 'UX-SEARCH-4 ✅ PR #482 ; UX-SEARCH-5 ✅ PR #483 ;');
          if (!roadmap.includes('UX-SEARCH-5 — Navigation & Hierarchy Polish ✅ CERTIFIED — PR #483')) {
            const anchor = '<!-- UX-SEARCH-4-CLOSEOUT-END -->';
            if (!roadmap.includes(anchor)) throw new Error('ROADMAP UX4 anchor missing');
            roadmap = roadmap.replace(anchor, anchor + '\n\n' + closeout);
          }
          roadmap = roadmap.replace(/\*\*Prochain LOT UX\/Search : UX-SEARCH-5 — Navigation & Hierarchy Polish\.\*\*/g, '**Prochain LOT UX/Search : ' + nextLot + '.**');
          fs.writeFileSync(roadmapPath, roadmap);

          const sessionPath = 'docs/SESSION.md';
          let session = fs.readFileSync(sessionPath, 'utf8');
          if (!session.includes('UX-SEARCH-5 — Navigation & Hierarchy Polish ✅ CERTIFIED — PR #483')) {
            const anchor = '<!-- UX-SEARCH-4-CLOSEOUT-END -->';
            if (!session.includes(anchor)) throw new Error('SESSION UX4 anchor missing');
            session = session.replace(anchor, anchor + '\n\n' + closeout);
          }
          session = session.replace(/- Prochain LOT UX\/Search : \*\*UX-SEARCH-5 — Navigation & Hierarchy Polish\*\*[^\n]*/g, '- Prochain LOT UX/Search : **' + nextLot + '** ; UX-SEARCH-1 à 5 sont fermés et doivent rester des predecessor gates.');
          fs.writeFileSync(sessionPath, session);
          NODE
      - name: Self-remove and commit certified docs
        shell: bash
        run: |
          rm .github/workflows/tmp-ux-search-5-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md .github/workflows/tmp-ux-search-5-closeout.yml
          git commit -m "docs(search): certify UX-SEARCH-5 hierarchy"
          git push origin HEAD:ux/search-navigation-hierarchy-5
