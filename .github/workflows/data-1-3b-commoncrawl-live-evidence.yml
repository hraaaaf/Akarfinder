name: DATA-1.3B Common Crawl Live Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/data-1-3b-commoncrawl-live-evidence.yml"
      - "scripts/census/run-commoncrawl-live-duckdb.sh"
      - "scripts/census/commoncrawl-url-index.ts"
      - "docs/data/DATA-1-3B-COMMON-CRAWL-LIVE-EVIDENCE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commoncrawl-live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CC_CRAWL: CC-MAIN-2026-25
      DUCKDB_BIN: .tmp/data-1-3b/bin/duckdb
      CC_PARQUET_PATHS_FILE: .tmp/data-1-3b/warc-index-parquet.paths
      CC_EVIDENCE_OUT_DIR: .tmp/data-1-3b/results
      CC_EVIDENCE_WORK_DIR: .tmp/data-1-3b/batched
      CC_PARQUET_BATCH_SIZE: 20
      CC_BATCH_MAX_ATTEMPTS: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install DuckDB CLI ephemerally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/data-1-3b/bin
          curl --fail --location --retry 4 --retry-all-errors \
            https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip \
            --output .tmp/data-1-3b/duckdb.zip
          unzip -q .tmp/data-1-3b/duckdb.zip -d .tmp/data-1-3b/bin
          "${DUCKDB_BIN}" --version

      - name: Resolve current crawl Parquet paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${CC_EVIDENCE_OUT_DIR}"
          curl --fail --location --retry 4 --retry-all-errors \
            "https://data.commoncrawl.org/crawl-data/${CC_CRAWL}/cc-index-table.paths.gz" \
            --output .tmp/data-1-3b/cc-index-table.paths.gz
          gzip -dc .tmp/data-1-3b/cc-index-table.paths.gz \
            | grep "cc-index/table/cc-main/warc/crawl=${CC_CRAWL}/subset=warc/" \
            > "${CC_PARQUET_PATHS_FILE}"
          COUNT=$(wc -l < "${CC_PARQUET_PATHS_FILE}" | tr -d ' ')
          echo "parquet_files=${COUNT}" | tee "${CC_EVIDENCE_OUT_DIR}/manifest.txt"
          test "${COUNT}" -ge 250
          test "${COUNT}" -le 400

      - name: Query URL Index in retryable batches
        shell: bash
        run: |
          chmod +x scripts/census/run-commoncrawl-live-duckdb.sh
          scripts/census/run-commoncrawl-live-duckdb.sh

      - name: Upload DATA-1.3B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-1-3b-commoncrawl-live-evidence
          path: .tmp/data-1-3b/results/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce complete live evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "${CC_EVIDENCE_OUT_DIR}/lane-a.csv"
          test -s "${CC_EVIDENCE_OUT_DIR}/lane-b.csv"
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('.tmp/data-1-3b/results/summary.json').read_text())
          assert summary['warcFetchAllowed'] is False
          assert summary['laneAComplete'] is True
          assert summary['laneBComplete'] is True
          assert summary['batchCount'] >= 10
          print(json.dumps(summary, indent=2))
          PY
