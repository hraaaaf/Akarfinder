name: Neighborhood Visual P1.3 Aviation Fast Source Sweep

on:
  pull_request:
    paths:
      - ".github/workflows/neighborhood-visual-p1-3-aviation-fast-source.yml"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sweep exact Aviation anchors
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/audits/neighborhood-visual-p1-3-aviation/fast-source"
          rm -rf "$OUT" && mkdir -p "$OUT/images"
          python3 - <<'PY'
          import hashlib,json,math,pathlib,urllib.parse,urllib.request
          OUT=pathlib.Path('data/audits/neighborhood-visual-p1-3-aviation/fast-source'); IMG=OUT/'images'; UA='AkarFinder-P1.3-fast-source/1.0'
          anchors=[
            ('saint-exupery',33.9900005,-6.8270343),
            ('houmane-west',33.9892,-6.8245),
            ('houmane-east',33.9894,-6.8215),
            ('tadla-doukkala',33.9940,-6.8305),
            ('souss-core',33.9920,-6.8340),
            ('aviation-center',33.9915,-6.8285),
          ]
          def f(v):
            try:return float(v)
            except:return None
          def hav(a,b,c,d):
            R=6371000.;p1,p2=math.radians(a),math.radians(c);dp=math.radians(c-a);dl=math.radians(d-b)
            x=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
            return 2*R*math.asin(math.sqrt(x))
          found={}
          for label,qlat,qlng in anchors:
            q=urllib.parse.urlencode({'lat':qlat,'lng':qlng,'zoomLevel':18,'join':'sequence','orderBy':'id','orderDirection':'desc'})
            req=urllib.request.Request('https://api.openstreetcam.org/2.0/photo/?'+q,headers={'User-Agent':UA,'Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=40) as r:raw=json.load(r)
            except Exception as e:
              print('QUERY_ERROR',label,repr(e));continue
            for d in raw.get('result',{}).get('data',[]):
              lat=f(d.get('lat'));lng=f(d.get('lng'))
              if lat is None or lng is None:continue
              dist=hav(qlat,qlng,lat,lng)
              if dist>700:continue
              urls=[]
              for k in ('fileurlLTh','fileurlProc','imageLthUrl','imageProcUrl','fileurlTh','imageThUrl'):
                v=d.get(k)
                if isinstance(v,str) and v.startswith('http'):urls.append(v)
              if not urls:continue
              pid=str(d.get('id')); seq=d.get('sequence') or {}
              row=found.setdefault(pid,{'id':d.get('id'),'lat':lat,'lng':lng,'heading':d.get('heading'),'shotDate':d.get('shotDate'),'sequence_id':seq.get('id'),'sequence_address':seq.get('address'),'urls':list(dict.fromkeys(urls)),'hits':[]})
              row['hits'].append({'anchor':label,'distance_m':round(dist,1)})
          rows=list(found.values())
          for r in rows:r['best_distance_m']=min(h['distance_m'] for h in r['hits'])
          rows.sort(key=lambda r:r['best_distance_m'])
          kept=[]
          for r in rows:
            if len(kept)>=40:break
            try:
              req=urllib.request.Request(r['urls'][0],headers={'User-Agent':UA})
              with urllib.request.urlopen(req,timeout=45) as resp:b=resp.read()
              if len(b)<20000:continue
              p=IMG/f"{len(kept)+1:02d}_{round(r['best_distance_m']):04d}m_{r['id']}.jpg"; p.write_bytes(b)
              r['file']=p.name; r['bytes']=len(b); r['sha1']=hashlib.sha1(b).hexdigest(); kept.append(r)
            except Exception as e:r['download_error']=repr(e)
          (OUT/'sources.json').write_text(json.dumps({'anchors':anchors,'rows':rows,'kept':kept},ensure_ascii=False,indent=2),encoding='utf-8')
          print('FOUND',len(rows),'KEPT',len(kept))
          for r in kept:print('KEEP',r['best_distance_m'],r['id'],r['lat'],r['lng'],r['sequence_id'],r['file'],r['sha1'])
          if len(kept)<2: raise SystemExit('Need at least two reusable Aviation frames')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neighborhood-visual-p1-3-aviation-fast-source
          path: data/audits/neighborhood-visual-p1-3-aviation/fast-source
          if-no-files-found: error
          retention-days: 7
