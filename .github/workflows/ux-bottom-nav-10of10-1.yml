name: UX-BOTTOM-NAV-10OF10-1 Exact Visual Certification

on:
  pull_request:
    paths:
      - "components/layout/MobileBottomNav.tsx"
      - "app/alerts/page.tsx"
      - "scripts/audits/ux-bottom-nav-10of10-1.mjs"
      - "scripts/scrapers/__tests__/ux-bottom-nav-10of10-1.test.ts"
      - ".github/workflows/ux-bottom-nav-10of10-1.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SEARCH_GATEWAY_ENABLED: "false"

jobs:
  product-design-reviewer:
    name: Product Design Reviewer — Bottom Nav 10/10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Current premium Search + bottom nav contracts
        run: npx tsx --test scripts/scrapers/__tests__/ux-premium-searchbar-1.test.ts scripts/scrapers/__tests__/ux-premium-quickfilters-1.test.ts scripts/scrapers/__tests__/ux-premium-results-header-1.test.ts scripts/scrapers/__tests__/ux-premium-cards-media-1.test.ts scripts/scrapers/__tests__/ux-premium-cards-content-1.test.ts scripts/scrapers/__tests__/ux-premium-grid-1.test.ts scripts/scrapers/__tests__/ux-premium-bottomnav-glass-1.test.ts scripts/scrapers/__tests__/ux-bottom-nav-10of10-1.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build with one transient-network retry
        shell: bash
        run: |
          if npm run build; then exit 0; fi
          echo "First build failed; retrying once for transient external font/network failure."
          rm -rf .next
          npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3175 > /tmp/bottom-nav-product.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3175/search >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bottom-nav-product.log
          exit 1
      - name: Exact bottom navigation visual contract
        env:
          BASE_URL: http://127.0.0.1:3175
          AUDIT_VARIANT: product-design
        run: node scripts/audits/ux-bottom-nav-10of10-1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-bottom-nav-10of10-product-design-proof
          path: data/audits/ux-bottom-nav-10of10-1/product-design
          if-no-files-found: warn
          retention-days: 14

  independent-release-certifier:
    name: Independent Release Certifier — Bottom Nav 10/10
    needs: product-design-reviewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Independent current premium Search + bottom nav contracts
        run: npx tsx --test scripts/scrapers/__tests__/ux-premium-searchbar-1.test.ts scripts/scrapers/__tests__/ux-premium-quickfilters-1.test.ts scripts/scrapers/__tests__/ux-premium-results-header-1.test.ts scripts/scrapers/__tests__/ux-premium-cards-media-1.test.ts scripts/scrapers/__tests__/ux-premium-cards-content-1.test.ts scripts/scrapers/__tests__/ux-premium-grid-1.test.ts scripts/scrapers/__tests__/ux-premium-bottomnav-glass-1.test.ts scripts/scrapers/__tests__/ux-bottom-nav-10of10-1.test.ts
      - name: Independent TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium independently
        run: npx playwright install --with-deps chromium
      - name: Independent production build with one transient-network retry
        shell: bash
        run: |
          if npm run build; then exit 0; fi
          echo "First build failed; retrying once for transient external font/network failure."
          rm -rf .next
          npm run build
      - name: Start independent production server
        shell: bash
        run: |
          npm run start -- -p 3176 > /tmp/bottom-nav-release.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3176/search >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bottom-nav-release.log
          exit 1
      - name: Independently replay exact bottom navigation visual contract
        env:
          BASE_URL: http://127.0.0.1:3176
          AUDIT_VARIANT: release-certifier
        run: node scripts/audits/ux-bottom-nav-10of10-1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-bottom-nav-10of10-release-certifier-proof
          path: data/audits/ux-bottom-nav-10of10-1/release-certifier
          if-no-files-found: warn
          retention-days: 14
