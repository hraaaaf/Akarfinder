name: Product Experience P8 Publication

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/vendre/dossier/page.tsx"
      - "components/vendre/SellerSecurePublishForm.tsx"
      - "components/vendre/SellerAkarFinderPreview.tsx"
      - "lib/seller/listing-score.ts"
      - "lib/seller/seller-property-draft.ts"
      - "lib/seller/authorize-draft-upload.ts"
      - "app/api/leads/route.ts"
      - "app/api/seller-drafts/[draftId]/photos/route.ts"
      - "app/api/seller-drafts/[draftId]/review/route.ts"
      - "app/api/seller-drafts/[draftId]/publication/route.ts"
      - "scripts/scrapers/__tests__/p8-publication-v4.test.ts"
      - "scripts/audits/product-experience-p8-publication.mjs"
      - "docs/AKARFINDER_ANNONCE_MODEL_V1.md"
      - "docs/AKARFINDER_PRODUCT_EXPERIENCE_P8.md"
      - ".github/workflows/product-experience-p8-publication.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: P8 Publication contracts
        run: npx tsx --test scripts/scrapers/__tests__/p8-publication-v4.test.ts
      - name: Validate P8 audit syntax
        run: node --check scripts/audits/product-experience-p8-publication.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start P8 production server
        shell: bash
        run: |
          npm run start -- -p 3219 > /tmp/product-experience-p8.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3219/vendre/dossier >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/product-experience-p8.log
          exit 1
      - name: P8 responsive visual certification
        env:
          BASE_URL: http://127.0.0.1:3219
          AUDIT_OUTPUT_DIR: artifacts/product-experience-p8-publication
        run: node scripts/audits/product-experience-p8-publication.mjs
      - name: Upload P8 AFTER proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-experience-p8-publication-${{ github.run_id }}
          path: artifacts/product-experience-p8-publication
          if-no-files-found: error
          retention-days: 14
