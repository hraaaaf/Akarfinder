name: Recovery V4.11 Controlled Bulk Staging Import

on:
  push:
    branches: ["recovery/v4-11-bulk-transfer-prep-20260927"]
    paths:
      - "data/recovery/v4-11-bulk-staging-approval.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: recovery-v4-11-controlled-bulk-staging-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate approval and isolated target
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          node - <<'NODE'
          const fs=require("fs");
          const a=JSON.parse(fs.readFileSync("data/recovery/v4-11-bulk-staging-approval.json","utf8"));
          if(a.approved!==true) throw new Error("approval not true");
          if(a.rows!==213992) throw new Error("rows");
          if(!Number.isInteger(a.artifact_id)||a.artifact_id<=0) throw new Error("artifact_id");
          if(!/^[0-9a-f]{64}$/.test(a.payload_digest_sha256||"")) throw new Error("payload digest");
          if(a.target_project!=="ancient-violet-43534870") throw new Error("target project");
          if(a.target_branch!=="br-cold-mouse-b2a50yaa") throw new Error("target branch");
          if(a.target_database!=="AkarFinder") throw new Error("target database");
          NODE
          python - <<'PY'
          import os, urllib.parse
          u=urllib.parse.urlparse(os.environ["DATABASE_URL"])
          allowed={
            "ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech",
          }
          if u.hostname not in allowed:
            raise SystemExit(f"refusing unexpected Neon host: {u.hostname}")
          print("isolated Neon host verified")
          PY

      - name: Download approved bulk staging artifact
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(node -p 'require("./data/recovery/v4-11-bulk-staging-approval.json").artifact_id')"
          mkdir -p "$RUNNER_TEMP/bulk"
          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/bulk.zip"
          unzip -q -o "$RUNNER_TEMP/bulk.zip" -d "$RUNNER_TEMP/bulk"
          test -s "$RUNNER_TEMP/bulk/manifest.json"

      - name: Verify manifest and all chunk hashes
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/bulk" <<'NODE'
          const fs=require("fs"), path=require("path"), crypto=require("crypto");
          const dir=process.argv[2];
          const a=require(path.resolve("data/recovery/v4-11-bulk-staging-approval.json"));
          const m=JSON.parse(fs.readFileSync(path.join(dir,"manifest.json"),"utf8"));
          const sha=f=>crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex");
          if(m.remaining_rows!==213992||m.chunks_count!==22) throw new Error("manifest counts");
          if(m.payload_digest_sha256!==a.payload_digest_sha256) throw new Error("payload digest mismatch");
          let rows=0;
          for(const c of m.chunks){
            const f=path.join(dir,"chunks",c.file);
            if(!fs.existsSync(f)) throw new Error("missing chunk "+c.file);
            if(sha(f)!==c.sha256) throw new Error("chunk SHA mismatch "+c.file);
            rows+=c.rows;
          }
          if(rows!==213992) throw new Error("chunk rows");
          if(m.approved_for_import_rows!==0) throw new Error("product approval invariant");
          console.log(JSON.stringify({rows,chunks:m.chunks_count,payload:m.payload_digest_sha256},null,2));
          NODE

      - name: Pre-import readback
        run: |
          set -euo pipefail
          COUNTS="$(docker run --rm -e DATABASE_URL="$DATABASE_URL" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -c "
            SELECT
              (SELECT count(*) FROM public.scrape_runs),
              (SELECT count(*) FROM public.raw_listings),
              (SELECT count(*) FROM public.property_listings),
              (SELECT count(*) FROM public.listing_sources);
          "')"
          echo "pre-import: $COUNTS"
          IFS='|' read -r SCRAPE RAW PL LS <<< "$COUNTS"
          test "$PL" = "8544"
          test "$LS" = "8544"

      - name: Create or reuse V4.11 staging run
        run: |
          set -euo pipefail
          PAYLOAD="$(node -p 'require("./data/recovery/v4-11-bulk-staging-approval.json").payload_digest_sha256')"
          cat > "$RUNNER_TEMP/bulk/create-run.sql" <<'SQL'
          INSERT INTO public.scrape_runs
            (started_at,source_file,source_file_hash,sources_attempted,total_raw,total_clean,errors_count,quality_report_json)
          VALUES
            (now(),'clean-corpus-v4.11-bulk-staging-pack',:'payload',
             '{"scope":"remaining_eligible_v4_11"}'::jsonb,213992,0,0,
             '{"state":"staging_in_progress","promotion_authorized":false}'::jsonb)
          ON CONFLICT (source_file_hash) DO UPDATE SET total_raw=EXCLUDED.total_raw
          RETURNING id;
          SQL
          RUN_ID="$(docker run --rm -e DATABASE_URL="$DATABASE_URL" -e PAYLOAD="$PAYLOAD"             -v "$RUNNER_TEMP/bulk:/bulk" postgres:17 sh -lc             'psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -v payload="$PAYLOAD" -f /bulk/create-run.sql')"
          test -n "$RUN_ID"
          echo "$RUN_ID" > "$RUNNER_TEMP/bulk-run-id"
          echo "staging run id: $RUN_ID"

      - name: Load 22 chunks idempotently
        run: |
          set -euo pipefail
          RUN_ID="$(cat "$RUNNER_TEMP/bulk-run-id")"
          for csv in "$RUNNER_TEMP"/bulk/chunks/*.csv; do
            base="$(basename "$csv")"
            cp "$csv" "$RUNNER_TEMP/bulk/current.csv"
            cat > "$RUNNER_TEMP/bulk/load.sql" <<SQL
          BEGIN;
          CREATE TEMP TABLE stage_raw (
            source_name text NOT NULL,
            source_url text,
            listing_url text NOT NULL,
            raw_json jsonb NOT NULL
          ) ON COMMIT DROP;
          \copy stage_raw(source_name,source_url,listing_url,raw_json) FROM '/bulk/current.csv' WITH (FORMAT csv, HEADER true)
          INSERT INTO public.raw_listings (scrape_run_id,source_name,source_url,listing_url,raw_json)
          SELECT ${RUN_ID},source_name,source_url,listing_url,raw_json
          FROM stage_raw
          ON CONFLICT (scrape_run_id,listing_url) DO NOTHING;
          COMMIT;
          SQL
            docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/bulk:/bulk" postgres:17               sh -lc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f /bulk/load.sql'
            echo "loaded $base"
          done

      - name: Finalize staging run and verify invariants
        run: |
          set -euo pipefail
          RUN_ID="$(cat "$RUNNER_TEMP/bulk-run-id")"
          COUNTS="$(docker run --rm -e DATABASE_URL="$DATABASE_URL" -e RID="$RUN_ID" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -v rid="$RID" -c "
            SELECT
              (SELECT count(*) FROM public.scrape_runs),
              (SELECT count(*) FROM public.raw_listings),
              (SELECT count(*) FROM public.raw_listings WHERE scrape_run_id=:rid),
              (SELECT count(*) FROM public.property_listings),
              (SELECT count(*) FROM public.listing_sources),
              (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='"'"'clean-corpus-v4.11'"'"');
          "')"
          echo "post-import: $COUNTS"
          IFS='|' read -r SCRAPE RAW RAW_RUN PL LS V411 <<< "$COUNTS"
          test "$SCRAPE" = "1"
          test "$RAW" = "213992"
          test "$RAW_RUN" = "213992"
          test "$PL" = "8544"
          test "$LS" = "8544"
          test "$V411" = "8367"

          cat > "$RUNNER_TEMP/bulk/finalize.sql" <<'SQL'
          UPDATE public.scrape_runs
          SET finished_at=now(),
              sources_succeeded='{"scope":"remaining_eligible_v4_11"}'::jsonb,
              quality_report_json='{"state":"staged_complete","promotion_authorized":false}'::jsonb
          WHERE id=:rid;
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -e RID="$RUN_ID" -v "$RUNNER_TEMP/bulk:/bulk" postgres:17             sh -lc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -v rid="$RID" -f /bulk/finalize.sql'
