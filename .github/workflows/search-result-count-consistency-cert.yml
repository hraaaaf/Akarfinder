name: Search Result Count Consistency Cert

on:
  push:
    branches:
      - agent/search-result-count-consistency
    paths:
      - .github/workflows/search-result-count-consistency-cert.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm run start -- -p 3000 > /tmp/akarfinder.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/search >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/akarfinder.log
          exit 1

      - name: Certify 430px total stability
        run: |
          mkdir -p artifacts/search-result-count-consistency
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 430, height: 932 } });
          const consoleErrors = [];
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });

          await page.route('**/api/search/gateway**', async route => {
            await new Promise(resolve => setTimeout(resolve, 2500));
            await route.continue();
          });

          await page.goto('http://127.0.0.1:3000/search', { waitUntil: 'domcontentloaded' });
          const bodyEarly = await page.locator('body').innerText();
          const earlyMatch = bodyEarly.match(/([\d\s.,]+)\s+r[ée]sultats?/i);
          const earlyText = earlyMatch?.[0] ?? null;

          await page.waitForTimeout(3200);
          const bodyLate = await page.locator('body').innerText();
          const lateMatch = bodyLate.match(/([\d\s.,]+)\s+r[ée]sultats?/i);
          const lateText = lateMatch?.[0] ?? null;

          const normalize = value => value ? Number(value.replace(/[^0-9]/g, '')) : null;
          const early = normalize(earlyText);
          const late = normalize(lateText);

          const api = await page.evaluate(async () => {
            const res = await fetch('/api/search?limit=100', { cache: 'no-store' });
            return res.json();
          });

          const expected = Number(api.total);
          const report = { viewport: '430x932', earlyText, lateText, early, late, expected, consoleErrors };
          fs.writeFileSync('artifacts/search-result-count-consistency/report.json', JSON.stringify(report, null, 2));
          await page.screenshot({ path: 'artifacts/search-result-count-consistency/search-430.png', fullPage: true });
          await browser.close();

          if (!Number.isFinite(expected) || expected <= 100) throw new Error(`unexpected API total: ${expected}`);
          if (early !== expected) throw new Error(`early total mismatch: ${early} != ${expected}`);
          if (late !== expected) throw new Error(`late total mismatch: ${late} != ${expected}`);
          if (consoleErrors.length) throw new Error(`console errors: ${consoleErrors.join(' | ')}`);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: search-result-count-consistency-cert
          path: artifacts/search-result-count-consistency
          if-no-files-found: error
