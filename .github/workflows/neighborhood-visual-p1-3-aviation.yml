# Final P1.3 certification trigger after source pinning and temporary-workflow cleanup.
name: Neighborhood Visual P1.3 Aviation Certification

on:
  pull_request:
    paths:
      - "app/visual-qa/aviation/**"
      - "components/search/AviationNeighborhoodVisualQAFixture.tsx"
      - "lib/contextual-illustrations/aviation-neighborhood-visuals.ts"
      - "public/neighborhood-visuals/rabat/aviation/**"
      - "scripts/audits/neighborhood-visual-p1-3-aviation-visual-qa.mjs"
      - "scripts/scrapers/__tests__/neighborhood-visual-p1-3-aviation.test.ts"
      - "supabase/functions/neighborhood-visual-p1-3-aviation-ingest/**"
      - "supabase/migrations/20260813000500_neighborhood_visual_p1_3_aviation_metadata.sql"
      - ".github/workflows/neighborhood-visual-p1-3-aviation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neighborhood-visual-p1-3-aviation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEIGHBORHOOD_VISUAL_QA: "1"
  NEXT_PUBLIC_SEARCH_GATEWAY_ENABLED: "false"

jobs:
  product-design-reviewer:
    name: Product Design Reviewer — Aviation 3-scene QA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: P1.3 contract + predecessors
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/neighborhood-visual-p1-3-aviation.test.ts
          scripts/scrapers/__tests__/neighborhood-visual-p1-2-akkari.test.ts
          scripts/scrapers/__tests__/neighborhood-visual-template-a-p0-1.test.ts
      - name: Deno + TypeScript
        run: |
          deno check supabase/functions/neighborhood-visual-p1-3-aviation-ingest/index.ts
          npx tsc --noEmit
      - name: Verify pinned source bytes
        shell: bash
        run: |
          set -euo pipefail
          echo "9301a9696cbe7a420951f7179d12c755a6492610  public/neighborhood-visuals/rabat/aviation/signature/sofitel-rabat.jpg" | sha1sum --check --strict
          echo "d8e09bfdbad2fdef60f28840b90b79b45f77b8c6  public/neighborhood-visuals/rabat/aviation/immobilier/avenue-mohamed-vi.jpg" | sha1sum --check --strict
          echo "3bfd758bb1bc62a0b9598de68f5940932a898eb7  public/neighborhood-visuals/rabat/aviation/lifestyle/kartaview-260184419.jpg" | sha1sum --check --strict
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Start QA production server
        shell: bash
        run: |
          npm run start -- -p 3163 > /tmp/aviation-p13-product.log 2>&1 &
          for i in {1..40}; do if curl -fsS http://127.0.0.1:3163/visual-qa/aviation >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/aviation-p13-product.log; exit 1
      - name: Certify full responsive Search-card matrix
        env:
          BASE_URL: http://127.0.0.1:3163
          AUDIT_VARIANT: product-design
        run: node scripts/audits/neighborhood-visual-p1-3-aviation-visual-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neighborhood-visual-p1-3-aviation-product-design-proof
          path: data/audits/neighborhood-visual-p1-3-aviation/product-design
          if-no-files-found: error
          retention-days: 14

  independent-release-certifier:
    name: Independent Release Certifier — Aviation 3-scene QA
    needs: product-design-reviewer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Independent contract replay
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/neighborhood-visual-p1-3-aviation.test.ts
          scripts/scrapers/__tests__/neighborhood-visual-p1-2-akkari.test.ts
          scripts/scrapers/__tests__/neighborhood-visual-template-a-p0-1.test.ts
      - name: Independent Deno + TypeScript
        run: |
          deno check supabase/functions/neighborhood-visual-p1-3-aviation-ingest/index.ts
          npx tsc --noEmit
      - name: Independently verify pinned source bytes
        shell: bash
        run: |
          echo "9301a9696cbe7a420951f7179d12c755a6492610  public/neighborhood-visuals/rabat/aviation/signature/sofitel-rabat.jpg" | sha1sum --check --strict
          echo "d8e09bfdbad2fdef60f28840b90b79b45f77b8c6  public/neighborhood-visuals/rabat/aviation/immobilier/avenue-mohamed-vi.jpg" | sha1sum --check --strict
          echo "3bfd758bb1bc62a0b9598de68f5940932a898eb7  public/neighborhood-visuals/rabat/aviation/lifestyle/kartaview-260184419.jpg" | sha1sum --check --strict
      - name: Install Chromium independently
        run: npx playwright install --with-deps chromium
      - name: Independent production build
        run: npm run build
      - name: Start independent QA server
        shell: bash
        run: |
          npm run start -- -p 3164 > /tmp/aviation-p13-release.log 2>&1 &
          for i in {1..40}; do if curl -fsS http://127.0.0.1:3164/visual-qa/aviation >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/aviation-p13-release.log; exit 1
      - name: Independently certify full responsive Search-card matrix
        env:
          BASE_URL: http://127.0.0.1:3164
          AUDIT_VARIANT: release-certifier
        run: node scripts/audits/neighborhood-visual-p1-3-aviation-visual-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neighborhood-visual-p1-3-aviation-release-proof
          path: data/audits/neighborhood-visual-p1-3-aviation/release-certifier
          if-no-files-found: error
          retention-days: 14
