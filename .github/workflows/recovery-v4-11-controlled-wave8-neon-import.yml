name: Recovery V4.11 Controlled Wave8 Neon Import

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/v4-11-wave8-import-approval.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: recovery-v4-11-controlled-wave8-neon-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate approval and isolated target
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          node - <<'NODE'
          const a=require("./data/recovery/v4-11-wave8-import-approval.json");
          if(a.approved!==true||a.rows!==38935)throw new Error("approval");
          if(a.preflight_run_id!==36334430803)throw new Error("preflight binding");
          if(a.artifact_id!==10936503385)throw new Error("artifact binding");
          if(a.artifact_digest!=="sha256:b9102a4df8bad75fb68ce138d3b9464a03831628902fbffdd188973f5619d5af")throw new Error("artifact digest");
          if(a.jsonl_sha256!=="0f8670915f526ccebfffec7fb83cea78f50f797be85fbb675a400570c3cdf451")throw new Error("jsonl sha");
          if(a.target_project!=="ancient-violet-43534870"||a.target_branch!=="br-cold-mouse-b2a50yaa"||a.target_database!=="AkarFinder")throw new Error("target");
          if(a.expected_pre?.property_listings!==100226||a.expected_pre?.listing_sources!==100226)throw new Error("pre baseline");
          if(a.expected_post?.property_listings!==139161||a.expected_post?.listing_sources!==139161)throw new Error("post baseline");
          if(a.production_neon_writes_authorized!==false||a.vercel_deployment_authorized!==false)throw new Error("scope");
          NODE
          python - <<'PY'
          import os,urllib.parse
          h=urllib.parse.urlparse(os.environ["DATABASE_URL"]).hostname
          allowed={
            "ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech",
          }
          if h not in allowed: raise SystemExit("refusing unexpected Neon host")
          PY

      - name: Download and verify price-safe Wave8 artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w8"
          META="$(gh api "repos/${{ github.repository }}/actions/artifacts/10936503385")"
          test "$(printf '%s' "$META" | jq -r .digest)" = "sha256:b9102a4df8bad75fb68ce138d3b9464a03831628902fbffdd188973f5619d5af"
          gh api "repos/${{ github.repository }}/actions/artifacts/10936503385/zip" > "$RUNNER_TEMP/w8.zip"
          unzip -q -o "$RUNNER_TEMP/w8.zip" -d "$RUNNER_TEMP/w8"
          echo "0f8670915f526ccebfffec7fb83cea78f50f797be85fbb675a400570c3cdf451  $RUNNER_TEMP/w8/db-ready-wave8-filtered.jsonl" | sha256sum -c -
          test "$(wc -l < "$RUNNER_TEMP/w8/db-ready-wave8-filtered.jsonl")" = "38935"

      - name: Build import CSV
        run: |
          node - "$RUNNER_TEMP/w8/db-ready-wave8-filtered.jsonl" "$RUNNER_TEMP/w8/import.csv" <<'NODE'
          const fs=require("fs");
          const [src,out]=process.argv.slice(2);
          const rows=fs.readFileSync(src,"utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const INT4_MIN=-2147483648,INT4_MAX=2147483647;
          const intFields=["price_mad","surface_m2","rooms_count","bedrooms_count","bathrooms_count","images_count","data_completeness_score"];
          for(const r of rows)for(const f of intFields){
            const v=r[f];
            if(v!=null&&(!Number.isInteger(v)||v<INT4_MIN||v>INT4_MAX))throw new Error("unsafe int4 "+f+" "+v);
          }
          if(rows.length!==38935||rows.some(r=>r.approved_for_import!==false))throw new Error("artifact invariant");
          if(new Set(rows.map(r=>r.listing_url)).size!==38935)throw new Error("url duplicate");
          if(new Set(rows.map(r=>r.canonical_fingerprint)).size!==38935)throw new Error("fingerprint duplicate");
          if(new Set(rows.map(r=>r.source_name+"|"+r.source_offer_key)).size!==38935)throw new Error("identity duplicate");
          if(rows.some(r=>![r.title,r.city,r.property_type,r.transaction_type].every(x=>x!=null&&String(x).trim()!=="")))throw new Error("core invariant");
          const cols=["canonical_fingerprint","title","price_mad","city","district","property_type","transaction_type","surface_m2","rooms_count","bedrooms_count","bathrooms_count","description_snippet","images_count","seller_name","data_completeness_score","field_confidence","source_name","listing_url","source_url","first_seen_at","last_seen_at","source_offer_key","origin_type","compliance_status","content_fingerprint","ingestion_run_id","displayed_price","price_currency","price_period","price_status"];
          const esc=v=>{if(v===null||v===undefined)return "";const s=typeof v==="object"?JSON.stringify(v):String(v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
          fs.writeFileSync(out,cols.join(",")+"\n"+rows.map(r=>cols.map(k=>esc(r[k])).join(",")).join("\n")+"\n");
          NODE

      - name: Atomic Wave8 import
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/w8/import.sql" <<'SQL'
          BEGIN;
          CREATE TEMP TABLE stage_w8 (
            canonical_fingerprint text NOT NULL,title text NOT NULL,price_mad integer,city text NOT NULL,district text,
            property_type text NOT NULL,transaction_type text NOT NULL,surface_m2 integer,rooms_count integer,
            bedrooms_count integer,bathrooms_count integer,description_snippet text,images_count integer,seller_name text,
            data_completeness_score integer,field_confidence jsonb,source_name text NOT NULL,listing_url text NOT NULL,
            source_url text,first_seen_at timestamptz,last_seen_at timestamptz,source_offer_key text NOT NULL,origin_type text,
            compliance_status text,content_fingerprint text,ingestion_run_id text,displayed_price numeric,
            price_currency text,price_period text,price_status text
          ) ON COMMIT DROP;
          \copy stage_w8 FROM '/w8/import.csv' WITH (FORMAT csv, HEADER true)

          CREATE TEMP TABLE existing_identity_w8 AS
          SELECT DISTINCT
            CASE
              WHEN listing_url ~* 'mubawab\.ma' THEN 'mubawab.ma'
              WHEN listing_url ~* 'avito\.ma' THEN 'avito.ma'
              ELSE NULL
            END AS source_name,
            CASE
              WHEN listing_url ~* 'mubawab\.ma' THEN (regexp_match(listing_url, '/(a|pa)/([0-9]+)(/|$)'))[2]
              WHEN listing_url ~* 'avito\.ma' THEN (regexp_match(listing_url, '_([0-9]+)\.html?$'))[1]
              ELSE NULL
            END AS source_offer_key
          FROM public.listing_sources
          WHERE listing_url ~* '(mubawab\.ma|avito\.ma)';
          CREATE INDEX ON existing_identity_w8(source_name,source_offer_key);

          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.property_listings) <> 100226 THEN RAISE EXCEPTION 'pre property baseline mismatch'; END IF;
            IF (SELECT count(*) FROM public.listing_sources) <> 100226 THEN RAISE EXCEPTION 'pre source baseline mismatch'; END IF;
            IF (SELECT count(*) FROM stage_w8) <> 38935 THEN RAISE EXCEPTION 'stage count mismatch'; END IF;
            IF EXISTS (SELECT 1 FROM stage_w8 s JOIN public.listing_sources ls ON ls.listing_url=s.listing_url) THEN RAISE EXCEPTION 'unexpected URL overlap'; END IF;
            IF EXISTS (SELECT 1 FROM stage_w8 s JOIN public.property_listings pl ON pl.canonical_fingerprint=s.canonical_fingerprint) THEN RAISE EXCEPTION 'unexpected fingerprint overlap'; END IF;
            IF EXISTS (SELECT 1 FROM stage_w8 s JOIN existing_identity_w8 e ON e.source_name=s.source_name AND e.source_offer_key=s.source_offer_key) THEN RAISE EXCEPTION 'unexpected portal identity overlap'; END IF;
          END $$;

          INSERT INTO public.property_listings (
            canonical_fingerprint,title,price_mad,city,district,property_type,transaction_type,surface_m2,rooms_count,
            bedrooms_count,bathrooms_count,description_snippet,images_count,seller_name,data_completeness_score,field_confidence
          )
          SELECT canonical_fingerprint,title,price_mad,city,district,property_type,transaction_type,surface_m2,rooms_count,
                 bedrooms_count,bathrooms_count,description_snippet,images_count,seller_name,data_completeness_score,field_confidence
          FROM stage_w8;

          INSERT INTO public.listing_sources (
            property_listing_id,source_name,listing_url,source_url,first_seen_at,last_seen_at,is_active,source_offer_key,
            origin_type,compliance_status,content_fingerprint,ingestion_run_id,displayed_price,price_currency,price_period,price_status
          )
          SELECT pl.id,s.source_name,s.listing_url,s.source_url,s.first_seen_at,s.last_seen_at,true,s.source_offer_key,
                 s.origin_type,s.compliance_status,s.content_fingerprint,s.ingestion_run_id,s.displayed_price,
                 s.price_currency,s.price_period,s.price_status
          FROM stage_w8 s
          JOIN public.property_listings pl ON pl.canonical_fingerprint=s.canonical_fingerprint;

          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.property_listings) <> 139161 THEN RAISE EXCEPTION 'property total mismatch'; END IF;
            IF (SELECT count(*) FROM public.listing_sources) <> 139161 THEN RAISE EXCEPTION 'source total mismatch'; END IF;
            IF (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='clean-corpus-v4.11-wave8') <> 38935 THEN RAISE EXCEPTION 'wave8 count mismatch'; END IF;
          END $$;
          COMMIT;
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w8:/w8" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f /w8/import.sql'

      - name: Independent readback
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/w8/readback.sql" <<'SQL'
          SELECT
            (SELECT count(*) FROM public.property_listings),
            (SELECT count(*) FROM public.listing_sources),
            (SELECT count(DISTINCT listing_url) FROM public.listing_sources),
            (SELECT count(DISTINCT canonical_fingerprint) FROM public.property_listings),
            (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='clean-corpus-v4.11-wave8'),
            (SELECT count(DISTINCT listing_url) FROM public.listing_sources WHERE ingestion_run_id='clean-corpus-v4.11-wave8'),
            (SELECT count(*) FROM public.listing_sources ls LEFT JOIN public.property_listings pl ON pl.id=ls.property_listing_id WHERE pl.id IS NULL),
            (SELECT count(*) FROM public.listing_sources WHERE is_active IS NOT TRUE),
            (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id LIKE 'clean-corpus-v4.11%'),
            (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id NOT LIKE 'clean-corpus-v4.11%' OR ingestion_run_id IS NULL),
            (SELECT count(*) FROM public.property_listings WHERE canonical_fingerprint IS NULL OR btrim(canonical_fingerprint)='' OR title IS NULL OR btrim(title)='' OR city IS NULL OR btrim(city)='' OR property_type IS NULL OR btrim(property_type)='' OR transaction_type IS NULL OR btrim(transaction_type)=''),
            (SELECT count(*) FROM public.listing_sources WHERE listing_url IS NULL OR btrim(listing_url)='' OR source_name IS NULL OR btrim(source_name)='')
          ;
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w8:/w8" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -f /w8/readback.sql' | tee "$RUNNER_TEMP/w8/readback-result.txt"
          OUT="$(tail -n1 "$RUNNER_TEMP/w8/readback-result.txt")"
          test "$OUT" = "139161|139161|139161|139161|38935|38935|0|0|139125|36|0|0"

      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-wave8-import-readback
          path: ${{ runner.temp }}/w8/readback-result.txt
          retention-days: 30
