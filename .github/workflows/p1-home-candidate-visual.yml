name: P1 Home Candidate Visual

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p1-home-candidate-visual.yml"
      - "app/visual-qa/p1-home-candidate/**"
      - "scripts/audits/p1-home-candidate-visual.mjs"
      - "docs/benchmarks/2026-09-12-home-premium-benchmark.md"
      - "components/home/SearchEntryOrchestrator.tsx"
      - "components/landing/SignatureMapSection.tsx"
      - "components/landing/SiteFooter.tsx"
      - "components/layout/SiteHeader.tsx"
  workflow_dispatch: {}

concurrency:
  group: p1-home-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Latest-commit scope check
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(\.github/workflows/p1-home-candidate-visual\.yml|app/visual-qa/p1-home-candidate/|scripts/audits/p1-home-candidate-visual\.mjs|docs/benchmarks/2026-09-12-home-premium-benchmark\.md|components/home/SearchEntryOrchestrator\.tsx|components/landing/(SignatureMapSection|SiteFooter)\.tsx|components/layout/SiteHeader\.tsx)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Latest commit does not affect the P1 HOME candidate; skipping heavy work."
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci
      - name: TypeScript
        if: steps.scope.outputs.run == 'true'
        run: npx tsc --noEmit
      - name: Build production app
        if: steps.scope.outputs.run == 'true'
        run: npm run build
      - name: Install Chromium
        if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Start candidate production mockup
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          npm run start -- -p 3217 > /tmp/p1-home-candidate.log 2>&1 &
          curl --retry 90 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:3217/visual-qa/p1-home-candidate >/dev/null || { cat /tmp/p1-home-candidate.log; exit 1; }
      - name: Capture candidate 390 / 768 / 1280
        if: steps.scope.outputs.run == 'true'
        env:
          BASE_URL: http://127.0.0.1:3217
          AUDIT_OUTPUT_DIR: artifacts/p1-home-candidate
        run: node scripts/audits/p1-home-candidate-visual.mjs
      - name: Upload P1 HOME candidate evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p1-home-candidate-${{ github.run_id }}
          path: artifacts/p1-home-candidate
          if-no-files-found: error
          retention-days: 30
