name: HA Isolated Baseline Parity Rehearsal

# AKARFINDER-HA03-BASELINE-20260924
# Disposable PostgreSQL 17 only. No provider secrets, no production DB.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - infra/neon-migration-20260923
    paths:
      - ".github/workflows/ha-isolated-baseline-parity-rehearsal.yml"
      - "scripts/scrapers/__tests__/ha-isolated-baseline-parity-workflow-guard.test.ts"

permissions:
  contents: read

concurrency:
  group: ha-isolated-baseline-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_IMAGE: postgres:17
      PG_PASSWORD: akarfinder-ha-baseline-only
      NETWORK: akarfinder-ha-baseline
      SOURCE: akarfinder-ha-baseline-source
      TARGET: akarfinder-ha-baseline-target
      REHEARSAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Start isolated PostgreSQL 17 nodes
        shell: bash
        run: |
          set -euo pipefail
          docker network create "$NETWORK"
          for node in "$SOURCE" "$TARGET"; do
            docker run -d --rm \
              --name "$node" \
              --network "$NETWORK" \
              -e POSTGRES_PASSWORD="$PG_PASSWORD" \
              -e POSTGRES_DB=postgres \
              "$PG_IMAGE"
          done
          for node in "$SOURCE" "$TARGET"; do
            for attempt in $(seq 1 30); do
              docker exec "$node" pg_isready -U postgres -d postgres >/dev/null 2>&1 && break
              [ "$attempt" -eq 30 ] && { echo "::error::$node did not become ready"; exit 1; }
              sleep 1
            done
          done

      - name: Create matching baseline schema and data
        shell: bash
        run: |
          set -euo pipefail
          for node in "$SOURCE" "$TARGET"; do
            docker exec -i "$node" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create table public.ha_baseline_parent (
            id bigint generated by default as identity primary key,
            label text not null,
            updated_at timestamptz not null
          );

          create table public.ha_baseline_child (
            id bigint primary key,
            parent_id bigint not null references public.ha_baseline_parent(id),
            payload text not null,
            version integer not null,
            updated_at timestamptz not null
          );

          insert into public.ha_baseline_parent (id,label,updated_at)
          overriding system value values
            (1,'parent-1','2026-09-24T00:00:00Z'::timestamptz),
            (2,'parent-2','2026-09-24T00:00:00Z'::timestamptz);
          select setval('public.ha_baseline_parent_id_seq', 2, true);

          insert into public.ha_baseline_child (id,parent_id,payload,version,updated_at) values
            (10,1,'child-10',1,'2026-09-24T00:00:00Z'::timestamptz),
            (20,2,'child-20',1,'2026-09-24T00:00:00Z'::timestamptz);
          SQL
          done

      - name: Prove baseline parity and divergence detectors
        shell: bash
        run: |
          set -euo pipefail

          sql_value() {
            local node="$1"
            local sql="$2"
            docker exec "$node" psql -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 -c "$sql"
          }

          schema_hash() {
            local node="$1"
            local table="$2"
            local schema_sql
            schema_sql="with parts as (
              select
                'column:' || lpad(c.ordinal_position::text, 5, '0') || ':' ||
                c.column_name || ':' ||
                c.data_type || ':' ||
                coalesce(c.udt_schema, '') || ':' ||
                coalesce(c.udt_name, '') || ':' ||
                c.is_nullable || ':' ||
                coalesce(c.column_default, '') || ':' ||
                c.is_identity || ':' ||
                coalesce(c.identity_generation, '') || ':' ||
                c.is_generated || ':' ||
                coalesce(c.generation_expression, '') || ':' ||
                coalesce(c.collation_name, '') as part
              from information_schema.columns c
              where c.table_schema='public' and c.table_name='$table'

              union all

              select
                'constraint:' || con.conname || ':' ||
                pg_get_constraintdef(con.oid, true)
              from pg_constraint con
              where con.conrelid='public.$table'::regclass

              union all

              select
                'index:' || i.indexname || ':' || i.indexdef
              from pg_indexes i
              where i.schemaname='public' and i.tablename='$table'

              union all

              select
                'table_flags:' || c.relreplident || ':' ||
                c.relrowsecurity::text || ':' ||
                c.relforcerowsecurity::text
              from pg_class c
              where c.oid='public.$table'::regclass
            )
            select md5(coalesce(string_agg(part, E'\\n' order by part), '')) from parts;"
            sql_value "$node" "$schema_sql"
          }

          sequence_json() {
            local node="$1"
            local table="$2"
            local sequence_sql
            sequence_sql="select coalesce(json_agg(x order by x.column_name)::text,'[]') from (
              select c.column_name,
                     c.is_identity,
                     c.identity_generation,
                     c.column_default,
                     pg_get_serial_sequence('public.$table', c.column_name) as sequence_name,
                     s.data_type::text as sequence_data_type,
                     s.start_value,
                     s.min_value,
                     s.max_value,
                     s.increment_by,
                     s.cycle,
                     s.cache_size,
                     s.last_value
              from information_schema.columns c
              left join pg_class seq_class
                on seq_class.oid = to_regclass(pg_get_serial_sequence('public.$table', c.column_name))
              left join pg_namespace seq_ns
                on seq_ns.oid = seq_class.relnamespace
              left join pg_sequences s
                on s.schemaname = seq_ns.nspname
               and s.sequencename = seq_class.relname
              where c.table_schema='public'
                and c.table_name='$table'
                and (c.is_identity='YES' or c.column_default like 'nextval(%')
            ) x;"
            sql_value "$node" "$sequence_sql"
          }

          count_value() {
            sql_value "$1" "select count(*) from public.$2;"
          }

          content_digest() {
            sql_value "$1" "select md5(coalesce(string_agg(row_hash, '' order by row_hash), '')) from (select md5(row_to_json(t)::text) as row_hash from public.$2 t) q;"
          }

          pk_digest() {
            local node="$1"
            local table="$2"
            local pk_cols
            pk_cols="$(sql_value "$node" "select string_agg(quote_ident(a.attname), ', ' order by k.ord) from pg_index i join lateral unnest(i.indkey) with ordinality k(attnum,ord) on true join pg_attribute a on a.attrelid=i.indrelid and a.attnum=k.attnum where i.indrelid='public.$table'::regclass and i.indisprimary;")"
            [ -n "$pk_cols" ] || { echo "::error::$table primary key missing"; exit 1; }
            sql_value "$node" "select md5(coalesce(string_agg(row_hash, '' order by row_hash), '')) from (select md5(row_to_json(q)::text) as row_hash from (select $pk_cols from public.$table) q) x;"
          }

          repl_ident() {
            sql_value "$1" "select relreplident from pg_class where oid='public.$2'::regclass;"
          }

          assert_table_equal() {
            local table="$1"
            [ "$(count_value "$SOURCE" "$table")" = "$(count_value "$TARGET" "$table")" ] || { echo "::error::$table count parity failed"; exit 1; }
            [ "$(pk_digest "$SOURCE" "$table")" = "$(pk_digest "$TARGET" "$table")" ] || { echo "::error::$table PK parity failed"; exit 1; }
            [ "$(content_digest "$SOURCE" "$table")" = "$(content_digest "$TARGET" "$table")" ] || { echo "::error::$table content parity failed"; exit 1; }
            [ "$(schema_hash "$SOURCE" "$table")" = "$(schema_hash "$TARGET" "$table")" ] || { echo "::error::$table schema parity failed"; exit 1; }
            [ "$(repl_ident "$SOURCE" "$table")" = "$(repl_ident "$TARGET" "$table")" ] || { echo "::error::$table replica identity parity failed"; exit 1; }
            [ "$(sequence_json "$SOURCE" "$table")" = "$(sequence_json "$TARGET" "$table")" ] || { echo "::error::$table sequence metadata parity failed"; exit 1; }
          }

          for table in ha_baseline_parent ha_baseline_child; do
            assert_table_equal "$table"
          done

          # Count divergence detector.
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "insert into public.ha_baseline_child values (30,1,'count-extra',1,'2026-09-24T00:00:00Z');"
          [ "$(count_value "$SOURCE" ha_baseline_child)" != "$(count_value "$TARGET" ha_baseline_child)" ] || {
            echo "::error::count mismatch detector failed"; exit 1;
          }
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "delete from public.ha_baseline_child where id=30;"

          # Content divergence detector with same count and PK set.
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "update public.ha_baseline_child set payload='content-divergence' where id=10;"
          [ "$(content_digest "$SOURCE" ha_baseline_child)" != "$(content_digest "$TARGET" ha_baseline_child)" ] || {
            echo "::error::content digest mismatch detector failed"; exit 1;
          }
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "update public.ha_baseline_child set payload='child-10' where id=10;"

          # PK-set divergence detector with same row count.
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "delete from public.ha_baseline_child where id=20;
                insert into public.ha_baseline_child values (21,2,'child-20',1,'2026-09-24T00:00:00Z');"
          [ "$(count_value "$SOURCE" ha_baseline_child)" = "$(count_value "$TARGET" ha_baseline_child)" ] || {
            echo "::error::PK detector setup did not preserve count"; exit 1;
          }
          [ "$(pk_digest "$SOURCE" ha_baseline_child)" != "$(pk_digest "$TARGET" ha_baseline_child)" ] || {
            echo "::error::PK-set mismatch detector failed"; exit 1;
          }
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "delete from public.ha_baseline_child where id=21;
                insert into public.ha_baseline_child values (20,2,'child-20',1,'2026-09-24T00:00:00Z');"

          # Schema fingerprint divergence detector.
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "alter table public.ha_baseline_child add column unexpected_note text;"
          [ "$(schema_hash "$SOURCE" ha_baseline_child)" != "$(schema_hash "$TARGET" ha_baseline_child)" ] || {
            echo "::error::schema fingerprint mismatch detector failed"; exit 1;
          }
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "alter table public.ha_baseline_child drop column unexpected_note;"

          # Replica identity divergence detector.
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "alter table public.ha_baseline_child replica identity full;"
          [ "$(repl_ident "$SOURCE" ha_baseline_child)" != "$(repl_ident "$TARGET" ha_baseline_child)" ] || {
            echo "::error::replica identity mismatch detector failed"; exit 1;
          }
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "alter table public.ha_baseline_child replica identity default;"

          # Sequence metadata/state divergence detector.
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "alter sequence public.ha_baseline_parent_id_seq increment by 2;"
          [ "$(sequence_json "$SOURCE" ha_baseline_parent)" != "$(sequence_json "$TARGET" ha_baseline_parent)" ] || {
            echo "::error::sequence metadata mismatch detector failed"; exit 1;
          }
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "alter sequence public.ha_baseline_parent_id_seq increment by 1;"

          for table in ha_baseline_parent ha_baseline_child; do
            assert_table_equal "$table"
          done

          jq -n \
            --arg application_commit "$REHEARSAL_HEAD_SHA" \
            --arg github_execution_sha "$GITHUB_SHA" \
            '{
              schema_version: "1.0",
              rehearsal: "HA03A_ISOLATED_BASELINE_PARITY_PG17",
              provider_specific_certification: false,
              application_commit: $application_commit,
              github_execution_sha: $github_execution_sha,
              exact_baseline_parity: "PASS",
              count_mismatch_detector: "PASS",
              pk_set_mismatch_detector: "PASS",
              content_digest_mismatch_detector: "PASS",
              schema_fingerprint_mismatch_detector: "PASS",
              replica_identity_mismatch_detector: "PASS",
              sequence_metadata_state_mismatch_detector: "PASS",
              final_restored_parity: "PASS",
              secrets_redacted: true,
              verdict: "ISOLATED_BASELINE_PARITY_PASS",
              limitations: [
                "Does not prove live Supabase to Neon baseline parity.",
                "Does not certify provider sequence collision safety.",
                "Does not prove provider-specific foreign-key data consistency.",
                "Does not mutate production or provider databases."
              ]
            }' > "$RUNNER_TEMP/HA_ISOLATED_BASELINE_PARITY.json"

      - name: Guard artifact against secret leakage
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/HA_ISOLATED_BASELINE_PARITY.json"
          test -s "$artifact"
          if grep -Eiq 'postgres(ql)?://|password|SUPABASE_DATABASE_URL|NEON_DATABASE_URL|service_role' "$artifact"; then
            echo "::error::Secret-like material detected in baseline parity artifact"
            exit 1
          fi

      - name: Upload baseline parity proof
        uses: actions/upload-artifact@v4
        with:
          name: ha-isolated-baseline-parity-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/HA_ISOLATED_BASELINE_PARITY.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated nodes
        if: always()
        shell: bash
        run: |
          docker rm -f "$SOURCE" "$TARGET" >/dev/null 2>&1 || true
          docker network rm "$NETWORK" >/dev/null 2>&1 || true
