name: Recovery V4.11 Wave10 Route Residue Neon Preflight
on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths: ["data/recovery/activate-v4-11-wave10-route-residue-preflight.txt"]
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Validate isolated target
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,urllib.parse
          h=urllib.parse.urlparse(os.environ["DATABASE_URL"]).hostname
          allowed={"ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech"}
          if h not in allowed: raise SystemExit("unexpected host")
          PY
      - name: Download immutable Wave10 artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w10" data/audits/v4-11-wave10-neon-preflight
          gh api "repos/${{ github.repository }}/actions/artifacts/10939012202/zip" > "$RUNNER_TEMP/w10.zip"
          unzip -q "$RUNNER_TEMP/w10.zip" -d "$RUNNER_TEMP/w10"
          echo "a56b2a48f1e07b77555f217af888ddd5c3504d4d66c78c513d4404924c1a0e92  $RUNNER_TEMP/w10/db-ready-wave10-route-residue.jsonl" | sha256sum -c -
          test "$(wc -l < "$RUNNER_TEMP/w10/db-ready-wave10-route-residue.jsonl")" = "97"
      - name: Build candidate CSV
        run: |
          node - "$RUNNER_TEMP/w10/db-ready-wave10-route-residue.jsonl" "$RUNNER_TEMP/w10/c.csv" <<'NODE'
          const fs=require("fs");const [src,out]=process.argv.slice(2);const rs=fs.readFileSync(src,"utf8").trim().split(/\r?\n/).map(JSON.parse);const e=v=>'"'+String(v??"").replace(/"/g,'""')+'"';fs.writeFileSync(out,"listing_url,canonical_fingerprint,source_name,source_offer_key\n"+rs.map(r=>[r.listing_url,r.canonical_fingerprint,r.source_name,r.source_offer_key].map(e).join(",")).join("\n")+"\n");
          NODE
      - name: Read-only overlap preflight
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/w10/p.sql" <<'SQL'
          DROP TABLE IF EXISTS w10_pf_20260927;
          CREATE TEMP TABLE w10_pf_20260927(listing_url text,canonical_fingerprint text,source_name text,source_offer_key text);
          \copy w10_pf_20260927 FROM '/w10/c.csv' WITH (FORMAT csv, HEADER true)
          SELECT
            (SELECT count(*) FROM w10_pf_20260927),
            (SELECT count(*) FROM w10_pf_20260927 c JOIN public.listing_sources ls ON ls.listing_url=c.listing_url),
            (SELECT count(*) FROM w10_pf_20260927 c JOIN public.property_listings pl ON pl.canonical_fingerprint=c.canonical_fingerprint),
            (SELECT count(*) FROM w10_pf_20260927 c JOIN public.listing_sources ls ON ls.source_name=c.source_name AND ls.source_offer_key=c.source_offer_key),
            (SELECT count(*) FROM public.property_listings),
            (SELECT count(*) FROM public.listing_sources);
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w10:/w10" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -f /w10/p.sql' | tee data/audits/v4-11-wave10-neon-preflight/result.txt
          test "$(cat data/audits/v4-11-wave10-neon-preflight/result.txt)" = "97|0|0|0|142636|142636"
      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-wave10-route-residue-neon-preflight
          path: data/audits/v4-11-wave10-neon-preflight/
          retention-days: 30
