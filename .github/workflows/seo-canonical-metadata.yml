name: SEO Canonical Metadata Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "app/layout.tsx"
      - "app/page.tsx"
      - "app/**/layout.tsx"
      - "app/sitemap.ts"
      - "lib/seo/public-page-metadata.ts"
      - "lib/seo/site.ts"
      - "scripts/scrapers/__tests__/seo-canonical-metadata.test.ts"
      - ".github/workflows/seo-canonical-metadata.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  certify-seo-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate ref
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: SEO metadata targeted regression
        run: npx tsx --test scripts/scrapers/__tests__/seo-canonical-metadata.test.ts
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
