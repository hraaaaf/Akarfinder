name: SEARCH-DESKTOP-SPLIT-1 Apply

on:
  push:
    branches:
      - ux/search-desktop-split-1
    paths:
      - "scripts/audits/apply-search-desktop-split-1.mjs"
      - ".github/workflows/search-desktop-split-1-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search-desktop-split-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/audits/apply-search-desktop-split-1.mjs
      - name: Verify intended product scope
        run: |
          changed="$(git diff --name-only | sort)"
          test "$changed" = "components/search/LightZillowSearchShell.tsx"
      - name: Remove temporary apply files
        run: |
          rm scripts/audits/apply-search-desktop-split-1.mjs
          rm .github/workflows/search-desktop-split-1-apply.yml
      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/search/LightZillowSearchShell.tsx scripts/audits/apply-search-desktop-split-1.mjs .github/workflows/search-desktop-split-1-apply.yml
          staged="$(git diff --cached --name-only | sort)"
          expected=$'.github/workflows/search-desktop-split-1-apply.yml\ncomponents/search/LightZillowSearchShell.tsx\nscripts/audits/apply-search-desktop-split-1.mjs'
          test "$staged" = "$expected"
          git commit -m "feat(search): simplify desktop list map split"
          git push origin HEAD:ux/search-desktop-split-1
