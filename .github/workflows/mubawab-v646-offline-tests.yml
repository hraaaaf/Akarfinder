name: Mubawab V646 offline tests
on:
  push:
    paths:
      - 'scripts/pilots/mubawab-v646/**'
      - '.github/workflows/mubawab-v646-offline-tests.yml'
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4 playwright==1.57.0
      # Synthetic Playwright tests only: routing aborts every fixture request.
      # No Mubawab navigation, HTTP canary or extraction in this workflow.
      - name: Install Chromium for synthetic network guard regression
        run: python -m playwright install --with-deps chromium
      - name: Test Mubawab V646 safety, parser fixtures and evidence counters
        working-directory: scripts/pilots/mubawab-v646
        run: python -m unittest discover -s tests -v
      - name: Audit existing historical V645 SQLite artifact (NO site requests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/akar-v645-historical
          gh run download 41327076337 -R hraaaaf/Akarfinder -n mubawab-v645-multishard-sqlite-state -D /tmp/akar-v645-historical
          python scripts/pilots/mubawab-v646/benchmark_evidence.py \
            --sqlite-root /tmp/akar-v645-historical \
            --expected-rows 97 \
            --output artifacts/mubawab-v645-historical-quality.json
      - name: Upload read-only measured evidence
        uses: actions/upload-artifact@v4
        with:
          name: mubawab-v646-historical-evidence
          path: artifacts/mubawab-v645-historical-quality.json
          if-no-files-found: error
