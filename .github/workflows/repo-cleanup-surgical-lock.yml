name: Repo Cleanup Surgical Lock

on:
  push:
    branches:
      - chore/repo-cleanup-structural-2
    paths:
      - ".github/workflows/repo-cleanup-surgical-lock.yml"

permissions:
  contents: write

jobs:
  surgical-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/repo-cleanup-structural-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore manifests from cleanup base
        run: git checkout d3e54d375c84fa82a501842f530b0a8797dea997 -- package.json package-lock.json
      - name: Remove dependencies and prune unreachable lock packages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const remove = new Set(['@electric-sql/pglite', 'cheerio', 'playwright']);
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));

          for (const name of remove) delete pkg.devDependencies?.[name];
          for (const name of remove) delete lock.packages?.['']?.devDependencies?.[name];

          const packages = lock.packages || {};
          const reachable = new Set(['']);
          const queue = [''];

          function depNames(meta) {
            return [...new Set([
              ...Object.keys(meta.dependencies || {}),
              ...Object.keys(meta.optionalDependencies || {}),
              ...Object.keys(meta.peerDependencies || {}),
            ])];
          }

          function resolvePackage(fromKey, dep) {
            const candidates = [];
            if (fromKey) {
              let base = fromKey;
              candidates.push(`${base}/node_modules/${dep}`);
              while (base.includes('/node_modules/')) {
                base = base.slice(0, base.lastIndexOf('/node_modules/'));
                candidates.push(`${base}/node_modules/${dep}`);
              }
            }
            candidates.push(`node_modules/${dep}`);
            return candidates.find((key) => Object.prototype.hasOwnProperty.call(packages, key));
          }

          while (queue.length) {
            const key = queue.shift();
            const meta = packages[key] || {};
            for (const dep of depNames(meta)) {
              const resolved = resolvePackage(key, dep);
              if (resolved && !reachable.has(resolved)) {
                reachable.add(resolved);
                queue.push(resolved);
              }
            }
          }

          for (const key of Object.keys(packages)) {
            if (!reachable.has(key)) delete packages[key];
          }

          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Validate lock with npm ci
        run: npm ci --ignore-scripts
      - name: Commit surgical manifest and lock changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(cleanup): surgically prune obsolete dependencies"
          git push origin HEAD:chore/repo-cleanup-structural-2
