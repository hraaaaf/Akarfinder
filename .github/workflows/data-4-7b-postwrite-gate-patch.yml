name: DATA-4.7B Post-Write Gate Patch

on:
  push:
    branches:
      - data/data-4-7b-lsf-controlled-expansion-write
    paths:
      - .github/workflows/data-4-7b-postwrite-gate-patch.yml

permissions:
  contents: write

jobs:
  patch-post-write-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/data-4-7b-lsf-controlled-expansion-write
          fetch-depth: 0
      - name: Patch post-write closeout mode
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          HELPER = base64.b64decode('').decode()
          POST = base64.b64decode('').decode()
          ENFORCE = base64.b64decode('').decode()
          TEST = base64.b64decode('').decode()
          script_path = Path('scripts/audits/data-4-7b-lsf-controlled-expansion-write.ts')
          script = script_path.read_text()
          helper_anchor = '''function numberOrZero(value: number | string | null): number {
            const n = Number(value);
            return Number.isFinite(n) ? n : 0;
          }'''.replace('          ', '')
          if 'function metadataRunId' not in script:
              if helper_anchor not in script:
                  raise SystemExit('helper anchor missing')
              script = script.replace(helper_anchor, helper_anchor + '\n\n' + HELPER, 1)
          candidate_anchor = '  const candidates = normalized\n'
          if 'const alreadyApplied = seeds.filter' not in script:
              if candidate_anchor not in script:
                  raise SystemExit('candidate anchor missing')
              script = script.replace(candidate_anchor, POST + '\n\n' + candidate_anchor, 1)
          script_path.write_text(script)
          workflow_path = Path('.github/workflows/data-4-7b-lsf-controlled-expansion-write.yml')
          workflow = workflow_path.read_text()
          marker = "      - name: Enforce rollback-ready proof\n        run: |\n          node - <<'NODE'\n"
          if marker not in workflow:
              raise SystemExit('workflow enforce marker missing')
          before, rest = workflow.split(marker, 1)
          old_body, after = rest.split('          NODE\n', 1)
          workflow = before + marker + ENFORCE + '\n          NODE\n' + after
          workflow_path.write_text(workflow)
          test_path = Path('scripts/data4/__tests__/data-4-7b-lsf-controlled-expansion-write.test.ts')
          tests = test_path.read_text()
          if 'post-write closeout is read-only' not in tests:
              tests = tests.rstrip() + '\n\n' + TEST + '\n'
          test_path.write_text(tests)
          Path('.github/workflows/data-4-7b-postwrite-gate-patch.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audits/data-4-7b-lsf-controlled-expansion-write.ts scripts/data4/__tests__/data-4-7b-lsf-controlled-expansion-write.test.ts .github/workflows/data-4-7b-lsf-controlled-expansion-write.yml .github/workflows/data-4-7b-postwrite-gate-patch.yml
          git diff --cached --check
          git commit -m "DATA-4.7B: certify post-write closeout state"
          git push origin HEAD:data/data-4-7b-lsf-controlled-expansion-write
