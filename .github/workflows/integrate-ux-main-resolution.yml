name: Resolve UX Main Integration

on:
  push:
    branches:
      - agent/integrate-ux-neutralize-conflict
    paths:
      - .github/workflows/integrate-ux-main-resolution.yml

permissions:
  contents: write

jobs:
  resolve-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/integrate-ux-neutralize-conflict
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Combine ODM gateway cursor with canonical UX shell
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('components/search/LightZillowSearchShell.tsx')
          text = path.read_text()

          text = text.replace(
              '''type ApiSearchResponse = {\n  listings: Listing[];\n  total: number;\n  limit: number;\n  offset: number;\n  next_cursor?: number | null;\n  has_more?: boolean;\n  source: string;\n  generated_at: string;\n};\n''',
              '''type ApiSearchResponse = {\n  listings: Listing[];\n  total: number;\n  limit: number;\n  offset: number;\n  source: string;\n  generated_at: string;\n};\n\ntype GatewaySearchResponse = {\n  results: SearchGatewayNormalizedResult[];\n  total_count?: number;\n  next_cursor?: string | null;\n  has_more?: boolean;\n};\n'''
          )

          text = re.sub(
              r'function buildSearchUrl\(filters: ListingFiltersState, sortBy: SortBy, cursor\?: number \| null\): string \{(.*?)\n  if \(cursor != null\) params\.set\("cursor", String\(cursor\)\);\n  return `/api/search\?\$\{params\.toString\(\)\}`;\n\}',
              lambda m: 'function buildSearchUrl(filters: ListingFiltersState, sortBy: SortBy): string {' + m.group(1) + '\n  return `/api/search?${params.toString()}`;\n}',
              text,
              flags=re.S,
          )

          gateway_builder = '''\nfunction buildGatewayUrl(filters: ListingFiltersState, cursor?: string | null): string {\n  const params = new URLSearchParams({ limit: "100" });\n  if (filters.search.trim()) params.set("q", filters.search.trim());\n  if (filters.city !== "all") params.set("city", filters.city);\n  if (filters.propertyType !== "all") params.set("property_type", filters.propertyType);\n  if (filters.transactionType !== "all") params.set("intent", filters.transactionType);\n  if (filters.minBudget) params.set("min_price", filters.minBudget);\n  if (filters.maxBudget) params.set("max_price", filters.maxBudget);\n  if (filters.minSurface) params.set("min_surface", filters.minSurface);\n  if (cursor) params.set("cursor", cursor);\n  return `/api/search/gateway?${params.toString()}`;\n}\n'''
          if 'function buildGatewayUrl' not in text:
              text = text.replace('\nfunction getIntentLabel', gateway_builder + '\nfunction getIntentLabel')

          text = text.replace(
              'const [nextCursor, setNextCursor] = useState<number | null>(null);',
              'const [nextCursor, setNextCursor] = useState<string | null>(null);'
          )
          text = text.replace(
              'const [isLoadingMore, setIsLoadingMore] = useState(false);',
              'const [isLoadingMore, setIsLoadingMore] = useState(false);\n  const [indexedTotalCount, setIndexedTotalCount] = useState<number | null>(null);'
          )
          text = text.replace(
              'const gatewayEnabled = process.env.NEXT_PUBLIC_SEARCH_GATEWAY_ENABLED === "true";',
              'const gatewayEnabled = process.env.NEXT_PUBLIC_SEARCH_GATEWAY_ENABLED !== "false";'
          )
          text = text.replace(
              '''          setListings(payload.listings);\n          setNextCursor(payload.next_cursor ?? null);\n          setHasMoreIndexed(payload.has_more === true && payload.next_cursor != null);''',
              '          setListings(payload.listings);'
          )

          load_more = '''  async function handleLoadMoreIndexed() {\n    if (!nextCursor || isLoadingMore) return;\n    setIsLoadingMore(true);\n    try {\n      const response = await fetch(buildGatewayUrl(filters, nextCursor), { cache: "no-store" });\n      if (!response.ok) return;\n      const payload = (await response.json()) as GatewaySearchResponse;\n      if (!Array.isArray(payload.results)) return;\n      setGatewayResults((current) => {\n        const merged = new Map(\n          current.map((result) => [result.original_url || result.display_url || result.id, result]),\n        );\n        for (const result of payload.results) {\n          const key = result.original_url || result.display_url || result.id;\n          if (!merged.has(key)) merged.set(key, result);\n        }\n        return [...merged.values()];\n      });\n      setNextCursor(payload.next_cursor ?? null);\n      setHasMoreIndexed(payload.has_more === true && payload.next_cursor != null);\n      if (typeof payload.total_count === "number") setIndexedTotalCount(payload.total_count);\n    } catch {\n      // Preserve the current indexed page on transient failures.\n    } finally {\n      setIsLoadingMore(false);\n    }\n  }\n\n'''
          text, count = re.subn(
              r'  async function handleLoadMoreIndexed\(\) \{.*?\n  \}\n\n(?=  useEffect\(\(\) => \{\n    if \(!gatewayEnabled\))',
              load_more,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not replace indexed load-more function')

          gateway_effect = '''  useEffect(() => {\n    if (!gatewayEnabled) {\n      setGatewayResults([]);\n      setNextCursor(null);\n      setHasMoreIndexed(false);\n      setIndexedTotalCount(null);\n      setIsGatewayLoading(false);\n      return;\n    }\n    let cancelled = false;\n    const delay = filters.search ? 300 : 0;\n    const timer = setTimeout(async () => {\n      if (cancelled) return;\n      setIsGatewayLoading(true);\n      try {\n        const response = await fetch(buildGatewayUrl(filters), { cache: "no-store" });\n        if (!response.ok || cancelled) {\n          setGatewayResults([]);\n          setNextCursor(null);\n          setHasMoreIndexed(false);\n          setIndexedTotalCount(null);\n          return;\n        }\n        const payload = (await response.json()) as GatewaySearchResponse;\n        if (!cancelled && Array.isArray(payload.results)) {\n          setGatewayResults(payload.results);\n          setNextCursor(payload.next_cursor ?? null);\n          setHasMoreIndexed(payload.has_more === true && payload.next_cursor != null);\n          setIndexedTotalCount(typeof payload.total_count === "number" ? payload.total_count : null);\n        }\n      } catch {\n        if (!cancelled) {\n          setGatewayResults([]);\n          setNextCursor(null);\n          setHasMoreIndexed(false);\n          setIndexedTotalCount(null);\n        }\n      } finally {\n        if (!cancelled) setIsGatewayLoading(false);\n      }\n    }, delay);\n    return () => {\n      cancelled = true;\n      clearTimeout(timer);\n    };\n  }, [filters, gatewayEnabled]);\n\n'''
          text, count = re.subn(
              r'  useEffect\(\(\) => \{\n    if \(!gatewayEnabled\).*?\n  \}, \[filters, gatewayEnabled\]\);\n\n(?=  const filteredListings)',
              gateway_effect,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not replace gateway cursor effect')

          if 'void indexedTotalCount;' not in text:
              text = text.replace(
                  '  const viewLayout = getSearchViewLayout(view);',
                  '  const viewLayout = getSearchViewLayout(view);\n  void indexedTotalCount;'
              )

          required = [
              'useCanonicalSearchSession',
              'SearchViewSwitcher',
              'buildGatewayUrl(filters, nextCursor)',
              'next_cursor?: string | null',
              'payload.total_count',
              'const gatewayEnabled = process.env.NEXT_PUBLIC_SEARCH_GATEWAY_ENABLED !== "false"',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'Missing integrated token: {token}')

          path.write_text(text)
          PY
      - run: npm ci
      - name: Canonical UX and ODM cursor contracts
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/ux-gate0-contracts.test.ts
          scripts/scrapers/__tests__/ux-search-session.test.ts
          scripts/scrapers/__tests__/ux-search-history.test.ts
          scripts/scrapers/__tests__/ux-search-view.test.ts
          scripts/scrapers/__tests__/ux-map-atlas.test.ts
          scripts/scrapers/__tests__/ux-price-explorer.test.ts
          scripts/scrapers/__tests__/ux-property-selection.test.ts
          scripts/scrapers/__tests__/ux-smart-property-card.test.ts
          scripts/scrapers/__tests__/ux-certified-property-map.test.ts
          scripts/scrapers/__tests__/ux-property-passport.test.ts
          scripts/scrapers/__tests__/ux-explain-ranking.test.ts
          scripts/scrapers/__tests__/ux-canonical-property-comparison.test.ts
          scripts/scrapers/__tests__/ux-neighborhood-intelligence.test.ts
          scripts/scrapers/__tests__/ux-certified-local-heatmap.test.ts
          scripts/scrapers/__tests__/ux-city-neighborhood-explorer.test.ts
          scripts/scrapers/__tests__/ux-certified-neighborhood-comparison.test.ts
          scripts/scrapers/__tests__/ux-certified-similar-neighborhoods.test.ts
          scripts/scrapers/__tests__/odm-09c-gateway-cursor-bridge.test.ts
          scripts/scrapers/__tests__/odm-09d-search-ui-cursor.test.ts
          scripts/scrapers/__tests__/odm-09e-lookahead-pagination.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit certified resolution
        run: |
          git config user.name "AkarFinder Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/search/LightZillowSearchShell.tsx
          git commit -m "Integrate ODM cursor with certified UX shell"
          git push origin HEAD:agent/integrate-ux-neutralize-conflict

# retrigger after workflow registration
