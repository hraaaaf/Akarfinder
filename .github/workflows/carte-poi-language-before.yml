name: Carte LOT H POI BEFORE

on:
  pull_request:
    paths:
      - "docs/handovers/AKARFINDER_POI_LANGUAGE_TARGET_CONTRACT.md"
      - "scripts/audits/carte-poi-language-before.mjs"
      - ".github/workflows/carte-poi-language-before.yml"

permissions:
  contents: read

jobs:
  capture-poi-before:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:3212
      AUDIT_OUTPUT_DIR: data/audits/carte-poi-language-before
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3212 > /tmp/carte-poi-before.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3212/map?city=casablanca&district=maarif&layer=explore' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/carte-poi-before.log
          exit 1
      - name: Capture POI language BEFORE
        run: node scripts/audits/carte-poi-language-before.mjs
      - name: Upload POI BEFORE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carte-poi-language-before-${{ github.run_id }}
          path: data/audits/carte-poi-language-before
          if-no-files-found: error
          retention-days: 30
