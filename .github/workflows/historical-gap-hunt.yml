name: AkarFinder - Historical Gap Hunt

on:
  push:
    paths:
      - "scripts/audits/historical-gap-hunt.ts"
      - ".github/workflows/historical-gap-hunt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GAP_HUNT_OUT: .tmp/historical-gap-hunt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run read-only historical gap hunt
        run: npx tsx scripts/audits/historical-gap-hunt.ts
      - name: Verify no-write contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('.tmp/historical-gap-hunt/summary.json','utf8'));
          if(p.readOnly!==true || p.databaseWrites!==0 || p.sourceNetworkRequests!==0 || p.detailPageFetches!==0) throw new Error('read-only invariant failed');
          console.log(JSON.stringify({totalExactNetNewVsSeeds:p.totalExactNetNewVsSeeds,top:p.domains.slice(0,10)},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: historical-gap-hunt-proof
          path: .tmp/historical-gap-hunt/
          if-no-files-found: error
          retention-days: 30
