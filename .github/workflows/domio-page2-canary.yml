name: AkarFinder Domio Pagination Page Two Canary
on:
  push:
    branches:
      - data/200k-fresh-parser-v2
    paths:
      - '.github/workflows/domio-page2-canary.yml'
      - 'scripts/data/domio-page2-canary-v1.mjs'
      - 'scripts/data/__tests__/domio-page2-canary-v1.test.mjs'
permissions:
  contents: read
  actions: read
jobs:
  seven-page-two-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PAGE1_JSONL: .tmp/domio-page1/domio-card-canary.jsonl
      OUTPUT_PREFIX: domio-page2-canary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pagination routes, source scope, robots, dedup regression
        run: node --test scripts/data/__tests__/domio-page2-canary-v1.test.mjs
      - name: Fetch frozen first-page Domio baseline
        uses: actions/download-artifact@v4
        with:
          name: domio-public-card-canary
          run-id: 38042386411
          github-token: ${{ github.token }}
          path: .tmp/domio-page1
      - name: Query at most seven public page-two categories
        run: node scripts/data/domio-page2-canary-v1.mjs
      - name: Prove no-write and provenance
        if: success()
        run: |
          jq -e '.requested_pages == 7 and .request_count <= 7 and .database_writes == 0 and .database_access == 0 and .incremental_ids_vs_page1 <= .unique_ids_page2' domio-page2-canary.json
          node -e "const f=require('fs');const a=f.readFileSync('domio-page2-canary.jsonl','utf8').split(String.fromCharCode(10)).filter(Boolean).map(JSON.parse);if(new Set(a.map(x=>x.identity)).size!==a.length||a.some(x=>x.freshness_certified))process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domio-page2-canary
          path: |
            domio-page2-canary.json
            domio-page2-canary.jsonl
          retention-days: 14
