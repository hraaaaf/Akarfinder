name: Temporary DATA-1.5 Docs Handover

on:
  push:
    branches:
      - docs/data-1-5-handover-20260807

permissions:
  contents: write

jobs:
  align-canonical-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handover branch
        uses: actions/checkout@v4
        with:
          ref: docs/data-1-5-handover-20260807
          fetch-depth: 0

      - name: Align README, ROADMAP and SESSION
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # README — doctrine + delivered DATA capability.
          replace_once(
              "README.md",
              "- `robots.txt` et sitemap sont des signaux techniques, jamais une licence ;\n- Source Registry obligatoire avant toute activation ;",
              "- `robots.txt` et sitemap sont des signaux techniques, jamais une licence ;\n- une capacité technique détectée (`Houzez`, `RealHomes`, WordPress REST, sitemap, JSON-LD, feed) ne vaut jamais permission d’ingestion ou de réutilisation ;\n- Source Registry obligatoire avant toute activation ;",
          )
          replace_once(
              "README.md",
              "- CI GitHub Actions avec tests, build, contrats DATA, accessibilité et preuves ciblées.\n",
              "- CI GitHub Actions avec tests, build, contrats DATA, accessibilité et preuves ciblées ;\n- **DATA-1.5 / PR #331** certifie le Technical Capability Audit : 20 domaines P0 audités, 19 `CAPABILITY_REVIEW_READY`, familles détectées `3 RealHomes + 3 Houzez + 5 WordPress génériques + 8 structured-web`, score **9,4/10**, sans policy, auth, bypass, WARC ni write DB.\n",
          )

          # ROADMAP — refresh status and DATA-1 execution state.
          replace_once(
              "docs/ROADMAP.md",
              "**Statut : CARTE / QUARTIER P1A.1 certifié via PR #328, merge final en attente ; P1A.2 prochain ; DATA-1.3B reste actif en lane séparée**",
              "**Statut : CARTE / QUARTIER P1A.1 ✅ PR #328 ; P1A.2 prochain en lane UX ; DATA-1.5 ✅ PR #331 ; DATA-1.6A Source Policy Evidence Review prochain en lane DATA**",
          )
          replace_once(
              "docs/ROADMAP.md",
              "- DATA-1.1 / DATA-1.2 / DATA-1.3A acquis ;\n- DATA-1.3B actif en lane DATA séparée.",
              "- DATA-1.1 / DATA-1.2 / DATA-1.3A / DATA-1.3B / DATA-1.4 acquis ;\n- **DATA-1.5 Technical Capability Audit ✅ PR #331** : 20 candidats P0 audités, 19 techniquement review-ready, familles CMS/connecteurs détectées sans aucune policy automatique ;\n- prochain lot DATA : **DATA-1.6A — Source Policy Evidence Review**, read-only avant toute écriture Source Registry.",
          )
          marker = "### Gate DATA-1\n\nAvant ingestion :\n"
          insertion = """### État d’exécution DATA-1 — 2026-08-07\n\n- **DATA-1.1 — Domain Census Core ✅ PR #322** ;\n- **DATA-1.2 — Existing Reserve Census ✅ PR #323** : 7 051 domaines / 37 009 URLs ;\n- **DATA-1.3A — Common Crawl URL Index Contract ✅ PR #324** ;\n- **DATA-1.3B — Common Crawl Live Evidence ✅ PR #326** : 300/300 Parquet, 8 727 registered domains ;\n- **DATA-1.4 — Candidate Reconciliation ✅ PR #329** : 15 238 domaines réconciliés, 230 `PRIMARY_SOURCE_CANDIDATE` ;\n- **DATA-1.5 — Candidate Technical Capability Audit ✅ PR #331**, merge `1f8b398`, score **9,4/10**.\n\nPreuve DATA-1.5 sur batch P0 de 20 first-party candidates non enregistrés :\n\n- **19/20 `CAPABILITY_REVIEW_READY`** ;\n- 3 `WORDPRESS_REALHOMES` ;\n- 3 `WORDPRESS_HOUZEZ` ;\n- 5 `WORDPRESS_GENERIC` ;\n- 4 `SITEMAP_JSONLD` ;\n- 2 `SITEMAP_STRUCTURED_HTML` ;\n- 2 `STRUCTURED_HTML` ;\n- 1 timeout homepage (`damaneimmo.ma`), conservé review-only ;\n- 116 GET publics au total, maximum 7/domain sur budget 8 ;\n- 0 write DB, 0 policy, 0 auth, 0 bypass, 0 WARC.\n\nCandidats techniquement les plus structurés : `valfoncier.ma`, `marrakech-luxury-properties.com`, `agadirimmobilier.org`, `proimmobilier.ma`, `rabatimmo.ma`, `agadirimmobilier.ma`, `capital-properties.ma`, `immobilier-pro-maroc.com`.\n\n**Prochain lot DATA : DATA-1.6A — Source Policy Evidence Review.**\n\nResponsabilité unique : établir, en lecture seule, les preuves policy des candidats techniquement viables : robots/noindex observés, CGU/licence, restrictions de réutilisation, canaux permis, besoin de partenariat/contact et niveau de confiance. Aucune ingestion et aucune écriture Source Registry dans 1.6A.\n\nPuis **DATA-1.6B — Source Registry Assignment** n’écrira que les décisions suffisamment prouvées, via le schéma Registry existant, avant tout connecteur ou ingestion.\n\n"""
          replace_once("docs/ROADMAP.md", marker, insertion + marker)

          # SESSION — concise canonical handover, rewritten intentionally.
          Path("docs/SESSION.md").write_text("""# AkarFinder — Session courante\n\n**Mise à jour : 2026-08-07**  \n**Lot DATA acquis : DATA-1.5 — Candidate Technical Capability Audit ✅ PR #331**  \n**Prochain lot DATA : DATA-1.6A — Source Policy Evidence Review**  \n**Lot UX certifié : CARTE-QUARTIER-P1A.1 — Geo Canonical Core ✅ PR #328**  \n**Prochain lot UX : CARTE-QUARTIER-P1A.2 — Search Geo Contract**\n\nCe fichier est le handover opérationnel court du projet. `docs/ROADMAP.md` reste l’unique roadmap canonique.\n\n## Main canonique\n\n`main` inclut notamment :\n\n- Mon Projet P1B ✅ PR #318 ;\n- CARTE-QUARTIER-P1A.0 ✅ PR #327 ;\n- CARTE-QUARTIER-P1A.1 ✅ PR #328, score 9,5/10 ;\n- DATA-1.1 ✅ PR #322 ;\n- DATA-1.2 ✅ PR #323 ;\n- DATA-1.3A ✅ PR #324 ;\n- DATA-1.3B ✅ PR #326 ;\n- DATA-1.4 ✅ PR #329 ;\n- **DATA-1.5 ✅ PR #331**, merge `1f8b398`, score **9,4/10**.\n\nInvariants : aucune migration DATA-1.5, aucune policy Source Registry automatique, aucune ingestion, aucun auth/login, aucun bypass, aucun WARC fetch.\n\n## DATA-1 — état acquis\n\n### DATA-1.2 — Reserve Census ✅\n\n- **37 009 URLs distinctes** ;\n- **7 051 domaines**.\n\n### DATA-1.3B — Common Crawl Live Evidence ✅\n\n- **300/300 Parquet** analysés ;\n- **9 087 hosts bruts** ;\n- **8 970 hosts canoniques** ;\n- **8 727 registered domains** ;\n- aucun WARC/content fetch, write DB ou source activée.\n\n### DATA-1.4 — Candidate Reconciliation ✅\n\n- univers réconcilié : **15 238 domaines** ;\n- B3 ∩ Common Crawl : **532** ;\n- **15 222 non enregistrés** ;\n- `PRIMARY_SOURCE_CANDIDATE` : **230** ;\n- `PORTAL_CANDIDATE` : **625** ;\n- fail-closed : 0 write / 0 policy.\n\n### DATA-1.5 — Candidate Technical Capability Audit ✅\n\nPR **#331**, merge `1f8b398`.\n\nBatch certifié : les **20 meilleurs `PRIMARY_SOURCE_CANDIDATE` non enregistrés** de DATA-1.4.\n\nPreuve finale :\n\n- **20/20 domaines audités** ;\n- **19 `CAPABILITY_REVIEW_READY`** ;\n- **1 homepage timeout** : `damaneimmo.ma`, conservé `REVIEW_ONLY_HOMEPAGE_UNAVAILABLE` ;\n- 116 requêtes publiques au total ;\n- max **7 GET/domain** sur budget 8 ;\n- robots block-all : 0 ;\n- noindex : 0 ;\n- challenge/access-control final : 0 ;\n- writes DB : 0 ;\n- policies : 0 ;\n- auth : 0 ;\n- bypass : 0 ;\n- WARC : 0.\n\nFamilles techniques :\n\n- `WORDPRESS_REALHOMES` : **3** ;\n- `WORDPRESS_HOUZEZ` : **3** ;\n- `WORDPRESS_GENERIC` : **5** ;\n- `SITEMAP_JSONLD` : **4** ;\n- `SITEMAP_STRUCTURED_HTML` : **2** ;\n- `STRUCTURED_HTML` : **2** ;\n- `BLOCKED_OR_INACCESSIBLE` : **1** (timeout, pas interdiction prouvée).\n\nTop capacité observée :\n\n1. `valfoncier.ma` — 100 — RealHomes + sitemap + JSON-LD + WP REST ;\n2. `marrakech-luxury-properties.com` — 100 — WordPress + sitemap + JSON-LD + WP REST ;\n3. `agadirimmobilier.org` — 100 — Houzez + sitemap + JSON-LD + WP REST ;\n4. `proimmobilier.ma` — 95 — RealHomes + WP REST ;\n5. `rabatimmo.ma` — 95 — RealHomes + WP REST ;\n6. `agadirimmobilier.ma` — 95 — Houzez ;\n7. `capital-properties.ma` — 93 — WordPress + WP REST ;\n8. `immobilier-pro-maroc.com` — 93 — WordPress + WP REST.\n\nVolumes structurés remarquables :\n\n- `immo-maroc.com` : **1 210** URLs sitemap observées, **1 090** listing-like ;\n- `leaderimmo.ma` : **799** URLs sitemap et **833** signaux listing cumulés ;\n- `agadirimmobilier.ma` : **320** URLs sitemap ;\n- `mhproperties.ma` : **292** URLs sitemap ;\n- `immohammedia.com` : **282** URLs sitemap.\n\nDeux faux positifs ont été découverts malgré des runs CI verts puis corrigés avant merge : URL homepage mal passée au gate robots, puis détection Cloudflare/CAPTCHA trop large. Les tests protègent désormais ces régressions.\n\n**Score final DATA-1.5 : 9,4/10.**\n\n## Doctrine DATA active\n\n`DISCOVERED ≠ AUDITED ≠ AUTHORIZED ≠ INGESTIBLE ≠ DISPLAYABLE`\n\nEt :\n\n`TECHNICAL CAPABILITY ≠ SOURCE PERMISSION`\n\nLa détection Houzez/RealHomes/WordPress REST/sitemap/JSON-LD ne crée aucun droit d’usage.\n\n## Prochain lot DATA — DATA-1.6A\n\n### Source Policy Evidence Review\n\nResponsabilité : établir en **read-only** la preuve policy des candidats techniquement viables avant toute écriture Registry.\n\nPour le batch P0 prioritaire :\n\n- robots et noindex observés avec date ;\n- CGU / licence / mentions de réutilisation ;\n- distinction consultation publique vs extraction/réutilisation ;\n- canaux techniquement et contractuellement permis ;\n- besoin de partenariat ou consentement ;\n- contact/claim possible ;\n- `legal_review_required` si ambigu ;\n- evidence URLs + résumé + dates ;\n- recommandation de décision, **sans l’écrire dans Source Registry**.\n\nGate 1.6A : aucune policy finale sans preuve explicite, aucun connecteur activé, aucune ingestion.\n\nEnsuite seulement : **DATA-1.6B — Source Registry Assignment**, sur le schéma existant, pour les décisions suffisamment prouvées.\n\n## UX — handover\n\nCARTE-QUARTIER-P1A.1 est mergé via PR #328. Prochaine étape UX indépendante : **CARTE-QUARTIER-P1A.2 — Search Geo Contract**, avec `district` comme filtre structuré et `q` conservé comme texte libre.\n""")

      - name: Remove temporary workflow and commit docs only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-data-1-5-doc-handover.yml
          git config user.name "AkarFinder Docs Handover"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md .github/workflows/temp-data-1-5-doc-handover.yml
          git diff --cached --check
          git commit -m "docs: close DATA-1.5 and hand over DATA-1.6A"
          git push origin HEAD:docs/data-1-5-handover-20260807
