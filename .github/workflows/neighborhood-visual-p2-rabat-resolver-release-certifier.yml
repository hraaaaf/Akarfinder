name: Neighborhood Visual P2 Rabat Resolver Independent Certifier
on:
  pull_request:
    paths:
      - "lib/contextual-illustrations/rabat-real-photo-library.ts"
      - "components/search/RabatNeighborhoodResolverP2QAFixture.tsx"
      - "app/visual-qa/rabat-neighborhood-resolver-p2/**"
      - "scripts/audits/neighborhood-visual-p2-rabat-resolver-visual-qa.mjs"
      - ".github/workflows/neighborhood-visual-p2-rabat-resolver-release-certifier.yml"
permissions: { contents: read }
env: { NEIGHBORHOOD_VISUAL_QA: "1", NEXT_PUBLIC_SEARCH_GATEWAY_ENABLED: "false" }
jobs:
  certifier:
    name: Independent Release Certifier — P2 Rabat resolver
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: |
          npm run start -- -p 3192 > /tmp/p2-rabat-release.log 2>&1 &
          for i in {1..40}; do if curl -fsS http://127.0.0.1:3192/visual-qa/rabat-neighborhood-resolver-p2 >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/p2-rabat-release.log; exit 1
      - env: { BASE_URL: "http://127.0.0.1:3192", AUDIT_VARIANT: release-certifier }
        run: node scripts/audits/neighborhood-visual-p2-rabat-resolver-visual-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: neighborhood-visual-p2-rabat-resolver-release-proof, path: data/audits/neighborhood-visual-p2-rabat-resolver/release-certifier, if-no-files-found: error, retention-days: 14 }
