name: DETERMINISTIC-ATTRIBUTION 1440 Extension

on:
  push:
    branches:
      - ux/deterministic-attribution-1
    paths:
      - "scripts/audits/apply-deterministic-attribution-1440.mjs"
      - ".github/workflows/deterministic-attribution-1440.yml"

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/deterministic-attribution-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/audits/apply-deterministic-attribution-1440.mjs
      - name: Verify scope
        run: test "$(git diff --name-only)" = "scripts/audits/unified-listing-card-1-visual.mjs"
      - run: |
          git rm scripts/audits/apply-deterministic-attribution-1440.mjs
          git rm .github/workflows/deterministic-attribution-1440.yml
      - name: Commit extension
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audits/unified-listing-card-1-visual.mjs
          git commit -m "test(search): certify deterministic attribution at 1440"
          git push origin HEAD:ux/deterministic-attribution-1
