name: Repo Cleanup Finalize Diff

on:
  push:
    branches:
      - chore/repo-cleanup-structural-2
    paths:
      - ".github/workflows/repo-cleanup-finalize-diff.yml"

permissions:
  contents: write

jobs:
  normalize-and-remove-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/repo-cleanup-structural-2
          fetch-depth: 0
      - name: Restore package manifest byte-for-byte from PR base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- package.json
          node <<'NODE'
          const pkg = require('./package.json');
          const direct = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) };
          for (const name of ['@electric-sql/pglite', 'cheerio', 'playwright']) {
            if (!Object.prototype.hasOwnProperty.call(direct, name)) {
              throw new Error(`${name} must remain declared directly`);
            }
          }
          NODE
          git diff --check
      - name: Validate lockfile still matches manifest
        run: npm ci
      - name: Commit normalized diff and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git rm .github/workflows/repo-cleanup-finalize-diff.yml
          git diff --cached --check
          git commit -m "chore(cleanup): normalize final structural diff"
          git pull --rebase origin chore/repo-cleanup-structural-2
          git push origin HEAD:chore/repo-cleanup-structural-2
