name: ODM Canary 10 Percent Production Certification V1

on:
  pull_request:
    paths:
      - "lib/odm/odm-public-canary.ts"
      - "lib/search/search-commercial-priority.ts"
      - "scripts/certify-odm-canary-10-production-v1.mjs"
      - "scripts/scrapers/__tests__/odm-canary-10-production-certification-v1.test.ts"
      - ".github/workflows/odm-canary-10-production-certification-v1.yml"
      - "docs/ODM-CANARY-10-PRODUCTION-CERTIFICATION.md"
  push:
    branches: [main]
    paths:
      - "lib/odm/odm-public-canary.ts"
      - "lib/search/search-commercial-priority.ts"
      - "scripts/certify-odm-canary-10-production-v1.mjs"
      - "scripts/scrapers/__tests__/odm-canary-10-production-certification-v1.test.ts"
      - ".github/workflows/odm-canary-10-production-certification-v1.yml"
      - "docs/ODM-CANARY-10-PRODUCTION-CERTIFICATION.md"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate ten-percent certification contract
        run: npx tsx --test scripts/scrapers/__tests__/odm-canary-10-production-certification-v1.test.ts
      - name: Validate commercial-priority regression contract
        run: npx tsx --test scripts/scrapers/__tests__/search-truth-tier.test.ts
      - run: npx tsc --noEmit

  certify-production:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Allow Production routing to settle
        run: sleep 60
      - name: Run controlled 240-request Production campaign
        env:
          AKARFINDER_PRODUCTION_URL: https://akarfinder.vercel.app
        run: node scripts/certify-odm-canary-10-production-v1.mjs
      - name: Upload certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odm-canary-10-production-certification-v1
          path: artifacts/odm-canary-10-production-certification-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish auditable verdict on certification PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const reportPath = "artifacts/odm-canary-10-production-certification-v1.json";
            let body;

            if (!fs.existsSync(reportPath)) {
              body = [
                "## ODM Canary 10 % — campagne Production",
                "",
                "**Verdict : FAIL — rapport JSON absent**",
                "",
                `Run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join("\n");
            } else {
              const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
              const pass = Object.values(report.gates || {}).every(Boolean);
              const gates = Object.entries(report.gates || {})
                .map(([name, value]) => `- ${value ? "✅" : "❌"} \`${name}\``)
                .join("\n");
              body = [
                "## ODM Canary 10 % — campagne Production",
                "",
                `**Verdict : ${pass ? "PASS" : "FAIL"}**`,
                "",
                `- Requêtes : **${report.requested}**`,
                `- HTTP 200 : **${report.http_200}**`,
                `- Canary observé / Legacy observé : **${report.observed_canary} / ${report.observed_legacy}**`,
                `- Échecs contrat : **${report.failures}**`,
                `- Échecs probes SSR : **${report.visible_probe_failures}**`,
                `- Bucket mesuré : **${(Number(report.bucket_distribution_rate) * 100).toFixed(2)} %**`,
                `- Canary p50 / p95 / p99 : **${report.latency_ms?.canary_p50} / ${report.latency_ms?.canary_p95} / ${report.latency_ms?.canary_p99} ms**`,
                `- Legacy p50 / p95 / p99 : **${report.latency_ms?.legacy_p50} / ${report.latency_ms?.legacy_p95} / ${report.latency_ms?.legacy_p99} ms**`,
                `- Preuves ODM non vides : **${report.non_empty_canary_requests} requêtes / ${(report.non_empty_canary_cities || []).length} villes**`,
                "",
                "### Gates",
                gates || "- ❌ Aucun gate présent",
                "",
                `Artifact : \`odm-canary-10-production-certification-v1\` — conservation 30 jours`,
                `Run : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join("\n");
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 256,
              body,
            });
