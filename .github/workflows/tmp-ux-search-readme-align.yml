name: TEMP UX-SEARCH README Align

on:
  push:
    branches:
      - ux/search-compact-filters-2
    paths:
      - ".github/workflows/tmp-ux-search-readme-align.yml"
      - "scripts/tmp/ux-search-readme-align.mjs"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search-compact-filters-2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Align README with certified UX/Search state
        run: node scripts/tmp/ux-search-readme-align.mjs
      - name: Self-remove and commit README alignment
        shell: bash
        run: |
          rm scripts/tmp/ux-search-readme-align.mjs
          rm .github/workflows/tmp-ux-search-readme-align.yml
          git config user.name "AkarFinder Release Certifier"
          git config user.email "actions@users.noreply.github.com"
          git add README.md scripts/tmp/ux-search-readme-align.mjs .github/workflows/tmp-ux-search-readme-align.yml
          git diff --cached --check
          git commit -m "docs(search): align README after UX-SEARCH-2"
          git push origin HEAD:ux/search-compact-filters-2
