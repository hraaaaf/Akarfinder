name: DATA MASS-X5 Canonical Closeout Once

on:
  pull_request:
    paths:
      - '.github/workflows/data-mass-x5-closeout-once.yml'
      - 'scripts/data-mass/mass-x5-canonical-closeout.py'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/data-mass-x5-closeout-run
          fetch-depth: 0
      - name: Patch canonical DATA MASS blocks
        run: python3 scripts/data-mass/mass-x5-canonical-closeout.py
      - name: Verify canonical scope
        run: |
          grep -q 'MASS-X5 ✅ CLOSED' README.md
          grep -q 'MASS-X5 ✅ CLOSED' docs/ROADMAP.md
          grep -q 'MASS-X5 ✅ CLOSED' docs/SESSION.md
          grep -q 'UI-POLISH-SEARCH-V1-START' docs/SESSION.md
          grep -q 'UX-HEADER-10OF10-1-CLOSEOUT-START' README.md
          grep -q 'UX-HEADER-10OF10-1-CLOSEOUT-START' docs/ROADMAP.md
      - name: Commit docs-only closeout and remove temporary files
        run: |
          rm .github/workflows/data-mass-x5-closeout-once.yml
          rm scripts/data-mass/mass-x5-canonical-closeout.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(data): close DATA MASS canonically'
          git push origin HEAD:docs/data-mass-x5-closeout-run
