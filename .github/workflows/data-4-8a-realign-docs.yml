name: DATA-4.8A Realign Canonical Docs

on:
  push:
    branches:
      - data/data-4-8a-net-new-sitemap-qualification
    paths:
      - .github/workflows/data-4-8a-realign-docs.yml

permissions:
  contents: write

jobs:
  realign-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/data-4-8a-net-new-sitemap-qualification
          fetch-depth: 0
      - name: Preserve current main and refresh DATA blocks
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- README.md docs/ROADMAP.md docs/SESSION.md
          python - <<'PY'
          import base64
          from pathlib import Path
          START='<!-- DATA-4.7B-CURRENT-START -->'
          END='<!-- DATA-4.7B-CURRENT-END -->'
          R=''
          M=''
          S=''
          def dec(x): return base64.b64decode(x).decode('utf-8')
          def replace_marked(path, start, end, body):
              p=Path(path); text=p.read_text()
              if start not in text or end not in text: raise SystemExit(f'markers missing in {path}')
              before, rest=text.split(start,1); _, after=rest.split(end,1)
              p.write_text(before+start+'\n'+body.rstrip()+'\n'+end+after)
          replace_marked('README.md', START, END, dec(R))
          replace_marked('docs/ROADMAP.md', START, END, dec(M))
          p=Path('docs/SESSION.md'); text=p.read_text(); s='<!-- DATA-CURRENT-START -->'; e='<!-- DATA-CURRENT-END -->'; block=s+'\n'+dec(S).rstrip()+'\n'+e+'\n\n'
          if s in text and e in text:
              before, rest=text.split(s,1); _, after=rest.split(e,1); text=before+block+after.lstrip('\n')
          else:
              anchor='## Vérité canonique après merges parallèles'
              if anchor not in text: raise SystemExit('SESSION anchor missing')
              text=text.replace(anchor, block+anchor, 1)
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md
          git diff --cached --check
          git commit -m "DATA-4.8A: realign canonical docs with current main"
          git push origin HEAD:data/data-4-8a-net-new-sitemap-qualification
