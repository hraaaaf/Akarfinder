name: Live Sarouty full

on:
  push:
    branches:
      - feat/sarouty-source-first
    paths:
      - .github/workflows/live-sarouty-full.yml

concurrency:
  group: live-sarouty-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sarouty-full:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test scripts/acquisition/__tests__/sarouty-sitemap-enumerator.test.mjs
      - name: Full public sitemap enumeration
        env:
          SAROUTY_MAX_SITEMAP_DOCS: '4'
          SAROUTY_MAX_URLS: '200000'
        run: node scripts/acquisition/sarouty-sitemap-enumerator.mjs
      - name: Verify complete report
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/morocco-web-l8-sarouty-sitemap/report.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (r.zeroDbWrites !== true) throw new Error('zeroDbWrites != true');
          if (r.crawlDelayMs < 10000) throw new Error(`crawlDelayMs=${r.crawlDelayMs}`);
          if (r.stoppedEarly) throw new Error(`stoppedEarly=${r.stoppedEarly}`);
          if (r.sitemapDocCount !== 4) throw new Error(`sitemapDocCount=${r.sitemapDocCount}`);
          if (r.requestCount !== 5) throw new Error(`requestCount=${r.requestCount}`);
          if (r.queueRemaining !== 0) throw new Error(`queueRemaining=${r.queueRemaining}`);
          if (r.cappedByDocs) throw new Error('cappedByDocs=true');
          if (r.cappedByUrls) throw new Error('cappedByUrls=true');
          if (r.uniqueRealEstateListingCount < 1) throw new Error(`uniqueRealEstateListingCount=${r.uniqueRealEstateListingCount}`);
          console.log(JSON.stringify({crawlDelayMs:r.crawlDelayMs,sitemapDocCount:r.sitemapDocCount,requestCount:r.requestCount,uniqueRealEstateListingCount:r.uniqueRealEstateListingCount,queueRemaining:r.queueRemaining,stoppedEarly:r.stoppedEarly,cappedByDocs:r.cappedByDocs,cappedByUrls:r.cappedByUrls,zeroDbWrites:r.zeroDbWrites}, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarouty-full-enumeration
          path: artifacts/morocco-web-l8-sarouty-sitemap/
          if-no-files-found: error
          retention-days: 14
