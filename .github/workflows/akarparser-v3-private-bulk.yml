name: AkarParser V3 Private Raw Bulk
on:
  pull_request:
    paths:
      - "scripts/acquisition/akarparser_v3_raw_bulk.py"
      - "scripts/acquisition/akarparser_v3_portals.py"
      - "scripts/acquisition/__tests__/test_akarparser_v3_raw_bulk.py"
      - "scripts/acquisition/__tests__/test_akarparser_v3_portals.py"
      - "scripts/acquisition/__tests__/test_akarparser_v3_benchmark.py"
      - ".github/workflows/akarparser-v3-private-bulk.yml"
      - "docs/data/AKARPARSER_V3_RAW_BULK_2026-11-09.md"
  workflow_dispatch:
    inputs:
      authorize_private_batch:
        type: boolean
        description: "Explicitly authorize offline parsing of approved private local inbox"
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline 10/100/1000 contracts — synthetic only
        run: python -Werror::ResourceWarning -m unittest discover -v -s scripts/acquisition/__tests__ -p 'test_akarparser_v3*.py'

  private-batch:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.authorize_private_batch == true
    runs-on: [self-hosted, windows, akarfinder-private-lake]
    environment: q1f-private-batch
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify approved local paths
        env:
          Q1F_RAW_BATCH_PATH: ${{ vars.Q1F_RAW_BATCH_PATH }}
          Q1F_PRIVATE_OUTPUT_PARENT: ${{ vars.Q1F_PRIVATE_OUTPUT_PARENT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:Q1F_RAW_BATCH_PATH) -or
              [string]::IsNullOrWhiteSpace($env:Q1F_PRIVATE_OUTPUT_PARENT)) {
            throw 'PRIVATE_BATCH_PATHS_NOT_CONFIGURED'
          }
          if (-not (Test-Path -LiteralPath $env:Q1F_RAW_BATCH_PATH)) {
            throw 'APPROVED_PRIVATE_BATCH_MISSING'
          }
          if (-not (Test-Path -LiteralPath $env:Q1F_PRIVATE_OUTPUT_PARENT -PathType Container)) {
            throw 'APPROVED_PRIVATE_OUTPUT_PARENT_MISSING'
          }
      - name: Private offline batch — aggregate logs only
        env:
          Q1F_RAW_BATCH_PATH: ${{ vars.Q1F_RAW_BATCH_PATH }}
          Q1F_PRIVATE_OUTPUT_PARENT: ${{ vars.Q1F_PRIVATE_OUTPUT_PARENT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:Q1F_PRIVATE_OUTPUT_PARENT "q1f-v3-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python scripts/acquisition/akarparser_v3_raw_bulk.py --input "$env:Q1F_RAW_BATCH_PATH" --out "$dest"
          if ($LASTEXITCODE -ne 0) { throw 'Q1F_PRIVATE_BATCH_FAILED' }
          $report = Get-Content -LiteralPath (Join-Path $dest "aggregate_report.json") -Raw | ConvertFrom-Json
          if ($report.input_count -lt 1 -or $report.safety.neon_admission_authorized -ne $false -or
              $report.safety.db_writes -ne 0) { throw 'Q1F_FAIL_CLOSED' }
          Write-Host "Q1F_BATCH_RECORDS=$($report.input_count)"
          Write-Host "Q1F_PRODUCTION_NEON_WRITES=0"
          Write-Host "Q1F_INDEPENDENT_PRECISION_CERTIFIED=0"
      # NO cache, artifacts, uploads, cloud credentials, or untrusted PR execution.


  historical-neon-h1-priority-1000:
    name: H1 Neon Recovery 1000 real records — read-only
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'hraaaaf/Akarfinder' && github.head_ref == 'feat/akarparser-v3-raw-bulk-20261109'
    runs-on: ubuntu-latest
    environment: q1e-neon-readonly
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      Q1E_NEON_RECOVERY_READONLY_URL: ${{ secrets.Q1E_NEON_RECOVERY_READONLY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify immutable H1 extractor and read-only secret presence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/acquisition/akarparser_v3_historical_neon_batches.py)" = '06a99ed9daa1a7fcfe1c293729b440e6caa32930'
          test -n "$Q1E_NEON_RECOVERY_READONLY_URL" || { echo 'H1_READONLY_CREDENTIAL_MISSING'; exit 1; }
          command -v psql >/dev/null || { echo 'H1_PSQL_CLIENT_MISSING'; exit 1; }
      - name: Parse exactly 1000 historic priority rows using actual V3 (private ephemeral scratch)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "$RUNNER_TEMP/akarfinder-h1.XXXXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          python -B scripts/acquisition/akarparser_v3_historical_neon_batches.py \
            --out "$scratch/out" --mode priority --batch-size 1000 --max-batches 1 \
            > "$scratch/stdout.json"
          python - "$scratch" <<'PY'
          import hashlib, json, pathlib, sys
          scratch = pathlib.Path(sys.argv[1])
          result = json.loads((scratch/'stdout.json').read_text(encoding='utf-8'))
          root = scratch/'out'
          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert result['mode'] == 'priority' and result['processed'] == 1000
          assert result['batches'] == 1 and result['db_writes'] == 0
          assert manifest['processed'] == 1000 and len(manifest['batches']) == 1
          assert manifest['snapshot']['total'] == 151900
          assert manifest['snapshot']['priority_count'] == 53083
          assert manifest['db_writes'] == 0 and manifest['source_requests'] == 0
          assert manifest['publication_authorized'] is False
          batch = manifest['batches'][0]
          raw = root/'inputs'/batch['input_file']
          report_file = root/'parsed'/batch['id']/'aggregate_report.json'
          assert hashlib.sha256(raw.read_bytes()).hexdigest() == batch['input_sha256']
          assert hashlib.sha256(report_file.read_bytes()).hexdigest() == batch['report_sha256']
          report = json.loads(report_file.read_text(encoding='utf-8'))
          assert report['input_count'] == 1000
          assert report['status_counts'].get('errors', 0) == 0
          assert report['safety']['db_writes'] == 0
          assert report['safety']['network_requests'] == 0
          assert report['safety']['neon_admission_authorized'] is False
          assert report['input_files'][raw.name]['sha256'] == batch['input_sha256']
          print('H1_REAL_NEON_V3_CANARY='+json.dumps({
              'real_records': result['processed'],
              'planned_priority': manifest['snapshot']['priority_count'],
              'planned_remaining': manifest['snapshot']['remaining_count'],
              'batch_count': result['batches'],
              'statuses': {k:v for k,v in report['status_counts'].items() if k != 'input'},
              'field_presence_not_accuracy': report['field_presence_not_accuracy'],
              'input_sha256': batch['input_sha256'],
              'report_sha256': batch['report_sha256'],
              'db_writes': 0, 'publication_authorized': False
          }, sort_keys=True))
          PY
      # The private scratch is deleted on exit. No artifacts/cache/raw listing logs.
