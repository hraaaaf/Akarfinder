name: Data Ingestion Lot 7 Sandbox Gate

on:
  pull_request:
    paths:
      - "data-ingestion/sandbox-store.ts"
      - "data-ingestion/collection-adapter.ts"
      - "data-ingestion/samples/**"
      - "scripts/scrapers/__tests__/data-ingestion-lot7-sandbox.test.ts"
      - ".github/workflows/data-ingestion-lot7-sandbox.yml"

jobs:
  sandbox-20:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate isolated 20-listing sandbox
        run: npx tsx --test scripts/scrapers/__tests__/data-ingestion-lot7-sandbox.test.ts
