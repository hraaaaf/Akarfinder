name: Recovery V4.11 Wave12 Major Portals Neon Preflight

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/activate-v4-11-wave12-major-portals-preflight.txt"

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate isolated target
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,urllib.parse
          h=urllib.parse.urlparse(os.environ["DATABASE_URL"]).hostname
          allowed={"ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech"}
          if h not in allowed: raise SystemExit("unexpected host")
          PY

      - name: Download immutable Wave12 certification
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w12" data/audits/v4-11-wave12-major-portals-preflight
          gh api "repos/${{ github.repository }}/actions/artifacts/10963070895/zip" > "$RUNNER_TEMP/w12.zip"
          unzip -q "$RUNNER_TEMP/w12.zip" -d "$RUNNER_TEMP/w12"
          echo "4927313e876a5365c6c216dca3cfd37f438a6eeee9809ed0cb520c1a00c448cc  $RUNNER_TEMP/w12/db-ready-wave12-major-portals.jsonl" | sha256sum -c -

      - name: Build preflight CSV
        run: |
          node - "$RUNNER_TEMP/w12/db-ready-wave12-major-portals.jsonl" "$RUNNER_TEMP/w12/candidates.csv" <<'NODE'
          const fs=require("fs"); const [src,out]=process.argv.slice(2);
          const rows=fs.readFileSync(src,"utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          if(rows.length!==10867)throw new Error("candidate count");
          const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
          fs.writeFileSync(out,"listing_url,canonical_fingerprint,source_name,source_offer_key\n"+rows.map(r=>[r.listing_url,r.canonical_fingerprint,r.source_name,r.source_offer_key].map(esc).join(",")).join("\n")+"\n");
          NODE

      - name: Read-only overlap diagnostic
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/w12/preflight.sql" <<'SQL'
          DROP TABLE IF EXISTS w12_pf_20260928;
          CREATE TEMP TABLE w12_pf_20260928(listing_url text,canonical_fingerprint text,source_name text,source_offer_key text);
          \copy w12_pf_20260928 FROM '/w12/candidates.csv' WITH (FORMAT csv, HEADER true)
          SELECT
            (SELECT count(*) FROM w12_pf_20260928),
            (SELECT count(*) FROM w12_pf_20260928 c JOIN public.listing_sources ls ON ls.listing_url=c.listing_url),
            (SELECT count(*) FROM w12_pf_20260928 c JOIN public.property_listings pl ON pl.canonical_fingerprint=c.canonical_fingerprint),
            (SELECT count(*) FROM w12_pf_20260928 c JOIN public.listing_sources ls ON ls.source_name=c.source_name AND ls.source_offer_key=c.source_offer_key),
            (SELECT count(*) FROM public.property_listings),
            (SELECT count(*) FROM public.listing_sources);
          \copy (SELECT DISTINCT c.source_name,c.source_offer_key FROM w12_pf_20260928 c JOIN public.listing_sources ls ON ls.source_name=c.source_name AND ls.source_offer_key=c.source_offer_key ORDER BY 1,2) TO '/w12/overlap-identities.csv' WITH (FORMAT csv, HEADER true)
          \copy (SELECT DISTINCT c.listing_url FROM w12_pf_20260928 c JOIN public.listing_sources ls ON ls.listing_url=c.listing_url ORDER BY 1) TO '/w12/overlap-urls.csv' WITH (FORMAT csv, HEADER true)
          \copy (SELECT DISTINCT c.canonical_fingerprint FROM w12_pf_20260928 c JOIN public.property_listings pl ON pl.canonical_fingerprint=c.canonical_fingerprint ORDER BY 1) TO '/w12/overlap-fingerprints.csv' WITH (FORMAT csv, HEADER true)
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w12:/w12" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -f /w12/preflight.sql' | tee data/audits/v4-11-wave12-major-portals-preflight/preflight.txt
          cp "$RUNNER_TEMP/w12"/overlap-*.csv data/audits/v4-11-wave12-major-portals-preflight/
          test "$(cut -d'|' -f1 data/audits/v4-11-wave12-major-portals-preflight/preflight.txt)" = "10867"

      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-wave12-major-portals-neon-preflight
          path: data/audits/v4-11-wave12-major-portals-preflight/
          retention-days: 30
