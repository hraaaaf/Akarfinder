name: Announcement Page L1 Premium Shell

on:
  pull_request:
    paths:
      - "app/listings/**"
      - "app/visual-qa/announcement-page/**"
      - "components/listings/AnnouncementPageShell.tsx"
      - "scripts/audits/announcement-page-l1-visual.mjs"
      - "scripts/scrapers/__tests__/announcement-page-l1-shell.test.ts"
      - "scripts/scrapers/__tests__/ux-p1-decision-continuity.test.ts"
      - "scripts/scrapers/__tests__/ux-p1-mobile-decision-ergonomics.test.ts"
      - "scripts/scrapers/__tests__/ux-p1-design-system-convergence.test.ts"
      - ".github/workflows/announcement-page-l1-shell.yml"
  push:
    branches:
      - main
      - agent/announcement-page-l1-shell-premium
    paths:
      - "app/listings/**"
      - "app/visual-qa/announcement-page/**"
      - "components/listings/AnnouncementPageShell.tsx"
      - "scripts/audits/announcement-page-l1-visual.mjs"
      - "scripts/scrapers/__tests__/announcement-page-l1-shell.test.ts"
      - "scripts/scrapers/__tests__/ux-p1-decision-continuity.test.ts"
      - "scripts/scrapers/__tests__/ux-p1-mobile-decision-ergonomics.test.ts"
      - "scripts/scrapers/__tests__/ux-p1-design-system-convergence.test.ts"
      - ".github/workflows/announcement-page-l1-shell.yml"

permissions:
  contents: read

jobs:
  shell-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ANN-L1 shell contracts
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/announcement-page-l1-shell.test.ts
          scripts/scrapers/__tests__/ux-p1-decision-continuity.test.ts
          scripts/scrapers/__tests__/ux-p1-mobile-decision-ergonomics.test.ts
          scripts/scrapers/__tests__/ux-p1-design-system-convergence.test.ts
          scripts/scrapers/__tests__/listing-detail-boundary.test.ts
          scripts/scrapers/__tests__/p10img-image-policy.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start ANN-L1 production server
        shell: bash
        run: |
          npm run start -- -p 3202 > /tmp/ann-l1.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3202/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ann-l1.log
          exit 1

      - name: ANN-L1 targeted visual certification
        env:
          BASE_URL: http://127.0.0.1:3202
          AUDIT_OUTPUT_DIR: artifacts/announcement-page-l1-visual
        run: node scripts/audits/announcement-page-l1-visual.mjs

      - name: Upload ANN-L1 visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: announcement-page-l1-visual-${{ github.run_id }}
          path: artifacts/announcement-page-l1-visual
          if-no-files-found: error
          retention-days: 14
