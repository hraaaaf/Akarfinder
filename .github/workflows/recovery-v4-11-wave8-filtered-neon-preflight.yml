name: Recovery V4.11 Wave8 Filtered Neon Preflight

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/activate-v4-11-wave8-filtered-preflight.txt"

permissions:
  contents: read
  actions: read

jobs:
  filter-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate isolated target
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,urllib.parse
          h=urllib.parse.urlparse(os.environ["DATABASE_URL"]).hostname
          allowed={
            "ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech",
          }
          if h not in allowed: raise SystemExit("refusing unexpected Neon host")
          PY

      - name: Download immutable Wave8 certification
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w8" data/audits/v4-11-wave8-filtered
          gh api repos/${{ github.repository }}/actions/artifacts/10934176431/zip > "$RUNNER_TEMP/w8.zip"
          unzip -q -o "$RUNNER_TEMP/w8.zip" -d "$RUNNER_TEMP/w8"
          echo "85e65311dba66008a02f1c145e1166db26c186029c22cfae1b3628e67074cb31  $RUNNER_TEMP/w8/db-ready-wave8.jsonl" | sha256sum -c -
          test "$(wc -l < "$RUNNER_TEMP/w8/db-ready-wave8.jsonl")" = "39132"

      - name: Build candidate identity CSV
        run: |
          node - "$RUNNER_TEMP/w8/db-ready-wave8.jsonl" "$RUNNER_TEMP/w8/candidates.csv" <<'NODE'
          const fs=require("fs"); const [src,out]=process.argv.slice(2);
          const rows=fs.readFileSync(src,"utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
          fs.writeFileSync(out,"listing_url,canonical_fingerprint,source_name,source_offer_key\n"+
            rows.map(r=>[r.listing_url,r.canonical_fingerprint,r.source_name,r.source_offer_key].map(esc).join(",")).join("\n")+"\n");
          NODE

      - name: Read isolated Neon and export distinct identity overlaps
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/w8/filter.sql" <<'SQL'
          CREATE TEMP TABLE stage_w8 (
            listing_url text NOT NULL,
            canonical_fingerprint text NOT NULL,
            source_name text NOT NULL,
            source_offer_key text NOT NULL
          );
          \copy stage_w8 FROM '/w8/candidates.csv' WITH (FORMAT csv, HEADER true)

          CREATE TEMP TABLE existing_identity AS
          SELECT DISTINCT
            CASE WHEN listing_url ~* 'mubawab\.ma' THEN 'mubawab.ma'
                 WHEN listing_url ~* 'avito\.ma' THEN 'avito.ma' END AS source_name,
            CASE WHEN listing_url ~* 'mubawab\.ma' THEN (regexp_match(listing_url, '/(a|pa)/([0-9]+)(/|$)'))[2]
                 WHEN listing_url ~* 'avito\.ma' THEN (regexp_match(listing_url, '_([0-9]+)\.html?$'))[1] END AS source_offer_key
          FROM public.listing_sources
          WHERE listing_url ~* '(mubawab\.ma|avito\.ma)';

          CREATE TEMP TABLE overlap_ids AS
          SELECT DISTINCT s.source_name,s.source_offer_key
          FROM stage_w8 s JOIN existing_identity e
            ON e.source_name=s.source_name AND e.source_offer_key=s.source_offer_key;

          \copy overlap_ids TO '/w8/identity-overlaps.csv' WITH (FORMAT csv, HEADER true)
          SELECT
            (SELECT count(*) FROM stage_w8),
            (SELECT count(*) FROM overlap_ids),
            (SELECT count(*) FROM overlap_ids WHERE source_name='mubawab.ma'),
            (SELECT count(*) FROM overlap_ids WHERE source_name='avito.ma'),
            (SELECT count(*) FROM stage_w8 s JOIN public.listing_sources ls ON ls.listing_url=s.listing_url),
            (SELECT count(*) FROM stage_w8 s JOIN public.property_listings pl ON pl.canonical_fingerprint=s.canonical_fingerprint),
            (SELECT count(*) FROM public.property_listings),
            (SELECT count(*) FROM public.listing_sources),
            (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='clean-corpus-v4.11-wave8');
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w8:/w8" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -f /w8/filter.sql' | tee "$RUNNER_TEMP/w8/neon-read.txt"
          OUT="$(grep -E '^[0-9]+\|' "$RUNNER_TEMP/w8/neon-read.txt" | tail -n1)"
          IFS='|' read -r STAGED IDO MUB AVITO URLO FPO PL LS EXISTING_W8 <<< "$OUT"
          test "$STAGED" = "39132"
          test "$IDO" = "197"
          test "$MUB" = "195"
          test "$AVITO" = "2"
          test "$URLO" = "0"
          test "$FPO" = "0"
          test "$PL" = "100226"
          test "$LS" = "100226"
          test "$EXISTING_W8" = "0"

      - name: Filter and freeze Wave8 candidate
        run: |
          node - "$RUNNER_TEMP/w8/db-ready-wave8.jsonl" "$RUNNER_TEMP/w8/identity-overlaps.csv" data/audits/v4-11-wave8-filtered <<'NODE'
          const fs=require("fs"),crypto=require("crypto");
          const [src,csv,out]=process.argv.slice(2);
          const rows=fs.readFileSync(src,"utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const parse=(line)=>{const m=line.match(/^"((?:[^"]|"")*)","((?:[^"]|"")*)"$/);if(!m)throw new Error("bad overlap csv");return m.slice(1).map(x=>x.replace(/""/g,'"'))};
          const overlaps=new Set(fs.readFileSync(csv,"utf8").split(/\r?\n/).filter(Boolean).slice(1).map(x=>parse(x).join("|")));
          const kept=rows.filter(r=>!overlaps.has(r.source_name+"|"+r.source_offer_key));
          if(overlaps.size!==197)throw new Error("overlap count "+overlaps.size);
          if(kept.length!==38935)throw new Error("kept count "+kept.length);
          if(new Set(kept.map(r=>r.listing_url)).size!==kept.length)throw new Error("url duplicate");
          if(new Set(kept.map(r=>r.canonical_fingerprint)).size!==kept.length)throw new Error("fp duplicate");
          if(new Set(kept.map(r=>r.source_name+"|"+r.source_offer_key)).size!==kept.length)throw new Error("identity duplicate");
          if(kept.some(r=>![r.title,r.city,r.property_type,r.transaction_type].every(v=>v!=null&&String(v).trim()!=="")))throw new Error("core gap");
          const body=kept.map(r=>JSON.stringify(r)).join("\n")+"\n";
          fs.writeFileSync(out+"/db-ready-wave8-filtered.jsonl",body);
          const byDomain={}; for(const r of kept)byDomain[r.source_name]=(byDomain[r.source_name]||0)+1;
          fs.writeFileSync(out+"/summary.json",JSON.stringify({
            schema_version:"akarfinder-v4.11-wave8-filtered-neon-preflight-20260927",
            source_wave8_artifact_id:10934176431,
            source_rows:39132,
            removed_distinct_identity_overlaps:197,
            db_ready_rows:kept.length,
            by_domain:byDomain,
            output_sha256:crypto.createHash("sha256").update(body).digest("hex"),
            database_access:"isolated_neon_read_only",
            database_writes:0,production_neon_writes:0,approved_for_import_rows:0,vercel_deployment:false
          },null,2)+"\n");
          NODE

      - name: Final isolated Neon zero-overlap preflight
        run: |
          set -euo pipefail
          node - data/audits/v4-11-wave8-filtered/db-ready-wave8-filtered.jsonl "$RUNNER_TEMP/w8/filtered.csv" <<'NODE'
          const fs=require("fs"); const [src,out]=process.argv.slice(2);
          const rows=fs.readFileSync(src,"utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
          fs.writeFileSync(out,"listing_url,canonical_fingerprint,source_name,source_offer_key\n"+
            rows.map(r=>[r.listing_url,r.canonical_fingerprint,r.source_name,r.source_offer_key].map(esc).join(",")).join("\n")+"\n");
          NODE
          cat > "$RUNNER_TEMP/w8/preflight.sql" <<'SQL'
          CREATE TEMP TABLE f (listing_url text,canonical_fingerprint text,source_name text,source_offer_key text);
          \copy f FROM '/w8/filtered.csv' WITH (FORMAT csv, HEADER true)
          WITH e AS (
            SELECT DISTINCT
              CASE WHEN listing_url ~* 'mubawab\.ma' THEN 'mubawab.ma' WHEN listing_url ~* 'avito\.ma' THEN 'avito.ma' END source_name,
              CASE WHEN listing_url ~* 'mubawab\.ma' THEN (regexp_match(listing_url,'/(a|pa)/([0-9]+)(/|$)'))[2]
                   WHEN listing_url ~* 'avito\.ma' THEN (regexp_match(listing_url,'_([0-9]+)\.html?$'))[1] END source_offer_key
            FROM public.listing_sources WHERE listing_url ~* '(mubawab\.ma|avito\.ma)'
          )
          SELECT
            (SELECT count(*) FROM f),
            (SELECT count(*) FROM f JOIN public.listing_sources ls ON ls.listing_url=f.listing_url),
            (SELECT count(*) FROM f JOIN public.property_listings pl ON pl.canonical_fingerprint=f.canonical_fingerprint),
            (SELECT count(*) FROM f JOIN e USING(source_name,source_offer_key));
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w8:/w8" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -f /w8/preflight.sql' | tee "$RUNNER_TEMP/w8/final-preflight.txt"
          OUT="$(grep -E '^[0-9]+\|' "$RUNNER_TEMP/w8/final-preflight.txt" | tail -n1)"
          test "$OUT" = "38935|0|0|0"
          cp "$RUNNER_TEMP/w8/final-preflight.txt" data/audits/v4-11-wave8-filtered/neon-preflight.txt

      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-db-ready-wave8-filtered-preflight
          path: data/audits/v4-11-wave8-filtered/
          retention-days: 30
