name: Docs Close RANKING-QUALITY-1

on:
  pull_request:
    paths:
      - '.github/workflows/docs-close-ranking-quality-1.yml'

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.pull_request.head.ref == 'docs/close-ranking-quality-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch canonical docs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}: {old[:120]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text)

          replace_once(
              'README.md',
              'Prochain lot UX/Search séparé : **PRICE-COVERAGE-RECOVERY-1**.',
              '''### PRICE-COVERAGE-RECOVERY-1 ✅ PR #395\n\nRécupération de prix remise sous gouvernance fail-closed : l’ancien V1 shadow est désormais audit-only, les **8 fuites publiques** historiques ont été nettoyées en production, publication et ranking restent désactivés pour ce shadow. Migration canonique `20260809013000_price_coverage_recovery_shadow_governance`, report production `shadow_public_leaks=0`.\n\n### RANKING-QUALITY-1 ✅ PR #403\n\nPolitique de qualité persistée recomposée et resynchronisée sans modifier Ranking V2 ni la priorité commerciale. Préflight : **14 007 / 56 810** rows stale ; après migration production : `policy_drift_rows=0`, 0 vertical non immobilier/inconnu public, 0 CATEGORY public, 0 AMBIGUOUS primary, 0 LISTING gardant l’ancienne policy ambiguous. Les **587** fallbacks provider-detail explicites restent conservés. Inventaire LISTING public : **15 438** (10 061 primary / 5 377 secondary). Merge `c5949063fa1c0e3448e917473239f821a17b7d59`.\n\nProchain lot UX/Search séparé : **UNIFIED-LISTING-CARD-1**.'''
          )

          replace_once(
              'docs/ROADMAP.md',
              '**Statut : UX/Carte P1B.4 ✅ production certifiée ; BENCHMARK-SERP-1 ✅ ; SEARCH-UX-FAST-1 ✅ PR #390 ; SEARCH-WORDING-PURITY-1 ✅ PR #391 ; SEARCH-CONTINUOUS-FLOW-1 ✅ PR #393 ; SEARCH-MOBILE-CARD-GRID-1 ✅ PR #394 ; prochain lot UX Search = PRICE-COVERAGE-RECOVERY-1 ; couche Offre quartier OFF ; DATA-4.4C ✅ ; P0.1 ✅ ; P0.2 Common Crawl Discovery Coverage ✅ CLOSED ; freshness reconciler hardening ✅ PR #396**',
              '**Statut : UX/Carte P1B.4 ✅ production certifiée ; BENCHMARK-SERP-1 ✅ ; SEARCH-UX-FAST-1 ✅ PR #390 ; SEARCH-WORDING-PURITY-1 ✅ PR #391 ; SEARCH-CONTINUOUS-FLOW-1 ✅ PR #393 ; SEARCH-MOBILE-CARD-GRID-1 ✅ PR #394 ; PRICE-COVERAGE-RECOVERY-1 ✅ PR #395 ; RANKING-QUALITY-1 ✅ PR #403 production certifiée ; prochain lot UX Search = UNIFIED-LISTING-CARD-1 ; couche Offre quartier OFF ; DATA-4.4C ✅ ; P0.1 ✅ ; P0.2 Common Crawl Discovery Coverage ✅ CLOSED ; freshness reconciler hardening ✅ PR #396**'
          )

          replace_once(
              'docs/ROADMAP.md',
              '''### Prochains lots UX/Search — ordre strict\n\n1. **PRICE-COVERAGE-RECOVERY-1** — audit puis récupération policy-compliant des prix manquants ;\n2. **RANKING-QUALITY-1** — qualité/complétude/relevance dans le cadre de la priorité commerciale ;\n3. **UNIFIED-LISTING-CARD-1** — grammaire unique des cards ;\n4. **CONTEXTUAL-VISUAL-ASSETS-1** — visuels contextuels déterministes et truth-safe.''',
              '''## PRICE-COVERAGE-RECOVERY-1 ✅ CLOSED — PR #395\n\nResponsabilité : neutraliser l’ancien shadow price recovery V1 qui pouvait écrire dans le prix public. Production certifiée : **8 → 0 shadow leaks**, aucune valeur raw/trusted touchée, materializer rendu audit-only, publication=false, ranking=false. Migration canonique `20260809013000_price_coverage_recovery_shadow_governance`.\n\n## RANKING-QUALITY-1 ✅ CLOSED — PR #403\n\nResponsabilité : resynchroniser la policy de qualité persistée avec vertical/document-kind/provider-detail sans modifier Ranking V2 ni l’ordre commercial. Préflight : **14 007 / 56 810** rows différaient de la policy composée. Production après migrations : `policy_drift_rows=0`, tous les invariants fail-closed à zéro, **587** fallbacks provider-detail conservés, **15 438** LISTING publics (10 061 primary / 5 377 secondary). Reviewer PASS, Release Certifier GO, **19/19** workflows exact-head verts, merge `c5949063fa1c0e3448e917473239f821a17b7d59`.\n\n### Prochains lots UX/Search — ordre strict\n\n1. **UNIFIED-LISTING-CARD-1** — grammaire unique des cards ;\n2. **CONTEXTUAL-VISUAL-ASSETS-1** — visuels contextuels déterministes et truth-safe.'''
          )

          replace_once(
              'docs/SESSION.md',
              '**Lane UX/Search : SEARCH-UX-FAST-1 ✅ #390 ; SEARCH-WORDING-PURITY-1 ✅ #391 ; SEARCH-CONTINUOUS-FLOW-1 ✅ #393 ; SEARCH-MOBILE-CARD-GRID-1 ✅ #394 ; prochain lot = PRICE-COVERAGE-RECOVERY-1**',
              '**Lane UX/Search : SEARCH-UX-FAST-1 ✅ #390 ; SEARCH-WORDING-PURITY-1 ✅ #391 ; SEARCH-CONTINUOUS-FLOW-1 ✅ #393 ; SEARCH-MOBILE-CARD-GRID-1 ✅ #394 ; PRICE-COVERAGE-RECOVERY-1 ✅ #395 ; RANKING-QUALITY-1 ✅ #403 production certifiée ; prochain lot = UNIFIED-LISTING-CARD-1**'
          )

          replace_once(
              'docs/SESSION.md',
              'Base du closeout DATA : `main` `8ffffc7cfbe0921d21f66887e1c4ecccf3a738cb` — merge PR #400.',
              'Main canonique après RANKING-QUALITY-1 : `c5949063fa1c0e3448e917473239f821a17b7d59` — merge PR #403.'
          )

          replace_once(
              'docs/SESSION.md',
              '- SEARCH-MOBILE-CARD-GRID-1 ✅ #394 — grille mobile 2 colonnes, prix non tronqué, desktop préservé ;',
              '''- SEARCH-MOBILE-CARD-GRID-1 ✅ #394 — grille mobile 2 colonnes, prix non tronqué, desktop préservé ;\n- PRICE-COVERAGE-RECOVERY-1 ✅ #395 — 8 shadow price leaks historiques → 0, recovery V1 audit-only, publication/ranking inchangés ;\n- RANKING-QUALITY-1 ✅ #403 — 14 007 rows stale resynchronisées, policy drift production = 0, Ranking V2 inchangé ;'''
          )

          replace_once(
              'docs/SESSION.md',
              '''# UX / Search — état court\n\n- SEARCH-UX-FAST-1 ✅ #390 — mobile 9,3/10 ;\n- SEARCH-WORDING-PURITY-1 ✅ #391 — mobile 9,4/10 ;\n- SEARCH-CONTINUOUS-FLOW-1 ✅ #393 — mobile 9,5/10 ;\n- SEARCH-MOBILE-CARD-GRID-1 ✅ #394 — mobile 9,6/10 ;\n- prochain lot : **PRICE-COVERAGE-RECOVERY-1** uniquement.\n\nPuis : `RANKING-QUALITY-1` → `UNIFIED-LISTING-CARD-1` → `CONTEXTUAL-VISUAL-ASSETS-1`.''',
              '''# UX / Search — état court\n\n- SEARCH-UX-FAST-1 ✅ #390 — mobile 9,3/10 ;\n- SEARCH-WORDING-PURITY-1 ✅ #391 — mobile 9,4/10 ;\n- SEARCH-CONTINUOUS-FLOW-1 ✅ #393 — mobile 9,5/10 ;\n- SEARCH-MOBILE-CARD-GRID-1 ✅ #394 — mobile 9,6/10 ;\n- PRICE-COVERAGE-RECOVERY-1 ✅ #395 — production certifiée, 0 shadow public leak ;\n- RANKING-QUALITY-1 ✅ #403 — production certifiée, `policy_drift_rows=0`, 15 438 LISTING publics ;\n- prochain lot : **UNIFIED-LISTING-CARD-1** uniquement.\n\nPuis : `CONTEXTUAL-VISUAL-ASSETS-1`.'''
          )
          PY
      - name: Remove temporary updater
        run: rm .github/workflows/docs-close-ranking-quality-1.yml
      - name: Commit canonical closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md .github/workflows/docs-close-ranking-quality-1.yml
          git commit -m "docs: close RANKING-QUALITY-1 and advance Search roadmap"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
