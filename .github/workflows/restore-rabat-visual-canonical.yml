name: Restore Rabat Visual Canonical

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/closeouts/restore-rabat-visual-canonical.mjs"
      - ".github/workflows/restore-rabat-visual-canonical.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore Rabat P0-P2 canonical block
        run: node scripts/closeouts/restore-rabat-visual-canonical.mjs
      - name: Commit if changed
        shell: bash
        run: |
          if ! git diff --quiet -- docs/ROADMAP.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ROADMAP.md
            git commit -m "docs(visual): restore Rabat P0-P2 canonical state"
            git push origin HEAD:${{ github.head_ref }}
          fi
