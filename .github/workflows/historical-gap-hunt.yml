name: AkarFinder - Q1A DATA4.9B Direct Archived Sitemaps

on:
  push:
    paths:
      - "scripts/audits/candidate-lake-q1a-data49b-wayback-direct-sitemaps.ts"
      - ".github/workflows/historical-gap-hunt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q1a-data49b-direct-archived-sitemaps:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - domain: valfoncier.ma
            slug: valfoncier
          - domain: christiesrealestatemorocco.com
            slug: christies
          - domain: immo-maroc.com
            slug: immo-maroc
          - domain: agadirimmobilier.ma
            slug: agadirimmobilier
          - domain: proimmobilier.ma
            slug: proimmobilier
          - domain: capital-properties.ma
            slug: capital-properties
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      Q1A_DATA49B_DOMAIN: ${{ matrix.domain }}
      Q1A_DATA49B_WAYBACK_DIRECT_OUT: .tmp/candidate-lake-q1a-data49b-wayback-direct-${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Replay conventional sitemap roots from Wayback before DATA4.9B cutoff
        run: npx tsx scripts/audits/candidate-lake-q1a-data49b-wayback-direct-sitemaps.ts
      - name: Verify archive-only fail-closed contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const dir=process.env.Q1A_DATA49B_WAYBACK_DIRECT_OUT;
          const p=JSON.parse(fs.readFileSync(`${dir}/summary.json`,'utf8'));
          if(p.readOnly!==true || p.databaseWrites!==0 || p.productionWrites!==0) throw new Error('write boundary violated');
          if(p.sourceSiteFetches!==0 || p.sourceContentFetches!==0 || p.detailPageFetches!==0 || p.warcFetches!==0) throw new Error('source/WARC boundary violated');
          if(p.archiveContentFetchesOnly!==true || p.archiveSitemapsOnly!==true || p.vercelDeployments!==0) throw new Error('archive/deploy boundary violated');
          console.log(JSON.stringify({domain:p.domain,exactAttemptCount:p.exactAttemptCount,uniqueExactManifestHashes:p.uniqueExactManifestHashes,selectedExactManifest:p.selectedExactManifest,certificationState:p.certificationState},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-lake-q1a-data49b-wayback-direct-${{ matrix.slug }}
          path: .tmp/candidate-lake-q1a-data49b-wayback-direct-${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 30
