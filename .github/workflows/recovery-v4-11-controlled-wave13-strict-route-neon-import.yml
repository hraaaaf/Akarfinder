name: Recovery V4.11 Controlled Wave13 Strict Route Neon Import

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/v4-11-wave13-strict-route-import-approval.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: recovery-v4-11-wave13-strict-route-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate approval and isolated target
        run: |
          set -euo pipefail
          node - <<'NODE'
          const a=require("./data/recovery/v4-11-wave13-strict-route-import-approval.json");
          if(a.approved!==true||!Number.isInteger(a.rows)||a.rows<=0)throw new Error("approval");
          if(!Number.isInteger(a.artifact_id)||a.artifact_id<=0)throw new Error("artifact");
          if(!/^[0-9a-f]{64}$/.test(a.jsonl_sha256||""))throw new Error("sha");
          if(!Number.isInteger(a.preflight_run_id)||a.preflight_run_id<=0)throw new Error("preflight");
          if(a.expected_pre!==149939||a.expected_post!==149939+a.rows)throw new Error("counts");
          if(a.target_project!=="ancient-violet-43534870"||a.target_branch!=="br-cold-mouse-b2a50yaa"||a.target_database!=="AkarFinder")throw new Error("target");
          if(a.production_neon_writes_authorized!==false||a.vercel_deployment_authorized!==false)throw new Error("scope");
          NODE
          python - <<'PY'
          import os,urllib.parse
          h=urllib.parse.urlparse(os.environ["DATABASE_URL"]).hostname
          allowed={"ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech"}
          if h not in allowed: raise SystemExit("unexpected host")
          PY

      - name: Download exact filtered artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w13"
          ARTIFACT_ID=$(node -p 'require("./data/recovery/v4-11-wave13-strict-route-import-approval.json").artifact_id')
          EXPECTED_SHA=$(node -p 'require("./data/recovery/v4-11-wave13-strict-route-import-approval.json").jsonl_sha256')
          ROWS=$(node -p 'require("./data/recovery/v4-11-wave13-strict-route-import-approval.json").rows')
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/w13.zip"
          unzip -q "$RUNNER_TEMP/w13.zip" -d "$RUNNER_TEMP/w13"
          echo "$EXPECTED_SHA  $RUNNER_TEMP/w13/db-ready-wave13-strict-route-filtered.jsonl" | sha256sum -c -
          test "$(wc -l < "$RUNNER_TEMP/w13/db-ready-wave13-strict-route-filtered.jsonl")" = "$ROWS"

      - name: Build import CSV
        run: |
          node - "$RUNNER_TEMP/w13/db-ready-wave13-strict-route-filtered.jsonl" "$RUNNER_TEMP/w13/import.csv" <<'NODE'
          const fs=require("fs"),a=require("./data/recovery/v4-11-wave13-strict-route-import-approval.json");
          const [src,out]=process.argv.slice(2); const rows=fs.readFileSync(src,"utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const cols=["canonical_fingerprint","title","price_mad","city","district","property_type","transaction_type","surface_m2","rooms_count","bedrooms_count","bathrooms_count","description_snippet","images_count","seller_name","data_completeness_score","field_confidence","source_name","listing_url","source_url","first_seen_at","last_seen_at","source_offer_key","origin_type","compliance_status","content_fingerprint","ingestion_run_id","displayed_price","price_currency","price_period","price_status"];
          const e=v=>{if(v==null)return "";const s=typeof v==="object"?JSON.stringify(v):String(v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
          if(rows.length!==a.rows||rows.some(r=>r.approved_for_import!==false))throw new Error("rows");
          fs.writeFileSync(out,cols.join(",")+"\n"+rows.map(r=>cols.map(c=>e(r[c])).join(",")).join("\n")+"\n");
          NODE

      - name: Atomic Wave12 import
        run: |
          set -euo pipefail
          PRE=$(node -p 'require("./data/recovery/v4-11-wave13-strict-route-import-approval.json").expected_pre')
          POST=$(node -p 'require("./data/recovery/v4-11-wave13-strict-route-import-approval.json").expected_post')
          ROWS=$(node -p 'require("./data/recovery/v4-11-wave13-strict-route-import-approval.json").rows')
          cat > "$RUNNER_TEMP/w13/import.sql" <<'SQL'
          BEGIN;
          CREATE TEMP TABLE w13_import(
            canonical_fingerprint text NOT NULL,title text NOT NULL,price_mad integer,city text NOT NULL,district text,
            property_type text NOT NULL,transaction_type text NOT NULL,surface_m2 integer,rooms_count integer,bedrooms_count integer,bathrooms_count integer,
            description_snippet text,images_count integer,seller_name text,data_completeness_score integer,field_confidence jsonb,
            source_name text NOT NULL,listing_url text NOT NULL,source_url text,first_seen_at timestamptz,last_seen_at timestamptz,source_offer_key text NOT NULL,
            origin_type text,compliance_status text,content_fingerprint text,ingestion_run_id text,displayed_price numeric,price_currency text,price_period text,price_status text
          ) ON COMMIT DROP;
          \copy w13_import FROM '/w13/import.csv' WITH (FORMAT csv, HEADER true)
          SELECT 1 / (((SELECT count(*) FROM public.property_listings)=:pre)::int);
          SELECT 1 / (((SELECT count(*) FROM public.listing_sources)=:pre)::int);
          SELECT 1 / (((SELECT count(*) FROM w13_import)=:rows)::int);
          SELECT 1 / ((NOT EXISTS(SELECT 1 FROM w13_import s JOIN public.listing_sources ls ON ls.listing_url=s.listing_url))::int);
          SELECT 1 / ((NOT EXISTS(SELECT 1 FROM w13_import s JOIN public.property_listings pl ON pl.canonical_fingerprint=s.canonical_fingerprint))::int);
          SELECT 1 / ((NOT EXISTS(SELECT 1 FROM w13_import s JOIN public.listing_sources ls ON ls.source_name=s.source_name AND ls.source_offer_key=s.source_offer_key))::int);
          INSERT INTO public.property_listings(canonical_fingerprint,title,price_mad,city,district,property_type,transaction_type,surface_m2,rooms_count,bedrooms_count,bathrooms_count,description_snippet,images_count,seller_name,data_completeness_score,field_confidence)
          SELECT canonical_fingerprint,title,price_mad,city,district,property_type,transaction_type,surface_m2,rooms_count,bedrooms_count,bathrooms_count,description_snippet,images_count,seller_name,data_completeness_score,field_confidence FROM w13_import;
          INSERT INTO public.listing_sources(property_listing_id,source_name,listing_url,source_url,first_seen_at,last_seen_at,is_active,source_offer_key,origin_type,compliance_status,content_fingerprint,ingestion_run_id,displayed_price,price_currency,price_period,price_status)
          SELECT pl.id,s.source_name,s.listing_url,s.source_url,s.first_seen_at,s.last_seen_at,true,s.source_offer_key,s.origin_type,s.compliance_status,s.content_fingerprint,s.ingestion_run_id,s.displayed_price,s.price_currency,s.price_period,s.price_status
          FROM w13_import s JOIN public.property_listings pl ON pl.canonical_fingerprint=s.canonical_fingerprint;
          SELECT 1 / (((SELECT count(*) FROM public.property_listings)=:post)::int);
          SELECT 1 / (((SELECT count(*) FROM public.listing_sources)=:post)::int);
          SELECT 1 / (((SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='clean-corpus-v4.11-wave13-strict-route')=:rows)::int);
          COMMIT;
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w13:/w13" postgres:17 sh -lc "psql \"\$DATABASE_URL\" -X -v ON_ERROR_STOP=1 -v pre=$PRE -v post=$POST -v rows=$ROWS -f /w13/import.sql"

      - name: Immediate readback
        run: |
          set -euo pipefail
          POST=$(node -p 'require("./data/recovery/v4-11-wave13-strict-route-import-approval.json").expected_post')
          ROWS=$(node -p 'require("./data/recovery/v4-11-wave13-strict-route-import-approval.json").rows')
          docker run --rm -e DATABASE_URL="$DATABASE_URL" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -c "SELECT (SELECT count(*) FROM public.property_listings),(SELECT count(*) FROM public.listing_sources),(SELECT count(DISTINCT listing_url) FROM public.listing_sources),(SELECT count(DISTINCT canonical_fingerprint) FROM public.property_listings),(SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='"'"'clean-corpus-v4.11-wave13-strict-route'"'"'),(SELECT count(*) FROM public.listing_sources ls LEFT JOIN public.property_listings pl ON pl.id=ls.property_listing_id WHERE pl.id IS NULL),(SELECT count(*) FROM public.listing_sources WHERE is_active IS NOT TRUE);"' | tee "$RUNNER_TEMP/w13/readback.txt"
          test "$(cat "$RUNNER_TEMP/w13/readback.txt")" = "$POST|$POST|$POST|$POST|$ROWS|0|0"

      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-wave13-strict-route-import-readback
          path: ${{ runner.temp }}/w13/readback.txt
          retention-days: 30
