name: P1B.3 Territorial Metric Join Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20260808101500_p1b3_territorial_metric_join_contract.sql"
      - "scripts/scrapers/__tests__/p1b3-territorial-metric-join.test.ts"
      - "scripts/scrapers/__tests__/p1b3-territorial-metric-join.pg.test.ts"
      - ".github/workflows/p1b3-territorial-metric-join.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20260808101500_p1b3_territorial_metric_join_contract.sql"
      - "scripts/scrapers/__tests__/p1b3-territorial-metric-join.test.ts"
      - "scripts/scrapers/__tests__/p1b3-territorial-metric-join.pg.test.ts"
      - ".github/workflows/p1b3-territorial-metric-join.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Certify territorial metric join contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Static truth contract
        run: npx tsx --test scripts/scrapers/__tests__/p1b3-territorial-metric-join.test.ts
      - name: PostgreSQL semantic contract
        run: npx tsx --test scripts/scrapers/__tests__/p1b3-territorial-metric-join.pg.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
