name: Live Mubawab full enumeration

on:
  push:
    branches:
      - feat/mubawab-full-enumeration
    paths:
      - '.github/workflows/live-mubawab-full.yml'
      - 'scripts/acquisition/mubawab-exhaustive-enumerator.mjs'
      - 'scripts/acquisition/mubawab-supabase-shard-runner.mjs'
      - 'scripts/acquisition/__tests__/mubawab-exhaustive-enumerator.test.mjs'
      - 'scripts/acquisition/__tests__/mubawab-supabase-shard-runner.test.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: live-mubawab-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Targeted unit tests
        run: |
          node --test scripts/acquisition/__tests__/mubawab-exhaustive-enumerator.test.mjs
          node --test scripts/acquisition/__tests__/mubawab-supabase-shard-runner.test.mjs

      - name: Restore prior successful shard checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_ARTIFACT_ID: '9967776380'
        run: |
          mkdir -p artifacts/mubawab-checkpoint-prev
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$CHECKPOINT_ARTIFACT_ID/zip" \
            -o /tmp/mubawab-checkpoint.zip
          unzip -q /tmp/mubawab-checkpoint.zip -d artifacts/mubawab-checkpoint-prev
          test -f artifacts/mubawab-checkpoint-prev/report.json

      - name: Resume robots-safe Supabase shard-manifest replay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MUBAWAB_MANIFEST_LIMIT: '100000'
          MUBAWAB_MAX_REQUESTS: '100000'
          MUBAWAB_REQUEST_DELAY_MS: '2750'
          MUBAWAB_CHECKPOINT_REPORT: artifacts/mubawab-checkpoint-prev/report.json
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          node scripts/acquisition/mubawab-supabase-shard-runner.mjs

      - name: Strict cumulative certification
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/morocco-web-l8-mubawab-manifest/report.json';
          const report = JSON.parse(fs.readFileSync(p, 'utf8'));

          if (report.zeroDbWrites !== true) throw new Error('zeroDbWrites must be true');
          if (report.requestDelayMs !== 2750) throw new Error(`request delay drift: ${report.requestDelayMs}`);
          if (!(report.safeShardCount > 0)) throw new Error('safeShardCount must be > 0');
          if (report.targetShardCount !== report.safeShardCount) {
            throw new Error(`manifest incomplete: target=${report.targetShardCount} safe=${report.safeShardCount}`);
          }
          if (report.totalCompletedShardCount !== report.targetShardCount) {
            throw new Error(`cumulative shard coverage incomplete: completed=${report.totalCompletedShardCount} target=${report.targetShardCount}`);
          }
          if (report.remainingShardCount !== 0) {
            throw new Error(`remainingShardCount must be 0, got ${report.remainingShardCount}`);
          }
          if (report.queueRemaining !== 0) {
            throw new Error(`queueRemaining must be 0, got ${report.queueRemaining}`);
          }
          if (report.stoppedEarly) throw new Error(`unexpected early stop: ${report.stoppedEarly}`);
          if (!(report.aggregatedUniqueListingIdCount > 0)) throw new Error('no aggregated listing IDs found');
          if (!report.checkpoint || report.checkpoint.completedShardUrls.length !== report.targetShardCount) {
            throw new Error('checkpoint does not cover all target shards');
          }

          console.log({
            sourceRowCount: report.sourceRowCount,
            safeShardCount: report.safeShardCount,
            previousCompletedShardCount: report.previousCompletedShardCount,
            selectedShardCount: report.selectedShardCount,
            currentCompletedShardCount: report.currentCompletedShardCount,
            totalCompletedShardCount: report.totalCompletedShardCount,
            remainingShardCount: report.remainingShardCount,
            aggregatedUniqueListingIdCount: report.aggregatedUniqueListingIdCount,
            stoppedEarly: report.stoppedEarly,
            zeroDbWrites: report.zeroDbWrites,
          });
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mubawab-full-enumeration
          path: artifacts/morocco-web-l8-mubawab-manifest/
          if-no-files-found: error
          retention-days: 14
