name: Recovery V4.11 G6 Cross-Source Identity Audit

on:
  push:
    branches: ["recovery/big-portals-mass-20260925"]
    paths:
      - "data/recovery/activate-v4-11-g6-audit.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download normalized candidate artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidates" data/audits/rematerialized
          gh api repos/${{ github.repository }}/actions/artifacts/10917104569/zip > "$RUNNER_TEMP/candidates.zip"
          unzip -q -o "$RUNNER_TEMP/candidates.zip" -d "$RUNNER_TEMP/candidates"
          test -s "$RUNNER_TEMP/candidates/clean-corpus-v4.11-neon-candidates.jsonl"

      - name: Audit cross-source identity
        run: |
          node scripts/recovery/audit-v4-11-cross-source-identity.mjs             --input "$RUNNER_TEMP/candidates/clean-corpus-v4.11-neon-candidates.jsonl"             --safe-output data/audits/rematerialized/clean-corpus-v4.11-neon-g6-safe.jsonl             --quarantine-output data/audits/rematerialized/clean-corpus-v4.11-neon-g6-quarantine.jsonl             --summary data/audits/rematerialized/clean-corpus-v4.11-g6-summary.json

      - name: Verify G6 invariants
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const s=JSON.parse(fs.readFileSync("data/audits/rematerialized/clean-corpus-v4.11-g6-summary.json","utf8"));
          if(s.input_rows!==8388) throw new Error("input_rows");
          if(s.strong_cross_source_groups!==0) throw new Error("strong collisions");
          if(s.broad_cross_source_groups!==2) throw new Error("broad groups");
          if(s.quarantined_rows!==21) throw new Error("quarantine");
          if(s.safe_rows!==8367) throw new Error("safe rows");
          if(s.approved_for_import_rows!==0) throw new Error("gate must stay closed");
          if(s.database_access!==0||s.database_writes!==0) throw new Error("DB invariant");
          console.log(JSON.stringify(s,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-g6-identity-audit
          path: |
            data/audits/rematerialized/clean-corpus-v4.11-neon-g6-safe.jsonl
            data/audits/rematerialized/clean-corpus-v4.11-neon-g6-quarantine.jsonl
            data/audits/rematerialized/clean-corpus-v4.11-g6-summary.json
          retention-days: 30
