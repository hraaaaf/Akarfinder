name: Property Type LIVE Visual Certification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/property-type-live-visual-cert.yml"

permissions:
  contents: read

jobs:
  live-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture LIVE evidence
        env:
          BASE_URL: https://akarfinder-b67j5pge6-achraf-benmoussa-s-projects.vercel.app
        run: |
          mkdir -p artifacts/property-type-live
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const findings = [];
            const scenarios = [
              {name:'riad-390', width:390, height:844, path:'/search?city=Marrakech&property_type=riad'},
              {name:'riad-430', width:430, height:932, path:'/search?city=Marrakech&property_type=riad'},
              {name:'riad-768', width:768, height:900, path:'/search?city=Marrakech&property_type=riad'},
              {name:'riad-1280', width:1280, height:900, path:'/search?city=Marrakech&property_type=riad'},
              {name:'villa-hay-riad-1280', width:1280, height:900, path:'/search?q=Villa%20Hay%20Riad'},
              {name:'terrain-pour-villa-1280', width:1280, height:900, path:'/search?q=Terrain%20pour%20villa'}
            ];
            for (const s of scenarios) {
              const page = await browser.newPage({ viewport: { width:s.width, height:s.height } });
              const bad = [];
              page.on('response', r => { if (r.status() >= 400) bad.push(`${r.status()} ${r.url()}`); });
              page.on('console', m => { if (m.type()==='error') findings.push(`${s.name}: console ${m.text()}`); });
              const res = await page.goto(process.env.BASE_URL + s.path, { waitUntil:'domcontentloaded', timeout:60000 });
              if (!res || res.status() >= 400) throw new Error(`${s.name}: navigation failed ${res && res.status()}`);
              await page.waitForTimeout(2500);
              const body = await page.locator('body').innerText();
              if (s.name.startsWith('riad-') && !/Riad/i.test(body)) throw new Error(`${s.name}: Riad label missing in DOM`);
              if (bad.length) findings.push(`${s.name}: HTTP>=400 ${bad.slice(0,10).join(' | ')}`);
              await page.screenshot({ path:`artifacts/property-type-live/${s.name}.png`, fullPage:true });
              await page.close();
            }
            fs.writeFileSync('artifacts/property-type-live/report.json', JSON.stringify({ screenshotCount: scenarios.length, findings }, null, 2));
            await browser.close();
            if (findings.length) console.log(JSON.stringify(findings, null, 2));
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: property-type-live-visual-proof
          path: artifacts/property-type-live
          if-no-files-found: error
