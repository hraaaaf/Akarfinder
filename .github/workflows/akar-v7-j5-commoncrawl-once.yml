name: Akar V7 J5 Common Crawl historical WARC (SINGLE RANGE)
on:
  pull_request:
    paths:
      - '.github/workflows/akar-v7-j5-commoncrawl-once.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  historical-warc:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/akar-v7-j5-other-portals-20261113' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require exact activation commit, never grant by PR diff alone
        run: |
          test "$(git rev-parse HEAD^2)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git log -1 --format=%s HEAD^2)" = 'J5_COMMONCRAWL_WARC_GO_20261113'
          test -f scripts/acquisition/v7_parallel/fixtures/j5_cc_8205911_index.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get EXACT one public Common Crawl WARC Range (NO portal HTTP)
        env:
          PYTHONPATH: scripts/acquisition
        run: |
          python - <<'PY'
          import json, pathlib, ssl, urllib.request, re
          from v7_parallel.j5_commoncrawl_warc_evidence import check_index, CC_PREFIX, ArchiveRejected
          index=check_index(json.loads(pathlib.Path('scripts/acquisition/v7_parallel/fixtures/j5_cc_8205911_index.json').read_text()))
          first=index['offset']; last=first+index['length']-1
          req=urllib.request.Request(CC_PREFIX+index['filename'],headers={
             'Range':f'bytes={first}-{last}','Accept-Encoding':'identity',
             'User-Agent':'Akarfinder-Historical-Archive-Validation/0.1'},method='GET')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  raise ArchiveRejected('PUBLIC_ARCHIVE_REDIRECT_NOT_ALLOWED')
          opener=urllib.request.build_opener(
              urllib.request.ProxyHandler({}),NoRedirect(),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()))
          with opener.open(req,timeout=20) as response:
              label=response.headers.get('Content-Range','')
              if response.status!=206 or not re.fullmatch(
                  rf'bytes {first}-{last}/(?:[0-9]+|\*)',label):
                  raise ArchiveRejected('PUBLIC_ARCHIVE_HTTP_RANGE_NOT_EXACT')
              data=response.read(index['length']+1)
          if len(data)!=index['length']:
              raise ArchiveRejected('PUBLIC_ARCHIVE_RANGE_BYTES_MISMATCH')
          private=pathlib.Path('.private-j5-cc');private.mkdir(mode=0o700)
          (private/'original.warc.gz').write_bytes(data)
          (private/'index.json').write_text(json.dumps(index,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'archive':'Common Crawl, never Mubawab GET',
            'archive_range_status':206,'compressed_bytes':len(data),
            'portal_requests':0,'db_writes':0}))
          PY
      - name: Strict WARC digest + original HTTP body + seven-field offline replay
        env:
          PYTHONPATH: scripts/acquisition
        run: |
          python -m pip install "beautifulsoup4==4.14.3"
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from v7_parallel.j5_commoncrawl_warc_evidence import inspect_record
          root=Path('.private-j5-cc')
          index=json.loads((root/'index.json').read_text(encoding='utf-8'))
          report,body=inspect_record((root/'original.warc.gz').read_bytes(),index)
          (root/'source.html').write_bytes(body)
          report['archive_current_activity']=False
          report['source_portal_http_requests']=0
          report['private_detail_staging']=False
          report['public_admission']=False
          try:
              from v7_multisource.detail_compare import compare_supplied_html
              replay=compare_supplied_html({'source_url':index['url'],
                'raw_html':body.decode('utf-8'), 'observation_ref':report['html_sha256']},
                as_of=datetime.fromisoformat(report['archived_at_utc'].replace('Z','+00:00')))
              report['l4_page_kind']=replay['l4_page_kind']
              report['v3_quality_status']=replay['v3_quality_status']
              report['l4_v3_7_fields_compared']=len(replay['field_comparison'])
              report['non_null_fields_both']=sum(
                 v['l4'] is not None and v['v3'] is not None
                 for v in replay['field_comparison'].values())
              report['conflicting_nonempty_fields']=replay['conflicting_nonempty_fields']
          except Exception as exc:
              report['offline_replay_error']=type(exc).__name__
              report['l4_v3_7_fields_compared']=0
          (root/'verification.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:report.get(k) for k in (
             'kind','source_offer_id','archived_at_utc','html_sha256','html_byte_count',
             'warc_sha1_payload_index_match','l4_page_kind','v3_quality_status',
             'l4_v3_7_fields_compared','non_null_fields_both','offline_replay_error',
             'source_portal_http_requests','public_admission')}))
          PY
      - name: Save historical WARC evidence for immediate PRIVATE Library transfer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akar-v7-j5-cc-8205911-private
          path: .private-j5-cc/
          retention-days: 1
          if-no-files-found: warn
