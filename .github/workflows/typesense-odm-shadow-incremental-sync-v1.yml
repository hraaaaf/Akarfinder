name: Typesense ODM Shadow Incremental Sync V1

on:
  pull_request:
    paths:
      - "lib/typesense-shadow/incremental-sync.ts"
      - "scripts/scrapers/__tests__/typesense-odm-shadow-incremental-sync-v1.test.ts"
      - ".github/workflows/typesense-odm-shadow-incremental-sync-v1.yml"

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx --test scripts/scrapers/__tests__/typesense-odm-shadow-incremental-sync-v1.test.ts
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Enforce isolated Shadow boundary
        run: |
          ! grep -R "incremental-sync" app/search app/api/search lib/search/index.ts 2>/dev/null
          ! grep -R "TYPESENSE_PUBLIC_CANARY\|SEARCH_PROVIDER.*typesense-shadow" lib/typesense-shadow/incremental-sync.ts 2>/dev/null
