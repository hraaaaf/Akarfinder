name: Search Pagination Contract Sync

on:
  push:
    branches: [agent/search-pagination-24]
    paths: [.github/workflows/search-pagination-contract-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/search-pagination-24
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Align pagination contracts and reset paths
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              p.write_text(text.replace(old, new, 1))

          once(
              'scripts/scrapers/__tests__/search-page-api-canary-query-parity-v1.test.ts',
              '  assert.equal(empty.offset, 0);',
              '  assert.equal(empty.offset, undefined);',
              'omitted offset contract',
          )
          once(
              'scripts/scrapers/__tests__/search-page-api-canary-query-parity-v1.test.ts',
              '  assert.match(page, /buildRawSearchPageQuery\\(params\\)/);',
              '  assert.match(page, /buildRawSearchPageQuery\\(pagedParams\\)/);',
              'paged SSR parser contract',
          )
          once(
              'scripts/scrapers/__tests__/search-query-intent.test.ts',
              '    assert.ok(searchPage.includes("const resolvedQuery = buildSearchPageQuery(params)"));',
              '    assert.ok(searchPage.includes("const resolvedQuery = buildSearchPageQuery(pagedParams)"));',
              'intent SSR pagination contract',
          )
          once(
              'scripts/scrapers/__tests__/search-query-intent.test.ts',
              '    assert.ok(routing.includes("return !query.district?.trim()"));',
              '    assert.ok(routing.includes("return query.offset === undefined && !query.district?.trim()"));',
              'ODM explicit offset contract',
          )
          once(
              'scripts/scrapers/__tests__/search-continuous-flow-1.test.ts',
              '    assert.ok(shell.includes("buildSearchUrl(filters, sortBy)"));',
              '    assert.ok(shell.includes("buildSearchUrl(filters, sortBy, currentPage)"));',
              'continuous flow pagination contract',
          )

          once(
              'components/search/LightZillowSearchShell.tsx',
              '''    setFilters((current) => ({\n      ...current,\n      city: current.city.toLowerCase() === city.toLowerCase() ? "all" : city,\n      neighborhood: "all",\n    }));\n''',
              '''    handleFilterChange({\n      ...filters,\n      city: filters.city.toLowerCase() === city.toLowerCase() ? "all" : city,\n      neighborhood: "all",\n    });\n''',
              'map city resets numbered page',
          )
          once(
              'components/search/LightZillowSearchShell.tsx',
              '                onClick={() => setFilters((current) => ({ ...current, ...chip.clear }))}',
              '                onClick={() => handleFilterChange({ ...filters, ...chip.clear })}',
              'chip clear resets numbered page',
          )
          PY

      - name: Targeted pagination contracts
        run: |
          node --test --experimental-strip-types scripts/scrapers/__tests__/search-page-api-canary-query-parity-v1.test.ts
          npx tsx --test scripts/scrapers/__tests__/search-query-intent.test.ts scripts/scrapers/__tests__/search-continuous-flow-1.test.ts

      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

      - name: Commit contract sync
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/search/LightZillowSearchShell.tsx scripts/scrapers/__tests__/search-page-api-canary-query-parity-v1.test.ts scripts/scrapers/__tests__/search-query-intent.test.ts scripts/scrapers/__tests__/search-continuous-flow-1.test.ts
          git commit -m 'test(search): align contracts with numbered pagination'
          git push origin HEAD:agent/search-pagination-24
