name: Announcement Page L13 Safe Closeout

on:
  push:
    branches:
      - agent/announcement-page-l13-closeout
    paths:
      - '.github/workflows/announcement-page-l13-closeout-safe.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/announcement-page-l13-closeout
          fetch-depth: 0
      - run: git show origin/main:docs/ANNOUNCEMENT_PAGE_ULTRA_PREMIUM_ROADMAP.md > docs/ANNOUNCEMENT_PAGE_ULTRA_PREMIUM_ROADMAP.md
      - run: python scripts/closeout-ann-l13-safe.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ANNOUNCEMENT_PAGE_ULTRA_PREMIUM_ROADMAP.md
          git commit -m 'docs(announcement): safely close roadmap at 100 percent'
          git push origin HEAD:agent/announcement-page-l13-closeout
