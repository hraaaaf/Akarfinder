name: DATA-4.3A Dar Agadir Canonical-Link Shadow

on:
  pull_request:
    paths:
      - "scripts/data4/daragadir-canonical-link-shadow.ts"
      - "scripts/data4/__tests__/daragadir-canonical-link-shadow.test.ts"
      - "scripts/audits/data-4-3a-daragadir-canonical-link-shadow.ts"
      - ".github/workflows/data-4-3a-daragadir-canonical-link-shadow.yml"
      - "docs/data/DATA-4-3A-DARAGADIR-CANONICAL-LINK-SHADOW.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-4-3a-daragadir-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: DATA-4.3A unit tests
        run: npx tsx --test scripts/data4/__tests__/daragadir-canonical-link-shadow.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  live-audit:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_4_3A_OUT_DIR: .tmp/data-4-3a/results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run read-only Dar Agadir shadow audit
        run: npx tsx scripts/audits/data-4-3a-daragadir-canonical-link-shadow.ts
      - name: Enforce fail-closed shadow proof
        shell: bash
        run: |
          set -euo pipefail
          test -s "${DATA_4_3A_OUT_DIR}/proof.json"
          test -s "${DATA_4_3A_OUT_DIR}/report.json"
          test -s "${DATA_4_3A_OUT_DIR}/classification.csv"
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('.tmp/data-4-3a/results/proof.json', 'utf8'));
          if (p.readOnly !== true || p.databaseWrites !== 0 || p.sourceNetworkRequests !== 0 || p.sourceDetailFetches !== 0 || p.contentReuseOperations !== 0 || p.policyChanges !== 0) throw new Error(JSON.stringify(p));
          if (p.productionActivation !== false) throw new Error(`DATA-4.3A cannot activate production: ${JSON.stringify(p)}`);
          if (p.sourceDomain !== 'daragadir.com' || p.registryRowsRead !== 1) throw new Error(`Registry/source mismatch: ${JSON.stringify(p)}`);
          const classified = Object.values(p.counts || {}).reduce((a, b) => a + Number(b), 0);
          if (classified !== p.normalizedRowsRead) throw new Error(`Row conservation failed: ${JSON.stringify(p)}`);
          if (p.eligibleShadowRows > 102) throw new Error(`Eligible shadow exceeds fresh-confirmed ceiling: ${JSON.stringify(p)}`);
          if (p.policyBlockedRows !== 0) throw new Error(`Registry boundary drifted; review required: ${JSON.stringify(p)}`);
          if (p.maxRevalidationIntervalDays !== 14) throw new Error(`Revalidation contract changed: ${JSON.stringify(p)}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: data-4-3a-daragadir-canonical-link-shadow
          path: .tmp/data-4-3a/results/
          if-no-files-found: error
          retention-days: 14
