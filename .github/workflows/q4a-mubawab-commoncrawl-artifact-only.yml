name: AkarFinder - Q4A Mubawab Common Crawl Artifact Only

on:
  push:
    branches:
      - data/q4a-minimal-search-ready
    paths:
      - 'scripts/audits/q4a-mubawab-commoncrawl-artifact-only.mjs'
      - '.github/workflows/q4a-mubawab-commoncrawl-artifact-only.yml'

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      Q4A_CC_INPUT_ROOT: .tmp/q4a-cc-artifact
      Q4A_CC_OUT: .tmp/q4a-cc-artifact-out
      Q4A_CC_LIMIT: 250
    steps:
      - uses: actions/checkout@v4
      - name: Setup inputs from frozen artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/q4a-cc-artifact/{q1d,public,dbrec,repair,dbfield,verified}
          gh api repos/${{ github.repository }}/actions/artifacts/10022063956/zip > /tmp/q1d.zip
          unzip -q /tmp/q1d.zip -d .tmp/q4a-cc-artifact/q1d
          gh api repos/${{ github.repository }}/actions/artifacts/10021998663/zip > /tmp/public.zip
          unzip -q /tmp/public.zip -d .tmp/q4a-cc-artifact/public
          gh api repos/${{ github.repository }}/actions/artifacts/10025190623/zip > /tmp/dbrec.zip
          unzip -q /tmp/dbrec.zip -d .tmp/q4a-cc-artifact/dbrec
          gh api repos/${{ github.repository }}/actions/artifacts/10026608098/zip > /tmp/repair.zip
          unzip -q /tmp/repair.zip -d .tmp/q4a-cc-artifact/repair
          gh api repos/${{ github.repository }}/actions/artifacts/10026575439/zip > /tmp/dbfield.zip
          unzip -q /tmp/dbfield.zip -d .tmp/q4a-cc-artifact/dbfield
          gh api repos/${{ github.repository }}/actions/artifacts/10028170135/zip > /tmp/verified.zip
          unzip -q /tmp/verified.zip -d .tmp/q4a-cc-artifact/verified
      - name: Recover archived Mubawab fields without Supabase
        run: node scripts/audits/q4a-mubawab-commoncrawl-artifact-only.mjs
      - name: Verify invariants
        run: |
          node - <<'NODE'
          const s=require('./.tmp/q4a-cc-artifact-out/summary.json')
          if(s.supabaseReads!==0||s.supabaseWrites!==0||s.directMubawabFetches!==0||s.commonCrawlOnly!==true) throw new Error('boundary violation')
          if(s.targets!==250) throw new Error(`expected 250 targets, got ${s.targets}`)
          console.log(s)
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: q4a-mubawab-commoncrawl-artifact-only
          path: .tmp/q4a-cc-artifact-out/
          retention-days: 30
