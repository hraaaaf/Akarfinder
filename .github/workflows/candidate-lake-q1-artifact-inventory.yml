name: AkarFinder - Candidate Lake Q1 Artifact Inventory

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audits/candidate-lake-q1-artifact-inventory.py'
      - 'scripts/audits/candidate-lake-q1-artifact-catalog.json'
      - 'scripts/audits/test_candidate_lake_q1_inventory.py'
      - '.github/workflows/candidate-lake-q1-artifact-inventory.yml'
  pull_request:
    paths:
      - 'scripts/audits/candidate-lake-q1-artifact-inventory.py'
      - 'scripts/audits/candidate-lake-q1-artifact-catalog.json'
      - 'scripts/audits/test_candidate_lake_q1_inventory.py'
      - '.github/workflows/candidate-lake-q1-artifact-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      Q1_ARTIFACT_ROOT: .tmp/q1-artifacts
      Q1_INVENTORY_OUT: .tmp/q1-artifact-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline inventory contracts
        run: python -m unittest -v scripts/audits/test_candidate_lake_q1_inventory.py
      - name: Try frozen proof artifacts; never hide missing originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$Q1_ARTIFACT_ROOT" "$Q1_INVENTORY_OUT" .tmp
          : > "$Q1_INVENTORY_OUT/download-status.tsv"
          python - <<'PY' > .tmp/q1-expected.tsv
          import json
          p='scripts/audits/candidate-lake-q1-artifact-catalog.json'
          for a in json.load(open(p, encoding='utf-8')):
              print(f"{a['id']}\t{a['slug']}")
          PY
          while IFS=$'\t' read -r id slug; do
            dir="$Q1_ARTIFACT_ROOT/${id}-${slug}"
            mkdir -p "$dir"
            zip=".tmp/${id}.zip"
            code=$(curl -sS --location --retry 1 --connect-timeout 12 --max-time 120 \
              -o "$zip" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" || true)
            if [[ "$code" == "200" ]] && unzip -tq "$zip" >/dev/null 2>&1 && unzip -q "$zip" -d "$dir"; then
              status=OK
            else
              status="HTTP_${code:-NETWORK_ERROR}"
              rm -rf "$dir"/*
            fi
            printf '%s\t%s\n' "$id" "$status" >> "$Q1_INVENTORY_OUT/download-status.tsv"
            echo "ARTIFACT $id status=$status"
            rm -f "$zip"
          done < .tmp/q1-expected.tsv
      - name: Produce honest available/missing inventory
        run: python scripts/audits/candidate-lake-q1-artifact-inventory.py
      - name: Verify read-only and no false M250K claims
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open(os.path.join(os.environ['Q1_INVENTORY_OUT'], 'inventory.json')))
          assert p['readOnly'] and not p['databaseWrites'] and not p['productionWrites']
          assert p['sourceSiteFetches'] == 0 and p['candidateUnionCertified'] is False
          assert p['availableArtifactCount'] + p['missingArtifactCount'] == p['expectedArtifactCount'] == 17
          print('Inventory only; available=', p['availableArtifactCount'], 'missing=', p['missingArtifactCount'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-lake-q1-recovery-availability
          path: .tmp/q1-artifact-inventory/
          retention-days: 90
          if-no-files-found: warn
