name: Data Ingestion Lot 7 Sandbox 1000 Gate

on:
  pull_request:
    paths:
      - "data-ingestion/sandbox-store.ts"
      - "scripts/scrapers/__tests__/data-ingestion-lot7-sandbox-1000.test.ts"
      - ".github/workflows/data-ingestion-lot7-sandbox-1000.yml"

jobs:
  sandbox-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate isolated sandbox at 1000 listings
        run: npx tsx --test scripts/scrapers/__tests__/data-ingestion-lot7-sandbox-1000.test.ts
