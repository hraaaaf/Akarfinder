name: Phase 1 P1 Visible Dedup Gate
on:
  pull_request:
    branches: [main]
    paths:
      - "lib/search/**"
      - "lib/listings/mock-listings.ts"
      - "lib/intelligence/public-serp-intelligence-carrier.ts"
      - "components/search/LightZillowSearchShell.tsx"
      - "components/layout/SiteHeader.tsx"
      - "scripts/scrapers/__tests__/phase1-p1-visible-dedup.test.ts"
      - "scripts/scrapers/__tests__/phase1-p1-visible-dedup-wiring.test.ts"
      - "scripts/scrapers/__tests__/search-truth-tier.test.ts"
      - ".github/workflows/phase1-p1-visible-dedup-gate.yml"
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  visible-dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Visible dedup contracts
        run: npx tsx --test scripts/scrapers/__tests__/phase1-p1-visible-dedup.test.ts scripts/scrapers/__tests__/phase1-p1-visible-dedup-wiring.test.ts
      - name: Search truth contracts
        run: npx tsx --test scripts/scrapers/__tests__/search-truth-tier.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build rehearsal
        run: npm run build
