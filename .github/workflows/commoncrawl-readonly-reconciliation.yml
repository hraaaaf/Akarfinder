name: AkarFinder - Common Crawl Readonly Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commoncrawl-readonly-reconciliation.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMMONCRAWL_MASS_MODE: all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Harvest current policy-authorized Common Crawl URLs only
        run: npx tsx scripts/openserp/commoncrawl-registry-mass-harvest.ts
      - name: Exact read-only reconciliation against current source_offer_seeds
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/audits/raw-results/commoncrawl-registry-mass-seeds.jsonl';
          const rows = fs.readFileSync(path,'utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          const harvested = new Map(rows.map(r => [r.canonical_url || r.url, r]));
          const base = process.env.SUPABASE_URL.replace(/\/$/,'');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const existing = new Set();
          let last = null;
          for (;;) {
            const params = new URLSearchParams({select:'canonical_url',order:'canonical_url.asc',limit:'1000'});
            if (last) params.set('canonical_url',`gt.${last}`);
            const res = await fetch(`${base}/rest/v1/source_offer_seeds?${params}`, {headers:{apikey:key,Authorization:`Bearer ${key}`}});
            if (!res.ok) throw new Error(`Supabase read ${res.status}: ${await res.text()}`);
            const page = await res.json();
            if (!page.length) break;
            for (const r of page) if (r.canonical_url) existing.add(r.canonical_url);
            last = page.at(-1).canonical_url;
            if (page.length < 1000) break;
          }
          const net = [...harvested.entries()].filter(([u]) => !existing.has(u));
          const byDomain = {};
          for (const [u,r] of net) {
            const d = r.source_domain || r.domain || new URL(u).hostname.replace(/^www\./,'');
            byDomain[d] = (byDomain[d] || 0) + 1;
          }
          const summary = {
            generated_at:new Date().toISOString(),
            zero_db_writes:true,
            harvested_unique:harvested.size,
            current_seed_unique:existing.size,
            exact_overlap:harvested.size-net.length,
            exact_net_new:net.length,
            net_new_by_domain:Object.entries(byDomain).sort((a,b)=>b[1]-a[1]),
          };
          fs.writeFileSync('data/audits/raw-results/commoncrawl-readonly-reconciliation-summary.json', JSON.stringify(summary,null,2)+'\n');
          fs.writeFileSync('data/audits/raw-results/commoncrawl-readonly-net-new.txt', net.map(([u])=>u).sort().join('\n') + (net.length?'\n':''));
          console.log(JSON.stringify(summary,null,2));
          NODE
      - name: Verify no-write proof
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('data/audits/raw-results/commoncrawl-readonly-reconciliation-summary.json','utf8'));
          if (s.zero_db_writes !== true) throw new Error('zero_db_writes invariant');
          console.log('COMMON CRAWL READONLY RECONCILIATION: PASS');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: commoncrawl-readonly-reconciliation-proof
          path: |
            data/audits/raw-results/commoncrawl-registry-mass-seeds.jsonl
            data/audits/raw-results/commoncrawl-readonly-reconciliation-summary.json
            data/audits/raw-results/commoncrawl-readonly-net-new.txt
            data/audits/raw-results/p0-1-commoncrawl-policy-projection.json
          retention-days: 30
