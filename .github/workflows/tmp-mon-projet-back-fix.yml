      - run: python scripts/tmp_mon_projet_back_fix.py
      - run: git rm scripts/tmp_mon_projet_back_fix.py .github/workflows/tmp-mon-projet-back-fix.yml
      - run: |
          git config user.name "hraaaaf"
          git config user.email "123034021+hraaaaf@users.noreply.github.com"
          git add components/companion/MonProjetWizardP1A.tsx
