name: Akar Radar10 Private Staging Tests
on:
  pull_request:
    paths:
      - 'scripts/acquisition/radar10/**'
      - 'scripts/acquisition/__tests__/test_radar10_*.py'
      - '.github/workflows/akar-radar10-private-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: radar10_ci
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d radar10_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      V646_OFFLINE_DIR: ${{ github.workspace }}/v646-pinned/scripts/pilots/mubawab-v646
      RADAR_TEST_DSN: postgresql://postgres:testpass@127.0.0.1:5432/radar10_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable V646 offline source for hermetic canary
        uses: actions/checkout@v4
        with:
          ref: 4022a9a7dd3c47391ab01246f010bdc8a6433344
          path: v646-pinned
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PostgreSQL adapter and offline fixture dependency
        run: python -m pip install "psycopg[binary]==3.3.8" beautifulsoup4
      - name: Syntax check
        run: python -m py_compile scripts/acquisition/radar10/ingest.py scripts/acquisition/radar10/run_cycle.py scripts/acquisition/__tests__/test_radar10_pipeline.py
      - name: Offline normalizer and isolated PostgreSQL transactional checks
        run: python -m unittest discover -v -s scripts/acquisition/__tests__ -p 'test_radar10_*.py'
