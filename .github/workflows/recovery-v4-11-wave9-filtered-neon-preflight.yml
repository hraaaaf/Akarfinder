name: Recovery V4.11 Wave9 Filtered Neon Preflight

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/activate-v4-11-wave9-filtered-preflight.txt"

permissions:
  contents: read
  actions: read

jobs:
  filter-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Validate target
        run: |
          python - <<'PY'
          import os,urllib.parse
          h=urllib.parse.urlparse(os.environ["DATABASE_URL"]).hostname
          if h not in {"ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech"}: raise SystemExit("unexpected host")
          PY
      - name: Download Wave9 route artifact
        run: |
          mkdir -p "$RUNNER_TEMP/w9" data/audits/v4-11-wave9-filtered
          gh api "repos/${{ github.repository }}/actions/artifacts/10936333996/zip" > "$RUNNER_TEMP/w9.zip"
          unzip -q "$RUNNER_TEMP/w9.zip" -d "$RUNNER_TEMP/w9"
          echo "5c9058b16b262c3400e679581d0973f792758d94176596dfe5b5055a5c8101e5  $RUNNER_TEMP/w9/db-ready-wave9.jsonl" | sha256sum -c -
          test "$(wc -l < "$RUNNER_TEMP/w9/db-ready-wave9.jsonl")" = "2483"
      - name: Build CSV
        run: |
          node - "$RUNNER_TEMP/w9/db-ready-wave9.jsonl" "$RUNNER_TEMP/w9/c.csv" <<'NODE'
          const fs=require("fs");const [src,out]=process.argv.slice(2);const rs=fs.readFileSync(src,"utf8").trim().split(/\r?\n/).map(JSON.parse);
          const e=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
          fs.writeFileSync(out,"listing_url,canonical_fingerprint,source_name,source_offer_key\n"+rs.map(r=>[r.listing_url,r.canonical_fingerprint,r.source_name,r.source_offer_key].map(e).join(",")).join("\n")+"\n");
          NODE
      - name: Export exact overlap union
        run: |
          cat > "$RUNNER_TEMP/w9/f.sql" <<'SQL'
          DROP TABLE IF EXISTS w9_stage_filter_20260927;
          CREATE TEMP TABLE w9_stage_filter_20260927(listing_url text,canonical_fingerprint text,source_name text,source_offer_key text);
          \copy w9_stage_filter_20260927 FROM '/w9/c.csv' WITH (FORMAT csv, HEADER true)
          CREATE TEMP TABLE e AS
          SELECT DISTINCT
            listing_url, property_listing_id,
            CASE WHEN listing_url ~* 'mubawab\.ma' THEN 'mubawab.ma' WHEN listing_url ~* 'avito\.ma' THEN 'avito.ma' END source_name,
            CASE WHEN listing_url ~* 'mubawab\.ma' THEN (regexp_match(listing_url,'/(a|pa)/([0-9]+)(/|$)'))[2]
                 WHEN listing_url ~* 'avito\.ma' THEN (regexp_match(listing_url,'_([0-9]+)\.html?$'))[1] END source_offer_key
          FROM public.listing_sources
          WHERE listing_url ~* '(mubawab\.ma|avito\.ma)';
          DROP TABLE IF EXISTS w9_bad_filter_20260927;
          CREATE TEMP TABLE w9_bad_filter_20260927 AS
          SELECT DISTINCT w.listing_url
          FROM w9_stage_filter_20260927 w
          LEFT JOIN public.listing_sources ls ON ls.listing_url=w.listing_url
          LEFT JOIN public.property_listings pl ON pl.canonical_fingerprint=w.canonical_fingerprint
          LEFT JOIN e ON e.source_name=w.source_name AND e.source_offer_key=w.source_offer_key
          WHERE ls.listing_url IS NOT NULL OR pl.canonical_fingerprint IS NOT NULL OR e.source_offer_key IS NOT NULL;
          \copy w9_bad_filter_20260927 TO '/w9/bad.csv' WITH (FORMAT csv, HEADER true)
          SELECT
            (SELECT count(*) FROM w9_stage_filter_20260927),
            (SELECT count(*) FROM w9_bad_filter_20260927),
            (SELECT count(*) FROM w9_stage_filter_20260927 JOIN public.listing_sources ls USING(listing_url)),
            (SELECT count(*) FROM w9_stage_filter_20260927 JOIN public.property_listings pl USING(canonical_fingerprint)),
            (SELECT count(*) FROM w9_stage_filter_20260927 JOIN e USING(source_name,source_offer_key)),
            (SELECT count(*) FROM public.property_listings),
            (SELECT count(*) FROM public.listing_sources);
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w9:/w9" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -f /w9/f.sql' | tee "$RUNNER_TEMP/w9/read.txt"
      - name: Filter candidate
        run: |
          node - "$RUNNER_TEMP/w9/db-ready-wave9.jsonl" "$RUNNER_TEMP/w9/bad.csv" data/audits/v4-11-wave9-filtered <<'NODE'
          const fs=require("fs"),crypto=require("crypto");const [src,bad,out]=process.argv.slice(2);
          const rows=fs.readFileSync(src,"utf8").trim().split(/\r?\n/).map(JSON.parse);
          const badUrls=new Set(fs.readFileSync(bad,"utf8").split(/\r?\n/).filter(Boolean).slice(1).map(x=>x.replace(/^"|"$/g,"").replace(/""/g,'"')));
          const kept=rows.filter(r=>!badUrls.has(r.listing_url));
          if(rows.length!==2483)throw new Error("source count");
          if(kept.length+badUrls.size!==2483)throw new Error("filter accounting");
          if(new Set(kept.map(r=>r.listing_url)).size!==kept.length)throw new Error("url dup");
          if(new Set(kept.map(r=>r.canonical_fingerprint)).size!==kept.length)throw new Error("fp dup");
          if(new Set(kept.map(r=>r.source_name+"|"+r.source_offer_key)).size!==kept.length)throw new Error("id dup");
          const body=kept.map(JSON.stringify).join("\n")+"\n";fs.writeFileSync(out+"/db-ready-wave9-filtered.jsonl",body);
          const by={};for(const r of kept)by[r.source_name]=(by[r.source_name]||0)+1;
          fs.writeFileSync(out+"/summary.json",JSON.stringify({schema_version:"akarfinder-v4.11-wave9-filtered-20260927",source_rows:2483,removed_overlap_union:badUrls.size,db_ready_rows:kept.length,by_domain:by,output_sha256:crypto.createHash("sha256").update(body).digest("hex"),database_access:"isolated_neon_read_only",database_writes:0,production_neon_writes:0,approved_for_import_rows:0,vercel_deployment:false},null,2)+"\n");
          NODE
      - name: Final zero-overlap read
        run: |
          node - data/audits/v4-11-wave9-filtered/db-ready-wave9-filtered.jsonl "$RUNNER_TEMP/w9/k.csv" <<'NODE'
          const fs=require("fs");const [src,out]=process.argv.slice(2);const rs=fs.readFileSync(src,"utf8").trim().split(/\r?\n/).filter(Boolean).map(JSON.parse);const e=v=>'"'+String(v??"").replace(/"/g,'""')+'"';fs.writeFileSync(out,"listing_url,canonical_fingerprint,source_name,source_offer_key\n"+rs.map(r=>[r.listing_url,r.canonical_fingerprint,r.source_name,r.source_offer_key].map(e).join(",")).join("\n")+"\n");
          NODE
          cat > "$RUNNER_TEMP/w9/p.sql" <<'SQL'
          DROP TABLE IF EXISTS w9_kept_filter_20260927;
          CREATE TEMP TABLE w9_kept_filter_20260927(listing_url text,canonical_fingerprint text,source_name text,source_offer_key text);
          \copy w9_kept_filter_20260927 FROM '/w9/k.csv' WITH (FORMAT csv, HEADER true)
          WITH e AS (
            SELECT DISTINCT
              CASE WHEN listing_url ~* 'mubawab\.ma' THEN 'mubawab.ma' WHEN listing_url ~* 'avito\.ma' THEN 'avito.ma' END source_name,
              CASE WHEN listing_url ~* 'mubawab\.ma' THEN (regexp_match(listing_url,'/(a|pa)/([0-9]+)(/|$)'))[2]
                   WHEN listing_url ~* 'avito\.ma' THEN (regexp_match(listing_url,'_([0-9]+)\.html?$'))[1] END source_offer_key
            FROM public.listing_sources WHERE listing_url ~* '(mubawab\.ma|avito\.ma)'
          )
          SELECT (SELECT count(*) FROM w9_kept_filter_20260927),(SELECT count(*) FROM w9_kept_filter_20260927 JOIN public.listing_sources ls USING(listing_url)),(SELECT count(*) FROM w9_kept_filter_20260927 JOIN public.property_listings pl USING(canonical_fingerprint)),(SELECT count(*) FROM w9_kept_filter_20260927 JOIN e USING(source_name,source_offer_key)),(SELECT count(*) FROM public.property_listings),(SELECT count(*) FROM public.listing_sources);
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w9:/w9" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -f /w9/p.sql' | tee data/audits/v4-11-wave9-filtered/preflight.txt
      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-wave9-filtered-preflight
          path: data/audits/v4-11-wave9-filtered/
          retention-days: 30
