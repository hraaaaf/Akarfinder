name: Property Type Semantic Correction Cert

on:
  push:
    branches:
      - agent/property-type-semantic-correction

permissions:
  contents: write

jobs:
  certify-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply semantic property type correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block missing in {path}")
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              'scripts/scrapers/types.ts',
              'export type PropertyTypeP0 = "apartment" | "villa" | "land" | "office" | "unknown";',
              'export type PropertyTypeP0 = "apartment" | "villa" | "land" | "office" | "riad" | "unknown";'
          )

          replace_exact(
              'scripts/scrapers/normalizers/normalize-type.ts',
              '''  if (/appartement|appart\\b|apartment|flat|studio|duplex/.test(s)) return "apartment";\n  if (/villa|riad|maison|house|townhouse/.test(s)) return "villa";\n  if (/terrain|land|lot\\b|parcelle|ferme|farm/.test(s)) return "land";\n  if (/bureau|local|office|plateau|commerce|magasin|shop|depot/.test(s)) return "office";\n\n  return "unknown";''',
              '''  const candidates: Array<{ type: PropertyTypeP0; index: number }> = [];\n  const patterns: Array<[PropertyTypeP0, RegExp]> = [\n    ["apartment", /appartement|appart\\b|apartment|flat|studio|duplex/],\n    ["land", /terrain|land|lot\\b|parcelle|ferme|farm/],\n    ["riad", /riad/],\n    ["villa", /villa|maison|house|townhouse/],\n    ["office", /bureau|local|office|plateau|commerce|magasin|shop|depot/],\n  ];\n\n  for (const [type, pattern] of patterns) {\n    const match = pattern.exec(s);\n    if (match?.index != null) candidates.push({ type, index: match.index });\n  }\n\n  candidates.sort((a, b) => a.index - b.index);\n  return candidates[0]?.type ?? "unknown";'''
          )

          replace_exact(
              'lib/listings/map-db-listing.ts',
              '''    case "land":\n      return "Terrain";\n    case "office":''',
              '''    case "land":\n      return "Terrain";\n    case "riad":\n      return "Riad";\n    case "office":'''
          )

          replace_exact(
              'lib/listings/db-listings.ts',
              '''    case "terrain":\n    case "land":\n      return "land";\n    case "bureau":''',
              '''    case "terrain":\n    case "land":\n      return "land";\n    case "riad":\n      return "riad";\n    case "bureau":'''
          )

          replace_exact(
              'lib/db/supabase-listings.ts',
              '''  if (n === "terrain" || n === "land") return "land";\n  if (n === "bureau" || n === "office") return "office";''',
              '''  if (n === "terrain" || n === "land") return "land";\n  if (n === "riad") return "riad";\n  if (n === "bureau" || n === "office") return "office";'''
          )

          replace_exact(
              'lib/search/database-search.ts',
              '''  if (n === "land" || n === "terrain") return "Terrain";\n  if (n === "office" || n === "bureau") return "Bureau";''',
              '''  if (n === "land" || n === "terrain") return "Terrain";\n  if (n === "riad") return "Riad";\n  if (n === "office" || n === "bureau") return "Bureau";'''
          )

          Path('scripts/scrapers/__tests__/property-type-semantic-correction.test.ts').write_text(r'''import { describe, it } from "node:test";
import assert from "node:assert/strict";

import { normalizeType } from "../normalizers/normalize-type.js";
import { mapDbRowToListing } from "../../../lib/listings/map-db-listing.js";
import type { DbListingRow } from "../../../lib/listings/db-listings.js";

function row(propertyType: string, title: string): DbListingRow {
  return {
    id: 1,
    canonical_fingerprint: "cert-property-type",
    title,
    price_mad: 1000000,
    city: "Marrakech",
    district: null,
    property_type: propertyType,
    transaction_type: "sale",
    surface_m2: 300,
    rooms_count: null,
    bedrooms_count: null,
    bathrooms_count: null,
    description_snippet: null,
    images_count: null,
    thumbnail_url: null,
    seller_name: null,
    data_completeness_score: 80,
    field_confidence: null,
    created_at: "2026-09-01T00:00:00Z",
    updated_at: "2026-09-01T00:00:00Z",
    duplicate_group_id: "cert-property-type",
    duplicate_score: 0,
    reliability_score: 80,
    reliability_badge: "Bonne",
    reliability_reasons: "[]",
    built_surface_m2: null,
    plot_surface_m2: null,
    condition: null,
    property_age_range: null,
    orientation: null,
    floor_type: null,
    floors_count: null,
    garden_m2: null,
    terrace_m2: null,
    garage_spaces: null,
    has_pool: 0,
    has_concierge: 0,
    has_moroccan_living_room: 0,
    has_european_living_room: 0,
    has_equipped_kitchen: 0,
    premium_features: null,
    source_name: "mubawab",
    listing_url: "https://example.test/listing",
    source_url: "https://example.test",
  };
}

describe("property type semantic precedence", () => {
  it("classifies the LIVE Terrain pour villa case as land", () => {
    assert.equal(normalizeType("Terrain pour villa à sonaba agadir"), "land");
  });

  it("keeps a real villa when villa is the primary title concept", () => {
    assert.equal(normalizeType("Villa à rénover en vente à Hay Riad – 741 m² terrain"), "villa");
  });

  it("classifies terrain before contextual villa mentions", () => {
    assert.equal(normalizeType("Terrain titré 12H zone permettant 4 villas maximum par hectare"), "land");
  });

  it("preserves Riad as its own property type", () => {
    assert.equal(normalizeType("Riad A vendre Guéliz 8 chambres et piscine"), "riad");
    assert.equal(normalizeType("Type de bien riad"), "riad");
    assert.equal(mapDbRowToListing(row("riad", "Riad à vendre")).property_type, "Riad");
  });
});
''')
          PY
      - name: Targeted regression tests
        run: npx tsx --test scripts/scrapers/__tests__/property-type-semantic-correction.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit certified product patch and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/property-type-semantic-correction-cert.yml
          git add scripts/scrapers/types.ts scripts/scrapers/normalizers/normalize-type.ts lib/listings/map-db-listing.ts lib/listings/db-listings.ts lib/db/supabase-listings.ts lib/search/database-search.ts scripts/scrapers/__tests__/property-type-semantic-correction.test.ts
          git commit -m "fix(search): preserve terrain and riad property types"
          git push origin HEAD:agent/property-type-semantic-correction
