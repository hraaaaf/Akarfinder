name: AkarFinder - Marwane Public Mubawab Reconcile

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audits/marwane-mubawab-public-reconcile.py'
      - '.github/workflows/marwane-mubawab-public-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    env:
      MARWANE_REPO_DIR: .tmp/marwane-public-repo
      MARWANE_OUT: .tmp/marwane-mubawab-public-reconcile
      MUB_BASELINE_IDS: .tmp/mubawab-baseline/listing-ids.txt
      MUB_REB_NET_IDS: .tmp/realestatebuddy-baseline/net-new-ids.txt
      MUB_HICHAM_NET_IDS: .tmp/hicham-baseline/mubawab-net-new-ids.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Marwane public GitHub repository archive only
        run: |
          set -euo pipefail
          mkdir -p .tmp/marwane-archive "$MARWANE_REPO_DIR"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://codeload.github.com/MarwaneMLE/morocco-appartements-price/tar.gz/refs/heads/main' \
            -o .tmp/marwane-archive/repo.tar.gz
          tar -xzf .tmp/marwane-archive/repo.tar.gz --strip-components=1 -C "$MARWANE_REPO_DIR"

      - name: Fetch certified Mubawab baseline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_artifact() {
            id="$1"; out="$2"; dir="$3"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" \
              -o "$out"
            mkdir -p "$dir"
            unzip -q "$out" -d "$dir"
          }
          fetch_artifact 9969651653 .tmp/mubawab-baseline.zip .tmp/mubawab-baseline
          fetch_artifact 9991042950 .tmp/realestatebuddy-baseline.zip .tmp/realestatebuddy-baseline
          fetch_artifact 9991207598 .tmp/hicham-baseline.zip .tmp/hicham-baseline
          test "$(wc -l < "$MUB_BASELINE_IDS")" -eq 18445
          test "$(wc -l < "$MUB_REB_NET_IDS")" -eq 21374
          test "$(wc -l < "$MUB_HICHAM_NET_IDS")" -eq 17394

      - name: Reconcile Marwane public IDs against current Mubawab union
        run: python scripts/audits/marwane-mubawab-public-reconcile.py

      - name: Verify no-write contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.tmp/marwane-mubawab-public-reconcile/summary.json'))
          assert p['readOnly'] is True
          assert p['databaseWrites'] == 0
          assert p['sourceSiteFetches'] == 0
          assert p['baselineUnionIds'] == 57213
          print(json.dumps({k:p[k] for k in ['baselineUnionIds','foundDistinctIds','exactOverlapBaselineUnion','exactNetNewVsBaselineUnion']}, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: marwane-mubawab-public-reconcile-proof
          path: .tmp/marwane-mubawab-public-reconcile/
          retention-days: 30
          if-no-files-found: error
