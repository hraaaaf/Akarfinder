name: UX-VISUAL-INVENTORY-10OF10-1 Real Photo Certification

on:
  pull_request:
    paths:
      - "lib/contextual-illustrations/rabat-real-photo-library.ts"
      - "scripts/audits/ux-visual-inventory-10of10-1.mjs"
      - "scripts/scrapers/__tests__/ux-visual-inventory-10of10-1.test.ts"
      - ".github/workflows/ux-visual-inventory-10of10-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-design-reviewer:
    name: Product Design Reviewer — Visual Inventory 10/10
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SEARCH_GATEWAY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Visual inventory + predecessor contracts
        run: npx tsx --test scripts/scrapers/__tests__/ux-visual-inventory-10of10-1.test.ts scripts/scrapers/__tests__/ux-search-visual-inventory-4.test.ts scripts/scrapers/__tests__/ux-cards-10of10-1.test.ts scripts/scrapers/__tests__/ux-results-toolbar-10of10-1.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3171 > /tmp/visual-inventory-product.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3171/search >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/visual-inventory-product.log
          exit 1
      - name: Real photographic inventory contract
        env:
          BASE_URL: http://127.0.0.1:3171
          AUDIT_VARIANT: product-design
        run: node scripts/audits/ux-visual-inventory-10of10-1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-visual-inventory-10of10-product-design-proof
          path: data/audits/ux-visual-inventory-10of10-1/product-design
          if-no-files-found: error
          retention-days: 14

  independent-release-certifier:
    name: Independent Release Certifier — Visual Inventory 10/10
    needs: product-design-reviewer
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SEARCH_GATEWAY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Independent visual inventory + predecessor contracts
        run: npx tsx --test scripts/scrapers/__tests__/ux-visual-inventory-10of10-1.test.ts scripts/scrapers/__tests__/ux-search-visual-inventory-4.test.ts scripts/scrapers/__tests__/ux-cards-10of10-1.test.ts scripts/scrapers/__tests__/ux-results-toolbar-10of10-1.test.ts
      - name: Independent TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium independently
        run: npx playwright install --with-deps chromium
      - name: Independent production build
        run: npm run build
      - name: Start independent production server
        shell: bash
        run: |
          npm run start -- -p 3172 > /tmp/visual-inventory-release.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3172/search >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/visual-inventory-release.log
          exit 1
      - name: Independently replay real photographic inventory contract
        env:
          BASE_URL: http://127.0.0.1:3172
          AUDIT_VARIANT: release-certifier
        run: node scripts/audits/ux-visual-inventory-10of10-1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-visual-inventory-10of10-release-certifier-proof
          path: data/audits/ux-visual-inventory-10of10-1/release-certifier
          if-no-files-found: error
          retention-days: 14
