name: Recovery V4.11 Controlled Neon Import Wave2

on:
  push:
    branches: ["recovery/v4-11-certified-import-wave2-20260927"]
    paths:
      - "data/recovery/v4-11-wave2-import-approval.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: recovery-v4-11-controlled-neon-import-wave2
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate approval and isolated target
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          node - <<'NODE'
          const a=require("./data/recovery/v4-11-wave2-import-approval.json");
          if(a.approved!==true) throw new Error("approval not true");
          if(a.rows!==17024) throw new Error("rows");
          if(!Number.isInteger(a.artifact_id)||a.artifact_id<=0) throw new Error("artifact id");
          if(!/^[0-9a-f]{64}$/.test(a.jsonl_sha256||"")) throw new Error("jsonl sha");
          if(a.target_project!=="ancient-violet-43534870") throw new Error("project");
          if(a.target_branch!=="br-cold-mouse-b2a50yaa") throw new Error("branch");
          if(a.target_database!=="AkarFinder") throw new Error("database");
          NODE
          python - <<'PY'
          import os, urllib.parse
          u=urllib.parse.urlparse(os.environ["DATABASE_URL"])
          allowed={
            "ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech",
          }
          if u.hostname not in allowed:
            raise SystemExit(f"refusing unexpected Neon host: {u.hostname}")
          print("isolated Neon endpoint verified")
          PY

      - name: Download approved wave2 artifact
        run: |
          set -euo pipefail
          ARTIFACT_ID="$(node -p 'require("./data/recovery/v4-11-wave2-import-approval.json").artifact_id')"
          mkdir -p "$RUNNER_TEMP/wave2"
          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/wave2.zip"
          unzip -q -o "$RUNNER_TEMP/wave2.zip" -d "$RUNNER_TEMP/wave2"
          test -s "$RUNNER_TEMP/wave2/db-ready-wave2.jsonl"
          EXPECTED_SHA="$(node -p 'require("./data/recovery/v4-11-wave2-import-approval.json").jsonl_sha256')"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/wave2/db-ready-wave2.jsonl" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$(grep -cve '^$' "$RUNNER_TEMP/wave2/db-ready-wave2.jsonl")" = "17024"

      - name: Build import CSV
        run: |
          python - "$RUNNER_TEMP/wave2/db-ready-wave2.jsonl" "$RUNNER_TEMP/wave2/import.csv" <<'PY'
          import csv,json,sys
          src,out=sys.argv[1:3]
          fields=[
            "canonical_fingerprint","title","price_mad","city","district","property_type","transaction_type",
            "surface_m2","rooms_count","bedrooms_count","bathrooms_count","description_snippet","images_count",
            "seller_name","data_completeness_score","field_confidence","source_name","listing_url","source_url",
            "first_seen_at","last_seen_at","source_offer_key","origin_type","compliance_status","content_fingerprint",
            "ingestion_run_id","displayed_price","price_currency","price_period","price_status"
          ]
          rows=[]
          with open(src,encoding="utf-8") as f:
            for line in f:
              if not line.strip(): continue
              r=json.loads(line)
              if r.get("approved_for_import") is not False:
                raise SystemExit("artifact approval invariant")
              rows.append(r)
          if len(rows)!=17024: raise SystemExit(f"expected 17024 rows, got {len(rows)}")
          with open(out,"w",newline="",encoding="utf-8") as f:
            w=csv.DictWriter(f,fieldnames=fields);w.writeheader()
            for r in rows:
              row={k:r.get(k) for k in fields}
              row["field_confidence"]=json.dumps(row["field_confidence"],ensure_ascii=False,separators=(",",":"))
              w.writerow(row)
          PY

      - name: Transactional idempotent import
        run: |
          cat > "$RUNNER_TEMP/wave2/import.sql" <<'SQL'
          BEGIN;

          CREATE TEMP TABLE stage_wave2 (
            canonical_fingerprint text NOT NULL,
            title text NOT NULL,
            price_mad integer,
            city text NOT NULL,
            district text,
            property_type text NOT NULL,
            transaction_type text NOT NULL,
            surface_m2 integer,
            rooms_count integer,
            bedrooms_count integer,
            bathrooms_count integer,
            description_snippet text,
            images_count integer,
            seller_name text,
            data_completeness_score integer,
            field_confidence jsonb,
            source_name text NOT NULL,
            listing_url text NOT NULL,
            source_url text,
            first_seen_at timestamptz,
            last_seen_at timestamptz,
            source_offer_key text,
            origin_type text,
            compliance_status text,
            content_fingerprint text,
            ingestion_run_id text,
            displayed_price numeric,
            price_currency text,
            price_period text,
            price_status text
          );

          \copy stage_wave2 FROM '/wave2/import.csv' WITH (FORMAT csv, HEADER true)

          DO $$
          BEGIN
            IF (SELECT count(*) FROM stage_wave2) <> 17024 THEN
              RAISE EXCEPTION 'stage count mismatch';
            END IF;
            IF (SELECT count(*)-count(DISTINCT listing_url) FROM stage_wave2) <> 0 THEN
              RAISE EXCEPTION 'duplicate staged URLs';
            END IF;
            IF (SELECT count(*)-count(DISTINCT canonical_fingerprint) FROM stage_wave2) <> 0 THEN
              RAISE EXCEPTION 'duplicate staged fingerprints';
            END IF;
            IF (SELECT count(*) FROM stage_wave2 WHERE title='' OR city='' OR property_type='' OR transaction_type='') <> 0 THEN
              RAISE EXCEPTION 'missing core field';
            END IF;
          END $$;

          CREATE TEMP TABLE wave2_new AS
          SELECT s.*
          FROM stage_wave2 s
          WHERE NOT EXISTS (
            SELECT 1 FROM public.listing_sources ls WHERE ls.listing_url=s.listing_url
          )
          AND NOT EXISTS (
            SELECT 1 FROM public.property_listings pl WHERE pl.canonical_fingerprint=s.canonical_fingerprint
          );

          INSERT INTO public.property_listings (
            canonical_fingerprint,title,price_mad,city,district,property_type,transaction_type,
            surface_m2,rooms_count,bedrooms_count,bathrooms_count,description_snippet,
            images_count,seller_name,data_completeness_score,field_confidence,updated_at
          )
          SELECT canonical_fingerprint,title,price_mad,city,NULLIF(district,''),property_type,transaction_type,
                 surface_m2,rooms_count,bedrooms_count,bathrooms_count,NULLIF(description_snippet,''),
                 images_count,NULLIF(seller_name,''),data_completeness_score,field_confidence,now()
          FROM wave2_new
          ON CONFLICT (canonical_fingerprint) DO NOTHING;

          INSERT INTO public.listing_sources (
            property_listing_id,source_name,listing_url,source_url,first_seen_at,last_seen_at,is_active,
            source_offer_key,origin_type,compliance_status,content_fingerprint,ingestion_run_id,
            displayed_price,price_currency,price_period,price_status
          )
          SELECT pl.id,n.source_name,n.listing_url,n.source_url,n.first_seen_at,n.last_seen_at,true,
                 n.source_offer_key,n.origin_type,n.compliance_status,n.content_fingerprint,n.ingestion_run_id,
                 n.displayed_price,n.price_currency,n.price_period,n.price_status
          FROM wave2_new n
          JOIN public.property_listings pl USING (canonical_fingerprint)
          ON CONFLICT (listing_url) DO NOTHING;

          DO $$
          DECLARE expected_new bigint;
          BEGIN
            SELECT count(*) INTO expected_new FROM wave2_new;
            IF (
              SELECT count(*)
              FROM public.listing_sources ls
              JOIN wave2_new n ON n.listing_url=ls.listing_url
              WHERE ls.ingestion_run_id='clean-corpus-v4.11-wave2'
            ) <> expected_new THEN
              RAISE EXCEPTION 'wave2 source presence mismatch';
            END IF;
            IF (
              SELECT count(*)
              FROM public.property_listings pl
              JOIN wave2_new n USING(canonical_fingerprint)
            ) <> expected_new THEN
              RAISE EXCEPTION 'wave2 property presence mismatch';
            END IF;
          END $$;

          SELECT
            (SELECT count(*) FROM stage_wave2) AS candidate_rows,
            (SELECT count(*) FROM wave2_new) AS inserted_or_present_new_rows,
            (SELECT count(*) FROM stage_wave2 s WHERE EXISTS (SELECT 1 FROM public.listing_sources ls WHERE ls.listing_url=s.listing_url AND ls.ingestion_run_id IS DISTINCT FROM 'clean-corpus-v4.11-wave2')) AS preexisting_url_rows;

          COMMIT;
          SQL

          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/wave2:/wave2" postgres:17             sh -lc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f /wave2/import.sql'

      - name: Readback
        run: |
          docker run --rm -e DATABASE_URL="$DATABASE_URL" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -c "
            SELECT
              (SELECT count(*) FROM public.property_listings),
              (SELECT count(*) FROM public.listing_sources),
              (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='"'"'clean-corpus-v4.11'"'"'),
              (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='"'"'clean-corpus-v4.11-wave2'"'"'),
              (SELECT count(*) FROM public.listing_sources ls LEFT JOIN public.property_listings pl ON pl.id=ls.property_listing_id WHERE pl.id IS NULL);
          "'
