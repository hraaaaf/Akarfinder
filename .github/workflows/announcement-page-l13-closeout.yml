name: Announcement Page L13 Closeout

on:
  push:
    branches:
      - agent/announcement-page-l13-closeout
    paths:
      - '.github/workflows/announcement-page-l13-closeout.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/announcement-page-l13-closeout
      - run: python scripts/closeout-ann-l13.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ANNOUNCEMENT_PAGE_ULTRA_PREMIUM_ROADMAP.md
          git commit -m 'docs(announcement): close roadmap at 100 percent'
          git push origin HEAD:agent/announcement-page-l13-closeout
