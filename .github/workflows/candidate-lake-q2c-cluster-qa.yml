name: AkarFinder - Q2C Cluster QA

on:
  push:
    branches: [data/q2c-cluster-qa]
    paths:
      - 'scripts/audits/candidate-lake-q2c-cluster-qa.py'
      - 'scripts/audits/candidate-lake-q2c-smoke-test.py'
      - '.github/workflows/candidate-lake-q2c-cluster-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      Q2C_Q1D_ROOT: .tmp/q2c-input/q1d
      Q2C_Q2B_ROOT: .tmp/q2c-input/q2b
      Q2C_OUT: .tmp/q2c-qa
      Q1D_ARTIFACT_ID: '10022063956'
      Q2B_ARTIFACT_ID: '10022797604'
    steps:
      - uses: actions/checkout@v4
      - name: Download certified Q1D and Q2B artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$Q2C_Q1D_ROOT" "$Q2C_Q2B_ROOT" .tmp/downloads
          download_artifact() {
            local id="$1" dest="$2" label="$3"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o ".tmp/downloads/${label}.zip"
            unzip -q ".tmp/downloads/${label}.zip" -d "$dest"
          }
          download_artifact "$Q1D_ARTIFACT_ID" "$Q2C_Q1D_ROOT" q1d
          download_artifact "$Q2B_ARTIFACT_ID" "$Q2C_Q2B_ROOT" q2b
      - name: Audit every multi-member cluster
        run: python scripts/audits/candidate-lake-q2c-cluster-qa.py
      - name: Verify Q2C invariants
        run: python scripts/audits/candidate-lake-q2c-smoke-test.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-lake-q2c-cluster-qa
          path: .tmp/q2c-qa/
          retention-days: 30
          if-no-files-found: error
