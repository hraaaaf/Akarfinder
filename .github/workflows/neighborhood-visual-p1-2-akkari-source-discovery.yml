name: Neighborhood Visual P1.2 Akkari Source Discovery

on:
  pull_request:
    paths:
      - ".github/workflows/neighborhood-visual-p1-2-akkari-source-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

# Temporary source-discovery gate. Removed once P1.2 sources are locked.
jobs:
  kartaview-akkari:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Discover reusable KartaView street imagery at Akkari
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/audits/neighborhood-visual-p1-2-akkari/kartaview"
          mkdir -p "$OUT/images"
          python3 - <<'PY'
          import hashlib, json, math, pathlib, urllib.request

          OUT = pathlib.Path("data/audits/neighborhood-visual-p1-2-akkari/kartaview")
          IMG = OUT / "images"
          CENTER = (34.00890, -6.86252)
          API = (
              "https://api.openstreetcam.org/2.0/photo/"
              f"?lat={CENTER[0]}&lng={CENTER[1]}&zoomLevel=17"
              "&join=sequence&orderBy=id&orderDirection=desc"
          )
          UA = "AkarFinder-P1.2-source-audit/1.0"

          req = urllib.request.Request(API, headers={"User-Agent": UA, "Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=45) as r:
              raw = json.load(r)
          (OUT / "raw.json").write_text(json.dumps(raw, ensure_ascii=False, indent=2), encoding="utf-8")

          def fnum(v):
              try: return float(v)
              except Exception: return None

          def hav(lat1, lon1, lat2, lon2):
              R=6371000.0
              p1,p2=math.radians(lat1),math.radians(lat2)
              dp=math.radians(lat2-lat1); dl=math.radians(lon2-lon1)
              a=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(math.sqrt(a))

          data = raw.get("result", {}).get("data", [])
          rows=[]
          for d in data:
              lat=fnum(d.get("lat")); lon=fnum(d.get("lng"))
              if lat is None or lon is None:
                  continue
              urls=[]
              for k in ("fileurlLTh","fileurlProc","fileurlTh","imageLthUrl","imageProcUrl","imageThUrl"):
                  v=d.get(k)
                  if isinstance(v,str) and v.startswith("http"):
                      urls.append(v)
              seq=d.get("sequence") or {}
              rows.append({
                  "id": d.get("id"), "lat": lat, "lng": lon,
                  "distance_m": round(hav(CENTER[0],CENTER[1],lat,lon),1),
                  "heading": d.get("heading"),
                  "date": d.get("dateAdded"),
                  "sequence_id": seq.get("id"),
                  "sequence_address": seq.get("address"),
                  "width": d.get("width"), "height": d.get("height"),
                  "urls": list(dict.fromkeys(urls)),
              })

          rows.sort(key=lambda x:x["distance_m"])
          downloaded=0
          for r in rows:
              if downloaded>=12 or r["distance_m"]>1200 or not r["urls"]:
                  continue
              # Prefer the large thumbnail URL; it is a deterministic rendition of the real KartaView frame.
              url=r["urls"][0]
              try:
                  req=urllib.request.Request(url, headers={"User-Agent":UA})
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      b=resp.read()
                  if len(b)<5000:
                      continue
                  p=IMG/f"{downloaded+1:02d}_{round(r['distance_m']):04d}m_{r['id']}.jpg"
                  p.write_bytes(b)
                  r["downloaded_file"]=p.name
                  r["sha1"]=hashlib.sha1(b).hexdigest()
                  r["bytes"]=len(b)
                  downloaded+=1
              except Exception as e:
                  r["download_error"]=str(e)

          (OUT / "candidates.json").write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding="utf-8")
          lines=[
              "# KartaView Akkari source discovery",
              "",
              "License: CC BY-SA 4.0 per KartaView Terms; attribution required.",
              f"Center: {CENTER[0]}, {CENTER[1]}",
              f"Candidates: {len(rows)} · downloaded: {downloaded}",
              "",
              "| # | Distance | Photo ID | Sequence | Date | Heading | Address | File |",
              "|---:|---:|---|---|---|---:|---|---|",
          ]
          for i,r in enumerate(rows[:50],1):
              lines.append(f"| {i} | {r['distance_m']} m | {r['id']} | {r['sequence_id']} | {r['date']} | {r['heading']} | {r['sequence_address']} | {r.get('downloaded_file','')} |")
          (OUT / "candidates.md").write_text("\n".join(lines)+"\n", encoding="utf-8")
          print(f"AKKARI_KARTAVIEW candidates={len(rows)} downloaded={downloaded}")
          for r in rows[:20]:
              print(r["distance_m"], r["id"], r.get("sequence_address"), r.get("downloaded_file"), r.get("sha1"), r.get("download_error"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neighborhood-visual-p1-2-akkari-kartaview
          path: data/audits/neighborhood-visual-p1-2-akkari/kartaview
          if-no-files-found: error
          retention-days: 7
