name: MarocImmo Recovery Benchmark

on:
  push:
    branches: [data/neon-price-recovery-audit]
    paths:
      - 'scripts/data/marocimmo-recovery-benchmark.mjs'
      - '.github/workflows/marocimmo-recovery-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      SAMPLE_SIZE: '120'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify read connection
        run: test -n "$DATABASE_URL"
      - name: Run bounded MarocImmo recovery benchmark
        run: node scripts/data/marocimmo-recovery-benchmark.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: marocimmo-recovery-benchmark
          path: |
            marocimmo-recovery-benchmark.json
            marocimmo-recovery-benchmark.jsonl
          retention-days: 14
