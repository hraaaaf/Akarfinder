name: Neon production deploy
on:
  push:
    branches: [release/neon-recovery-live-20260928]
    paths: [.github/workflows/neon-prod-promote.yml]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy checked-out exact HEAD to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="achraf-benmoussa-s-projects"
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope="achraf-benmoussa-s-projects")
          echo "DEPLOYMENT_URL=$url"
