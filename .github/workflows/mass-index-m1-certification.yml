name: MASS-INDEX M1 Certification

on:
  push:
    branches:
      - data/mass-index-m0-current
    paths:
      - scripts/data-mass/universal-candidate-promotion.ts
      - scripts/data-mass/universal-candidate-promotion-live.ts
      - scripts/data-mass/__tests__/universal-candidate-promotion.test.ts
      - .github/workflows/mass-index-m1-certification.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mass-index-m1-certification
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout M1 head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run targeted M1 unit tests
        run: npx tsx --test scripts/data-mass/__tests__/universal-candidate-promotion.test.ts

      - name: Assert read-only Supabase credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY secret missing"; exit 1; }

      - name: Build live M1 manifest — read only
        run: npx tsx scripts/data-mass/universal-candidate-promotion-live.ts

      - name: Extract certification summary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const input = 'artifacts/mass-index/m1-universal-candidate-promotion.json';
          const payload = JSON.parse(fs.readFileSync(input, 'utf8'));
          const summary = {
            schemaVersion: payload.schemaVersion,
            mode: payload.mode,
            summary: payload.summary,
            invariants: payload.invariants,
          };
          fs.writeFileSync('artifacts/mass-index/m1-certification-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Assert M1 invariants
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('artifacts/mass-index/m1-certification-summary.json', 'utf8'));
          if (p.mode !== 'read_only') throw new Error('M1_NOT_READ_ONLY');
          if (p.invariants.databaseWrites !== 0) throw new Error('M1_DB_WRITE_INVARIANT');
          if (p.invariants.sourceNetworkRequests !== 0) throw new Error('M1_SOURCE_NETWORK_INVARIANT');
          if (p.invariants.providersRelabeled !== 0) throw new Error('M1_PROVIDER_RELABEL_INVARIANT');
          if (p.invariants.richContentRequired !== false) throw new Error('M1_RICH_CONTENT_INVARIANT');
          if (p.summary.rawRows <= 0 || p.summary.canonicalUrls <= 0) throw new Error('M1_EMPTY_MANIFEST');
          if (p.summary.acceptedCanonicalUrls + p.summary.rejectedCanonicalUrls !== p.summary.canonicalUrls) {
            throw new Error('M1_ACCOUNTING_MISMATCH');
          }
          console.log('M1 invariants PASS');
          NODE

      - name: Upload M1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-index-m1-certification
          path: |
            artifacts/mass-index/m1-certification-summary.json
            artifacts/mass-index/m1-universal-candidate-promotion.json
          if-no-files-found: warn
          retention-days: 14
