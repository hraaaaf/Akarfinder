name: ODM-09D Apply Search UI Cursor Patch

on:
  push:
    branches:
      - odm-09d-search-ui-cursor

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: odm-09d-search-ui-cursor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply asserted ODM-09D patch
        run: node scripts/odm-09d-apply.mjs
      - name: Commit patched component
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/search/LightZillowSearchShell.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(odm-09d): paginate public index in search UI"
          git push origin HEAD:odm-09d-search-ui-cursor
