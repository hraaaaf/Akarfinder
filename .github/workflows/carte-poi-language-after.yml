name: Carte LOT H POI AFTER

on:
  pull_request:
    paths:
      - "components/map/MapLibreNeighborhood3D.tsx"
      - "app/map/quartier-target-couche3.css"
      - "scripts/audits/carte-poi-language-after.mjs"
      - ".github/workflows/carte-poi-language-after.yml"

permissions:
  contents: read

jobs:
  capture-poi-after:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:3213
      AUDIT_OUTPUT_DIR: data/audits/carte-poi-language-after
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3213 > /tmp/carte-poi-after.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3213/map?city=casablanca&district=maarif&layer=explore' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/carte-poi-after.log
          exit 1
      - name: Capture POI language AFTER
        run: node scripts/audits/carte-poi-language-after.mjs
      - name: Upload POI AFTER
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carte-poi-language-after-${{ github.run_id }}
          path: data/audits/carte-poi-language-after
          if-no-files-found: error
          retention-days: 30
