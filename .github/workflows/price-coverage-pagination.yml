name: SEARCH Price Coverage Pagination

on:
  pull_request:
    paths:
      - 'scripts/scrapers/price-coverage-pagination-audit.ts'
      - 'scripts/scrapers/__tests__/price-coverage-pagination-audit.test.ts'
      - '.github/workflows/price-coverage-pagination.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx --test scripts/scrapers/__tests__/price-coverage-pagination-audit.test.ts
      - run: npx tsc --noEmit

  production-read-only:
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      THIRD_PARTY_DB_INGESTION_ENABLED: 'true'
      PRICE_PAGINATION_WRITE: 'false'
      PRICE_PAGINATION_PAGE_SIZE: '120'
      PRICE_PAGINATION_PAGES: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify production read credentials
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Audit paginated Mubawab and Masaken null-price cohorts
        run: npx tsx scripts/scrapers/price-coverage-pagination-audit.ts
