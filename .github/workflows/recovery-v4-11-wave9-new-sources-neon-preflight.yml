name: Recovery V4.11 Wave9 New Sources Neon Preflight
on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths: ["data/recovery/activate-v4-11-wave9-new-sources-neon-preflight.txt"]
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Validate target
        run: |
          python - <<'PY'
          import os,urllib.parse
          h=urllib.parse.urlparse(os.environ["DATABASE_URL"]).hostname
          if h not in {"ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech"}: raise SystemExit("unexpected host")
          PY
      - name: Download certified artifact
        run: |
          mkdir -p "$RUNNER_TEMP/w9n" data/audits/v4-11-wave9-new-sources-neon
          gh api "repos/${{ github.repository }}/actions/artifacts/10936523776/zip" > "$RUNNER_TEMP/w9n.zip"
          unzip -q "$RUNNER_TEMP/w9n.zip" -d "$RUNNER_TEMP/w9n"
          echo "50284d46c71ece06c6837ae6c37691dd2e18f91fa027a127739ff4cca6d29475  $RUNNER_TEMP/w9n/db-ready-wave9-new-sources.jsonl" | sha256sum -c -
          test "$(wc -l < "$RUNNER_TEMP/w9n/db-ready-wave9-new-sources.jsonl")" = "1287"
      - name: Build CSV
        run: |
          node - "$RUNNER_TEMP/w9n/db-ready-wave9-new-sources.jsonl" "$RUNNER_TEMP/w9n/c.csv" <<'NODE'
          const fs=require("fs");const [src,out]=process.argv.slice(2);const rs=fs.readFileSync(src,"utf8").trim().split(/\r?\n/).map(JSON.parse);const e=v=>'"'+String(v??"").replace(/"/g,'""')+'"';fs.writeFileSync(out,"listing_url,canonical_fingerprint,source_name,source_offer_key\n"+rs.map(r=>[r.listing_url,r.canonical_fingerprint,r.source_name,r.source_offer_key].map(e).join(",")).join("\n")+"\n");
          NODE
      - name: Isolated Neon read-only overlap check
        run: |
          cat > "$RUNNER_TEMP/w9n/p.sql" <<'SQL'
          DROP TABLE IF EXISTS w9_newsrc_pf_20260927;
          CREATE TEMP TABLE w9_newsrc_pf_20260927(listing_url text,canonical_fingerprint text,source_name text,source_offer_key text);
          \copy w9_newsrc_pf_20260927 FROM '/w9n/c.csv' WITH (FORMAT csv, HEADER true)
          SELECT
            (SELECT count(*) FROM w9_newsrc_pf_20260927),
            (SELECT count(*) FROM w9_newsrc_pf_20260927 c JOIN public.listing_sources ls ON ls.listing_url=c.listing_url),
            (SELECT count(*) FROM w9_newsrc_pf_20260927 c JOIN public.property_listings pl ON pl.canonical_fingerprint=c.canonical_fingerprint),
            (SELECT count(*) FROM w9_newsrc_pf_20260927 c JOIN public.listing_sources ls ON ls.source_name=c.source_name AND ls.source_offer_key=c.source_offer_key),
            (SELECT count(*) FROM public.property_listings),
            (SELECT count(*) FROM public.listing_sources);
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w9n:/w9n" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -f /w9n/p.sql' | tee data/audits/v4-11-wave9-new-sources-neon/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-wave9-new-sources-neon-preflight
          path: data/audits/v4-11-wave9-new-sources-neon/
          retention-days: 30
