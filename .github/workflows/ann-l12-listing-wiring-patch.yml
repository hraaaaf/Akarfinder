name: ANN-L12 Listing Wiring Patch

on:
  push:
    branches:
      - agent/announcement-page-l12-mon-projet-personalise
    paths:
      - ".github/workflows/ann-l12-listing-wiring-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/announcement-page-l12-mon-projet-personalise
      - name: Wire project personalization into listing shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 occurrence, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "app/listings/[id]/page.tsx",
              'type ListingDetailPageProps = {\n  params: Promise<{ id: string }>;\n};',
              'type ListingDetailPageProps = {\n  params: Promise<{ id: string }>;\n  searchParams?: Promise<Record<string, string | string[] | undefined>>;\n};\n\nfunction validProjectId(value: string | string[] | undefined): string | null {\n  const raw = Array.isArray(value) ? value[0] : value;\n  return typeof raw === "string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(raw) ? raw : null;\n}',
          )
          replace_once(
              "app/listings/[id]/page.tsx",
              'async function renderListing(\n  listing: Listing,\n  detail: NonNullable<ReturnType<typeof buildPublicPropertyDetailV2>>,\n) {',
              'async function renderListing(\n  listing: Listing,\n  detail: NonNullable<ReturnType<typeof buildPublicPropertyDetailV2>>,\n  projectId: string | null,\n) {',
          )
          replace_once(
              "app/listings/[id]/page.tsx",
              '      akarEstimateHistory={akarEstimateHistory}\n    />',
              '      akarEstimateHistory={akarEstimateHistory}\n      projectId={projectId}\n    />',
          )
          replace_once(
              "app/listings/[id]/page.tsx",
              'export default async function ListingDetailPage({ params }: ListingDetailPageProps) {\n  const { id } = await params;',
              'export default async function ListingDetailPage({ params, searchParams }: ListingDetailPageProps) {\n  const { id } = await params;\n  const resolvedSearchParams = searchParams ? await searchParams : {};\n  const projectId = validProjectId(resolvedSearchParams.project_id);',
          )
          replace_once(
              "app/listings/[id]/page.tsx",
              '      return await renderListing(ownerListing, ownerDetail);',
              '      return await renderListing(ownerListing, ownerDetail, projectId);',
          )
          replace_once(
              "app/listings/[id]/page.tsx",
              '    return await renderListing(listing, detail);',
              '    return await renderListing(listing, detail, projectId);',
          )

          replace_once(
              "components/listings/AnnouncementPageShell.tsx",
              '  visualQa = false,\n}: {',
              '  visualQa = false,\n  projectId = null,\n}: {',
          )
          replace_once(
              "components/listings/AnnouncementPageShell.tsx",
              '  visualQa?: boolean;\n}) {',
              '  visualQa?: boolean;\n  projectId?: string | null;\n}) {',
          )
          replace_once(
              "components/listings/AnnouncementPageShell.tsx",
              '            proConversion={proConversion}\n            mapStyleUrl={mapStyleUrl}',
              '            proConversion={proConversion}\n            projectId={projectId}\n            mapStyleUrl={mapStyleUrl}',
          )

          replace_once(
              "components/listings/PropertyDetailV2.tsx",
              'import { ProfessionalConversionCard } from "@/components/listings/ProfessionalConversionCard";',
              'import { ProfessionalConversionCard } from "@/components/listings/ProfessionalConversionCard";\nimport { ProjectPersonalizationCard } from "@/components/listings/ProjectPersonalizationCard";',
          )
          replace_once(
              "components/listings/PropertyDetailV2.tsx",
              '  proConversion,\n  mapStyleUrl = null,',
              '  proConversion,\n  projectId = null,\n  mapStyleUrl = null,',
          )
          replace_once(
              "components/listings/PropertyDetailV2.tsx",
              '  proConversion: ProConversionModel;\n  mapStyleUrl?: string | null;',
              '  proConversion: ProConversionModel;\n  projectId?: string | null;\n  mapStyleUrl?: string | null;',
          )
          replace_once(
              "components/listings/PropertyDetailV2.tsx",
              '          <div className="mt-6">\n            <AkarInsightCard detail={detail} />\n          </div>\n\n          <div className="mt-4 lg:hidden">',
              '          <div className="mt-6">\n            <AkarInsightCard detail={detail} />\n          </div>\n\n          <ProjectPersonalizationCard listing={listing} projectId={projectId} />\n\n          <div className="mt-4 lg:hidden">',
          )
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ann-l12-listing-wiring-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/listings/[id]/page.tsx' components/listings/AnnouncementPageShell.tsx components/listings/PropertyDetailV2.tsx .github/workflows/ann-l12-listing-wiring-patch.yml
          git commit -m "feat(ann-l12): wire explicit project personalization into listing"
          git push origin HEAD:agent/announcement-page-l12-mon-projet-personalise
