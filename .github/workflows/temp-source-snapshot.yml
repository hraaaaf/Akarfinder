name: Apply Search Commercial Priority

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/search-commercial-priority-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/search-commercial-priority-v1
          fetch-depth: 0
      - name: Apply reviewed source changes
        shell: bash
        run: |
          cat > /tmp/search-commercial-priority.b64 <<'ARCHIVE'
          [... ELLIPSIZATION ...]
          ARCHIVE
          base64 --decode /tmp/search-commercial-priority.b64 > /tmp/search-commercial-priority.tar.gz
          tar -xzf /tmp/search-commercial-priority.tar.gz -C "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components lib scripts
          if git diff --cached --quiet; then
            echo "Source changes already applied"
            exit 0
          fi
          git commit -m "feat(search): enforce commercial listing priority"
          git push origin HEAD:feat/search-commercial-priority-v1
