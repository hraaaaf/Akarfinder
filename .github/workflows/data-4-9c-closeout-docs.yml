name: DATA-4.9C Closeout Canonical Docs

on:
  push:
    branches:
      - data/data-4-9c-source-policy-decision-registry-assignment
    paths:
      - ".github/workflows/data-4-9c-closeout-docs.yml"

permissions:
  contents: write

jobs:
  closeout-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/data-4-9c-source-policy-decision-registry-assignment
          fetch-depth: 0
      - name: Patch DATA handover blocks only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_block(path, start, end, block):
              p = Path(path)
              text = p.read_text()
              a = text.index(start)
              b = text.index(end, a) + len(end)
              p.write_text(text[:a] + block.strip() + text[b:])

          readme = r'''
          <!-- DATA-4.7B-CURRENT-START -->
          ## État DATA courant — 2026-08-10

          La lane DATA distingue strictement **capacité technique**, **représentations URL détail**, **biens uniques**, **permission Source Registry**, **ingestion** et **publication Search**.

          - **DATA-4.9A ✅ PR #444** — merge `18be46c7349e8a56b2b68b56005d79f85e125675` : jusqu'à **11 480 identités sitemap net-new brutes**, jamais assimilées à des annonces.
          - **DATA-4.9B ✅ PR #452** — merge `45631345a6efb653256273354d2fb903b33c1ff9` : exact-head final **10 127 URL identities → 2 326 structural-detail candidate URL representations + 7 801 rejets**, 0 collision, 0 mutation. **2 326 ≠ 2 326 biens uniques.**
          - **DATA-4.9C 🟠 PR #454** — Source Policy Decision & Registry Assignment.
          - Pre-write exact-head `78bbcbcd40cbbabb7a46769c8239b58b94aa3682`, run `31371504161` PASS, artefact rollback/plan `sha256:07529455c3438f2e6b51461c4f1babce7f80a18ef55fd1ef0b3d83e5657637aa` : **1 plan CAS restrictif Agadir + 1 rollback**, 5 sources `remain_unverified`, 0 authorization.
          - Mutation production CAS appliquée **1/1** : `agadirimmobilier.ma` → `permission_required` pour réutilisation contenu + detail fetch, tout en restant `hidden + internal_signal_only`, `current_representation_count=0`.
          - Motif : les CGU officielles Agadir vérifiées imposent un usage personnel/non-commercial et exigent un accord écrit préalable pour la reproduction/diffusion/exploitation non autorisée ; robots/sitemap ne remplace jamais cette permission.
          - Post-apply head `d61e23bf7908d8be14dac718d87603ec9c8e3bb9`, run `31372192768` PASS, artefact `sha256:679b2f55bacebac0652bc84f4646e5530df1c53d9e3ebcebfadc7a44d9e942af` : Agadir `ALREADY_APPLIED_RESTRICTIVE`, 5 sources `NO_MUTATION`, **12/12 preuves officielles relues sans failure**, 0 write CI, 0 ingestion/display/seed activation.
          - Registry final : Agadir = `permission_required`; Val Foncier, Christie's Morocco, Immo Maroc, ProImmobilier, Capital Properties = `unverified`; **0 source `limited_public_facts` / `authorized_partner`**.

          **Décision : DATA-4.9D ingestion canary = BLOCKED_BY_POLICY.** Aucun canary d'ingestion de ces sources ne doit être ouvert tant qu'une source n'obtient pas une autorisation exploitable.

          **Prochain LOT masse : DATA-4.10A — Authorization Conversion & Partner Feed Readiness**, read-only : transformer les gagnants structurels en dossiers de permission/partenariat concrets (impact potentiel, contact officiel, proposition de mode link+facts/feed, exigences de provenance/dédup, critères d'acceptation) sans scraper davantage et sans envoyer de message automatiquement.
          <!-- DATA-4.7B-CURRENT-END -->
          '''

          roadmap = r'''
          <!-- DATA-4.7B-CURRENT-START -->
          # 0. État DATA prioritaire — permission avant ingestion 2026-08-10

          > Ce bloc prévaut sur les anciennes mentions DATA plus bas lorsqu'elles désignent un prochain LOT désormais dépassé.

          **North Star : augmenter l'inventaire Search réellement admissible. Une URL techniquement accessible mais non autorisée ne constitue pas de la masse exploitable.**

          - **DATA-4.9A ✅ #444** — merge `18be46c7349e8a56b2b68b56005d79f85e125675` ; jusqu'à 11 480 identités sitemap brutes.
          - **DATA-4.9B ✅ #452** — merge `45631345a6efb653256273354d2fb903b33c1ff9` ; exact-head final **2 326 structural-detail URL representations**, pas biens uniques, 0 mutation.
          - **DATA-4.9C 🟠 #454** — décision policy sur 6 gagnants structurels.

          ## DATA-4.9C — résultat policy certifié

          Pre-write :
          - head `78bbcbcd40cbbabb7a46769c8239b58b94aa3682` ; run `31371504161` PASS ; artefact `sha256:07529455c3438f2e6b51461c4f1babce7f80a18ef55fd1ef0b3d83e5657637aa` ;
          - 1 mutation Registry restrictive planifiée : `agadirimmobilier.ma` ;
          - before/after + CAS exact + rollback certifié ;
          - 5 autres sources `remain_unverified` ; 0 `authorized`, 0 `prohibited`.

          Production :
          - CAS Agadir **1/1** appliqué sans drift ;
          - `authorization_status=permission_required` ; `terms_status=permission_required` ; `content_reuse_policy=permission_required` ; `detail_fetch_policy=permission_required` ;
          - `machine_gate=internal_signal_only` ; `ingestion_gate=internal_signal_only` ; `display_gate=hidden` ; `display_policy=internal_signal_only` ;
          - `current_representation_count=0` ; no-bypass conservé ;
          - 5 autres sources inchangées `unverified + hidden + internal_signal_only`.

          Post-apply :
          - head `d61e23bf7908d8be14dac718d87603ec9c8e3bb9` ; run `31372192768` PASS ; artefact `sha256:679b2f55bacebac0652bc84f4646e5530df1c53d9e3ebcebfadc7a44d9e942af` ;
          - Agadir = `ALREADY_APPLIED_RESTRICTIVE` ; 5 sources = `NO_MUTATION` ; 12 preuves officielles observées, 0 failure ;
          - CI = 0 Registry write / 0 seed write / 0 detail listing fetch / 0 ingestion / 0 public display.

          **Registry final : 0 source `limited_public_facts`, 0 `authorized_partner`.**

          ## DATA-4.9D — BLOCKED_BY_POLICY

          Ne pas ouvrir de canary d'ingestion : aucun gagnant 4.9B n'a reçu une autorisation exploitable. Le fait d'avoir **2 326 URL reps détail structurelles** ne change pas ce verdict.

          ## Prochain LOT DATA — DATA-4.10A Authorization Conversion & Partner Feed Readiness

          Strictement read-only / préparation de permission, sans nouveau scraping de contenu.

          1. classer les sources par upside structurel : Val Foncier 709 URL reps, Christie's 602, Capital 603 non bloquant, Immo Maroc 276, ProImmobilier 99, AgadirImmobilier.ma 37 ;
          2. recenser uniquement les canaux de contact officiels et les éventuels dispositifs pro/feed/API/partenariat ;
          3. préparer pour chaque source une proposition minimale : canonical link + faits publics strictement bornés, ou feed partenaire/API si disponible ;
          4. expliciter provenance, cadence, suppression, dédup, no-cache/no-detail-fetch selon le mode demandé ;
          5. définir le statut de sortie : `READY_FOR_PERMISSION_OUTREACH`, `PARTNER_FEED_PATH_FOUND`, `NO_CONTACT_PATH`, `DO_NOT_PURSUE` ;
          6. 0 email/message envoyé automatiquement ; 0 mutation Registry ; 0 ingestion ; 0 display activation.

          **Après autorisation réelle seulement :** un nouveau lot distinct concevra le canary ingestion/partner-feed avec rollback et certification.
          <!-- DATA-4.7B-CURRENT-END -->
          '''

          session = r'''
          <!-- DATA-CURRENT-START -->
          ## DATA — vérité courante

          - DATA-4.9B ✅ PR #452 — merge `45631345a6efb653256273354d2fb903b33c1ff9` ; **2 326 structural-detail URL reps**, pas biens uniques.
          - DATA-4.9C 🟠 PR #454 — policy decision / Registry assignment.
          - Pre-write : head `78bbcbcd40cbbabb7a46769c8239b58b94aa3682`, run `31371504161` PASS, rollback-plan artefact `sha256:07529455c3438f2e6b51461c4f1babce7f80a18ef55fd1ef0b3d83e5657637aa`.
          - Mutation CAS production : **1/1 Agadir** → `permission_required`; hidden/internal-only inchangé ; 0 representation active.
          - Post-apply : head `d61e23bf7908d8be14dac718d87603ec9c8e3bb9`, run `31372192768` PASS, artefact `sha256:679b2f55bacebac0652bc84f4646e5530df1c53d9e3ebcebfadc7a44d9e942af`.
          - Post-proof : Agadir `ALREADY_APPLIED_RESTRICTIVE`; Val Foncier / Christie's / Immo Maroc / ProImmobilier / Capital = `NO_MUTATION` et restent `unverified`.
          - 12/12 preuves officielles relues sans failure ; 0 CI write ; 0 seed/detail-fetch/ingestion/display activation.
          - Registry final : **1 permission_required + 5 unverified + 0 authorized** ; aucune source `limited_public_facts` / `authorized_partner`.

          **DATA-4.9D = BLOCKED_BY_POLICY.** Aucun canary ingestion ne doit être ouvert sur cette cohorte.

          **Prochain LOT : DATA-4.10A — Authorization Conversion & Partner Feed Readiness**, read-only : produire les dossiers de permission/partenariat et chemins feed/API officiels des sources à plus fort upside, sans envoi automatique et sans ingestion.
          <!-- DATA-CURRENT-END -->
          '''

          replace_block('README.md', '<!-- DATA-4.7B-CURRENT-START -->', '<!-- DATA-4.7B-CURRENT-END -->', readme)
          replace_block('docs/ROADMAP.md', '<!-- DATA-4.7B-CURRENT-START -->', '<!-- DATA-4.7B-CURRENT-END -->', roadmap)
          replace_block('docs/SESSION.md', '<!-- DATA-CURRENT-START -->', '<!-- DATA-CURRENT-END -->', session)
          PY
      - name: Commit canonical DATA closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md
          git commit -m "DATA-4.9C: record restrictive policy decision and block ingestion canary"
          git push origin HEAD:data/data-4-9c-source-policy-decision-registry-assignment
