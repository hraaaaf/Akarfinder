name: ODM Canary Dual Read 01

on:
  pull_request:
    paths:
      - "app/api/search/route.ts"
      - "lib/odm/odm-public-routing.ts"
      - "lib/odm/odm-dual-read-runner.ts"
      - "lib/odm/odm-dual-read-shadow.ts"
      - "lib/odm/odm-shadow-telemetry-store.ts"
      - "supabase/migrations/20260730150000_odm_shadow_comparison_truthfulness_v1.sql"
      - "scripts/scrapers/__tests__/odm-canary-dual-read-01.test.ts"
      - "scripts/scrapers/__tests__/odm-shadow-telemetry-store-01.test.ts"
      - "scripts/scrapers/__tests__/odm-divergence-analyzer-01.test.ts"
      - ".github/workflows/odm-canary-dual-read-01.yml"
      - "docs/odm/ODM-CANARY-DUAL-READ-01.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dual-read-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run dual-read contracts
        run: |
          npx tsx --test scripts/scrapers/__tests__/odm-canary-dual-read-01.test.ts
          npx tsx --test scripts/scrapers/__tests__/odm-shadow-telemetry-store-01.test.ts
          npx tsx --test scripts/scrapers/__tests__/odm-divergence-analyzer-01.test.ts
      - name: Compile production application
        run: npm run build
        env:
          ODM_DUAL_READ_ENABLED: "false"
          ODM_DUAL_READ_SAMPLE_PERCENT: "0"
      - name: Enforce non-blocking dual-read boundary
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const route = fs.readFileSync('app/api/search/route.ts', 'utf8');
          const router = fs.readFileSync('lib/odm/odm-public-routing.ts', 'utf8');
          if (!route.includes('const routed = await routePublicSearch')) throw new Error('shared public routing boundary missing');
          if (!route.includes('if (routed.lane === "legacy_primary")')) throw new Error('shadow must be restricted to the legacy primary lane');
          if (!route.includes('scheduleOdmDualReadShadow(query, routed.result)')) throw new Error('legacy primary shadow scheduling missing');
          if (!route.includes('after(async () =>')) throw new Error('ODM comparison must execute after the public response');
          if (!route.includes('return NextResponse.json(routed.result)')) throw new Error('public response must come from the routing result');
          if (router.includes('runOdmDualReadShadow')) throw new Error('dual-read shadow must not participate in the public routing response');
          NODE
      - name: Reject committed activation
        run: |
          if git grep -nE '^ODM_DUAL_READ_ENABLED=true|^ODM_DUAL_READ_SAMPLE_PERCENT=[1-9]' -- ':!docs/**'; then
            echo 'ODM dual read activation must not be committed'
            exit 1
          fi
