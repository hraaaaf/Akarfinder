name: Announcement Page L7 Street Reality

on:
  pull_request:
    paths:
      - ".env.local.example"
      - "app/listings/[id]/page.tsx"
      - "app/visual-qa/announcement-page-street-reality/**"
      - "components/listings/AnnouncementPageShell.tsx"
      - "components/listings/PropertyDetailV2.tsx"
      - "components/listings/StreetRealitySection.tsx"
      - "lib/geo/**"
      - "lib/property-detail/announcement-page-truth-contract-v1.ts"
      - "scripts/audits/announcement-page-l7-street-reality-visual.mjs"
      - "scripts/scrapers/__tests__/announcement-page-l7-street-imagery-provider.test.ts"
      - "scripts/scrapers/__tests__/announcement-page-l7-street-reality-model.test.ts"
      - "scripts/scrapers/__tests__/announcement-page-l7-street-reality-service.test.ts"
      - "scripts/scrapers/__tests__/announcement-page-l7-street-reality-ui.test.ts"
      - ".github/workflows/announcement-page-l7-street-reality.yml"
  push:
    branches:
      - main
      - agent/announcement-page-l7-street-reality
    paths:
      - ".env.local.example"
      - "app/listings/[id]/page.tsx"
      - "app/visual-qa/announcement-page-street-reality/**"
      - "components/listings/AnnouncementPageShell.tsx"
      - "components/listings/PropertyDetailV2.tsx"
      - "components/listings/StreetRealitySection.tsx"
      - "lib/geo/**"
      - "lib/property-detail/announcement-page-truth-contract-v1.ts"
      - "scripts/audits/announcement-page-l7-street-reality-visual.mjs"
      - "scripts/scrapers/__tests__/announcement-page-l7-street-imagery-provider.test.ts"
      - "scripts/scrapers/__tests__/announcement-page-l7-street-reality-model.test.ts"
      - "scripts/scrapers/__tests__/announcement-page-l7-street-reality-service.test.ts"
      - "scripts/scrapers/__tests__/announcement-page-l7-street-reality-ui.test.ts"
      - ".github/workflows/announcement-page-l7-street-reality.yml"

permissions:
  contents: read

jobs:
  street-reality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ANN-L7 street imagery truth boundaries
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/announcement-page-l7-street-imagery-provider.test.ts
          scripts/scrapers/__tests__/announcement-page-l7-street-reality-model.test.ts
          scripts/scrapers/__tests__/announcement-page-l7-street-reality-service.test.ts
          scripts/scrapers/__tests__/announcement-page-l7-street-reality-ui.test.ts
          scripts/scrapers/__tests__/announcement-page-truth-contract-v1.test.ts
          scripts/scrapers/__tests__/announcement-page-l5-geo-foundation.test.ts
          scripts/scrapers/__tests__/announcement-page-l6-living-here.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start ANN-L7 production server
        shell: bash
        run: |
          npm run start -- -p 3207 > /tmp/ann-l7.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3207/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ann-l7.log
          exit 1

      - name: ANN-L7 targeted visual certification
        env:
          BASE_URL: http://127.0.0.1:3207
          AUDIT_OUTPUT_DIR: artifacts/announcement-page-l7-street-reality
        run: node scripts/audits/announcement-page-l7-street-reality-visual.mjs

      - name: Upload ANN-L7 visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: announcement-page-l7-street-reality-${{ github.run_id }}
          path: artifacts/announcement-page-l7-street-reality
          if-no-files-found: warn
          retention-days: 14
