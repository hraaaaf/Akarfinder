name: MASS-2F Canonical Closeout Temp

on:
  push:
    branches:
      - "data/mass-2f-final-certification"
    paths:
      - ".github/workflows/mass-2f-canonical-closeout-temp.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "data/mass-2f-final-certification"
      - name: Patch canonical DATA blocks
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          def replace_block(path,start,end,new):
              p=Path(path); s=p.read_text()
              a=s.index(start); b=s.index(end,a)+len(end)
              p.write_text(s[:a]+new+s[b:])

