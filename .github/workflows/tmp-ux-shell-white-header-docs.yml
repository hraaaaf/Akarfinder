name: TEMP UX Shell White Header Docs
on:
  push:
    branches: [ux-shell-white-header-1]
    paths:
      - '.github/workflows/tmp-ux-shell-white-header-docs.yml'
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-shell-white-header-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/tmp/ux-shell-white-header-docs.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/ROADMAP.md docs/SESSION.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: close UX-SHELL-WHITE-HEADER-1'
          git push origin HEAD:ux-shell-white-header-1
