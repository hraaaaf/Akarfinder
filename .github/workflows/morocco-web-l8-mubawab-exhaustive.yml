name: Morocco Web L8 Mubawab Exhaustive Enumerator

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mubawab-exhaustive-enumerator
    paths:
      - 'scripts/acquisition/mubawab-exhaustive-enumerator.mjs'
      - 'scripts/acquisition/__tests__/mubawab-exhaustive-enumerator.test.mjs'
      - '.github/workflows/morocco-web-l8-mubawab-exhaustive.yml'

permissions:
  contents: read

concurrency:
  group: morocco-web-l8-mubawab-exhaustive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test scripts/acquisition/__tests__/mubawab-exhaustive-enumerator.test.mjs
      - name: Bounded live public enumeration
        env:
          MUBAWAB_MAX_REQUESTS: '12'
        run: node scripts/acquisition/mubawab-exhaustive-enumerator.mjs
      - name: Verify safety and report
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('artifacts/morocco-web-l8-mubawab-exhaustive/report.json', 'utf8'));
          if (report.zeroDbWrites !== true) throw new Error('zeroDbWrites must be true');
          if (report.stoppedEarly === 'http_429') throw new Error('run hit HTTP 429');
          if (report.requestCount < 1 || report.requestCount > 12) throw new Error('bounded request count violated');
          for (const shard of report.shards) {
            if (new URL(shard.url).pathname.includes(':')) throw new Error(`robots-disallowed colon URL fetched: ${shard.url}`);
          }
          console.log({
            requests: report.requestCount,
            rootExpectedCount: report.rootExpectedCount,
            uniqueListingUrlCount: report.uniqueListingUrlCount,
            reconciliationGap: report.reconciliationGap,
            shardStates: report.shardStates,
          });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: morocco-web-l8-mubawab-exhaustive
          path: artifacts/morocco-web-l8-mubawab-exhaustive/
          if-no-files-found: error
