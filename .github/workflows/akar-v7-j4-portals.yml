name: Akar V7 J4 Avito Sarouty Yakeey — Offline
on:
  pull_request:
    paths:
      - 'scripts/acquisition/v7_parallel/j4_portal_intake.mjs'
      - 'scripts/acquisition/__tests__/v7-j4-portals.test.mjs'
      - 'scripts/acquisition/v7_parallel/j45_sarouty_source_geo_audit.py'
      - 'scripts/acquisition/__tests__/test_v7_j45_sarouty_source_geo_audit.py'
      - '.github/workflows/akar-v7-j4-portals.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  j4-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: J4 real merged L8 adapter tests; 0 portal requests, 0 DB
        run: node --test scripts/acquisition/__tests__/v7-j4-portals.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only Sarouty JSON-LD geolocation contradiction tests (NO HTTP)
        run: |
          python -m pip install "beautifulsoup4==4.14.3"
          python -m unittest discover -s scripts/acquisition/__tests__ -p 'test_v7_j45_sarouty_source_geo_audit.py' -v
