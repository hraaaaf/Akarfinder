name: Announcement Page L12 Mon Projet Personalise

on:
  pull_request:
    paths:
      - "lib/search-profile-v2/**"
      - "lib/user-continuity/**"
      - "lib/property-detail/project-fit.ts"
      - "lib/property-detail/project-routes.ts"
      - "lib/geo/project-routes-service.ts"
      - "components/listings/**"
      - "components/search/**"
      - "components/companion/**"
      - "app/listings/**"
      - "app/search/**"
      - "app/mon-projet/**"
      - "app/api/me/project-routes/**"
      - "app/visual-qa/announcement-page-mon-projet/**"
      - "docs/ANNOUNCEMENT_PAGE_L12_*"
      - "scripts/audits/announcement-page-l12-*"
      - "scripts/scrapers/__tests__/announcement-page-l12-*"
      - ".github/workflows/announcement-page-l12-mon-projet-personalise.yml"
  push:
    branches:
      - "agent/announcement-page-l12-mon-projet-personalise"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Latest-commit scope check
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^ HEAD > /tmp/changed.txt
          if grep -Eq '^(lib/search-profile-v2/|lib/user-continuity/|lib/property-detail/project-(fit|routes)\.ts$|lib/geo/project-routes-service\.ts$|components/listings/|components/search/|components/companion/|app/listings/|app/search/|app/mon-projet/|app/api/me/project-routes/|app/visual-qa/announcement-page-mon-projet/|docs/ANNOUNCEMENT_PAGE_L12_|scripts/audits/announcement-page-l12-|scripts/scrapers/__tests__/announcement-page-l12-)' /tmp/changed.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  contract:
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ANN-L12 profile, destination, fit, routing and continuity contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            scripts/scrapers/__tests__/announcement-page-l12-profile-anchors.test.ts
            scripts/scrapers/__tests__/announcement-page-l12-project-fit.test.ts
            scripts/scrapers/__tests__/announcement-page-l12-project-routes.test.ts
            scripts/scrapers/__tests__/announcement-page-l12-project-continuity.test.ts
          )
          while IFS= read -r file; do
            [[ "$file" == *announcement-page-l12-profile-anchors.test.ts ]] && continue
            [[ "$file" == *announcement-page-l12-project-fit.test.ts ]] && continue
            [[ "$file" == *announcement-page-l12-project-routes.test.ts ]] && continue
            [[ "$file" == *announcement-page-l12-project-continuity.test.ts ]] && continue
            tests+=("$file")
          done < <(find scripts/scrapers/__tests__ -maxdepth 1 -type f \( -name '*search-profile*.test.ts' -o -name '*companion*.test.ts' \) -print | sort)
          npx tsx --test "${tests[@]}"
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start ANN-L12 production server
        shell: bash
        run: |
          npm run start -- -p 3214 > /tmp/ann-l12.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3214/visual-qa/announcement-page-mon-projet >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ann-l12.log
          exit 1
      - name: ANN-L12 targeted visual certification
        env:
          BASE_URL: http://127.0.0.1:3214
          AUDIT_OUTPUT_DIR: artifacts/announcement-page-l12-mon-projet
        run: node scripts/audits/announcement-page-l12-visual.mjs
      - name: Upload ANN-L12 visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: announcement-page-l12-mon-projet-${{ github.run_id }}
          path: artifacts/announcement-page-l12-mon-projet
          if-no-files-found: error
          retention-days: 14
