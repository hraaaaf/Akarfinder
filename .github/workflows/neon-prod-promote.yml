name: Neon production env audit
on:
  push:
    branches: [release/neon-recovery-live-20260928]
    paths: [.github/workflows/neon-prod-promote.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit DATABASE_URL targets without exposing values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/prj_RCs2Ku5vex9cpABWnwaCjbuKrhhc/env?teamId=team_NNhXPDOIfjGNBcn253btpyk0" \
            | jq -c '[.envs[] | select(.key=="DATABASE_URL") | {id,key,target,type,gitBranch}]'
