name: SEARCH-WORDING-PURITY-1 Gate

on:
  pull_request:
    paths:
      - "components/search/LightZillowSearchShell.tsx"
      - "components/search/ExternalIndexedResultCard.tsx"
      - "components/search/ExternalIndexedResultsSection.tsx"
      - "components/search/SearchMapPanel.tsx"
      - "components/search/PriceExplorerPanel.tsx"
      - "components/search/NeighborhoodIntelligencePanel.tsx"
      - "components/search/CertifiedNeighborhoodComparisonPanel.tsx"
      - "components/search/CertifiedSimilarNeighborhoodsPanel.tsx"
      - "components/akarinfo/AkarInfoPassportCard.tsx"
      - "components/landing/DataProofBlock.tsx"
      - "components/landing/HowItWorks.tsx"
      - "lib/search/search-truth-tier.ts"
      - "scripts/scrapers/__tests__/search-truth-tier.test.ts"
      - "scripts/scrapers/__tests__/search-wording-purity-1.test.ts"
      - ".github/workflows/search-wording-purity-1.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-and-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx --test scripts/scrapers/__tests__/search-wording-purity-1.test.ts scripts/scrapers/__tests__/search-truth-tier.test.ts
      - run: npx tsc --noEmit
