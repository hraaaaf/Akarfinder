name: Recovery V4.11 Neon Import Candidate Gate

on:
  push:
    branches: ["recovery/big-portals-mass-20260925"]
    paths:
      - "data/recovery/activate-v4-11-neon-candidate-gate.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download certified V4.11 corpus
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v411" data/audits/rematerialized
          gh api repos/${{ github.repository }}/actions/artifacts/10910779576/zip > "$RUNNER_TEMP/v411.zip"
          unzip -q -o "$RUNNER_TEMP/v411.zip" -d "$RUNNER_TEMP/v411"
          test -s "$RUNNER_TEMP/v411/clean-corpus-v4.11-core.jsonl.gz"
          sha256sum "$RUNNER_TEMP/v411/clean-corpus-v4.11-core.jsonl.gz" | grep '^e7ac4bca2db34ad334ed7234cfb8be93fc9baca68a9694f5024989b5cc2bb953 '

      - name: Build conservative import candidates
        run: |
          node scripts/recovery/build-v4-11-neon-import-candidates.mjs             --input "$RUNNER_TEMP/v411/clean-corpus-v4.11-core.jsonl.gz"             --output data/audits/rematerialized/clean-corpus-v4.11-neon-candidates.jsonl             --summary data/audits/rematerialized/clean-corpus-v4.11-neon-candidates-summary.json

      - name: Verify gate remains closed
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const s=JSON.parse(fs.readFileSync("data/audits/rematerialized/clean-corpus-v4.11-neon-candidates-summary.json","utf8"));
          if(s.candidates!==8388) throw new Error("candidate count");
          if(s.by_domain["marocimmo.com"]!==4492||s.by_domain["domio.ma"]!==3464||s.by_domain["sarout.ma"]!==432) throw new Error("domain count");
          if(s.quality_min<95) throw new Error("quality floor");
          if(s.approved_for_import_rows!==0) throw new Error("gate unexpectedly open");
          if(s.database_access!==0||s.database_writes!==0) throw new Error("DB invariant");
          console.log(JSON.stringify(s,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-neon-import-candidates
          path: |
            data/audits/rematerialized/clean-corpus-v4.11-neon-candidates.jsonl
            data/audits/rematerialized/clean-corpus-v4.11-neon-candidates-summary.json
          retention-days: 30
