name: Recovery V4.11 Wave9 New Sources Common Crawl Discovery

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/activate-v4-11-wave9-new-sources-cc.txt"

permissions:
  contents: read

concurrency:
  group: recovery-v4-11-wave9-new-sources-cc
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run 21-index new-source Common Crawl discovery
        run: npx tsx scripts/recovery/commoncrawl-new-sources-canary.ts
      - name: Enforce offline safety
        run: |
          node - <<'NODE'
          const s=require("./data/audits/raw-results/recovery-new-sources-commoncrawl-summary.json");
          if(s.indexes!==21)throw new Error("index count");
          if(s.database_access!==0||s.database_writes!==0||s.source_page_fetches!==0||s.approved_for_import_rows!==0)throw new Error("safety invariant");
          console.log(JSON.stringify(s,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-wave9-new-sources-commoncrawl-discovery
          path: |
            data/audits/raw-results/recovery-new-sources-commoncrawl.jsonl
            data/audits/raw-results/recovery-new-sources-commoncrawl-summary.json
          retention-days: 30
