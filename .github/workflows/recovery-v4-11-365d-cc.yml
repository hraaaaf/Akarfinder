name: Recovery V4.11 365d Common Crawl Evidence

on:
  push:
    branches: ["recovery/v4-11-mass-route-wave3-20260927"]
    paths:
      - "data/recovery/activate-v4-11-365d-cc.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        domain: [mubawab.ma, avito.ma, agenz.ma]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RECENT_CC_DOMAINS: ${{ matrix.domain }}
      RECENT_CC_INDEXES: CC-MAIN-2025-51,CC-MAIN-2025-46,CC-MAIN-2025-43
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Query Common Crawl metadata within 365d window
        run: npx tsx scripts/recovery/commoncrawl-recent-evidence.ts
      - name: Assert safety
        run: |
          node - <<'NODE'
          const m=require("./data/audits/raw-results/recent-cc-recovery/manifest.json");
          if(m.database_access!==0||m.database_writes!==0||m.source_page_fetches!==0||m.warc_downloads!==0||m.approved_for_import_rows!==0)throw new Error("safety invariant");
          console.log(JSON.stringify(m,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-365d-cc-${{ matrix.domain }}
          path: data/audits/raw-results/recent-cc-recovery/
          retention-days: 30
