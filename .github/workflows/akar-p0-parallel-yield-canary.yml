# Manual user-requested bounded live canary from archived public source URLs. Zero DB access.
name: EXPERIMENT - P0 source yield canaries read-only
on:
  push:
    branches:
      - sandbox/akar-chrome-probe-20261101
    paths:
      - .github/workflows/akar-p0-parallel-yield-canary.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: akar-p0-yield-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    name: P0-${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [avito]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing adapter tests
        run: |
          if [ '${{ matrix.source }}' = 'avito' ]; then
            node --test scripts/acquisition/__tests__/avito-supabase-shard-runner.test.mjs
          else
            node --test scripts/acquisition/__tests__/mubawab-supabase-shard-runner.test.mjs
          fi
      - name: Restore certified public manifest from GitHub artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p historical-manifest
          if [ '${{ matrix.source }}' = 'avito' ]; then
            gh run download 33672899097 --repo "$GITHUB_REPOSITORY" --name morocco-web-l8-avito-full-manifest --dir historical-manifest
            test -s historical-manifest/report.json
          else
            gh run download 33663293707 --repo "$GITHUB_REPOSITORY" --name morocco-web-l8-mubawab-gate-500 --dir historical-manifest
            test -s historical-manifest/morocco-web-l8-mubawab-manifest/report.json
          fi
      - name: Replay max 25 public discovery shards without any DB
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {extractAvitoListingsFromHtml,isAvitoShardUrl} from './scripts/acquisition/avito-supabase-shard-runner.mjs';
          import {avitoListingId} from './scripts/acquisition/avito-sitemap-enumerator.mjs';
          import {enumerateMubawab,isRobotsSafeUrl,shardKind} from './scripts/acquisition/mubawab-exhaustive-enumerator.mjs';
          const source=process.env.SOURCE;
          const file=source==='avito'?'historical-manifest/report.json':'historical-manifest/morocco-web-l8-mubawab-manifest/report.json';
          const old=JSON.parse(fs.readFileSync(file,'utf8'));
          if(old.zeroDbWrites!==true||!Array.isArray(old.shards))throw new Error('uncertified manifest');
          const byId=new Map();
          const urls=[...new Set(old.shards.map(x=>x.url).filter(Boolean))].filter(raw=>{try{
            const u=new URL(raw);
            if(u.protocol!=='https:'||u.username||u.password)return false;
            if(source==='avito')return ['avito.ma','www.avito.ma'].includes(u.hostname)&&u.pathname.startsWith('/fr/')&&isAvitoShardUrl(raw);
            return ['mubawab.ma','www.mubawab.ma'].includes(u.hostname)&&isRobotsSafeUrl(raw)&&Boolean(shardKind(raw));
          }catch{return false;}}).slice(0,5);
          if(!urls.length)throw new Error('zero eligible shards');
          let requests=0,stop=null,errors=0,httpStatus={};
          if(source==='avito'){
            for(const url of urls){
              requests++;
              try{
                const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(15000),headers:{'user-agent':'AkarFinder-public-index/4.0 (+https://akarfinder.ma)',accept:'text/html'}});
                httpStatus[r.status]=(httpStatus[r.status]||0)+1;
                if(!['avito.ma','www.avito.ma'].includes(new URL(r.url).hostname)){errors++;continue;}
                if(r.status===429){stop='http_429';break;}
                if(!r.ok){errors++;continue;}
                for(const link of extractAvitoListingsFromHtml(await r.text(),url)){const id=avitoListingId(link);if(id)byId.set(id,link);}
              }catch{errors++;httpStatus.network_error=(httpStatus.network_error||0)+1;}
            }
          }else{
            const r=await enumerateMubawab({roots:urls,maxRequests:25,maxDepth:0});
            requests=r.requestCount;stop=r.stoppedEarly;
            errors=(r.shards||[]).filter(x=>x.status!==200).length;
            for(const link of r.listingUrls||[])byId.set(link,link);
          }
          const result={source,selected:urls.length,requests,unique_listing_urls:byId.size,non_200_or_network:errors,http_status_histogram:httpStatus,stopped_early:stop,db_writes:0,ready_for_use_proven:false};
          fs.writeFileSync('source-canary-summary.json',JSON.stringify(result,null,2)+'\n');
          fs.writeFileSync('source-canary-urls.txt',[...byId.values()].join('\n')+'\n');
          console.log(JSON.stringify(result));
          if(!requests||requests>25||stop==='http_429'||byId.size===0)throw new Error('P0 source gate failed');
          NODE
      - name: Publish evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-${{ matrix.source }}-canary
          path: |
            source-canary-summary.json
            source-canary-urls.txt
          retention-days: 14
          if-no-files-found: warn
