name: HVR-3 Home Listings Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/page.tsx'
      - 'components/home/HomeListingsSection.tsx'
      - 'components/landing/CityIntentGrid.tsx'
      - 'lib/listings/image-policy.ts'
      - 'lib/listings/utils.ts'
      - 'lib/search/**'
      - 'scripts/audits/hvr-3-home-listings.mjs'
      - 'scripts/scrapers/__tests__/hvr-3-home-listings.test.ts'
      - '.github/workflows/hvr-3-home-listings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hvr-3-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: HVR-3 source contracts
        shell: bash
        run: |
          set -euo pipefail
          npx tsx --test \
            scripts/scrapers/__tests__/hvr-3-home-listings.test.ts \
            scripts/scrapers/__tests__/hvr-2-city-direct-nav.test.ts \
            scripts/scrapers/__tests__/hvr-1-homepage.test.ts \
            scripts/scrapers/__tests__/home-proof-ux.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start production server
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3218 > /tmp/hvr-3.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3218/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hvr-3.log
          exit 1
      - name: HVR-3 responsive real-listings proof
        env:
          BASE_URL: http://127.0.0.1:3218
          AUDIT_OUTPUT_DIR: artifacts/hvr-3-home-listings
        run: node scripts/audits/hvr-3-home-listings.mjs
      - name: Upload HVR-3 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hvr-3-home-listings-${{ github.run_id }}
          path: artifacts/hvr-3-home-listings
          if-no-files-found: error
          retention-days: 14
