name: Neighborhood Visual P0.7 Souissi Storage Gate

on:
  pull_request:
    paths:
      - "supabase/functions/neighborhood-visual-p0-7-ingest/**"
      - "supabase/migrations/20260811211500_neighborhood_visual_p0_7_storage_bucket.sql"
      - "supabase/migrations/20260811211600_neighborhood_visual_p0_7_souissi_metadata.sql"
      - "scripts/scrapers/__tests__/neighborhood-visual-p0-7-souissi-storage.test.ts"
      - "tsconfig.json"
      - ".github/workflows/neighborhood-visual-p0-7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: P0.7 Storage contract
        run: npx tsx --test scripts/scrapers/__tests__/neighborhood-visual-p0-7-souissi-storage.test.ts
      - name: Replay P0.6 visual QA contract
        run: npx tsx --test scripts/scrapers/__tests__/neighborhood-visual-p0-6-souissi-visual-qa.test.ts
      - name: Replay P0.5/P0.4/P0.3/P0.2/P0.1 contracts
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/neighborhood-visual-p0-5-souissi-lifestyle.test.ts
          scripts/scrapers/__tests__/neighborhood-visual-p0-4-souissi-immobilier.test.ts
          scripts/scrapers/__tests__/neighborhood-visual-p0-3-souissi-signature.test.ts
          scripts/scrapers/__tests__/neighborhood-visual-p0-2-souissi-source.test.ts
          scripts/scrapers/__tests__/neighborhood-visual-template-a-p0-1.test.ts
      - name: Deno type-check Edge Function
        run: deno check supabase/functions/neighborhood-visual-p0-7-ingest/index.ts
      - name: Next TypeScript
        run: npx tsc --noEmit
