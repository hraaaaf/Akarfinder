name: Recovery Domio Deep Continuation

on:
  push:
    branches: ["recovery/big-portals-mass-20260925"]
    paths:
      - "data/recovery/activate-domio-deep-continuation-v1.txt"

permissions:
  contents: read

concurrency:
  group: recovery-domio-deep-continuation
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Harvest Domio detail URLs
        run: npx tsx scripts/recovery/domio-category-detail-harvest.ts
      - name: Deep enrich Domio 500-1000
        env:
          DEEP_DOMAIN: domio.ma
          DEEP_URL_FILE: data/audits/raw-results/recovery-domio-category-detail-urls.txt
          DEEP_OFFSET: "500"
          DEEP_LIMIT: "500"
        run: npx tsx scripts/recovery/deep-enrichment-source-batch.ts
      - name: Deep enrich Domio 1000-1500
        env:
          DEEP_DOMAIN: domio.ma
          DEEP_URL_FILE: data/audits/raw-results/recovery-domio-category-detail-urls.txt
          DEEP_OFFSET: "1000"
          DEEP_LIMIT: "500"
        run: npx tsx scripts/recovery/deep-enrichment-source-batch.ts
      - uses: actions/upload-artifact@v4
        with:
          name: domio-deep-500-1500
          path: data/audits/raw-results/deep-batch-domio-ma-*
          retention-days: 30
