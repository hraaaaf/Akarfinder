name: Carte C6 Verified Listing Inventory

on:
  pull_request:
    paths:
      - "lib/professional/verified-listing-inventory-repository.ts"
      - "lib/map/listing-inventory-provenance.ts"
      - "scripts/scrapers/__tests__/carte-c6-verified-listing-inventory.test.ts"
      - "scripts/scrapers/__tests__/carte-c6-listing-inventory-provenance.test.ts"
      - ".github/workflows/carte-c6-verified-listing-inventory.yml"

permissions:
  contents: read

jobs:
  certify-c6-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: C6 verified inventory and provenance tests
        run: npx tsx --test scripts/scrapers/__tests__/carte-c6-verified-listing-inventory.test.ts scripts/scrapers/__tests__/carte-c6-listing-inventory-provenance.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
