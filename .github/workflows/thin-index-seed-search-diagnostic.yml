name: Thin Index Seed Search Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/scrapers/__tests__/thin-index-seed-search-v1.test.ts"
      - "lib/search-gateway/seed-thin-index.ts"
      - "app/api/search/gateway/route.ts"
      - ".github/workflows/thin-index-seed-search-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Thin Index isolated test
        id: thin_index_test
        run: |
          set -o pipefail
          npx tsx --test scripts/scrapers/__tests__/thin-index-seed-search-v1.test.ts 2>&1 | tee thin-index-diagnostic.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thin-index-seed-search-diagnostic
          path: thin-index-diagnostic.log
          if-no-files-found: error
          retention-days: 1
