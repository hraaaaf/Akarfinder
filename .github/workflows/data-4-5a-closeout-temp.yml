name: DATA-4.5A Docs Closeout Temp

on:
  push:
    branches: [docs/data-4-5a-closeout]
    paths:
      - ".github/workflows/data-4-5a-closeout-temp.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/data-4-5a-closeout
      - name: Apply canonical docs closeout
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          needle = "- DATA-4.4C ✅ PR #384, merge `ba65943a` : protection du Thin Index sur les writes freshness-only, migration production appliquée puis canary persistant exact **50/50**. Revalidation publique 4.4B rejouée juste avant write avec cohorte immuable ; post-certification : Search **50/50**, technical display **50/50**, quality A/B **50/50**, projection préservée **50/50**, drift **0 %**, Registry inchangé. Promo Immo = **3 005 total / 59 fresh_confirmed / 2 946 seed_only / 50 public_sitemap_presence** ; rollback disponible mais non requis."
          insert = needle + "\n- DATA-4.5A ✅ PR #410, merge `a4710d6f5a88218db7d0751adb775a145a8b04d2` : qualification read-only d'une expansion Promo Immo vers un plafond de **500**. Preuve source DATA-4.4B certifiée âgée de **25,29 h** et vérifiée par artefact/digest : **3 130 URLs sitemap / 2 935 intersections / 2 456 éligibles**. Production actuelle : **3 005 seeds / 2 923 Search / 2 923 technical display / 0 collision exacte** ; **2 405** nouvelles lignes conservatrices disponibles et cohorte provisoire **450/450**, batchée **100+100+100+100+50**. Cette cohorte n'est pas déclarée sitemap-live par 4.5A : les **450 doivent être revalidées individuellement contre le sitemap courant avant tout write**. **0 write, 0 source-site request, Registry inchangé**."
          assert needle in text
          text = text.replace(needle, insert, 1)
          old = "**DATA-4.4C, P0.1, P0.2, P0.3, P0.4 et P0.5 sont fermés et certifiés.** Le micro-lot reconciler #396 est également fermé. **État mass-index actuel : 0/2 candidat P0.4 autorisé pour une revue canary.** La prochaine dépendance est externe : autorisation/partenariat/revue légale puis mise à jour explicite du Source Registry. Aucun canary ni nouveau lot d'activation ne doit partir tant que ces blockers ne sont pas levés."
          new = "**DATA-4.4C, DATA-4.5A et P0.1 à P0.5 sont fermés et certifiés.** Le micro-lot reconciler #396 est également fermé. La lane P0 reste bloquée sur autorisation externe, mais le chantier DATA indépendant continue via Promo Immo. **Prochain lot : DATA-4.5B — Controlled Expansion Write**, strictement borné à un plafond de 500, avec revalidation sitemap live de chaque ligne avant write, rollback préalable et certification après chaque batch."
          assert old in text
          readme.write_text(text.replace(old, new, 1))

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text()
          needle = "- 4.4C ✅ #384, merge `ba65943a` — canary 50 persistant certifié, Search/display/quality/projection **50/50**, drift **0 %**, Registry inchangé."
          insert = needle + "\n- 4.5A ✅ #410, merge `a4710d6f5a88218db7d0751adb775a145a8b04d2` — qualification de capacité read-only vers 500 : snapshot source 4.4B certifié **25,29 h**, **3 130/2 935/2 456**, production **3 005 seeds / 2 923 Search / 2 923 display / 0 collision**, **2 405** nouvelles rows conservatrices, **450/450** sélectionnées provisoirement, batches **100+100+100+100+50**. Les 450 restent à revalider sitemap-live avant write."
          assert needle in text
          text = text.replace(needle, insert, 1)
          old = "DATA-4.4C n’autorise aucun +100/+500 automatique. Le prochain lot DATA d’expansion doit être borné explicitement."
          new = "DATA-4.5A qualifie la capacité mais **n'autorise aucun write par lui-même**. Prochain lot : **DATA-4.5B — Promo Immo Controlled Expansion Write**. Il devra revalider le sitemap courant pour chaque ligne juste avant write, créer le rollback avant mutation, appliquer au maximum **450 nouvelles confirmations** par batches **100+100+100+100+50**, arrêter fail-closed sur toute anomalie et certifier Search/display/quality/projection après chaque batch."
          assert old in text
          text = text.replace(old, new, 1)
          old = "**P0.1 à P0.5 sont CLOSED.** P0.5 conclut **0/2 ready** : aucun canary mass-index ne doit être lancé tant que l'autorisation/partenariat/revue légale n'est pas résolue et reflétée explicitement dans le Source Registry. Les 3 candidats rejetés P0.4 restent bloqués."
          new = "**DATA-4.5A est CLOSED ✅.** La lane P0.1→P0.5 reste fermée/bloquée sur autorisation externe, sans empêcher la lane DATA indépendante. **Action suivante : DATA-4.5B uniquement**, expansion Promo Immo bornée vers 500 avec revalidation sitemap live avant chaque write et rollback préalable."
          assert old in text
          roadmap.write_text(text.replace(old, new, 1))

          session = Path('docs/SESSION.md')
          text = session.read_text()
          old = "**Lane DATA : DATA-4.4C ✅ ; P0.1 ✅ ; P0.2 ✅ ; P0.3 ✅ ; P0.4 ✅ ; P0.5 Registry Activation Readiness Gate ✅ CLOSED ; freshness reconciler hardening ✅ #396 ; prochain état = dépendance externe autorisation/partenariat/revue légale, aucun canary autorisé**"
          new = "**Lane DATA : DATA-4.4C ✅ ; DATA-4.5A Expansion-to-500 Qualification ✅ #410 ; P0.1→P0.5 ✅ CLOSED ; freshness reconciler hardening ✅ #396 ; prochain LOT = DATA-4.5B Promo Immo Controlled Expansion Write, indépendant de la lane d'autorisation P0**"
          assert old in text
          text = text.replace(old, new, 1)
          old = "Main canonique après P0.5 : `ac0e240d28b88c5e66da73d1ab964794deb01877` — merge PR #408 ; post-merge gate PASS."
          new = "Main canonique après DATA-4.5A : `a4710d6f5a88218db7d0751adb775a145a8b04d2` — merge PR #410 ; post-merge DATA-4.5A gate PASS."
          assert old in text
          text = text.replace(old, new, 1)
          marker = "# PROCHAINE ÉTAPE DATA\n\n**Aucun canary n'est autorisé.** Dépendance externe : obtenir/résoudre autorisation, partenariat et revue légale, puis seulement refléter ce changement par une modification explicite/auditée du Source Registry. Ne pas inventer de P0.6 automatique. `immo-maroc.com`, `immohammedia.com` et `leaderimmo.ma` restent bloqués par P0.4."
          replacement = "# DATA-4.5A — Promo Immo Expansion-to-500 Qualification ✅ CLOSED — PR #410\n\nQualification read-only de capacité à partir du baseline persistant **50**. Source evidence 4.4B exact-head, artefact `9020834298`, digest vérifié, âge **25,29 h** : **3 130 URLs sitemap / 2 935 intersections / 2 456 éligibles / 0 collision exacte**. Production au run : **3 005 seeds / 2 923 Search / 2 923 technical display / 0 collision exacte / 2 405 nouvelles rows conservatrices**. Cohorte provisoire : **450/450**, unique, Search/display/collision-free, batches **100+100+100+100+50**.\n\nImportant : 4.5A **ne certifie pas la présence sitemap live individuelle des 450**. Les 450 sont toutes marquées `must_revalidate_current_sitemap_before_write=true`. Contrat : **0 source-site request, 0 detail fetch, 0 DB/freshness/Registry write, 0 activation**. Exact-head `7338b0108e7bd633af7c51ef4e7ce9c8a595dabc`, **20/20 PASS**, Reviewer **9,6/10**, Certifier GO, merge `a4710d6f5a88218db7d0751adb775a145a8b04d2`, post-merge gate PASS.\n\n# PROCHAINE ÉTAPE DATA\n\n**DATA-4.5B — Promo Immo Controlled Expansion Write** uniquement. La lane P0 peut rester bloquée sur autorisation externe sans bloquer ce chantier. 4.5B devra obtenir une preuve sitemap actuelle pour chaque ligne avant write, préparer le rollback avant mutation, écrire au plus **450** rows en batches **100+100+100+100+50**, et stopper/rollback immédiatement sur drift Search/display/quality/projection."
          assert marker in text
          text = text.replace(marker, replacement, 1)
          old = "DATA-4.4C et P0.1 à P0.5 sont fermés. Le reconciler #396 est fermé. **P0.5 = 0/2 ready** : aucun canary mass-index jusqu'à résolution externe des blockers d'autorisation/partenariat/revue légale et mise à jour explicite du Source Registry. Les 3 rejetés P0.4 restent bloqués."
          new = "DATA-4.4C, DATA-4.5A et P0.1 à P0.5 sont fermés. Le reconciler #396 est fermé. **Prochaine action DATA : DATA-4.5B**, expansion Promo Immo bornée vers 500 ; la lane d'autorisation P0 reste séparée et ne bloque plus ce chantier."
          assert old in text
          session.write_text(text.replace(old, new, 1))
          PY
      - name: Commit canonical docs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/data-4-5a-closeout-temp.yml
          git add README.md docs/ROADMAP.md docs/SESSION.md
          git commit -m "docs: close DATA-4.5A expansion qualification"
          git push origin HEAD:docs/data-4-5a-closeout
