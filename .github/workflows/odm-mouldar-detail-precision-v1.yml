name: ODM Mouldar Detail Precision V1

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260801004500_odm_mouldar_detail_precision_v1.sql'
      - 'scripts/odm-mouldar-detail-precision-v1-contract.mjs'
      - '.github/workflows/odm-mouldar-detail-precision-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mouldar detail precision contract
        run: node scripts/odm-mouldar-detail-precision-v1-contract.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
