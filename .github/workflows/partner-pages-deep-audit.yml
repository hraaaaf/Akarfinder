name: Partner Pages Deep Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/pro/agences/**'
      - 'app/promoteurs/**'
      - 'app/professionnels/**'
      - 'app/demo/agence/**'
      - 'app/demo/promoteur/**'
      - 'components/pro/**'
      - 'components/promoters/**'
      - 'components/demo/**'
      - 'lib/professional/**'
      - 'lib/promoters/**'
      - 'lib/demo/partner-pages-demo-data.ts'
      - 'scripts/audits/partner-pages-deep-audit.mjs'
      - 'scripts/scrapers/__tests__/partner-pages-deep-audit.test.ts'
      - '.github/workflows/partner-pages-deep-audit.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    name: Partner pages contract + Chromium certification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_URL: http://127.0.0.1:3210
      AUDIT_OUTPUT_DIR: data/audits/partner-pages-deep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Partner page source contracts
        run: npx tsx --test scripts/scrapers/__tests__/partner-pages-deep-audit.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3210 > /tmp/partner-pages-deep.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3210/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/partner-pages-deep.log
          exit 1

      - name: Capture and certify six partner surfaces
        run: node scripts/audits/partner-pages-deep-audit.mjs

      - name: Upload partner pages proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-pages-deep-${{ github.run_id }}
          path: data/audits/partner-pages-deep
          if-no-files-found: error
          retention-days: 14
