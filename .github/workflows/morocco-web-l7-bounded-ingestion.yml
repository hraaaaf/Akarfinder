name: Morocco Web L7 Bounded Ingestion

on:
  workflow_dispatch:
  push:
    branches:
      - feat/morocco-web-l7-bounded-production-ingestion
      - feat/morocco-web-l7-production-canary-hardening
    paths:
      - 'scripts/acquisition/bounded_production_ingestion.py'
      - 'scripts/acquisition/bounded_production_ingestion_apply.py'
      - 'scripts/acquisition/bounded_production_ingestion_dry_run.py'
      - 'scripts/acquisition/__tests__/test_bounded_production_ingestion.py'
      - '.env.local.example'
      - '.github/workflows/morocco-web-l7-bounded-ingestion.yml'

permissions:
  contents: read

concurrency:
  group: morocco-web-l7-bounded-ingestion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_PROVIDER: sqlite
      THIRD_PARTY_DB_INGESTION_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest scripts/acquisition/__tests__/test_bounded_production_ingestion.py
      - name: Bounded zero-write dry-run
        run: python scripts/acquisition/bounded_production_ingestion_dry_run.py
      - name: CLI remains dry-run by default
        run: |
          cat > /tmp/l7-canary.json <<'JSON'
          [{"provider":"ci-fixture","discovery_query":"appartement casablanca","source_url":"https://example.ma/a/1","canonical_url":"https://example.ma/a/1"}]
          JSON
          THIRD_PARTY_DB_INGESTION_ALLOWED_HOSTS=example.ma python scripts/acquisition/bounded_production_ingestion_apply.py /tmp/l7-canary.json --limit 1 --evidence-dir artifacts/morocco-web-l7-cli-dry-run
          python - <<'PY'
          import json
          p=json.load(open('artifacts/morocco-web-l7-cli-dry-run/canary-evidence.json'))
          assert p['mode']=='dry-run'
          assert p['plan']['zeroDbWrites'] is True
          PY
      - name: Publish evidence summary
        if: always()
        run: |
          if [ -f artifacts/morocco-web-l7-bounded-ingestion/report.md ]; then
            cat artifacts/morocco-web-l7-bounded-ingestion/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morocco-web-l7-bounded-ingestion-${{ github.run_id }}
          path: |
            artifacts/morocco-web-l7-bounded-ingestion/
            artifacts/morocco-web-l7-cli-dry-run/
          if-no-files-found: error
          retention-days: 14
