name: P1 Home Candidate Visual

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p1-home-candidate-visual.yml"
      - "app/visual-qa/p1-home-candidate/**"
      - "scripts/audits/p1-home-candidate-visual.mjs"
      - "components/home/SearchEntryOrchestrator.tsx"
      - "components/landing/SignatureMapSection.tsx"
      - "components/landing/SiteFooter.tsx"
      - "components/layout/SiteHeader.tsx"
  workflow_dispatch: {}

concurrency:
  group: p1-home-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start candidate mockup
        shell: bash
        run: |
          npm run dev -- -p 3217 > /tmp/p1-home-candidate.log 2>&1 &
          curl --retry 90 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:3217/visual-qa/p1-home-candidate >/dev/null || { cat /tmp/p1-home-candidate.log; exit 1; }
      - name: Capture candidate 390 / 768 / 1280
        env:
          BASE_URL: http://127.0.0.1:3217
          AUDIT_OUTPUT_DIR: artifacts/p1-home-candidate
        run: node scripts/audits/p1-home-candidate-visual.mjs
      - name: Upload P1 HOME candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-home-candidate-${{ github.run_id }}
          path: artifacts/p1-home-candidate
          if-no-files-found: error
          retention-days: 30
