name: Vivre Ici Premium Map

on:
  push:
    branches:
      - spike/vivre-ici-maplibre-morocco
    paths:
      - 'app/map/page.tsx'
      - 'components/map/PremiumInteractiveMap.tsx'
      - 'scripts/vivre-ici-maplibre-spike-capture.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vivre-ici-maplibre-spike.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bootstrap premium map dependencies
        run: |
          npm install --save-exact d3-geo@3 d3-selection@3 d3-zoom@3 topojson-client@3 framer-motion@12
          npm install --save-dev --save-exact @types/d3-geo @types/d3-selection @types/d3-zoom @types/topojson-client @types/topojson-specification @types/geojson
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(map): lock premium map dependencies [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Capture premium map
        run: node scripts/vivre-ici-maplibre-spike-capture.mjs

      - name: Upload visual artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivre-ici-premium-map
          path: artifacts/vivre-ici-maplibre-spike
          if-no-files-found: error
