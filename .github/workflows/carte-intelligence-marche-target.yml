name: Carte Intelligence Marché Target Gate

on:
  pull_request:
    paths:
      - "docs/CARTE_INTELLIGENCE_MARCHE_TARGET.md"
      - "docs/assets/carte-intelligence-marche-reference.webp"
      - "scripts/scrapers/__tests__/carte-intelligence-marche-target.test.ts"
      - ".github/workflows/carte-intelligence-marche-target.yml"

permissions:
  contents: read

jobs:
  certify-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Target contract
        run: npx tsx --test scripts/scrapers/__tests__/carte-intelligence-marche-target.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
