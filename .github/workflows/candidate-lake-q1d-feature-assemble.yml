name: AkarFinder - Q1D Feature Assembly

on:
  push:
    branches: [data/q1d-normalized-features-fingerprints]
    paths:
      - 'scripts/audits/candidate-lake-q1d-feature-assemble.py'
      - 'scripts/audits/candidate-lake-q1d-smoke-test.py'
      - 'scripts/audits/candidate-lake-q1d-coverage-check.py'
      - '.github/workflows/candidate-lake-q1d-feature-assemble.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      Q1D_Q1C_ROOT: .tmp/q1d-input/q1c
      Q1D_DB_ROOT: .tmp/q1d-input/db
      Q1D_PUBLIC_ROOT: .tmp/q1d-input/public
      Q1D_OUT: .tmp/q1d-features
    steps:
      - uses: actions/checkout@v4
      - name: Download certified Q1C artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$Q1D_Q1C_ROOT" "$Q1D_DB_ROOT" "$Q1D_PUBLIC_ROOT" .tmp/downloads
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10020459850/zip" \
            -o .tmp/downloads/q1c.zip
          unzip -q .tmp/downloads/q1c.zip -d "$Q1D_Q1C_ROOT"
      - name: Resolve exact prerequisite artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; branch='data/q1d-normalized-features-fingerprints'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for name,out in [('candidate-lake-q1d-db-feature-export','.tmp/q1d-db-artifact-id'),('candidate-lake-q1d-public-dataset-features','.tmp/q1d-public-artifact-id')]:
            req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/artifacts?name={name}&per_page=30',headers=headers)
            data=json.load(urllib.request.urlopen(req))
            arts=[a for a in data.get('artifacts',[]) if not a.get('expired') and a.get('workflow_run',{}).get('head_branch')==branch]
            if not arts: raise SystemExit(f'no prerequisite artifact: {name}')
            art=max(arts,key=lambda a:a['created_at']); open(out,'w').write(str(art['id']))
            print(json.dumps({'name':name,'artifact_id':art['id'],'created_at':art['created_at']}))
          PY
          for pair in "db:.tmp/q1d-db-artifact-id:$Q1D_DB_ROOT" "public:.tmp/q1d-public-artifact-id:$Q1D_PUBLIC_ROOT"; do
            IFS=: read -r label idfile dest <<< "$pair"
            id=$(cat "$idfile")
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o ".tmp/downloads/${label}.zip"
            unzip -q ".tmp/downloads/${label}.zip" -d "$dest"
          done
      - name: Assemble normalized features and deterministic fingerprints
        run: python scripts/audits/candidate-lake-q1d-feature-assemble.py
      - name: Verify Q1D accounting and no-inference invariants
        run: |
          python scripts/audits/candidate-lake-q1d-smoke-test.py
          python scripts/audits/candidate-lake-q1d-coverage-check.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-lake-q1d-normalized-features-fingerprints
          path: .tmp/q1d-features/
          retention-days: 30
          if-no-files-found: error
