name: MASS-INDEX M2 Final Certification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/data-mass/universal-candidate-promotion.ts
      - scripts/data-mass/external-index-seed.ts
      - scripts/data-mass/external-index-seed-write-plan.ts
      - scripts/data-mass/external-index-seed-canary.ts
      - scripts/data-mass/external-index-m2-canary-plan-live.ts
      - scripts/data-mass/__tests__/universal-candidate-promotion.test.ts
      - scripts/data-mass/__tests__/external-index-seed.test.ts
      - scripts/data-mass/__tests__/external-index-seed-write-plan.test.ts
      - scripts/data-mass/__tests__/external-index-seed-canary-contract.test.ts
      - scripts/data-mass/__tests__/external-index-m2-bounded-certification-contract.test.ts
      - scripts/data-mass/__tests__/mass-index-m2-native-provider-contract.test.ts
      - docs/MASS_INDEX_M2_ROLLBACK.md
      - supabase/migrations/20260822145000_mass_index_m2_native_discovery_providers.sql
      - .github/workflows/mass-index-m1-certification.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mass-index-m2-final-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout MASS-INDEX head
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run M2 unit and contract tests
        run: >-
          npx tsx --test
          scripts/data-mass/__tests__/universal-candidate-promotion.test.ts
          scripts/data-mass/__tests__/external-index-seed.test.ts
          scripts/data-mass/__tests__/external-index-seed-write-plan.test.ts
          scripts/data-mass/__tests__/external-index-seed-canary-contract.test.ts
          scripts/data-mass/__tests__/external-index-m2-bounded-certification-contract.test.ts
          scripts/data-mass/__tests__/mass-index-m2-native-provider-contract.test.ts
      - name: Assert Supabase read credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Build bounded M2 canary plan — read only
        run: npx tsx scripts/data-mass/external-index-m2-canary-plan-live.ts
      - name: Assert M2 final invariants
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('artifacts/mass-index/m2-bounded-canary-plan.json', 'utf8'));
          if (p.mode !== 'read_only') throw new Error('M2_NOT_READ_ONLY');
          if (p.invariants.databaseWrites !== 0 || p.invariants.sourceNetworkRequests !== 0) throw new Error('M2_SIDE_EFFECT_INVARIANT');
          if (p.invariants.fullReservoirScan !== false) throw new Error('M2_FULL_SCAN_FORBIDDEN');
          if (p.invariants.existingSeedsMutated !== 0 || p.invariants.providerRelabels !== 0) throw new Error('M2_MUTATION_INVARIANT');
          if (p.invariants.canaryRows !== 10 || p.invariants.canaryMaxRows !== 10) throw new Error('M2_CANARY_SIZE_INVARIANT');
          if (p.summary.insertNative < 10) throw new Error('M2_NOT_ENOUGH_NET_NEW');
          if (Object.keys(p.summary.insertByProvider).some((provider) => !['openserp','serper_mass_harvest'].includes(provider))) throw new Error('M2_NON_NATIVE_INSERT_PROVIDER');
          if (p.canary.some((row) => !['openserp','serper_mass_harvest'].includes(row.seedProvider))) throw new Error('M2_CANARY_PROVIDER_INVARIANT');
          console.log('MASS-INDEX M2 bounded final invariants PASS', p.canaryByProvider);
          NODE
      - name: Upload MASS-INDEX M2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-index-m2-final-certification
          path: artifacts/mass-index/m2-bounded-canary-plan.json
          if-no-files-found: error
          retention-days: 14
