name: Morocco Web L8 Mubawab Exhaustive Enumerator

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mubawab-scale-gate-500
    paths:
      - '.github/workflows/morocco-web-l8-mubawab-exhaustive.yml'

permissions:
  contents: read

concurrency:
  group: morocco-web-l8-mubawab-exhaustive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: |
          node --test scripts/acquisition/__tests__/mubawab-exhaustive-enumerator.test.mjs
          node --test scripts/acquisition/__tests__/mubawab-supabase-shard-runner.test.mjs
          node --test scripts/acquisition/__tests__/mubawab-marocannonces-public-adapter.test.mjs
      - name: Bounded live public root probe
        env:
          MUBAWAB_MAX_REQUESTS: '12'
        run: node scripts/acquisition/mubawab-exhaustive-enumerator.mjs
      - name: Verify root-probe safety
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('artifacts/morocco-web-l8-mubawab-exhaustive/report.json', 'utf8'));
          if (report.zeroDbWrites !== true) throw new Error('zeroDbWrites must be true');
          if (report.stoppedEarly === 'http_429') throw new Error('root probe hit HTTP 429');
          if (report.requestCount < 1 || report.requestCount > 12) throw new Error('bounded root request count violated');
          NODE
      - name: Mubawab 500-shard connected scale gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MUBAWAB_MANIFEST_LIMIT: '500'
          MUBAWAB_MAX_REQUESTS: '500'
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo 'Supabase secrets unavailable.'
            exit 2
          fi
          node scripts/acquisition/mubawab-supabase-shard-runner.mjs
      - name: Verify 500-shard scale evidence
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('artifacts/morocco-web-l8-mubawab-manifest/report.json', 'utf8'));
          if (report.zeroDbWrites !== true) throw new Error('scale gate must remain zero-write');
          if (report.stoppedEarly === 'http_429') throw new Error('scale gate hit HTTP 429');
          if (report.selectedShardCount !== 500) throw new Error(`expected 500 selected shards, got ${report.selectedShardCount}`);
          if (report.requestCount !== 500) throw new Error(`expected 500 requests, got ${report.requestCount}`);
          if (report.safeShardCount < 500) throw new Error('safe shard corpus unexpectedly below gate');
          const refs = report.shards.reduce((sum, shard) => sum + (shard.listingCount || 0), 0);
          const nonzero = report.shards.filter((shard) => (shard.listingCount || 0) > 0).length;
          console.log({
            sourceRowCount: report.sourceRowCount,
            safeShardCount: report.safeShardCount,
            selectedShardCount: report.selectedShardCount,
            totalListingReferences: refs,
            nonzeroShards: nonzero,
            uniqueListingUrlCount: report.uniqueListingUrlCount,
          });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: morocco-web-l8-mubawab-gate-500
          path: artifacts/morocco-web-l8-mubawab-*/
          if-no-files-found: error
