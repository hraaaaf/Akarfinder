name: AkarFinder - Candidate Lake Q1 Inventory

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audits/candidate-lake-inventory.py'
      - '.github/workflows/candidate-lake-q1-inventory.yml'

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_LAKE_RAW: .tmp/candidate-lake-inventory/raw
      CANDIDATE_LAKE_OUT: .tmp/candidate-lake-inventory/out
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch frozen proof artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$CANDIDATE_LAKE_RAW" "$CANDIDATE_LAKE_OUT"
          : > "$CANDIDATE_LAKE_OUT/download-status.tsv"
          artifacts=(
            9971118875
            9974670013
            9969651653
            9888335708
            9897323745
            9898224274
            9205427369
            9974714576
            9974939355
            9976337671
            9988296190
            9988514932
            9989328673
            9991042950
            9991207598
            9991403015
            9991447841
            9991488198
            8609457925
          )
          for id in "${artifacts[@]}"; do
            dir="$CANDIDATE_LAKE_RAW/$id"
            zip=".tmp/candidate-lake-inventory/$id.zip"
            mkdir -p "$dir"
            code=$(curl -sS -L -o "$zip" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" || true)
            if [ "$code" = "200" ]; then
              if unzip -q "$zip" -d "$dir"; then
                printf '%s\tOK\n' "$id" >> "$CANDIDATE_LAKE_OUT/download-status.tsv"
              else
                printf '%s\tUNZIP_FAILED\n' "$id" >> "$CANDIDATE_LAKE_OUT/download-status.tsv"
                rm -rf "$dir"/*
              fi
            else
              printf '%s\tHTTP_%s\n' "$id" "$code" >> "$CANDIDATE_LAKE_OUT/download-status.tsv"
              rm -rf "$dir"/*
            fi
          done
          cat "$CANDIDATE_LAKE_OUT/download-status.tsv"

      - name: Inventory exact manifests and proof files
        run: python scripts/audits/candidate-lake-inventory.py

      - name: Verify read-only invariants
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.tmp/candidate-lake-inventory/out/summary.json'))
          assert p['readOnly'] is True
          assert p['databaseWrites'] == 0
          assert p['sourceSiteFetches'] == 0
          assert p['productionWrites'] == 0
          assert p['artifactCount'] >= 1
          print(json.dumps({
            'artifactCount': p['artifactCount'],
            'fileCount': p['fileCount'],
            'identityLikeFileCount': p['identityLikeFileCount'],
            'databaseWrites': p['databaseWrites'],
            'sourceSiteFetches': p['sourceSiteFetches'],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-lake-q1-inventory-proof
          path: .tmp/candidate-lake-inventory/out/
          retention-days: 30
          if-no-files-found: error
