name: DATA-4.3C Dar Agadir Freshness Shadow

on:
  pull_request:
    paths:
      - "scripts/data4/daragadir-freshness-shadow.ts"
      - "scripts/data4/__tests__/daragadir-freshness-shadow.test.ts"
      - "scripts/audits/data-4-3c-daragadir-freshness-shadow.ts"
      - ".github/workflows/data-4-3c-daragadir-freshness-shadow.yml"
      - "docs/data/DATA-4-3C-DARAGADIR-FRESHNESS-SHADOW.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-4-3c-daragadir-freshness-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: DATA-4.3C unit tests
        run: npx tsx --test scripts/data4/__tests__/daragadir-freshness-shadow.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  live-audit:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_4_3C_OUT_DIR: .tmp/data-4-3c/results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run read-only freshness shadow
        run: npx tsx scripts/audits/data-4-3c-daragadir-freshness-shadow.ts
      - name: Enforce freshness shadow proof
        shell: bash
        run: |
          set -euo pipefail
          test -s "${DATA_4_3C_OUT_DIR}/proof.json"
          test -s "${DATA_4_3C_OUT_DIR}/report.json"
          test -s "${DATA_4_3C_OUT_DIR}/classification.csv"
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('.tmp/data-4-3c/results/proof.json','utf8'));
          if (p.databaseWrites !== 0 || p.freshnessWrites !== 0 || p.policyChanges !== 0 || p.detailPageFetches !== 0 || p.contentReuseOperations !== 0) throw new Error(JSON.stringify(p));
          if (p.productionActivation !== false) throw new Error(`Activation forbidden: ${JSON.stringify(p)}`);
          if (p.sourceRequests < 2 || p.sourceRequests > 40) throw new Error(`Request budget violation: ${JSON.stringify(p)}`);
          if (p.maxRevalidationIntervalDays !== 14 || !['current','due_soon'].includes(p.registryReviewStatus)) throw new Error(`Registry drift: ${JSON.stringify(p)}`);
          if (p.rowsRead !== 6533) throw new Error(`Reservoir row drift requires review: ${JSON.stringify(p)}`);
          if (p.policyBlockedRows !== 0 || p.duplicateRows !== 0) throw new Error(`Shadow safety invariant failed: ${JSON.stringify(p)}`);
          if (p.seedOnlyShadowReadyRows > 5673) throw new Error(`Shadow exceeds DATA-4.3B sitemap ceiling: ${JSON.stringify(p)}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: data-4-3c-daragadir-freshness-shadow
          path: .tmp/data-4-3c/results/
          if-no-files-found: error
          retention-days: 14
