name: Repo Cleanup Orphan Dependency Proof

on:
  push:
    branches:
      - chore/repo-cleanup-structural-2
    paths:
      - ".github/workflows/repo-cleanup-restore-cheerio.yml"

permissions:
  contents: write

jobs:
  prove-and-remove-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/repo-cleanup-structural-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prove PGlite and direct Playwright are unreferenced
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -i -E '(@electric-sql/pglite|pglite|playwright)' -- . \
            ':!package.json' \
            ':!package-lock.json' \
            ':!.github/workflows/repo-cleanup-restore-cheerio.yml'; then
            echo 'Tracked references found: dependency removal is not proven safe.'
            exit 1
          fi
          node <<'NODE'
          const pkg = require('./package.json');
          const direct = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) };
          for (const name of ['@electric-sql/pglite', 'playwright']) {
            if (Object.prototype.hasOwnProperty.call(direct, name)) {
              throw new Error(`${name} is still declared directly`);
            }
          }
          if (!Object.prototype.hasOwnProperty.call(direct, 'cheerio')) {
            throw new Error('cheerio must remain: active scraper dependency');
          }
          NODE
      - name: Validate dependency graph
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Scraper regression suite
        run: npm run test:scrapers
      - name: Remove temporary proof workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repo-cleanup-restore-cheerio.yml
          git commit -m "chore(cleanup): remove temporary dependency proof workflow"
          git pull --rebase origin chore/repo-cleanup-structural-2
          git push origin HEAD:chore/repo-cleanup-structural-2
