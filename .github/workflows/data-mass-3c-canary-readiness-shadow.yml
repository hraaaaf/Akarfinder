name: DATA MASS-3C Canary Readiness Shadow

on:
  pull_request:
    paths:
      - "data/data-mass-3c/**"
      - "scripts/data-mass/minimal-listing-canary-readiness.ts"
      - "scripts/data-mass/__tests__/minimal-listing-canary-readiness.test.ts"
      - "scripts/audits/data-mass-3c-canary-readiness-shadow.ts"
      - ".github/workflows/data-mass-3c-canary-readiness-shadow.yml"
      - "docs/data/DATA-MASS-3C-CANARY-READINESS-SHADOW.md"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: MASS-3A predecessor policy tests
        run: node --test --import tsx scripts/data-mass/__tests__/minimal-listing-index-policy.test.ts
      - name: MASS-3C readiness tests
        run: node --test --import tsx scripts/data-mass/__tests__/minimal-listing-canary-readiness.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  live-audit:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run read-only canary readiness audit
        run: npx tsx scripts/audits/data-mass-3c-canary-readiness-shadow.ts
      - name: Enforce current fail-closed boundary
        run: |
          node - <<'NODE'
          const p=require('./.tmp/data-mass-3c/results/proof.json');
          const ok=p.status==='PASS' && p.mode==='shadow_read_only' &&
            p.policyAdmissibleRegistryRows===0 && p.canaryCandidates===0 &&
            p.productionWriteAuthorizedByThisLot===false &&
            p.databaseWrites===0 && p.registryWrites===0 && p.searchActivations===0 &&
            p.sourceNetworkRequests===0 && p.detailPageFetches===0 && p.permissionsInferred===0;
          if(!ok){console.error(p);process.exit(1)}
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: data-mass-3c-canary-readiness-shadow
          path: .tmp/data-mass-3c/results/
