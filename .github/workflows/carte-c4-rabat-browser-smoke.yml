name: Carte C4 Rabat Browser Smoke

on:
  pull_request:
    paths:
      - "components/map/RabatMarketIntelligenceExperience.tsx"
      - "components/map/MapNeighborhoodClient.tsx"
      - "scripts/audits/carte-c4-rabat-heatmap-smoke.mjs"
      - ".github/workflows/carte-c4-rabat-browser-smoke.yml"

permissions:
  contents: read

jobs:
  certify-c4-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: http://127.0.0.1:3204
      AUDIT_OUTPUT_DIR: data/audits/carte-c4-rabat-heatmap
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3204 > /tmp/carte-c4-rabat.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3204/map?city=rabat >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/carte-c4-rabat.log
          exit 1
      - name: Real MapLibre interactions at mobile and desktop
        run: node scripts/audits/carte-c4-rabat-heatmap-smoke.mjs
      - name: Upload C4 browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carte-c4-rabat-browser-${{ github.run_id }}
          path: data/audits/carte-c4-rabat-heatmap
          if-no-files-found: error
          retention-days: 30
