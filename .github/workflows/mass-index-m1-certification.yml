name: MASS-INDEX M1-M2 Certification

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - scripts/data-mass/universal-candidate-promotion.ts
      - scripts/data-mass/universal-candidate-promotion-live.ts
      - scripts/data-mass/external-index-seed.ts
      - scripts/data-mass/external-index-seed-dry-run.ts
      - scripts/data-mass/__tests__/universal-candidate-promotion.test.ts
      - scripts/data-mass/__tests__/universal-candidate-promotion-live-contract.test.ts
      - scripts/data-mass/__tests__/external-index-seed.test.ts
      - scripts/data-mass/__tests__/mass-index-m2-native-provider-contract.test.ts
      - supabase/migrations/20260822145000_mass_index_m2_native_discovery_providers.sql
      - .github/workflows/mass-index-m1-certification.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mass-index-m1-m2-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout MASS-INDEX head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run targeted M1-M2 unit and contract tests
        run: >-
          npx tsx --test
          scripts/data-mass/__tests__/universal-candidate-promotion.test.ts
          scripts/data-mass/__tests__/universal-candidate-promotion-live-contract.test.ts
          scripts/data-mass/__tests__/external-index-seed.test.ts
          scripts/data-mass/__tests__/mass-index-m2-native-provider-contract.test.ts

      - name: Assert read-only Supabase credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY secret missing"; exit 1; }

      - name: Build live M1 manifest — read only
        run: npx tsx scripts/data-mass/universal-candidate-promotion-live.ts

      - name: Build M2 seed projection — read only
        run: npx tsx scripts/data-mass/external-index-seed-dry-run.ts

      - name: Extract certification summary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const m1 = JSON.parse(fs.readFileSync('artifacts/mass-index/m1-universal-candidate-promotion.json', 'utf8'));
          const m2 = JSON.parse(fs.readFileSync('artifacts/mass-index/m2-external-index-seed-dry-run.json', 'utf8'));
          const summary = {
            schemaVersion: 'MASS_INDEX_M1_M2_CERTIFICATION_V1',
            mode: 'read_only',
            m1: { sourceSnapshot: m1.sourceSnapshot, summary: m1.summary, invariants: m1.invariants },
            m2,
          };
          fs.writeFileSync('artifacts/mass-index/m1-m2-certification-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Assert M1-M2 invariants
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('artifacts/mass-index/m1-m2-certification-summary.json', 'utf8'));
          if (p.mode !== 'read_only') throw new Error('MASS_INDEX_NOT_READ_ONLY');
          if (p.m1.invariants.databaseWrites !== 0) throw new Error('M1_DB_WRITE_INVARIANT');
          if (p.m1.invariants.sourceNetworkRequests !== 0) throw new Error('M1_SOURCE_NETWORK_INVARIANT');
          if (p.m1.invariants.providersRelabeled !== 0) throw new Error('M1_PROVIDER_RELABEL_INVARIANT');
          if (p.m1.invariants.richContentRequired !== false) throw new Error('M1_RICH_CONTENT_INVARIANT');
          if (p.m1.invariants.snapshotBounded !== true) throw new Error('M1_SNAPSHOT_INVARIANT');
          if (p.m1.invariants.keysetPagination !== true) throw new Error('M1_KEYSET_INVARIANT');
          if (p.m1.sourceSnapshot.pagination !== 'keyset_uuid') throw new Error('M1_KEYSET_METADATA_INVARIANT');
          if (p.m1.summary.rawRows <= 0 || p.m1.summary.canonicalUrls <= 0) throw new Error('M1_EMPTY_MANIFEST');
          if (p.m1.summary.acceptedCanonicalUrls + p.m1.summary.rejectedCanonicalUrls !== p.m1.summary.canonicalUrls) {
            throw new Error('M1_ACCOUNTING_MISMATCH');
          }
          if (p.m2.invariants.databaseWrites !== 0) throw new Error('M2_DB_WRITE_INVARIANT');
          if (p.m2.invariants.sourceNetworkRequests !== 0) throw new Error('M2_SOURCE_NETWORK_INVARIANT');
          if (p.m2.invariants.publicSearchActivations !== 0) throw new Error('M2_SEARCH_ACTIVATION_INVARIANT');
          if (p.m2.invariants.providerRelabels !== 0) throw new Error('M2_PROVIDER_RELABEL_INVARIANT');
          if (p.m2.invariants.listingClassificationViolations !== 0) throw new Error('M2_CLASSIFICATION_INVARIANT');
          if (p.m2.summary.projectedSeeds !== p.m1.summary.acceptedCanonicalUrls) throw new Error('M2_PROJECTION_ACCOUNTING_MISMATCH');
          console.log('MASS-INDEX M1-M2 invariants PASS');
          NODE

      - name: Upload MASS-INDEX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-index-m1-m2-certification
          path: |
            artifacts/mass-index/m1-m2-certification-summary.json
            artifacts/mass-index/m1-universal-candidate-promotion.json
            artifacts/mass-index/m2-external-index-seed-dry-run.json
          if-no-files-found: warn
          retention-days: 14
