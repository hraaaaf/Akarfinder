name: UNIFIED-LISTING-CARD-1 Docs Closeout

on:
  push:
    branches:
      - docs/unified-listing-card-1-closeout
    paths:
      - "scripts/audits/unified-listing-card-1-docs-closeout.mjs"
      - ".github/workflows/unified-listing-card-1-docs-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/unified-listing-card-1-closeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact closeout markers
        run: node scripts/audits/unified-listing-card-1-docs-closeout.mjs
      - name: Remove temporary closeout machinery
        run: rm scripts/audits/unified-listing-card-1-docs-closeout.mjs .github/workflows/unified-listing-card-1-docs-closeout.yml
      - name: Commit canonical docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: close UNIFIED-LISTING-CARD-1"
          git push origin HEAD:docs/unified-listing-card-1-closeout
