name: HA Isolated Sequence Failback Reconciliation

# AKARFINDER-HA06-SEQUENCE-20260924
# Disposable PostgreSQL 17 only. No provider secrets, no production DB.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - infra/neon-migration-20260923
    paths:
      - ".github/workflows/ha-isolated-sequence-failback.yml"
      - "scripts/scrapers/__tests__/ha-isolated-sequence-failback-workflow-guard.test.ts"

permissions:
  contents: read

concurrency:
  group: ha-isolated-sequence-failback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_IMAGE: postgres:17
      PG_PASSWORD: akarfinder-ha-sequence-only
      NETWORK: akarfinder-ha-sequence
      SOURCE: akarfinder-ha-sequence-source
      TARGET: akarfinder-ha-sequence-target
      REHEARSAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SEQ: public.akarfinder_ha_sequence_canary_id_seq

    steps:
      - uses: actions/checkout@v4

      - name: Start isolated PostgreSQL 17 nodes
        shell: bash
        run: |
          set -euo pipefail
          docker network create "$NETWORK"
          for node in "$SOURCE" "$TARGET"; do
            docker run -d --rm \
              --name "$node" \
              --network "$NETWORK" \
              -e POSTGRES_PASSWORD="$PG_PASSWORD" \
              -e POSTGRES_DB=postgres \
              "$PG_IMAGE" postgres \
                -c wal_level=logical \
                -c max_replication_slots=10 \
                -c max_wal_senders=10 \
                -c max_logical_replication_workers=10
          done
          for node in "$SOURCE" "$TARGET"; do
            for attempt in $(seq 1 30); do
              docker exec "$node" pg_isready -U postgres -d postgres >/dev/null 2>&1 && break
              [ "$attempt" -eq 30 ] && { echo "::error::$node did not become ready"; exit 1; }
              sleep 1
            done
          done

      - name: Create matching identity schema and fenced app role
        shell: bash
        run: |
          set -euo pipefail
          for node in "$SOURCE" "$TARGET"; do
            docker exec -i "$node" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create table public.akarfinder_ha_sequence_canary (
            id bigint generated by default as identity primary key,
            payload text not null,
            version integer not null check (version >= 1),
            updated_at timestamptz not null
          );
          alter table public.akarfinder_ha_sequence_canary replica identity default;
          create role ha_seq_writer nologin;
          grant usage on schema public to ha_seq_writer;
          grant select on public.akarfinder_ha_sequence_canary to ha_seq_writer;
          insert into public.akarfinder_ha_sequence_canary (id,payload,version,updated_at)
          overriding system value values
            (1,'baseline-1',1,'2026-09-24T00:00:00Z'::timestamptz),
            (2,'baseline-2',1,'2026-09-24T00:00:00Z'::timestamptz),
            (3,'baseline-3',1,'2026-09-24T00:00:00Z'::timestamptz);
          select setval('public.akarfinder_ha_sequence_canary_id_seq', 3, true);
          SQL
          done

          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "grant insert, update, delete on public.akarfinder_ha_sequence_canary to ha_seq_writer;
                grant usage, select on sequence public.akarfinder_ha_sequence_canary_id_seq to ha_seq_writer;"

      - name: Establish reverse Neon-sim to Supabase-sim replication
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "create publication ha_sequence_reverse_pub for table public.akarfinder_ha_sequence_canary;"
          docker exec "$SOURCE" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "create subscription ha_sequence_reverse_sub
                connection 'host=$TARGET port=5432 dbname=postgres user=postgres password=$PG_PASSWORD sslmode=disable'
                publication ha_sequence_reverse_pub
                with (copy_data=false, origin=none);"
          suborigin="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt \
            -c "select suborigin from pg_subscription where subname='ha_sequence_reverse_sub';")"
          [ "$suborigin" = "none" ] || { echo "::error::reverse origin filter is not none"; exit 1; }

      - name: Create Neon-sim incident delta with sequence divergence
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "set role ha_seq_writer;
                insert into public.akarfinder_ha_sequence_canary (payload,version,updated_at) values
                  ('incident-4',1,clock_timestamp()),
                  ('incident-5',1,clock_timestamp()),
                  ('incident-6',1,clock_timestamp());
                update public.akarfinder_ha_sequence_canary
                  set payload='baseline-2-incident', version=2, updated_at=clock_timestamp()
                  where id=2;
                delete from public.akarfinder_ha_sequence_canary where id=3;"

          for attempt in $(seq 1 30); do
            source_count="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt \
              -c "select count(*) from public.akarfinder_ha_sequence_canary;")"
            source_update="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt \
              -c "select payload||':'||version from public.akarfinder_ha_sequence_canary where id=2;")"
            source_deleted="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt \
              -c "select count(*) from public.akarfinder_ha_sequence_canary where id=3;")"
            source_max="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt \
              -c "select max(id) from public.akarfinder_ha_sequence_canary;")"
            [ "$source_count" = "5" ] && [ "$source_update" = "baseline-2-incident:2" ] && [ "$source_deleted" = "0" ] && [ "$source_max" = "6" ] && break
            [ "$attempt" -eq 30 ] && { echo "::error::reverse incident delta did not fully apply"; exit 1; }
            sleep 1
          done

      - name: Enter isolated FAILBACK_FREEZE and prove both app writers fenced
        shell: bash
        run: |
          set -euo pipefail
          freeze_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          freeze_epoch_ms="$(date +%s%3N)"
          docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "revoke insert, update, delete on public.akarfinder_ha_sequence_canary from ha_seq_writer;
                revoke usage on sequence public.akarfinder_ha_sequence_canary_id_seq from ha_seq_writer;"

          for node in "$SOURCE" "$TARGET"; do
            if docker exec "$node" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "set role ha_seq_writer;
                  insert into public.akarfinder_ha_sequence_canary (payload,version,updated_at)
                  values ('must-fail-freeze',1,clock_timestamp());"
            then
              echo "::error::$node app writer remained writable during FAILBACK_FREEZE"
              exit 1
            fi
          done

          printf 'FAILBACK_FREEZE_AT=%s\nFAILBACK_FREEZE_EPOCH_MS=%s\n' "$freeze_at" "$freeze_epoch_ms" >> "$RUNNER_TEMP/ha-sequence.env"

      - name: Prove pre-repair sequence collision risk
        shell: bash
        run: |
          set -euo pipefail
          source_last="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt \
            -c "select last_value from public.akarfinder_ha_sequence_canary_id_seq;")"
          source_called="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt \
            -c "select is_called from public.akarfinder_ha_sequence_canary_id_seq;")"
          source_increment="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt \
            -c "select increment_by from pg_sequences where schemaname='public' and sequencename='akarfinder_ha_sequence_canary_id_seq';")"
          source_max="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt \
            -c "select max(id) from public.akarfinder_ha_sequence_canary;")"
          target_last="$(docker exec "$TARGET" psql -U postgres -d postgres -X -qAt \
            -c "select last_value from public.akarfinder_ha_sequence_canary_id_seq;")"
          target_called="$(docker exec "$TARGET" psql -U postgres -d postgres -X -qAt \
            -c "select is_called from public.akarfinder_ha_sequence_canary_id_seq;")"

          [ "$source_increment" = "1" ] || { echo "::error::unexpected source sequence increment"; exit 1; }
          [ "$source_called" = "t" ] || { echo "::error::unexpected source is_called semantics"; exit 1; }

          if [ "$source_called" = "t" ]; then
            source_next_candidate="$((source_last + source_increment))"
          else
            source_next_candidate="$source_last"
          fi

          [ "$source_last" = "3" ] && [ "$target_last" = "6" ] && [ "$target_called" = "t" ] || {
            echo "::error::expected sequence divergence was not created"; exit 1;
          }
          [ "$source_next_candidate" -le "$source_max" ] || {
            echo "::error::pre-repair sequence was unexpectedly safe"; exit 1;
          }

          printf 'SOURCE_PRE_LAST=%s\nSOURCE_PRE_IS_CALLED=%s\nSOURCE_INCREMENT=%s\nSOURCE_MAX_ID=%s\nSOURCE_PRE_NEXT=%s\nTARGET_PRE_LAST=%s\nTARGET_PRE_IS_CALLED=%s\n' \
            "$source_last" "$source_called" "$source_increment" "$source_max" "$source_next_candidate" "$target_last" "$target_called" \
            >> "$RUNNER_TEMP/ha-sequence.env"

      - name: Reconcile source sequence with is_called semantics
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$SOURCE" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "select setval('public.akarfinder_ha_sequence_canary_id_seq',
                  (select max(id) from public.akarfinder_ha_sequence_canary),
                  true);"

          post_last="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt \
            -c "select last_value from public.akarfinder_ha_sequence_canary_id_seq;")"
          post_called="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt \
            -c "select is_called from public.akarfinder_ha_sequence_canary_id_seq;")"
          post_max="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt \
            -c "select max(id) from public.akarfinder_ha_sequence_canary;")"
          post_increment="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt \
            -c "select increment_by from pg_sequences where schemaname='public' and sequencename='akarfinder_ha_sequence_canary_id_seq';")"

          [ "$post_called" = "t" ] || { echo "::error::post-repair is_called must be true"; exit 1; }
          post_next="$((post_last + post_increment))"
          [ "$post_last" = "$post_max" ] && [ "$post_next" -gt "$post_max" ] || {
            echo "::error::sequence collision risk remains after repair"; exit 1;
          }

          printf 'SOURCE_POST_LAST=%s\nSOURCE_POST_IS_CALLED=%s\nSOURCE_POST_NEXT=%s\n' \
            "$post_last" "$post_called" "$post_next" >> "$RUNNER_TEMP/ha-sequence.env"

      - name: Prove final row parity before promotion
        shell: bash
        run: |
          set -euo pipefail
          metrics_sql="select count(*)::text
            ||'|'||count(distinct id)::text
            ||'|'||md5(coalesce(string_agg(id::text,',' order by id),''))
            ||'|'||md5(coalesce(string_agg(
              id::text||'~'||payload||'~'||version::text||'~'||to_char(updated_at at time zone 'UTC','YYYY-MM-DD"T"HH24:MI:SS.MS'),
              '|' order by id
            ),''))
            from public.akarfinder_ha_sequence_canary;"

          source_metrics="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt -c "$metrics_sql")"
          target_metrics="$(docker exec "$TARGET" psql -U postgres -d postgres -X -qAt -c "$metrics_sql")"

          [ "$source_metrics" = "$target_metrics" ] || {
            echo "::error::final row parity mismatch source=$source_metrics target=$target_metrics"
            exit 1
          }

          source_count="$(printf '%s' "$source_metrics" | cut -d'|' -f1)"
          source_distinct="$(printf '%s' "$source_metrics" | cut -d'|' -f2)"
          [ "$source_count" = "$source_distinct" ] || { echo "::error::duplicate primary identifiers detected"; exit 1; }

          printf 'FINAL_PARITY_METRICS=%s\n' "$source_metrics" >> "$RUNNER_TEMP/ha-sequence.env"

      - name: Promote source writer and prove first generated ID collision-free
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$SOURCE" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "grant insert, update, delete on public.akarfinder_ha_sequence_canary to ha_seq_writer;
                grant usage, select on sequence public.akarfinder_ha_sequence_canary_id_seq to ha_seq_writer;"

          generated_id="$(docker exec "$SOURCE" psql -U postgres -d postgres -X -qAt -v ON_ERROR_STOP=1 \
            -c "set role ha_seq_writer;
                insert into public.akarfinder_ha_sequence_canary (payload,version,updated_at)
                values ('post-failback-source-write',1,clock_timestamp())
                returning id;")"

          [ "$generated_id" = "7" ] || {
            echo "::error::first post-failback generated id was not collision-free expected=7 actual=$generated_id"
            exit 1
          }

          if docker exec "$TARGET" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "set role ha_seq_writer;
                insert into public.akarfinder_ha_sequence_canary (payload,version,updated_at)
                values ('must-fail-target-after-failback',1,clock_timestamp());"
          then
            echo "::error::target app writer became writable after source promotion"
            exit 1
          fi

          restored_at="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          restored_epoch_ms="$(date +%s%3N)"
          failback_rto_ms="$((restored_epoch_ms - FAILBACK_FREEZE_EPOCH_MS))"
          printf 'POST_FAILBACK_GENERATED_ID=%s\nSERVICE_RESTORED_AT=%s\nOBSERVED_FAILBACK_RTO_MS=%s\n' \
            "$generated_id" "$restored_at" "$failback_rto_ms" >> "$RUNNER_TEMP/ha-sequence.env"

      - name: Create sequence failback artifact
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/ha-sequence.env"
          set +a

          jq -n \
            --arg application_commit "$REHEARSAL_HEAD_SHA" \
            --arg github_execution_sha "$GITHUB_SHA" \
            --arg freeze_at "$FAILBACK_FREEZE_AT" \
            --arg restored_at "$SERVICE_RESTORED_AT" \
            --arg source_pre_last "$SOURCE_PRE_LAST" \
            --arg source_pre_is_called "$SOURCE_PRE_IS_CALLED" \
            --arg source_increment "$SOURCE_INCREMENT" \
            --arg source_max_id "$SOURCE_MAX_ID" \
            --arg source_pre_next "$SOURCE_PRE_NEXT" \
            --arg target_pre_last "$TARGET_PRE_LAST" \
            --arg target_pre_is_called "$TARGET_PRE_IS_CALLED" \
            --arg source_post_last "$SOURCE_POST_LAST" \
            --arg source_post_is_called "$SOURCE_POST_IS_CALLED" \
            --arg source_post_next "$SOURCE_POST_NEXT" \
            --arg final_parity_metrics "$FINAL_PARITY_METRICS" \
            --arg post_failback_generated_id "$POST_FAILBACK_GENERATED_ID" \
            --argjson observed_failback_rto_ms "$OBSERVED_FAILBACK_RTO_MS" \
            '{
              schema_version: "1.0",
              rehearsal: "HA06B_ISOLATED_SEQUENCE_FAILBACK_PG17",
              provider_specific_certification: false,
              application_commit: $application_commit,
              github_execution_sha: $github_execution_sha,
              topology: "two_disposable_postgresql_17_nodes",
              legal_state_path: ["NEON_PRIMARY","FAILBACK_SYNC","FAILBACK_FREEZE","SUPABASE_PRIMARY"],
              both_writers_fenced_during_freeze: "PASS",
              sequence_divergence_created: "PASS",
              pre_repair_collision_risk_detected: "PASS",
              sequence_repair_with_is_called_semantics: "PASS",
              final_row_parity: "PASS",
              first_post_failback_generated_id_collision_free: "PASS",
              target_writer_disabled_after_promotion: "PASS",
              sequence: {
                source_pre_last: $source_pre_last,
                source_pre_is_called: $source_pre_is_called,
                increment: $source_increment,
                max_id: $source_max_id,
                source_pre_next: $source_pre_next,
                target_pre_last: $target_pre_last,
                target_pre_is_called: $target_pre_is_called,
                source_post_last: $source_post_last,
                source_post_is_called: $source_post_is_called,
                source_post_next: $source_post_next,
                post_failback_generated_id: $post_failback_generated_id
              },
              parity_metrics: $final_parity_metrics,
              timings: {
                failback_freeze_at: $freeze_at,
                source_service_restored_at: $restored_at,
                observed_failback_rto_ms: $observed_failback_rto_ms
              },
              conflicts: 0,
              duplicates: 0,
              secrets_redacted: true,
              verdict: "ISOLATED_SEQUENCE_FAILBACK_PASS",
              limitations: [
                "Does not prove Supabase or Neon provider privileges.",
                "Does not certify provider sequence metadata.",
                "Does not certify production failback RTO.",
                "Does not mutate production or provider databases."
              ]
            }' > "$RUNNER_TEMP/HA_ISOLATED_SEQUENCE_FAILBACK.json"

      - name: Guard artifact against secret leakage
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/HA_ISOLATED_SEQUENCE_FAILBACK.json"
          test -s "$artifact"
          if grep -Eiq 'postgres(ql)?://|password|SUPABASE_DATABASE_URL|NEON_DATABASE_URL|service_role' "$artifact"; then
            echo "::error::Secret-like material detected in sequence failback artifact"
            exit 1
          fi

      - name: Upload sequence failback proof
        uses: actions/upload-artifact@v4
        with:
          name: ha-isolated-sequence-failback-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/HA_ISOLATED_SEQUENCE_FAILBACK.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop isolated nodes
        if: always()
        shell: bash
        run: |
          docker rm -f "$SOURCE" "$TARGET" >/dev/null 2>&1 || true
          docker network rm "$NETWORK" >/dev/null 2>&1 || true
