name: Live Mubawab full enumeration

on:
  push:
    branches:
      - feat/mubawab-full-enumeration
    paths:
      - '.github/workflows/live-mubawab-full.yml'
      - 'scripts/acquisition/mubawab-exhaustive-enumerator.mjs'
      - 'scripts/acquisition/mubawab-supabase-shard-runner.mjs'
      - 'scripts/acquisition/__tests__/mubawab-exhaustive-enumerator.test.mjs'
      - 'scripts/acquisition/__tests__/mubawab-supabase-shard-runner.test.mjs'

permissions:
  contents: read

concurrency:
  group: live-mubawab-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Targeted unit tests
        run: |
          node --test scripts/acquisition/__tests__/mubawab-exhaustive-enumerator.test.mjs
          node --test scripts/acquisition/__tests__/mubawab-supabase-shard-runner.test.mjs

      - name: Full robots-safe Supabase shard-manifest replay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MUBAWAB_MANIFEST_LIMIT: '100000'
          MUBAWAB_MAX_REQUESTS: '100000'
          MUBAWAB_REQUEST_DELAY_MS: '2750'
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          node scripts/acquisition/mubawab-supabase-shard-runner.mjs

      - name: Strict full certification
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/morocco-web-l8-mubawab-manifest/report.json';
          const report = JSON.parse(fs.readFileSync(p, 'utf8'));

          if (report.zeroDbWrites !== true) throw new Error('zeroDbWrites must be true');
          if (report.requestDelayMs !== 2750) throw new Error(`request delay drift: ${report.requestDelayMs}`);
          if (!(report.safeShardCount > 0)) throw new Error('safeShardCount must be > 0');
          if (report.selectedShardCount !== report.safeShardCount) {
            throw new Error(`manifest incomplete: selected=${report.selectedShardCount} safe=${report.safeShardCount}`);
          }
          if (report.requestCount !== report.selectedShardCount) {
            throw new Error(`request coverage incomplete: requests=${report.requestCount} selected=${report.selectedShardCount}`);
          }
          if (report.queueRemaining !== 0) {
            throw new Error(`queueRemaining must be 0, got ${report.queueRemaining}`);
          }
          if (report.stoppedEarly) {
            throw new Error(`unexpected early stop: ${report.stoppedEarly}`);
          }
          if (!(report.uniqueListingUrlCount > 0)) throw new Error('no listing URLs found');

          const badFetches = (report.shards || []).filter(s => s.fetchState !== 'ok');
          if (badFetches.length > 0) {
            throw new Error(`non-ok shard fetches: ${badFetches.length}`);
          }
          const missingAttribution = (report.shards || []).filter(s => !Array.isArray(s.listingIds) || !Array.isArray(s.listingUrls));
          if (missingAttribution.length > 0) {
            throw new Error(`shards missing listing attribution: ${missingAttribution.length}`);
          }

          console.log({
            sourceRowCount: report.sourceRowCount,
            safeShardCount: report.safeShardCount,
            selectedShardCount: report.selectedShardCount,
            requestCount: report.requestCount,
            requestDelayMs: report.requestDelayMs,
            uniqueListingUrlCount: report.uniqueListingUrlCount,
            queueRemaining: report.queueRemaining,
            stoppedEarly: report.stoppedEarly,
            zeroDbWrites: report.zeroDbWrites,
          });
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mubawab-full-enumeration
          path: artifacts/morocco-web-l8-mubawab-manifest/
          if-no-files-found: error
          retention-days: 14
