name: Recovery V4.11 Wave8 Filter Identity Overlaps

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/v4-11-wave8-overlap-filter-input.json"

permissions:
  contents: read
  actions: read

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate input contract
        run: |
          node - <<'NODE'
          const x=require("./data/recovery/v4-11-wave8-overlap-filter-input.json");
          if(x.source_wave8_artifact_id!==10934176431)throw new Error("wave8 artifact");
          if(x.source_overlap_artifact_id!==10934789124)throw new Error("overlap artifact");
          if(x.source_rows!==39132||x.overlap_rows!==200||x.expected_rows!==38932)throw new Error("counts");
          NODE
      - name: Download immutable inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w8" "$RUNNER_TEMP/overlap" data/audits/v4-11-wave8-filtered
          gh api repos/${{ github.repository }}/actions/artifacts/10934176431/zip > "$RUNNER_TEMP/w8.zip"
          unzip -q -o "$RUNNER_TEMP/w8.zip" -d "$RUNNER_TEMP/w8"
          gh api repos/${{ github.repository }}/actions/artifacts/10934789124/zip > "$RUNNER_TEMP/overlap.zip"
          unzip -q -o "$RUNNER_TEMP/overlap.zip" -d "$RUNNER_TEMP/overlap"
          echo "85e65311dba66008a02f1c145e1166db26c186029c22cfae1b3628e67074cb31  $RUNNER_TEMP/w8/db-ready-wave8.jsonl" | sha256sum -c -
      - name: Filter overlaps and verify invariants
        run: |
          node - "$RUNNER_TEMP/w8/db-ready-wave8.jsonl" "$RUNNER_TEMP/overlap/identity-overlaps.csv" data/audits/v4-11-wave8-filtered <<'NODE'
          const fs=require("fs"),crypto=require("crypto");
          const [src,overlapCsv,out]=process.argv.slice(2);
          const rows=fs.readFileSync(src,"utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const lines=fs.readFileSync(overlapCsv,"utf8").split(/\r?\n/).filter(Boolean).slice(1);
          const parse=line=>{const m=line.match(/^"((?:[^"]|"")*)","((?:[^"]|"")*)"$/);if(!m)throw new Error("csv");return m.slice(1).map(x=>x.replace(/""/g,'"'))};
          const overlaps=new Set(lines.map(line=>parse(line).join("|")));
          if(rows.length!==39132||overlaps.size!==200)throw new Error("input counts");
          const kept=rows.filter(r=>!overlaps.has(r.source_name+"|"+r.source_offer_key));
          if(kept.length!==38932)throw new Error("filtered count "+kept.length);
          if(new Set(kept.map(r=>r.listing_url)).size!==kept.length)throw new Error("URL duplicate");
          if(new Set(kept.map(r=>r.canonical_fingerprint)).size!==kept.length)throw new Error("fp duplicate");
          if(new Set(kept.map(r=>r.source_name+"|"+r.source_offer_key)).size!==kept.length)throw new Error("identity duplicate");
          if(kept.some(r=>![r.title,r.city,r.property_type,r.transaction_type].every(v=>v!=null&&String(v).trim()!=="")))throw new Error("core gap");
          const body=kept.map(r=>JSON.stringify(r)).join("\n")+"\n";
          fs.writeFileSync(out+"/db-ready-wave8-filtered.jsonl",body);
          const byDomain={};for(const r of kept)byDomain[r.source_name]=(byDomain[r.source_name]||0)+1;
          fs.writeFileSync(out+"/summary.json",JSON.stringify({
            schema_version:"akarfinder-v4.11-wave8-filtered-identity-overlaps-20260927",
            source_rows:rows.length,removed_identity_overlaps:overlaps.size,db_ready_rows:kept.length,by_domain:byDomain,
            output_sha256:crypto.createHash("sha256").update(body).digest("hex"),
            approved_for_import_rows:0,database_access:0,database_writes:0,production_neon_writes:0,vercel_deployment:false
          },null,2)+"\n");
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-db-ready-wave8-filtered
          path: data/audits/v4-11-wave8-filtered/
          retention-days: 30
