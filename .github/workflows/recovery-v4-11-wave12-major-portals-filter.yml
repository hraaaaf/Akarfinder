name: Recovery V4.11 Wave12 Major Portals Overlap Filter

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/v4-11-wave12-major-portals-preflight-artifact.json"

permissions:
  contents: read
  actions: read

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate binding
        run: |
          node - <<'NODE'
          const m=require("./data/recovery/v4-11-wave12-major-portals-preflight-artifact.json");
          if(!Number.isInteger(m.artifact_id)||m.artifact_id<=0)throw new Error("artifact id");
          if(!/^sha256:[0-9a-f]{64}$/.test(m.artifact_digest||""))throw new Error("digest");
          if(m.database_writes_authorized!==false)throw new Error("scope");
          NODE

      - name: Download immutable certification and preflight
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w12/cert" "$RUNNER_TEMP/w12/pf" data/audits/v4-11-wave12-major-portals-filtered
          gh api "repos/${{ github.repository }}/actions/artifacts/10963070895/zip" > "$RUNNER_TEMP/w12/cert.zip"
          unzip -q "$RUNNER_TEMP/w12/cert.zip" -d "$RUNNER_TEMP/w12/cert"
          echo "4927313e876a5365c6c216dca3cfd37f438a6eeee9809ed0cb520c1a00c448cc  $RUNNER_TEMP/w12/cert/db-ready-wave12-major-portals.jsonl" | sha256sum -c -
          PF_ID=$(node -p 'require("./data/recovery/v4-11-wave12-major-portals-preflight-artifact.json").artifact_id')
          gh api "repos/${{ github.repository }}/actions/artifacts/$PF_ID/zip" > "$RUNNER_TEMP/w12/pf.zip"
          unzip -q "$RUNNER_TEMP/w12/pf.zip" -d "$RUNNER_TEMP/w12/pf"

      - name: Remove exact overlaps fail-closed
        run: |
          node - "$RUNNER_TEMP/w12/cert/db-ready-wave12-major-portals.jsonl" "$RUNNER_TEMP/w12/pf" data/audits/v4-11-wave12-major-portals-filtered <<'NODE'
          const fs=require("fs"),crypto=require("crypto"); const [src,pf,out]=process.argv.slice(2);
          const rows=fs.readFileSync(src,"utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const csv=(p,key)=>new Set(fs.readFileSync(p,"utf8").split(/\r?\n/).slice(1).filter(Boolean).map(line=>line.replace(/^"|"$/g,"").replace(/""/g,'"')).map(x=>key?key(x):x));
          const ids=new Set(fs.readFileSync(pf+"/overlap-identities.csv","utf8").split(/\r?\n/).slice(1).filter(Boolean).map(line=>{const m=line.match(/^"?([^",]+)"?,"?([^"]*)"?$/);return m?m[1]+"|"+m[2]:line.split(",").join("|")}));
          const urls=csv(pf+"/overlap-urls.csv"), fps=csv(pf+"/overlap-fingerprints.csv");
          const kept=[]; const removed={identity:0,url:0,fingerprint:0};
          for(const r of rows){const id=r.source_name+"|"+r.source_offer_key;if(ids.has(id)){removed.identity++;continue}if(urls.has(r.listing_url)){removed.url++;continue}if(fps.has(r.canonical_fingerprint)){removed.fingerprint++;continue}kept.push(r)}
          const body=kept.map(JSON.stringify).join("\n")+(kept.length?"\n":"");
          if(new Set(kept.map(r=>r.listing_url)).size!==kept.length)throw new Error("url dup");
          if(new Set(kept.map(r=>r.canonical_fingerprint)).size!==kept.length)throw new Error("fp dup");
          if(new Set(kept.map(r=>r.source_name+"|"+r.source_offer_key)).size!==kept.length)throw new Error("id dup");
          fs.writeFileSync(out+"/db-ready-wave12-major-portals-filtered.jsonl",body);
          const by={}; for(const r of kept)by[r.source_name]=(by[r.source_name]||0)+1;
          fs.writeFileSync(out+"/summary.json",JSON.stringify({schema_version:"akarfinder-v4.11-wave12-major-portals-filtered-20260928",source_rows:rows.length,removed,db_ready_rows:kept.length,by_domain:by,output_sha256:crypto.createHash("sha256").update(body).digest("hex"),database_access:0,database_writes:0,production_neon_writes:0,approved_for_import_rows:0,vercel_deployment:false},null,2)+"\n");
          console.log(JSON.stringify({source:rows.length,removed,ready:kept.length,by},null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-wave12-major-portals-filtered
          path: data/audits/v4-11-wave12-major-portals-filtered/
          retention-days: 30
