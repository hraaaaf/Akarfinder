name: Temporary DATA-1.5 Docs Handover v2

on:
  push:
    branches:
      - docs/data-1-5-handover-20260807

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/data-1-5-handover-20260807
          fetch-depth: 0

      - name: Update canonical docs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match for {old[:70]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "README.md",
              "- `robots.txt` et sitemap sont des signaux techniques, jamais une licence ;\n- Source Registry obligatoire avant toute activation ;",
              "- `robots.txt` et sitemap sont des signaux techniques, jamais une licence ;\n- une capacité technique détectée (`Houzez`, `RealHomes`, WordPress REST, sitemap, JSON-LD, feed) ne vaut jamais permission d’ingestion ou de réutilisation ;\n- Source Registry obligatoire avant toute activation ;",
          )
          replace_once(
              "README.md",
              "- CI GitHub Actions avec tests, build, contrats DATA, accessibilité et preuves ciblées.\n",
              "- CI GitHub Actions avec tests, build, contrats DATA, accessibilité et preuves ciblées ;\n- **DATA-1.5 / PR #331** certifie le Technical Capability Audit : 20 domaines P0 audités, 19 `CAPABILITY_REVIEW_READY`, avec 3 RealHomes, 3 Houzez, 5 WordPress génériques et 8 structured-web ; score **9,4/10**, sans policy, auth, bypass, WARC ni write DB.\n",
          )

          replace_once(
              "docs/ROADMAP.md",
              "**Statut : CARTE / QUARTIER P1A.1 certifié via PR #328, merge final en attente ; P1A.2 prochain ; DATA-1.3B reste actif en lane séparée**",
              "**Statut : CARTE / QUARTIER P1A.1 ✅ PR #328 ; P1A.2 prochain en lane UX ; DATA-1.5 ✅ PR #331 ; DATA-1.6A Source Policy Evidence Review prochain en lane DATA**",
          )
          replace_once(
              "docs/ROADMAP.md",
              "- DATA-1.1 / DATA-1.2 / DATA-1.3A acquis ;\n- DATA-1.3B actif en lane DATA séparée.",
              "- DATA-1.1 / DATA-1.2 / DATA-1.3A / DATA-1.3B / DATA-1.4 acquis ;\n- **DATA-1.5 Technical Capability Audit ✅ PR #331** : 20 candidats P0 audités, 19 techniquement review-ready, familles CMS/connecteurs détectées sans aucune policy automatique ;\n- prochain lot DATA : **DATA-1.6A — Source Policy Evidence Review**, read-only avant toute écriture Source Registry.",
          )
          marker = "### Gate DATA-1\n\nAvant ingestion :\n"
          block = """### État d’exécution DATA-1 — 2026-08-07

- **DATA-1.1 ✅ PR #322** — Domain Census Core ;
- **DATA-1.2 ✅ PR #323** — 7 051 domaines / 37 009 URLs ;
- **DATA-1.3A ✅ PR #324** — Common Crawl URL Index Contract ;
- **DATA-1.3B ✅ PR #326** — 300/300 Parquet, 8 727 registered domains ;
- **DATA-1.4 ✅ PR #329** — 15 238 domaines réconciliés, 230 `PRIMARY_SOURCE_CANDIDATE` ;
- **DATA-1.5 ✅ PR #331**, merge `1f8b398`, score **9,4/10**.

Preuve DATA-1.5 : **20/20 domaines audités**, **19/20 `CAPABILITY_REVIEW_READY`**, 116 GET publics, maximum 7/domain sur budget 8, 0 write DB, 0 policy, 0 auth, 0 bypass, 0 WARC.

Familles : 3 `WORDPRESS_REALHOMES`, 3 `WORDPRESS_HOUZEZ`, 5 `WORDPRESS_GENERIC`, 4 `SITEMAP_JSONLD`, 2 `SITEMAP_STRUCTURED_HTML`, 2 `STRUCTURED_HTML`; `damaneimmo.ma` reste review-only après timeout homepage.

Candidats les plus structurés : `valfoncier.ma`, `marrakech-luxury-properties.com`, `agadirimmobilier.org`, `proimmobilier.ma`, `rabatimmo.ma`, `agadirimmobilier.ma`, `capital-properties.ma`, `immobilier-pro-maroc.com`.

**DATA-1.6A — Source Policy Evidence Review** est le prochain lot : preuves robots/noindex/CGU/licence/réutilisation/contact en lecture seule, sans écrire de policy. **DATA-1.6B — Source Registry Assignment** n’écrira ensuite que les décisions suffisamment prouvées, via le Registry existant.

"""
          replace_once("docs/ROADMAP.md", marker, block + marker)

          Path("docs/SESSION.md").write_text("""# AkarFinder — Session courante

**Mise à jour : 2026-08-07**

**Lot DATA acquis : DATA-1.5 — Candidate Technical Capability Audit ✅ PR #331**

**Prochain lot DATA : DATA-1.6A — Source Policy Evidence Review**

**Lot UX certifié : CARTE-QUARTIER-P1A.1 — Geo Canonical Core ✅ PR #328**

**Prochain lot UX : CARTE-QUARTIER-P1A.2 — Search Geo Contract**

`docs/ROADMAP.md` reste l’unique roadmap canonique.

## Main canonique

DATA-1.1 à DATA-1.5 sont acquis. DATA-1.5 est mergé via PR **#331**, merge `1f8b398`, score **9,4/10**.

Invariants : aucune migration DATA-1.5, aucune policy Source Registry automatique, aucune ingestion, aucun auth/login, aucun bypass, aucun WARC fetch.

## DATA-1.5 — preuve finale

