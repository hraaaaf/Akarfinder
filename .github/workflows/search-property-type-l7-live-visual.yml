name: Search Property Type L7 Live Visual

on:
  push:
    branches:
      - 'agent/search-property-type-l7-live-visual-cert'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture production /search
        env:
          BASE_URL: https://akarfinder.vercel.app
          AUDIT_OUTPUT_DIR: artifacts/search-property-type-l7-live
        run: node scripts/audits/search-property-type-l7-live.mjs
      - name: Upload L7 live visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-property-type-l7-live-${{ github.run_id }}
          path: artifacts/search-property-type-l7-live
          if-no-files-found: error
          retention-days: 14
