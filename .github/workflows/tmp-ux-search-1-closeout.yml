name: TEMP UX-SEARCH-1 Docs Closeout

on:
  push:
    branches:
      - ux/search-density-first
    paths:
      - ".github/workflows/tmp-ux-search-1-closeout.yml"
      - "scripts/tmp/ux-search-1-closeout.mjs"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search-density-first
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update canonical docs after certified UX-SEARCH-1
        run: node scripts/tmp/ux-search-1-closeout.mjs
      - name: Commit ROADMAP and SESSION
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md docs/SESSION.md
          if git diff --cached --quiet; then
            echo "No docs change needed"
            exit 0
          fi
          git commit -m "docs: close UX-SEARCH-1 density first"
          git push origin HEAD:ux/search-density-first
