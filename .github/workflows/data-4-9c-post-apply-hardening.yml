name: DATA-4.9C Post-Apply Hardening

on:
  push:
    branches:
      - data/data-4-9c-source-policy-decision-registry-assignment
    paths:
      - ".github/workflows/data-4-9c-post-apply-hardening.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/data-4-9c-source-policy-decision-registry-assignment
          fetch-depth: 0
      - name: Patch post-apply recognition contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('scripts/data4/source-policy-decision.ts')
          text = source.read_text()
          anchor = '''export function buildRestrictivePatch(\n'''
          addition = '''export function registryRowMatchesAppliedRestrictiveTarget(\n  row: RegistryPolicyRow,\n  decision: PolicyDecision,\n): boolean {\n  if (!decision.registryMutationPlanned || !decision.target) return false;\n  const target = decision.target;\n  const requiredEvidenceUrls = decision.evidence.map((item) => item.url);\n  return row.source_domain === decision.sourceDomain\n    && row.authorization_status === target.authorization_status\n    && row.terms_status === target.terms_status\n    && row.content_reuse_policy === target.content_reuse_policy\n    && row.detail_fetch_policy === target.detail_fetch_policy\n    && row.partnership_required === target.partnership_required\n    && row.legal_review_required === target.legal_review_required\n    && row.recommended_action === target.recommended_action\n    && row.machine_gate === target.machine_gate\n    && row.ingestion_gate === target.ingestion_gate\n    && row.display_gate === target.display_gate\n    && row.display_policy === target.display_policy\n    && row.current_representation_count === 0\n    && row.no_bypass_required === true\n    && row.review_status === "current"\n    && typeof row.policy_hash === "string"\n    && row.policy_hash.startsWith("sha256:")\n    && requiredEvidenceUrls.every((url) => row.evidence_urls.includes(url))\n    && row.policy_effective_at !== null\n    && row.evidence_observed_at !== null\n    && row.terms_observed_at !== null;\n}\n\n'''
          if anchor not in text or 'registryRowMatchesAppliedRestrictiveTarget' in text:
            raise SystemExit('source anchor missing or already patched')
          source.write_text(text.replace(anchor, addition + anchor, 1))

          tests = Path('scripts/data4/__tests__/data-4-9c-source-policy-decision.test.ts')
          text = tests.read_text()
          text = text.replace('''  registryRowMatchesSafePrecondition,\n''', '''  registryRowMatchesAppliedRestrictiveTarget,\n  registryRowMatchesSafePrecondition,\n''', 1)
          anchor = '''test("remain-unverified sources never produce Registry mutations", () => {\n'''
          addition = '''test("post-apply Agadir row is recognized only when restrictive target and evidence are intact", () => {\n  const decision = doc.sources.find((row) => row.sourceDomain === "agadirimmobilier.ma")!;\n  const applied = registryRow({\n    authorization_status: "permission_required",\n    terms_status: "permission_required",\n    content_reuse_policy: "permission_required",\n    detail_fetch_policy: "permission_required",\n    partnership_required: true,\n    legal_review_required: true,\n    recommended_action: "obtain_written_permission_before_content_reuse_or_detail_fetch",\n    machine_gate: "internal_signal_only",\n    ingestion_gate: "internal_signal_only",\n    display_gate: "hidden",\n    display_policy: "internal_signal_only",\n    evidence_urls: [\n      "https://agadirimmobilier.ma/",\n      "https://agadirimmobilier.ma/robots.txt",\n      "https://agadirimmobilier.ma/termes-et-conditions/",\n    ],\n    review_status: "current",\n    policy_hash: "sha256:test",\n    policy_effective_at: "2026-08-10T08:46:47.251Z",\n    evidence_observed_at: "2026-08-10T08:46:47.251Z",\n    terms_observed_at: "2026-08-10T08:46:47.251Z",\n  });\n  assert.equal(registryRowMatchesSafePrecondition(applied), false);\n  assert.equal(registryRowMatchesAppliedRestrictiveTarget(applied, decision), true);\n  assert.equal(registryRowMatchesAppliedRestrictiveTarget({ ...applied, display_gate: "canonical_link_only" }, decision), false);\n  assert.equal(registryRowMatchesAppliedRestrictiveTarget({ ...applied, policy_hash: null }, decision), false);\n  assert.equal(registryRowMatchesAppliedRestrictiveTarget({ ...applied, evidence_urls: ["https://agadirimmobilier.ma/"] }, decision), false);\n});\n\n'''
          if anchor not in text:
            raise SystemExit('test anchor missing')
          tests.write_text(text.replace(anchor, addition + anchor, 1))

          audit = Path('scripts/audits/data-4-9c-source-policy-decision.ts')
          text = audit.read_text()
          text = text.replace('''  patchIsNonActivating,\n  registryRowMatchesSafePrecondition,\n''', '''  patchIsNonActivating,\n  registryRowMatchesAppliedRestrictiveTarget,\n  registryRowMatchesSafePrecondition,\n''', 1)
          text = text.replace('''  const mutationPlan: MutationPlanEntry[] = [];\n  const rollbackPlan: Array<{\n''', '''  const mutationPlan: MutationPlanEntry[] = [];\n  const postApplyCertification: RegistryPolicyRow[] = [];\n  const rollbackPlan: Array<{\n''', 1)
          text = text.replace('''    mutationPlanReady: boolean;\n    blocker: string | null;\n''', '''    mutationPlanReady: boolean;\n    registryAppliedRestrictive: boolean;\n    transitionState: "PLAN_READY" | "ALREADY_APPLIED_RESTRICTIVE" | "NO_MUTATION" | "BLOCKED";\n    blocker: string | null;\n''', 1)
          text = text.replace('''    const registryPreconditionOk = registryRowMatchesSafePrecondition(before);\n\n    const observations''', '''    const registryPreconditionOk = registryRowMatchesSafePrecondition(before);\n    const registryAppliedRestrictive = decision.registryMutationPlanned\n      ? registryRowMatchesAppliedRestrictiveTarget(before, decision)\n      : false;\n\n    const observations''', 1)
          old = '''    let mutationPlanReady = false;\n    let blocker: string | null = null;\n    if (decision.registryMutationPlanned) {\n      if (!registryPreconditionOk) {\n        blocker = "registry_safe_precondition_failed";\n      } else if (!evidenceOk) {\n        blocker = "explicit_terms_evidence_failed";\n      } else {\n        const evidenceDigest = sha256(JSON.stringify(\n          observations.map((row) => ({ url: row.url, finalUrl: row.finalUrl, bodySha256: row.bodySha256, ok: row.ok })),\n        ));\n        const policyHash = `sha256:${sha256(`${decisionText}\\n${decision.sourceDomain}\\n${evidenceDigest}\\n${observedAt}`)}`;\n        const patch = buildRestrictivePatch(before, decision, observedAt, policyHash);\n        if (!patch || !patchIsNonActivating(patch)) throw new Error(`unsafe_patch:${decision.sourceDomain}`);\n        mutationPlan.push({\n          sourceDomain: decision.sourceDomain,\n          decision: "permission_required",\n          before,\n          afterPatch: patch,\n          casPreconditions: {\n            authorization_status: "unverified",\n            terms_status: before.terms_status,\n            content_reuse_policy: before.content_reuse_policy,\n            detail_fetch_policy: before.detail_fetch_policy,\n            machine_gate: "internal_signal_only",\n            ingestion_gate: "internal_signal_only",\n            display_gate: "hidden",\n            display_policy: "internal_signal_only",\n            current_representation_count: 0,\n            no_bypass_required: true,\n            updated_at: before.updated_at,\n          },\n          applyAuthorizedByCi: false,\n        });\n        rollbackPlan.push({\n          sourceDomain: decision.sourceDomain,\n          restore: before,\n          casPolicyHash: policyHash,\n          rollbackAuthorizedByCi: false,\n        });\n        mutationPlanReady = true;\n      }\n    }\n'''
          new = '''    let mutationPlanReady = false;\n    let transitionState: "PLAN_READY" | "ALREADY_APPLIED_RESTRICTIVE" | "NO_MUTATION" | "BLOCKED" = decision.registryMutationPlanned ? "BLOCKED" : "NO_MUTATION";\n    let blocker: string | null = null;\n    if (decision.registryMutationPlanned) {\n      if (!evidenceOk) {\n        blocker = "explicit_terms_evidence_failed";\n      } else if (registryAppliedRestrictive) {\n        postApplyCertification.push(before);\n        transitionState = "ALREADY_APPLIED_RESTRICTIVE";\n      } else if (!registryPreconditionOk) {\n        blocker = "registry_safe_precondition_failed";\n      } else {\n        const evidenceDigest = sha256(JSON.stringify(\n          observations.map((row) => ({ url: row.url, finalUrl: row.finalUrl, bodySha256: row.bodySha256, ok: row.ok })),\n        ));\n        const policyHash = `sha256:${sha256(`${decisionText}\\n${decision.sourceDomain}\\n${evidenceDigest}\\n${observedAt}`)}`;\n        const patch = buildRestrictivePatch(before, decision, observedAt, policyHash);\n        if (!patch || !patchIsNonActivating(patch)) throw new Error(`unsafe_patch:${decision.sourceDomain}`);\n        mutationPlan.push({\n          sourceDomain: decision.sourceDomain,\n          decision: "permission_required",\n          before,\n          afterPatch: patch,\n          casPreconditions: {\n            authorization_status: "unverified",\n            terms_status: before.terms_status,\n            content_reuse_policy: before.content_reuse_policy,\n            detail_fetch_policy: before.detail_fetch_policy,\n            machine_gate: "internal_signal_only",\n            ingestion_gate: "internal_signal_only",\n            display_gate: "hidden",\n            display_policy: "internal_signal_only",\n            current_representation_count: 0,\n            no_bypass_required: true,\n            updated_at: before.updated_at,\n          },\n          applyAuthorizedByCi: false,\n        });\n        rollbackPlan.push({\n          sourceDomain: decision.sourceDomain,\n          restore: before,\n          casPolicyHash: policyHash,\n          rollbackAuthorizedByCi: false,\n        });\n        mutationPlanReady = true;\n        transitionState = "PLAN_READY";\n      }\n    }\n'''
          if old not in text:
            raise SystemExit('audit transition block anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('''      mutationPlanReady,\n      blocker,\n''', '''      mutationPlanReady,\n      registryAppliedRestrictive,\n      transitionState,\n      blocker,\n''', 1)
          text = text.replace('''    plannedRegistryMutationCount: mutationPlan.length,\n    rollbackPlanCount: rollbackPlan.length,\n''', '''    plannedRegistryMutationCount: mutationPlan.length,\n    alreadyAppliedRestrictiveCount: postApplyCertification.length,\n    postApplyCertifiedCount: postApplyCertification.length,\n    rollbackPlanCount: rollbackPlan.length,\n''', 1)
          text = text.replace('''    nextDecision: mutationPlan.length === 1\n      ? "Apply the single CAS-restrictive Agadir policy transition outside CI, then post-certify Registry. No ingestion follows from this lot."\n      : "No Registry mutation is safe on this evidence snapshot; remain fail-closed.",\n''', '''    nextDecision: mutationPlan.length === 1\n      ? "Apply the single CAS-restrictive Agadir policy transition outside CI, then post-certify Registry. No ingestion follows from this lot."\n      : postApplyCertification.length === 1\n        ? "Restrictive Agadir policy is already applied and post-certified. Close DATA-4.9C; no ingestion follows from this lot."\n        : "No Registry transition state is safe on this evidence snapshot; remain fail-closed.",\n''', 1)
          text = text.replace('''  if (mutationPlan.length > 1 || mutationPlan.some((row) => row.sourceDomain !== "agadirimmobilier.ma")) {\n    throw new Error("DATA-4.9C unexpected mutation cohort");\n  }\n''', '''  if (mutationPlan.length > 1 || mutationPlan.some((row) => row.sourceDomain !== "agadirimmobilier.ma")) {\n    throw new Error("DATA-4.9C unexpected mutation cohort");\n  }\n  if (postApplyCertification.length > 1 || postApplyCertification.some((row) => row.source_domain !== "agadirimmobilier.ma")) {\n    throw new Error("DATA-4.9C unexpected post-apply cohort");\n  }\n  if (mutationPlan.length + postApplyCertification.length !== 1) {\n    throw new Error("DATA-4.9C expected exactly one safe Agadir transition state");\n  }\n''', 1)
          text = text.replace('''    fs.writeFile(path.join(OUT_DIR, "rollback-plan.json"), JSON.stringify(rollbackPlan, null, 2) + "\\n"),\n''', '''    fs.writeFile(path.join(OUT_DIR, "rollback-plan.json"), JSON.stringify(rollbackPlan, null, 2) + "\\n"),\n    fs.writeFile(path.join(OUT_DIR, "post-apply-certification.json"), JSON.stringify(postApplyCertification, null, 2) + "\\n"),\n''', 1)
          text = text.replace('''    plannedRegistryMutationCount: proof.plannedRegistryMutationCount,\n    evidenceFailures: proof.evidenceFailures,\n''', '''    plannedRegistryMutationCount: proof.plannedRegistryMutationCount,\n    alreadyAppliedRestrictiveCount: proof.alreadyAppliedRestrictiveCount,\n    evidenceFailures: proof.evidenceFailures,\n''', 1)
          audit.write_text(text)
          PY
      - name: Commit post-apply recognition hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data4/source-policy-decision.ts scripts/data4/__tests__/data-4-9c-source-policy-decision.test.ts scripts/audits/data-4-9c-source-policy-decision.ts
          git commit -m "DATA-4.9C: recognize certified post-apply restrictive state"
          git push origin HEAD:data/data-4-9c-source-policy-decision-registry-assignment
