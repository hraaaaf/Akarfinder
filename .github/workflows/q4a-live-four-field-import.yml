name: AkarFinder - Q4A Live Four Field Import

on:
  push:
    branches:
      - data/q4a-minimal-search-ready
    paths:
      - 'scripts/audits/q4a-live-four-field-import.ts'
      - '.github/workflows/q4a-live-four-field-import.yml'

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      Q4A_LIVE_JSONL: .tmp/q4a-live/search-ready-combined.jsonl
      Q4A_LIVE_OUT: .tmp/q4a-live-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download certified 72,834-row artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/q4a-live
          gh api repos/${{ github.repository }}/actions/artifacts/10028198847/zip > /tmp/q4a-live.zip
          unzip -q /tmp/q4a-live.zip -d .tmp/q4a-live
      - name: Publish policy-compliant existing LISTING rows
        run: npx tsx scripts/audits/q4a-live-four-field-import.ts
      - name: Verify production invariants
        run: |
          node - <<'NODE'
          const fs=require('fs')
          const s=JSON.parse(fs.readFileSync('.tmp/q4a-live-out/summary.json','utf8'))
          if (s.productionRowsUpdated <= 0) throw new Error('no production rows updated')
          if (s.sourcePolicyRegistryMutations !== 0) throw new Error('policy registry mutated')
          if (s.freshnessStatusMutations !== 0) throw new Error('freshness status mutated')
          if (s.documentKindMutations !== 0 || s.displayEligibilityMutations !== 0) throw new Error('classification/display gate mutated')
          if (s.insertedThinIndexRows !== 0) throw new Error('unexpected new thin-index rows')
          console.log(s)
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: q4a-live-four-field-import
          path: .tmp/q4a-live-out/
          retention-days: 30
