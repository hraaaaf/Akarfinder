name: Vivre Ici V1 Real Screen Readers

# Heavy certification is deliberately main-only under the repo's CI efficiency policy.
# Merge and Vercel release remain separately permissioned.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vivre-ici-v1-screenreaders-main.yml'
      - 'components/map/MapLibreNeighborhood3D.tsx'
      - 'components/map/P4MapDecisionRail.tsx'
      - 'app/map/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-screen-reader:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, reader: nvda, browser: chromium }
          - { os: macos-15, reader: voiceover, browser: webkit }
    env:
      BASE_URL: http://127.0.0.1:3205
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install project and pinned screen-reader tooling
        shell: bash
        run: |
          npm ci
          npm install --no-save --package-lock=false @guidepup/guidepup@0.40.0 @guidepup/playwright@0.21.0 @guidepup/setup@0.29.3 @playwright/test@1.65.0
      - name: Configure actual NVDA or VoiceOver on ephemeral runner
        shell: bash
        run: |
          npx @guidepup/setup setup --ci
          npx @guidepup/setup install
      - name: Install supported headed browser
        shell: bash
        run: npx playwright install ${{ matrix.browser }}
      - name: Build candidate without deploying
        shell: bash
        run: npm run build
      - name: Prepare native screen-reader test
        shell: bash
        run: |
          mkdir -p .ci-vivre-ici-sr
          cat > .ci-vivre-ici-sr/playwright.config.cjs <<'EOF_CONFIG'
          const { withGuidepup } = require('@guidepup/playwright');
          module.exports = withGuidepup({
            timeout: 150000, workers: 1, retries: 0,
            projects: [{
              name: process.platform === 'win32' ? 'nvda-chromium' : 'voiceover-webkit',
              use: { browserName: process.platform === 'win32' ? 'chromium' : 'webkit', baseURL: 'http://127.0.0.1:3205' }
            }],
            use: { trace: 'retain-on-failure', screenshot: 'only-on-failure' }
          });
          EOF_CONFIG
          cat > .ci-vivre-ici-sr/vivre-ici-screen-reader.spec.cjs <<'EOF_TEST'
          const { nvdaTest, voiceOverTest } = require('@guidepup/playwright');
          const { expect } = require('@playwright/test');
          const fs = require('node:fs');
          const path = require('node:path');
          const name = process.platform === 'win32' ? 'nvda' : 'voiceover';
          const test = process.platform === 'win32' ? nvdaTest : voiceOverTest;
          async function exercise(page, reader) {
            await page.goto('http://127.0.0.1:3205/map?city=casablanca&district=maarif&layer=explore', { waitUntil: 'domcontentloaded' });
            const shell = page.locator('[data-l3-maarif-pilot="true"]');
            await expect(shell).toBeVisible({ timeout: 25000 });
            await expect(page.getByRole('heading', { name: 'Maârif', level: 1, exact: true })).toBeVisible();
            const modes = page.locator('[data-l3-map-modes]');
            await expect(modes.locator('button')).toHaveCount(3);
            await reader.navigateToWebContent();
            let phrase = String(await reader.lastSpokenPhrase());
            const phrases = [phrase];
            for (let i = 0; i < 16 && !/Ma[âa]rif/i.test(phrase); i++) {
              await reader.nextHeading();
              phrase = String(await reader.lastSpokenPhrase());
              phrases.push(phrase);
            }
            expect(phrases.some(s => /Ma[âa]rif/i.test(s)), 'Screen reader did not announce Maârif H1').toBeTruthy();
            const street = modes.locator('[data-l3-go-street]');
            await street.focus();
            await street.press('Enter');
            await expect(shell).toHaveAttribute('data-l3-maarif-view', 'rue');
            await expect(street).toHaveAttribute('aria-pressed', 'true');
            const limits = modes.locator('[data-l3-go-admin]');
            await limits.focus();
            await limits.press('Enter');
            await expect(page.getByText('Limites non disponibles', { exact: true })).toBeVisible();
            await expect(limits).toHaveAttribute('aria-expanded', 'true');
            await page.locator('[data-l3-admin-return]').click();
            await expect(shell).toHaveAttribute('data-l3-maarif-view', 'quartier');
            await expect(limits).toHaveAttribute('aria-expanded', 'false');
            const directory = path.resolve('artifacts/vivre-ici-screen-reader');
            fs.mkdirSync(directory, { recursive: true });
            fs.writeFileSync(path.join(directory, name + '.json'), JSON.stringify({ reader: name, headingSpoken: true, phrases, modes: ['quartier','rue','limites','quartier'] }, null, 2));
          }
          if (process.platform === 'win32') {
            test('NVDA V1 spoken heading and modes', async ({ page, nvda }) => exercise(page, nvda));
          } else if (process.platform === 'darwin') {
            test('VoiceOver V1 spoken heading and modes', async ({ page, voiceOver }) => exercise(page, voiceOver));
          } else {
            throw new Error('Native-reader test requires Windows or macOS');
          }
          EOF_TEST
          node --check .ci-vivre-ici-sr/vivre-ici-screen-reader.spec.cjs
      - name: Run native screen reader against local candidate
        shell: bash
        run: |
          mkdir -p artifacts/vivre-ici-screen-reader
          npm run start -- -p 3205 > artifacts/vivre-ici-screen-reader/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3205/map?city=casablanca&district=maarif&layer=explore' >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS 'http://127.0.0.1:3205/map?city=casablanca&district=maarif&layer=explore' >/dev/null
          npx playwright test .ci-vivre-ici-sr/vivre-ici-screen-reader.spec.cjs --config=.ci-vivre-ici-sr/playwright.config.cjs --reporter=line
      - name: Upload native accessibility evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivre-ici-native-${{ matrix.reader }}-${{ github.run_id }}
          path: |
            artifacts/vivre-ici-screen-reader/
            test-results/
          if-no-files-found: warn
          retention-days: 14
