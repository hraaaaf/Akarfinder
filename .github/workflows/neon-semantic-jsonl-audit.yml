          mkdir -p .tmp/freeze
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10910779576/zip" \
            -o .tmp/freeze.zip
          unzip -q .tmp/freeze.zip -d .tmp/freeze
          test "$(jq -r '.rows' .tmp/freeze/clean-corpus-v4.11-core-manifest.json)" = "226286"
          test "$(jq -r '.database_access' .tmp/freeze/clean-corpus-v4.11-core-manifest.json)" = "0"
          echo "e7ac4bca2db34ad334ed7234cfb8be93fc9baca68a9694f5024989b5cc2bb953  .tmp/freeze/clean-corpus-v4.11-core.jsonl.gz" | sha256sum -c -
      - name: Benchmark Aykana from freeze
        run: node scripts/data/github-freeze-recovery-benchmark.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: aykana-freeze-recovery-benchmark
          path: |
            aykana-freeze-recovery-benchmark.json
            aykana-freeze-recovery-benchmark.jsonl
            aykana-freeze-recovery-benchmark-offline-cohort.jsonl
            aykana-freeze-recovery-benchmark-offline-write-safe.jsonl
            aykana-freeze-recovery-benchmark-offline-review.jsonl
          retention-days: 14
