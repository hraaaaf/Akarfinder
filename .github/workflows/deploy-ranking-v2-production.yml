name: Deploy Ranking v2 Production

on:
  push:
    branches:
      - ops/ranking-v2-production-deploy
    paths:
      - '.github/workflows/deploy-ranking-v2-production.yml'

concurrency:
  group: deploy-ranking-v2-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_NNhXPDOIfjGNBcn253btpyk0
      VERCEL_PROJECT_ID: prj_RCs2Ku5vex9cpABWnwaCjbuKrhhc
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify Ranking v2 is on main
        run: grep -q 'search_public_representations_v2' lib/search-gateway/public-search-cursor.ts
      - name: Verify Vercel credentials
        run: test -n "$VERCEL_TOKEN"
      - run: npm ci
      - name: Pull production environment
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production bundle
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt production bundle
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
