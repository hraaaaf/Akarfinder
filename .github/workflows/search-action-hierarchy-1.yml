name: SEARCH-ACTION-HIERARCHY-1 Gate

on:
  pull_request:
    paths:
      - "components/search/SearchListingCardDark.tsx"
      - "components/search/ExternalIndexedResultCard.tsx"
      - "scripts/scrapers/__tests__/search-action-hierarchy-1.test.ts"
      - "scripts/scrapers/__tests__/search-mobile-card-grid-1.test.ts"
      - "scripts/audits/search-action-hierarchy-1-visual.mjs"
      - ".github/workflows/search-action-hierarchy-1.yml"
      - "README.md"
      - "docs/ROADMAP.md"
      - "docs/SESSION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Action hierarchy contract
        run: npx tsx --test scripts/scrapers/__tests__/search-action-hierarchy-1.test.ts
      - name: Mobile grid predecessor
        run: npx tsx --test scripts/scrapers/__tests__/search-mobile-card-grid-1.test.ts
      - name: Deterministic attribution predecessor
        run: npx tsx --test scripts/scrapers/__tests__/deterministic-attribution-1.test.ts
      - name: Search truth regressions
        run: npx tsx --test scripts/scrapers/__tests__/search-truth-tier.test.ts scripts/scrapers/__tests__/search-wording-purity-1.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build rehearsal
        run: npm run build

  visual-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start > /tmp/akarfinder-search-action-hierarchy.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/akarfinder-search-action-hierarchy.log
          exit 1
      - name: Capture and assert Search card action hierarchy
        run: node scripts/audits/search-action-hierarchy-1-visual.mjs
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-action-hierarchy-1-visual-proof
          path: |
            data/audits/search-action-hierarchy-1
            /tmp/akarfinder-search-action-hierarchy.log
          retention-days: 14
          if-no-files-found: error
