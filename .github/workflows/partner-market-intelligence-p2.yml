name: Partner Market Intelligence P5 (offline regression)

on:
  pull_request:
    paths:
      - "lib/partners/partner-listing-v2.ts"
      - "lib/feeds/partner-v2-bridge.ts"
      - "lib/geo/national-partner-geo-resolver.ts"
      - "lib/market/partner-market-aggregator-v2.ts"
      - "lib/market/partner-market-downstream-v2.ts"
      - "scripts/import-partner-csv.ts"
      - "scripts/scrapers/__tests__/partner-listing-v2.test.ts"
      - "scripts/scrapers/__tests__/partner-feed-v2-bridge.test.ts"
      - "scripts/scrapers/__tests__/national-partner-geo-resolver.test.ts"
      - "scripts/scrapers/__tests__/partner-market-aggregator-v2.test.ts"
      - "scripts/scrapers/__tests__/partner-market-downstream-v2.test.ts"
      - "scripts/scrapers/__tests__/partner-csv-write-boundary-p5.test.ts"
      - ".github/workflows/partner-market-intelligence-p2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partner-market-intelligence-p5-offline-${{ github.ref }}
  cancel-in-progress: true

# CI/PR deliberately has NO remote DB credentials and NO hosted DB calls.
# This verifies synthetic partner logic ONLY, not the P5 render AFTER certification.
jobs:
  partner-pipeline-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Assert hosted DB credentials not injected
        shell: bash
        run: |
          set -euo pipefail
          for key in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_DATABASE_URL_DIRECT DATABASE_URL NEXT_PUBLIC_SUPABASE_URL; do
            if [ -n "${!key:-}" ]; then
              echo "::error::Unexpected hosted DB configuration: $key"
              exit 1
            fi
          done
          echo "No hosted database environment configured"
      - name: Partner pipeline P2-P5 synthetic regression + legacy write boundary
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/partner-listing-v2.test.ts
          scripts/scrapers/__tests__/partner-feed-v2-bridge.test.ts
          scripts/scrapers/__tests__/national-partner-geo-resolver.test.ts
          scripts/scrapers/__tests__/partner-market-aggregator-v2.test.ts
          scripts/scrapers/__tests__/partner-market-downstream-v2.test.ts
          scripts/scrapers/__tests__/partner-csv-write-boundary-p5.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
