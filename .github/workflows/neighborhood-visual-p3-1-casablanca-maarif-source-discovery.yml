name: Neighborhood Visual P3.1 Casablanca Maârif Source Discovery

on:
  push:
    branches:
      - agent/neighborhood-visual-p3-1-casablanca-maarif-discovery
  pull_request:
    paths:
      - .github/workflows/neighborhood-visual-p3-1-casablanca-maarif-source-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit exact Wikimedia Commons candidates
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, re, urllib.parse, urllib.request

          OUT = pathlib.Path('data/audits/neighborhood-visual-p3-1-casablanca-maarif-source-discovery')
          OUT.mkdir(parents=True, exist_ok=True)
          titles = [
              'File:Maârif, Morocco - panoramio (1).jpg',
              'File:Maârif, Morocco - panoramio (3).jpg',
              'File:Maârif, Morocco - panoramio (6).jpg',
              'File:Maârif, Morocco - panoramio (9).jpg',
              "File:Renovation d'un trottoir à Casablanca en décembre 2022 - 1.jpg",
              'File:Plaque de la Rue Al Kadi Iyass à Maârif, Casablanca.jpg',
              'File:Parfumerie jura, Maârif, Casablanca.jpg',
              'File:Casa finance city 4.jpg',
          ]
          params = {
              'action':'query','format':'json','formatversion':'2','prop':'imageinfo|categories',
              'iiprop':'url|size|sha1|mime|extmetadata|commonmetadata','iiurlwidth':'1280',
              'cllimit':'max','titles':'|'.join(titles),
          }
          url='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url, headers={'User-Agent':'AkarFinder/1.0 (P3.1 Maârif read-only source discovery)'})
          with urllib.request.urlopen(req, timeout=40) as r:
              payload=json.load(r)
          rows=[]
          for idx,page in enumerate(payload.get('query',{}).get('pages',[]),1):
              ii=(page.get('imageinfo') or [{}])[0]
              ext=ii.get('extmetadata') or {}
              cats=[c.get('title','') for c in page.get('categories',[])]
              thumb=ii.get('thumburl') or ii.get('url')
              title=page.get('title','')
              row={
                  'title':title,'pageid':page.get('pageid'),'missing':page.get('missing',False),
                  'width':ii.get('width'),'height':ii.get('height'),'bytes':ii.get('size'),'sha1':ii.get('sha1'),
                  'mime':ii.get('mime'),'thumburl':thumb,'original_url':ii.get('url'),
                  'license':(ext.get('LicenseShortName') or {}).get('value'),
                  'license_url':(ext.get('LicenseUrl') or {}).get('value'),
                  'artist':re.sub('<[^>]+>',' ',(ext.get('Artist') or {}).get('value','')).strip(),
                  'credit':re.sub('<[^>]+>',' ',(ext.get('Credit') or {}).get('value','')).strip(),
                  'description':re.sub('<[^>]+>',' ',(ext.get('ImageDescription') or {}).get('value','')).strip(),
                  'date_time_original':(ext.get('DateTimeOriginal') or {}).get('value'),
                  'categories':cats,
                  'no_fop_morocco':any('NoFoP-Morocco' in c for c in cats),
              }
              if thumb:
                  suffix=pathlib.Path(urllib.parse.urlparse(thumb).path).suffix or '.jpg'
                  dest=OUT/f'{idx:02d}-{re.sub(r"[^a-z0-9]+","-",title.lower())[:70].strip("-")}{suffix}'
                  req2=urllib.request.Request(thumb,headers={'User-Agent':'AkarFinder/1.0 (P3.1 Maârif read-only source discovery)'})
                  with urllib.request.urlopen(req2,timeout=40) as r:
                      data=r.read()
                  dest.write_bytes(data)
                  row['downloaded_file']=dest.name
                  row['download_sha1']=hashlib.sha1(data).hexdigest()
                  row['download_bytes']=len(data)
              rows.append(row)
          report={'scope':'P3.1 Casablanca Maârif read-only source discovery','candidate_count':len(rows),'candidates':rows}
          (OUT/'candidates.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if len(rows) != len(titles):
              raise SystemExit(f'Expected {len(titles)} candidates, got {len(rows)}')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Upload discovery proof
        uses: actions/upload-artifact@v4
        with:
          name: neighborhood-visual-p3-1-casablanca-maarif-source-discovery
          path: data/audits/neighborhood-visual-p3-1-casablanca-maarif-source-discovery
          retention-days: 14
          if-no-files-found: error
