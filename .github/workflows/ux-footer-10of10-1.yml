name: UX-FOOTER-10OF10-1 Exact Visual Certification

on:
  pull_request:
    paths:
      - "components/landing/SiteFooter.tsx"
      - "app/search/page.tsx"
      - "scripts/audits/ux-footer-10of10-1.mjs"
      - "scripts/scrapers/__tests__/ux-footer-10of10-1.test.ts"
      - ".github/workflows/ux-footer-10of10-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-design-reviewer:
    name: Product Design Reviewer — Footer 10/10
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SEARCH_GATEWAY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Footer + frozen predecessor contracts
        run: npx tsx --test scripts/scrapers/__tests__/ux-footer-10of10-1.test.ts scripts/scrapers/__tests__/ux-bottom-nav-10of10-1.test.ts scripts/scrapers/__tests__/ux-results-toolbar-10of10-1.test.ts scripts/scrapers/__tests__/ux-cards-10of10-1.test.ts scripts/scrapers/__tests__/ux-visual-inventory-10of10-1.test.ts scripts/scrapers/__tests__/phase1-final-design-a11y.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3175 > /tmp/footer-product.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3175/search >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/footer-product.log
          exit 1
      - name: Exact footer visual contract
        env:
          BASE_URL: http://127.0.0.1:3175
          AUDIT_VARIANT: product-design
        run: node scripts/audits/ux-footer-10of10-1.mjs
      - name: Replay frozen Search visual certification
        env:
          BASE_URL: http://127.0.0.1:3175
          AUDIT_VARIANT: footer-product-design
          AUDIT_DIR: data/audits/ux-footer-10of10-1/product-design/search-predecessor
        run: node scripts/audits/ux-search-final-visual-certification-7.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-footer-10of10-product-design-proof
          path: data/audits/ux-footer-10of10-1/product-design
          if-no-files-found: error
          retention-days: 14

  independent-release-certifier:
    name: Independent Release Certifier — Footer 10/10
    needs: product-design-reviewer
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SEARCH_GATEWAY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Independent footer + frozen predecessor contracts
        run: npx tsx --test scripts/scrapers/__tests__/ux-footer-10of10-1.test.ts scripts/scrapers/__tests__/ux-bottom-nav-10of10-1.test.ts scripts/scrapers/__tests__/ux-results-toolbar-10of10-1.test.ts scripts/scrapers/__tests__/ux-cards-10of10-1.test.ts scripts/scrapers/__tests__/ux-visual-inventory-10of10-1.test.ts scripts/scrapers/__tests__/phase1-final-design-a11y.test.ts
      - name: Independent TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium independently
        run: npx playwright install --with-deps chromium
      - name: Independent production build
        run: npm run build
      - name: Start independent production server
        shell: bash
        run: |
          npm run start -- -p 3176 > /tmp/footer-release.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3176/search >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/footer-release.log
          exit 1
      - name: Independently replay exact footer visual contract
        env:
          BASE_URL: http://127.0.0.1:3176
          AUDIT_VARIANT: release-certifier
        run: node scripts/audits/ux-footer-10of10-1.mjs
      - name: Independently replay frozen Search visual certification
        env:
          BASE_URL: http://127.0.0.1:3176
          AUDIT_VARIANT: footer-release-certifier
          AUDIT_DIR: data/audits/ux-footer-10of10-1/release-certifier/search-predecessor
        run: node scripts/audits/ux-search-final-visual-certification-7.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-footer-10of10-release-certifier-proof
          path: data/audits/ux-footer-10of10-1/release-certifier
          if-no-files-found: error
          retention-days: 14
