name: Neighborhood Visual P1.4 Hassan Source Discovery

on:
  pull_request:
    paths:
      - ".github/workflows/neighborhood-visual-p1-4-hassan-source-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Hassan Commons candidates
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/audits/neighborhood-visual-p1-4-hassan/source-discovery"
          rm -rf "$OUT" && mkdir -p "$OUT"
          UA='AkarFinder-P1.4-Hassan/2.0'
          declare -A FILES=(
            [signature]='نافورة صومعة حسان.jpg'
            [immobilier]='Avenue Hassan II Rabat.jpg'
            [lifestyle]='Quartier Hassan, Rabat, Morocco - panoramio (1).jpg'
          )
          for role in signature immobilier lifestyle; do
            f="${FILES[$role]}"
            enc=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$f")
            curl --fail --location --retry 5 --retry-all-errors --user-agent "$UA" "https://commons.wikimedia.org/wiki/Special:Redirect/file/$enc" -o "$OUT/$role.jpg"
            printf '%s  %s\n' "$(sha1sum "$OUT/$role.jpg" | awk '{print $1}')" "$role.jpg"
            python3 - "$OUT/$role.jpg" <<'PY'
import struct,sys
p=sys.argv[1]; b=open(p,'rb').read(); i=2
while i+9<len(b):
    if b[i]!=0xff: i+=1; continue
    m=b[i+1]; i+=2
    if m in (0xd8,0xd9): continue
    if i+2>len(b): break
    n=(b[i]<<8)|b[i+1]
    if m in (0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf):
        print('DIM',p,(b[i+5]<<8)|b[i+6],(b[i+3]<<8)|b[i+4]); break
    i+=n
PY
            wc -c "$OUT/$role.jpg"
          done
          sha1sum "$OUT"/*.jpg > "$OUT/sha1.txt"
          wc -c "$OUT"/*.jpg > "$OUT/bytes.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: neighborhood-visual-p1-4-hassan-source-discovery
          path: data/audits/neighborhood-visual-p1-4-hassan/source-discovery
          if-no-files-found: error
          retention-days: 7
