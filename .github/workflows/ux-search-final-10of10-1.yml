name: UX-SEARCH-FINAL-10OF10-1 Full Page Certification

on:
  pull_request:
    paths:
      - ".github/workflows/ux-search-final-10of10-1.yml"
      - "app/search/**"
      - "components/layout/**"
      - "components/search/**"
      - "components/landing/SiteFooter.tsx"
      - "lib/search/**"
      - "lib/listings/**"
      - "scripts/audits/ux-*.mjs"
      - "scripts/scrapers/__tests__/ux-*.test.ts"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SEARCH_GATEWAY_ENABLED: "false"

jobs:
  product-design-reviewer:
    name: Product Design Reviewer — Full Search 10/10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: All frozen Search section contracts
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/ux-header-10of10-1.test.ts
          scripts/scrapers/__tests__/ux-search-controls-10of10-1.test.ts
          scripts/scrapers/__tests__/ux-results-toolbar-10of10-1.test.ts
          scripts/scrapers/__tests__/ux-cards-10of10-1.test.ts
          scripts/scrapers/__tests__/ux-visual-inventory-10of10-1.test.ts
          scripts/scrapers/__tests__/ux-bottom-nav-10of10-1.test.ts
          scripts/scrapers/__tests__/ux-footer-10of10-1.test.ts
          scripts/scrapers/__tests__/phase1-final-design-a11y.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3185 > /tmp/search-final-product.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3185/search >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/search-final-product.log
          exit 1
      - name: Full Search visual certification — six viewports
        env:
          BASE_URL: http://127.0.0.1:3185
          AUDIT_VARIANT: search-final-product-design
          AUDIT_DIR: data/audits/ux-search-final-10of10-1/product-design/search-page
        run: node scripts/audits/ux-search-final-visual-certification-7.mjs
      - name: Real-photo Visual Inventory replay
        env:
          BASE_URL: http://127.0.0.1:3185
          AUDIT_VARIANT: search-final-product-design
        run: node scripts/audits/ux-visual-inventory-10of10-1.mjs
      - name: Mobile bottom navigation exact replay
        env:
          BASE_URL: http://127.0.0.1:3185
          AUDIT_VARIANT: search-final-product-design
        run: node scripts/audits/ux-bottom-nav-10of10-1.mjs
      - name: Footer exact replay
        env:
          BASE_URL: http://127.0.0.1:3185
          AUDIT_VARIANT: search-final-product-design
        run: node scripts/audits/ux-footer-10of10-1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-search-final-10of10-product-design-proof
          path: |
            data/audits/ux-search-final-10of10-1/product-design
            data/audits/ux-visual-inventory-10of10-1/search-final-product-design
            data/audits/ux-bottom-nav-10of10-1/search-final-product-design
            data/audits/ux-footer-10of10-1/search-final-product-design
          if-no-files-found: error
          retention-days: 14

  independent-release-certifier:
    name: Independent Release Certifier — Full Search 10/10
    needs: product-design-reviewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Independently replay all frozen Search section contracts
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/ux-header-10of10-1.test.ts
          scripts/scrapers/__tests__/ux-search-controls-10of10-1.test.ts
          scripts/scrapers/__tests__/ux-results-toolbar-10of10-1.test.ts
          scripts/scrapers/__tests__/ux-cards-10of10-1.test.ts
          scripts/scrapers/__tests__/ux-visual-inventory-10of10-1.test.ts
          scripts/scrapers/__tests__/ux-bottom-nav-10of10-1.test.ts
          scripts/scrapers/__tests__/ux-footer-10of10-1.test.ts
          scripts/scrapers/__tests__/phase1-final-design-a11y.test.ts
      - name: Independent TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium independently
        run: npx playwright install --with-deps chromium
      - name: Independent production build
        run: npm run build
      - name: Start independent production server
        shell: bash
        run: |
          npm run start -- -p 3186 > /tmp/search-final-release.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3186/search >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/search-final-release.log
          exit 1
      - name: Independently certify full Search — six viewports
        env:
          BASE_URL: http://127.0.0.1:3186
          AUDIT_VARIANT: search-final-release-certifier
          AUDIT_DIR: data/audits/ux-search-final-10of10-1/release-certifier/search-page
        run: node scripts/audits/ux-search-final-visual-certification-7.mjs
      - name: Independently replay real-photo Visual Inventory
        env:
          BASE_URL: http://127.0.0.1:3186
          AUDIT_VARIANT: search-final-release-certifier
        run: node scripts/audits/ux-visual-inventory-10of10-1.mjs
      - name: Independently replay mobile bottom navigation
        env:
          BASE_URL: http://127.0.0.1:3186
          AUDIT_VARIANT: search-final-release-certifier
        run: node scripts/audits/ux-bottom-nav-10of10-1.mjs
      - name: Independently replay Footer
        env:
          BASE_URL: http://127.0.0.1:3186
          AUDIT_VARIANT: search-final-release-certifier
        run: node scripts/audits/ux-footer-10of10-1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-search-final-10of10-release-certifier-proof
          path: |
            data/audits/ux-search-final-10of10-1/release-certifier
            data/audits/ux-visual-inventory-10of10-1/search-final-release-certifier
            data/audits/ux-bottom-nav-10of10-1/search-final-release-certifier
            data/audits/ux-footer-10of10-1/search-final-release-certifier
          if-no-files-found: error
          retention-days: 14
