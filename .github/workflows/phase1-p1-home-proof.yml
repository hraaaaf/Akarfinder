name: Phase 1 P1 Home Proof Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "app/page.tsx"
      - "components/home/**"
      - "components/landing/**"
      - "lib/market-pulse/**"
      - "lib/sources/source-access-registry.ts"
      - "scripts/scrapers/__tests__/home-proof-ux.test.ts"
      - "scripts/scrapers/__tests__/home-motor-purity.test.ts"
      - ".github/workflows/phase1-p1-home-proof.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  home-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Home proof contracts
        run: |
          npx tsx --test scripts/scrapers/__tests__/home-proof-ux.test.ts
          npx tsx --test --test-skip-pattern="hero wording aligné avec la doctrine" scripts/scrapers/__tests__/home-motor-purity.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build rehearsal
        run: npm run build
