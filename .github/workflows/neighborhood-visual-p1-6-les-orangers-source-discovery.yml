name: Neighborhood Visual P1.6 Les Orangers Source Discovery

on:
  pull_request:
    paths:
      - ".github/workflows/neighborhood-visual-p1-6-les-orangers-source-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Discover reusable Commons imagery near Les Orangers
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/audits/neighborhood-visual-p1-6-les-orangers/source-discovery"
          mkdir -p "$OUT/images"
          UA='AkarFinder-P1.6-Les-Orangers/1.0'
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, pathlib, hashlib
          out=pathlib.Path('data/audits/neighborhood-visual-p1-6-les-orangers/source-discovery')
          ua={'User-Agent':'AkarFinder-P1.6-Les-Orangers/1.0'}
          api='https://commons.wikimedia.org/w/api.php'
          titles=[]
          def call(params):
              url=api+'?'+urllib.parse.urlencode(params)
              return json.load(urllib.request.urlopen(urllib.request.Request(url,headers=ua), timeout=30))
          for q in ['"Quartier Des Orangers" Rabat','Les Orangers Rabat','Orangers Rabat Morocco']:
              data=call({'action':'query','generator':'search','gsrsearch':q,'gsrnamespace':6,'gsrlimit':20,'prop':'imageinfo','iiprop':'url|size|sha1|extmetadata','format':'json'})
              for p in (data.get('query',{}).get('pages',{}) or {}).values():
                  if p.get('title'): titles.append(p['title'])
          geo=call({'action':'query','generator':'geosearch','ggsprimary':'all','ggsnamespace':6,'ggscoord':'34.016912|-6.836610','ggsradius':1800,'ggslimit':80,'prop':'imageinfo','iiprop':'url|size|sha1|extmetadata','format':'json'})
          for p in (geo.get('query',{}).get('pages',{}) or {}).values():
              if p.get('title'): titles.append(p['title'])
          seen=[]
          for t in titles:
              if t not in seen: seen.append(t)
          rows=[]
          for t in seen:
              d=call({'action':'query','titles':t,'prop':'imageinfo','iiprop':'url|size|sha1|extmetadata','format':'json'})
              p=next(iter(d.get('query',{}).get('pages',{}).values()),{})
              ii=(p.get('imageinfo') or [{}])[0]
              ext=ii.get('extmetadata') or {}
              lic=(ext.get('LicenseShortName') or {}).get('value','')
              desc=(ext.get('ImageDescription') or {}).get('value','')
              artist=(ext.get('Artist') or {}).get('value','')
              rows.append({'title':t,'url':ii.get('url'),'width':ii.get('width'),'height':ii.get('height'),'size':ii.get('size'),'sha1':ii.get('sha1'),'license':lic,'description':desc[:500],'artist':artist[:300]})
          (out/'candidates.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          # Download only openly licensed candidates, cap at 20.
          n=0
          for r in rows:
              if n>=20: break
              lic=(r.get('license') or '').lower()
              if not any(x in lic for x in ['cc by','public domain','cc0']): continue
              url=r.get('url')
              if not url: continue
              try:
                  b=urllib.request.urlopen(urllib.request.Request(url,headers=ua), timeout=40).read()
              except Exception:
                  continue
              fn=f'{n:02d}.jpg'
              (out/'images'/fn).write_bytes(b)
              r['download']=fn; r['actual_sha1']=hashlib.sha1(b).hexdigest(); r['actual_bytes']=len(b); n+=1
          (out/'candidates.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neighborhood-visual-p1-6-les-orangers-source-discovery
          path: data/audits/neighborhood-visual-p1-6-les-orangers/source-discovery
          if-no-files-found: error
          retention-days: 7
