name: Landmark Factory AUC Anfa Vector Inspect

on:
  pull_request:
    paths:
      - ".github/workflows/landmark-factory-auc-anfa-vector-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF vector inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Download official AUC Anfa plan
        run: |
          mkdir -p artifacts/anfa-vector
          curl --fail --location --retry 3 \
            --user-agent "Mozilla/5.0 AkarFinder-Landmark-Factory/1.0" \
            --output artifacts/anfa-vector/PA-ANFA-5000-0.pdf \
            https://www.auc.ma/wp-content/uploads/2020/05/PA-ANFA-5000-0.pdf
          pdfinfo artifacts/anfa-vector/PA-ANFA-5000-0.pdf | tee artifacts/anfa-vector/pdfinfo.txt
          pdfimages -list artifacts/anfa-vector/PA-ANFA-5000-0.pdf | tee artifacts/anfa-vector/pdfimages.txt
          pdffonts artifacts/anfa-vector/PA-ANFA-5000-0.pdf | tee artifacts/anfa-vector/pdffonts.txt

      - name: Convert each official plan sheet to SVG
        run: |
          for p in 1 2 3; do
            pdftocairo -f "$p" -l "$p" -svg artifacts/anfa-vector/PA-ANFA-5000-0.pdf "artifacts/anfa-vector/sheet-$p.svg"
          done
          python - <<'PY'
          import json,re
          from pathlib import Path
          rows=[]
          for p in range(1,4):
              path=Path(f"artifacts/anfa-vector/sheet-{p}.svg")
              s=path.read_text(encoding="utf-8",errors="ignore")
              rows.append({
                  "page":p,
                  "bytes":path.stat().st_size,
                  "path_count":len(re.findall(r"<path\b",s)),
                  "image_count":len(re.findall(r"<image\b",s)),
                  "text_count":len(re.findall(r"<text\b",s)),
                  "dasharray_count":len(re.findall(r"stroke-dasharray",s)),
                  "clip_path_count":len(re.findall(r"<clipPath\b",s)),
              })
          payload={
              "schema_version":1,
              "evidence_role":"AUC_ANFA_VECTOR_INSPECTION_ONLY",
              "activation_allowed":False,
              "geometry_promotion_allowed":False,
              "source_url":"https://www.auc.ma/wp-content/uploads/2020/05/PA-ANFA-5000-0.pdf",
              "sheets":rows,
              "guardrails":[
                  "Vector presence alone does not identify or certify a product-neighborhood boundary.",
                  "No path is promoted until its semantic role is independently identified from the official legend and source.",
                  "No manual tracing or inferred road-loop closure is allowed."
              ]
          }
          Path("artifacts/anfa-vector/vector-summary.json").write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(payload,indent=2))
          if not any(x["path_count"]>100 for x in rows):
              raise SystemExit("No substantial vector path content detected")
          PY

      - name: Upload vector inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: landmark-factory-auc-anfa-vector-inspect
          path: artifacts/anfa-vector/
          if-no-files-found: error
