name: Kaynly Public Landing Source Links
on:
  pull_request:
    paths:
      - 'scripts/acquisition/kaynly-open-links/**'
      - '.github/workflows/kaynly-public-links.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-links:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline tests
        working-directory: scripts/acquisition/kaynly-open-links
        run: |
          python -m compileall -q collector.py test_collector.py
          python -m unittest -v test_collector.py
      - name: Limited read-only sitemap acquisition
        id: scan
        continue-on-error: true
        working-directory: scripts/acquisition/kaynly-open-links
        run: |
          python collector.py --out ../../../artifacts/kaynly-source-links --max-pages 60 --delay 1.3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaynly-source-link-evidence
          path: artifacts/kaynly-source-links/
          if-no-files-found: warn
          retention-days: 7
      - name: Fail if acquisition yielded no source URLs
        if: steps.scan.outcome != 'success'
        run: exit 1
