name: Casablanca Geometry Canary Certification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Canary contracts
        run: npx tsx --test scripts/scrapers/__tests__/casablanca-geometry-canary.test.ts scripts/scrapers/__tests__/neighborhood-geometry-registry.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build rehearsal
        run: npm run build
