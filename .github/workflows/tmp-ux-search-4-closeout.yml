name: TEMP UX-SEARCH-4 Certified Closeout

on:
  push:
    branches:
      - ux/search-visual-inventory-4
    paths:
      - ".github/workflows/tmp-ux-search-4-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search-visual-inventory-4
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update canonical UX/Search closeout docs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const certifiedHead = 'c1de08a2323b29ab8cef25818e320ff8c991b3d4';
          const specializedRun = '31444537676';
          const baselineRun = '31444276171';
          const nextLot = 'UX-SEARCH-5 — Navigation & Hierarchy Polish';
          const score = '9,5/10';

          const closeout = [
            '<!-- UX-SEARCH-4-CLOSEOUT-START -->',
            '## UX-SEARCH-4 — Visual Inventory System ✅ CERTIFIED — PR #482',
            '',
            'Responsabilité unique : **améliorer la diversité, la pertinence et la qualité perçue des visuels Search sans inventer de photo du bien**, sans modifier DATA, ranking, Source Registry, dédup, prix, ordre commercial ni logique Map.',
            '',
            'Résultat certifié :',
            '',
            '- audit production read-only préalable, run `' + baselineRun + '` : **288 cards observées / 288 fallbacks génériques / 276 paires adjacentes dupliquées**, 0 image cassée, 0 overflow ; preuve que le stock contextuel existant n’était pas consommé par la card interne dominante ;',
            '- hiérarchie visuelle canonique interne + Gateway : **photo du bien autorisée → photo d’ambiance quartier bornée → illustration contextuelle ville/type → illustration type → neutre** ;',
            '- aucune inférence depuis titre, description ou snippet ; aucun hasard ; resolver contextuel HRW/Rendezvous existant réutilisé avec champs structurés ville/quartier/type + URL stable uniquement ; hors allowlist = fail-closed vers fallback générique ;',
            '- Rabat real-photo exact `city + neighborhood` garde la priorité et conserve `Photo d’ambiance` + crédit/licence Wikimedia Commons ;',
            '- fixture indépendante 14 cards : **11 illustrations contextuelles = 11 IDs distincts + 1 photo d’ambiance Agdal + 2 fallbacks génériques hors allowlist**, stable après reload sur les 6 viewports ;',
            '- densité préservée : **360/390=2 colonnes, 768=2, 1024=3, 1280/1440=4** ; première card **201 px mobile**, **213,8 px tablette**, **211,8 px desktop** ; max **342,9 px mobile**, **398,5 px desktop** ; 0 overflow ; 0 image cassée ;',
            '- exact-head `' + certifiedHead + '` : **31/31 workflows SUCCESS** ; UX-SEARCH-1/3, Search Truth, mobile grid, accessibility, attribution, contextual assets et Rabat real-photo restent verts ;',
            '- run spécialisé `' + specializedRun + '` : **Product Design Reviewer PASS + Independent Release Certifier PASS**, contrat machine **10/10** ;',
            '- revue humaine des captures 390×844 et 1440×900 : **' + score + '** — variété nette sans transformer une illustration ou une photo d’ambiance en photo du bien.',
            '',
            '**Prochain LOT UX/Search : ' + nextLot + '.**',
            '<!-- UX-SEARCH-4-CLOSEOUT-END -->'
          ].join('\n');

          function replaceBetween(text, start, end, replacement) {
            const a = text.indexOf(start);
            const b = text.indexOf(end);
            if (a < 0 || b < a) throw new Error('missing markers ' + start + ' / ' + end);
            return text.slice(0, a) + replacement + text.slice(b + end.length);
          }

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          const readmeBlock = [
            '<!-- UX-SEARCH-CONVERGENCE-CURRENT-START -->',
            '### Convergence Search actuelle — UX-SEARCH-1 à UX-SEARCH-4 ✅',
            '',
            '- **UX-SEARCH-1 — Density First ✅ PR #479** : grille certifiée 2/2/3/4/4 ; densité **9,3/10**.',
            '- **UX-SEARCH-2 — Compact Search & Filters ✅ PR #480** : première annonce ~240–250 px, touch targets 48 px, 0 overflow ; **9,5/10**.',
            '- **UX-SEARCH-3 — Card Architecture ✅ PR #481** : `IMAGE → PRIX → TITRE → LOCALISATION → FACTS → PROVENANCE`, confiance/source préservées ; **9,4/10**.',
            '- **UX-SEARCH-4 — Visual Inventory System ✅ PR #482** : audit public initial **288/288 fallbacks génériques, 276 doublons adjacents** ; cards internes branchées sur les fallbacks contextuels truth-safe existants ; fixture certifiée 11 contextuels distincts + 1 photo d’ambiance + 2 fail-closed, stabilité reload, 0 image cassée/overflow ; **' + score + '**.',
            '- Les quatre lots préservent ranking, DATA, Source Registry, dédup, ordre commercial, prix, Map et transparence de provenance.',
            '- **Prochain LOT UX/Search : ' + nextLot + '** : réduire la domination visuelle de la navigation et finaliser la hiérarchie globale sans rouvrir les lots 1–4 ; gate UX ≥9/10.',
            '<!-- UX-SEARCH-CONVERGENCE-CURRENT-END -->'
          ].join('\n');
          readme = replaceBetween(readme, '<!-- UX-SEARCH-CONVERGENCE-CURRENT-START -->', '<!-- UX-SEARCH-CONVERGENCE-CURRENT-END -->', readmeBlock);
          fs.writeFileSync(readmePath, readme);

          const roadmapPath = 'docs/ROADMAP.md';
          let roadmap = fs.readFileSync(roadmapPath, 'utf8');
          roadmap = roadmap.replace('UX-SEARCH-1 ✅ PR #479 ; UX-SEARCH-2 ✅ PR #480 ; UX-SEARCH-3 ✅ PR #481 ;', 'UX-SEARCH-1 ✅ PR #479 ; UX-SEARCH-2 ✅ PR #480 ; UX-SEARCH-3 ✅ PR #481 ; UX-SEARCH-4 ✅ PR #482 ;');
          if (!roadmap.includes('UX-SEARCH-4 — Visual Inventory System ✅ CERTIFIED — PR #482')) {
            const anchor = '<!-- UX-SEARCH-3-CLOSEOUT-END -->';
            if (!roadmap.includes(anchor)) throw new Error('ROADMAP UX3 anchor missing');
            roadmap = roadmap.replace(anchor, anchor + '\n\n' + closeout);
          }
          roadmap = roadmap.replace(/\*\*Prochain LOT UX\/Search : UX-SEARCH-4 — Visual Inventory System\.\*\*/g, '**Prochain LOT UX/Search : ' + nextLot + '.**');
          fs.writeFileSync(roadmapPath, roadmap);

          const sessionPath = 'docs/SESSION.md';
          let session = fs.readFileSync(sessionPath, 'utf8');
          if (!session.includes('UX-SEARCH-4 — Visual Inventory System ✅ CERTIFIED — PR #482')) {
            const anchor = '<!-- UX-SEARCH-3-CLOSEOUT-END -->';
            if (!session.includes(anchor)) throw new Error('SESSION UX3 anchor missing');
            session = session.replace(anchor, anchor + '\n\n' + closeout);
          }
          session = session.replace(/- Prochain LOT UX\/Search : \*\*UX-SEARCH-4 — Visual Inventory System\*\*[^\n]*/g, '- Prochain LOT UX/Search : **' + nextLot + '** ; UX-SEARCH-1 à 4 sont fermés et doivent rester des predecessor gates.');
          fs.writeFileSync(sessionPath, session);
          NODE
      - name: Self-remove and commit certified docs
        shell: bash
        run: |
          rm .github/workflows/tmp-ux-search-4-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md .github/workflows/tmp-ux-search-4-closeout.yml
          git commit -m "docs(search): certify UX-SEARCH-4 visual inventory"
          git push origin HEAD:ux/search-visual-inventory-4
