name: Experience C1 Navigation Session

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/ux/navigation-continuity.ts"
      - "lib/ux/search-history.ts"
      - "components/search/useCanonicalSearchSession.ts"
      - "components/search/SearchMapNavigationBridge.tsx"
      - "components/listings/ListingReturnNavigationBridge.tsx"
      - "components/listings/AnnouncementPageShell.tsx"
      - "app/listings/[id]/page.tsx"
      - "scripts/scrapers/__tests__/experience-c1-navigation-session.test.ts"
      - "docs/AKARFINDER_PRODUCT_RECONCILIATION_P0_CLOSEOUT.md"
      - "docs/AKARFINDER_EXPERIENCE_C1.md"
      - ".github/workflows/experience-c1-navigation-session.yml"

permissions:
  contents: read

jobs:
  certify-c1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: C1 navigation continuity contracts
        run: npx tsx --test scripts/scrapers/__tests__/experience-c1-navigation-session.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
