name: Data Ingestion Lot 9 Full Coverage Gate

on:
  pull_request:
    paths:
      - "data-ingestion/sources/mubawab/config.json"
      - "data-ingestion/sources/mubawab/discovery.ts"
      - "data-ingestion/sources/mubawab/full-coverage.ts"
      - "data-ingestion/sources/mubawab/full-coverage-runner.ts"
      - "data-ingestion/sources/mubawab/full-coverage-state.ts"
      - "data-ingestion/sources/mubawab/full-coverage-campaign.ts"
      - "data-ingestion/sources/mubawab/live-campaign-policy.ts"
      - "data-ingestion/sources/mubawab/catalog-inventory.ts"
      - "data-ingestion/sources/mubawab/catalog-overlap.ts"
      - "scripts/mubawab-full-coverage-live-campaign.ts"
      - "scripts/mubawab-catalog-overlap-live.ts"
      - "scripts/scrapers/__tests__/mubawab-discovery-v2.test.ts"
      - "scripts/scrapers/__tests__/data-ingestion-lot9-full-coverage-planner.test.ts"
      - "scripts/scrapers/__tests__/data-ingestion-lot9-full-coverage-runner.test.ts"
      - "scripts/scrapers/__tests__/data-ingestion-lot9-full-coverage-state.test.ts"
      - "scripts/scrapers/__tests__/data-ingestion-lot9-full-coverage-campaign.test.ts"
      - "scripts/scrapers/__tests__/data-ingestion-lot9-live-campaign-policy.test.ts"
      - "scripts/scrapers/__tests__/data-ingestion-lot9-catalog-inventory.test.ts"
      - "scripts/scrapers/__tests__/data-ingestion-lot9-catalog-overlap.test.ts"
      - ".github/workflows/data-ingestion-lot9-full-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-coverage:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prove Mubawab discovery regression remains green
        run: npx tsx --test scripts/scrapers/__tests__/mubawab-discovery-v2.test.ts
      - name: Prove Lot 9 deterministic full coverage partition planner
        run: npx tsx --test scripts/scrapers/__tests__/data-ingestion-lot9-full-coverage-planner.test.ts
      - name: Prove Lot 9 bounded full coverage runner
        run: npx tsx --test scripts/scrapers/__tests__/data-ingestion-lot9-full-coverage-runner.test.ts
      - name: Prove Lot 9 persistent state across waves
        run: npx tsx --test scripts/scrapers/__tests__/data-ingestion-lot9-full-coverage-state.test.ts
      - name: Prove Lot 9 bounded campaign checkpoints
        run: npx tsx --test scripts/scrapers/__tests__/data-ingestion-lot9-full-coverage-campaign.test.ts
      - name: Prove Lot 9 live campaign policy bounds
        run: npx tsx --test scripts/scrapers/__tests__/data-ingestion-lot9-live-campaign-policy.test.ts
      - name: Prove Lot 9 catalog inventory semantics
        run: npx tsx --test scripts/scrapers/__tests__/data-ingestion-lot9-catalog-inventory.test.ts
      - name: Prove Lot 9 catalog overlap semantics
        run: npx tsx --test scripts/scrapers/__tests__/data-ingestion-lot9-catalog-overlap.test.ts
      - name: Restore final classic baseline
        uses: actions/download-artifact@v4
        with:
          name: lot9-live-campaign-final-classic-extinction-proof
          path: data-ingestion/runs/mubawab/lot9-live-campaign
          github-token: ${{ github.token }}
          run-id: 33899083917
      - name: Prove final classic baseline is present
        run: test -f data-ingestion/runs/mubawab/lot9-live-campaign/state.json
      - name: Run bounded Lot 9 national catalog overlap probe
        run: npx tsx scripts/mubawab-catalog-overlap-live.ts
      - name: Upload Lot 9 national catalog overlap proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot9-catalog-overlap-proof
          path: data-ingestion/runs/mubawab/lot9-catalog-overlap/
          if-no-files-found: warn
          retention-days: 7
