name: Neighborhood Visual P0.8 Souissi PR Contract

on:
  pull_request:
    paths:
      - "docs/NEIGHBORHOOD_VISUAL_LIBRARY_ROADMAP.md"
      - "scripts/closeouts/neighborhood-visual-p0-8-docs.mjs"
      - "scripts/scrapers/__tests__/neighborhood-visual-p0-8-closeout.test.ts"
      - ".github/workflows/neighborhood-visual-p0-8.yml"

permissions:
  contents: read

concurrency:
  group: neighborhood-visual-p0-8-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STORAGE_BASE: https://kusfiyimwvxblvsrhaes.supabase.co/storage/v1/object/public/neighborhood-visuals/rabat/souissi

jobs:
  pr-contract:
    name: P0.8 Souissi — PR scoped contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Offline P0.8 closeout contract
        run: npx tsx --test scripts/scrapers/__tests__/neighborhood-visual-p0-8-closeout.test.ts
      - name: Verify closeout script syntax (no execution or mutation)
        run: node --check scripts/closeouts/neighborhood-visual-p0-8-docs.mjs

