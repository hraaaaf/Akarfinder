name: Recovery V4.11 Controlled Wave7 Neon Import

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/v4-11-wave7-import-approval.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: recovery-v4-11-controlled-wave7-neon-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate approval and isolated target
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          node - <<'NODE'
          const a=require("./data/recovery/v4-11-wave7-import-approval.json");
          if(a.approved!==true||a.rows!==657)throw new Error("approval");
          if(!Number.isInteger(a.artifact_id)||a.artifact_id<=0)throw new Error("artifact");
          if(!/^sha256:[0-9a-f]{64}$/.test(a.artifact_digest||""))throw new Error("artifact digest");
          if(!/^[0-9a-f]{64}$/.test(a.jsonl_sha256||""))throw new Error("jsonl sha");
          if(a.target_project!=="ancient-violet-43534870"||a.target_branch!=="br-cold-mouse-b2a50yaa"||a.target_database!=="AkarFinder")throw new Error("target");
          if(a.expected_pre?.property_listings!==99569||a.expected_pre?.listing_sources!==99569)throw new Error("pre baseline");
          if(a.production_neon_writes_authorized!==false||a.vercel_deployment_authorized!==false)throw new Error("scope");
          NODE
          python - <<'PY'
          import os,urllib.parse
          h=urllib.parse.urlparse(os.environ["DATABASE_URL"]).hostname
          allowed={
            "ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech",
          }
          if h not in allowed: raise SystemExit("refusing unexpected Neon host")
          PY

      - name: Download and verify certified Wave7 artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w7"
          ARTIFACT_ID="$(node -p 'require("./data/recovery/v4-11-wave7-import-approval.json").artifact_id')"
          EXPECTED_SHA="$(node -p 'require("./data/recovery/v4-11-wave7-import-approval.json").jsonl_sha256')"
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/w7.zip"
          unzip -q -o "$RUNNER_TEMP/w7.zip" -d "$RUNNER_TEMP/w7"
          echo "$EXPECTED_SHA  $RUNNER_TEMP/w7/db-ready-wave7.jsonl" | sha256sum -c -
          test "$(wc -l < "$RUNNER_TEMP/w7/db-ready-wave7.jsonl")" = "657"

      - name: Build import CSV
        run: |
          node - "$RUNNER_TEMP/w7/db-ready-wave7.jsonl" "$RUNNER_TEMP/w7/import.csv" <<'NODE'
          const fs=require("fs");
          const [src,out]=process.argv.slice(2);
          const rows=fs.readFileSync(src,"utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const cols=["canonical_fingerprint","title","price_mad","city","district","property_type","transaction_type","surface_m2","rooms_count","bedrooms_count","bathrooms_count","description_snippet","images_count","seller_name","data_completeness_score","field_confidence","source_name","listing_url","source_url","first_seen_at","last_seen_at","source_offer_key","origin_type","compliance_status","content_fingerprint","ingestion_run_id","displayed_price","price_currency","price_period","price_status"];
          const esc=v=>{if(v===null||v===undefined)return "";const s=typeof v==="object"?JSON.stringify(v):String(v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
          if(rows.length!==657||rows.some(r=>r.approved_for_import!==false))throw new Error("artifact invariant");
          if(new Set(rows.map(r=>r.listing_url)).size!==657||new Set(rows.map(r=>r.canonical_fingerprint)).size!==657)throw new Error("dedupe invariant");
          if(new Set(rows.map(r=>r.source_name+"|"+r.source_offer_key)).size!==657)throw new Error("portal identity invariant");
          if(rows.some(r=>![r.title,r.city,r.property_type,r.transaction_type].every(x=>x!=null&&String(x).trim()!=="")))throw new Error("core invariant");
          fs.writeFileSync(out,cols.join(",")+"\n"+rows.map(r=>cols.map(c=>esc(r[c])).join(",")).join("\n")+"\n");
          NODE

      - name: Preflight current DB and identity overlaps
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/w7/preflight.sql" <<'SQL'
          DROP TABLE IF EXISTS stage_w7;
          CREATE TEMP TABLE stage_w7 (
            canonical_fingerprint text NOT NULL,title text NOT NULL,price_mad integer,city text NOT NULL,district text,
            property_type text NOT NULL,transaction_type text NOT NULL,surface_m2 integer,rooms_count integer,
            bedrooms_count integer,bathrooms_count integer,description_snippet text,images_count integer,seller_name text,
            data_completeness_score integer,field_confidence jsonb,source_name text NOT NULL,listing_url text NOT NULL,
            source_url text,first_seen_at timestamptz,last_seen_at timestamptz,source_offer_key text,origin_type text,
            compliance_status text,content_fingerprint text,ingestion_run_id text,displayed_price numeric,
            price_currency text,price_period text,price_status text
          );
          \copy stage_w7 FROM '/w7/import.csv' WITH (FORMAT csv, HEADER true)

          WITH existing_identity AS (
            SELECT
              listing_url,
              CASE
                WHEN listing_url ~* 'mubawab\.ma' THEN 'mubawab.ma'
                WHEN listing_url ~* 'agenz\.ma' THEN 'agenz.ma'
                WHEN listing_url ~* 'avito\.ma' THEN 'avito.ma'
                ELSE NULL
              END AS domain,
              CASE
                WHEN listing_url ~* 'mubawab\.ma' THEN (regexp_match(listing_url, '/(a|pa)/([0-9]+)(/|$)'))[2]
                WHEN listing_url ~* 'agenz\.ma' THEN (regexp_match(listing_url, '/([0-9]+)/?$'))[1]
                WHEN listing_url ~* 'avito\.ma' THEN (regexp_match(listing_url, '_([0-9]+)\.html?$'))[1]
                ELSE NULL
              END AS offer_id
            FROM public.listing_sources
          )
          SELECT
            (SELECT count(*) FROM stage_w7),
            (SELECT count(*) FROM stage_w7 s JOIN public.listing_sources ls ON ls.listing_url=s.listing_url),
            (SELECT count(*) FROM stage_w7 s JOIN public.property_listings pl ON pl.canonical_fingerprint=s.canonical_fingerprint),
            (SELECT count(*) FROM stage_w7 s JOIN existing_identity e ON e.domain=s.source_name AND e.offer_id=s.source_offer_key),
            (SELECT count(*) FROM public.property_listings),
            (SELECT count(*) FROM public.listing_sources),
            (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='clean-corpus-v4.11-wave7');
          DROP TABLE stage_w7;
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w7:/w7" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -f /w7/preflight.sql' | tee "$RUNNER_TEMP/w7/preflight.out"
          LAST="$(grep -E '^[0-9]+\|' "$RUNNER_TEMP/w7/preflight.out" | tail -n1)"
          IFS='|' read -r STAGED URL_OVERLAP FP_OVERLAP ID_OVERLAP PRE_PL PRE_LS PRE_W7 <<< "$LAST"
          test "$STAGED" = "657"
          test "$URL_OVERLAP" = "0"
          test "$FP_OVERLAP" = "0"
          test "$ID_OVERLAP" = "0"
          test "$PRE_PL" = "99569"
          test "$PRE_LS" = "99569"
          test "$PRE_W7" = "0"

      - name: Controlled atomic Wave7 import
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/w7/import.sql" <<'SQL'
          DROP TABLE IF EXISTS stage_w7;
          BEGIN;
          CREATE TEMP TABLE stage_w7 (
            canonical_fingerprint text NOT NULL,title text NOT NULL,price_mad integer,city text NOT NULL,district text,
            property_type text NOT NULL,transaction_type text NOT NULL,surface_m2 integer,rooms_count integer,
            bedrooms_count integer,bathrooms_count integer,description_snippet text,images_count integer,seller_name text,
            data_completeness_score integer,field_confidence jsonb,source_name text NOT NULL,listing_url text NOT NULL,
            source_url text,first_seen_at timestamptz,last_seen_at timestamptz,source_offer_key text,origin_type text,
            compliance_status text,content_fingerprint text,ingestion_run_id text,displayed_price numeric,
            price_currency text,price_period text,price_status text
          ) ON COMMIT DROP;
          \copy stage_w7 FROM '/w7/import.csv' WITH (FORMAT csv, HEADER true)

          DO $$
          BEGIN
            IF (SELECT count(*) FROM stage_w7) <> 657 THEN RAISE EXCEPTION 'stage count mismatch'; END IF;
            IF EXISTS (SELECT 1 FROM stage_w7 s JOIN public.listing_sources ls ON ls.listing_url=s.listing_url)
              THEN RAISE EXCEPTION 'unexpected URL overlap'; END IF;
            IF EXISTS (SELECT 1 FROM stage_w7 s JOIN public.property_listings pl ON pl.canonical_fingerprint=s.canonical_fingerprint)
              THEN RAISE EXCEPTION 'unexpected fingerprint overlap'; END IF;
          END $$;

          INSERT INTO public.property_listings (
            canonical_fingerprint,title,price_mad,city,district,property_type,transaction_type,surface_m2,rooms_count,
            bedrooms_count,bathrooms_count,description_snippet,images_count,seller_name,data_completeness_score,field_confidence
          )
          SELECT canonical_fingerprint,title,price_mad,city,district,property_type,transaction_type,surface_m2,rooms_count,
                 bedrooms_count,bathrooms_count,description_snippet,images_count,seller_name,data_completeness_score,field_confidence
          FROM stage_w7;

          INSERT INTO public.listing_sources (
            property_listing_id,source_name,listing_url,source_url,first_seen_at,last_seen_at,is_active,source_offer_key,
            origin_type,compliance_status,content_fingerprint,ingestion_run_id,displayed_price,price_currency,price_period,price_status
          )
          SELECT pl.id,s.source_name,s.listing_url,s.source_url,s.first_seen_at,s.last_seen_at,true,s.source_offer_key,
                 s.origin_type,s.compliance_status,s.content_fingerprint,s.ingestion_run_id,s.displayed_price,
                 s.price_currency,s.price_period,s.price_status
          FROM stage_w7 s JOIN public.property_listings pl ON pl.canonical_fingerprint=s.canonical_fingerprint;

          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.property_listings) <> 100226 THEN RAISE EXCEPTION 'property total mismatch'; END IF;
            IF (SELECT count(*) FROM public.listing_sources) <> 100226 THEN RAISE EXCEPTION 'source total mismatch'; END IF;
            IF (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='clean-corpus-v4.11-wave7') <> 657
              THEN RAISE EXCEPTION 'wave7 count mismatch'; END IF;
          END $$;
          COMMIT;
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w7:/w7" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f /w7/import.sql'

      - name: Independent readback
        run: |
          set -euo pipefail
          OUT="$(docker run --rm -e DATABASE_URL="$DATABASE_URL" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -c "
            SELECT
              (SELECT count(*) FROM public.property_listings),
              (SELECT count(*) FROM public.listing_sources),
              (SELECT count(DISTINCT listing_url) FROM public.listing_sources),
              (SELECT count(DISTINCT canonical_fingerprint) FROM public.property_listings),
              (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='"'"'clean-corpus-v4.11-wave7'"'"'),
              (SELECT count(DISTINCT listing_url) FROM public.listing_sources WHERE ingestion_run_id='"'"'clean-corpus-v4.11-wave7'"'"'),
              (SELECT count(*) FROM public.listing_sources ls LEFT JOIN public.property_listings pl ON pl.id=ls.property_listing_id WHERE pl.id IS NULL),
              (SELECT count(*) FROM public.listing_sources WHERE is_active IS NOT TRUE),
              (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id LIKE '"'"'clean-corpus-v4.11%'"'"'),
              (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id NOT LIKE '"'"'clean-corpus-v4.11%'"'"' OR ingestion_run_id IS NULL),
              (SELECT count(*) FROM public.property_listings WHERE canonical_fingerprint IS NULL OR btrim(canonical_fingerprint)='"'"''"'"' OR title IS NULL OR btrim(title)='"'"''"'"' OR city IS NULL OR btrim(city)='"'"''"'"' OR property_type IS NULL OR btrim(property_type)='"'"''"'"' OR transaction_type IS NULL OR btrim(transaction_type)='"'"''"'"'),
              (SELECT count(*) FROM public.listing_sources WHERE listing_url IS NULL OR btrim(listing_url)='"'"''"'"' OR source_name IS NULL OR btrim(source_name)='"'"''"'"');
          "'")"
          echo "$OUT"
          IFS='|' read -r PL LS URLS FPS W7 W7URL ORPH INACTIVE V411 LEGACY PGAP SGAP <<< "$OUT"
          test "$PL" = "100226"
          test "$LS" = "100226"
          test "$URLS" = "100226"
          test "$FPS" = "100226"
          test "$W7" = "657"
          test "$W7URL" = "657"
          test "$ORPH" = "0"
          test "$INACTIVE" = "0"
          test "$V411" = "100190"
          test "$LEGACY" = "36"
          test "$PGAP" = "0"
          test "$SGAP" = "0"
