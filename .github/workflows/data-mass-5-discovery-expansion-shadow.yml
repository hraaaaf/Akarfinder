name: DATA MASS-5 Discovery Expansion Shadow

on:
  pull_request:
    paths:
      - "data/data-mass-5/**"
      - "scripts/data-mass/discovery-expansion-shadow.ts"
      - "scripts/data-mass/reservoir-qualification.ts"
      - "scripts/data-mass/source-factory-certified-cohort.ts"
      - "scripts/audits/data-mass-1-reservoir-qualification.ts"
      - "data/data-mass-2a/mass-1-certified-source-factory.json"
      - "docs/data/DATA-MASS-5-DISCOVERY-EXPANSION-SHADOW.md"
      - ".github/workflows/data-mass-5-discovery-expansion-shadow.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contract-and-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_MASS_1_OUT_DIR: .tmp/data-mass-5/mass1
      DATA_MASS_5_MASS1_REPORT: .tmp/data-mass-5/mass1/report.json
      DATA_MASS_5_OUT_DIR: .tmp/data-mass-5/results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Replay MASS-1 reservoir qualification read-only
        run: npx tsx scripts/audits/data-mass-1-reservoir-qualification.ts
      - name: Compute MASS-5 post-baseline delta
        run: npx tsx scripts/data-mass/discovery-expansion-shadow.ts
      - name: Enforce MASS-5 truth and no-mutation boundary
        run: |
          node - <<'NODE'
          const p=require('./.tmp/data-mass-5/results/proof.json');
          const ok=p.status==='PASS' && p.mode==='shadow_read_only' &&
            p.baselineCertifiedDomains===101 &&
            p.sourceRegistryRemainsAuthoritative===true &&
            p.discoveryExpansionGrantsAuthorization===false &&
            p.publicActivableNow===false &&
            p.databaseWrites===0 && p.registryWrites===0 && p.searchActivations===0 &&
            p.sourceNetworkRequests===0 && p.detailPageFetches===0 && p.permissionsInferred===0;
          if(!ok){console.error(p);process.exit(1)}
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: data-mass-5-discovery-expansion-shadow
          path: |
            .tmp/data-mass-5/results/
            .tmp/data-mass-5/mass1/proof.json
