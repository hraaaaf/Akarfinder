name: Akar V7 FeenWay original portals - one-shot 10

on:
  push:
    branches:
      - feat/akar-v7-feenway-offline-provenance-20261113
    paths:
      - '.github/workflows/akar-v7-feenway-upstream-10-check.yml'

permissions:
  contents: read

concurrency:
  group: akar-v7-feenway-upstream-10-once
  cancel-in-progress: false

jobs:
  original-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts/acquisition
      AKAR_SOURCE_NETWORK_APPROVED: approved
    steps:
      - name: Checkout reviewed branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing V3 parser dependencies only
        run: python -m pip install 'psycopg[binary]==3.3.8' 'beautifulsoup4==4.14.3'
      - name: Offline 10-upstream-source safety contracts
        run: python -m unittest discover -v -s scripts/acquisition/__tests__ -p 'test_v7_feenway_upstream_10_audit.py'
      - name: Respect original portal robots and compare at most 10 original pages
        run: >-
          python scripts/acquisition/v7_multisource/feenway_upstream_10_audit.py
          --candidates scripts/acquisition/v7_multisource/feenway_upstream_10_candidates.json
          --output pilot-upstream
          --approved-10
      - name: Upload only source observations, never raw HTML or images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feenway-original-10-quarantine
          path: |
            pilot-upstream/upstream_report_QUARANTINE.json
            pilot-upstream/upstream_cases_QUARANTINE.jsonl
          if-no-files-found: ignore
          retention-days: 1
