name: Recovery V4.11 Pre-DB Verification Queue

on:
  push:
    branches: ["recovery/v4-11-pre-db-verification-20260927"]
    paths:
      - "data/recovery/activate-v4-11-pre-db-verification-queue.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download certified inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/sarout" "$RUNNER_TEMP/maroc" data/audits/pre-db-verification
          gh api repos/${{ github.repository }}/actions/artifacts/10925954921/zip > "$RUNNER_TEMP/pack.zip"
          unzip -q -o "$RUNNER_TEMP/pack.zip" -d "$RUNNER_TEMP/pack"
          gh api repos/${{ github.repository }}/actions/artifacts/10860656848/zip > "$RUNNER_TEMP/sarout.zip"
          unzip -q -o "$RUNNER_TEMP/sarout.zip" -d "$RUNNER_TEMP/sarout"
          gh api repos/${{ github.repository }}/actions/artifacts/10860360457/zip > "$RUNNER_TEMP/maroc.zip"
          unzip -q -o "$RUNNER_TEMP/maroc.zip" -d "$RUNNER_TEMP/maroc"
          test -s "$RUNNER_TEMP/pack/manifest.json"
          test -s "$RUNNER_TEMP/sarout/recovery-big-sitemap-sarout-ma.txt"
          test -s "$RUNNER_TEMP/maroc/recovery-big-sitemap-marocimmo-com.txt"

      - name: Build verification queue
        run: |
          node scripts/recovery/build-v4-11-pre-db-verification-queue.mjs             --pack-dir "$RUNNER_TEMP/pack"             --sarout-sitemap "$RUNNER_TEMP/sarout/recovery-big-sitemap-sarout-ma.txt"             --marocimmo-sitemap "$RUNNER_TEMP/maroc/recovery-big-sitemap-marocimmo-com.txt"             --out-dir data/audits/pre-db-verification

      - name: Verify queue invariants
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const m=JSON.parse(fs.readFileSync("data/audits/pre-db-verification/manifest.json","utf8"));
          const eq=(a,b,n)=>{if(a!==b)throw new Error(`${n}: ${a} != ${b}`)};
          eq(m.input_rows,213992,"input");
          eq(m.existence_verified_rows,76159,"verified");
          eq(m.unresolved_rows,137833,"unresolved");
          eq(m.evidence_counts["sitemap_only"],76081,"sitemap_only");
          eq(m.evidence_counts["http200+sitemap"],76,"http200+sitemap");
          eq(m.evidence_counts["http200_only"],2,"http200_only");
          eq(m.all_rows_db_ready,false,"db ready");
          eq(m.database_access,0,"db access");
          eq(m.database_writes,0,"db writes");
          console.log(JSON.stringify(m,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-pre-db-verification-queue
          path: |
            data/audits/pre-db-verification/manifest.json
            data/audits/pre-db-verification/existence-verified.jsonl
            data/audits/pre-db-verification/unresolved-all.txt
            data/audits/pre-db-verification/unresolved/*.txt
          retention-days: 30
