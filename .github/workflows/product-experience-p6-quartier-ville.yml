name: Product Experience P6 Quartier Ville

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/immobilier/[city]/page.tsx"
      - "app/immobilier/[city]/[district]/page.tsx"
      - "components/geo/GeoResultPreview.tsx"
      - "components/map/TerritoryMiniMap.tsx"
      - "scripts/scrapers/__tests__/product-experience-p6-quartier-ville.test.ts"
      - "scripts/audits/product-experience-p6-quartier-ville.mjs"
      - "docs/AKARFINDER_PRODUCT_EXPERIENCE_P6.md"
      - ".github/workflows/product-experience-p6-quartier-ville.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quartier-ville-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: P6 hierarchy and truth contracts
        run: npx tsx --test scripts/scrapers/__tests__/product-experience-p6-quartier-ville.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start P6 production server
        shell: bash
        run: |
          npm run start -- -p 3217 > /tmp/product-experience-p6.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3217/immobilier/rabat/agdal >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/product-experience-p6.log
          exit 1
      - name: P6 responsive visual certification
        env:
          BASE_URL: http://127.0.0.1:3217
          AUDIT_OUTPUT_DIR: artifacts/product-experience-p6-quartier-ville
        run: node scripts/audits/product-experience-p6-quartier-ville.mjs
      - name: Upload P6 AFTER proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-experience-p6-quartier-ville-${{ github.run_id }}
          path: artifacts/product-experience-p6-quartier-ville
          if-no-files-found: error
          retention-days: 14
