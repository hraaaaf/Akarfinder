name: Landmark Factory Offline Casablanca

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-casablanca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyosmium
        run: python -m pip install --disable-pip-version-check osmium shapely
      - name: Download current Morocco OSM PBF
        run: |
          curl --fail --location --retry 3 --output /tmp/morocco-latest.osm.pbf \
            https://download.geofabrik.de/africa/morocco-latest.osm.pbf
          ls -lh /tmp/morocco-latest.osm.pbf
      - name: Discover authoritative Racine boundary streets
        run: |
          mkdir -p artifacts
          python scripts/landmarks/find-osm-named-ways.py \
            --pbf /tmp/morocco-latest.osm.pbf \
            --name "Boulevard Racine" \
            --name "Boulevard d'Anfa" \
            --name "Boulevard Abdelkrim Al Khattabi" \
            --name "Avenue Temera" \
            --name "Boulevard de la Lybie" \
            --name "Boulevard du Phare" \
            --name "Boulevard Abdellatif Ben Kaddour" \
            --name "Boulevard Mohamed Zerktouni" \
            --contains "Racine" \
            --contains "Temera" \
            --contains "Libye" \
            --contains "Lybie" \
            --contains "Phare" \
            --bbox=-7.75,33.50,-7.55,33.67 \
            --out artifacts/racine-boundary-ways.json
          cat artifacts/racine-boundary-ways.json

      - name: Discover authoritative Bourgogne boundary streets
        run: |
          mkdir -p artifacts
          python scripts/landmarks/find-osm-named-ways.py \
            --pbf /tmp/morocco-latest.osm.pbf \
            --name "Boulevard de la Corniche" \
            --name "Boulevard Abdellatif Ben Kaddour" \
            --name "Avenue du Phare" \
            --name "Avenue Docteur Mohamed Sijelmassi" \
            --name "Boulevard Mohamed Zerktouni" \
            --contains "Phare" \
            --contains "Sijelmassi" \
            --bbox=-7.75,33.50,-7.55,33.67 \
            --out artifacts/bourgogne-boundary-ways.json
          cat artifacts/bourgogne-boundary-ways.json

      - name: Discover authoritative Aïn Diab boundary streets
        run: |
          mkdir -p artifacts
          python scripts/landmarks/find-osm-named-ways.py \
            --pbf /tmp/morocco-latest.osm.pbf \
            --name "Boulevard de l'Océan Atlantique" \
            --name "Boulevard de la Corniche" \
            --bbox=-7.75,33.50,-7.55,33.67 \
            --out artifacts/ain-diab-boundary-ways.json
          cat artifacts/ain-diab-boundary-ways.json

      - name: Extract Aïn Diab coastline near authoritative roads
        run: |
          python scripts/landmarks/extract-osm-coastline-near-roads.py \
            --pbf /tmp/morocco-latest.osm.pbf \
            --roads artifacts/ain-diab-boundary-ways.json \
            --out artifacts/ain-diab-coastline.json
          cat artifacts/ain-diab-coastline.json

      - name: Polygonize Aïn Diab authoritative boundary
        continue-on-error: true
        run: |
          python scripts/landmarks/polygonize-authoritative-boundary.py \
            --linework artifacts/ain-diab-boundary-ways.json \
            --linework artifacts/ain-diab-coastline.json \
            --territory "Aïn Diab" \
            --target-hectares 200 \
            --tolerance-pct 25 \
            --out artifacts/ain-diab-authoritative-boundary.geojson
          cat artifacts/ain-diab-authoritative-boundary.geojson

      - name: Polygonize Bourgogne authoritative boundary
        continue-on-error: true
        run: |
          python scripts/landmarks/polygonize-authoritative-boundary.py \
            --linework artifacts/bourgogne-boundary-ways.json \
            --territory "Bourgogne 2" \
            --target-hectares 109 \
            --tolerance-pct 25 \
            --out artifacts/bourgogne-authoritative-boundary.geojson
          cat artifacts/bourgogne-authoritative-boundary.geojson

      - name: Polygonize Racine authoritative boundary
        continue-on-error: true
        run: |
          python scripts/landmarks/polygonize-authoritative-boundary.py \
            --linework artifacts/racine-boundary-ways.json \
            --territory "Racine" \
            --target-hectares 143 \
            --tolerance-pct 25 \
            --out artifacts/racine-authoritative-boundary.geojson
          cat artifacts/racine-authoritative-boundary.geojson

      - name: Snap-polygonize Aïn Diab authoritative boundary
        continue-on-error: true
        run: |
          python scripts/landmarks/polygonize-authoritative-boundary-snapped.py \
            --linework artifacts/ain-diab-boundary-ways.json \
            --linework artifacts/ain-diab-coastline.json \
            --territory "Aïn Diab" \
            --target-hectares 200 \
            --snap-meters 12 \
            --tolerance-pct 25 \
            --out artifacts/ain-diab-authoritative-boundary-snapped.geojson

      - name: Snap-polygonize Bourgogne authoritative boundary
        continue-on-error: true
        run: |
          python scripts/landmarks/polygonize-authoritative-boundary-snapped.py \
            --linework artifacts/bourgogne-boundary-ways.json \
            --territory "Bourgogne 2" \
            --target-hectares 109 \
            --snap-meters 12 \
            --tolerance-pct 25 \
            --out artifacts/bourgogne-authoritative-boundary-snapped.geojson

      - name: Snap-polygonize Racine authoritative boundary
        continue-on-error: true
        run: |
          python scripts/landmarks/polygonize-authoritative-boundary-snapped.py \
            --linework artifacts/racine-boundary-ways.json \
            --territory "Racine" \
            --target-hectares 143 \
            --snap-meters 12 \
            --tolerance-pct 25 \
            --out artifacts/racine-authoritative-boundary-snapped.geojson

      - name: Discover exact Bourgogne boundary relations
        run: |
          mkdir -p artifacts
          python scripts/landmarks/find-osm-boundary-relations.py \
            --pbf /tmp/morocco-latest.osm.pbf \
            --name "Bourgogne" \
            --out artifacts/bourgogne-boundary-relations.json
          cat artifacts/bourgogne-boundary-relations.json

      - name: Discover exact Aïn Diab boundary relations
        run: |
          mkdir -p artifacts
          python scripts/landmarks/find-osm-boundary-relations.py \
            --pbf /tmp/morocco-latest.osm.pbf \
            --name "Aïn Diab" \
            --out artifacts/ain-diab-boundary-relations.json
          cat artifacts/ain-diab-boundary-relations.json

      - name: Discover exact Casablanca Finance City boundary relations
        run: |
          mkdir -p artifacts
          python scripts/landmarks/find-osm-boundary-relations.py \
            --pbf /tmp/morocco-latest.osm.pbf \
            --name "Casablanca Finance City" \
            --out artifacts/cfc-boundary-relations.json
          cat artifacts/cfc-boundary-relations.json

      - name: Discover exact Racine boundary relations
        run: |
          mkdir -p artifacts
          python scripts/landmarks/find-osm-boundary-relations.py \
            --pbf /tmp/morocco-latest.osm.pbf \
            --name "Racine" \
            --out artifacts/racine-boundary-relations.json
          cat artifacts/racine-boundary-relations.json

      - name: Discover exact Bouskoura boundary relations
        run: |
          mkdir -p artifacts
          python scripts/landmarks/find-osm-boundary-relations.py \
            --pbf /tmp/morocco-latest.osm.pbf \
            --name "Bouskoura" \
            --out artifacts/bouskoura-boundary-relations.json
          cat artifacts/bouskoura-boundary-relations.json

      - name: Materialize Bouskoura administrative boundary relation 2522564
        run: |
          mkdir -p artifacts
          python scripts/landmarks/materialize-osm-relation.py \
            --pbf /tmp/morocco-latest.osm.pbf \
            --relation-id 2522564 \
            --out artifacts/bouskoura-relation-2522564.geojson
          npx tsx scripts/landmarks/validate-materialized-boundary.ts \
            --input artifacts/bouskoura-relation-2522564.geojson \
            --city-id city_bouskoura \
            --neighborhood-id district_casablanca_bouskoura \
            --display-name "Bouskoura" \
            | tee artifacts/bouskoura-relation-2522564-validation.json

      - name: Materialize Maârif administrative boundary relation 2801474
        run: |
          mkdir -p artifacts
          python scripts/landmarks/materialize-osm-relation.py \
            --pbf /tmp/morocco-latest.osm.pbf \
            --relation-id 2801474 \
            --out artifacts/casablanca-maarif-relation-2801474.geojson
          npx tsx scripts/landmarks/validate-materialized-boundary.ts \
            --input artifacts/casablanca-maarif-relation-2801474.geojson \
            --city-id city_casablanca \
            --neighborhood-id district_casablanca_maarif \
            --display-name "Maârif" \
            | tee artifacts/casablanca-maarif-relation-2801474-validation.json
      - name: Extract Casablanca high-signal POI nodes
        run: |
          mkdir -p artifacts
          python scripts/landmarks/extract-osm-pbf.py \
            --pbf /tmp/morocco-latest.osm.pbf \
            --bbox=-7.80,33.40,-7.40,33.75 \
            --out artifacts/casablanca-poi.jsonl
          wc -l artifacts/casablanca-poi.jsonl
      - name: Run Bouskoura point-in-polygon shortlist
        run: |
          npx tsx scripts/landmarks/discover-district-from-artifacts.ts \
            --boundary artifacts/bouskoura-relation-2522564.geojson \
            --poi-jsonl artifacts/casablanca-poi.jsonl \
            --district-id district_casablanca_bouskoura \
            --out artifacts/bouskoura-shortlist.json
          cat artifacts/bouskoura-shortlist.json

      - name: Run Maârif point-in-polygon shortlist
        run: |
          npx tsx scripts/landmarks/discover-district-from-artifacts.ts \
            --boundary artifacts/casablanca-maarif-relation-2801474.geojson \
            --poi-jsonl artifacts/casablanca-poi.jsonl \
            --district-id district_casablanca_maarif \
            --out artifacts/casablanca-maarif-shortlist.json
          cat artifacts/casablanca-maarif-shortlist.json
      - name: Build deterministic summary
        run: |
          python - <<'PY'
          import json, collections
          p="artifacts/casablanca-poi.jsonl"
          rows=[json.loads(x) for x in open(p,encoding="utf-8") if x.strip()]
          cats=collections.Counter()
          for r in rows:
            t=r["tags"]
            for k in ("historic","tourism","leisure","amenity","shop","man_made"):
              if k in t: cats[f"{k}={t[k]}"] += 1
          out={"count":len(rows),"top_categories":cats.most_common(30),"sample":[{"id":r["id"],"name":r["tags"].get("name") or r["tags"].get("name:fr") or r["tags"].get("name:ar"),"lat":r["lat"],"lon":r["lon"]} for r in rows[:50]]}
          open("artifacts/casablanca-summary.json","w",encoding="utf-8").write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: landmark-factory-casablanca-offline
          path: artifacts/
          retention-days: 7
