name: AkarFinder - Q1A Artifact Preflight

on:
  push:
    branches: [data/q1a-candidate-lake-freeze]
    paths:
      - 'scripts/audits/candidate-lake-q1a-artifact-preflight.py'
      - '.github/workflows/candidate-lake-q1a-artifact-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      Q1A_ARTIFACT_ROOT: .tmp/q1a-materializable-artifacts
      Q1A_PREFLIGHT_OUT: .tmp/q1a-materializable-preflight
    steps:
      - uses: actions/checkout@v4
      - name: Download exact frozen artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$Q1A_ARTIFACT_ROOT"
          artifacts=(
            9971118875 9974670013 9969651653 9888335708 9897323745
            9898224274 9997114366 9205427369 9203620957 9205410118
            9205361327 9205390731 9974714576 9974939355 9976337671
            9976383551 9998233478 9988296190 9998238197 9989328673
            9991042950 9991207598 9991403015 9991447841 9991488198
          )
          for id in "${artifacts[@]}"; do
            mkdir -p "$Q1A_ARTIFACT_ROOT/$id"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" \
              -o ".tmp/$id.zip"
            unzip -q ".tmp/$id.zip" -d "$Q1A_ARTIFACT_ROOT/$id"
          done
      - name: Verify complete row-level dependency set
        run: python scripts/audits/candidate-lake-q1a-artifact-preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-lake-q1a-materializable-artifact-preflight
          path: .tmp/q1a-materializable-preflight/
          retention-days: 30
          if-no-files-found: error
