name: Neighborhood Visual P3.1 Casablanca Maârif Search Wiring

on:
  push:
    branches:
      - agent/neighborhood-visual-p3-1-casablanca-maarif-discovery
    paths:
      - .github/workflows/neighborhood-visual-p3-1-casablanca-maarif-wire-search.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neighborhood-visual-p3-1-casablanca-maarif-discovery
          fetch-depth: 0
      - run: python scripts/maintenance/wire-casablanca-maarif-real-photo-search.py
