name: Search Page Visible ODM Canary V1

on:
  pull_request:
    paths:
      - "app/api/search/route.ts"
      - "app/search/page.tsx"
      - "lib/search/search-page-query.ts"
      - "lib/search/search-request-query.ts"
      - "scripts/scrapers/__tests__/search-page-visible-odm-canary-v1.test.ts"
      - "scripts/scrapers/__tests__/search-page-api-canary-query-parity-v1.test.ts"
      - ".github/workflows/search-page-visible-odm-canary-v1.yml"

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test --experimental-strip-types scripts/scrapers/__tests__/search-page-visible-odm-canary-v1.test.ts scripts/scrapers/__tests__/search-page-api-canary-query-parity-v1.test.ts
      - run: npm ci
      - run: npx tsc --noEmit
