name: P0.5 Docs Closeout Temp

on:
  push:
    branches: [docs/p0-5-closeout]
    paths:
      - ".github/workflows/p0-5-closeout-temp.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p0-5-closeout
          fetch-depth: 0
      - name: Apply P0.5 canonical docs closeout
        run: python scripts/tmp-p0-5-closeout.py
      - name: Commit canonical docs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md scripts/tmp-p0-5-closeout.py .github/workflows/p0-5-closeout-temp.yml
          git commit -m "docs: close P0.5 activation readiness"
          git push origin HEAD:docs/p0-5-closeout
