name: Neighborhood Context L2 Anchor Selection

on:
  pull_request:
    paths:
      - "lib/neighborhood-context/**"
      - "scripts/neighborhood-context/**"
      - "scripts/scrapers/__tests__/neighborhood-context-l2-anchor-selection.test.ts"
      - ".github/workflows/neighborhood-context-l2-anchor-selection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neighborhood-context-l2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-l2-anchor-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NCI_L1_OUTPUT_DIR: artifacts/neighborhood-context-l1
      NCI_L2_OUTPUT_DIR: artifacts/neighborhood-context-l2
      NCI_L2_L1_SNAPSHOT: artifacts/neighborhood-context-l1/snapshot.json
      AKAR_NCI_OVERPASS_ENDPOINTS: https://overpass-api.de/api/interpreter;https://overpass.private.coffee/api/interpreter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: L2 selection contracts + L1 regression
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/neighborhood-context-l2-anchor-selection.test.ts
          scripts/scrapers/__tests__/neighborhood-context-l1-poi-registry.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Generate L1 candidate snapshot
        run: npx tsx scripts/neighborhood-context/l1-generate-pilot.ts

      - name: Generate L2 assignment and anchor report
        run: npx tsx scripts/neighborhood-context/l2-generate-pilot.ts

      - name: Install Chromium for proof capture
        run: npx playwright install --with-deps chromium

      - name: Capture L2 proof
        run: node scripts/neighborhood-context/l2-capture-report.mjs

      - name: Upload L2 proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neighborhood-context-l2-anchor-selection-${{ github.run_id }}
          path: |
            artifacts/neighborhood-context-l1/snapshot.json
            artifacts/neighborhood-context-l2/
          if-no-files-found: error
          retention-days: 14

      - name: Final L2 truth gate
        run: node scripts/neighborhood-context/l2-validate-report.mjs
