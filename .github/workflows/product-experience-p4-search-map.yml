name: Product Experience P4 Search Map

on:
  pull_request:
    branches: [main]
    paths:
      - "app/map/page.tsx"
      - "app/map/p4-map-shell.css"
      - "app/search/page.tsx"
      - "app/search/p4-map-shell.css"
      - "components/map/P4MapDecisionRail.tsx"
      - "components/map/RabatMarketIntelligenceExperience.tsx"
      - "components/search/SearchMapPanel.tsx"
      - "scripts/scrapers/__tests__/p4-territorial-map-contract.test.ts"
      - "scripts/audits/product-experience-p4-search-map.mjs"
      - "docs/AKARFINDER_PRODUCT_EXPERIENCE_P4.md"
      - ".github/workflows/product-experience-p4-search-map.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    name: P4 Search + Carte responsive certification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_URL: http://127.0.0.1:3200
      AUDIT_OUTPUT_DIR: data/audits/product-experience-p4-search-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: P4 territorial map contract
        run: npx tsx --test scripts/scrapers/__tests__/p4-territorial-map-contract.test.ts
      - name: P2 navigation regression
        run: npx tsx --test scripts/scrapers/__tests__/search-history-navigation.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3200 > /tmp/p4-search-map.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3200/search >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p4-search-map.log
          exit 1
      - name: Certify responsive Search + Carte
        run: node scripts/audits/product-experience-p4-search-map.mjs
      - name: Upload P4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-experience-p4-search-map-${{ github.run_id }}
          path: data/audits/product-experience-p4-search-map
          if-no-files-found: error
          retention-days: 14
