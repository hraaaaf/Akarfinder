name: TEMP UX-SEARCH-2 Certified Closeout

on:
  push:
    branches:
      - ux/search-compact-filters-2
    paths:
      - ".github/workflows/tmp-ux-search-2-closeout.yml"
      - "scripts/tmp/ux-search-2-closeout.mjs"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search-compact-filters-2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update canonical UX/Search closeout docs
        run: node scripts/tmp/ux-search-2-closeout.mjs
      - name: Self-remove and commit certified docs
        shell: bash
        run: |
          rm scripts/tmp/ux-search-2-closeout.mjs
          rm .github/workflows/tmp-ux-search-2-closeout.yml
          git config user.name "AkarFinder Release Certifier"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ROADMAP.md docs/SESSION.md scripts/tmp/ux-search-2-closeout.mjs .github/workflows/tmp-ux-search-2-closeout.yml
          git diff --cached --check
          git commit -m "docs(search): certify UX-SEARCH-2 compact controls"
          git push origin HEAD:ux/search-compact-filters-2
