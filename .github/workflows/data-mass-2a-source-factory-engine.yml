name: DATA MASS-2A Source Factory Engine

on:
  pull_request:
    paths:
      - "data/data-mass-2a/mass-1-certified-source-factory.json"
      - "scripts/data-mass/source-factory.ts"
      - "scripts/data-mass/source-factory-certified-cohort.ts"
      - "scripts/data-mass/source-factory-decision.ts"
      - "scripts/data-mass/__tests__/source-factory.test.ts"
      - "scripts/data-mass/__tests__/source-factory-101.test.ts"
      - "scripts/data-mass/__tests__/source-factory-certified-cohort.test.ts"
      - "scripts/data-mass/__tests__/source-factory-decision.test.ts"
      - "scripts/data-mass/reservoir-qualification.ts"
      - "scripts/data-mass/__tests__/reservoir-qualification.test.ts"
      - "scripts/data-mass/__tests__/reservoir-hospitality-exclusions.test.ts"
      - "scripts/audits/data-mass-2a-source-factory-engine.ts"
      - ".github/workflows/data-mass-2a-source-factory-engine.yml"
      - "docs/data/DATA-MASS-2A-SOURCE-FACTORY-ENGINE.md"
      - "docs/ROADMAP.md"
      - "docs/SESSION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-mass-2a-source-factory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: MASS-2A + MASS-1 predecessor tests
        run: npx tsx --test scripts/data-mass/__tests__/source-factory.test.ts scripts/data-mass/__tests__/source-factory-101.test.ts scripts/data-mass/__tests__/source-factory-certified-cohort.test.ts scripts/data-mass/__tests__/source-factory-decision.test.ts scripts/data-mass/__tests__/reservoir-qualification.test.ts scripts/data-mass/__tests__/reservoir-hospitality-exclusions.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  live-audit:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_MASS_2A_OUT_DIR: .tmp/data-mass-2a/results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run MASS-2A production read-only audit
        run: npx tsx scripts/audits/data-mass-2a-source-factory-engine.ts
      - name: Enforce MASS-2A fail-closed truth boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s "${DATA_MASS_2A_OUT_DIR}/proof.json"
          test -s "${DATA_MASS_2A_OUT_DIR}/dossiers.json"
          test -s "${DATA_MASS_2A_OUT_DIR}/dossiers.csv"
          test -s "${DATA_MASS_2A_OUT_DIR}/summary.md"
          node - <<'NODE'
          const fs = require('fs');
          const dir = '.tmp/data-mass-2a/results';
          const p = JSON.parse(fs.readFileSync(`${dir}/proof.json`, 'utf8'));
          const batch = JSON.parse(fs.readFileSync(`${dir}/dossiers.json`, 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('data/data-mass-2a/mass-1-certified-source-factory.json', 'utf8'));
          const dossiers = Array.isArray(batch.dossiers) ? batch.dossiers : [];

          if (p.readOnly !== true) throw new Error(`MASS-2A must be read-only: ${JSON.stringify(p)}`);
          if (p.databaseWrites !== 0 || p.ddlChanges !== 0 || p.registryWrites !== 0 || p.policyChanges !== 0) throw new Error(`MASS-2A mutation boundary violated: ${JSON.stringify(p)}`);
          if (p.sourceNetworkRequests !== 0 || p.detailPageFetches !== 0) throw new Error(`MASS-2A source fetch boundary violated: ${JSON.stringify(p)}`);
          if (p.publicRowsCreated !== 0 || p.searchActivations !== 0 || p.permissionsInferred !== 0 || p.nonHoldDecisions !== 0 || p.publicActivableNowCount !== 0) throw new Error(`MASS-2A activation/permission boundary violated: ${JSON.stringify(p)}`);
          if (p.paginationMode !== 'UUID_KEYSET') throw new Error(`MASS-2A must preserve large-scan keyset pagination: ${JSON.stringify(p)}`);
          if (p.inputMode !== 'MASS_1_CERTIFIED_SNAPSHOT_WITH_LIVE_DRIFT_OBSERVATION') throw new Error(`Wrong MASS-2A input mode: ${JSON.stringify(p)}`);

          const expectedHead = '0a2856e68b44bee6f7b398b5c314d53711d95a67';
          const expectedDigest = 'sha256:84333105c8edda9be5733184c42e2e1afc865109edb580a5ae1705219c1cd932';
          if (manifest.mass1Head !== expectedHead || p.mass1CertifiedHead !== expectedHead) throw new Error(`MASS-1 head mismatch: ${JSON.stringify(p)}`);
          if (manifest.mass1ArtifactDigest !== expectedDigest || p.mass1CertifiedArtifactDigest !== expectedDigest) throw new Error(`MASS-1 artifact digest mismatch: ${JSON.stringify(p)}`);
          if (manifest.certifiedSourceFactoryDomains !== 101 || p.mass1CertifiedSourceFactoryDomains !== 101 || p.dossiersProduced !== 101 || p.uniqueDossierDomains !== 101) {
            throw new Error(`MASS-2A certified cohort mismatch: expected 101 domains: ${JSON.stringify(p)}`);
          }
          if (p.coverageMatchesCertifiedCohort !== true) throw new Error(`MASS-2A certified cohort coverage mismatch: ${JSON.stringify(p)}`);
          if (p.highYieldDomains !== 20 || p.midYieldDomains !== 30 || p.longTailDomains !== 51) {
            throw new Error(`MASS-2A cohort drift: expected 20/30/51: ${JSON.stringify(p)}`);
          }
          if (!p.allDossiersUnreviewed || !p.allDossiersHold || !p.allDossiersNonActivable || !p.allPermissionsNotInferred || !p.allExternalEvidenceNotReviewed) throw new Error(`Fail-closed dossier invariant violated: ${JSON.stringify(p)}`);

          if (!Array.isArray(p.postSnapshotAddedLiveSourceFactoryDomains) || !Array.isArray(p.certifiedDomainsNoLongerLiveSourceFactory)) {
            throw new Error(`MASS-2A must report live drift sets: ${JSON.stringify(p)}`);
          }
          if (p.postSnapshotAddedLiveSourceFactoryDomainCount !== p.postSnapshotAddedLiveSourceFactoryDomains.length) throw new Error(`Added drift count mismatch: ${JSON.stringify(p)}`);
          if (p.certifiedDomainsNoLongerLiveSourceFactoryCount !== p.certifiedDomainsNoLongerLiveSourceFactory.length) throw new Error(`Removed drift count mismatch: ${JSON.stringify(p)}`);

          const escaped = dossiers.filter((d) =>
            d.reviewStatus !== 'UNREVIEWED' ||
            d.proposedDecision !== 'HOLD' ||
            d.permissionInferred !== false ||
            d.publicActivableNow !== false ||
            d.reviewPriorityBasis !== 'MASS_1_MASS_POTENTIAL_SCORE_ONLY'
          );
          if (escaped.length) throw new Error(`MASS-2A dossier escaped review boundary: ${JSON.stringify(escaped.slice(0, 5))}`);

          const ranks = dossiers.map((d) => d.rank);
          if (ranks.some((rank, i) => rank !== i + 1)) throw new Error(`Non-contiguous certified ranks: ${JSON.stringify(ranks.slice(0, 20))}`);
          const dossierDomains = dossiers.map((d) => d.sourceDomain);
          const manifestDomains = manifest.cohort.map((d) => d.sourceDomain);
          if (JSON.stringify(dossierDomains) !== JSON.stringify(manifestDomains)) throw new Error('Dossier membership/order differs from certified MASS-1 cohort');
          const dossierScores = dossiers.map((d) => d.reviewPriorityScore);
          const manifestScores = manifest.cohort.map((d) => d.massPotentialScore);
          if (JSON.stringify(dossierScores) !== JSON.stringify(manifestScores)) throw new Error('Dossier scores differ from certified MASS-1 cohort');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: data-mass-2a-source-factory-engine
          path: .tmp/data-mass-2a/results/
          if-no-files-found: error
          retention-days: 30
