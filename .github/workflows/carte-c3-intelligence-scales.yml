name: Carte C3 Intelligence Scale Gate

on:
  pull_request:
    paths:
      - "app/api/geo/rabat-market-intelligence/route.ts"
      - "lib/geo/rabat-market-zones-canary.ts"
      - "lib/geo/rabat-market-zones-geojson.ts"
      - "lib/map/intelligence-scale.ts"
      - "lib/map/intelligence-payload.ts"
      - "lib/map/market-metric-reliability.ts"
      - "lib/map/rabat-market-intelligence-live.ts"
      - "scripts/audits/carte-c3-rabat-intelligence-live.ts"
      - "scripts/scrapers/__tests__/rabat-market-zones-geojson.test.ts"
      - "scripts/scrapers/__tests__/rabat-market-intelligence-api.test.ts"
      - "scripts/scrapers/__tests__/intelligence-scale.test.ts"
      - "scripts/scrapers/__tests__/intelligence-payload.test.ts"
      - "scripts/scrapers/__tests__/market-metric-reliability.test.ts"
      - ".github/workflows/carte-c3-intelligence-scales.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify-intelligence-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PROVIDER: neon
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Latest-commit scope check
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only HEAD^ HEAD)"
          echo "$files"
          if printf '%s\n' "$files" | grep -Eq '^(lib/geo/|lib/map/|components/map/|app/map/|app/api/geo/|scripts/scrapers/__tests__/intelligence-|\.github/workflows/carte-c3-intelligence-scales\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No relevant change: reuse prior green proof."
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.relevant == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.relevant == 'true'
      - name: Deterministic scale, payload, reliability, API guard and canary geometry contracts
        if: steps.scope.outputs.relevant == 'true'
        run: npx tsx --test scripts/scrapers/__tests__/intelligence-scale.test.ts scripts/scrapers/__tests__/intelligence-payload.test.ts scripts/scrapers/__tests__/market-metric-reliability.test.ts scripts/scrapers/__tests__/rabat-market-zones-geojson.test.ts scripts/scrapers/__tests__/rabat-market-intelligence-api.test.ts
      - name: TypeScript
        if: steps.scope.outputs.relevant == 'true'
        run: npx tsc --noEmit
      - name: No hardcoded market thresholds or heavy Shadow view
        if: steps.scope.outputs.relevant == 'true'
        run: |
          grep -q 'snapshot_quantiles_v1' lib/map/intelligence-scale.ts
          if grep -Eq '18000|450|120' lib/map/intelligence-scale.ts; then
            echo 'mockup illustrative values must not define runtime scale thresholds'
            exit 1
          fi
          grep -q 'neutralColor' lib/map/intelligence-payload.ts
          grep -q 'observedMarketOnly' lib/map/intelligence-payload.ts
          grep -q 'p1c2-neighborhood-offer-reliability-policy.json' lib/map/market-metric-reliability.ts
          if grep -q 'odm_neighborhood_offer_shadow' lib/map/rabat-market-intelligence-live.ts; then
            echo 'C3 live reader must remain on bounded base tables'
            exit 1
          fi
      - name: Rabat intelligence contract proof
        if: steps.scope.outputs.relevant == 'true'
        run: npx tsx --test scripts/scrapers/__tests__/city-market-intelligence.test.ts scripts/scrapers/__tests__/rabat-market-intelligence-api.test.ts
      - name: Production build
        if: steps.scope.outputs.relevant == 'true'
        run: npm run build
