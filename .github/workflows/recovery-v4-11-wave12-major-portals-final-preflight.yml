name: Recovery V4.11 Wave12 Filtered Neon Preflight

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/v4-11-wave12-major-portals-filtered-artifact.json"

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate binding and isolated target
        run: |
          set -euo pipefail
          node - <<'NODE'
          const m=require("./data/recovery/v4-11-wave12-major-portals-filtered-artifact.json");
          if(!Number.isInteger(m.artifact_id)||m.artifact_id<=0)throw new Error("artifact id");
          if(!/^sha256:[0-9a-f]{64}$/.test(m.artifact_digest||""))throw new Error("digest");
          if(!/^[0-9a-f]{64}$/.test(m.jsonl_sha256||""))throw new Error("sha");
          if(!Number.isInteger(m.rows)||m.rows<=0)throw new Error("rows");
          if(m.expected_pre!==142732)throw new Error("baseline");
          if(m.database_writes_authorized!==false||m.vercel_deployment_authorized!==false)throw new Error("scope");
          NODE
          python - <<'PY'
          import os,urllib.parse
          h=urllib.parse.urlparse(os.environ["DATABASE_URL"]).hostname
          allowed={"ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech","ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech"}
          if h not in allowed: raise SystemExit("unexpected host")
          PY

      - name: Download immutable filtered artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w12" data/audits/v4-11-wave12-major-portals-final-preflight
          ARTIFACT_ID=$(node -p 'require("./data/recovery/v4-11-wave12-major-portals-filtered-artifact.json").artifact_id')
          EXPECTED_SHA=$(node -p 'require("./data/recovery/v4-11-wave12-major-portals-filtered-artifact.json").jsonl_sha256')
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/w12.zip"
          unzip -q "$RUNNER_TEMP/w12.zip" -d "$RUNNER_TEMP/w12"
          echo "$EXPECTED_SHA  $RUNNER_TEMP/w12/db-ready-wave12-major-portals-filtered.jsonl" | sha256sum -c -

      - name: Build final CSV
        run: |
          node - "$RUNNER_TEMP/w12/db-ready-wave12-major-portals-filtered.jsonl" "$RUNNER_TEMP/w12/final.csv" <<'NODE'
          const fs=require("fs"),m=require("./data/recovery/v4-11-wave12-major-portals-filtered-artifact.json");
          const [src,out]=process.argv.slice(2); const rows=fs.readFileSync(src,"utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          if(rows.length!==m.rows)throw new Error("row count");
          const e=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
          fs.writeFileSync(out,"listing_url,canonical_fingerprint,source_name,source_offer_key\n"+rows.map(r=>[r.listing_url,r.canonical_fingerprint,r.source_name,r.source_offer_key].map(e).join(",")).join("\n")+"\n");
          NODE

      - name: Require zero overlap
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/w12/final.sql" <<'SQL'
          CREATE TEMP TABLE w12_final_pf(listing_url text,canonical_fingerprint text,source_name text,source_offer_key text);
          \copy w12_final_pf FROM '/w12/final.csv' WITH (FORMAT csv, HEADER true)
          SELECT
            (SELECT count(*) FROM w12_final_pf),
            (SELECT count(*) FROM w12_final_pf c JOIN public.listing_sources ls ON ls.listing_url=c.listing_url),
            (SELECT count(*) FROM w12_final_pf c JOIN public.property_listings pl ON pl.canonical_fingerprint=c.canonical_fingerprint),
            (SELECT count(*) FROM w12_final_pf c JOIN public.listing_sources ls ON ls.source_name=c.source_name AND ls.source_offer_key=c.source_offer_key),
            (SELECT count(*) FROM public.property_listings),
            (SELECT count(*) FROM public.listing_sources);
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w12:/w12" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -f /w12/final.sql' | tee data/audits/v4-11-wave12-major-portals-final-preflight/preflight.txt
          ROWS=$(node -p 'require("./data/recovery/v4-11-wave12-major-portals-filtered-artifact.json").rows')
          test "$(cat data/audits/v4-11-wave12-major-portals-final-preflight/preflight.txt)" = "$ROWS|0|0|0|142732|142732"

      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-wave12-major-portals-final-preflight
          path: data/audits/v4-11-wave12-major-portals-final-preflight/
          retention-days: 30
