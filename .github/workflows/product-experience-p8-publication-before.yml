name: Product Experience P8 Publication BEFORE

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/product-experience-p8-publication-before.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start exact main runtime
        shell: bash
        run: |
          npm run dev -- -p 3219 > /tmp/product-experience-p8-before.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3219/vendre/dossier >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/product-experience-p8-before.log
          exit 1
      - name: Capture P8 BEFORE
        env:
          BASE_URL: http://127.0.0.1:3219
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import { mkdir, writeFile } from "node:fs/promises";
          import path from "node:path";

          const outputDir = path.resolve("artifacts/product-experience-p8-before");
          const viewports = [
            { width: 390, height: 844 },
            { width: 430, height: 932 },
            { width: 768, height: 900 },
            { width: 1280, height: 900 },
          ];
          await mkdir(outputDir, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const results = [];
          const findings = [];
          try {
            for (const viewport of viewports) {
              const page = await browser.newPage({ viewport, colorScheme: "light", reducedMotion: "reduce" });
              const localFindings = [];
              try {
                const response = await page.goto(`${process.env.BASE_URL}/vendre/dossier`, { waitUntil: "networkidle", timeout: 60_000 });
                await page.locator("body").waitFor({ state: "visible", timeout: 15_000 });
                const metrics = await page.evaluate(() => {
                  const header = document.querySelector("header");
                  return {
                    clientWidth: document.documentElement.clientWidth,
                    scrollWidth: document.documentElement.scrollWidth,
                    h1Count: document.querySelectorAll("h1").length,
                    mainCount: document.querySelectorAll("main").length,
                    headerBackground: header instanceof HTMLElement ? getComputedStyle(header).backgroundColor : null,
                  };
                });
                if ((response?.status() ?? 0) !== 200) localFindings.push(`HTTP_${response?.status() ?? 0}`);
                if (metrics.scrollWidth > metrics.clientWidth + 1) localFindings.push(`OVERFLOW_${metrics.scrollWidth}_${metrics.clientWidth}`);
                if (metrics.h1Count !== 1) localFindings.push(`H1_COUNT_${metrics.h1Count}`);
                if (metrics.mainCount !== 1) localFindings.push(`MAIN_COUNT_${metrics.mainCount}`);
                const screenshot = `publication-${viewport.width}x${viewport.height}.png`;
                await page.screenshot({ path: path.join(outputDir, screenshot), fullPage: true });
                results.push({ ...viewport, screenshot, findings: localFindings, ...metrics });
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                localFindings.push(`AUDIT_ERROR_${message}`);
                results.push({ ...viewport, findings: localFindings, error: message });
              } finally {
                findings.push(...localFindings.map((finding) => ({ width: viewport.width, height: viewport.height, finding })));
                await page.close();
              }
            }
          } finally {
            await browser.close();
          }
          const report = {
            schemaVersion: "AKARFINDER_PRODUCT_EXPERIENCE_P8_BEFORE_V1",
            generatedAt: new Date().toISOString(),
            route: "/vendre/dossier",
            screenshotCount: results.filter((item) => item.screenshot).length,
            findingCount: findings.length,
            findings,
            results,
          };
          await writeFile(path.join(outputDir, "report.json"), `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify({ screenshotCount: report.screenshotCount, findingCount: report.findingCount, findings }, null, 2));
          if (report.screenshotCount !== 4) throw new Error(`P8 BEFORE capture incomplete: ${report.screenshotCount}/4`);
          NODE
      - name: Upload P8 BEFORE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-experience-p8-before-${{ github.run_id }}
          path: artifacts/product-experience-p8-before
          if-no-files-found: error
          retention-days: 14
