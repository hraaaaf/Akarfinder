name: Recovery V4.11 Wave8 Neon Overlap Preflight

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/activate-v4-11-wave8-neon-preflight.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate isolated target and artifact contract
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          python - <<'PY'
          import os,urllib.parse
          h=urllib.parse.urlparse(os.environ["DATABASE_URL"]).hostname
          allowed={
            "ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech",
          }
          if h not in allowed: raise SystemExit("refusing unexpected Neon host")
          PY

      - name: Download certified Wave8 artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w8"
          gh api repos/${{ github.repository }}/actions/artifacts/10934176431/zip > "$RUNNER_TEMP/w8.zip"
          unzip -q -o "$RUNNER_TEMP/w8.zip" -d "$RUNNER_TEMP/w8"
          echo "85e65311dba66008a02f1c145e1166db26c186029c22cfae1b3628e67074cb31  $RUNNER_TEMP/w8/db-ready-wave8.jsonl" | sha256sum -c -
          test "$(wc -l < "$RUNNER_TEMP/w8/db-ready-wave8.jsonl")" = "39132"

      - name: Build identity preflight CSV
        run: |
          node - "$RUNNER_TEMP/w8/db-ready-wave8.jsonl" "$RUNNER_TEMP/w8/preflight.csv" <<'NODE'
          const fs=require("fs");
          const [src,out]=process.argv.slice(2);
          const rows=fs.readFileSync(src,"utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          if(rows.length!==39132)throw new Error("row count");
          if(new Set(rows.map(r=>r.listing_url)).size!==rows.length)throw new Error("url duplicate");
          if(new Set(rows.map(r=>r.canonical_fingerprint)).size!==rows.length)throw new Error("fp duplicate");
          if(new Set(rows.map(r=>r.source_name+"|"+r.source_offer_key)).size!==rows.length)throw new Error("id duplicate");
          const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
          fs.writeFileSync(out,"listing_url,canonical_fingerprint,source_name,source_offer_key\n"+
            rows.map(r=>[r.listing_url,r.canonical_fingerprint,r.source_name,r.source_offer_key].map(esc).join(",")).join("\n")+"\n");
          NODE

      - name: Compare candidates against isolated Neon
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/w8/preflight.sql" <<'SQL'
          CREATE TEMP TABLE stage_w8 (
            listing_url text NOT NULL,
            canonical_fingerprint text NOT NULL,
            source_name text NOT NULL,
            source_offer_key text NOT NULL
          );
          \copy stage_w8 FROM '/w8/preflight.csv' WITH (FORMAT csv, HEADER true)

          WITH existing_identity AS (
            SELECT
              CASE
                WHEN listing_url ~* 'mubawab\.ma' THEN 'mubawab.ma'
                WHEN listing_url ~* 'avito\.ma' THEN 'avito.ma'
                ELSE NULL
              END AS domain,
              CASE
                WHEN listing_url ~* 'mubawab\.ma' THEN (regexp_match(listing_url, '/(a|pa)/([0-9]+)(/|$)'))[2]
                WHEN listing_url ~* 'avito\.ma' THEN (regexp_match(listing_url, '_([0-9]+)\.html?$'))[1]
                ELSE NULL
              END AS offer_id
            FROM public.listing_sources
          )
          SELECT
            (SELECT count(*) FROM stage_w8),
            (SELECT count(*) FROM stage_w8 s JOIN public.listing_sources ls ON ls.listing_url=s.listing_url),
            (SELECT count(*) FROM stage_w8 s JOIN public.property_listings pl ON pl.canonical_fingerprint=s.canonical_fingerprint),
            (SELECT count(*) FROM stage_w8 s JOIN existing_identity e ON e.domain=s.source_name AND e.offer_id=s.source_offer_key),
            (SELECT count(*) FROM public.property_listings),
            (SELECT count(*) FROM public.listing_sources),
            (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='clean-corpus-v4.11-wave8'),
            (SELECT count(*) FROM public.listing_sources ls LEFT JOIN public.property_listings pl ON pl.id=ls.property_listing_id WHERE pl.id IS NULL);
          SQL

          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w8:/w8" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -f /w8/preflight.sql' | tee "$RUNNER_TEMP/w8/preflight-result.txt"
          OUT="$(tail -n1 "$RUNNER_TEMP/w8/preflight-result.txt")"
          IFS='|' read -r STAGED URL_OVERLAP FP_OVERLAP ID_OVERLAP PL LS EXISTING_W8 ORPH <<< "$OUT"
          test "$STAGED" = "39132"
          test "$URL_OVERLAP" = "0"
          test "$FP_OVERLAP" = "0"
          test "$ID_OVERLAP" = "0"
          test "$PL" = "100226"
          test "$LS" = "100226"
          test "$EXISTING_W8" = "0"
          test "$ORPH" = "0"
          printf '%s\n' "staged=$STAGED" "url_overlap=$URL_OVERLAP" "fingerprint_overlap=$FP_OVERLAP" "identity_overlap=$ID_OVERLAP" "pre_properties=$PL" "pre_sources=$LS" "existing_wave8=$EXISTING_W8" "orphans=$ORPH" > "$RUNNER_TEMP/w8/preflight-verified.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-wave8-neon-overlap-preflight
          path: |
            ${{ runner.temp }}/w8/preflight-result.txt
            ${{ runner.temp }}/w8/preflight-verified.txt
          retention-days: 30
