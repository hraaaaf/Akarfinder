name: Morocco Web L6 Freshness Revisit

on:
  workflow_dispatch:
  push:
    branches:
      - feat/morocco-web-l6-freshness-revisit
    paths:
      - 'scripts/acquisition/freshness_revisit_engine.py'
      - 'scripts/acquisition/freshness_revisit_dry_run.py'
      - 'scripts/acquisition/__tests__/test_freshness_revisit_engine.py'
      - '.github/workflows/morocco-web-l6-freshness-revisit.yml'

permissions:
  contents: read

concurrency:
  group: morocco-web-l6-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest scripts/acquisition/__tests__/test_freshness_revisit_engine.py
      - name: Bounded freshness dry-run
        run: python scripts/acquisition/freshness_revisit_dry_run.py
      - name: Publish evidence summary
        if: always()
        run: |
          if [ -f artifacts/morocco-web-l6-freshness/report.md ]; then
            cat artifacts/morocco-web-l6-freshness/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morocco-web-l6-freshness-${{ github.run_id }}
          path: artifacts/morocco-web-l6-freshness/
          if-no-files-found: error
          retention-days: 14
