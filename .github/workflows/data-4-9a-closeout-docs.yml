name: DATA-4.9A Closeout Canonical Docs

on:
  push:
    branches:
      - data/data-4-9a-mass-source-onboarding-qualification
    paths:
      - ".github/workflows/data-4-9a-closeout-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closeout-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/data-4-9a-mass-source-onboarding-qualification
          fetch-depth: 0
      - name: Finalize canonical DATA metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text()
          text = text.replace('**Version : 2026-08-09**', '**Version : 2026-08-10**', 1)
          text = text.replace('**DATA-4.9A 🟠 #444** — exact-head `52a62b94985570c257e19d48c265bd3789c191ad`', '**DATA-4.9A 🟠 #444** — certified audit head `52a62b94985570c257e19d48c265bd3789c191ad`', 1)
          roadmap.write_text(text)

          session = Path('docs/SESSION.md')
          text = session.read_text()
          text = text.replace('**Mise à jour : 2026-08-09**', '**Mise à jour : 2026-08-10**', 1)
          text = text.replace('- Exact head : `52a62b94985570c257e19d48c265bd3789c191ad`.', '- Certified audit head : `52a62b94985570c257e19d48c265bd3789c191ad`.', 1)
          session.write_text(text)

          readme = Path('README.md')
          text = readme.read_text().replace('**DATA-4.9A 🟠 PR #444** — exact-head `52a62b94985570c257e19d48c265bd3789c191ad`', '**DATA-4.9A 🟠 PR #444** — certified audit head `52a62b94985570c257e19d48c265bd3789c191ad`', 1)
          readme.write_text(text)
          PY
      - name: Commit metadata closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md
          if git diff --cached --quiet; then
            echo "No metadata changes required"
            exit 0
          fi
          git commit -m "DATA-4.9A: finalize canonical closeout metadata"
          git push origin HEAD:data/data-4-9a-mass-source-onboarding-qualification
