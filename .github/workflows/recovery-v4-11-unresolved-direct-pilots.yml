name: Recovery V4.11 Unresolved Direct Verification Pilots

on:
  push:
    branches: ["recovery/v4-11-certified-import-wave2-20260927"]
    paths:
      - "data/recovery/activate-v4-11-unresolved-direct-pilots.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - domain: agenz.ma
            expected: 8040
          - domain: avito.ma
            expected: 1947
          - domain: domio.ma
            expected: 6843
          - domain: promoimmomarrakech.com
            expected: 3705
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DEEP_DOMAIN: ${{ matrix.domain }}
      DEEP_OFFSET: "0"
      DEEP_LIMIT: "500"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Download reconciled unresolved ledger
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reconciled"
          gh api repos/${{ github.repository }}/actions/artifacts/10927761643/zip > "$RUNNER_TEMP/reconciled.zip"
          unzip -q -o "$RUNNER_TEMP/reconciled.zip" -d "$RUNNER_TEMP/reconciled"
          test -s "$RUNNER_TEMP/reconciled/unresolved-existence.txt"
          node - <<'NODE'
          const fs=require("fs");
          const domain=process.env.DEEP_DOMAIN;
          const expected=Number("${{ matrix.expected }}");
          const urls=fs.readFileSync(process.env.RUNNER_TEMP+"/reconciled/unresolved-existence.txt","utf8")
            .split(/\r?\n/).filter(Boolean)
            .filter(u=>{try{return new URL(u).hostname.replace(/^www\./,"")===domain}catch{return false}});
          if(urls.length!==expected)throw new Error(domain+" unresolved count "+urls.length+" != "+expected);
          const out=process.env.RUNNER_TEMP+"/queue-"+domain+".txt";
          fs.writeFileSync(out,urls.join("\n")+"\n");
          fs.appendFileSync(process.env.GITHUB_ENV,"DEEP_URL_FILE="+out+"\n");
          NODE

      - name: Verify first 500 unresolved URLs read-only
        run: npx tsx scripts/recovery/deep-enrichment-source-batch.ts

      - name: Assert zero DB access
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const d=process.env.DEEP_DOMAIN.replace(/[^a-z0-9]+/gi,"-");
          const p="data/audits/raw-results/deep-batch-"+d+"-0-500-summary.json";
          const s=JSON.parse(fs.readFileSync(p,"utf8"));
          if(s.input_urls!==500)throw new Error("input");
          if(s.database_access!==0||s.database_writes!==0)throw new Error("DB invariant");
          if(s.fetched+s.failed+s.robots_skipped!==500)throw new Error("accounting");
          console.log(JSON.stringify(s,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-direct-pilot-${{ matrix.domain }}
          path: data/audits/raw-results/deep-batch-*.json
          retention-days: 30
