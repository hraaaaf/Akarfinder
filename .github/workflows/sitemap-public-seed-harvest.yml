name: Public Sitemap Seed Harvest

# MASS-ACQUISITION-FREE-ACCELERATION-1
# DATA-40K-GATE-IMMEDIATE-SITEMAP-RUN-2026-07-24-R2
# P0.2-DISCOVERY-FRESHNESS-KEYSET-PAGINATION
# Free acquisition lane: robots.txt -> explicitly declared sitemap files ->
# strict listing URL patterns -> source_offer_seeds only. No listing page fetch,
# no paid API, no public listing write. Scheduled/push runs require the same
# three production write gates; PR/manual runs are dry-run unless manual
# dispatch explicitly requests apply.

on:
  schedule:
    - cron: "23 */6 * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sitemap-public-seed-harvest.yml"
      - "scripts/openserp/sitemap-registry-mass-harvest.ts"
      - "scripts/openserp/reconcile-commoncrawl-seed-freshness.ts"
      - "scripts/scrapers/__tests__/public-sitemap-freshness-keyset.test.ts"
      - "supabase/migrations/20260823134500_discovery_freshness_keyset_pagination.sql"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sitemap-public-seed-harvest.yml"
      - "scripts/openserp/reconcile-commoncrawl-seed-freshness.ts"
      - "scripts/scrapers/__tests__/public-sitemap-freshness-keyset.test.ts"
      - "supabase/migrations/20260823134500_discovery_freshness_keyset_pagination.sql"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run or apply"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: public-sitemap-seed-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical workflow ref
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify P0.2 freshness cursor pagination
        run: npx tsx --test scripts/scrapers/__tests__/public-sitemap-freshness-keyset.test.ts

      - name: Harvest robots-declared public sitemaps
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENSERP_AUTOMATED_INGESTION_ENABLED: ${{ secrets.OPENSERP_AUTOMATED_INGESTION_ENABLED }}
          OPENSERP_INGESTION_WRITE_ENABLED: ${{ secrets.OPENSERP_INGESTION_WRITE_ENABLED }}
          OPENSERP_INGESTION_CRON_ENABLED: ${{ secrets.OPENSERP_INGESTION_CRON_ENABLED }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ]; then
            MODE="apply"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "apply" ]; then
            MODE="apply"
          else
            MODE="dry-run"
          fi
          if [ "$MODE" = "apply" ]; then
            npx tsx scripts/openserp/sitemap-registry-mass-harvest.ts --apply
            npx tsx scripts/openserp/reconcile-commoncrawl-seed-freshness.ts --apply
          else
            npx tsx scripts/openserp/sitemap-registry-mass-harvest.ts
            npx tsx scripts/openserp/reconcile-commoncrawl-seed-freshness.ts
          fi
