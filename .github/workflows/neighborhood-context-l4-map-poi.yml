name: Neighborhood Context L4 Map POI

on:
  pull_request:
    paths:
      - "components/map/**"
      - "app/map/**"
      - "lib/neighborhood-context/**"
      - "scripts/audits/neighborhood-context-l4-**"
      - "docs/NEIGHBORHOOD_CONTEXT_L4_VISUAL_TARGET.md"
      - "docs/visual-targets/neighborhood-context-l4-map-reperes.svg"
      - ".github/workflows/neighborhood-context-l4-map-poi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neighborhood-context-l4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  before-gate:
    if: ${{ !contains(github.event.pull_request.title || '', '[L4 AFTER]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AUDIT_OUTPUT_DIR: data/audits/neighborhood-context-l4-before
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture L4 BEFORE
        run: node scripts/audits/neighborhood-context-l4-before-audit.mjs

      - name: Upload L4 BEFORE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neighborhood-context-l4-before-${{ github.run_id }}
          path: data/audits/neighborhood-context-l4-before
          if-no-files-found: error
          retention-days: 30
