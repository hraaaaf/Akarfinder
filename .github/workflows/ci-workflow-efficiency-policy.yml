name: CI Workflow Efficiency Policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/ci/validate-workflow-efficiency.mjs"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Enforce heavy-workflow efficiency rules
        run: node scripts/ci/validate-workflow-efficiency.mjs
