name: Neon production deploy
on:
  push:
    branches: [release/neon-recovery-live-20260928]
    paths: [.github/workflows/neon-prod-promote.yml]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy current exact HEAD to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg sha "$GITHUB_SHA" '{name:"akarfinder",project:"prj_RCs2Ku5vex9cpABWnwaCjbuKrhhc",target:"production",gitSource:{type:"github",repoId:1043264095,ref:"release/neon-recovery-live-20260928",sha:$sha}}')
          code=$(curl -sS -o /tmp/deploy -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=team_NNhXPDOIfjGNBcn253btpyk0" --data "$payload")
          cat /tmp/deploy | jq -c '{id,url,target,readyState,error}'
          test "$code" = "200" -o "$code" = "201"
