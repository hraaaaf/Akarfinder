name: DATA-4.6A Dar Agadir Mass Expansion Qualification

on:
  pull_request:
    paths:
      - "scripts/audits/data-4-6a-daragadir-mass-expansion-qualification.ts"
      - "scripts/data4/__tests__/data-4-6a-daragadir-mass-expansion-qualification.test.ts"
      - ".github/workflows/data-4-6a-daragadir-mass-expansion-qualification.yml"
      - "docs/DATA_4_6A_DARAGADIR_MASS_EXPANSION_QUALIFICATION.md"
  push:
    branches: [main]
    paths:
      - "scripts/audits/data-4-6a-daragadir-mass-expansion-qualification.ts"
      - "scripts/data4/__tests__/data-4-6a-daragadir-mass-expansion-qualification.test.ts"
      - ".github/workflows/data-4-6a-daragadir-mass-expansion-qualification.yml"
      - "docs/DATA_4_6A_DARAGADIR_MASS_EXPANSION_QUALIFICATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: DATA-4.6A focused contract test
        run: npx tsx --test scripts/data4/__tests__/data-4-6a-daragadir-mass-expansion-qualification.test.ts
      - name: Dar Agadir sitemap regression tests
        run: npx tsx --test scripts/data4/__tests__/daragadir-sitemap-revalidation.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Static read-only boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('scripts/audits/data-4-6a-daragadir-mass-expansion-qualification.ts', 'utf8');
          for (const required of [
            'mode: "READ_ONLY_QUALIFICATION"',
            'databaseWrites: 0',
            'freshnessWrites: 0',
            'registryMutations: 0',
            'policyChanges: 0',
            'productionActivation: false',
            'detailPageFetches: 0',
            'writeAuthorized: false',
            'MAX_SOURCE_REQUESTS = 2',
            'SOURCE_SITEMAP_DECLARATION_DRIFT',
            'ROTATE_TO_NEXT_PUBLIC_SITEMAP_RESERVOIR',
          ]) if (!s.includes(required)) throw new Error(`missing contract: ${required}`);
          if (/method:\s*["'](?:POST|PATCH|PUT|DELETE)["']/.test(s)) throw new Error('mutation HTTP method forbidden in DATA-4.6A');
          NODE

  live-read-only:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_4_6A_OUT_DIR: .tmp/data-4-6a/results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run DATA-4.6A live read-only qualification
        run: npx tsx scripts/audits/data-4-6a-daragadir-mass-expansion-qualification.ts
      - name: Enforce proof
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('.tmp/data-4-6a/results/proof.json', 'utf8'));
          if (p.schemaVersion !== 'data-4-6a-daragadir-mass-expansion-qualification-v1') throw new Error(JSON.stringify(p));
          if (p.mode !== 'READ_ONLY_QUALIFICATION' || p.sourceDomain !== 'daragadir.com') throw new Error(JSON.stringify(p));
          if (p.databaseWrites !== 0 || p.freshnessWrites !== 0 || p.registryMutations !== 0 || p.policyChanges !== 0 || p.productionActivation !== false || p.detailPageFetches !== 0 || p.writeAuthorized !== false) throw new Error(JSON.stringify(p));
          if (p.sourceRequests < 1 || p.sourceRequests > 2 || p.totalSeeds < 1) throw new Error(JSON.stringify(p));
          if (p.verdict === 'SOURCE_SITEMAP_DECLARATION_DRIFT') {
            if (p.sourceDeclarationMatchesRegistry !== false || p.declaredSitemaps.length !== 0 || p.suggestedNextCheckpoint !== 0 || p.nextLot !== 'ROTATE_TO_NEXT_PUBLIC_SITEMAP_RESERVOIR') throw new Error(JSON.stringify(p));
          } else if (p.verdict === 'SITEMAP_DECLARATION_PRESENT_REQUIRES_SEPARATE_EXPANSION_REPLAY') {
            if (p.sourceDeclarationMatchesRegistry !== true || p.declaredSitemaps.length < 1) throw new Error(JSON.stringify(p));
          } else throw new Error(`unexpected verdict ${JSON.stringify(p)}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: data-4-6a-daragadir-mass-expansion-qualification
          path: .tmp/data-4-6a/results/
          if-no-files-found: error
          retention-days: 14
