name: ODM Price Coverage Recovery V1

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260801210000_odm_price_coverage_recovery_v1.sql'
      - 'scripts/odm-price-coverage-recovery-v1-contract.mjs'
      - '.github/workflows/odm-price-coverage-recovery-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/odm-price-coverage-recovery-v1-contract.mjs
      - run: npm run typecheck --if-present
      - run: npm run build
