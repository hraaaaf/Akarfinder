name: Neon Owner Read Portability Probe

# SUPABASE-TO-NEON-MIGRATION-20260923
# Validation-only. Proves the owner public Search read model and its relational
# parents restore on vanilla PostgreSQL 17 without Auth/Storage dependencies.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-owner-read-portability-probe
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_URL: ${{ secrets.SUPABASE_DATABASE_URL_DIRECT }}
      PG_IMAGE: postgres:17

    steps:
      - name: Validate source secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_URL:-}" ]; then
            echo "::error::Missing SUPABASE_DATABASE_URL_DIRECT"
            exit 1
          fi

      - name: Export owner-read dependency closure
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e SOURCE_URL="$SOURCE_URL" \
            -v "$RUNNER_TEMP:/work" \
            "$PG_IMAGE" \
            sh -lc 'pg_dump "$SOURCE_URL" -Fc --no-owner --no-acl \
              --table=public.buyer_leads \
              --table=public.seller_property_drafts \
              --table=public.seller_listing_publications \
              --table=public.owner_listing_representations \
              -f /work/akarfinder-owner-read.dump'

      - name: Start clean PostgreSQL 17 scratch database
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name akarfinder-owner-pg17-scratch \
            -e POSTGRES_PASSWORD=akarfinder-owner-scratch \
            -e POSTGRES_DB=akarfinder_owner_scratch \
            -p 55434:5432 \
            "$PG_IMAGE"
          for attempt in $(seq 1 30); do
            if docker exec akarfinder-owner-pg17-scratch pg_isready -U postgres -d akarfinder_owner_scratch >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Scratch PostgreSQL did not become ready"
          exit 1

      - name: Prove owner-read tables are dependency-closed
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network host \
            -v "$RUNNER_TEMP:/work" \
            "$PG_IMAGE" \
            pg_restore \
              --exit-on-error \
              --single-transaction \
              --no-owner \
              --no-acl \
              -d postgresql://postgres:akarfinder-owner-scratch@127.0.0.1:55434/akarfinder_owner_scratch \
              /work/akarfinder-owner-read.dump

      - name: Verify source and scratch owner content parity
        shell: bash
        run: |
          set -euo pipefail
          tables="buyer_leads seller_property_drafts seller_listing_publications owner_listing_representations"
          for table in $tables; do
            digest_sql="select md5(coalesce(string_agg(row_hash, '' order by row_hash), '')) from (select md5(row_to_json(t)::text) as row_hash from public.$table t) q;"

            source_count=$(docker run --rm -e SOURCE_URL="$SOURCE_URL" "$PG_IMAGE" \
              sh -lc "psql \"\$SOURCE_URL\" -X -qAt -v ON_ERROR_STOP=1 -c 'select count(*) from public.$table'")
            scratch_count=$(docker exec akarfinder-owner-pg17-scratch \
              psql -U postgres -d akarfinder_owner_scratch -X -qAt -v ON_ERROR_STOP=1 \
              -c "select count(*) from public.$table")

            source_digest=$(docker run --rm -e SOURCE_URL="$SOURCE_URL" -e DIGEST_SQL="$digest_sql" "$PG_IMAGE" \
              sh -lc 'psql "$SOURCE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "$DIGEST_SQL"')
            scratch_digest=$(docker exec akarfinder-owner-pg17-scratch \
              psql -U postgres -d akarfinder_owner_scratch -X -qAt -v ON_ERROR_STOP=1 \
              -c "$digest_sql")

            echo "$table source_count=$source_count scratch_count=$scratch_count source_digest=$source_digest scratch_digest=$scratch_digest"
            if [ "$source_count" != "$scratch_count" ]; then
              echo "::error::$table row-count mismatch source=$source_count scratch=$scratch_count"
              exit 1
            fi
            if [ "$source_digest" != "$scratch_digest" ]; then
              echo "::error::$table content digest mismatch source=$source_digest scratch=$scratch_digest"
              exit 1
            fi
          done

      - name: Stop scratch database
        if: always()
        shell: bash
        run: docker rm -f akarfinder-owner-pg17-scratch >/dev/null 2>&1 || true
