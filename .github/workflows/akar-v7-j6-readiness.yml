name: Akar V7 J6 Source Proof + Isolated PostgreSQL (NO PROD)
on:
  pull_request:
    paths:
      - 'scripts/acquisition/v7_parallel/j6_staging_readiness.py'
      - 'scripts/acquisition/__tests__/test_v7_j6_staging_readiness.py'
      - 'scripts/acquisition/v7_parallel/j6_source_evidence.py'
      - 'scripts/acquisition/__tests__/test_v7_j6_source_evidence.py'
      - 'scripts/acquisition/__tests__/test_v7_j6_postgres_isolation.py'
      - '.github/workflows/akar-v7-j6-readiness.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  j6-ephemeral-provenance-check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: akarfinder_v7_j6_ci
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d akarfinder_v7_j6_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RADAR_TEST_DSN: postgresql://postgres:testpass@127.0.0.1:5432/akarfinder_v7_j6_ci
      AKAR_J6_EPHEMERAL_TEST_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated PostgreSQL test client
        run: python -m pip install "psycopg[binary]==3.3.8" "beautifulsoup4==4.14.3"
      - name: Compile readiness gate without network or DB
        run: |
          python -m py_compile scripts/acquisition/v7_parallel/j6_staging_readiness.py scripts/acquisition/__tests__/test_v7_j6_staging_readiness.py scripts/acquisition/v7_parallel/j6_source_evidence.py scripts/acquisition/__tests__/test_v7_j6_source_evidence.py scripts/acquisition/__tests__/test_v7_j6_postgres_isolation.py
      - name: Actual V3 + Radar10 negative-admission contracts
        run: |
          python -m unittest discover -s scripts/acquisition/__tests__ -p 'test_v7_j6_staging_readiness.py' -v

      - name: Check HTML SHA and deterministic V3 replay (no source requests)
        run: python -m unittest discover -s scripts/acquisition/__tests__ -p 'test_v7_j6_source_evidence.py' -v
      - name: Check isolated PostgreSQL RLS, roles, transaction rollback
        run: python -m unittest discover -s scripts/acquisition/__tests__ -p 'test_v7_j6_postgres_isolation.py' -v
