name: AkarFinder - Q2B Conservative Clustering V1

on:
  push:
    branches: [data/q2b-conservative-clustering-v1]
    paths:
      - 'scripts/audits/candidate-lake-q2b-cluster-v1.py'
      - 'scripts/audits/candidate-lake-q2b-smoke-test.py'
      - '.github/workflows/candidate-lake-q2b-clustering.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      Q2B_Q1D_ROOT: .tmp/q2b-input/q1d
      Q2B_Q2A_ROOT: .tmp/q2b-input/q2a
      Q2B_OUT: .tmp/q2b-clusters
      Q1D_ARTIFACT_ID: '10022063956'
      Q2A_ARTIFACT_ID: '10022400823'
    steps:
      - uses: actions/checkout@v4
      - name: Download certified Q1D and Q2A artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$Q2B_Q1D_ROOT" "$Q2B_Q2A_ROOT" .tmp/downloads
          download_artifact() {
            local id="$1" dest="$2" label="$3"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o ".tmp/downloads/${label}.zip"
            unzip -q ".tmp/downloads/${label}.zip" -d "$dest"
          }
          download_artifact "$Q1D_ARTIFACT_ID" "$Q2B_Q1D_ROOT" q1d
          download_artifact "$Q2A_ARTIFACT_ID" "$Q2B_Q2A_ROOT" q2a
      - name: Build conservative probable_unique clusters
        run: python scripts/audits/candidate-lake-q2b-cluster-v1.py
      - name: Verify Q2B invariants
        run: python scripts/audits/candidate-lake-q2b-smoke-test.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-lake-q2b-conservative-clusters-v1
          path: .tmp/q2b-clusters/
          retention-days: 30
          if-no-files-found: error
