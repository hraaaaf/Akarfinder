name: Carte Lot 8 Casablanca Visual After

on:
  pull_request:
    paths:
      - "components/map/MapNeighborhoodClient.tsx"
      - "components/map/MapNeighborhoodExperience.tsx"
      - "components/map/P4MapDecisionRail.tsx"
      - "lib/neighborhood-context/**"
      - "scripts/scrapers/__tests__/neighborhood-context-l3-read-model.test.ts"
      - "scripts/scrapers/__tests__/territory-landmark-registry.test.ts"
      - "app/map/**"
      - "scripts/audits/carte-lot8-casablanca-visual-after.mjs"
      - ".github/workflows/carte-lot8-casablanca-visual-after.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture-casablanca-after:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:3205
      AUDIT_OUTPUT_DIR: data/audits/carte-lot8-casablanca-after
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Latest-commit scope check
        id: scope
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(components/map/(MapNeighborhoodClient|MapNeighborhoodExperience|P4MapDecisionRail|MapLibreNeighborhood3D|NationalMapRouter|PremiumInteractiveMap)\.tsx|lib/neighborhood-context/|lib/geo/|app/map/|scripts/audits/carte-lot8-casablanca-visual-after\.mjs|scripts/scrapers/__tests__/(neighborhood-context-l3-read-model|territory-landmark-registry)\.test\.ts|\.github/workflows/carte-lot8-casablanca-visual-after\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.run == 'true'
      - name: Maârif truth contracts
        if: steps.scope.outputs.run == 'true'
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/neighborhood-context-l3-read-model.test.ts
          scripts/scrapers/__tests__/territory-landmark-registry.test.ts
      - name: TypeScript
        if: steps.scope.outputs.run == 'true'
        run: npx tsc --noEmit
      - name: Install Chromium
        if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Production build
        if: steps.scope.outputs.run == 'true'
        run: npm run build
      - name: Start production server
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          npm run start -- -p 3205 > /tmp/carte-lot8-casablanca-after.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3205/map?city=casablanca&district=maarif&layer=explore' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/carte-lot8-casablanca-after.log
          exit 1
      - name: Capture Casablanca after
        if: steps.scope.outputs.run == 'true'
        run: node scripts/audits/carte-lot8-casablanca-visual-after.mjs
      - name: Upload Casablanca after proof
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: carte-lot8-casablanca-after-${{ github.run_id }}
          path: data/audits/carte-lot8-casablanca-after
          if-no-files-found: error
          retention-days: 30
