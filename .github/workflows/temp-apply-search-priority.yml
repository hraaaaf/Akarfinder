name: Temporary Apply Search Priority

on:
  push:
    branches:
      - feat/search-commercial-priority-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/search-commercial-priority-v1
          fetch-depth: 0

      - name: Verify and apply source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/search-commercial-priority/part-* > /tmp/search-commercial-priority.b64
          echo "e9750e0631b27b7591ff03f4336db304671fd3a2fa9e7add38ff498ea09bcf7e  /tmp/search-commercial-priority.b64" | sha256sum -c -
          base64 --decode /tmp/search-commercial-priority.b64 > /tmp/search-commercial-priority.tar.gz
          echo "6b89665f2aadc80e3f1b690df5cd58240857c657fda1914b6326ec0658e2d6ee  /tmp/search-commercial-priority.tar.gz" | sha256sum -c -
          tar -xzf /tmp/search-commercial-priority.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf .tmp/search-commercial-priority
          rm -f .github/workflows/temp-apply-search-priority.yml

      - name: Commit reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(search): enforce commercial listing priority"
          git push origin HEAD:feat/search-commercial-priority-v1
