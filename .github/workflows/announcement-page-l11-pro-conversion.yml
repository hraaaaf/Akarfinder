name: Announcement Page L11 Pro Conversion

on:
  pull_request:
    paths:
      - "components/listings/**"
      - "lib/listings/pro-conversion.ts"
      - "lib/listings/listing-boundary.ts"
      - "app/visual-qa/announcement-page-pro-conversion/**"
      - "scripts/audits/announcement-page-l11-visual.mjs"
      - "scripts/scrapers/__tests__/announcement-page-l11-pro-conversion.test.ts"
      - ".github/workflows/announcement-page-l11-pro-conversion.yml"
  push:
    branches:
      - main
      - agent/announcement-page-l11-pro-conversion
    paths:
      - "components/listings/**"
      - "lib/listings/pro-conversion.ts"
      - "lib/listings/listing-boundary.ts"
      - "app/visual-qa/announcement-page-pro-conversion/**"
      - "scripts/audits/announcement-page-l11-visual.mjs"
      - "scripts/scrapers/__tests__/announcement-page-l11-pro-conversion.test.ts"
      - ".github/workflows/announcement-page-l11-pro-conversion.yml"

permissions:
  contents: read

jobs:
  pro-conversion-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ANN-L11 CTA truth contracts
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/announcement-page-l11-pro-conversion.test.ts
          scripts/scrapers/__tests__/listing-detail-boundary.test.ts
          scripts/scrapers/__tests__/ux-p1-decision-continuity.test.ts
          scripts/scrapers/__tests__/ux-p1-mobile-decision-ergonomics.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
