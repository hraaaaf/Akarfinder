name: Release Neon Preview Deploy

on:
  push:
    branches: ["release/neon-recovery-live-20260928"]
    paths:
      - "data/release/activate-neon-preview-deploy.txt"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEON_DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate release inputs
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$NEON_DATABASE_URL"
          test -f package-lock.json
      - name: Link AkarFinder Vercel project
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_NNhXPDOIfjGNBcn253btpyk0","projectId":"prj_RCs2Ku5vex9cpABWnwaCjbuKrhhc"}
          JSON
      - run: npm ci
      - name: Deploy preview with Neon runtime
        id: deploy
        run: |
          set -euo pipefail
          URL=$(npx --yes vercel@latest deploy --yes \
            --token="$VERCEL_TOKEN" --scope="achraf-benmoussa-s-projects" \
            --env DATABASE_PROVIDER=neon \
            --env DATABASE_URL="$NEON_DATABASE_URL")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "$URL" > preview-url.txt
      - name: Verify preview stats
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          BODY=$(curl -fsS "$URL/api/stats")
          node -e 'const x=JSON.parse(process.argv[1]);if(x.total_listings!==151900)throw new Error(JSON.stringify(x));console.log(JSON.stringify(x))' "$BODY"
          echo "$BODY" > preview-stats.json
      - name: Verify preview search
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          BODY=$(curl -fsS "$URL/api/listings?limit=1")
          node -e 'const x=JSON.parse(process.argv[1]);if(!x||typeof x!=="object")throw new Error("bad response");console.log(JSON.stringify(x).slice(0,1000))' "$BODY"
          echo "$BODY" > preview-listings.json
      - uses: actions/upload-artifact@v4
        with:
          name: neon-preview-proof
          path: |
            preview-url.txt
            preview-stats.json
            preview-listings.json
          retention-days: 30
