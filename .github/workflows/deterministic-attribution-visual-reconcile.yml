name: DETERMINISTIC-ATTRIBUTION Visual Reconcile

on:
  push:
    branches:
      - ux/deterministic-attribution-1
    paths:
      - "scripts/audits/apply-deterministic-attribution-visual-reconcile.mjs"
      - ".github/workflows/deterministic-attribution-visual-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/deterministic-attribution-1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/audits/apply-deterministic-attribution-visual-reconcile.mjs
      - name: Verify scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "scripts/audits/unified-listing-card-1-visual.mjs"
      - name: Remove temporary reconcile files
        run: |
          git rm scripts/audits/apply-deterministic-attribution-visual-reconcile.mjs
          git rm .github/workflows/deterministic-attribution-visual-reconcile.yml
      - name: Commit reconcile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audits/unified-listing-card-1-visual.mjs
          git commit -m "test(search): reconcile unified visual attribution proof"
          git push origin HEAD:ux/deterministic-attribution-1
