name: Phase 1 P1 Geo Productization Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  geo-productization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Geo productization contracts
        run: npx tsx --test scripts/scrapers/__tests__/phase1-p1-geo-productization.test.ts scripts/scrapers/__tests__/p1a3-map-navigation.test.ts scripts/scrapers/__tests__/p1a4-map-design-system.test.ts scripts/scrapers/__tests__/p1a5-territorial-explorer.test.ts scripts/scrapers/__tests__/p10b-map.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build rehearsal
        run: npm run build
