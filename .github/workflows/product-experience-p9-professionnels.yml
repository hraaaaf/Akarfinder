name: Product Experience P9 Professionnels

on:
  pull_request:
    paths:
      - "components/pro/ProPageV2.tsx"
      - "components/pro/ProActivationForm.tsx"
      - "scripts/audits/product-experience-p9-professionnels.mjs"
      - "scripts/scrapers/__tests__/product-experience-p9-professionnels.test.ts"
      - ".github/workflows/product-experience-p9-professionnels.yml"
      - "docs/AKARFINDER_PRODUCT_EXPERIENCE_P9.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-experience-p9-professionnels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  professionnels-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: P9 Professionnels contracts
        run: npx tsx --test scripts/scrapers/__tests__/product-experience-p9-professionnels.test.ts scripts/scrapers/__tests__/phase1-p1-b2b-productization.test.ts
      - name: Validate P9 audit syntax
        run: node --check scripts/audits/product-experience-p9-professionnels.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start P9 production server
        shell: bash
        run: |
          npm run start -- -p 3221 > /tmp/product-experience-p9.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3221/pro >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/product-experience-p9.log
          exit 1
      - name: P9 responsive visual certification
        env:
          BASE_URL: http://127.0.0.1:3221
          OUTPUT_DIR: artifacts/product-experience-p9-professionnels
        run: node scripts/audits/product-experience-p9-professionnels.mjs
      - name: Upload P9 AFTER proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-experience-p9-professionnels-${{ github.run_id }}
          path: artifacts/product-experience-p9-professionnels
          if-no-files-found: error
          retention-days: 14
