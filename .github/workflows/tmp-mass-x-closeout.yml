name: TEMP MASS-X closeout
on:
  pull_request:
    paths:
      - ".github/workflows/tmp-mass-x-closeout.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Render canonical DATA MASS blocks
        shell: python
        run: |
          from pathlib import Path
          def replace(path, start, end, body):
              p=Path(path); s=p.read_text(); a=s.index(start); b=s.index(end,a)+len(end); p.write_text(s[:a]+body+s[b:])
          readme='''<!-- DATA-MASS-CURRENT-START -->
## DATA MASS — état courant

- **MASS-1 → MASS-6 ✅ CLOSED** — programme national historique certifié.
- **MASS-X1 ✅ CLOSED — PR #581** — Candidate Promotion Shadow ; exact head `0b5bcccb6cf676108aad2087f43c2abc81f76f95` ; run `31751875324` SUCCESS ; merge `f5699e35d608471050d526020cb68cf79f6a3ecb` ; baseline 24 505 URL representations détail Maroc ; Registry 35 rows / 0 admissible ; sortie 0 promotable / 24 505 policy-blocked ; 0 write/fetch/activation/permission inférée.
- **MASS-X2 ✅ CLOSED — PR #583** — Discovery Deep Expansion ; exact head `af00e703e46db757b447503c07f0a1ed04d4daa2` ; 18 checks exact-head SUCCESS ; merge `1884a07acdfcc79a371089d3df768c46a73169ce` ; +1 100 candidats détail structurels mesurés en shadow ; projection baseline 24 505 → 25 605 URL representations, non assimilées à des biens uniques ; 0 write/fetch/activation/permission inférée.

Doctrine : attribution ≠ permission ; robots/sitemap/capability ≠ permission ; candidate ≠ authorization ; Source Registry autoritaire ; no-bypass.

**MASS-X reste une lane d'expansion shadow/read-only. Toute mutation/activation production reste soumise à un gate humain explicite séparé.**
<!-- DATA-MASS-CURRENT-END -->'''
          replace('README.md','<!-- DATA-MASS-CURRENT-START -->','<!-- DATA-MASS-CURRENT-END -->',readme)
          road='''<!-- DATA-MASS-PROGRAM-START -->
## DATA MASS — Programme national de volume

**Doctrine : `MASS FIRST → QUALITY LATER → PARTNER REPLACEMENT OVER TIME`.**

### MASS-1 → MASS-6 ✅ CLOSED
Programme national historique certifié, fail-closed à POLICY.

### MASS-X1 ✅ CLOSED — PR #581
Candidate Promotion Shadow ; run `31751875324` SUCCESS ; merge `f5699e35d608471050d526020cb68cf79f6a3ecb` ; 24 505 candidates détail Maroc, 0 promotable avec Registry 0 admissible ; aucune mutation/activation.

### MASS-X2 ✅ CLOSED — PR #583
Discovery Deep Expansion ; exact head `af00e703e46db757b447503c07f0a1ed04d4daa2` ; merge `1884a07acdfcc79a371089d3df768c46a73169ce` ; +1 100 candidates structurelles shadow, projection 25 605 URL representations ; aucune mutation/activation.

**Prochaine lane MASS : expansion supplémentaire du réservoir uniquement en shadow/read-only tant qu'aucune policy positive n'est vérifiée.**
<!-- DATA-MASS-PROGRAM-END -->'''
          replace('docs/ROADMAP.md','<!-- DATA-MASS-PROGRAM-START -->','<!-- DATA-MASS-PROGRAM-END -->',road)
          p=Path('docs/SESSION.md'); s=p.read_text(); a=s.index('### DATA MASS'); b=s.index('### UX/Search',a)
          data='''### DATA MASS

- **MASS-1 → MASS-6 ✅ CLOSED** — programme historique.
- **MASS-X1 ✅ CLOSED — PR #581** — run `31751875324` SUCCESS ; merge `f5699e35d608471050d526020cb68cf79f6a3ecb` ; 24 505 candidates détail, 0 promotable / 24 505 policy-blocked ; 0 mutation.
- **MASS-X2 ✅ CLOSED — PR #583** — exact head `af00e703e46db757b447503c07f0a1ed04d4daa2` ; 18 checks SUCCESS ; merge `1884a07acdfcc79a371089d3df768c46a73169ce` ; +1 100 candidates détail structurelles ; projection shadow 25 605 URL representations ; 0 mutation.
- Source Registry reste autoritaire ; aucune écriture DB/Registry/Search ni activation sans feu vert humain explicite.

'''
          s=s[:a]+data+s[b:]
          old='**DATA MASS : MASS-1 → MASS-6 ✅ CLOSED.** Aucun MASS-7 canonique n’est défini. Le National Mass Engine reste shadow/read-only et fail-closed à POLICY tant que le Source Registry ne contient aucune autorisation positive. Toute écriture DB/Registry/Search ou activation exige un feu vert humain explicite préalable.'
          new='**DATA MASS : MASS-X1 et MASS-X2 ✅ CLOSED après MASS-1 → MASS-6.** La lane d’expansion reste shadow/read-only ; prochain objectif : augmenter le réservoir utile sans confondre URL representations et biens uniques. Toute écriture DB/Registry/Search ou activation exige un feu vert humain explicite préalable.'
          s=s.replace(old,new); p.write_text(s)
      - name: Self-clean and commit
        run: |
          git rm .github/workflows/tmp-mass-x-closeout.yml
          test "$(git status --short | sed 's/^...//' | sort | tr '\n' ' ')" = "README.md docs/ROADMAP.md docs/SESSION.md "
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/ROADMAP.md docs/SESSION.md
          git commit -m "docs(data): close MASS-X1 and MASS-X2"
          git push