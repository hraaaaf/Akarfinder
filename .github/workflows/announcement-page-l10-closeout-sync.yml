name: ANN-L10 Closeout Sync

on:
  push:
    branches:
      - agent/announcement-page-l10-closeout

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/announcement-page-l10-closeout
          fetch-depth: 0
      - name: Reconcile ANN-L10 roadmap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/ANNOUNCEMENT_PAGE_ULTRA_PREMIUM_ROADMAP.md')
          text = p.read_text()
          replacements = {
            '**Statut : ANN-L0 ✅ CLOSED ; ANN-L1 ✅ CLOSED ; ANN-L2 ✅ CLOSED ; ANN-L3 ✅ CLOSED ; ANN-L4 ✅ CLOSED ; ANN-L5 ✅ CLOSED ; ANN-L6 ✅ CLOSED ; ANN-L7 ✅ CLOSED ; ANN-L8 ✅ CLOSED ; ANN-L9 ✅ CLOSED ; ANN-L10 NEXT**': '**Statut : ANN-L0 ✅ CLOSED ; ANN-L1 ✅ CLOSED ; ANN-L2 ✅ CLOSED ; ANN-L3 ✅ CLOSED ; ANN-L4 ✅ CLOSED ; ANN-L5 ✅ CLOSED ; ANN-L6 ✅ CLOSED ; ANN-L7 ✅ CLOSED ; ANN-L8 ✅ CLOSED ; ANN-L9 ✅ CLOSED ; ANN-L10 ✅ CLOSED ; ANN-L11 NEXT**',
            '**Progression stricte : 76 / 100 %.**': '**Progression stricte : 83 / 100 %.**',
            '### ANN-L10 — Finance Maroc — 7 %\n\nImplémentation : calculateur client déterministe ; taux/apport/durée modifiables ; hypothèses datées ; frais uniquement si sourcés/versionnés. Ne jamais présenter une simulation comme offre de crédit.\n\nGate : tests calculs, arrondis, taux 0/limites, disclaimer, aucune constante réglementaire silencieuse.': '### ANN-L10 — Finance Maroc — 7 % — ✅ CLOSED\n\nImplémentation : calculateur client déterministe ; taux/apport/durée modifiables ; hypothèses explicites ; frais uniquement si sourcés/versionnés. Ne jamais présenter une simulation comme offre de crédit.\n\nGate CLOSED : exact head `787416614a4de1de8fa0805d0d553396b4152547`, run `31960358141` SUCCESS, **5/5 tests PASS**, TypeScript, production build et Chromium ciblé SUCCESS, **4/4 captures + 0 finding**, artefact `9267110347`, digest `sha256:8bd4180e1a4e2c1cc15fd390689c8573ce751d9cdaeed0b996fb563853f84995`. Aucun taux bancaire/frais réglementaire silencieux ; taux vide par défaut ; simulation explicitement indicative. Détails : `docs/ANNOUNCEMENT_PAGE_L10_CLOSEOUT.md`.',
            '| ANN-L10 | 7 % | NEXT | 0 % |': '| ANN-L10 | 7 % | ✅ CLOSED | 7 % |',
            '| ANN-L11 | 6 % | NOT_STARTED | 0 % |': '| ANN-L11 | 6 % | NEXT | 0 % |',
            '**Progression officielle actuelle : 76 / 100 %.**': '**Progression officielle actuelle : 83 / 100 %.**',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 occurrence, got {count}: {old[:80]}')
              text = text.replace(old, new)
          p.write_text(text)
          PY
          git diff -- docs/ANNOUNCEMENT_PAGE_ULTRA_PREMIUM_ROADMAP.md
      - name: Commit roadmap sync
        run: |
          if git diff --quiet -- docs/ANNOUNCEMENT_PAGE_ULTRA_PREMIUM_ROADMAP.md; then
            echo 'No roadmap change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ANNOUNCEMENT_PAGE_ULTRA_PREMIUM_ROADMAP.md
          git commit -m 'docs(announcement): reconcile ANN-L10 closeout to 83 percent'
          git push origin HEAD:agent/announcement-page-l10-closeout
