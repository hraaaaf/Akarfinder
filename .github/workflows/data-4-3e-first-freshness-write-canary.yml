name: DATA-4.3E First Freshness Write Canary

on:
  pull_request:
    paths:
      - "scripts/data4/daragadir-freshness-write-canary.ts"
      - "scripts/data4/__tests__/daragadir-freshness-write-canary.test.ts"
      - "scripts/audits/data-4-3e-first-freshness-write-canary.ts"
      - ".github/workflows/data-4-3e-first-freshness-write-canary.yml"
      - "docs/data/DATA-4-3E-FIRST-FRESHNESS-WRITE-CANARY.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-4-3e-first-freshness-write-canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: DATA-4.3E unit tests
        run: npx tsx --test scripts/data4/__tests__/daragadir-freshness-write-canary.test.ts
      - name: DATA-4.3D evidence regression tests
        run: npx tsx --test scripts/data4/__tests__/daragadir-freshness-evidence-canary.test.ts
      - name: Existing seed freshness regression tests
        run: npm run test:seed-freshness
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  live-dry-run:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_4_3E_OUT_DIR: .tmp/data-4-3e/results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run 10-row dry-run write canary
        run: npx tsx scripts/audits/data-4-3e-first-freshness-write-canary.ts
      - name: Enforce bounded reversible proof
        shell: bash
        run: |
          set -euo pipefail
          test -s "${DATA_4_3E_OUT_DIR}/proof.json"
          test -s "${DATA_4_3E_OUT_DIR}/apply-manifest.json"
          test -s "${DATA_4_3E_OUT_DIR}/rollback-manifest.json"
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('.tmp/data-4-3e/results/proof.json','utf8'));
          const apply = JSON.parse(fs.readFileSync('.tmp/data-4-3e/results/apply-manifest.json','utf8'));
          const rollback = JSON.parse(fs.readFileSync('.tmp/data-4-3e/results/rollback-manifest.json','utf8'));
          if (p.mode !== 'DRY_RUN' || p.runId !== 'data-4-3e-daragadir-v1') throw new Error(JSON.stringify(p));
          if (p.canarySize !== 10 || apply.length !== 10 || rollback.length !== 10 || p.rollbackRows !== 10 || p.seedStateReads !== 10) throw new Error(JSON.stringify(p));
          if (p.eligibleSeedOnlyRows !== 5564) throw new Error(`DATA-4.3D ceiling drift: ${JSON.stringify(p)}`);
          if (p.ttlDays !== 14 || !['current','due_soon'].includes(p.registryReviewStatus)) throw new Error(`Registry drift: ${JSON.stringify(p)}`);
          if (p.sourceRequests < 2 || p.sourceRequests > 40) throw new Error(`Request budget: ${JSON.stringify(p)}`);
          if (p.databaseWrites !== 0 || p.freshnessWrites !== 0 || p.policyChanges !== 0 || p.displayPolicyChanges !== 0 || p.detailPageFetches !== 0 || p.contentReuseOperations !== 0) throw new Error(JSON.stringify(p));
          if (p.productionActivation !== false) throw new Error('Public activation is forbidden');
          for (let i = 0; i < apply.length; i++) {
            const a = apply[i];
            const r = rollback[i];
            if (a.canonicalUrl !== r.canonicalUrl) throw new Error('Rollback URL mismatch');
            if (a.before.freshnessStatus !== 'seed_only') throw new Error('Canary must begin seed_only');
            if (a.proposed.freshnessStatus !== 'fresh_confirmed') throw new Error('Unexpected proposed status');
            if (!a.proposed.freshChannels.includes('public_sitemap_presence')) throw new Error('Missing sitemap freshness channel');
            const fe = a.proposed.metadata?.freshness_evidence;
            if (!fe?.write_canary || fe.write_canary.run_id !== 'data-4-3e-daragadir-v1') throw new Error('Missing write canary marker');
            if (fe.write_canary.ttl_days !== 14) throw new Error('Unexpected write canary TTL');
            if (r.freshnessStatus !== a.before.freshnessStatus || r.freshLastSeenAt !== a.before.freshLastSeenAt) throw new Error('Rollback scalar mismatch');
            if (JSON.stringify(r.freshChannels) !== JSON.stringify(a.before.freshChannels) || JSON.stringify(r.metadata) !== JSON.stringify(a.before.metadata)) throw new Error('Rollback payload mismatch');
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: data-4-3e-first-freshness-write-canary
          path: .tmp/data-4-3e/results/
          if-no-files-found: error
          retention-days: 14
