name: P1B.13C Oasis Registry Offline Design Gate
# No remote DB; not production write authorization.

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260810113500_p1b13c_oasis_registry_production_write.sql'
      - 'supabase/migration-designs/p1b13b_oasis_registry_write.sql'
      - 'scripts/audits/p1b13b-oasis-registry-write-design-rehearsal.ts'
      - 'data/geo/p1b13a-oasis-registry-candidate-review.json'
      - '.github/workflows/p1b13c-oasis-registry-production-write.yml'
      - 'scripts/audits/tests/registry-offline-ci-boundary.test.mjs'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260810113500_p1b13c_oasis_registry_production_write.sql'
      - 'supabase/migration-designs/p1b13b_oasis_registry_write.sql'
      - 'scripts/audits/p1b13b-oasis-registry-write-design-rehearsal.ts'
      - 'data/geo/p1b13a-oasis-registry-candidate-review.json'
      - '.github/workflows/p1b13c-oasis-registry-production-write.yml'
      - 'scripts/audits/tests/registry-offline-ci-boundary.test.mjs'

permissions:
  contents: read

jobs:
  certify-oasis-production-write:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Assert hosted DB credentials absent
        shell: bash
        run: |
          set -euo pipefail
          for key in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_DATABASE_URL_DIRECT NEXT_PUBLIC_SUPABASE_URL DATABASE_URL; do
            if [ -n "${!key:-}" ]; then
              echo "::error::Hosted DB configuration forbidden in registry CI: $key"
              exit 1
            fi
          done
      - name: Offline workflow regression
        run: node --test scripts/audits/tests/registry-offline-ci-boundary.test.mjs
      - name: Exact certified-design parity and write boundary
        shell: bash
        run: |
          set -euo pipefail
          DESIGN='supabase/migration-designs/p1b13b_oasis_registry_write.sql'
          MIGRATION='supabase/migrations/20260810113500_p1b13c_oasis_registry_production_write.sql'
          cmp -s "$DESIGN" "$MIGRATION"
          grep -q "district_casablanca_oasis" "$MIGRATION"
          grep -q "city_casablanca" "$MIGRATION"
          grep -q "casablancacity.ma" "$MIGRATION"
          if grep -Eqi 'geo_resolution_events|property_listings|source_offer_seeds|thin_index_search_documents' "$MIGRATION"; then
            echo 'P1B.13C may only write the Oasis Registry entity/alias'
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('supabase/migrations/20260810113500_p1b13c_oasis_registry_production_write.sql','utf8');
          const ids = [...s.matchAll(/district_[a-z0-9_]+/g)].map(m=>m[0]);
          const unique = [...new Set(ids)];
          if (unique.length !== 1 || unique[0] !== 'district_casablanca_oasis') throw new Error(`unexpected district targets: ${unique.join(',')}`);
          if (!/validation_status, seo_eligible, map_eligible/.test(s) || !/'validated',\s*false,\s*false,/s.test(s)) throw new Error('Oasis must remain validated with SEO/Map OFF');
          NODE
      - name: PostgreSQL semantic rehearsal of certified design
        run: ./node_modules/.bin/tsx scripts/audits/p1b13b-oasis-registry-write-design-rehearsal.ts
      - name: TypeScript
        run: ./node_modules/.bin/tsc --noEmit
