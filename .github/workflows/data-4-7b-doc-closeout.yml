name: DATA-4.7B Canonical Doc Closeout

on:
  push:
    branches:
      - data/data-4-7b-lsf-controlled-expansion-write
    paths:
      - .github/workflows/data-4-7b-doc-closeout.yml

permissions:
  contents: write

jobs:
  patch-canonical-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/data-4-7b-lsf-controlled-expansion-write
          fetch-depth: 0
      - name: Patch canonical docs from complete checkout
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          START = '<!-- DATA-4.7B-CURRENT-START -->'
          END = '<!-- DATA-4.7B-CURRENT-END -->'
          README_B64 = ''
          ROADMAP_B64 = ''
          SESSION_B64 = ''
          def decode(value: str) -> str:
              return base64.b64decode(value).decode('utf-8')
          def upsert_before(path: str, anchor: str, body: str) -> None:
              p = Path(path)
              text = p.read_text()
              block = f"{START}\n{body.rstrip()}\n{END}\n"
              if START in text and END in text:
                  before, rest = text.split(START, 1)
                  _, after = rest.split(END, 1)
                  text = before + block + after.lstrip('\n')
              else:
                  if anchor not in text:
                      raise SystemExit(f'anchor not found in {path}: {anchor}')
                  text = text.replace(anchor, block + '\n' + anchor, 1)
              p.write_text(text)
          upsert_before('README.md', '## Doctrine', decode(README_B64))
          upsert_before('docs/ROADMAP.md', '# 1. Cap produit', decode(ROADMAP_B64))
          Path('docs/SESSION.md').write_text(decode(SESSION_B64))
          Path('.github/workflows/data-4-7b-doc-closeout.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md .github/workflows/data-4-7b-doc-closeout.yml
          git diff --cached --check
          git commit -m "DATA-4.7B: close canonical docs"
          git push origin HEAD:data/data-4-7b-lsf-controlled-expansion-write
