name: ODM-10C2 Honest 40K Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20260727110000_odm_10c2_honest_40k_gate.sql"
      - "supabase/migrations/20260805092500_lot_a1_truthful_listing_baseline.sql"
      - "docs/data/ODM-10C2-HONEST-40K.md"
      - ".github/workflows/odm-10c2-honest-40k.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  certify-honest-40k-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Fail-closed truthful-listing assertions
        run: |
          MIGRATION="supabase/migrations/20260805092500_lot_a1_truthful_listing_baseline.sql"
          grep -q "document_kind = 'LISTING'" "$MIGRATION"
          grep -q "public_listings >= 40000" "$MIGRATION"
          grep -q "public_non_listing" "$MIGRATION"
          grep -q "public_categories" "$MIGRATION"
          grep -q "public_ambiguous" "$MIGRATION"
          grep -q "leaked_noise = 0" "$MIGRATION"
          grep -q "enable row level security" "$MIGRATION"
          grep -q "from public, anon, authenticated" "$MIGRATION"
          grep -q "odm_trusted_price_reconciliation_audit_v1_audit_id_seq" "$MIGRATION"
          grep -q "32,517" docs/data/ODM-10C2-HONEST-40K.md
          grep -q "No robots.txt or sitemap is interpreted as a reuse licence" docs/data/ODM-10C2-HONEST-40K.md
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
