name: Repo Cleanup Restore Active Dependencies

on:
  push:
    branches:
      - chore/repo-cleanup-structural-2
    paths:
      - ".github/workflows/repo-cleanup-restore-cheerio.yml"

permissions:
  contents: write

jobs:
  restore-validate-remove-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/repo-cleanup-structural-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore only proven active direct dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'package.json': [
                  ('  "devDependencies": {\n    "@types/node"', '  "devDependencies": {\n    "@electric-sql/pglite": "^0.5.4",\n    "@types/node"'),
                  ('    "cheerio": "^1.2.0",\n    "postcss"', '    "cheerio": "^1.2.0",\n    "playwright": "^1.61.0",\n    "postcss"'),
              ],
              'package-lock.json': [
                  ('      "devDependencies": {\n        "@types/node"', '      "devDependencies": {\n        "@electric-sql/pglite": "^0.5.4",\n        "@types/node"'),
                  ('        "cheerio": "^1.2.0",\n        "postcss"', '        "cheerio": "^1.2.0",\n        "playwright": "^1.61.0",\n        "postcss"'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'{filename}: expected exactly one match for {old!r}, got {text.count(old)}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          git diff --check
          git diff -- package.json package-lock.json
      - name: Validate lockfile and dependency installation
        run: npm ci
      - name: Validate direct imports
        run: node -e "Promise.all([import('@electric-sql/pglite'), import('playwright')]).then(() => console.log('PGlite + Playwright imports OK'))"
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Scraper regression suite
        run: npm run test:scrapers
      - name: Commit restoration and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/repo-cleanup-restore-cheerio.yml
          git diff --cached --check
          git commit -m "fix(cleanup): keep active PGlite and Playwright dependencies"
          git pull --rebase origin chore/repo-cleanup-structural-2
          git push origin HEAD:chore/repo-cleanup-structural-2
