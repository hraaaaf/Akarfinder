name: Activate ODM Canary 25 Percent Production V1

on:
  pull_request:
    paths:
      - ".github/workflows/activate-odm-canary-25-production-v1.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/activate-odm-canary-25-production-v1.yml"

concurrency:
  group: activate-odm-canary-25-production-v1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate controller and 25 percent campaign contracts
        run: |
          npx tsx --test scripts/scrapers/__tests__/odm-canary-1percent-01.test.ts
          npx tsx --test scripts/scrapers/__tests__/odm-public-canary-five-percent-cap-v1.test.ts
          npx tsx --test scripts/scrapers/__tests__/odm-canary-10-production-certification-v1.test.ts
          npx tsx --test scripts/scrapers/__tests__/odm-canary-25-production-certification-v1.test.ts
      - name: Validate balanced deterministic plan without Production traffic
        env:
          AKARFINDER_CERTIFICATION_DRY_RUN: "true"
        run: node scripts/certify-odm-canary-25-production-v1.mjs
      - run: npx tsc --noEmit
      - run: npm run build

  activate-and-certify:
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VERCEL_ORG_ID: team_NNhXPDOIfjGNBcn253btpyk0
      VERCEL_PROJECT_ID: prj_RCs2Ku5vex9cpABWnwaCjbuKrhhc
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      AKARFINDER_PRODUCTION_URL: https://akarfinder.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify Vercel credentials
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Repository secret VERCEL_TOKEN is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Confirm the certified 10 percent starting state
        run: |
          node <<'NODE'
          const probes = [
            [
              "bucket_0617",
              "https://akarfinder.vercel.app/api/search?city=Casablanca&property_type=apartment&transaction_type=sale&min_price=10000&max_price=50000000&min_surface=1&max_surface=500&limit=50&offset=0",
              "database_fallback",
            ],
            [
              "bucket_1309",
              "https://akarfinder.vercel.app/api/search?city=Casablanca&property_type=apartment&transaction_type=sale&min_price=10000&max_price=50000000&min_surface=1&max_surface=500&limit=75&offset=0",
              "database",
            ],
          ];
          for (const [name, url, expected] of probes) {
            const response = await fetch(url, { headers: { "user-agent": "AkarFinder-ODM-25-Activation-Preflight/1.0" } });
            if (response.status !== 200) throw new Error(`${name}: HTTP ${response.status}`);
            const body = await response.json();
            const actual = body.source === "database_fallback" ? "database_fallback" : "database";
            console.log(`${name}: ${actual}`);
            if (actual !== expected) throw new Error(`${name}: expected ${expected}, received ${actual}`);
          }
          NODE

      - name: Set Production Canary percentage to 25
        shell: bash
        run: |
          printf '25\n' | npx vercel@latest env update ODM_PUBLIC_CANARY_PERCENT production --yes --token="$VERCEL_TOKEN"

      - name: Pull updated Production environment
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build current main with the 25 percent environment
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy current main to Production
        shell: bash
        run: |
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tee vercel-deploy-output.txt

      - name: Allow Production aliases and environment propagation to settle
        run: sleep 90

      - name: Confirm the 25 percent lane is active
        run: |
          node <<'NODE'
          const probes = [
            [
              "bucket_0617",
              "https://akarfinder.vercel.app/api/search?city=Casablanca&property_type=apartment&transaction_type=sale&min_price=10000&max_price=50000000&min_surface=1&max_surface=500&limit=50&offset=0",
            ],
            [
              "bucket_1309",
              "https://akarfinder.vercel.app/api/search?city=Casablanca&property_type=apartment&transaction_type=sale&min_price=10000&max_price=50000000&min_surface=1&max_surface=500&limit=75&offset=0",
            ],
          ];
          for (const [name, url] of probes) {
            const response = await fetch(url, { headers: { "user-agent": "AkarFinder-ODM-25-Activation-Probe/1.0" } });
            if (response.status !== 200) throw new Error(`${name}: HTTP ${response.status}`);
            const body = await response.json();
            console.log(`${name}: ${body.source}`);
            if (body.source !== "database_fallback") throw new Error(`${name}: 25 percent lane is not active`);
          }
          NODE

      - name: Run controlled 240-request 25 percent certification
        run: node scripts/certify-odm-canary-25-production-v1.mjs

      - name: Upload certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odm-canary-25-production-certification-v1
          path: artifacts/odm-canary-25-production-certification-v1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Persist latest evidence on audit branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const reportPath = "artifacts/odm-canary-25-production-certification-v1.json";
            const targetPath = "reports/odm-canary-25-production-latest.json";
            const auditBranch = "certification-results";
            let report;

            if (fs.existsSync(reportPath)) {
              report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            } else {
              report = {
                certification: "ODM_CANARY_25_PRODUCTION_CERTIFICATION_V1",
                generated_at: new Date().toISOString(),
                gates: {},
                evidence_error: "activation_or_campaign_report_missing",
              };
            }

            report.evidence = {
              workflow_run_id: context.runId,
              workflow_run_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              source_commit: context.sha,
              source_ref: context.ref,
              persisted_at: new Date().toISOString(),
            };

            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: targetPath,
                ref: auditBranch,
              });
              if (!Array.isArray(existing.data)) existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: targetPath,
              branch: auditBranch,
              message: `audit(search): persist ODM 25 percent activation evidence from run ${context.runId}`,
              content: Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString("base64"),
              ...(existingSha ? { sha: existingSha } : {}),
            });

      - name: Emergency rollback — enable stop and restore 10 percent
        if: ${{ failure() && env.VERCEL_TOKEN != '' }}
        shell: bash
        run: |
          set +e
          echo "::warning::A 25 percent activation gate failed. Starting automatic rollback."
          printf 'true\n' | npx vercel@latest env update ODM_PUBLIC_CANARY_STOP production --yes --token="$VERCEL_TOKEN"
          printf '10\n' | npx vercel@latest env update ODM_PUBLIC_CANARY_PERCENT production --yes --token="$VERCEL_TOKEN"
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          sleep 60
          printf 'false\n' | npx vercel@latest env update ODM_PUBLIC_CANARY_STOP production --yes --token="$VERCEL_TOKEN"
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          sleep 60

          node <<'NODE'
          const url = "https://akarfinder.vercel.app/api/search?city=Casablanca&property_type=apartment&transaction_type=sale&min_price=10000&max_price=50000000&min_surface=1&max_surface=500&limit=75&offset=0";
          const response = await fetch(url, { headers: { "user-agent": "AkarFinder-ODM-25-Rollback-Probe/1.0" } });
          const body = await response.json();
          console.log(`rollback bucket_1309 source: ${body.source}`);
          if (response.status !== 200 || body.source === "database_fallback") process.exit(1);
          NODE
