name: DATA-4.3H Controlled Expansion to 500

on:
  pull_request:
    paths:
      - "scripts/data4/daragadir-controlled-expansion.ts"
      - "scripts/data4/daragadir-expansion-persistent-batch.ts"
      - "scripts/data4/__tests__/daragadir-controlled-expansion.test.ts"
      - "scripts/data4/__tests__/daragadir-expansion-persistent-batch.test.ts"
      - "scripts/audits/data-4-3h-controlled-expansion-to-500.ts"
      - ".github/workflows/data-4-3h-controlled-expansion-to-500.yml"
      - "docs/data/DATA-4-3H-CONTROLLED-EXPANSION-TO-500.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: DATA-4.3H unit tests
        run: npx tsx --test scripts/data4/__tests__/daragadir-controlled-expansion.test.ts scripts/data4/__tests__/daragadir-expansion-persistent-batch.test.ts
      - name: DATA-4.3F regression tests
        run: npx tsx --test scripts/data4/__tests__/daragadir-controlled-promotion.test.ts
      - name: DATA-4.3G regression tests
        run: npx tsx --test scripts/data4/__tests__/daragadir-first-persistent-batch.test.ts
      - name: Existing seed freshness regression tests
        run: npm run test:seed-freshness
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  live-dry-run:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_4_3H_OUT_DIR: .tmp/data-4-3h/results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run controlled expansion dry-run
        run: npx tsx scripts/audits/data-4-3h-controlled-expansion-to-500.ts
      - name: Enforce expansion proof and manifests
        shell: bash
        run: |
          set -euo pipefail
          test -s "${DATA_4_3H_OUT_DIR}/proof.json"
          test -s "${DATA_4_3H_OUT_DIR}/apply-manifest.json"
          test -s "${DATA_4_3H_OUT_DIR}/rollback-manifest.json"
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('.tmp/data-4-3h/results/proof.json','utf8'));
          const apply=JSON.parse(fs.readFileSync('.tmp/data-4-3h/results/apply-manifest.json','utf8'));
          const rollback=JSON.parse(fs.readFileSync('.tmp/data-4-3h/results/rollback-manifest.json','utf8'));
          if (p.mode!=='DRY_RUN' || p.currentPersistentRows!==50) throw new Error(JSON.stringify(p));
          if (JSON.stringify(p.expansionPlan.plannedBatchSizes)!==JSON.stringify([100,100,100,100,50])) throw new Error(JSON.stringify(p));
          if (p.nextBatchSize!==100 || p.expansionPlan.canReachTarget!==true) throw new Error(JSON.stringify(p));
          if (p.ttlDays!==14 || p.registryReviewStatus!=='due_soon') throw new Error(JSON.stringify(p));
          if (p.databaseWrites!==0 || p.freshnessWrites!==0 || p.policyChanges!==0 || p.displayPolicyChanges!==0) throw new Error(JSON.stringify(p));
          if (p.productionActivation!==false || p.detailPageFetches!==0 || p.contentReuseOperations!==0) throw new Error(JSON.stringify(p));
          if (p.sourceRequests<2 || p.sourceRequests>40) throw new Error(JSON.stringify(p));
          if (p.seedStateReads!==100 || p.rollbackRows!==100 || apply.length!==100 || rollback.length!==100) throw new Error(JSON.stringify(p));
          if (p.beforePublicSearchRows!==100 || p.beforeTechnicalDisplayRows!==100) throw new Error(JSON.stringify(p));
          for (const row of apply) {
            if (row.before.freshnessStatus!=='seed_only') throw new Error('non-seed row selected');
            if (row.before.freshChannels.includes('public_sitemap_presence')) throw new Error('channel already present');
            if (row.proposed.freshnessStatus!=='fresh_confirmed') throw new Error('wrong proposed state');
            if (!row.proposed.freshChannels.includes('public_sitemap_presence')) throw new Error('missing channel');
            const marker=row.proposed.metadata?.freshness_evidence?.controlled_expansion_batch;
            if (marker?.run_id!=='data-4-3h-daragadir-batch-1-v1' || marker?.batch_number!==1) throw new Error('missing expansion marker');
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: data-4-3h-controlled-expansion-to-500
          path: .tmp/data-4-3h/results/
          if-no-files-found: error
          retention-days: 14
