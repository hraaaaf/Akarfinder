name: Neighborhood Visual P1.8 Ocean Source Discovery

on:
  pull_request:
    paths:
      - ".github/workflows/neighborhood-visual-p1-8-ocean-source-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Lock Commons anchors and sweep KartaView
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/audits/neighborhood-visual-p1-8-ocean/source-discovery"
          mkdir -p "$OUT/commons" "$OUT/kartaview"
          UA='AkarFinder-P1.8-Ocean/1.0'
          curl --fail --location --retry 6 --retry-all-errors --user-agent "$UA" 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Phare%20de%20Rabat%2001.jpg' -o "$OUT/commons/phare.jpg"
          curl --fail --location --retry 6 --retry-all-errors --user-agent "$UA" 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Coucher%20de%20soleil%20%C3%A0%20quartier%20l%27Oc%C3%A9an.JPG' -o "$OUT/commons/sunset.jpg"
          sha1sum "$OUT/commons"/* > "$OUT/commons/sha1.txt"
          wc -c "$OUT/commons"/* > "$OUT/commons/bytes.txt"
          python3 - <<'PY'
          import hashlib,json,math,pathlib,urllib.parse,urllib.request
          out=pathlib.Path('data/audits/neighborhood-visual-p1-8-ocean/source-discovery/kartaview')
          ua={'User-Agent':'AkarFinder-P1.8-Ocean/1.0','Accept':'application/json'}
          centers=[('phare',34.03147,-6.84440),('east',34.0315,-6.8405),('south',34.0288,-6.8440),('inland',34.0288,-6.8385)]
          def get(url):
            return json.load(urllib.request.urlopen(urllib.request.Request(url,headers=ua),timeout=40))
          def hav(a,b,c,d):
            R=6371000.;p1,p2=math.radians(a),math.radians(c);dp=math.radians(c-a);dl=math.radians(d-b);x=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2;return 2*R*math.asin(math.sqrt(x))
          rows={}
          for label,lat,lng in centers:
            q=urllib.parse.urlencode({'lat':lat,'lng':lng,'zoomLevel':17,'join':'sequence','orderBy':'id','orderDirection':'desc'})
            for d in get('https://api.openstreetcam.org/2.0/photo/?'+q).get('result',{}).get('data',[]):
              try: plat=float(d['lat']);plng=float(d['lng'])
              except: continue
              urls=[d[k] for k in ('fileurlLTh','fileurlProc','fileurlTh') if isinstance(d.get(k),str) and d[k].startswith('http')]
              if not urls: continue
              pid=str(d.get('id'));dist=round(hav(lat,lng,plat,plng),1)
              row=rows.get(pid,{'id':d.get('id'),'lat':plat,'lng':plng,'heading':d.get('heading'),'sequence_id':(d.get('sequence') or {}).get('id'),'urls':urls,'hits':[]})
              row['hits'].append({'label':label,'distance_m':dist});rows[pid]=row
          vals=list(rows.values())
          for r in vals:r['best_distance_m']=min(h['distance_m'] for h in r['hits'])
          vals.sort(key=lambda r:r['best_distance_m'])
          n=0
          for r in vals:
            if n>=20 or r['best_distance_m']>700: continue
            try:
              b=urllib.request.urlopen(urllib.request.Request(r['urls'][0],headers=ua),timeout=40).read()
              if len(b)<5000: continue
              p=out/f"{n+1:02d}_{round(r['best_distance_m']):04d}m_{r['id']}.jpg";p.write_bytes(b)
              r['downloaded_file']=p.name;r['sha1']=hashlib.sha1(b).hexdigest();r['bytes']=len(b);n+=1
            except Exception as e:r['error']=str(e)
          (out/'candidates.json').write_text(json.dumps(vals,ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'OCEAN_P1_8 kartaview={len(vals)} downloaded={n}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: neighborhood-visual-p1-8-ocean-source-discovery
          path: data/audits/neighborhood-visual-p1-8-ocean/source-discovery
          if-no-files-found: error
          retention-days: 7
