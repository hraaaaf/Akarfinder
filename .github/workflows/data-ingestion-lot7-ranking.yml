name: Data Ingestion Lot 7 Ranking Gate

on:
  pull_request:
    paths:
      - "data-ingestion/**"
      - "lib/listings/**"
      - "lib/search/**"
      - "scripts/scrapers/__tests__/data-ingestion-lot7-ranking.test.ts"
      - ".github/workflows/data-ingestion-lot7-ranking.yml"

jobs:
  ranking-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate real AkarFinder ranking path
        run: node --import tsx --test scripts/scrapers/__tests__/data-ingestion-lot7-ranking.test.ts
