name: P0.4 Docs Closeout Temp

on:
  push:
    branches:
      - docs/p0-4-closeout
    paths:
      - .github/workflows/p0-4-closeout-docs-temp.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p0-4-closeout
          fetch-depth: 0
      - name: Apply docs closeout
        run: python scripts/tmp-p0-4-closeout-docs.py
      - name: Commit canonical docs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close P0.4 shadow review"
          git push origin HEAD:docs/p0-4-closeout
