name: DATA MASS Canonical Docs Render

on:
  pull_request:
    paths:
      - ".github/workflows/data-mass-canonical-docs-render.yml"
      - "scripts/docs/render-data-mass-canonical.mjs"
      - "docs/SESSION.md"
      - "docs/data/DATA-MASS-3C-CANARY-READINESS-SHADOW.md"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/data-mass-3c-canary-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render canonical MASS docs
        run: node scripts/docs/render-data-mass-canonical.mjs
      - name: Verify rendered scope
        run: |
          test -n "$(git diff -- README.md docs/ROADMAP.md)"
          test -z "$(git diff --name-only | grep -Ev '^(README.md|docs/ROADMAP.md)$')"
      - name: Commit canonical docs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md
          git commit -m "docs: canonical closeout MASS-3B and handoff MASS-3C"
          git push origin HEAD:agent/data-mass-3c-canary-readiness
