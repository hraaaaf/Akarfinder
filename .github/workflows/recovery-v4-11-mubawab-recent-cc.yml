name: Recovery V4.11 Mubawab Recent Common Crawl Evidence

on:
  push:
    branches: ["recovery/v4-11-pre-db-verification-20260927"]
    paths:
      - "data/recovery/activate-v4-11-mubawab-recent-cc.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recent-cc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RECENT_CC_DOMAINS: mubawab.ma
      RECENT_CC_INDEXES: CC-MAIN-2026-39,CC-MAIN-2026-34,CC-MAIN-2026-30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Recent Common Crawl metadata probe
        run: npx tsx scripts/recovery/commoncrawl-recent-evidence.ts
      - name: Safety contract
        run: |
          set -euo pipefail
          test -f data/audits/raw-results/recent-cc-recovery/manifest.json
          node - <<'NODE'
          const m=require("./data/audits/raw-results/recent-cc-recovery/manifest.json");
          if(m.database_access!==0||m.database_writes!==0||m.source_page_fetches!==0||m.warc_downloads!==0||m.approved_for_import_rows!==0) throw new Error("safety invariant");
          if(m.domains.length!==1||m.domains[0]!=="mubawab.ma") throw new Error("domain");
          console.log(JSON.stringify(m,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-mubawab-recent-commoncrawl-evidence
          path: data/audits/raw-results/recent-cc-recovery/
          retention-days: 30
