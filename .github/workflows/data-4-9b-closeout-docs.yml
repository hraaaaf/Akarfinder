name: DATA-4.9B Closeout Canonical Docs

on:
  push:
    branches:
      - data/data-4-9b-high-capacity-structural-detail-qualification
    paths:
      - ".github/workflows/data-4-9b-closeout-docs.yml"

permissions:
  contents: write

jobs:
  closeout-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/data-4-9b-high-capacity-structural-detail-qualification
          fetch-depth: 0
      - name: Patch DATA handover blocks only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_block(path, start, end, block):
              p = Path(path)
              text = p.read_text()
              a = text.index(start)
              b = text.index(end, a) + len(end)
              p.write_text(text[:a] + block.strip() + text[b:])

          readme = r'''
          <!-- DATA-4.7B-CURRENT-START -->
          ## État DATA courant — 2026-08-10

          La lane DATA distingue strictement **capacité sitemap brute**, **représentations URL de pages détail**, **biens uniques dédupliqués**, **fraîcheur** et **inventaire Search**.

          - **DATA-4.9A ✅ PR #444** — merge `18be46c7349e8a56b2b68b56005d79f85e125675` : onboarding read-only de 11 sources zéro-stock ; jusqu'à **11 480 identités sitemap net-new brutes** observées selon snapshot, sans les appeler annonces.
          - **DATA-4.9B 🟠 PR #452** — High-Capacity Structural Detail Qualification, strictement read-only. Snapshot durci certifié au head `ae4b212e28f6ca0929548299860b04936daea218`, run `31369710665` PASS, artefact `sha256:dce77812b6666b09f29d7e716500cd5abed39e6902fcbcc71a515eeb4680f33d`, observé `2026-08-10T08:24:02.397Z`.
          - **10 128 identités URL net-new** qualifiées sur 6 sources → **2 326 représentations URL structurellement compatibles avec une page détail** + **7 802 rejets explicites** ; 0 collision d'identité sur ce snapshot.
          - Détail candidats URL : Val Foncier **709**, Christie's Morocco **602**, Immo Maroc **276**, AgadirImmobilier.ma **37**, ProImmobilier **99**, Capital Properties **603** (optionnel/non bloquant).
          - **2 326 ≠ 2 326 biens uniques.** Le proof l'impose désormais : `structuralDetailCandidateRowsAreUrlRepresentationsNotUniqueProperties=true` et `deduplicatedUniquePropertyCountProducedByThisLot=false`.
          - Val Foncier illustre le filtre : les pages `/bien-immobilier/<slug>` qualifient, tandis que des milliers de sous-URLs d'attachments/images sont rejetées.
          - 0 detail-page fetch ; 0 DB/Registry/policy write ; 0 ingestion ; 0 activation Search/public display.
          - Registry live : les six sources restent `unverified + hidden + internal_signal_only` avec 0 représentation active ; sitemap/structure n'est jamais une permission.

          **Prochain LOT : DATA-4.9C — Source Policy Decision & Registry Assignment.** Revue actuelle des preuves officielles/CGU/robots et décision par source. Aucune ingestion dans ce lot ; une mutation du Source Registry n'est permise que si les preuves justifient explicitement la policy choisie, sinon la source reste fail-closed.

          **DATA-4.9D** ne pourra être qu'un canary d'ingestion borné/rollback-ready pour les sources réellement autorisées par 4.9C.
          <!-- DATA-4.7B-CURRENT-END -->
          '''

          roadmap = r'''
          <!-- DATA-4.7B-CURRENT-START -->
          # 0. État DATA prioritaire — quantité réelle 2026-08-10

          > Ce bloc prévaut sur les anciennes mentions DATA plus bas lorsqu'elles désignent un prochain LOT désormais dépassé.

          **North Star : augmenter l'inventaire utile réellement admissible sans transformer sitemap, URL détail, fraîcheur, taxonomy ou signal interne en faux nombre de biens.**

          - **DATA-4.9A ✅ #444** — merge `18be46c7349e8a56b2b68b56005d79f85e125675` ; jusqu'à **11 480** identités sitemap net-new brutes observées sur 10 sources live ; 0 mutation.
          - **DATA-4.9B 🟠 #452** — snapshot durci au head `ae4b212e28f6ca0929548299860b04936daea218`, specialized run `31369710665` PASS, artefact `sha256:dce77812b6666b09f29d7e716500cd5abed39e6902fcbcc71a515eeb4680f33d`.
          - Résultat structurel certifié : **10 128 URL identities net-new → 2 326 candidate URL representations + 7 802 rejets**, 0 collision ; **aucun compteur de biens uniques produit par ce LOT**.

          ## DATA-4.9B — rendement structurel par source

          1. `valfoncier.ma` — **6 195** net-new → **709** candidate URL reps / 5 486 rejets.
          2. `christiesrealestatemorocco.com` — **1 252** → **602** / 650.
          3. `immo-maroc.com` — **1 204** → **276** / 928.
          4. `capital-properties.ma` — **844** → **603** / 241 ; source optionnelle/non bloquante, variantes localisées possibles.
          5. `proimmobilier.ma` — **267** → **99** / 168.
          6. `agadirimmobilier.ma` — **366** → **37** / 329.

          Truth boundary machine-enforced :
          - candidate rows = **URL representations**, pas biens uniques ;
          - structure pattern ≠ autorisation ;
          - robots/sitemap ≠ permission ;
          - Registry live reste l'autorité ;
          - 0 detail fetch / 0 write / 0 policy change / 0 ingestion / 0 display activation.

          ## Prochain LOT DATA — DATA-4.9C Source Policy Decision & Registry Assignment

          Responsabilité unique : déterminer puis, si et seulement si les preuves l'autorisent, matérialiser la policy Source Registry des gagnants structurels. **Aucune ingestion d'annonce dans 4.9C.**

          Priorité : `valfoncier.ma`, `christiesrealestatemorocco.com`, `immo-maroc.com`, `proimmobilier.ma`, `agadirimmobilier.ma`; `capital-properties.ma` reste opportuniste/non bloquant.

          1. relire preuves officielles actuelles : CGU/terms, robots, pages source pertinentes et Registry live ;
          2. séparer capability technique de permission ;
          3. décider par source `authorized / permission_required / prohibited / remain_unverified` et le mode admissible ;
          4. si décision positive, mutation Registry uniquement, avec before/after manifest et rollback ;
          5. si preuve insuffisante, aucune promotion implicite : `hidden/internal_signal_only` demeure ;
          6. 0 seed write, 0 ingestion, 0 Search activation.

          **DATA-4.9D** : canary d'ingestion borné, seulement pour les sources dont 4.9C a réellement autorisé un canal exploitable.
          <!-- DATA-4.7B-CURRENT-END -->
          '''

          session = r'''
          <!-- DATA-CURRENT-START -->
          ## DATA — vérité courante

          - DATA-4.9A ✅ PR #444 — merge `18be46c7349e8a56b2b68b56005d79f85e125675`.
          - DATA-4.9B 🟠 PR #452 — High-Capacity Structural Detail Qualification, read-only.
          - Snapshot durci certifié : head `ae4b212e28f6ca0929548299860b04936daea218`, run `31369710665` PASS, observé `2026-08-10T08:24:02.397Z`.
          - Artefact : `sha256:dce77812b6666b09f29d7e716500cd5abed39e6902fcbcc71a515eeb4680f33d`.
          - **10 128** net-new URL identities → **2 326 structural detail candidate URL representations** + **7 802 rejects**, 0 collision.
          - Par source : Val Foncier **709**, Christie's **602**, Immo Maroc **276**, AgadirImmobilier.ma **37**, ProImmobilier **99**, Capital Properties **603**.
          - **2 326 n'est pas un nombre de biens uniques** ; le proof machine l'interdit explicitement.
          - 0 detail-page fetch ; 0 DB/Registry/policy mutation ; 0 ingestion/display activation.
          - Les six sources restent live Registry `unverified + hidden + internal_signal_only`, `current_representation_count=0`.

          **Prochain LOT : DATA-4.9C — Source Policy Decision & Registry Assignment.** Revue de preuves officielles actuelles et décision par source ; mutation du Registry uniquement si démontrée, jamais d'ingestion dans ce lot.

          Ensuite **DATA-4.9D** pourra concevoir un canary d'ingestion borné uniquement pour les sources effectivement autorisées.
          <!-- DATA-CURRENT-END -->
          '''

          replace_block('README.md', '<!-- DATA-4.7B-CURRENT-START -->', '<!-- DATA-4.7B-CURRENT-END -->', readme)
          replace_block('docs/ROADMAP.md', '<!-- DATA-4.7B-CURRENT-START -->', '<!-- DATA-4.7B-CURRENT-END -->', roadmap)
          replace_block('docs/SESSION.md', '<!-- DATA-CURRENT-START -->', '<!-- DATA-CURRENT-END -->', session)
          PY
      - name: Commit canonical DATA closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md docs/SESSION.md
          git commit -m "DATA-4.9B: record structural-detail qualification in canonical docs"
          git push origin HEAD:data/data-4-9b-high-capacity-structural-detail-qualification
