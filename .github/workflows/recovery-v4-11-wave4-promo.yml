name: Recovery V4.11 Wave4 Promo Certification

on:
  push:
    branches: ["recovery/v4-11-wave4-promo-20260927"]
    paths:
      - "data/recovery/activate-v4-11-wave4-promo.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download certified PromoImmo evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/promo" data/audits/v4-11-wave4
          for spec in             "10927254534:p0.zip"             "10929845570:p1.zip"             "10929394293:p2.zip"             "10929664106:p3.zip"             "10929652367:p4.zip"
          do
            ID="${spec%%:*}"; FILE="${spec##*:}"
            gh api "repos/${{ github.repository }}/actions/artifacts/${ID}/zip" > "$RUNNER_TEMP/promo/$FILE"
            unzip -q -o "$RUNNER_TEMP/promo/$FILE" -d "$RUNNER_TEMP/promo"
          done

      - name: Certify strict PromoImmo wave4
        run: |
          INPUTS="$(find "$RUNNER_TEMP/promo" -type f -name 'deep-batch-promoimmomarrakech-com-*.json' ! -name '*summary.json' | sort | paste -sd, -)"
          node scripts/recovery/certify-v4-11-wave4-promo.mjs             --inputs "$INPUTS"             --output data/audits/v4-11-wave4/db-ready-wave4.jsonl             --quarantine data/audits/v4-11-wave4/quarantine.jsonl             --summary data/audits/v4-11-wave4/summary.json

      - name: Verify invariants
        run: |
          node - <<'NODE'
          const fs=require("fs"),crypto=require("crypto");
          const s=JSON.parse(fs.readFileSync("data/audits/v4-11-wave4/summary.json","utf8"));
          const body=fs.readFileSync("data/audits/v4-11-wave4/db-ready-wave4.jsonl");
          const rows=body.toString("utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const eq=(a,b,n)=>{if(a!==b)throw new Error(n+": "+a+" != "+b)};
          eq(s.input_rows,3705,"input");
          eq(s.http200_rows,3705,"http200");
          eq(s.db_ready_rows,3674,"ready");
          eq(s.quarantine_rows,31,"quarantine");
          eq(rows.length,3674,"physical");
          eq(new Set(rows.map(r=>r.listing_url)).size,3674,"url unique");
          eq(new Set(rows.map(r=>r.canonical_fingerprint)).size,3674,"fp unique");
          eq(crypto.createHash("sha256").update(body).digest("hex"),s.output_sha256,"sha");
          if(rows.some(r=>r.approved_for_import!==false))throw new Error("approval invariant");
          console.log(JSON.stringify(s,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-db-ready-wave4-promo
          path: |
            data/audits/v4-11-wave4/db-ready-wave4.jsonl
            data/audits/v4-11-wave4/quarantine.jsonl
            data/audits/v4-11-wave4/summary.json
          retention-days: 30
