name: Mubawab district diagnostic

on:
  push:
    branches: [feat/mubawab-full-enumeration]
    paths:
      - 'scripts/acquisition/mubawab-district-diagnostic.mjs'
      - '.github/workflows/mubawab-district-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore certified Mubawab shard evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/shards/a artifacts/shards/b artifacts/shards/c
          gh run download 33958132411 -n mubawab-full-enumeration -D artifacts/shards/a
          gh run download 33961150352 -n mubawab-full-enumeration -D artifacts/shards/b
          gh run download 33964834762 -n mubawab-full-enumeration -D artifacts/shards/c
      - name: Diagnose district misses
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MUBAWAB_REPORT_FILES: artifacts/shards/a/report.json,artifacts/shards/b/report.json,artifacts/shards/c/report.json
          MUBAWAB_REQUEST_DELAY_MS: '2750'
        run: node scripts/acquisition/mubawab-district-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mubawab-district-diagnostic
          path: artifacts/mubawab-district-diagnostic
          retention-days: 14
