name: Recovery V4.11 Wave12 Major Portals Certification

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/v4-11-wave12-major-portals-artifacts.json"

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate manifest
        run: |
          set -euo pipefail
          node - <<'NODE'
          const m=require("./data/recovery/v4-11-wave12-major-portals-artifacts.json");
          for(const k of ["mubawab","agenz"]){
            const x=m[k];
            if(!x||!Number.isInteger(x.artifact_id)||x.artifact_id<=0)throw new Error(k+" artifact_id");
            if(!/^sha256:[0-9a-f]{64}$/.test(x.artifact_digest||""))throw new Error(k+" digest");
            if(!/^[0-9a-f]{64}$/.test(x.txt_sha256||""))throw new Error(k+" sha");
          }
          if(m.database_writes_authorized!==false||m.vercel_deployment_authorized!==false)throw new Error("scope");
          NODE

      - name: Download immutable reservoir artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w12/mubawab" "$RUNNER_TEMP/w12/agenz" data/audits/v4-11-wave12-major-portals
          gh api "repos/${{ github.repository }}/actions/artifacts/10946401197/zip" > "$RUNNER_TEMP/w12/mubawab.zip"
          gh api "repos/${{ github.repository }}/actions/artifacts/10945814080/zip" > "$RUNNER_TEMP/w12/agenz.zip"
          unzip -q "$RUNNER_TEMP/w12/mubawab.zip" -d "$RUNNER_TEMP/w12/mubawab"
          unzip -q "$RUNNER_TEMP/w12/agenz.zip" -d "$RUNNER_TEMP/w12/agenz"
          echo "89ab4c71b65d6ce99c112576d7220973ea84ba53a3f3a443dd79b54d8e02db33  $RUNNER_TEMP/w12/mubawab/recovery-big-portal-mubawab-ma.txt" | sha256sum -c -
          echo "02b0840dfe8900a28ae25c205b8f5fcb59c529e7deac7eb9a41857648c9b05b4  $RUNNER_TEMP/w12/agenz/recovery-big-portal-agenz-ma.txt" | sha256sum -c -

      - name: Certify strict route evidence
        run: |
          node scripts/recovery/certify-v4-11-wave12-major-portals.mjs             --mubawab "$RUNNER_TEMP/w12/mubawab/recovery-big-portal-mubawab-ma.txt"             --agenz "$RUNNER_TEMP/w12/agenz/recovery-big-portal-agenz-ma.txt"             --out-dir data/audits/v4-11-wave12-major-portals

      - name: Verify offline contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require("fs"),crypto=require("crypto");
          const s=require("./data/audits/v4-11-wave12-major-portals/summary.json");
          const b=fs.readFileSync("./data/audits/v4-11-wave12-major-portals/db-ready-wave12-major-portals.jsonl");
          const rows=b.toString().split(/\r?\n/).filter(Boolean).map(JSON.parse);
          if(rows.length!==s.db_ready_rows)throw new Error("count");
          if(new Set(rows.map(r=>r.listing_url)).size!==rows.length)throw new Error("url dup");
          if(new Set(rows.map(r=>r.canonical_fingerprint)).size!==rows.length)throw new Error("fp dup");
          if(new Set(rows.map(r=>r.source_name+"|"+r.source_offer_key)).size!==rows.length)throw new Error("id dup");
          if(rows.some(r=>![r.title,r.city,r.property_type,r.transaction_type].every(v=>v&&String(v).trim())))throw new Error("core");
          if(rows.some(r=>r.approved_for_import!==false))throw new Error("approval");
          if(crypto.createHash("sha256").update(b).digest("hex")!==s.output_sha256)throw new Error("sha");
          if(s.database_access||s.database_writes||s.production_neon_writes||s.approved_for_import_rows||s.vercel_deployment!==false)throw new Error("safety");
          console.log(JSON.stringify(s,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-wave12-major-portals
          path: data/audits/v4-11-wave12-major-portals/
          retention-days: 30
