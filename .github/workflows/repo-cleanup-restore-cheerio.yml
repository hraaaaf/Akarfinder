name: Repo Cleanup Orphan Dependency Evidence

on:
  push:
    branches:
      - chore/repo-cleanup-structural-2
    paths:
      - ".github/workflows/repo-cleanup-restore-cheerio.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/repo-cleanup-structural-2
          fetch-depth: 0
      - name: Capture tracked references
        shell: bash
        run: |
          set -euo pipefail
          git grep -n -i -E '(@electric-sql/pglite|pglite|playwright)' -- . \
            ':!package.json' \
            ':!package-lock.json' \
            ':!.github/workflows/repo-cleanup-restore-cheerio.yml' > orphan-dependency-refs.txt || true
          cat orphan-dependency-refs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: repo-cleanup-orphan-dependency-refs
          path: orphan-dependency-refs.txt
          if-no-files-found: error
      - name: Fail if any tracked reference remains
        shell: bash
        run: |
          if [ -s orphan-dependency-refs.txt ]; then
            echo 'Tracked references found: inspect artifact before deleting dependencies.'
            exit 1
          fi
