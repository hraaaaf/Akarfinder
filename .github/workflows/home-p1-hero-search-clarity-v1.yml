name: Home P1 Hero Search Clarity V1

on:
  pull_request:
    paths:
      - "components/home/GoogleLikeHero.tsx"
      - "components/home/HomeSearchBar.tsx"
      - "components/home/SearchEntryOrchestrator.tsx"
      - "scripts/__tests__/home-p1-hero-search-clarity-v1.test.mjs"
      - ".github/workflows/home-p1-hero-search-clarity-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate HOME P1 contracts
        run: node --test scripts/__tests__/home-p1-hero-search-clarity-v1.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
