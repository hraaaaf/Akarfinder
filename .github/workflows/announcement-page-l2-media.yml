name: Announcement Page L2 Media Gallery

on:
  pull_request:
    paths:
      - "app/listings/**"
      - "app/visual-qa/announcement-page-media/**"
      - "components/listings/PropertyDetailV2.tsx"
      - "components/listings/PropertyMediaGallery.tsx"
      - "lib/listings/image-policy.ts"
      - "lib/listings/property-media.ts"
      - "lib/seller/owner-listing-detail.ts"
      - "lib/seller/owner-listing-media.ts"
      - "scripts/audits/announcement-page-l2-media-visual.mjs"
      - "scripts/scrapers/__tests__/announcement-page-l2-media.test.ts"
      - ".github/workflows/announcement-page-l2-media.yml"
  push:
    branches:
      - main
      - agent/announcement-page-l2-media-gallery
    paths:
      - "app/listings/**"
      - "app/visual-qa/announcement-page-media/**"
      - "components/listings/PropertyDetailV2.tsx"
      - "components/listings/PropertyMediaGallery.tsx"
      - "lib/listings/image-policy.ts"
      - "lib/listings/property-media.ts"
      - "lib/seller/owner-listing-detail.ts"
      - "lib/seller/owner-listing-media.ts"
      - "scripts/audits/announcement-page-l2-media-visual.mjs"
      - "scripts/scrapers/__tests__/announcement-page-l2-media.test.ts"
      - ".github/workflows/announcement-page-l2-media.yml"

permissions:
  contents: read

jobs:
  media-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ANN-L2 media contracts
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/announcement-page-l2-media.test.ts
          scripts/scrapers/__tests__/p10img-image-policy.test.ts
          scripts/scrapers/__tests__/listing-detail-boundary.test.ts
          scripts/scrapers/__tests__/announcement-page-l1-shell.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start ANN-L2 production server
        shell: bash
        run: |
          npm run start -- -p 3203 > /tmp/ann-l2.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3203/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ann-l2.log
          exit 1

      - name: ANN-L2 targeted visual certification
        env:
          BASE_URL: http://127.0.0.1:3203
          AUDIT_OUTPUT_DIR: artifacts/announcement-page-l2-media
        run: node scripts/audits/announcement-page-l2-media-visual.mjs

      - name: Upload ANN-L2 visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: announcement-page-l2-media-${{ github.run_id }}
          path: artifacts/announcement-page-l2-media
          if-no-files-found: error
          retention-days: 14
