name: Neighborhood Visual P1.2 Akkari Source Discovery

on:
  pull_request:
    paths:
      - ".github/workflows/neighborhood-visual-p1-2-akkari-source-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

# Temporary source-discovery gate. Removed once P1.2 sources are locked.
jobs:
  selected-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact selected real candidates
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/audits/neighborhood-visual-p1-2-akkari/selected-candidates"
          mkdir -p "$OUT"
          UA='AkarFinder-P1.2/1.0 source-audit contact=github.com/hraaaaf/Akarfinder'

          fetch() {
            local file="$1" out="$2"
            curl --fail --location --retry 6 --retry-delay 4 --retry-all-errors \
              --user-agent "$UA" \
              "https://commons.wikimedia.org/wiki/Special:Redirect/file/${file}" \
              -o "$OUT/$out"
            sleep 4
          }

          fetch 'Haj%20Hassan%20Al%20Akkari%20Mosque%20-%20Rabat.jpg' 'signature-haj-hassan-akkari.jpg'
          fetch 'Place%20Mohammed%20Zarqtouni%20Rabat.jpg' 'place-mohammed-zarqtouni.jpg'
          fetch 'Moulay%20Youssef%20Hospital%20Center%20Rabat.jpg' 'moulay-youssef-hospital.jpg'

          echo 'b81c1ec25a3de2b176911a8e6662ad8967d2c411  data/audits/neighborhood-visual-p1-2-akkari/selected-candidates/signature-haj-hassan-akkari.jpg' | sha1sum --check --strict
          echo 'dd6d922196aba82e802d5d70cf9c21df7c47f0c7  data/audits/neighborhood-visual-p1-2-akkari/selected-candidates/place-mohammed-zarqtouni.jpg' | sha1sum --check --strict
          echo '5a2af1a480d1d249387ac7ecefaa14fbb6129e9d  data/audits/neighborhood-visual-p1-2-akkari/selected-candidates/moulay-youssef-hospital.jpg' | sha1sum --check --strict

          test "$(wc -c < "$OUT/signature-haj-hassan-akkari.jpg")" -eq 2417308
          test "$(wc -c < "$OUT/place-mohammed-zarqtouni.jpg")" -eq 1985581
          test "$(wc -c < "$OUT/moulay-youssef-hospital.jpg")" -eq 2326171

          cat > "$OUT/source-proof.txt" <<'EOF'
          Signature candidate
          File: Haj Hassan Al Akkari Mosque - Rabat.jpg
          Author: RACHID BAYA
          License: CC BY-SA 4.0
          Coordinates: 34.01288605, -6.86349618
          Dimensions: 3000x4000
          Bytes: 2417308
          SHA-1: b81c1ec25a3de2b176911a8e6662ad8967d2c411

          Built-morphology candidate
          File: Place Mohammed Zarqtouni Rabat.jpg
          Author: RACHID BAYA
          License: CC BY-SA 4.0
          Coordinates: 34.00887484, -6.85369415
          Dimensions: 4000x3000
          Bytes: 1985581
          SHA-1: dd6d922196aba82e802d5d70cf9c21df7c47f0c7

          Alternative built/public-space candidate
          File: Moulay Youssef Hospital Center Rabat.jpg
          Author: RACHID BAYA
          License: CC BY-SA 4.0
          Coordinates: 34.01288605, -6.86349618
          Dimensions: 4000x3000
          Bytes: 2326171
          SHA-1: 5a2af1a480d1d249387ac7ecefaa14fbb6129e9d
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: neighborhood-visual-p1-2-akkari-selected-candidates
          path: data/audits/neighborhood-visual-p1-2-akkari/selected-candidates
          if-no-files-found: error
          retention-days: 7
