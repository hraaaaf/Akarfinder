name: SEARCH Price Extraction v5

on:
  pull_request:
    paths:
      - 'scripts/scrapers/price-extraction-v5-detail-audit.ts'
      - 'scripts/scrapers/price-extraction-v5-structured-cohort-audit.ts'
      - 'scripts/scrapers/price-extraction-v5-production-count.ts'
      - 'scripts/scrapers/__tests__/price-extraction-v5-detail-audit.test.ts'
      - 'scripts/scrapers/__tests__/price-extraction-v5-structured-cohort-audit.test.ts'
      - '.github/workflows/price-extraction-v5.yml'
      - 'docs/PRICE_EXTRACTION_V5_AUDIT.md'
  workflow_dispatch:
    inputs:
      execute_write:
        description: 'Run the bounded production write after read-only certification'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx --test scripts/scrapers/__tests__/price-extraction-v5-detail-audit.test.ts scripts/scrapers/__tests__/price-extraction-v5-structured-cohort-audit.test.ts
      - run: npx tsc --noEmit

  production-canary-read-only:
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      THIRD_PARTY_DB_INGESTION_ENABLED: 'true'
      PRICE_V5_WRITE: 'false'
      PRICE_V5_PER_SOURCE_LIMIT: '60'
      PRICE_V5_SOURCES: 'mubawab.ma,masaken.ma,mouldar.com,agenz.ma'
      PRICE_V5_COHORT_LIMIT: '120'
      PRICE_V5_MAX_WRITES: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify production read credentials
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Audit public detail price signals without writes
        run: npx tsx scripts/scrapers/price-extraction-v5-detail-audit.ts
      - name: Audit Mubawab and Masaken structured cohort without writes
        run: npx tsx scripts/scrapers/price-extraction-v5-structured-cohort-audit.ts
      - name: Observe exact production price coverage (non-blocking)
        continue-on-error: true
        run: npx tsx scripts/scrapers/price-extraction-v5-production-count.ts

  production-bounded-write:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_write == true }}
    needs: production-canary-read-only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      THIRD_PARTY_DB_INGESTION_ENABLED: 'true'
      PRICE_V5_WRITE: 'true'
      PRICE_V5_COHORT_LIMIT: '120'
      PRICE_V5_MAX_WRITES: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify production write credentials
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Re-fetch proven cohort and write only bounded null prices
        run: npx tsx scripts/scrapers/price-extraction-v5-structured-cohort-audit.ts
      - name: Observe exact production price coverage after write (non-blocking)
        continue-on-error: true
        run: npx tsx scripts/scrapers/price-extraction-v5-production-count.ts
