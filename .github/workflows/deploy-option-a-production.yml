name: Deploy Option A Visuals Production

on:
  push:
    paths:
      - ".github/workflows/deploy-option-a-production.yml"
  workflow_dispatch:

concurrency:
  group: deploy-option-a-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_NNhXPDOIfjGNBcn253btpyk0
      VERCEL_PROJECT_ID: prj_RCs2Ku5vex9cpABWnwaCjbuKrhhc
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify Vercel credentials
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Repository secret VERCEL_TOKEN is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Pull production environment
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production bundle
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production bundle
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
