name: Mubawab Python Pilot Offline
on:
  pull_request:
    paths:
      - 'scripts/acquisition/mubawab-python/**'
      - 'scripts/acquisition/mubawab-exhaustive-enumerator.mjs'
      - 'scripts/acquisition/mubawab-marocannonces-public-adapter.mjs'
      - 'scripts/acquisition/__tests__/mubawab-exhaustive-enumerator.test.mjs'
      - 'scripts/acquisition/__tests__/mubawab-marocannonces-public-adapter.test.mjs'
      - 'docs/handovers/2026-10-30-mubawab-python-pilot.md'
      - '.github/workflows/mubawab-python-pilot-offline.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/acquisition/mubawab-python/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r scripts/acquisition/mubawab-python/requirements.txt
      - name: Compile Python
        run: python -m compileall -q scripts/acquisition/mubawab-python
      - name: Run L8 enumerator offline safety tests (no HTTP)
        run: node --test scripts/acquisition/__tests__/mubawab-exhaustive-enumerator.test.mjs scripts/acquisition/__tests__/mubawab-marocannonces-public-adapter.test.mjs
      - name: Run offline safety tests (no network crawler)
        working-directory: scripts/acquisition/mubawab-python
        run: python -m unittest -v test_mubawab.py
