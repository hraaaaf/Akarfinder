name: Product Experience City Colors

on:
  pull_request:
    branches: [main]
    paths:
      - "components/map/TerritorialExplorer.tsx"
      - "lib/map/city-territorial-colors.ts"
      - "scripts/data/fetch-morocco-city-boundaries.mjs"
      - "scripts/scrapers/__tests__/city-color-overview-contract.test.ts"
      - "scripts/audits/product-experience-city-colors.mjs"
      - "docs/AKARFINDER_PRODUCT_EXPERIENCE_CITY_COLORS.md"
      - ".github/workflows/product-experience-city-colors.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    name: City colors national + city regression certification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_URL: http://127.0.0.1:3200
      AUDIT_OUTPUT_DIR: data/audits/product-experience-city-colors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare verified city commune boundaries
        run: node scripts/data/fetch-morocco-city-boundaries.mjs
      - name: Upload verified boundary evidence
        uses: actions/upload-artifact@v4
        with:
          name: city-boundary-prep-${{ github.run_id }}
          path: data/audits/city-boundary-prep
          if-no-files-found: error
          retention-days: 14
      - name: City color truth contract
        run: npx tsx --test scripts/scrapers/__tests__/city-color-overview-contract.test.ts
      - name: P4 territorial regression
        run: npx tsx --test scripts/scrapers/__tests__/p4-territorial-map-contract.test.ts
      - name: P2 navigation regression
        run: npx tsx --test scripts/scrapers/__tests__/search-history-navigation.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3200 > /tmp/city-colors.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3200/map?layer=explore' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/city-colors.log
          exit 1
      - name: Certify city colors responsive experience
        run: node scripts/audits/product-experience-city-colors.mjs
      - name: Upload city color evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-experience-city-colors-${{ github.run_id }}
          path: data/audits/product-experience-city-colors
          if-no-files-found: error
          retention-days: 14
