name: Search Result Count Consistency Patch

on:
  push:
    branches:
      - agent/search-result-count-consistency
    paths:
      - .github/workflows/search-result-count-consistency-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply deterministic patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, got {count}")
              p.write_text(text.replace(old, new))

          replace_exact(
              "app/search/page.tsx",
              '          initialListings={initialSearchResult.listings}\n          projectId={requestedProjectId}',
              '          initialListings={initialSearchResult.listings}\n          initialTotal={initialSearchResult.total}\n          projectId={requestedProjectId}',
          )

          replace_exact(
              "components/search/LightZillowSearchShell.tsx",
              'type LightZillowSearchShellProps = {\n  initialListings: Listing[];\n  initialFilters?: Partial<ListingFiltersState>;',
              'type LightZillowSearchShellProps = {\n  initialListings: Listing[];\n  initialTotal: number;\n  initialFilters?: Partial<ListingFiltersState>;',
          )

          replace_exact(
              "components/search/LightZillowSearchShell.tsx",
              'export function LightZillowSearchShell({ initialListings, initialFilters, projectId }: LightZillowSearchShellProps) {',
              'export function LightZillowSearchShell({ initialListings, initialTotal, initialFilters, projectId }: LightZillowSearchShellProps) {',
          )

          replace_exact(
              "components/search/LightZillowSearchShell.tsx",
              '  const [listings, setListings] = useState(initialListings);\n  const [isLoading, setIsLoading] = useState(true);',
              '  const [listings, setListings] = useState(initialListings);\n  const [searchTotalCount, setSearchTotalCount] = useState(initialTotal);\n  const [isLoading, setIsLoading] = useState(true);',
          )

          replace_exact(
              "components/search/LightZillowSearchShell.tsx",
              '        const payload = (await response.json()) as ApiSearchResponse;\n        if (!cancelled) setListings(payload.listings);',
              '        const payload = (await response.json()) as ApiSearchResponse;\n        if (!cancelled) {\n          setListings(payload.listings);\n          setSearchTotalCount(payload.total);\n        }',
          )

          replace_exact(
              "components/search/LightZillowSearchShell.tsx",
              '  const loadedResultCount = filteredListings.length + gatewayResults.length;\n  const totalResultCount = indexedTotalCount == null\n    ? loadedResultCount\n    : Math.max(indexedTotalCount, loadedResultCount);',
              '  const loadedResultCount = filteredListings.length + gatewayResults.length;\n  const totalResultCount = Math.max(\n    searchTotalCount,\n    indexedTotalCount ?? 0,\n    loadedResultCount,\n  );',
          )
          PY

      - name: Verify patch shape
        run: |
          grep -F 'initialTotal={initialSearchResult.total}' app/search/page.tsx
          grep -F 'const [searchTotalCount, setSearchTotalCount] = useState(initialTotal);' components/search/LightZillowSearchShell.tsx
          grep -F 'setSearchTotalCount(payload.total);' components/search/LightZillowSearchShell.tsx
          grep -F 'indexedTotalCount ?? 0' components/search/LightZillowSearchShell.tsx

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/search/page.tsx components/search/LightZillowSearchShell.tsx
          git diff --cached --check
          git commit -m 'fix(search): keep indexed total stable during hydration'
          git push
