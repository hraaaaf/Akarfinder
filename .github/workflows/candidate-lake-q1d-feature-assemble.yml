name: AkarFinder - Q1D Feature Assembly

on:
  push:
    branches: [data/q1d-normalized-features-fingerprints]
    paths:
      - 'scripts/audits/candidate-lake-q1d-feature-assemble.py'
      - 'scripts/audits/candidate-lake-q1d-smoke-test.py'
      - 'scripts/audits/candidate-lake-q1d-coverage-check.py'
      - '.github/workflows/candidate-lake-q1d-feature-assemble.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      Q1D_Q1C_ROOT: .tmp/q1d-input/q1c
      Q1D_DB_ROOT: .tmp/q1d-input/db
      Q1D_PUBLIC_ROOT: .tmp/q1d-input/public
      Q1D_OUT: .tmp/q1d-features
      Q1C_ARTIFACT_ID: '10020459850'
      Q1D_DB_ARTIFACT_ID: '10021396904'
      Q1D_PUBLIC_ARTIFACT_ID: '10021998663'
    steps:
      - uses: actions/checkout@v4
      - name: Download exact certified feature inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$Q1D_Q1C_ROOT" "$Q1D_DB_ROOT" "$Q1D_PUBLIC_ROOT" .tmp/downloads
          download_artifact() {
            local id="$1" dest="$2" label="$3"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o ".tmp/downloads/${label}.zip"
            unzip -q ".tmp/downloads/${label}.zip" -d "$dest"
          }
          download_artifact "$Q1C_ARTIFACT_ID" "$Q1D_Q1C_ROOT" q1c
          download_artifact "$Q1D_DB_ARTIFACT_ID" "$Q1D_DB_ROOT" db
          download_artifact "$Q1D_PUBLIC_ARTIFACT_ID" "$Q1D_PUBLIC_ROOT" public
      - name: Assemble normalized features and deterministic fingerprints
        run: python scripts/audits/candidate-lake-q1d-feature-assemble.py
      - name: Verify Q1D accounting and no-inference invariants
        run: |
          python scripts/audits/candidate-lake-q1d-smoke-test.py
          python scripts/audits/candidate-lake-q1d-coverage-check.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-lake-q1d-normalized-features-fingerprints
          path: .tmp/q1d-features/
          retention-days: 30
          if-no-files-found: error
