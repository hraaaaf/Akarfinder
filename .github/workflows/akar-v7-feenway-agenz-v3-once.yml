name: Akar V7 FeenWay Agenz source V3 one-shot

on:
  push:
    branches:
      - feat/akar-v7-feenway-offline-provenance-20261113
    paths:
      - '.github/workflows/akar-v7-feenway-agenz-v3-once.yml'

permissions:
  contents: read

concurrency:
  group: akar-v7-feenway-agenz-v3-once
  cancel-in-progress: false

jobs:
  original-agenz-v3:
    if: github.repository == 'hraaaaf/Akarfinder'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: scripts/acquisition
      AKAR_SOURCE_NETWORK_APPROVED: approved
    steps:
      - name: Checkout tested PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing V3 parser only
        run: python -m pip install 'psycopg[binary]==3.3.8' 'beautifulsoup4==4.14.3'
      - name: Offline V3 source-field regression and restricted one-off contracts
        run: |
          python -m unittest discover -v -s scripts/acquisition/__tests__ -p 'test_v7_feenway_upstream_10_audit.py'
          python -m unittest discover -v -s scripts/acquisition/__tests__ -p 'test_v7_feenway_agenz_v3_replay.py'
      - name: Check Agenz robots, then at most one original listing GET
        run: >-
          python scripts/acquisition/v7_multisource/feenway_agenz_v3_replay.py
          --candidates scripts/acquisition/v7_multisource/feenway_upstream_10_candidates.json
          --output pilot-agenz
          --approved-one
      - name: Upload only quarantined summary, not HTML/images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feenway-agenz-v3-quarantine
          path: pilot-agenz/agenz_replay_QUARANTINE.json
          if-no-files-found: ignore
          retention-days: 1
