name: SEARCH Price Extraction v2

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260814203000_price_extraction_v2_safe_text_backfill.sql'
      - 'scripts/scrapers/__tests__/price-extraction-v2.test.ts'
      - '.github/workflows/price-extraction-v2.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx --test scripts/scrapers/__tests__/price-extraction-v2.test.ts
      - run: npx tsc --noEmit
