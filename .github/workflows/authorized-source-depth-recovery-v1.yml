name: ODM Authorized Source Depth Recovery V1

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260802131500_authorized_source_depth_recovery_v1.sql'
      - 'scripts/ci/authorized-source-depth-recovery-v1-contract.mjs'
      - '.github/workflows/authorized-source-depth-recovery-v1.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci/authorized-source-depth-recovery-v1-contract.mjs
