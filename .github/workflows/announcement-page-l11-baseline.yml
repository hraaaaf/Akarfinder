name: Announcement Page L11 Baseline

on:
  push:
    branches:
      - agent/announcement-page-l11-pro-conversion
    paths:
      - "app/visual-qa/announcement-page-pro-conversion/**"
      - "scripts/audits/announcement-page-l11-baseline.mjs"
      - ".github/workflows/announcement-page-l11-baseline.yml"
      - "docs/ANNOUNCEMENT_PAGE_L11_VISUAL_GOAL.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start ANN-L11 baseline dev server
        shell: bash
        run: |
          npm run dev -- -p 3211 > /tmp/ann-l11-baseline.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3211/visual-qa/announcement-page-pro-conversion >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ann-l11-baseline.log
          exit 1
      - name: Capture ANN-L11 baseline
        env:
          BASE_URL: http://127.0.0.1:3211
          AUDIT_OUTPUT_DIR: artifacts/announcement-page-l11-baseline
        run: node scripts/audits/announcement-page-l11-baseline.mjs
      - name: Upload ANN-L11 baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: announcement-page-l11-baseline-${{ github.run_id }}
          path: artifacts/announcement-page-l11-baseline
          if-no-files-found: error
          retention-days: 14
