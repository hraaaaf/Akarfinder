name: Mubawab Historical Dataset V3 Reconcile

on:
  push:
    branches:
      - feat/mubawab-full-enumeration
    paths:
      - '.github/workflows/mubawab-historical-dataset-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and sanitize RealEstateBuddy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mubawab-dataset-v3
          python - <<'PY'
          import csv, io, json, urllib.request
          from pathlib import Path

          url = 'https://raw.githubusercontent.com/hakkache/RealEstateBuddy/main/data/Clean_Data_Step2.csv'
          raw = urllib.request.urlopen(url, timeout=60).read().decode('utf-8-sig')
          reader = csv.DictReader(io.StringIO(raw))
          allowed = ['Property_ID','url','Prix','Devise','Surface','Piece','Chambre','Salle_de_Bain','type_de_bien','neighborhood','city']
          out = []
          for row in reader:
              pid = (row.get('Property_ID') or '').strip()
              if not pid.isdigit():
                  continue
              clean = {k: (row.get(k) or '').strip() for k in allowed}
              out.append(clean)

          p = Path('artifacts/mubawab-dataset-v3')
          with (p/'realestatebuddy-sanitized.jsonl').open('w', encoding='utf-8') as f:
              for row in out:
                  f.write(json.dumps(row, ensure_ascii=False, separators=(',',':')) + '\n')
          report = {
              'dataset': 'hakkache/RealEstateBuddy',
              'source_path': 'data/Clean_Data_Step2.csv',
              'rows_sanitized': len(out),
              'unique_property_ids': len({r['Property_ID'] for r in out}),
              'allowed_fields': allowed,
              'excluded_pii': ['phone_number1','phone_number2','phone_number3','location','title','property_info'],
          }
          (p/'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Assert PII absent
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'phone_number|property_info|phone_count' artifacts/mubawab-dataset-v3/realestatebuddy-sanitized.jsonl

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: mubawab-historical-dataset-v3-realestatebuddy
          path: artifacts/mubawab-dataset-v3/
          if-no-files-found: error
          retention-days: 14
