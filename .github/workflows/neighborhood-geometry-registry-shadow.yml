name: Neighborhood Geometry Registry Shadow Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/geo/**"
      - "data/geo/**"
      - "app/api/geo/**"
      - "components/search/CasablancaNeighborhoodChoropleth.tsx"
      - "components/search/SearchMapNeighborhoodDock.tsx"
      - "scripts/scrapers/__tests__/neighborhood-geometry-registry.test.ts"
      - ".github/workflows/neighborhood-geometry-registry-shadow.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  geometry-registry-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Geometry registry contracts
        run: npx tsx --test scripts/scrapers/__tests__/neighborhood-geometry-registry.test.ts

      - name: TypeScript
        run: npx tsc --noEmit
