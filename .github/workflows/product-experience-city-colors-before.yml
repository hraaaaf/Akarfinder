name: Product Experience City Colors BEFORE

on:
  push:
    branches:
      - agent/product-experience-city-colors-before
  pull_request:
    branches: [main]
    paths:
      - "scripts/audits/product-experience-city-colors-before.mjs"
      - ".github/workflows/product-experience-city-colors-before.yml"
  workflow_dispatch:

concurrency:
  group: product-experience-city-colors-before
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  before:
    name: National map BEFORE capture
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_URL: http://127.0.0.1:3200
      AUDIT_OUTPUT_DIR: data/audits/city-colors-before
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3200 > /tmp/city-colors-before.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3200/map?layer=explore' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/city-colors-before.log
          exit 1
      - name: Capture national BEFORE
        run: node scripts/audits/product-experience-city-colors-before.mjs
      - name: Upload BEFORE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-experience-city-colors-before-${{ github.run_id }}
          path: data/audits/city-colors-before
          if-no-files-found: error
          retention-days: 14
