name: Akar V7 FeenWay Agenz primary listing conflict - one-shot

on:
  push:
    branches:
      - feat/akar-v7-feenway-offline-provenance-20261113
    paths:
      - '.github/workflows/akar-v7-feenway-agenz-primary-once.yml'

permissions:
  contents: read

concurrency:
  group: akar-v7-feenway-agenz-primary-once
  cancel-in-progress: false

jobs:
  primary-claim-conflict-check:
    if: github.repository == 'hraaaaf/Akarfinder'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: scripts/acquisition
      AKAR_SOURCE_NETWORK_APPROVED: approved
    steps:
      - name: Checkout PR branch without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing V3 and HTML parser dependencies
        run: python -m pip install 'psycopg[binary]==3.3.8' 'beautifulsoup4==4.14.3'
      - name: Validate scoped source evidence and one-URL guardrails offline
        run: |
          python -m unittest discover -v -s scripts/acquisition/__tests__ -p 'test_v7_feenway_agenz_primary_scope.py'
          python -m unittest discover -v -s scripts/acquisition/__tests__ -p 'test_v7_feenway_agenz_v3_replay.py'
      - name: Respect Agenz robots and capture at most ONE source page
        run: >-
          python scripts/acquisition/v7_multisource/feenway_agenz_v3_replay.py
          --candidates scripts/acquisition/v7_multisource/feenway_upstream_10_candidates.json
          --output primary-proof
          --approved-one
      - name: Upload only non-admissible structured observation, no raw HTML or images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feenway-agenz-primary-price-conflict-quarantine
          path: primary-proof/agenz_replay_QUARANTINE.json
          if-no-files-found: ignore
          retention-days: 1
