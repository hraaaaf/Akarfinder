name: Announcement Page L8 Market Comparables

on:
  pull_request:
    paths:
      - "lib/property-detail/market-comparables.ts"
      - "lib/property-detail/market-comparables-service.ts"
      - "lib/property-detail/market-comparables-repository.ts"
      - "lib/property-detail/announcement-page-truth-contract-v1.ts"
      - "lib/market/**"
      - "lib/market-index/**"
      - "scripts/scrapers/__tests__/announcement-page-l8-market-comparables*.test.ts"
      - ".github/workflows/announcement-page-l8-market-comparables.yml"
  push:
    branches:
      - main
      - agent/announcement-page-l8-market-comparables
    paths:
      - "lib/property-detail/market-comparables.ts"
      - "lib/property-detail/market-comparables-service.ts"
      - "lib/property-detail/market-comparables-repository.ts"
      - "lib/property-detail/announcement-page-truth-contract-v1.ts"
      - "lib/market/**"
      - "lib/market-index/**"
      - "scripts/scrapers/__tests__/announcement-page-l8-market-comparables*.test.ts"
      - ".github/workflows/announcement-page-l8-market-comparables.yml"

permissions:
  contents: read

jobs:
  market-comparables:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ANN-L8 certified comparable boundaries
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/announcement-page-l8-market-comparables.test.ts
          scripts/scrapers/__tests__/announcement-page-l8-market-comparables-service.test.ts
          scripts/scrapers/__tests__/announcement-page-l8-market-comparables-repository.test.ts
          scripts/scrapers/__tests__/announcement-page-truth-contract-v1.test.ts
          scripts/scrapers/__tests__/p10d-market.test.ts
          scripts/scrapers/__tests__/market-benchmark.test.ts
          scripts/scrapers/__tests__/market-index-read-activation.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
