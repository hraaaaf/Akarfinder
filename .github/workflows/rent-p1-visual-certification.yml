name: RENT P1 Visual Certification

on:
  push:
    branches:
      - ux/rent-p1-specialized-journey
    paths:
      - .github/workflows/rent-p1-visual-certification.yml
      - app/louer/**
      - components/intent/**
      - scripts/scrapers/__tests__/phase1-p1-intent-hubs.test.ts

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start production server
        run: |
          npm run start > /tmp/akarfinder-rent.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/louer >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/akarfinder-rent.log
          exit 1
      - name: Capture and inspect
        run: |
          mkdir -p artifacts/rent-p1
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const viewports = [
              { name: '390', width: 390, height: 844 },
              { name: '768', width: 768, height: 1024 },
              { name: '1280', width: 1280, height: 900 },
            ];
            const report = [];
            for (const viewport of viewports) {
              const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
              await page.goto('http://127.0.0.1:3000/louer', { waitUntil: 'networkidle' });
              await page.screenshot({ path: `artifacts/rent-p1/louer-${viewport.name}.png`, fullPage: true });
              const metrics = await page.evaluate(() => ({
                title: document.title,
                h1: document.querySelectorAll('h1').length,
                main: document.querySelectorAll('main').length,
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                height: document.documentElement.scrollHeight,
                duplicateIds: [...document.querySelectorAll('[id]')].map(n => n.id).filter((id, i, a) => a.indexOf(id) !== i),
                unnamedLinks: [...document.querySelectorAll('a')].filter(a => !(a.textContent || '').trim() && !a.getAttribute('aria-label')).length,
                unnamedButtons: [...document.querySelectorAll('button')].filter(b => !(b.textContent || '').trim() && !b.getAttribute('aria-label')).length,
              }));
              report.push({ viewport, ...metrics, overflow: metrics.scrollWidth - metrics.clientWidth });
              await page.close();
            }
            fs.writeFileSync('artifacts/rent-p1/report.json', JSON.stringify(report, null, 2));
            await browser.close();
            const failed = report.some(r => r.overflow > 0 || r.h1 !== 1 || r.main !== 1 || r.duplicateIds.length || r.unnamedLinks || r.unnamedButtons);
            if (failed) process.exit(1);
          })();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: rent-p1-visual-certification
          path: artifacts/rent-p1
          if-no-files-found: error
