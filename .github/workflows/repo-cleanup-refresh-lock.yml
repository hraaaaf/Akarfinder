name: Repo Cleanup Refresh Lock

on:
  push:
    branches:
      - chore/repo-cleanup-structural-2
    paths:
      - ".github/workflows/repo-cleanup-refresh-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/repo-cleanup-structural-2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove obsolete dev dependencies
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const name of ['@electric-sql/pglite', 'cheerio', 'playwright']) {
            delete p.devDependencies[name];
          }
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --exit-code && { echo "No dependency changes produced"; exit 1; } || true
          git commit -m "chore(cleanup): remove obsolete dev dependencies"
          git push origin HEAD:chore/repo-cleanup-structural-2
