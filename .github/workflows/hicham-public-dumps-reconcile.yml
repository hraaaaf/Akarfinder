name: AkarFinder - Hicham Public Dumps Reconcile

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audits/hicham-public-dumps-reconcile.py'
      - '.github/workflows/hicham-public-dumps-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HICHAM_OUT: .tmp/hicham-public-dumps-reconcile
      HICHAM_DATA_DIR: .tmp/hicham-public-dumps
      MUB_BASELINE_IDS: .tmp/mubawab-baseline/listing-ids.txt
      MUB_REB_NET_IDS: .tmp/realestatebuddy-baseline/net-new-ids.txt
      AVITO_BASELINE_IDS: .tmp/avito-baseline/union_ids.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public GitHub datasets only
        run: |
          set -euo pipefail
          mkdir -p "$HICHAM_DATA_DIR"
          base='https://raw.githubusercontent.com/HichamBenelmahi/analyse-des-tendances-immobili-res-/main/data/raw'
          for f in annonces_location_all.json annonces_ventes_mubawab.json avito_location.csv avito_vendre.csv; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 "$base/$f" -o "$HICHAM_DATA_DIR/$f"
            test -s "$HICHAM_DATA_DIR/$f"
          done
          ls -lh "$HICHAM_DATA_DIR"
      - name: Fetch certified baseline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_artifact() {
            id="$1"; out="$2"; dir="$3"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/hraaaaf/Akarfinder/actions/artifacts/$id/zip" \
              -o "$out"
            mkdir -p "$dir"
            unzip -q "$out" -d "$dir"
          }
          fetch_artifact 9969651653 .tmp/mubawab-baseline.zip .tmp/mubawab-baseline
          fetch_artifact 9991042950 .tmp/realestatebuddy-baseline.zip .tmp/realestatebuddy-baseline
          fetch_artifact 9971118875 .tmp/avito-baseline.zip .tmp/avito-baseline
          test "$(wc -l < "$MUB_BASELINE_IDS")" -eq 18445
          test "$(wc -l < "$MUB_REB_NET_IDS")" -eq 21374
          test "$(wc -l < "$AVITO_BASELINE_IDS")" -eq 19739
      - name: Reconcile Hicham public dumps against certified unions
        run: python scripts/audits/hicham-public-dumps-reconcile.py
      - name: Verify no-write contract
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.tmp/hicham-public-dumps-reconcile/summary.json'))
          assert p['readOnly'] is True
          assert p['databaseWrites'] == 0
          assert p['sourceSiteFetches'] == 0
          assert p['mubawabBaselineUnionIds'] == 39819
          assert p['avitoBaselineUnionIds'] == 19739
          print(json.dumps({k:p[k] for k in ['mubawabDumpDistinctIds','mubawabExactNetNewVsBaselineUnion','avitoDumpDistinctIds','avitoExactNetNewVsBaselineUnion','combinedExactNetNew']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hicham-public-dumps-reconcile-proof
          path: .tmp/hicham-public-dumps-reconcile/
          retention-days: 30
          if-no-files-found: error
