name: Recovery V4.11 Wave5 Strict Route Certification

on:
  push:
    branches: ["recovery/v4-11-mass-route-wave3-20260927"]
    paths:
      - "data/recovery/activate-v4-11-wave5-strict-route.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download certified inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v3" "$RUNNER_TEMP/w2" "$RUNNER_TEMP/w3" "$RUNNER_TEMP/w4" data/audits/v4-11-wave5
          gh api repos/${{ github.repository }}/actions/artifacts/10930659218/zip > "$RUNNER_TEMP/v3.zip"
          unzip -q -o "$RUNNER_TEMP/v3.zip" -d "$RUNNER_TEMP/v3"
          gh api repos/${{ github.repository }}/actions/artifacts/10927304058/zip > "$RUNNER_TEMP/w2.zip"
          unzip -q -o "$RUNNER_TEMP/w2.zip" -d "$RUNNER_TEMP/w2"
          gh api repos/${{ github.repository }}/actions/artifacts/10929247398/zip > "$RUNNER_TEMP/w3.zip"
          unzip -q -o "$RUNNER_TEMP/w3.zip" -d "$RUNNER_TEMP/w3"
          gh api repos/${{ github.repository }}/actions/artifacts/10931027229/zip > "$RUNNER_TEMP/w4.zip"
          unzip -q -o "$RUNNER_TEMP/w4.zip" -d "$RUNNER_TEMP/w4"
          echo "20f8bdff68a2bd6d445c1645f7d71b6fd0b14f419a97cc9b96fb4b5cee9361a0  $RUNNER_TEMP/v3/existence-verified-v3.jsonl" | sha256sum -c -
          echo "3aa9661a0a4e925c8732a1bbefd8b660767166026d764d207aaa02ca675f3a1b  $RUNNER_TEMP/w2/db-ready-wave2.jsonl" | sha256sum -c -
          echo "d94f3dc1982b50a4853cff996c0ac159a70cf6f0822ca69c9097701779145438  $RUNNER_TEMP/w3/db-ready-wave3.jsonl" | sha256sum -c -
          echo "e595c9b7025629c1f289f4b5898ac7ec1c540fa720f4cd0ff700292be7be607c  $RUNNER_TEMP/w4/db-ready-wave4.jsonl" | sha256sum -c -

      - name: Certify wave5
        run: |
          node scripts/recovery/certify-v4-11-wave5-strict-route-v3.mjs             --ledger "$RUNNER_TEMP/v3/existence-verified-v3.jsonl"             --wave2 "$RUNNER_TEMP/w2/db-ready-wave2.jsonl"             --wave3 "$RUNNER_TEMP/w3/db-ready-wave3.jsonl"             --wave4 "$RUNNER_TEMP/w4/db-ready-wave4.jsonl"             --output data/audits/v4-11-wave5/db-ready-wave5.jsonl             --rejected data/audits/v4-11-wave5/rejected.jsonl             --summary data/audits/v4-11-wave5/summary.json

      - name: Verify invariants
        run: |
          node - <<'NODE'
          const fs=require("fs"),crypto=require("crypto");
          const s=require("./data/audits/v4-11-wave5/summary.json");
          const b=fs.readFileSync("data/audits/v4-11-wave5/db-ready-wave5.jsonl");
          const rows=b.toString("utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const eq=(a,b,n)=>{if(a!==b)throw new Error(n+": "+a+" != "+b)};
          eq(s.db_ready_rows,1158,"rows");
          eq(rows.length,1158,"physical");
          eq(new Set(rows.map(r=>r.listing_url)).size,1158,"urls");
          eq(new Set(rows.map(r=>r.canonical_fingerprint)).size,1158,"fps");
          eq(crypto.createHash("sha256").update(b).digest("hex"),s.output_sha256,"sha");
          eq(s.approved_for_import_rows,0,"approval");
          eq(s.database_access,0,"db access");
          eq(s.database_writes,0,"db writes");
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-db-ready-wave5-strict-route-v3
          path: data/audits/v4-11-wave5/
          retention-days: 30
