name: Announcement Page L6 Vivre ici

on:
  pull_request:
    paths:
      - "app/listings/**"
      - "app/visual-qa/announcement-page-living-here/**"
      - "components/listings/AnnouncementPageShell.tsx"
      - "components/listings/LivingHereMap.tsx"
      - "components/listings/LivingHereSection.tsx"
      - "components/listings/PropertyDetailV2.tsx"
      - "lib/geo/**"
      - "scripts/audits/announcement-page-l6-living-here-visual.mjs"
      - "scripts/geo/announcement-page-l6-live-certification.ts"
      - "scripts/scrapers/__tests__/announcement-page-l6-*.test.ts"
      - ".github/workflows/announcement-page-l6-living-here.yml"
      - ".github/workflows/announcement-page-l6-live-integration.yml"
  push:
    branches:
      - main
      - agent/announcement-page-l6-vivre-ici
      - agent/announcement-page-l6-certification
    paths:
      - "app/listings/**"
      - "app/visual-qa/announcement-page-living-here/**"
      - "components/listings/AnnouncementPageShell.tsx"
      - "components/listings/LivingHereMap.tsx"
      - "components/listings/LivingHereSection.tsx"
      - "components/listings/PropertyDetailV2.tsx"
      - "lib/geo/**"
      - "scripts/audits/announcement-page-l6-living-here-visual.mjs"
      - "scripts/geo/announcement-page-l6-live-certification.ts"
      - "scripts/scrapers/__tests__/announcement-page-l6-*.test.ts"
      - ".github/workflows/announcement-page-l6-living-here.yml"
      - ".github/workflows/announcement-page-l6-live-integration.yml"

permissions:
  contents: read

jobs:
  living-here:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ANN-L6 Vivre ici contracts and historical boundaries
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/announcement-page-l6-living-here.test.ts
          scripts/scrapers/__tests__/announcement-page-l6-provider-adapters.test.ts
          scripts/scrapers/__tests__/announcement-page-l6-route-capability.test.ts
          scripts/scrapers/__tests__/announcement-page-l5-geo-foundation.test.ts
          scripts/scrapers/__tests__/announcement-page-l4-intelligence.test.ts
          scripts/scrapers/__tests__/announcement-page-l3-core.test.ts
          scripts/scrapers/__tests__/announcement-page-l2-media.test.ts
          scripts/scrapers/__tests__/announcement-page-l1-shell.test.ts
          scripts/scrapers/__tests__/ux-p1-decision-continuity.test.ts
          scripts/scrapers/__tests__/listing-detail-boundary.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start ANN-L6 production server
        shell: bash
        run: |
          npm run start -- -p 3206 > /tmp/ann-l6.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3206/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ann-l6.log
          exit 1

      - name: ANN-L6 targeted visual certification
        env:
          BASE_URL: http://127.0.0.1:3206
          AUDIT_OUTPUT_DIR: artifacts/announcement-page-l6-living-here
        run: node scripts/audits/announcement-page-l6-living-here-visual.mjs

      - name: Upload ANN-L6 visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: announcement-page-l6-living-here-${{ github.run_id }}
          path: artifacts/announcement-page-l6-living-here
          if-no-files-found: warn
          retention-days: 14
