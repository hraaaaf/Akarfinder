  recert-pii-sources:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FREEZE_JSONL_GZ: '.tmp/freeze/clean-corpus-v4.11-core.jsonl.gz'
      FETCH_DELAY_MS: '250'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regression test P8A extraction
        run: npx tsx --test scripts/scrapers/__tests__/p8a-detail.test.ts
      - name: Fetch canonical freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/freeze
          curl --fail --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10910779576/zip" -o .tmp/freeze.zip
          unzip -q .tmp/freeze.zip -d .tmp/freeze
          echo "e7ac4bca2db34ad334ed7234cfb8be93fc9baca68a9694f5024989b5cc2bb953  .tmp/freeze/clean-corpus-v4.11-core.jsonl.gz" | sha256sum -c -
      - name: Re-certify Domio PII filter
        env:
          SOURCE_NAME: 'domio.ma'
          SAMPLE_SIZE: '100'
          OUTPUT_PREFIX: 'domio-full-field-100-pii-recert'
        run: npx tsx scripts/data/github-freeze-full-field-recovery.ts
      - name: Re-certify 1immo PII filter
        env:
          SOURCE_NAME: '1immo.ma'
          SAMPLE_SIZE: '243'
          OUTPUT_PREFIX: 'oneimmo-full-field-243-pii-recert'
        run: npx tsx scripts/data/github-freeze-full-field-recovery.ts
      - name: Assert PII blocked and read-only
        run: |
          set -euo pipefail
          for f in domio-full-field-100-pii-recert.json oneimmo-full-field-243-pii-recert.json; do
            test "$(jq -r '.database_access' "$f")" = "0"
            test "$(jq -r '.database_writes' "$f")" = "0"
          done
          node - <<'NODE'
          const fs=require('fs');
          const files=['domio-full-field-100-pii-recert.jsonl','oneimmo-full-field-243-pii-recert.jsonl'];
          const pii=(value)=>{
            const s=String(value||'').replace(/\\u00a0/g,' ');
            return /\\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\\.[A-Z]{2,}\\b/i.test(s)
              || /(?<!\\d)(?:\\+?212|0)\\s*[5-7](?:[\\s.\\-]?\\d){8}(?!\\d)/i.test(s)
              || /\\b(?:t[eé]l(?:[eé]phone)?|gsm|whats\\s*app)\\s*[:\\-]?\\s*(?:\\+?212|0)?\\s*[5-7](?:[\\s.\\-]?\\d|\\.{2,}){2,}/i.test(s)
              || /(?:wa\\.me|api\\.whatsapp\\.com)/i.test(s);
          };
          let bad=0;
          for(const file of files){
            for(const line of fs.readFileSync(file,'utf8').split(/\\r?\\n/).filter(Boolean)){
              const row=JSON.parse(line);
              for(const c of row.candidates||[]){
                if(!['title','description'].includes(c.field)) continue;
                if(pii(c.value)) bad++;
              }
            }
          }
          if(bad) throw new Error('PII-bearing title/description candidates='+bad);
          console.log(JSON.stringify({pii_text_candidates:0}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: domio-full-field-100-pii-recert
          path: |
            domio-full-field-100-pii-recert.json
            domio-full-field-100-pii-recert.jsonl
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: oneimmo-full-field-243-pii-recert
          path: |
            oneimmo-full-field-243-pii-recert.json
            oneimmo-full-field-243-pii-recert.jsonl
          retention-days: 14

