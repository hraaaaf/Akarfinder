name: Neighborhood Visual P1.9 Yacoub El Mansour Contract
on:
  pull_request:
    paths:
      - "lib/contextual-illustrations/yacoub-el-mansour-neighborhood-visuals.ts"
      - "app/visual-qa/yacoub-el-mansour/**"
      - "components/search/YacoubElMansourNeighborhoodVisualQAFixture.tsx"
      - "scripts/audits/neighborhood-visual-p1-9-yacoub-el-mansour-visual-qa.mjs"
      - "scripts/scrapers/__tests__/neighborhood-visual-p1-9-yacoub-el-mansour.test.ts"
      - ".github/workflows/neighborhood-visual-p1-9-yacoub-el-mansour-contract.yml"
permissions: { contents: read }
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx tsx --test scripts/scrapers/__tests__/neighborhood-visual-p1-9-yacoub-el-mansour.test.ts
      - run: npx tsc --noEmit
      - run: npm run build
