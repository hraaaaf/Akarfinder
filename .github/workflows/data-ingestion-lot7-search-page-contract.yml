name: Data Ingestion Lot 7 Search Page Contract Gate

on:
  pull_request:
    paths:
      - "app/search/**"
      - "lib/odm/**"
      - "lib/search/**"
      - "scripts/scrapers/__tests__/data-ingestion-lot7-search-page-contract.test.ts"
      - ".github/workflows/data-ingestion-lot7-search-page-contract.yml"
  workflow_dispatch:

jobs:
  search-page-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Lot 7 Search page SSR contract
        run: node --import tsx --test scripts/scrapers/__tests__/data-ingestion-lot7-search-page-contract.test.ts
