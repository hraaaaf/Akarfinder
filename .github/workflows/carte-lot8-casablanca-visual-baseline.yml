name: Carte Lot 8 Casablanca Visual Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-casablanca-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:3205
      AUDIT_OUTPUT_DIR: data/audits/carte-lot8-casablanca-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3205 > /tmp/carte-lot8-casablanca.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3205/map?city=casablanca&district=maarif&layer=explore' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/carte-lot8-casablanca.log
          exit 1
      - name: Capture Casablanca baseline
        run: node scripts/audits/carte-lot8-casablanca-visual-baseline.mjs
      - name: Upload Casablanca baseline proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carte-lot8-casablanca-baseline-${{ github.run_id }}
          path: data/audits/carte-lot8-casablanca-baseline
          if-no-files-found: error
          retention-days: 30
