name: Common Crawl Mass Seed Harvest

# CASABLANCA-MASS-ACQUISITION-V1
# COMMONCRAWL-FIRST-ACTIVATION-V1
# COMMONCRAWL-CDX-MIME-FIX-1
# COMMONCRAWL-FAILSOFT-CANARY-V1
# DATA-40K-GATE-REHARVEST-2026-07-24-R2
# P0.1-MASS-INDEX-SOURCE-REGISTRY-OPERATIONAL-GATE
# P0.1-MINIMAL-EXTERNAL-INDEX-ACTIVATION-2026-08-23
# Historical URL-index metadata -> source_offer_seeds only -> exact freshness
# reconciliation. No WARC/page fetch, no direct source-site request, no public
# listing write. Scheduled/push activation runs apply only when the existing
# three production write gates are enabled; PR runs stay read-only.
# P0.1 makes both the harvester and importer re-read the canonical production
# Source Registry and fail closed on the exact `commoncrawl` channel.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/commoncrawl-mass-seed-harvest.yml"
      - "data/openserp/source-domain-registry.json"
      - "scripts/openserp/commoncrawl-registry-mass-harvest.ts"
      - "scripts/openserp/ingest-commoncrawl-mass-seeds.ts"
      - "scripts/openserp/p0-1-audit-commoncrawl-registry.ts"
      - "scripts/scrapers/__tests__/commoncrawl-zero-domain-patterns.test.ts"
      - "scripts/scrapers/__tests__/openserp-commoncrawl-policy-gate.test.ts"
      - "scripts/scrapers/__tests__/p0-1-minimal-external-index-policy-review.test.ts"
      - "scripts/data-mass/source-factory-m3-access-policy.ts"
      - "lib/acquisition-scale-v1/mass-index-source-policy.ts"
      - "lib/acquisition-scale-v1/mass-index-source-policy-db.ts"
      - "supabase/migrations/20260823213600_p0_1_commoncrawl_minimal_index_policy_review.sql"
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/commoncrawl-mass-seed-harvest.yml"
      - "data/openserp/source-domain-registry.json"
      - "scripts/openserp/commoncrawl-registry-mass-harvest.ts"
      - "scripts/openserp/ingest-commoncrawl-mass-seeds.ts"
      - "scripts/openserp/p0-1-audit-commoncrawl-registry.ts"
      - "scripts/scrapers/__tests__/commoncrawl-zero-domain-patterns.test.ts"
      - "scripts/scrapers/__tests__/openserp-commoncrawl-policy-gate.test.ts"
      - "scripts/scrapers/__tests__/p0-1-minimal-external-index-policy-review.test.ts"
      - "scripts/data-mass/source-factory-m3-access-policy.ts"
      - "lib/acquisition-scale-v1/mass-index-source-policy.ts"
      - "lib/acquisition-scale-v1/mass-index-source-policy-db.ts"
      - "supabase/migrations/20260823213600_p0_1_commoncrawl_minimal_index_policy_review.sql"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run or apply"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: commoncrawl-mass-seed-harvest
  cancel-in-progress: false

jobs:
  harvest-and-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout canonical workflow ref
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify P0.1 Common Crawl external-index policy gate
        run: >-
          npx tsx --test
          scripts/scrapers/__tests__/commoncrawl-zero-domain-patterns.test.ts
          scripts/scrapers/__tests__/openserp-commoncrawl-policy-gate.test.ts
          scripts/scrapers/__tests__/p0-1-minimal-external-index-policy-review.test.ts
          scripts/data-mass/__tests__/source-factory-m3-access-policy.test.ts

      - name: Read-only live Source Registry projection on PR
        if: github.event_name == 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/openserp/p0-1-audit-commoncrawl-registry.ts

      - name: Resolve write mode
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "CC_APPLY=1" >> "$GITHUB_ENV"
          elif [ "${{ inputs.mode }}" = "apply" ]; then
            echo "CC_APPLY=1" >> "$GITHUB_ENV"
          else
            echo "CC_APPLY=0" >> "$GITHUB_ENV"
          fi

      - name: Harvest policy-authorized Common Crawl canary domains first
        if: github.event_name != 'pull_request'
        env:
          COMMONCRAWL_MASS_MODE: canary
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/openserp/commoncrawl-registry-mass-harvest.ts

      - name: Import canary seeds immediately
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENSERP_AUTOMATED_INGESTION_ENABLED: ${{ secrets.OPENSERP_AUTOMATED_INGESTION_ENABLED }}
          OPENSERP_INGESTION_WRITE_ENABLED: ${{ secrets.OPENSERP_INGESTION_WRITE_ENABLED }}
          OPENSERP_INGESTION_CRON_ENABLED: ${{ secrets.OPENSERP_INGESTION_CRON_ENABLED }}
        shell: bash
        run: |
          set -e
          wc -l data/audits/raw-results/commoncrawl-registry-mass-seeds.jsonl || true
          if [ "$CC_APPLY" = "1" ]; then
            npx tsx scripts/openserp/ingest-commoncrawl-mass-seeds.ts --apply
          else
            npx tsx scripts/openserp/ingest-commoncrawl-mass-seeds.ts
          fi

      - name: Harvest remaining policy-authorized Common Crawl domains
        if: github.event_name != 'pull_request'
        env:
          COMMONCRAWL_MASS_MODE: remainder
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/openserp/commoncrawl-registry-mass-harvest.ts

      - name: Import remainder seeds and reconcile exact freshness
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENSERP_AUTOMATED_INGESTION_ENABLED: ${{ secrets.OPENSERP_AUTOMATED_INGESTION_ENABLED }}
          OPENSERP_INGESTION_WRITE_ENABLED: ${{ secrets.OPENSERP_INGESTION_WRITE_ENABLED }}
          OPENSERP_INGESTION_CRON_ENABLED: ${{ secrets.OPENSERP_INGESTION_CRON_ENABLED }}
        shell: bash
        run: |
          set -e
          wc -l data/audits/raw-results/commoncrawl-registry-mass-seeds.jsonl || true
          if [ "$CC_APPLY" = "1" ]; then
            npx tsx scripts/openserp/ingest-commoncrawl-mass-seeds.ts --apply
            npx tsx scripts/openserp/reconcile-commoncrawl-seed-freshness.ts --apply
          else
            npx tsx scripts/openserp/ingest-commoncrawl-mass-seeds.ts
            npx tsx scripts/openserp/reconcile-commoncrawl-seed-freshness.ts
          fi

      - name: Upload final harvest and P0.1 policy proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commoncrawl-registry-mass-seeds
          path: |
            data/audits/raw-results/commoncrawl-registry-mass-seeds.jsonl
            data/audits/runtime/p0-1-commoncrawl-policy-projection.json
          if-no-files-found: warn
          retention-days: 7
