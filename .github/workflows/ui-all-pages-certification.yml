name: UI All Pages Certification

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "scripts/audits/ui-all-pages-*.mjs"
      - ".github/workflows/ui-all-pages-*.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify:
    name: Chromium exhaustive all-pages certification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_URL: http://127.0.0.1:3201
      AUDIT_OUTPUT_DIR: data/audits/ui-all-pages-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Exhaustive page inventory
        env:
          AUDIT_OUTPUT_DIR: data/audits/ui-all-pages-inventory
        run: node scripts/audits/ui-all-pages-inventory.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3201 > /tmp/ui-all-pages-certification.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3201/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ui-all-pages-certification.log
          exit 1
      - name: Capture every renderable page
        run: node scripts/audits/ui-all-pages-baseline.mjs
      - name: Enforce zero unexpected findings
        run: node scripts/audits/ui-all-pages-certify.mjs
      - name: Upload exhaustive certification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-all-pages-certification-${{ github.run_id }}
          path: |
            data/audits/ui-all-pages-baseline
            data/audits/ui-all-pages-inventory/inventory.json
          if-no-files-found: error
          retention-days: 14
