name: Data Ingestion Lot 9 P0-E Denominator

on:
  pull_request:
    paths:
      - "data-ingestion/sources/mubawab/denominator-reconciliation.ts"
      - "scripts/scrapers/__tests__/data-ingestion-lot9-phase0-denominator-reconciliation.test.ts"
      - ".github/workflows/data-ingestion-lot9-phase0-denominator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  denominator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prove P0-E denominator evidence semantics
        run: npx tsx --test scripts/scrapers/__tests__/data-ingestion-lot9-phase0-denominator-reconciliation.test.ts

      # Deterministic only: no Mubawab HTTP request and no DB/prod writes.
