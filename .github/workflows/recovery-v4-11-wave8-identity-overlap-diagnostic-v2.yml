name: Recovery V4.11 Wave8 Identity Overlap Diagnostic V2

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/activate-v4-11-wave8-overlap-diagnostic-v2.txt"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate isolated target
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          python - <<'PY'
          import os,urllib.parse
          h=urllib.parse.urlparse(os.environ["DATABASE_URL"]).hostname
          allowed={
            "ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech",
          }
          if h not in allowed: raise SystemExit("refusing unexpected Neon host")
          PY
      - name: Download certified Wave8 artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w8"
          gh api repos/${{ github.repository }}/actions/artifacts/10934176431/zip > "$RUNNER_TEMP/w8.zip"
          unzip -q -o "$RUNNER_TEMP/w8.zip" -d "$RUNNER_TEMP/w8"
          echo "85e65311dba66008a02f1c145e1166db26c186029c22cfae1b3628e67074cb31  $RUNNER_TEMP/w8/db-ready-wave8.jsonl" | sha256sum -c -
      - name: Build identity CSV
        run: |
          node - "$RUNNER_TEMP/w8/db-ready-wave8.jsonl" "$RUNNER_TEMP/w8/identity.csv" <<'NODE'
          const fs=require("fs"); const [src,out]=process.argv.slice(2);
          const rows=fs.readFileSync(src,"utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
          fs.writeFileSync(out,"source_name,source_offer_key\n"+rows.map(r=>[r.source_name,r.source_offer_key].map(esc).join(",")).join("\n")+"\n");
          NODE
      - name: Extract distinct Neon identity overlaps
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/w8/diagnostic.sql" <<'SQL'
          CREATE TEMP TABLE stage_ids (source_name text NOT NULL, source_offer_key text NOT NULL);
          \copy stage_ids FROM '/w8/identity.csv' WITH (FORMAT csv, HEADER true)
          CREATE TEMP TABLE existing_identity AS
          SELECT DISTINCT
            CASE WHEN listing_url ~* 'mubawab\.ma' THEN 'mubawab.ma'
                 WHEN listing_url ~* 'avito\.ma' THEN 'avito.ma' END AS source_name,
            CASE WHEN listing_url ~* 'mubawab\.ma' THEN (regexp_match(listing_url, '/(a|pa)/([0-9]+)(/|$)'))[2]
                 WHEN listing_url ~* 'avito\.ma' THEN (regexp_match(listing_url, '_([0-9]+)\.html?$'))[1] END AS source_offer_key
          FROM public.listing_sources
          WHERE listing_url ~* '(mubawab\.ma|avito\.ma)';

          CREATE TEMP TABLE overlaps AS
          SELECT DISTINCT s.source_name,s.source_offer_key
          FROM stage_ids s JOIN existing_identity e
            ON e.source_name=s.source_name AND e.source_offer_key=s.source_offer_key
          WHERE s.source_offer_key IS NOT NULL;

          \copy overlaps TO '/w8/identity-overlaps.csv' WITH (FORMAT csv, HEADER true)
          SELECT
            (SELECT count(*) FROM stage_ids),
            (SELECT count(*) FROM overlaps),
            (SELECT count(*) FROM overlaps WHERE source_name='mubawab.ma'),
            (SELECT count(*) FROM overlaps WHERE source_name='avito.ma'),
            (SELECT count(*) FROM public.property_listings),
            (SELECT count(*) FROM public.listing_sources);
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w8:/w8" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -f /w8/diagnostic.sql' | tee "$RUNNER_TEMP/w8/diagnostic-result.txt"
          OUT="$(grep -E '^[0-9]+\|' "$RUNNER_TEMP/w8/diagnostic-result.txt" | tail -n1)"
          IFS='|' read -r STAGED OVERLAPS MUB AVITO PL LS <<< "$OUT"
          test "$STAGED" = "39132"
          test "$OVERLAPS" = "200"
          test "$PL" = "100226"
          test "$LS" = "100226"
          LINES="$(($(wc -l < "$RUNNER_TEMP/w8/identity-overlaps.csv") - 1))"
          test "$LINES" = "$OVERLAPS"
          printf '%s\n' "staged=$STAGED" "distinct_identity_overlaps=$OVERLAPS" "mubawab_overlap=$MUB" "avito_overlap=$AVITO" "pre_properties=$PL" "pre_sources=$LS" > "$RUNNER_TEMP/w8/diagnostic-verified.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: v4.11-wave8-identity-overlaps
          path: |
            ${{ runner.temp }}/w8/identity-overlaps.csv
            ${{ runner.temp }}/w8/diagnostic-verified.txt
          retention-days: 30
