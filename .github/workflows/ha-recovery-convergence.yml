name: HA Recovery Convergence

on:
  push:
    branches:
      - infra/recovery-ha-convergence-20260927
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-recovery-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-ha-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: HA state, policy and runtime writer audit
        run: >
          npx tsx --test
          scripts/scrapers/__tests__/ha-writer-state.test.ts
          scripts/scrapers/__tests__/ha-write-policy.test.ts
          scripts/scrapers/__tests__/ha-runtime-supabase-write-audit.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
