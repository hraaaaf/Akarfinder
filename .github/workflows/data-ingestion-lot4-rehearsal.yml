name: Data Ingestion Lot 4 Controlled Rehearsal

on:
  pull_request:
    paths:
      - "data-ingestion/sources/mubawab/**"
      - "data-ingestion/LOT4_STATUS.md"
      - "scripts/mubawab-pilot-rehearsal.ts"
      - "scripts/scrapers/utils/fetch-html.ts"
      - ".github/workflows/data-ingestion-lot4-rehearsal.yml"

jobs:
  pilot-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: First controlled pass
        run: npx tsx scripts/mubawab-pilot-rehearsal.ts
      - name: Resume from checkpoint
        run: npx tsx scripts/mubawab-pilot-rehearsal.ts --resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mubawab-lot4-controlled-rehearsal
          path: data-ingestion/runs/mubawab/lot4-pilot-rehearsal/
          if-no-files-found: error
