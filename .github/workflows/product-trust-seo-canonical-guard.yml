name: Product Trust SEO Canonical Guard

on:
  pull_request:
    branches: [main]
    paths:
      - "app/layout.tsx"
      - "app/page.tsx"
      - "app/search/page.tsx"
      - "scripts/__tests__/seo-canonical-guard.test.ts"
      - ".github/workflows/product-trust-seo-canonical-guard.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Latest-commit scope check
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^ HEAD > /tmp/changed.txt
          if grep -Eq '^(app/(layout|page)\.tsx$|app/search/page\.tsx$|scripts/__tests__/seo-canonical-guard\.test\.ts$)' /tmp/changed.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  certify-canonical-boundary:
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Canonical metadata regression
        run: npx tsx --test scripts/__tests__/seo-canonical-guard.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
