name: Recovery V4.11 Controlled Wave5 Neon Import

on:
  push:
    branches: ["recovery/v4-11-mass-route-wave3-20260927"]
    paths:
      - "data/recovery/v4-11-wave5-import-approval.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: recovery-v4-11-controlled-wave5-neon-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.NEON_RECOVERY_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate approval and isolated target
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          node - <<'NODE'
          const a=require("./data/recovery/v4-11-wave5-import-approval.json");
          if(a.approved!==true||a.rows!==1158||a.artifact_id!==10931655535)throw new Error("approval");
          if(a.selected_sha256!=="e64b60434771a310b37027521e81b302bd6e00541f537d171be3467a33c8fa69")throw new Error("sha");
          if(a.target_project!=="ancient-violet-43534870"||a.target_branch!=="br-cold-mouse-b2a50yaa"||a.target_database!=="AkarFinder")throw new Error("target");
          NODE
          python - <<'PY'
          import os,urllib.parse
          h=urllib.parse.urlparse(os.environ["DATABASE_URL"]).hostname
          allowed={
            "ep-falling-unit-b2hper1a.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-pooler.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j.c-6.eu-central-1.aws.neon.tech",
            "ep-falling-unit-b2hper1a-d1j-pooler.c-6.eu-central-1.aws.neon.tech",
          }
          if h not in allowed: raise SystemExit("refusing unexpected Neon host")
          PY

      - name: Download certified artifact and derive approved subset
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w5"
          gh api repos/${{ github.repository }}/actions/artifacts/10931655535/zip > "$RUNNER_TEMP/w5.zip"
          unzip -q -o "$RUNNER_TEMP/w5.zip" -d "$RUNNER_TEMP/w5"
          echo "38dd385f3c233dffce6dfce8f3f9b96d06ee763d2288ef04bed905081eb5dbe7  $RUNNER_TEMP/w5/db-ready-wave5.jsonl" | sha256sum -c -
          node - "$RUNNER_TEMP/w5/db-ready-wave5.jsonl" "$RUNNER_TEMP/w5/selected.jsonl" <<'NODE'
          const fs=require("fs");
          const [src,out]=process.argv.slice(2);
          const lines=fs.readFileSync(src,"utf8").split(/\r?\n/).filter(Boolean);
          const keep=lines.filter(x=>JSON.parse(x).source_name!=="promoimmomarrakech.com");
          if(keep.length!==1158)throw new Error("selected rows "+keep.length);
          fs.writeFileSync(out,keep.join("\n")+"\n");
          NODE
          echo "e64b60434771a310b37027521e81b302bd6e00541f537d171be3467a33c8fa69  $RUNNER_TEMP/w5/selected.jsonl" | sha256sum -c -

      - name: Build import CSV
        run: |
          node - "$RUNNER_TEMP/w5/selected.jsonl" "$RUNNER_TEMP/w5/import.csv" <<'NODE'
          const fs=require("fs");
          const [src,out]=process.argv.slice(2);
          const rows=fs.readFileSync(src,"utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const cols=["canonical_fingerprint","title","price_mad","city","district","property_type","transaction_type","surface_m2","rooms_count","bedrooms_count","bathrooms_count","description_snippet","images_count","seller_name","data_completeness_score","field_confidence","source_name","listing_url","source_url","first_seen_at","last_seen_at","source_offer_key","origin_type","compliance_status","content_fingerprint","ingestion_run_id","displayed_price","price_currency","price_period","price_status"];
          const esc=v=>{if(v===null||v===undefined)return "";const s=typeof v==="object"?JSON.stringify(v):String(v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
          if(rows.length!==1158||rows.some(r=>r.approved_for_import!==false))throw new Error("artifact invariant");
          fs.writeFileSync(out,cols.join(",")+"\n"+rows.map(r=>cols.map(c=>esc(r[c])).join(",")).join("\n")+"\n");
          NODE

      - name: Preflight
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/w5/preflight.sql" <<'SQL'
          DROP TABLE IF EXISTS stage_w5;
          CREATE TEMP TABLE stage_w5 (
            canonical_fingerprint text NOT NULL,title text NOT NULL,price_mad integer,city text NOT NULL,district text,
            property_type text NOT NULL,transaction_type text NOT NULL,surface_m2 integer,rooms_count integer,
            bedrooms_count integer,bathrooms_count integer,description_snippet text,images_count integer,seller_name text,
            data_completeness_score integer,field_confidence jsonb,source_name text NOT NULL,listing_url text NOT NULL,
            source_url text,first_seen_at timestamptz,last_seen_at timestamptz,source_offer_key text,origin_type text,
            compliance_status text,content_fingerprint text,ingestion_run_id text,displayed_price numeric,
            price_currency text,price_period text,price_status text
          );
          \copy stage_w5 FROM '/w5/import.csv' WITH (FORMAT csv, HEADER true)
          SELECT
            (SELECT count(*) FROM stage_w5),
            (SELECT count(*) FROM stage_w5 s JOIN public.listing_sources ls ON ls.listing_url=s.listing_url),
            (SELECT count(*) FROM stage_w5 s JOIN public.property_listings pl ON pl.canonical_fingerprint=s.canonical_fingerprint),
            (SELECT count(*) FROM public.property_listings),
            (SELECT count(*) FROM public.listing_sources),
            (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='clean-corpus-v4.11-wave5');
          DROP TABLE stage_w5;
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w5:/w5" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -f /w5/preflight.sql' | tee "$RUNNER_TEMP/w5/preflight.out"
          LAST="$(grep -E '^[0-9]+\|' "$RUNNER_TEMP/w5/preflight.out" | tail -n1)"
          IFS='|' read -r STAGED URL_OVERLAP FP_OVERLAP PRE_PL PRE_LS PRE_W5 <<< "$LAST"
          test "$STAGED" = "1158"
          test "$PRE_PL" = "94779"
          test "$PRE_LS" = "94779"
          test "$PRE_W5" = "0"
          test "$URL_OVERLAP" = "0"
          test "$FP_OVERLAP" = "0"

      - name: Atomic import
        run: |
          cat > "$RUNNER_TEMP/w5/import.sql" <<'SQL'
          DROP TABLE IF EXISTS stage_w5;
          BEGIN;
          CREATE TEMP TABLE stage_w5 (
            canonical_fingerprint text NOT NULL,title text NOT NULL,price_mad integer,city text NOT NULL,district text,
            property_type text NOT NULL,transaction_type text NOT NULL,surface_m2 integer,rooms_count integer,
            bedrooms_count integer,bathrooms_count integer,description_snippet text,images_count integer,seller_name text,
            data_completeness_score integer,field_confidence jsonb,source_name text NOT NULL,listing_url text NOT NULL,
            source_url text,first_seen_at timestamptz,last_seen_at timestamptz,source_offer_key text,origin_type text,
            compliance_status text,content_fingerprint text,ingestion_run_id text,displayed_price numeric,
            price_currency text,price_period text,price_status text
          ) ON COMMIT DROP;
          \copy stage_w5 FROM '/w5/import.csv' WITH (FORMAT csv, HEADER true)
          INSERT INTO public.property_listings (
            canonical_fingerprint,title,price_mad,city,district,property_type,transaction_type,surface_m2,rooms_count,
            bedrooms_count,bathrooms_count,description_snippet,images_count,seller_name,data_completeness_score,field_confidence
          )
          SELECT canonical_fingerprint,title,price_mad,city,district,property_type,transaction_type,surface_m2,rooms_count,
                 bedrooms_count,bathrooms_count,description_snippet,images_count,seller_name,data_completeness_score,field_confidence
          FROM stage_w5;
          INSERT INTO public.listing_sources (
            property_listing_id,source_name,listing_url,source_url,first_seen_at,last_seen_at,is_active,source_offer_key,
            origin_type,compliance_status,content_fingerprint,ingestion_run_id,displayed_price,price_currency,price_period,price_status
          )
          SELECT pl.id,s.source_name,s.listing_url,s.source_url,s.first_seen_at,s.last_seen_at,true,s.source_offer_key,
                 s.origin_type,s.compliance_status,s.content_fingerprint,s.ingestion_run_id,s.displayed_price,
                 s.price_currency,s.price_period,s.price_status
          FROM stage_w5 s JOIN public.property_listings pl ON pl.canonical_fingerprint=s.canonical_fingerprint;
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.property_listings) <> 95937 THEN RAISE EXCEPTION 'property total'; END IF;
            IF (SELECT count(*) FROM public.listing_sources) <> 95937 THEN RAISE EXCEPTION 'source total'; END IF;
            IF (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='clean-corpus-v4.11-wave5') <> 1158 THEN RAISE EXCEPTION 'wave5 count'; END IF;
          END $$;
          COMMIT;
          SQL
          docker run --rm -e DATABASE_URL="$DATABASE_URL" -v "$RUNNER_TEMP/w5:/w5" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f /w5/import.sql'

      - name: Readback
        run: |
          docker run --rm -e DATABASE_URL="$DATABASE_URL" postgres:17 sh -lc 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 -c "
            SELECT
              (SELECT count(*) FROM public.property_listings),
              (SELECT count(*) FROM public.listing_sources),
              (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='"'"'clean-corpus-v4.11-wave4b'"'"'),
              (SELECT count(*) FROM public.listing_sources WHERE ingestion_run_id='"'"'clean-corpus-v4.11-wave5'"'"'),
              (SELECT count(*) FROM public.listing_sources ls LEFT JOIN public.property_listings pl ON pl.id=ls.property_listing_id WHERE pl.id IS NULL);
          "'
