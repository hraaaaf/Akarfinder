name: Property Type Semantic Correction Cert

on:
  push:
    branches:
      - agent/property-type-semantic-correction

permissions:
  contents: write

jobs:
  certify-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply semantic property type correction
        run: python3 scripts/ci/property-type-semantic-correction.py
      - name: Targeted regression tests
        run: npx tsx --test scripts/scrapers/__tests__/property-type-semantic-correction.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit certified product patch and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/property-type-semantic-correction-cert.yml scripts/ci/property-type-semantic-correction.py
          git add scripts/scrapers/types.ts scripts/scrapers/normalizers/normalize-type.ts lib/listings/map-db-listing.ts lib/listings/db-listings.ts lib/db/supabase-listings.ts lib/search/database-search.ts scripts/scrapers/__tests__/property-type-semantic-correction.test.ts
          git commit -m "fix(search): preserve terrain and riad property types"
          git push origin HEAD:agent/property-type-semantic-correction
