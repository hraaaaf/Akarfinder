name: AkarFinder - Morocco Aggregator Surface Probe

on:
  push:
    branches: [main]
    paths:
      - 'scripts/acquisition/aggregator-ma-surface-probe.mjs'
      - '.github/workflows/aggregator-ma-surface-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe Mitula and Trovit public surfaces
        run: node scripts/acquisition/aggregator-ma-surface-probe.mjs
      - name: Verify read-only proof
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('data/audits/raw-results/aggregator-ma-surface-probe.json','utf8'));
          if (p.zero_db_writes !== true) throw new Error('zero_db_writes');
          if (!Array.isArray(p.targets) || p.targets.length !== 2) throw new Error('targets');
          for (const t of p.targets) if (t.direct_detail_fetches !== 0) throw new Error('detail fetch invariant');
          console.log('AGGREGATOR SURFACE PROBE: PASS');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aggregator-ma-surface-probe-proof
          path: data/audits/raw-results/aggregator-ma-surface-probe.json
          if-no-files-found: error
          retention-days: 30
