name: Mubawab district recovery

on:
  push:
    branches: [feat/mubawab-full-enumeration]
    paths:
      - 'scripts/acquisition/mubawab-district-recovery.mjs'
      - '.github/workflows/mubawab-district-recovery.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply verified district recovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/acquisition/mubawab-district-recovery.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mubawab-district-recovery
          path: artifacts/mubawab-district-recovery
          retention-days: 14
