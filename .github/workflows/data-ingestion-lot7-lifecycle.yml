name: Data Ingestion Lot 7 Lifecycle Gate

on:
  pull_request:
    paths:
      - "data-ingestion/**"
      - "lib/listings/db-listings.ts"
      - "scripts/scrapers/__tests__/data-ingestion-lot7-lifecycle.test.ts"
      - ".github/workflows/data-ingestion-lot7-lifecycle.yml"

jobs:
  lifecycle-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate lifecycle visibility through real reader
        run: node --import tsx --test scripts/scrapers/__tests__/data-ingestion-lot7-lifecycle.test.ts
