name: Product Trust Data Quality Guard

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/geo/district-matcher.ts"
      - "lib/neighborhood-context/certified-seed.ts"
      - "scripts/__tests__/product-trust-data-quality.test.ts"
      - ".github/workflows/product-trust-data-quality-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-data-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Product trust data-quality regression
        run: npx tsx --test scripts/__tests__/product-trust-data-quality.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
