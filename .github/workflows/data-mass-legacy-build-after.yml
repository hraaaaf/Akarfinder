name: DATA-MASS Legacy Scoped Build AFTER

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/data-4-9b-high-capacity-structural-detail-qualification.yml"
      - ".github/workflows/data-mass-1-reservoir-qualification.yml"
      - ".github/workflows/data-mass-2a-source-factory-engine.yml"
      - ".github/workflows/data-mass-2c-mid-yield-sources.yml"
      - ".github/workflows/data-mass-2f-final-certification.yml"
      - ".github/workflows/data-mass-legacy-build-after.yml"
      - "scripts/ci/__tests__/legacy-data-live-audit-isolation.test.mjs"
      - "scripts/data4/high-capacity-structural-detail-qualification.ts"
      - "scripts/data4/__tests__/data-4-9b-high-capacity-structural-detail-qualification.test.ts"
      - "scripts/data-mass/reservoir-qualification.ts"
      - "scripts/data-mass/source-factory*.ts"
      - "scripts/data-mass/__tests__/source-factory*.test.ts"
      - "scripts/data-mass/__tests__/reservoir-*.test.ts"
      - "scripts/audits/data-4-9b-high-capacity-structural-detail-qualification.ts"
      - "scripts/audits/data-mass-1-reservoir-qualification.ts"
      - "scripts/audits/data-mass-2a-source-factory-engine.ts"
      - "scripts/audits/data-mass-2c-mid-yield-sources.ts"
      - "scripts/audits/data-mass-2f-final-certification.ts"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enforce main-only live audit boundaries
        run: node --test scripts/ci/__tests__/legacy-data-live-audit-isolation.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Shared production build, no privileged secrets
        run: npm run build
