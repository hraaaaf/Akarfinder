name: Recovery V4.11 Reconcile Pre-DB Evidence

on:
  push:
    branches: ["recovery/v4-11-pre-db-verification-20260927"]
    paths:
      - "data/recovery/activate-v4-11-pre-db-reconcile.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download certified inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/freeze" "$RUNNER_TEMP/sarout" "$RUNNER_TEMP/maroc" "$RUNNER_TEMP/cc" data/audits/pre-db-reconciled
          gh api repos/${{ github.repository }}/actions/artifacts/10925954921/zip > "$RUNNER_TEMP/pack.zip"
          unzip -q -o "$RUNNER_TEMP/pack.zip" -d "$RUNNER_TEMP/pack"
          gh api repos/${{ github.repository }}/actions/artifacts/10869399865/zip > "$RUNNER_TEMP/freeze.zip"
          unzip -q -o "$RUNNER_TEMP/freeze.zip" -d "$RUNNER_TEMP/freeze"
          gh api repos/${{ github.repository }}/actions/artifacts/10860656848/zip > "$RUNNER_TEMP/sarout.zip"
          unzip -q -o "$RUNNER_TEMP/sarout.zip" -d "$RUNNER_TEMP/sarout"
          gh api repos/${{ github.repository }}/actions/artifacts/10860360457/zip > "$RUNNER_TEMP/maroc.zip"
          unzip -q -o "$RUNNER_TEMP/maroc.zip" -d "$RUNNER_TEMP/maroc"
          gh api repos/${{ github.repository }}/actions/artifacts/10927113307/zip > "$RUNNER_TEMP/cc.zip"
          unzip -q -o "$RUNNER_TEMP/cc.zip" -d "$RUNNER_TEMP/cc"

          test -s "$RUNNER_TEMP/pack/manifest.json"
          test -s "$RUNNER_TEMP/freeze/manifest.json"
          test -s "$RUNNER_TEMP/sarout/recovery-big-sitemap-sarout-ma.txt"
          test -s "$RUNNER_TEMP/maroc/recovery-big-sitemap-marocimmo-com.txt"
          test -s "$RUNNER_TEMP/cc/mubawab-ma.jsonl"

      - name: Reconcile all pre-DB evidence
        run: |
          node scripts/recovery/reconcile-v4-11-pre-db-evidence.mjs             --pack-dir "$RUNNER_TEMP/pack"             --freeze-dir "$RUNNER_TEMP/freeze"             --sarout-sitemap "$RUNNER_TEMP/sarout/recovery-big-sitemap-sarout-ma.txt"             --marocimmo-sitemap "$RUNNER_TEMP/maroc/recovery-big-sitemap-marocimmo-com.txt"             --mubawab-cc "$RUNNER_TEMP/cc/mubawab-ma.jsonl"             --out-dir data/audits/pre-db-reconciled

      - name: Verify reconciliation invariants
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const m=JSON.parse(fs.readFileSync("data/audits/pre-db-reconciled/manifest.json","utf8"));
          const eq=(a,b,n)=>{if(a!==b)throw new Error(n+": "+a+" != "+b)};
          eq(m.input_rows,213992,"input");
          eq(m.existence_verified_rows,163247,"existence verified");
          eq(m.unresolved_existence_rows,50745,"unresolved existence");
          eq(m.product_core4_ready_pre_identity_rows,17238,"pre-identity core4 ready");
          eq(m.db_ready_rows,0,"db ready");
          eq(m.database_access,0,"db access");
          eq(m.database_writes,0,"db writes");
          console.log(JSON.stringify(m,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-pre-db-reconciled-ledger
          path: data/audits/pre-db-reconciled/
          retention-days: 30
