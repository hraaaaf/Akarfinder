name: DATA-4.4B Promo Immo Revalidation Canary

on:
  pull_request:
    paths:
      - "scripts/data4/promoimmo-sitemap-canary.ts"
      - "scripts/data4/__tests__/promoimmo-sitemap-canary.test.ts"
      - "scripts/audits/data-4-4b-promoimmo-revalidation-canary.ts"
      - ".github/workflows/data-4-4b-promoimmo-revalidation-canary.yml"
      - "docs/data/DATA-4-4B-PROMOIMMO-REVALIDATION-CANARY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: DATA-4.4B unit tests
        run: npx tsx --test scripts/data4/__tests__/promoimmo-sitemap-canary.test.ts
      - name: DATA-4.4A regression tests
        run: npx tsx --test scripts/data4/__tests__/second-reservoir-qualification.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  live-dry-run:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATA_4_4B_OUT_DIR: .tmp/data-4-4b/results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run DATA-4.4B source revalidation dry-run
        run: npx tsx scripts/audits/data-4-4b-promoimmo-revalidation-canary.ts
      - name: Enforce proof and manifests
        shell: bash
        run: |
          set -euo pipefail
          test -s "${DATA_4_4B_OUT_DIR}/proof.json"
          test -s "${DATA_4_4B_OUT_DIR}/apply-manifest.json"
          test -s "${DATA_4_4B_OUT_DIR}/rollback-manifest.json"
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('.tmp/data-4-4b/results/proof.json','utf8'));
          const apply=JSON.parse(fs.readFileSync('.tmp/data-4-4b/results/apply-manifest.json','utf8'));
          const rollback=JSON.parse(fs.readFileSync('.tmp/data-4-4b/results/rollback-manifest.json','utf8'));
          if (p.schemaVersion!=='data-4-4b-promoimmo-revalidation-canary-v1' || p.mode!=='DRY_RUN') throw new Error(JSON.stringify(p));
          if (p.sourceDomain!=='promoimmomarrakech.com' || p.runId!=='data-4-4b-promoimmo-canary-50-v1') throw new Error(JSON.stringify(p));
          if (p.registryGate!=='PASS' || !['current','due_soon'].includes(p.registryReviewStatus)) throw new Error(JSON.stringify(p));
          if (p.declaredSitemapCount<1 || p.currentSitemapUrlCount<50 || p.sitemapIntersectionRows<50 || p.conservativeEligibleRows<50) throw new Error(JSON.stringify(p));
          if (p.canarySize!==50 || apply.length!==50 || rollback.length!==50 || p.seedSnapshotRows!==50 || p.rollbackRows!==50) throw new Error(JSON.stringify(p));
          if (p.canaryPublicSearchRows!==50 || p.canaryTechnicalDisplayRows!==50 || p.canaryTierABRows!==50) throw new Error(JSON.stringify(p));
          if (p.dedupAudit?.propertyGraphKnownMultiMemberRows!==0 || p.dedupAudit?.fuzzyMatchingUsed!==false) throw new Error(JSON.stringify(p));
          if (p.sourceRequests<2 || p.sourceRequests>40) throw new Error(JSON.stringify(p));
          if (p.databaseWrites!==0 || p.freshnessWrites!==0 || p.registryWrites!==0 || p.policyChanges!==0 || p.displayPolicyChanges!==0) throw new Error(JSON.stringify(p));
          if (p.detailPageFetches!==0 || p.contentReuseOperations!==0 || p.canaryWriteAuthorizedByThisRun!==false) throw new Error(JSON.stringify(p));
          for (const row of apply) {
            if (row.before.freshnessStatus!=='seed_only') throw new Error('non-seed canary row');
            if (row.before.freshChannels.includes('public_sitemap_presence')) throw new Error('existing sitemap channel');
            if (row.proposed.freshnessStatus!=='fresh_confirmed') throw new Error('wrong proposed freshness');
            if (!row.proposed.freshChannels.includes('public_sitemap_presence')) throw new Error('missing proposed sitemap channel');
            const marker=row.proposed.metadata?.freshness_evidence?.controlled_canary_batch;
            if (marker?.run_id!=='data-4-4b-promoimmo-canary-50-v1') throw new Error('wrong canary run id');
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: data-4-4b-promoimmo-revalidation-canary
          path: .tmp/data-4-4b/results/
          if-no-files-found: error
          retention-days: 14