name: Announcement Page L6 Live Integration

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-integration:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.ref == 'agent/announcement-page-l6-vivre-ici'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ANN-L6 low-traffic live integration certification
        env:
          LIVE_OVERPASS_ENDPOINT: https://overpass-api.de/api/interpreter
          LIVE_VALHALLA_ENDPOINT: https://valhalla1.openstreetmap.de
          LIVE_GEO_CLIENT_ID: akarfinder.ma-ann-l6-certification
          AUDIT_OUTPUT_DIR: artifacts/announcement-page-l6-live
        run: npx tsx scripts/geo/announcement-page-l6-live-certification.ts

      - name: Upload ANN-L6 live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: announcement-page-l6-live-${{ github.run_id }}
          path: artifacts/announcement-page-l6-live
          if-no-files-found: warn
          retention-days: 14
