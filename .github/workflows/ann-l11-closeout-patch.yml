name: ANN-L11 Closeout Patch

on:
  push:
    branches:
      - docs/announcement-page-l11-closeout

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply ANN-L11 roadmap closeout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/announcement-page-l11-closeout
          fetch-depth: 0
      - name: Patch roadmap and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/ANNOUNCEMENT_PAGE_ULTRA_PREMIUM_ROADMAP.md')
          s = p.read_text()
          replacements = {
            '**Version : 2026-08-16**': '**Version : 2026-08-17**',
            '**Statut : ANN-L0 ✅ CLOSED ; ANN-L1 ✅ CLOSED ; ANN-L2 ✅ CLOSED ; ANN-L3 ✅ CLOSED ; ANN-L4 ✅ CLOSED ; ANN-L5 ✅ CLOSED ; ANN-L6 ✅ CLOSED ; ANN-L7 ✅ CLOSED ; ANN-L8 ✅ CLOSED ; ANN-L9 ✅ CLOSED ; ANN-L10 ✅ CLOSED ; ANN-L11 NEXT**': '**Statut : ANN-L0 ✅ CLOSED ; ANN-L1 ✅ CLOSED ; ANN-L2 ✅ CLOSED ; ANN-L3 ✅ CLOSED ; ANN-L4 ✅ CLOSED ; ANN-L5 ✅ CLOSED ; ANN-L6 ✅ CLOSED ; ANN-L7 ✅ CLOSED ; ANN-L8 ✅ CLOSED ; ANN-L9 ✅ CLOSED ; ANN-L10 ✅ CLOSED ; ANN-L11 ✅ CLOSED ; ANN-L12 NEXT**',
            '**Progression stricte : 83 / 100 %.**': '**Progression stricte : 89 / 100 %.**',
            '### ANN-L11 — Pro & conversion — 6 %\n\nImplémentation : identité professionnelle canonique, badge commercial autorisé, visite, WhatsApp, téléphone, source originale, signalement. Dock mobile : `Demander une visite` + `WhatsApp` quand autorisé, alternatives propres sinon. Favori/compare/Mon Projet restent secondaires.\n\nGate : CTA matrix par `source_access_level`/`allowed_ctas`; aucune donnée de contact extraite/inférée.': '### ANN-L11 — Pro & conversion — 6 % — ✅ CLOSED\n\nImplémentation : identité professionnelle canonique et matrice CTA fail-closed unique consommée par desktop/mobile. Badge commercial seulement sur autorité validée ; visite/WhatsApp uniquement sur permissions explicites ; téléphone non exposé sans champ public autorisé ; source-only sans fuite contact ; Favori/Comparer/Mon Projet secondaires. Référentiel visuel AkarFinder : primary `#0B63CE`, surfaces blanches/froides, bronze limité aux accents de confiance, WhatsApp vert canal.\n\nGate CLOSED : exact head `a8bf6b300b22e9b425da22ecaba7f1b77cc1aa2a`, run `31983200516` SUCCESS, contrats + TypeScript + production build + Chromium ciblé SUCCESS, **6/6 captures + 0 finding**, artefact `9272995434`, digest `sha256:b8a9947efc62e42cbf46b97a4786d2a0b5f8d31f4d4495a1e388e04ab1ea424c`. Tous les gates transversaux du head finissent SUCCESS après rerun de deux fetchs Google Fonts externes. Score référentiel AkarFinder strict : **9,3/10 mobile** et **9,3/10 desktop**. Détails : `docs/ANNOUNCEMENT_PAGE_L11_CLOSEOUT.md`.',
            '| ANN-L11 | 6 % | NEXT | 0 % |': '| ANN-L11 | 6 % | ✅ CLOSED | 6 % |',
            '| ANN-L12 | 5 % | NOT_STARTED | 0 % |': '| ANN-L12 | 5 % | NEXT | 0 % |',
            '**Progression officielle actuelle : 83 / 100 %.**': '**Progression officielle actuelle : 89 / 100 %.**',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected roadmap fragment: {old[:90]}')
              s = s.replace(old, new, 1)
          anchor = '## 1. Vision produit\n'
          closeout = '''## 0.11 Closeout ANN-L11 — Pro & conversion ✅\n\n- **PR #769 ✅ MERGED** — merge `36bc8f086e728179b7c801f7fc54393089a7572f` ; exact head certifié `a8bf6b300b22e9b425da22ecaba7f1b77cc1aa2a`.\n- Gate dédié `Announcement Page L11 Pro Conversion`, run `31983200516` : contrats, TypeScript, production build, Chromium ciblé et artefact **SUCCESS**.\n- Artefact `9272995434`, digest `sha256:b8a9947efc62e42cbf46b97a4786d2a0b5f8d31f4d4495a1e388e04ab1ea424c` ; **6/6 captures, 0 finding**, aucun overflow, aucune erreur console/HTTP, H1=1/main=1.\n- Matrice CTA fail-closed unique : contact uniquement sur autorité/permission explicites ; source-only sans fuite WhatsApp/téléphone ; téléphone non inféré.\n- Standard AkarFinder premium verrouillé : `#0B63CE` pour Visite, deep blue, surfaces froides, bronze limité aux accents, WhatsApp vert canal.\n- Score final référentiel AkarFinder strict : **9,3/10 mobile** et **9,3/10 desktop**.\n- Deux derniers échecs transversaux étaient des fetchs Google Fonts externes ; reruns du même exact-head ensuite **SUCCESS**.\n- Preuve détaillée : `docs/ANNOUNCEMENT_PAGE_L11_CLOSEOUT.md`.\n- **Crédit officiel ANN-L11 : +6 %. Progression cumulée : 89 %. Prochain chemin critique : ANN-L12 Mon Projet personnalisé.**\n\n'''
          if anchor not in s:
              raise SystemExit('missing vision anchor')
          s = s.replace(anchor, closeout + anchor, 1)
          p.write_text(s)
          PY
          git rm .github/workflows/ann-l11-closeout-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ANNOUNCEMENT_PAGE_ULTRA_PREMIUM_ROADMAP.md
          git commit -m "docs(announcement): apply ANN-L11 roadmap closeout"
          git push origin HEAD:docs/announcement-page-l11-closeout
