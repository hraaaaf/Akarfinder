name: P0.4 Closeout V2 Temp

on:
  push:
    branches:
      - docs/p0-4-closeout-v2
    paths:
      - .github/workflows/p0-4-closeout-v2-temp.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p0-4-closeout-v2
          fetch-depth: 0
      - run: python scripts/tmp-p0-4-closeout-v2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close P0.4 on current main"
          git push origin HEAD:docs/p0-4-closeout-v2
