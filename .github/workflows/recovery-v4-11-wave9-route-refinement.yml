name: Recovery V4.11 Wave9 Route Refinement Certification

on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths:
      - "data/recovery/activate-v4-11-wave9-route-refinement.txt"

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Static check
        run: node --check scripts/recovery/certify-v4-11-wave9-route-refinement.mjs

      - name: Download immutable inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/freeze" "$RUNNER_TEMP/w6" "$RUNNER_TEMP/w8" data/audits/v4-11-wave9-route
          gh api "repos/${{ github.repository }}/actions/artifacts/10869399865/zip" > "$RUNNER_TEMP/freeze.zip"
          unzip -q -o "$RUNNER_TEMP/freeze.zip" -d "$RUNNER_TEMP/freeze"
          gh api "repos/${{ github.repository }}/actions/artifacts/10932325027/zip" > "$RUNNER_TEMP/w6.zip"
          unzip -q -o "$RUNNER_TEMP/w6.zip" -d "$RUNNER_TEMP/w6"
          gh api "repos/${{ github.repository }}/actions/artifacts/10934176431/zip" > "$RUNNER_TEMP/w8.zip"
          unzip -q -o "$RUNNER_TEMP/w8.zip" -d "$RUNNER_TEMP/w8"

      - name: Verify immutable hashes
        run: |
          set -euo pipefail
          echo "bb9799ca6a237db1de11837c7c6606809a3c669764b0c30f9cf92dcccc7adf6d  $RUNNER_TEMP/freeze/listing_representations.jsonl.gz" | sha256sum -c -
          echo "2849e79ab96ad644bde7c70ec277abb4a90be95effe53ba0726cdbccac6f8646  $RUNNER_TEMP/freeze/thin_index_search_documents.jsonl.gz" | sha256sum -c -
          echo "219b8bdfce8bd87eb049d06be42f32c0894850404f2e8d477d1f73a7b5d8cdcd  $RUNNER_TEMP/freeze/minimal_live_search_documents_v1.jsonl.gz" | sha256sum -c -
          echo "a90d0e5748adbdf881356340dcd1a37c678681ab21b62c625a570af488c8e596  $RUNNER_TEMP/freeze/listing_sources.jsonl.gz" | sha256sum -c -
          echo "0d623496d393e2adebcbe51be36a4604a006389fad09939161d979eb860e03b7  $RUNNER_TEMP/freeze/property_listings.jsonl.gz" | sha256sum -c -
          echo "63c76613ae09446afc43a887e45c0055d72840d4a262f6f5187f555f5c142539  $RUNNER_TEMP/w6/rejected.jsonl" | sha256sum -c -
          echo "85e65311dba66008a02f1c145e1166db26c186029c22cfae1b3628e67074cb31  $RUNNER_TEMP/w8/db-ready-wave8.jsonl" | sha256sum -c -
          test "$(wc -l < "$RUNNER_TEMP/w8/db-ready-wave8.jsonl")" = "39132"

      - name: Certify strict route refinement
        run: |
          node scripts/recovery/certify-v4-11-wave9-route-refinement.mjs             --wave6-rejected "$RUNNER_TEMP/w6/rejected.jsonl"             --wave8 "$RUNNER_TEMP/w8/db-ready-wave8.jsonl"             --freeze-dir "$RUNNER_TEMP/freeze"             --out-dir data/audits/v4-11-wave9-route

      - name: Verify offline contract
        run: |
          node - <<'NODE'
          const fs=require("fs"),crypto=require("crypto");
          const s=require("./data/audits/v4-11-wave9-route/summary.json");
          const b=fs.readFileSync("./data/audits/v4-11-wave9-route/db-ready-wave9.jsonl");
          const rows=b.toString("utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          if(s.schema_version!=="akarfinder-v4.11-wave9-route-refinement-20260927")throw new Error("schema");
          if(s.source_wave8_artifact_id!==10934176431||s.wave8_excluded_identities!==39132)throw new Error("input binding");
          if(rows.length!==s.db_ready_rows||rows.length<1)throw new Error("row count");
          if(new Set(rows.map(r=>r.listing_url)).size!==rows.length)throw new Error("url duplicate");
          if(new Set(rows.map(r=>r.canonical_fingerprint)).size!==rows.length)throw new Error("fp duplicate");
          if(new Set(rows.map(r=>r.source_name+"|"+r.source_offer_key)).size!==rows.length)throw new Error("identity duplicate");
          if(rows.some(r=>![r.title,r.city,r.property_type,r.transaction_type].every(v=>v!=null&&String(v).trim()!=="")))throw new Error("core gap");
          if(rows.some(r=>r.approved_for_import!==false))throw new Error("row approval");
          if(crypto.createHash("sha256").update(b).digest("hex")!==s.output_sha256)throw new Error("sha");
          if(s.approved_for_import_rows!==0||s.database_access!==0||s.database_writes!==0||s.production_neon_writes!==0||s.vercel_deployment!==false)throw new Error("safety");
          console.log(JSON.stringify(s,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-db-ready-wave9-route-refinement
          path: data/audits/v4-11-wave9-route/
          retention-days: 30
