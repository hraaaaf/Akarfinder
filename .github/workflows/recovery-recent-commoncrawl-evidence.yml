name: Recovery Recent Common Crawl Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recent-cc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RECENT_CC_DOMAINS: mubawab.ma,domio.ma,agenz.ma,avito.ma,promoimmomarrakech.com,masaken.ma,sarouty.ma,daragadir.com,mouldar.com,soukimmobilier.com,marocannonces.com
      RECENT_CC_INDEXES: CC-MAIN-2026-39,CC-MAIN-2026-34,CC-MAIN-2026-30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Recent Common Crawl metadata probe
        run: npx tsx scripts/recovery/commoncrawl-recent-evidence.ts
      - name: Safety contract
        run: |
          set -euo pipefail
          test -f data/audits/raw-results/recent-cc-recovery/manifest.json
          node -e 'const m=require("./data/audits/raw-results/recent-cc-recovery/manifest.json"); if(m.database_access!==0||m.database_writes!==0||m.source_page_fetches!==0||m.warc_downloads!==0||m.approved_for_import_rows!==0) process.exit(1)'
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-recent-cc-evidence
          path: data/audits/raw-results/recent-cc-recovery/
          retention-days: 30
