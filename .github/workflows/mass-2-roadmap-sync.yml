name: MASS-2 Roadmap Sync (temporary)

on:
  push:
    branches:
      - data/mass-2-source-factory
    paths:
      - scripts/maintenance/sync-mass-2-roadmap.mjs
      - .github/workflows/mass-2-roadmap-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/mass-2-source-factory
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synchronize MASS-2 roadmap block
        run: node scripts/maintenance/sync-mass-2-roadmap.mjs
      - name: Commit roadmap update if needed
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- docs/ROADMAP.md; then
            echo "ROADMAP already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          git commit -m "docs(roadmap): split MASS-2 Source Factory into 2A-2F"
          git push origin HEAD:data/mass-2-source-factory
