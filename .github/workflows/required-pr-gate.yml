name: Required PR Gate

# Branch protection requires the GitHub Actions check run named exactly "gate".
# Always run on PRs to main; path filters would strand unrelated PRs.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate required gate and policy contracts
        run: node --test scripts/ci/required-pr-gate.test.mjs scripts/ci/validate-workflow-efficiency.test.mjs scripts/governance/product-constitution-guard.test.mjs
      - name: Verify product constitution invariants
        run: node scripts/governance/product-constitution-guard.mjs --base-root . --candidate-root .
      - name: TypeScript
        run: npx tsc --noEmit
