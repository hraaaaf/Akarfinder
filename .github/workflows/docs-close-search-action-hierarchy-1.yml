name: Docs Close SEARCH-ACTION-HIERARCHY-1
on:
  push:
    branches: [docs/close-search-action-hierarchy-1]
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/close-search-action-hierarchy-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/audits/apply-search-action-hierarchy-1-closeout.mjs
      - run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "README.md docs/ROADMAP.md docs/SESSION.md "
          rm scripts/audits/apply-search-action-hierarchy-1-closeout.mjs
          rm .github/workflows/docs-close-search-action-hierarchy-1.yml
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "docs: close SEARCH-ACTION-HIERARCHY-1"
          git push
