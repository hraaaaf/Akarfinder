name: Carte C1B Market Zone Contract Gate

on:
  pull_request:
    paths:
      - "lib/geo/market-zone-registry.ts"
      - "scripts/scrapers/__tests__/market-zone-registry.test.ts"
      - ".github/workflows/carte-c1b-market-zone-contract.yml"

permissions:
  contents: read

jobs:
  certify-market-zone-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Market zone contract tests
        run: npx tsx --test scripts/scrapers/__tests__/market-zone-registry.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
