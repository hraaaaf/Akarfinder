name: Carte Rue Proximité BEFORE

on:
  pull_request:
    paths:
      - "scripts/audits/carte-rue-proximite-before.mjs"
      - ".github/workflows/carte-rue-proximite-before.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture-rue-before:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:3210
      AUDIT_OUTPUT_DIR: data/audits/carte-rue-proximite-before
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start -- -p 3210 > /tmp/carte-rue-before.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS 'http://127.0.0.1:3210/map?city=casablanca&district=maarif&layer=explore' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/carte-rue-before.log
          exit 1
      - name: Capture Rue proximity BEFORE
        run: node scripts/audits/carte-rue-proximite-before.mjs
      - name: Upload Rue proximity BEFORE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carte-rue-proximite-before-${{ github.run_id }}
          path: data/audits/carte-rue-proximite-before
          if-no-files-found: error
          retention-days: 30
