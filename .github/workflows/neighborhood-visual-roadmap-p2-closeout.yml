name: Neighborhood Visual Roadmap P2 Closeout

on:
  push:
    branches:
      - agent/neighborhood-visual-roadmap-p2-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neighborhood-visual-roadmap-p2-closeout
          fetch-depth: 0
      - run: python scripts/maintenance/close-neighborhood-visual-p2-roadmap.py
