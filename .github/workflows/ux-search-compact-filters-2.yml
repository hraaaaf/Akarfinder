name: UX-SEARCH-2 Compact Search Filters Certification

on:
  pull_request:
    branches: [main]
    paths:
      - "components/search/QuickFilters.tsx"
      - "components/search/SearchViewSwitcher.tsx"
      - "components/search/LightZillowSearchShell.tsx"
      - "app/search/search-density.css"
      - "scripts/audits/ux-search-compact-filters-2-visual.mjs"
      - ".github/workflows/ux-search-compact-filters-2.yml"
      - "docs/ROADMAP.md"
      - "docs/SESSION.md"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  product-design-reviewer:
    name: Product Design Reviewer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start production server
        shell: bash
        run: |
          npm run start > /tmp/ux-search-compact-2-reviewer.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ux-search-compact-2-reviewer.log
          exit 1
      - name: Assert compact controls and capture six viewports
        run: node scripts/audits/ux-search-compact-filters-2-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-search-compact-filters-2-product-design-proof
          path: |
            data/audits/ux-search-compact-filters-2
            /tmp/ux-search-compact-2-reviewer.log
          retention-days: 14
          if-no-files-found: error

  release-certifier:
    name: Independent Release Certifier
    needs: product-design-reviewer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start independent production server
        shell: bash
        run: |
          npm run start > /tmp/ux-search-compact-2-certifier.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ux-search-compact-2-certifier.log
          exit 1
      - name: Independently replay compact-controls certification
        run: node scripts/audits/ux-search-compact-filters-2-visual.mjs
      - name: Certify metrics contract
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const proof = JSON.parse(fs.readFileSync('data/audits/ux-search-compact-filters-2/metrics.json','utf8'));
          if (proof.failure) throw new Error(proof.failure);
          const byName = new Map(proof.results.map((x) => [x.name, x]));
          const expected = new Map([
            ['mobile-360x800', 2],
            ['mobile-390x844', 2],
            ['tablet-768x900', 2],
            ['desktop-1024x800', 3],
            ['desktop-1280x800', 4],
            ['desktop-1440x900', 4],
          ]);
          for (const [name, columns] of expected) {
            const result = byName.get(name);
            if (!result) throw new Error(`missing ${name}`);
            if (result.column_count !== columns || result.first_row_count !== columns) throw new Error(`${name}: density regression`);
            if (result.horizontal_overflow) throw new Error(`${name}: overflow`);
            if (!result.search_filter_same_row) throw new Error(`${name}: primary controls not aligned`);
            if ((result.quick_filters?.height ?? 999) > 56) throw new Error(`${name}: quick filters too tall`);
            if ((result.results_toolbar?.height ?? 999) > 62) throw new Error(`${name}: toolbar too tall`);
          }
          for (const name of ['mobile-360x800','mobile-390x844']) {
            const result = byName.get(name);
            if ((result.first_card_top ?? 999) > 305) throw new Error(`${name}: inventory starts too low`);
            for (const key of ['search_input','filter_trigger','mobile_view','sort_select']) {
              if ((result[key]?.height ?? 0) < 48) throw new Error(`${name}: ${key} touch target below 48px`);
            }
          }
          for (const name of ['desktop-1024x800','desktop-1280x800','desktop-1440x900']) {
            if ((byName.get(name).first_card_top ?? 999) > 270) throw new Error(`${name}: inventory starts too low`);
          }
          console.log('UX-SEARCH-2 RELEASE CERTIFIER: PASS');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-search-compact-filters-2-release-certifier-proof
          path: |
            data/audits/ux-search-compact-filters-2
            /tmp/ux-search-compact-2-certifier.log
          retention-days: 14
          if-no-files-found: error
