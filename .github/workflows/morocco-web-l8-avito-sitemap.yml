name: Morocco Web L8 Avito Full Manifest

on:
  workflow_dispatch:
  push:
    branches:
      - feat/avito-full-manifest
    paths:
      - 'scripts/acquisition/avito-supabase-shard-runner.mjs'
      - 'scripts/acquisition/__tests__/avito-supabase-shard-runner.test.mjs'
      - '.github/workflows/morocco-web-l8-avito-sitemap.yml'

permissions:
  contents: read

concurrency:
  group: morocco-web-l8-avito-full-manifest
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: node --test scripts/acquisition/__tests__/avito-supabase-shard-runner.test.mjs

      - name: Full Avito 2505-shard manifest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AVITO_MANIFEST_LIMIT: '2505'
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo 'Supabase secrets unavailable; cannot certify full Avito manifest.'
            exit 2
          fi
          node scripts/acquisition/avito-supabase-shard-runner.mjs

      - name: Verify full manifest
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('artifacts/morocco-web-l8-avito-shards/report.json', 'utf8'));
          if (report.zeroDbWrites !== true) throw new Error('full manifest must remain zero-write');
          if (report.stoppedEarly === 'http_429') throw new Error('full manifest hit HTTP 429');
          if (report.safeShardCount !== 2505) throw new Error(`safe shard manifest drifted: ${report.safeShardCount}`);
          if (report.selectedShardCount !== 2505 || report.requestCount !== 2505) throw new Error('full manifest bounds not met');
          console.log({
            sourceRows: report.sourceRowCount,
            safeShards: report.safeShardCount,
            requests: report.requestCount,
            uniqueRealEstateListingCount: report.uniqueRealEstateListingCount,
            stoppedEarly: report.stoppedEarly,
            zeroDbWrites: report.zeroDbWrites,
          });
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: morocco-web-l8-avito-full-manifest
          path: artifacts/morocco-web-l8-avito-shards/
          if-no-files-found: error
