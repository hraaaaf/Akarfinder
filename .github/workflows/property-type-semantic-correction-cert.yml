name: Property Type Semantic Correction Certification

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/odm/odm-public-canary.ts"
      - "scripts/scrapers/__tests__/property-type-semantic-correction.test.ts"
      - ".github/workflows/property-type-semantic-correction-cert.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  semantic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Terrain Riad Villa semantic regression
        run: npx tsx --test scripts/scrapers/__tests__/property-type-semantic-correction.test.ts
