name: Recovery V4.11 Wave10 Route Residue Certification
on:
  push:
    branches: ["recovery/v4-11-wave7-cc-freeze-20260927"]
    paths: ["data/recovery/activate-v4-11-wave10-route-residue.txt"]
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Download Wave9 origin-safe artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w10" data/audits/v4-11-wave10-route-residue
          gh api "repos/${{ github.repository }}/actions/artifacts/10937202447/zip" > "$RUNNER_TEMP/w10.zip"
          unzip -q "$RUNNER_TEMP/w10.zip" -d "$RUNNER_TEMP/w10"
          echo "3eb6f6faad6718694312e3ba468596c85553155a90313a8644a1070971c5e2a4  $RUNNER_TEMP/w10/db-ready-wave9-new-sources.jsonl" | sha256sum -c -
          test "$(wc -l < "$RUNNER_TEMP/w10/rejected.jsonl")" = "286"
      - name: Certify strict residue
        run: node scripts/recovery/certify-v4-11-wave10-route-residue.mjs "$RUNNER_TEMP/w10/rejected.jsonl" data/audits/v4-11-wave10-route-residue
      - name: Verify offline safety contract
        run: |
          node - <<'NODE'
          const fs=require("fs"),crypto=require("crypto"),s=require("./data/audits/v4-11-wave10-route-residue/summary.json");
          const b=fs.readFileSync("./data/audits/v4-11-wave10-route-residue/db-ready-wave10-route-residue.jsonl");
          const r=b.toString().split(/\r?\n/).filter(Boolean).map(JSON.parse);
          if(s.input_rows!==286||r.length!==s.db_ready_rows||r.length<1)throw new Error("count");
          if(new Set(r.map(x=>x.listing_url)).size!==r.length)throw new Error("url");
          if(new Set(r.map(x=>x.canonical_fingerprint)).size!==r.length)throw new Error("fp");
          if(new Set(r.map(x=>x.source_name+"|"+x.source_offer_key)).size!==r.length)throw new Error("identity");
          if(r.some(x=>![x.title,x.city,x.property_type,x.transaction_type].every(Boolean)))throw new Error("core");
          if(crypto.createHash("sha256").update(b).digest("hex")!==s.output_sha256)throw new Error("sha");
          if(s.database_access||s.database_writes||s.production_neon_writes||s.approved_for_import_rows||s.vercel_deployment!==false)throw new Error("safety");
          console.log(JSON.stringify(s,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: clean-corpus-v4.11-wave10-route-residue
          path: data/audits/v4-11-wave10-route-residue/
          retention-days: 30
