name: AkarParser V2 Offline Regression
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - scripts/acquisition/akarparser_v2.py
      - scripts/acquisition/akarparser_v2_canary.py
      - scripts/acquisition/__tests__/test_akarparser_v2.py
      - scripts/acquisition/__tests__/test_akarparser_v2_canary.py
      - .github/workflows/akarparser-v2-offline-tests.yml
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline standard-library regression suite
        run: python -Werror::ResourceWarning -m unittest discover -v -s scripts/acquisition/__tests__ -p 'test_akarparser_v2*.py'
