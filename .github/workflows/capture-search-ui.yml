name: Capture Search UI

on:
  push:
    branches:
      - chore/capture-search-ui-20260828
    paths:
      - .github/workflows/capture-search-ui.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Capture production search page at 390x844
        shell: bash
        run: |
          set -euo pipefail
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=390,844 \
            --force-device-scale-factor=1 \
            --virtual-time-budget=12000 \
            --screenshot=akarfinder-prod-casablanca-390.png \
            'https://akarfinder.vercel.app/search?city=Casablanca'
          test -s akarfinder-prod-casablanca-390.png
          file akarfinder-prod-casablanca-390.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: akarfinder-prod-casablanca-390
          path: akarfinder-prod-casablanca-390.png
          if-no-files-found: error
          retention-days: 1
