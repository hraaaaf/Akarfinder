name: P0.4 Registry Pattern Review Shadow Gate

on:
  pull_request:
    paths:
      - "lib/acquisition-scale-v1/registry-pattern-review-shadow.ts"
      - "scripts/census/p0-4-registry-pattern-review-shadow.ts"
      - "scripts/census/__tests__/p0-4-registry-pattern-review-shadow.test.ts"
      - ".github/workflows/p0-4-registry-pattern-review-shadow.yml"
  push:
    branches: [main]
    paths:
      - "lib/acquisition-scale-v1/registry-pattern-review-shadow.ts"
      - "scripts/census/p0-4-registry-pattern-review-shadow.ts"
      - "scripts/census/__tests__/p0-4-registry-pattern-review-shadow.test.ts"
      - ".github/workflows/p0-4-registry-pattern-review-shadow.yml"

permissions:
  contents: read

jobs:
  shadow-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Focused P0.4 contracts
        run: npx tsx --test scripts/census/__tests__/p0-4-registry-pattern-review-shadow.test.ts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Static safety contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'scripts/census/p0-4-registry-pattern-review-shadow.ts';
          const source = fs.readFileSync(path, 'utf8');
          for (const token of ['.insert(', '.upsert(', '.update(', '.delete(', 'data.commoncrawl.org/crawl-data']) {
            if (source.includes(token)) throw new Error(`P0.4 forbidden operation: ${token}`);
          }
          for (const required of [
            'https://index.commoncrawl.org/',
            'source_site_request: false',
            'warc_fetch: false',
            'db_mutation: false',
            'registry_mutation: false',
            'harvest: false',
            'pattern_activation: false',
            'semantic_listing_truth_claimed: false',
          ]) {
            if (!source.includes(required)) throw new Error(`P0.4 missing safety marker: ${required}`);
          }
          NODE

      - name: Live Common Crawl shadow replay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/census/p0-4-registry-pattern-review-shadow.ts

      - name: Validate P0.4 proof
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'data/audits/runtime/p0-4-registry-pattern-review-shadow.json';
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (report.schema_version !== 'p0-4-registry-pattern-review-shadow-v1') throw new Error('unexpected schema');
          if (report.target_domains !== 5) throw new Error(`expected 5 target domains, got ${report.target_domains}`);
          if (report.policy_allowed_targets !== 5 || report.policy_blocked_targets !== 0) throw new Error('P0.4 target cohort policy drifted');
          if (report.source_site_request !== false || report.warc_fetch !== false || report.db_mutation !== false || report.registry_mutation !== false || report.harvest !== false || report.pattern_activation !== false) throw new Error('P0.4 safety contract failed');
          if (report.semantic_listing_truth_claimed !== false) throw new Error('P0.4 must remain structural shadow evidence only');
          if (report.total_requests !== 15 || report.successful_requests !== 15 || report.failed_requests !== 0) throw new Error('P0.4 Common Crawl request coverage incomplete');
          if (!Array.isArray(report.rows) || report.rows.length !== 5) throw new Error('P0.4 domain replay incomplete');
          if (report.shadow_acceptable_domains + report.rejected_shadow_domains !== 5) throw new Error('P0.4 decisions incomplete');
          for (const row of report.rows) {
            if (!['SHADOW_ACCEPTABLE', 'REJECTED_SHADOW'].includes(row.decision)) throw new Error(`invalid decision for ${row.source_domain}`);
            if (row.decision === 'SHADOW_ACCEPTABLE' && (row.false_positives !== 0 || row.precision !== 1 || row.recall < 0.95)) {
              throw new Error(`unsafe SHADOW_ACCEPTABLE decision for ${row.source_domain}`);
            }
          }
          console.log(JSON.stringify({
            target_domains: report.target_domains,
            successful_requests: report.successful_requests,
            shadow_acceptable_domains: report.shadow_acceptable_domains,
            rejected_shadow_domains: report.rejected_shadow_domains,
            total_false_positives: report.total_false_positives,
            total_false_negatives: report.total_false_negatives,
            rows: report.rows.map((row) => ({ source_domain: row.source_domain, decision: row.decision, precision: row.precision, recall: row.recall, rejection_reasons: row.rejection_reasons })),
          }, null, 2));
          NODE

      - name: Upload P0.4 shadow proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-4-registry-pattern-review-shadow
          path: data/audits/runtime/p0-4-registry-pattern-review-shadow.json
          if-no-files-found: error
          retention-days: 14
