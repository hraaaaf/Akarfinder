name: SEARCH-ACTION-HIERARCHY-1 Gate

on:
  pull_request:
    paths:
      - "components/search/SearchListingCardDark.tsx"
      - "components/search/ExternalIndexedResultCard.tsx"
      - "scripts/scrapers/__tests__/search-action-hierarchy-1.test.ts"
      - "scripts/scrapers/__tests__/search-mobile-card-grid-1.test.ts"
      - ".github/workflows/search-action-hierarchy-1.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-and-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Action hierarchy contract
        run: npx tsx --test scripts/scrapers/__tests__/search-action-hierarchy-1.test.ts
      - name: Mobile grid predecessor
        run: npx tsx --test scripts/scrapers/__tests__/search-mobile-card-grid-1.test.ts
      - name: Deterministic attribution predecessor
        run: npx tsx --test scripts/scrapers/__tests__/deterministic-attribution-1.test.ts
      - name: Search truth regressions
        run: npx tsx --test scripts/scrapers/__tests__/search-truth-tier.test.ts scripts/scrapers/__tests__/search-wording-purity-1.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
