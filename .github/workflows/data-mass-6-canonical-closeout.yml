name: DATA MASS-6 Canonical Closeout
on:
  push:
    branches: [docs/mass-6-closeout]
    paths:
      - scripts/docs/closeout-data-mass-6.mjs
      - .github/workflows/data-mass-6-canonical-closeout.yml
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/mass-6-closeout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render canonical docs
        run: node scripts/docs/closeout-data-mass-6.mjs
      - name: Enforce docs-only scope and self-clean
        run: |
          git rm scripts/docs/closeout-data-mass-6.mjs .github/workflows/data-mass-6-canonical-closeout.yml
          changed=$(git status --short | awk '{print $2}' | sort)
          expected=$(printf '%s\n' README.md docs/ROADMAP.md docs/SESSION.md | sort)
          actual=$(printf '%s\n' "$changed" | grep -v '^scripts/docs/closeout-data-mass-6.mjs$' | grep -v '^.github/workflows/data-mass-6-canonical-closeout.yml$' | sort)
          test "$actual" = "$expected"
      - name: Commit closeout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/ROADMAP.md docs/SESSION.md
          git commit -am "docs: close MASS-6 canonical state"
          git push origin HEAD:docs/mass-6-closeout
