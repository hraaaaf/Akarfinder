name: ODM Document Kind Classification V1

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260731162500_odm_document_kind_classification_v1.sql'
      - 'scripts/odm-document-kind-classification-v1-contract.mjs'
      - '.github/workflows/odm-document-kind-classification-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Document kind contract
        run: node scripts/odm-document-kind-classification-v1-contract.mjs
      - name: TypeScript
        run: npm run typecheck --if-present
      - name: Production build
        run: npm run build
