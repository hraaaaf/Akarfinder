name: Carte National Neighborhood Coverage Offline Audit

on:
  pull_request:
    paths:
      - "scripts/audits/national-neighborhood-coverage.mjs"
      - "scripts/audits/verify-agadir-al-qods-pilot.mjs"
      - "scripts/audits/verify-tanger-boukhalef-source-gate.mjs"
      - "data/geo/pilot-tanger-boukhalef-evidence.json"
      - "data/geo/pilot-agadir-al-qods-evidence.json"
      - ".github/workflows/carte-national-neighborhood-coverage-audit.yml"

permissions:
  contents: read

jobs:
  offline-coverage-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static script syntax
        run: node --check scripts/audits/national-neighborhood-coverage.mjs
      - name: Decode packed national territorial registry and audit every parent
        run: node scripts/audits/national-neighborhood-coverage.mjs
      - name: Check report invariants
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const report = JSON.parse(readFileSync("data/audits/national-neighborhood-coverage/report.json", "utf8"));
          assert.equal(report.sourceLabelRows, report.validCenterRows + report.missingCenterRows + report.invalidCenterRows);
          assert.equal(report.registeredMapEligibleNeighborhoods, 17);
          assert.equal(report.registeredMapEligibleCities, 8);
          assert.equal(report.registeredCanonicalNeighborhoods, 23);
          assert(report.parentGroupCount > 0);
          assert(report.registeredCityStats.length === 8);
          assert(report.byParent.length === report.parentGroupCount);
          // V5 per-place legacy totals are a different metric than decoded N2 labels.
          assert.equal(report.sourceCountDefinitionAudit.placeDeclaredCount, 10799);
          assert.equal(report.sourceCountDefinitionAudit.legacyStaticCount, 10799);
          assert.equal(report.sourceCountDefinitionAudit.staticVsPlaceDeclarationDelta, 0);
          assert.equal(report.sourceCountDefinitionAudit.n2DecodedSourceRowCount, report.sourceLabelRows);
          assert.equal(report.sourceCountDefinitionAudit.decodedRowsVsLegacyStaticDelta, 614);
          console.log("source labels:", report.sourceLabelRows, "centered:", report.validCenterRows, "missing:", report.missingCenterRows);
          NODE
      - name: Fail-closed source review artifact contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const root = "data/audits/national-neighborhood-coverage/";
          const report = JSON.parse(readFileSync(root + "report.json", "utf8"));
          const review = JSON.parse(readFileSync(root + "centered-candidate-review.json", "utf8"));
          const exceptions = JSON.parse(readFileSync(root + "source-review-exceptions.json", "utf8"));
          assert.equal(review.candidateNameCount, 323);
          assert.equal(review.cities.length, 7);
          assert.equal(exceptions.total, 20);
          assert.equal(exceptions.rows.filter(x => x.type === "outside_candidate_city_polygon").length, 16);
          assert.equal(exceptions.rows.filter(x => x.type === "unresolved_parent").length, 4);
          assert.equal(report.reviewQueue.originalOsmFeatureIdsAvailable, false);
          for (const city of review.cities) {
            assert.equal(city.candidates.length, city.candidateNameCount);
            for (const item of city.candidates) {
              assert.equal(item.publicationEligible, false);
              assert.equal(item.originalOsmFeatureId, null);
              assert.equal(item.reviewStatus, "pending_semantic_and_source_identity_review");
              assert(item.sourcePoints.length > 0);
            }
          }
          for (const x of exceptions.rows) {
            assert.equal(x.publicationEligible, false);
            assert.equal(x.originalOsmFeatureId, null);
            assert(x.reviewStatus.startsWith("hold_"));
          }
          console.log(JSON.stringify({candidateNames: review.candidateNameCount, spatialExceptions: exceptions.total}));
          NODE
      - name: Verify first pilot source identity and coordinates (still on hold)
        run: |
          node --check scripts/audits/verify-agadir-al-qods-pilot.mjs
          node scripts/audits/verify-agadir-al-qods-pilot.mjs
      - name: Verify Boukhalef Tanger sourced point and non-equivalent gazetteer record (HOLD)
        run: |
          node --check scripts/audits/verify-tanger-boukhalef-source-gate.mjs
          node scripts/audits/verify-tanger-boukhalef-source-gate.mjs
      - name: Upload national read-only inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-neighborhood-coverage-${{ github.run_id }}
          path: data/audits/national-neighborhood-coverage/
          if-no-files-found: warn
          retention-days: 30
