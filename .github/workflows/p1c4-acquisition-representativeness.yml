name: P1C.4 Acquisition Representativeness Gate

on:
  pull_request:
    paths:
      - 'data/market/p1c4-acquisition-representativeness-policy.json'
      - 'scripts/audits/p1c4-acquisition-representativeness.ts'
      - 'scripts/scrapers/__tests__/p1c4-acquisition-representativeness.test.ts'
      - '.github/workflows/p1c4-acquisition-representativeness.yml'
      - 'docs/CARTE_ROADMAP.md'
      - 'data/market/p1c3-neighborhood-offer-activation-review-policy.json'
  push:
    branches: [main]
    paths:
      - 'data/market/p1c4-acquisition-representativeness-policy.json'
      - 'scripts/audits/p1c4-acquisition-representativeness.ts'
      - 'scripts/scrapers/__tests__/p1c4-acquisition-representativeness.test.ts'
      - '.github/workflows/p1c4-acquisition-representativeness.yml'
      - 'docs/CARTE_ROADMAP.md'
      - 'data/market/p1c3-neighborhood-offer-activation-review-policy.json'

permissions:
  contents: read

jobs:
  reviewer-p1c4-representativeness:
    name: Reviewer — P1C.4 representativeness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Static read-only and denominator boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const policy=JSON.parse(fs.readFileSync('data/market/p1c4-acquisition-representativeness-policy.json','utf8'));
          const audit=fs.readFileSync('scripts/audits/p1c4-acquisition-representativeness.ts','utf8');
          if(policy.schema_version!=='p1c4-acquisition-representativeness-policy-v1') throw new Error('P1C.4 policy schema drift');
          const s=policy.scope;
          if(s.city_slug!=='marrakech'||s.neighborhood_slug!=='gueliz'||s.transaction_type!=='rent'||s.metric_name!=='surface_m2') throw new Error('P1C.4 scope drift');
          if(policy.principles.p1c4_is_read_only!==true) throw new Error('P1C.4 read-only boundary missing');
          if(policy.principles.independent_denominator_required!==true||policy.principles.observed_sources_must_not_define_the_denominator!==true) throw new Error('P1C.4 denominator independence missing');
          if(policy.principles.no_arbitrary_numeric_market_coverage_threshold!==true) throw new Error('P1C.4 arbitrary threshold guard missing');
          if(policy.current_expected_status!=='NOT_CERTIFIABLE'||policy.current_expected_verdict!=='P1C4_REPRESENTATIVENESS_NOT_CERTIFIABLE') throw new Error('P1C.4 expected fail-closed verdict drift');
          for(const mutation of ['.insert(','.update(','.delete(','.upsert(','apply_migration','create_branch(']) if(audit.includes(mutation)) throw new Error(`P1C.4 audit must be read-only: ${mutation}`);
          NODE
          if compgen -G 'supabase/migrations/*p1c4*' > /dev/null; then
            echo 'P1C.4 is read-only; DB writes belong to a separate lot'
            exit 1
          fi

      - name: No public runtime consumer
        run: |
          if grep -R -n -E 'p1c4-acquisition-representativeness|P1C4_REPRESENTATIVENESS' app components lib --exclude-dir=node_modules; then
            echo 'P1C.4 certification must not be consumed by public runtime/UI'
            exit 1
          fi

      - name: Decision semantics
        run: npx tsx --test scripts/scrapers/__tests__/p1c4-acquisition-representativeness.test.ts

      - name: Live read-only qualification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/audits/p1c4-acquisition-representativeness.ts

      - name: Reviewer fail-closed assertions
        run: |
          node - <<'NODE'
          const r=require('./data/audits/runtime/p1c4-acquisition-representativeness.json');
          if(r.verdict!=='P1C4_REPRESENTATIVENESS_NOT_CERTIFIABLE') throw new Error(JSON.stringify(r));
          if(r.certification.status!=='NOT_CERTIFIABLE'||r.certification.revocable!==true) throw new Error('unexpected certification status');
          if(r.denominator.independent!==false||r.denominator.exact_scope!==false||r.denominator.expected_sources!==null) throw new Error('independent denominator unexpectedly asserted');
          if(r.acquisition_universe_evidence.exact_gueliz_rent_distinct_queries!==0) throw new Error('current exact-scope query evidence changed; re-review required');
          if(r.observed_cohort.listing_count!==10||r.observed_cohort.source_count!==3) throw new Error('P1C.3 candidate cohort drift; re-review required');
          if(r.metric.sample_count!==10||r.metric.reliability_level!=='moderate') throw new Error('P1C.3 metric candidate drift; re-review required');
          if(r.contract.read_only!==true||r.contract.db_mutation!==false||r.contract.public_activation!==false||r.contract.metric_layers_activated!==false||r.contract.national_activation!==false) throw new Error('P1C.4 boundary drift');
          if(r.next_boundary!=='P1C.4A Acquisition Source Universe & Denominator Design') throw new Error(`unexpected next boundary ${r.next_boundary}`);
          NODE

      - name: Roadmap handoff
        run: |
          grep -q 'P1C.3.*Activation Review.*✅ CLOSED' docs/CARTE_ROADMAP.md
          grep -q 'P1C.4.*Acquisition Representativeness Qualification.*✅ CLOSED' docs/CARTE_ROADMAP.md
          grep -q 'P1C.4A.*Acquisition Source Universe & Denominator Design.*CURRENT' docs/CARTE_ROADMAP.md

      - name: TypeScript
        run: npx tsc --noEmit

  certifier-p1c4-release:
    name: Release Certifier — P1C.4 fail-closed
    needs: reviewer-p1c4-representativeness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Independent live certification replay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/audits/p1c4-acquisition-representativeness.ts

      - name: Certify exact fail-closed boundary
        run: |
          node - <<'NODE'
          const p=require('./data/market/p1c4-acquisition-representativeness-policy.json');
          const r=require('./data/audits/runtime/p1c4-acquisition-representativeness.json');
          if(r.policy_version!==p.policy_version) throw new Error('policy/audit version mismatch');
          if(r.verdict!==p.current_expected_verdict||r.certification.status!==p.current_expected_status) throw new Error('certification verdict mismatch');
          if(r.denominator.observed_sources_are_denominator!==false||r.denominator.city_level_evidence_is_denominator!==false) throw new Error('circular denominator detected');
          if(r.contract.registry_write||r.contract.listing_write||r.contract.geo_write||r.contract.search_change||r.contract.ranking_change||r.contract.data_policy_change||r.contract.public_activation) throw new Error('P1C.4 write/runtime boundary violated');
          if(r.next_boundary!==p.next_boundary_if_not_certifiable) throw new Error('fail-closed handoff mismatch');
          console.log('P1C4_RELEASE_CERTIFIED_FAIL_CLOSED');
          NODE
