name: Neighborhood Visual P1.7 Medina Contract

on:
  pull_request:
    paths:
      - "lib/contextual-illustrations/medina-neighborhood-visuals.ts"
      - "app/visual-qa/medina/**"
      - "components/search/MedinaNeighborhoodVisualQAFixture.tsx"
      - "scripts/audits/neighborhood-visual-p1-7-medina-visual-qa.mjs"
      - "scripts/scrapers/__tests__/neighborhood-visual-p1-7-medina.test.ts"
      - "supabase/functions/neighborhood-visual-p1-7-medina-ingest/**"
      - ".github/workflows/neighborhood-visual-p1-7-medina-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx --test scripts/scrapers/__tests__/neighborhood-visual-p1-7-medina.test.ts
      - run: npx tsc --noEmit
      - run: npm run build
