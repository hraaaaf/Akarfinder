name: TEMP UX Shell White Header
on:
  push:
    branches: [ux-shell-white-header-1]
    paths:
      - '.github/workflows/tmp-ux-shell-white-header-1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-shell-white-header-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/tmp/ux-shell-white-header-1.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/layout/SiteHeader.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(ui): lock light header to white brand surface'
          git push origin HEAD:ux-shell-white-header-1
# rerun 2
