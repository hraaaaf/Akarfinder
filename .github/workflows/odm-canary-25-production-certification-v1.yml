name: ODM Canary 25 Percent Production Certification V1

on:
  pull_request:
    paths:
      - "lib/odm/odm-public-canary.ts"
      - "scripts/certify-odm-canary-25-production-v1.mjs"
      - "scripts/scrapers/__tests__/odm-canary-1percent-01.test.ts"
      - "scripts/scrapers/__tests__/odm-canary-25-production-certification-v1.test.ts"
      - ".github/workflows/odm-canary-25-production-certification-v1.yml"
      - "docs/ODM-CANARY-25-PRODUCTION-RUNBOOK.md"
  workflow_dispatch:
    inputs:
      confirm_activation:
        description: "Type CERTIFY_25_PERCENT after Vercel Production is explicitly set to 25%"
        required: true
        type: string

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate public Canary controller
        run: npx tsx --test scripts/scrapers/__tests__/odm-canary-1percent-01.test.ts
      - name: Validate 25 percent certification contract
        run: npx tsx --test scripts/scrapers/__tests__/odm-canary-25-production-certification-v1.test.ts
      - name: Validate deterministic campaign plan without Production traffic
        env:
          AKARFINDER_CERTIFICATION_DRY_RUN: "true"
        run: node scripts/certify-odm-canary-25-production-v1.mjs
      - name: Reject committed activation
        run: |
          ! grep -R "ODM_PUBLIC_CANARY_ENABLED=true" -- . ':!docs' ':!.github'
          ! grep -R "ODM_PUBLIC_CANARY_APPROVED=true" -- . ':!docs' ':!.github'
          ! grep -R "ODM_PUBLIC_CANARY_PERCENT=25" -- . ':!docs' ':!.github'
      - run: npx tsc --noEmit
      - run: npm run build

  certify-production:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_activation == 'CERTIFY_25_PERCENT'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Allow Production deployment and environment propagation to settle
        run: sleep 90
      - name: Run controlled 240-request Production campaign
        env:
          AKARFINDER_PRODUCTION_URL: https://akarfinder.vercel.app
        run: node scripts/certify-odm-canary-25-production-v1.mjs
      - name: Upload certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odm-canary-25-production-certification-v1
          path: artifacts/odm-canary-25-production-certification-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist latest evidence on audit branch
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const reportPath = "artifacts/odm-canary-25-production-certification-v1.json";
            const targetPath = "reports/odm-canary-25-production-latest.json";
            const auditBranch = "certification-results";
            let report;

            if (fs.existsSync(reportPath)) {
              report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            } else {
              report = {
                certification: "ODM_CANARY_25_PRODUCTION_CERTIFICATION_V1",
                generated_at: new Date().toISOString(),
                gates: {},
                evidence_error: "campaign_report_missing",
              };
            }

            report.evidence = {
              workflow_run_id: context.runId,
              workflow_run_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              source_commit: context.sha,
              source_ref: context.ref,
              persisted_at: new Date().toISOString(),
            };

            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: targetPath,
                ref: auditBranch,
              });
              if (!Array.isArray(existing.data)) existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: targetPath,
              branch: auditBranch,
              message: `audit(search): persist ODM 25 percent evidence from run ${context.runId}`,
              content: Buffer.from(`${JSON.stringify(report, null, 2)}\n`).toString("base64"),
              ...(existingSha ? { sha: existingSha } : {}),
            });
