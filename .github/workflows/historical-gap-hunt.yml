name: AkarFinder - Q1A DATA4.9B Sitemap Root Discovery

on:
  push:
    paths:
      - "scripts/audits/candidate-lake-q1a-data49b-sitemap-root-discovery.ts"
      - ".github/workflows/historical-gap-hunt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q1a-data49b-sitemap-root-discovery:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - domain: valfoncier.ma
            slug: valfoncier
          - domain: christiesrealestatemorocco.com
            slug: christies
          - domain: immo-maroc.com
            slug: immo-maroc
          - domain: agadirimmobilier.ma
            slug: agadirimmobilier
          - domain: proimmobilier.ma
            slug: proimmobilier
          - domain: capital-properties.ma
            slug: capital-properties
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      Q1A_DATA49B_DOMAIN: ${{ matrix.domain }}
      Q1A_DATA49B_ROOT_OUT: .tmp/candidate-lake-q1a-data49b-root-${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Discover sitemap-like URLs from Common Crawl indexes only
        run: npx tsx scripts/audits/candidate-lake-q1a-data49b-sitemap-root-discovery.ts
      - name: Verify metadata-only boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const dir=process.env.Q1A_DATA49B_ROOT_OUT;
          const p=JSON.parse(fs.readFileSync(`${dir}/summary.json`,'utf8'));
          if(p.readOnly!==true || p.databaseWrites!==0 || p.productionWrites!==0) throw new Error('write boundary violated');
          if(p.sourceSiteFetches!==0 || p.sourceContentFetches!==0 || p.warcFetches!==0) throw new Error('source/WARC boundary violated');
          if(p.commonCrawlUrlIndexRequestsOnly!==true || p.vercelDeployments!==0) throw new Error('metadata-only boundary violated');
          console.log(JSON.stringify({domain:p.domain,queryComplete:p.queryComplete,distinctSitemapLikeUrls:p.distinctSitemapLikeUrls,roots:p.roots},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-lake-q1a-data49b-root-${{ matrix.slug }}
          path: .tmp/candidate-lake-q1a-data49b-root-${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 30
