name: UX Gate 0 Contracts

on:
  pull_request:
    branches: [main, ux-ui-master-program]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  integration-fix-and-certify:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/integrate-ux-current-main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Align certified map with current truth contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/search/SearchMapPanel.tsx')
          text = path.read_text()
          text = text.replace('Atlas immobilier AkarFinder', 'Zones des résultats affichés')
          text = text.replace('const isCityActive = visualActiveCity !== "all" && pin.city.toLowerCase() === visualActiveCity.toLowerCase();', 'const isActive = visualActiveCity !== "all" && pin.city.toLowerCase() === visualActiveCity.toLowerCase();')
          text = text.replace('const style = isCityActive ? CITY_MARKER_ACTIVE : CITY_MARKER;', 'const style = isActive ? CITY_MARKER_ACTIVE : CITY_MARKER;')
          text = text.replace('const showLabelMobile = isCityActive || mobileLabels.has(cityKey);', 'const showLabelMobile = isActive || mobileLabels.has(cityKey);')
          text = text.replace('opacity: isCityActive ? 0.9 : 0.5', 'opacity: isActive ? 0.9 : 0.5')
          text = text.replace('aria-pressed={activeCity !== "all" && pin.city.toLowerCase() === activeCity.toLowerCase()}', 'aria-pressed={isActive}')
          old = 'Les cercles numérotés regroupent les fiches par ville. Les petits marqueurs verts correspondent uniquement aux coordonnées exactes certifiées des cartes visibles.'
          new = "Les nombres correspondent aux fiches indexées actuellement affichées dans cette recherche. Les petits marqueurs verts correspondent uniquement aux coordonnées exactes certifiées des cartes visibles. Cette carte n\'est pas une estimation du volume total du marché."
          text = text.replace(old, new)
          required = ['Zones des résultats affichés', 'fiches indexées actuellement affichées', "n'est pas une estimation du volume total du marché", 'aria-pressed={isActive}']
          for token in required:
              if token not in text:
                  raise SystemExit(f'Missing map truth token: {token}')
          path.write_text(text)
          PY
      - name: Persist map correction
        run: |
          git config user.name 'AkarFinder Integration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add components/search/SearchMapPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Align certified map with displayed-result truth contract'
          git push origin HEAD:${{ github.head_ref }}
      - run: npm ci
      - name: Home proof contracts
        run: npx tsx --test scripts/scrapers/__tests__/home-proof-ux.test.ts scripts/scrapers/__tests__/home-motor-purity.test.ts
      - name: User journey contracts
        run: npx tsx --test scripts/scrapers/__tests__/companion-revision-ux.test.ts scripts/scrapers/__tests__/mon-projet-workspace-ux.test.ts scripts/scrapers/__tests__/home-search-entry-orchestration-v1.test.ts
      - name: Search truth contracts
        run: npx tsx --test scripts/scrapers/__tests__/search-truth-tier.test.ts scripts/scrapers/__tests__/search-query-intent.test.ts scripts/scrapers/__tests__/typesense-ranking-parity.test.ts scripts/scrapers/__tests__/serp-gateway-first.test.ts scripts/scrapers/__tests__/search-ranking.test.ts scripts/scrapers/__tests__/public-result-similarity.test.ts scripts/scrapers/__tests__/akarinfo-passport.test.ts
      - name: UX and ODM integration contracts
        run: npx tsx --test scripts/scrapers/__tests__/ux-gate0-contracts.test.ts scripts/scrapers/__tests__/ux-search-session.test.ts scripts/scrapers/__tests__/ux-search-history.test.ts scripts/scrapers/__tests__/ux-search-view.test.ts scripts/scrapers/__tests__/ux-map-atlas.test.ts scripts/scrapers/__tests__/ux-price-explorer.test.ts scripts/scrapers/__tests__/ux-property-selection.test.ts scripts/scrapers/__tests__/ux-smart-property-card.test.ts scripts/scrapers/__tests__/ux-certified-property-map.test.ts scripts/scrapers/__tests__/ux-property-passport.test.ts scripts/scrapers/__tests__/ux-explain-ranking.test.ts scripts/scrapers/__tests__/ux-canonical-property-comparison.test.ts scripts/scrapers/__tests__/ux-neighborhood-intelligence.test.ts scripts/scrapers/__tests__/ux-certified-local-heatmap.test.ts scripts/scrapers/__tests__/ux-city-neighborhood-explorer.test.ts scripts/scrapers/__tests__/ux-certified-neighborhood-comparison.test.ts scripts/scrapers/__tests__/ux-certified-similar-neighborhoods.test.ts scripts/scrapers/__tests__/odm-09c-gateway-cursor-bridge.test.ts scripts/scrapers/__tests__/odm-09d-search-ui-cursor.test.ts scripts/scrapers/__tests__/odm-09e-lookahead-pagination.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  ux-gate0:
    if: github.head_ref != 'agent/integrate-ux-current-main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Canonical UX contracts
        run: npx tsx --test scripts/scrapers/__tests__/ux-gate0-contracts.test.ts scripts/scrapers/__tests__/ux-search-session.test.ts scripts/scrapers/__tests__/ux-search-history.test.ts scripts/scrapers/__tests__/ux-search-view.test.ts scripts/scrapers/__tests__/ux-map-atlas.test.ts scripts/scrapers/__tests__/ux-price-explorer.test.ts scripts/scrapers/__tests__/ux-property-selection.test.ts scripts/scrapers/__tests__/ux-smart-property-card.test.ts scripts/scrapers/__tests__/ux-certified-property-map.test.ts scripts/scrapers/__tests__/ux-property-passport.test.ts scripts/scrapers/__tests__/ux-explain-ranking.test.ts scripts/scrapers/__tests__/ux-canonical-property-comparison.test.ts scripts/scrapers/__tests__/ux-neighborhood-intelligence.test.ts scripts/scrapers/__tests__/ux-certified-local-heatmap.test.ts scripts/scrapers/__tests__/ux-city-neighborhood-explorer.test.ts scripts/scrapers/__tests__/ux-certified-neighborhood-comparison.test.ts scripts/scrapers/__tests__/ux-certified-similar-neighborhoods.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
