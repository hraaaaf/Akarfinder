name: Landmark Factory AUC Ain Chock Hay Hassani Vector Inspect

on:
  pull_request:
    paths:
      - ".github/workflows/landmark-factory-auc-ainchock-hayhassani-vector-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Download official AUC planning sheets
        run: |
          mkdir -p artifacts/auc-vector
          curl --fail --location --retry 3 --user-agent "Mozilla/5.0 AkarFinder-Landmark-Factory/1.0" \
            -o artifacts/auc-vector/ain-chock.pdf \
            https://www.auc.ma/wp-content/uploads/2020/05/PLANCHE-D-ENSEMBLE.pdf
          curl --fail --location --retry 3 --user-agent "Mozilla/5.0 AkarFinder-Landmark-Factory/1.0" \
            -o artifacts/auc-vector/hay-hassani.pdf \
            https://www.auc.ma/wp-content/uploads/2020/05/planches-pa-hay-hassani-5000eme.pdf

      - name: Inspect PDF structure
        run: |
          python - <<'PY'
          import json, subprocess, re
          from pathlib import Path

          docs = {
              "ain-chock": Path("artifacts/auc-vector/ain-chock.pdf"),
              "hay-hassani": Path("artifacts/auc-vector/hay-hassani.pdf"),
          }
          out = {
              "schema_version": 1,
              "evidence_role": "AUC_PLAN_VECTOR_INSPECTION_ONLY",
              "activation_allowed": False,
              "geometry_promotion_allowed": False,
              "documents": {},
              "guardrails": [
                  "Vector presence does not certify a product-neighborhood boundary.",
                  "Raster-only plans remain official graphic evidence but non-extractable for direct polygon publication.",
                  "No manual tracing, OCR polygonization, road-loop inference or synthetic closure is allowed."
              ]
          }

          for key, pdf in docs.items():
              info = subprocess.check_output(["pdfinfo", str(pdf)], text=True, errors="ignore")
              m = re.search(r"Pages:\s+(\d+)", info)
              pages = int(m.group(1)) if m else 0
              images = subprocess.check_output(["pdfimages","-list",str(pdf)], text=True, errors="ignore")
              fonts = subprocess.check_output(["pdffonts",str(pdf)], text=True, errors="ignore")
              doc = {
                  "bytes": pdf.stat().st_size,
                  "pages": pages,
                  "image_rows": max(0, len([x for x in images.splitlines() if re.match(r"\s*\d+\s+\d+\s+image\s+", x)]) ),
                  "font_rows": max(0, len([x for x in fonts.splitlines() if re.match(r"\S+\s+", x)]) - 2),
                  "sheets": [],
              }
              for p in range(1, pages+1):
                  svg = Path(f"artifacts/auc-vector/{key}-{p}.svg")
                  subprocess.run(["pdftocairo","-f",str(p),"-l",str(p),"-svg",str(pdf),str(svg)], check=True)
                  s = svg.read_text(encoding="utf-8", errors="ignore")
                  doc["sheets"].append({
                      "page": p,
                      "bytes": svg.stat().st_size,
                      "path_count": len(re.findall(r"<path\b", s)),
                      "image_count": len(re.findall(r"<image\b", s)),
                      "text_count": len(re.findall(r"<text\b", s)),
                      "dasharray_count": len(re.findall(r"stroke-dasharray", s)),
                  })
              doc["vector_sheet_count"] = sum(1 for x in doc["sheets"] if x["path_count"] > 100)
              doc["raster_only"] = doc["vector_sheet_count"] == 0
              out["documents"][key] = doc

          Path("artifacts/auc-vector/vector-summary.json").write_text(json.dumps(out, indent=2)+"\n", encoding="utf-8")
          print(json.dumps(out, indent=2))
          PY

      - name: Upload inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: landmark-factory-auc-ainchock-hayhassani-vector-inspect
          path: artifacts/auc-vector/
          if-no-files-found: error
