name: Vivre Ici Overture 3D Audit

on:
  push:
    branches:
      - spike/vivre-ici-cesium-target
    paths:
      - 'scripts/vivre-ici-overture-audit.py'
      - '.github/workflows/vivre-ici-overture-audit.yml'
      - 'data/geo/casablanca-arrondissements-osm.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Overture client
        run: pip install --disable-pip-version-check overturemaps

      - name: Audit Maârif 3D coverage
        run: python scripts/vivre-ici-overture-audit.py

      - name: Commit compact runtime bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/vivre-ici/maarif-overture-3d.compact.json
          if git diff --cached --quiet; then
            echo "Runtime bundle unchanged"
            exit 0
          fi
          git commit -m "data(vivre-ici): materialize Overture 3D bundle"
          git push

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivre-ici-overture-audit
          path: artifacts/vivre-ici-overture-audit
          if-no-files-found: error
