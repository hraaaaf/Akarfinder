name: ODM-10C2 Honest 40K Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20260727110000_odm_10c2_honest_40k_gate.sql"
      - "docs/data/ODM-10C2-HONEST-40K.md"
      - ".github/workflows/odm-10c2-honest-40k.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  certify-honest-40k-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Fail-closed contract assertions
        run: |
          grep -q "public_real_estate >= 40000" supabase/migrations/20260727110000_odm_10c2_honest_40k_gate.sql
          grep -q "leaked_noise = 0" supabase/migrations/20260727110000_odm_10c2_honest_40k_gate.sql
          grep -q "discovered_net_new" supabase/migrations/20260727110000_odm_10c2_honest_40k_gate.sql
          grep -q "admitted_net_new" supabase/migrations/20260727110000_odm_10c2_honest_40k_gate.sql
          grep -q "No robots.txt or sitemap is interpreted as a reuse licence" docs/data/ODM-10C2-HONEST-40K.md
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
